<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%230a0f1e' stroke='%2360a5fa' stroke-width='6'/><rect x='34' y='30' width='32' height='34' rx='3' fill='none' stroke='%2360a5fa' stroke-width='6'/><line x1='34' y1='42' x2='66' y2='42' stroke='%2360a5fa' stroke-width='5'/></svg>">
  <title>DataWatch — Scheduler</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0f; --surface:#111118; --surface2:#1a1a26; --border:#2a2a3a;
      --text:#e0e0e0; --muted:#666; --green:#22c55e; --green-dim:#16a34a;
      --blue:#60a5fa; --red:#ef4444; --amber:#fbbf24; --orange:#f97316; --purple:#a78bfa;
    }
    body { height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; flex-direction:column; }
    a { color:inherit; }
    header { display:flex; align-items:center; justify-content:space-between; padding:0.75rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:40; }
    .brand { font-size:0.68rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--blue); font-weight:700; }
    .brand-sub { font-size:0.55rem; letter-spacing:0.2em; color:var(--muted); margin-left:0.5rem; text-transform:uppercase; }
    .header-right { display:flex; align-items:center; gap:0.7rem; }
    .hlink { font-size:0.62rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); background:none; border:1px solid var(--border); border-radius:5px; padding:0.4rem 0.8rem; cursor:pointer; text-decoration:none; transition:.15s; }
    .hlink:hover { color:var(--text); border-color:#555; }
    .avatar { width:30px; height:30px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; color:var(--blue); }
    .tabs { display:flex; gap:0.25rem; padding:0.6rem 1.5rem 0; background:var(--surface); border-bottom:1px solid var(--border); }
    .tab { font-size:0.78rem; font-weight:600; color:var(--muted); background:none; border:none; cursor:pointer; padding:0.55rem 1rem; border-bottom:2px solid transparent; }
    .tab.active { color:var(--text); border-bottom-color:var(--blue); }
    .tab .pip { display:inline-block; min-width:16px; padding:0 4px; margin-left:0.35rem; font-size:0.62rem; background:var(--red); color:#fff; border-radius:9px; font-weight:700; }
    .toolbar { display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; padding:0.7rem 1.5rem; border-bottom:1px solid var(--border); }
    .btn { font-size:0.74rem; font-weight:600; color:var(--text); background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:0.4rem 0.7rem; cursor:pointer; transition:.15s; white-space:nowrap; }
    .btn:hover { border-color:#555; }
    .btn.primary { background:rgba(96,165,250,0.14); border-color:var(--blue); color:var(--blue); }
    .btn.ghost { background:none; }
    .btn:disabled { opacity:0.5; cursor:default; }
    .wknav { display:flex; align-items:center; gap:0.4rem; }
    .wklabel { font-size:0.82rem; font-weight:700; min-width:185px; text-align:center; }
    input[type=text], input[type=time], select { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:0.4rem 0.55rem; font-size:0.78rem; }
    input[type=time]::-webkit-calendar-picker-indicator { filter:invert(0.8); cursor:pointer; }
    .spacer { flex:1; }
    .chip-toggle { display:flex; align-items:center; gap:0.35rem; font-size:0.72rem; color:var(--muted); cursor:pointer; white-space:nowrap; }
    main { padding:0.7rem 1.5rem 1rem; flex:1; min-height:0; display:flex; flex-direction:column; overflow:auto; }
    .cap { display:flex; gap:0.45rem; flex-wrap:wrap; margin-bottom:0.5rem; }
    .cap-card { display:flex; align-items:baseline; gap:0.4rem; background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:0.28rem 0.62rem; }
    .cap-val { font-size:1.02rem; font-weight:800; line-height:1.15; }
    .cap-lbl { font-size:0.58rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); white-space:nowrap; }
    .hint { color:var(--muted); font-size:0.68rem; margin-bottom:0.45rem; }
    .board-wrap { overflow:auto; border:1px solid var(--border); border-radius:10px; flex:1 1 auto; min-height:160px; }
    table.board { border-collapse:collapse; width:100%; font-size:0.74rem; }
    table.board th, table.board td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); vertical-align:top; }
    table.board thead th { position:sticky; top:0; background:var(--surface2); z-index:5; padding:0.45rem 0.5rem; text-align:center; font-weight:700; }
    table.board thead th.weekend { color:var(--muted); } table.board thead th.today { color:var(--blue); }
    .lead-col { position:sticky; left:0; background:var(--surface); z-index:6; min-width:230px; max-width:260px; text-align:left !important; padding:0.45rem 0.6rem !important; }
    thead .lead-col { z-index:7; }
    .cell { min-width:116px; height:50px; padding:0.25rem; cursor:pointer; transition:background .1s; }
    .cell:hover { background:var(--surface2); }
    .cell.weekend { background:rgba(255,255,255,0.015); } .cell.today { box-shadow: inset 2px 0 0 var(--blue); }
    .cnt-cell { text-align:center; font-weight:700; color:var(--muted); } .cnt-cell.has { color:var(--text); }
    .site-time { font-size:0.58rem; font-weight:700; color:var(--blue); margin-top:1px; letter-spacing:-0.02em; }
    .asn { display:block; font-size:0.64rem; line-height:1.25; padding:0.1rem 0.3rem; border-radius:4px; margin-bottom:0.12rem; border-left:3px solid var(--muted); background:var(--surface2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .asn.conflict { background:rgba(239,68,68,0.18); border-left-color:var(--red); } .asn.half { opacity:0.85; font-style:italic; } .asn .cc { color:var(--muted); }
    .grp-row td { background:var(--surface2); cursor:pointer; } .grp-lead { font-weight:700; } .caret { display:inline-block; width:12px; color:var(--muted); }
    .div-badge { font-size:0.58rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; padding:0.1rem 0.4rem; border-radius:5px; border:1px solid; }
    .pill { font-size:0.58rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:0.08rem 0.4rem; border-radius:9px; }
    .pill.on-track { background:rgba(34,197,94,0.15); color:var(--green); } .pill.at-risk { background:rgba(251,191,36,0.15); color:var(--amber); }
    .pill.behind { background:rgba(239,68,68,0.15); color:var(--red); } .pill.complete { background:rgba(96,165,250,0.15); color:var(--blue); }
    .pill.no-data, .pill.not-started { background:var(--surface2); color:var(--muted); }
    .need-badge { font-size:0.56rem; font-weight:700; color:var(--red); border:1px solid var(--red); border-radius:8px; padding:0 5px; white-space:nowrap; }
    .sub-meta { font-size:0.62rem; color:var(--muted); margin-top:2px; display:flex; gap:0.35rem; align-items:center; flex-wrap:wrap; }
    .res-meta { font-size:0.6rem; color:var(--muted); display:flex; gap:0.3rem; align-items:center; flex-wrap:wrap; margin-top:0.1rem; }
    .res-load { font-size:0.58rem; padding:0.02rem 0.3rem; border-radius:8px; background:var(--surface2); border:1px solid var(--border); }
    .sup-dot { color:var(--amber); } .muted { color:var(--muted); } .warn { color:var(--red); } .ok { color:var(--green); }
    .ai-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; max-width:920px; }
    .ai-head { display:flex; align-items:center; gap:0.6rem; padding:0.7rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
    .ai-badge { font-size:0.58rem; padding:0.1rem 0.45rem; border-radius:9px; background:rgba(96,165,250,0.15); color:var(--blue); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
    .ai-body { padding:0.9rem 1rem; }
    .rec { display:flex; gap:0.6rem; padding:0.55rem 0; border-top:1px solid var(--border); align-items:flex-start; }
    .rec-dot { width:8px; height:8px; border-radius:50%; margin-top:0.35rem; flex-shrink:0; }
    .rec-meta { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); }
    .rec-issue { font-size:0.82rem; font-weight:600; margin:0.1rem 0; } .rec-action { font-size:0.8rem; color:var(--muted); }
    .reassign { display:flex; align-items:center; gap:0.5rem; font-size:0.78rem; padding:0.4rem 0; border-top:1px solid var(--border); flex-wrap:wrap; } .reassign .arrow { color:var(--blue); }
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:1rem; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:min(500px,96vw); max-height:90vh; overflow:auto; }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:0.8rem 1rem; border-bottom:1px solid var(--border); }
    .modal-body { padding:0.9rem 1rem; }
    .x { background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer; }
    label.fld { display:block; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin:0.7rem 0 0.25rem; }
    select.full, input.full { width:100%; }
    .cur-asn { display:flex; align-items:center; gap:0.5rem; padding:0.4rem 0.5rem; background:var(--surface2); border:1px solid var(--border); border-radius:6px; margin-bottom:0.35rem; font-size:0.76rem; }
    .cur-asn .grow { flex:1; min-width:0; } .mini { font-size:0.66rem; padding:0.2rem 0.45rem; }
    .seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .seg button { background:var(--surface2); border:none; color:var(--muted); font-size:0.7rem; padding:0.3rem 0.6rem; cursor:pointer; }
    .seg button.active { background:rgba(96,165,250,0.18); color:var(--blue); font-weight:700; }
    .proj { font-size:0.76rem; margin:0.5rem 0; padding:0.45rem 0.6rem; border:1px solid var(--border); border-radius:6px; background:var(--surface2); }
    .proj.ok { border-color:var(--green-dim); } .proj.warn { border-color:var(--red); }
    .pick-list { max-height:34vh; overflow:auto; margin-top:0.3rem; }
    .pick-row { display:flex; align-items:center; gap:0.5rem; padding:0.4rem 0.55rem; border:1px solid var(--border); border-radius:6px; margin-bottom:0.3rem; cursor:pointer; }
    .pick-row:hover { border-color:#555; background:var(--surface2); } .pick-row.on-this { border-color:var(--green-dim); }
    .pick-name { font-weight:600; } .pick-sub { font-size:0.64rem; color:var(--muted); } .pick-status { margin-left:auto; font-size:0.66rem; white-space:nowrap; }
    .also-dd { position:relative; }
    .also-trigger { display:flex; align-items:center; justify-content:space-between; gap:0.5rem; width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:0.45rem 0.6rem; font-size:0.78rem; cursor:pointer; }
    .also-trigger:hover { border-color:#555; } .also-caret { color:var(--muted); font-size:0.7rem; }
    .also-panel { margin-top:0.3rem; border:1px solid var(--border); border-radius:6px; background:var(--surface); padding:0.4rem; }
    .also-panel input[type=text] { width:100%; margin-bottom:0.35rem; }
    .also-list { max-height:30vh; overflow:auto; display:flex; flex-direction:column; gap:0.2rem; }
    .also-opt { display:flex; align-items:center; gap:0.5rem; padding:0.32rem 0.5rem; border:1px solid var(--border); border-radius:5px; cursor:pointer; font-size:0.76rem; }
    .also-opt:hover { border-color:#555; background:var(--surface2); }
    .also-opt.on { border-color:var(--blue); background:rgba(96,165,250,0.12); color:var(--blue); }
    .also-check { width:14px; display:inline-block; text-align:center; color:var(--blue); font-weight:800; }
    .also-chips { display:flex; flex-wrap:wrap; gap:0.3rem; } .also-chips:not(:empty) { margin-top:0.35rem; }
    .also-chip { display:inline-flex; align-items:center; gap:0.3rem; font-size:0.7rem; background:rgba(96,165,250,0.12); border:1px solid var(--blue); color:var(--blue); border-radius:12px; padding:0.15rem 0.2rem 0.15rem 0.5rem; }
    .also-chip button { background:none; border:none; color:var(--blue); cursor:pointer; font-size:0.72rem; line-height:1; padding:0 0.25rem; }
    .asn.equip { background:rgba(251,191,36,0.10); }
    .subctl-row td { background:var(--surface); }
    .subfilter-input { width:100%; max-width:232px; font-size:0.72rem; padding:0.3rem 0.5rem; }
    .subgrp-row td { background:rgba(96,165,250,0.06); cursor:pointer; font-size:0.72rem; }
    .subgrp-row:hover td { background:var(--surface2); }
    .cur-asn.equip-sub { margin-left:1rem; background:rgba(251,191,36,0.08); border-color:rgba(251,191,36,0.25); font-size:0.72rem; }
    .equip-pick { border:1px solid var(--border); border-radius:6px; background:var(--surface); padding:0.4rem; margin:0 0 0.4rem 1rem; }
    .equip-pick input[type=text] { width:100%; margin-bottom:0.35rem; }
    .empty { color:var(--muted); font-size:0.82rem; text-align:center; padding:2.5rem 1rem; }
    .loading { color:var(--muted); font-size:0.85rem; text-align:center; padding:3rem 1rem; }
    footer { padding:1rem 1.5rem; font-size:0.6rem; color:var(--muted); border-top:1px solid var(--border); }
    .toast { position:fixed; bottom:1rem; right:1rem; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:0.55rem 0.9rem; font-size:0.76rem; z-index:200; opacity:0; transition:opacity .2s; } .toast.show { opacity:1; }
  </style>
</head>
<body>
  <header>
    <div><span class="brand">DataWatch</span><span class="brand-sub">Scheduler</span></div>
    <div class="header-right"><a class="hlink" href="divisions.html">← Divisions</a><span class="avatar" id="avatar">U</span><button class="hlink" id="logoutBtn">Log out</button></div>
  </header>
  <div class="tabs">
    <button class="tab active" data-view="job" id="tab-job">By Job</button>
    <button class="tab" data-view="crew" id="tab-crew">By Crew</button>
    <button class="tab" data-view="attention" id="tab-attention">Attention</button>
    <button class="tab" data-view="ai" id="tab-ai">AI Insights</button>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <main id="main"><div class="loading">Loading master schedule…</div></main>
  <footer>© DataWatch · Force Corp · Scheduler · Cross-division resource planning</footer>
  <div class="toast" id="toast"></div>

<script>
// ── Auth ────────────────────────────────────────────────────────────────────
const token = localStorage.getItem('fct_token');
let user = null; try { user = JSON.parse(localStorage.getItem('fct_user')); } catch {}
const schedRole = user && user.divisionRoles && user.divisionRoles.scheduler;
const hasAccess = Boolean(user) && (user.isPlatformAdmin || (schedRole && schedRole !== 'no_access'));
if (!token || !user) location.replace('index.html'); else if (!hasAccess) location.replace('divisions.html');

const ASSIGN_KEY = 'fct_scheduler_assignments';
const CREWS_KEY  = 'fct_scheduler_crews';
const DIV_COLORS = { turf:'#22c55e', paving:'#60a5fa', dust:'#fbbf24', trucking:'#ef4444', quarry:'#f97316' };
const STATUS_RANK = { behind:0, 'at-risk':1, 'no-data':2, 'not-started':3, 'on-track':4, complete:5 };

const state = {
  view:'job', board:null, assignments:{}, crews:[], weekAnchor:null,
  divFilter:'all', jobSearch:'', needCrewOnly:false, jobOpen:{},
  crewSearch:'', tradeFilter:'all', showAll:false, grpCol:{},
  applySpan:'day', assignCtx:null, ai:null, aiLoading:false,
  alsoCodes:[], alsoOpen:false, siteTimes:{},
  subFilter:{}, subGrpCol:{}, equipPickFor:null,
};

// ── Helpers ─────────────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const escAttr = s => String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayStr = () => dstr(new Date());
function fmtNum(n, dp=1) { if (n == null || isNaN(n)) return '—'; const v = Number(n); return (v % 1 === 0) ? String(v) : v.toFixed(dp); }
function shortDate(ds) { return new Date(ds+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
// "06:30" → "6:30 AM" (long) / "6:30a" (compact). Empty string for blanks.
function fmtTime(hhmm) { if (!hhmm) return ''; const [h,m] = String(hhmm).split(':').map(Number); if (isNaN(h)) return ''; const ap = h<12?'AM':'PM', h12 = (h%12)||12; return h12+':'+pad(m||0)+' '+ap; }
function fmtTimeShort(hhmm) { if (!hhmm) return ''; const [h,m] = String(hhmm).split(':').map(Number); if (isNaN(h)) return ''; const ap = h<12?'a':'p', h12 = (h%12)||12; return h12+(m?':'+pad(m):'')+ap; }
function addDays(ds, n) { const d = new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return dstr(d); }
function daysBetween(a, b) { return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000); }
function mondayOf(d) { const x = new Date(d); const dow = x.getDay(); x.setDate(x.getDate() + (dow === 0 ? -6 : 1 - dow)); x.setHours(0,0,0,0); return x; }
function weekDays() { const out = []; const m = new Date(state.weekAnchor); for (let i=0;i<7;i++){ const d = new Date(m); d.setDate(m.getDate()+i); out.push(d);} return out; }
function weekDateStrs() { return weekDays().map(dstr); }
function divColor(div) { return DIV_COLORS[div] || '#888'; }
// Time-off (from Timesheet): returns {status,type} if this person is off this date, else null.
function isOff(name, date) { return (state.board.timeOff && state.board.timeOff[name] && state.board.timeOff[name][date]) || null; }
const _clientTag = 'c' + Math.random().toString(36).slice(2, 7); // per-client tag so ids never collide across schedulers
let _uid = 0;
function uid() { return _clientTag + (++_uid).toString(36); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1900); }
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type':'application/json', Authorization:'Bearer '+token, ...(opts.headers||{}) } });
  if (res.status === 401) { location.replace('index.html'); throw new Error('Unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Error '+res.status) + (data.detail ? ': '+data.detail : ''));
  return data;
}

// ── Load / save ─────────────────────────────────────────────────────────────
async function loadAll() {
  try {
    const [board, asn, crews] = await Promise.all([
      api('/api/scheduler/board?today=' + todayStr()),
      api('/api/data/' + ASSIGN_KEY).catch(() => ({ value:null })),
      api('/api/data/' + CREWS_KEY).catch(() => ({ value:null })),
    ]);
    state.board = board;
    const v = asn && asn.value;
    state.assignments = (v && typeof v === 'object' && v.assignments) ? v.assignments : {};
    state.siteTimes = (v && typeof v === 'object' && v.siteTimes && typeof v.siteTimes === 'object') ? v.siteTimes : {};
    const c = crews && crews.value;
    state.crews = (c && Array.isArray(c.crews)) ? c.crews : [];
    _baseline = JSON.stringify(state.assignments);
    _baselineTimes = JSON.stringify(state.siteTimes);

    // Recover edits that were cached locally but never confirmed saved to the
    // server (a save that was slow/dropped/failed before the last reload).
    const local = _readLocal();
    if (local && local.synced === false) {
      const serverStr = _snap();
      const recovered = _recoverAdds(state.assignments, local.assignments || {});
      if (JSON.stringify(recovered) !== serverStr) { state.assignments = recovered; _dirtyAssign = true; }
      const recoveredTimes = _recoverTimes(state.siteTimes, local.siteTimes || {});
      if (JSON.stringify(recoveredTimes) !== JSON.stringify(state.siteTimes)) { state.siteTimes = recoveredTimes; _dirtyAssign = true; }
      if (Array.isArray(local.crews) && local.crews.length && !state.crews.length) { state.crews = local.crews; _dirtyCrews = true; }
      if (_dirtyAssign || _dirtyCrews) { toast('Restored unsaved changes — saving…'); _scheduleFlush(); }
    }
    _writeLocal(!(_dirtyAssign || _dirtyCrews));

    if (!state.weekAnchor) state.weekAnchor = mondayOf(new Date());
    render();
    setSaveStatus(_dirtyAssign || _dirtyCrews ? 'pending' : 'saved');
  } catch (err) {
    document.getElementById('main').innerHTML = '<div class="empty">Could not load the schedule.<br><span class="muted">' + esc(err.message) + '</span></div>';
  }
}
// Persistence: baseline + merge-on-save + undo/redo. Saves are debounced;
// before each write we re-read the server copy and merge by assignment id so
// two schedulers editing at once don't clobber each other. On tab hide/close
// we force-flush (keepalive) so in-progress edits aren't lost.
let _baseline = '{}', _baselineTimes = '{}';
let _undo = [], _redo = [];
let _saveTimer = null, _dirtyAssign = false, _dirtyCrews = false, _flushing = false;

function _snap() { return JSON.stringify(state.assignments); }
function pushUndo() { _undo.push(_snap()); if (_undo.length > 50) _undo.shift(); _redo = []; updateUndoButtons(); }
function updateUndoButtons() { const u=document.getElementById('undoBtn'), r=document.getElementById('redoBtn'); if (u) u.disabled = !_undo.length; if (r) r.disabled = !_redo.length; }
function undo() { if (!_undo.length) return; _redo.push(_snap()); state.assignments = JSON.parse(_undo.pop()); if (state.assignCtx) closeAssign(); _dirtyAssign = true; _scheduleFlush(); render(); }
function redo() { if (!_redo.length) return; _undo.push(_snap()); state.assignments = JSON.parse(_redo.pop()); if (state.assignCtx) closeAssign(); _dirtyAssign = true; _scheduleFlush(); render(); }
function _scheduleFlush() { _writeLocal(false); if (_saveState !== 'saving') setSaveStatus('pending'); clearTimeout(_saveTimer); _saveTimer = setTimeout(() => flushSaves(false), 500); }

async function _getVal(key) { try { const r = await api('/api/data/' + key); return r && r.value; } catch { return null; } }

}
function _flat(a) { const m={}; for (const d in a) for (const x of (a[d]||[])) m[x.id] = { ...x, _d:d }; return m; }
function _unflat(m) { const o={}; for (const id in m) { const { _d, ...rest } = m[id]; (o[_d] = o[_d] || []).push(rest); } return o; }
// Site times flatten to "date jobKey" -> "HH:MM" so they merge like assignments.
function _flatTimes(st) { const m={}; for (const d in st) for (const k in (st[d]||{})) m[d+' '+k] = st[d][k]; return m; }

function mergeSiteTimes(baseStr, ours, theirs) {

  for (const k in o) if (!(k in b)) res[k] = o[k];                                  // we set

  for (const id in o) if (!(id in b)) res[id] = o[id];                                                   // we added
  for (const id in b) if (!(id in o)) delete res[id];                                                    // we removed

}
async function flushSaves(keepalive) {

    // so if the tab comes back (or the keepalive was dropped) we still flush;
    // the local cache stays unsynced until a real success confirms the write.
    if (_dirtyAssign) _putKey(ASSIGN_KEY, { version:1, assignments: state.assignments, siteTimes: state.siteTimes }, true).catch(()=>{});
    if (_dirtyCrews)  _putKey(CREWS_KEY,  { version:1, crews: state.crews }, true).catch(()=>{});
    return;
  }
  if (_flushing) { _scheduleFlush(); return; }
  if (!_dirtyAssign && !_dirtyCrews) return;
  _flushing = true; setSaveStatus('saving');

    if (_dirtyAssign) {
      const sv = await _getVal(ASSIGN_KEY);
      const theirs = (sv && sv.assignments) || {};
      const theirsTimes = (sv && sv.siteTimes) || {};
      let merged = false;
      if (JSON.stringify(theirs) !== _baseline) { state.assignments = mergeAssignments(_baseline, state.assignments, theirs); merged = true; }
      if (JSON.stringify(theirsTimes) !== _baselineTimes) { state.siteTimes = mergeSiteTimes(_baselineTimes, state.siteTimes, theirsTimes); merged = true; }
      if (merged) { toast('Merged another scheduler’s changes'); render(); }
      await _putKey(ASSIGN_KEY, { version:1, assignments: state.assignments, siteTimes: state.siteTimes }, false);
      _baseline = _snap(); _baselineTimes = JSON.stringify(state.siteTimes); _dirtyAssign = false;
    }
    if (_dirtyCrews) { await _putKey(CREWS_KEY, { version:1, crews: state.crews }, false); _dirtyCrews = false; }
    _writeLocal(true); _retryDelay = 0; clearTimeout(_retryTimer); setSaveStatus('saved');

    _writeLocal(false); setSaveStatus('error'); _scheduleRetry(err);
  } finally { _flushing = false; }
}
async function refreshData() {
  try {
    const [board, sv] = await Promise.all([ api('/api/scheduler/board?today=' + todayStr()), _getVal(ASSIGN_KEY) ]);
    state.board = board;
    const theirs = (sv && sv.assignments) || {};
    const theirsTimes = (sv && sv.siteTimes) || {};
    state.assignments = (_dirtyAssign || _snap() !== _baseline) ? mergeAssignments(_baseline, state.assignments, theirs) : theirs;
    state.siteTimes = (_dirtyAssign || JSON.stringify(state.siteTimes) !== _baselineTimes) ? mergeSiteTimes(_baselineTimes, state.siteTimes, theirsTimes) : theirsTimes;
    _baseline = JSON.stringify(theirs);
    _baselineTimes = JSON.stringify(theirsTimes);
    _writeLocal(!(_dirtyAssign || _dirtyCrews));
    render(); toast('Refreshed');
    if (_dirtyAssign || _dirtyCrews) { setSaveStatus('pending'); _scheduleFlush(); } else setSaveStatus('saved');

}
document.addEventListener('visibilitychange', () => {

});
window.addEventListener('pagehide', () => flushSaves(true));
window.addEventListener('online', () => { if (_dirtyAssign || _dirtyCrews) flushSaves(false); });

// ── Assignment model ────────────────────────────────────────────────────────
function dayList(date) { return state.assignments[date] || (state.assignments[date] = []); }
function assignmentsFor(date, resource) { return (state.assignments[date] || []).filter(a => a.resource === resource); }
function jobAssignmentsOnDate(date, division, jobId) { return (state.assignments[date] || []).filter(a => a.division === division && a.jobId === jobId); }
function cellAssignments(date, division, jobId, costCode, subCode) {
  return (state.assignments[date] || []).filter(a => a.division === division && a.jobId === jobId && (a.costCode||'') === (costCode||'') && (a.subCode||'') === (subCode||''));
}
function addAssignment(date, resource, kind, job, sc) {
  dayList(date).push({ id: uid(), resource, kind, division: job.division, jobId: job.id, jobName: job.name, costCode: sc?sc.costCode:'', subCode: sc?sc.subCode:'', half:false }); saveAssignments();
}
// Add a resource across several dates (bulk); returns how many were added.
function addAssignmentSpan(resource, kind, job, sc, dates) {
  let added = 0; const cc = sc?sc.costCode:'', sk = sc?sc.subCode:'';
  dates.forEach(d => { if (cellAssignments(d, job.division, job.id, cc, sk).some(a => a.resource === resource)) return;
    dayList(d).push({ id: uid(), resource, kind, division: job.division, jobId: job.id, jobName: job.name, costCode: cc, subCode: sk, half:false }); added++; });
  if (added) saveAssignments(); return added;
}
function removeAssignment(date, id) { if ((state.assignments[date]||[]).some(a => a.id === id)) pushUndo(); state.assignments[date] = (state.assignments[date] || []).filter(a => a.id !== id); if (!state.assignments[date].length) delete state.assignments[date]; saveAssignments(); }
// Removing a person also drops any equipment paired to them in the same cell so
// a machine never dangles with no operator after its driver is taken off.
function removePersonAssignment(date, id) {
  const list = state.assignments[date] || [];
  const person = list.find(a => a.id === id);
  if (!person) return;
  pushUndo();
  state.assignments[date] = list.filter(a => a.id !== id &&
    !(a.kind === 'equip' && a.op === person.resource && a.division === person.division && a.jobId === person.jobId &&
      (a.costCode||'') === (person.costCode||'') && (a.subCode||'') === (person.subCode||'')));
  if (!state.assignments[date].length) delete state.assignments[date];

// Pair a machine to a person on the cell the person is already on. Returns 0 if
// that machine is already attached to that operator here.
function addEquipForOp(date, machine, operator, job, sc) {
  const cc = sc?sc.costCode:'', sk = sc?sc.subCode:'';
  if (cellAssignments(date, job.division, job.id, cc, sk).some(a => a.kind === 'equip' && a.resource === machine && (a.op||'') === operator)) return 0;
  dayList(date).push({ id: uid(), resource: machine, kind: 'equip', op: operator, division: job.division, jobId: job.id, jobName: job.name, costCode: cc, subCode: sk, half:false });
  saveAssignments(); return 1;
}
function toggleHalf(date, id) { const a = (state.assignments[date]||[]).find(x => x.id === id); if (a) { pushUndo(); a.half = !a.half; saveAssignments(); } }
// ── "Be on site" report time (per job, per day) ─────────────────────────────
function siteKey(division, jobId) { return division + '::' + jobId; }

function setSiteTime(division, jobId, val, dates) {

  dates.forEach(d => {
    const day = state.siteTimes[d] || (state.siteTimes[d] = {});
    if (val) day[key] = val; else { delete day[key]; if (!Object.keys(day).length) delete state.siteTimes[d]; }

}
function conflictResourcesOn(date) {
  const byRes = {}; (state.assignments[date] || []).forEach(a => { (byRes[a.resource] = byRes[a.resource] || new Set()).add(a.division + '::' + a.jobId); });
  const out = new Set(); Object.entries(byRes).forEach(([r,set]) => { if (set.size > 1) out.add(r); }); return out;
}
function totalConflicts() { let n = 0; Object.keys(state.assignments).forEach(d => { n += conflictResourcesOn(d).size; }); return n; }

  const emps = new Set(), equips = new Set();

// ── Deadline projection: with the crew planned forward, when does it finish? ──
function projectSubCode(job, sc) {
  const prod = sc.prod;
  if (sc.isComplete) return { kind:'complete' };
  if (!prod || prod <= 0) return { kind:'no-data' };
  const unitsLeft = sc.unitsLeft != null ? sc.unitsLeft : Math.max((sc.bidQty||0)-(sc.runningQty||0), 0);
  if (unitsLeft <= 0) return { kind:'complete' };
  const tStr = todayStr(); const cc = sc.costCode||'', sk = sc.subCode||'';
  const perDate = [];
  Object.keys(state.assignments).forEach(d => { if (d < tStr) return;
    const items = (state.assignments[d]||[]).filter(a => a.kind==='emp' && a.division===job.division && a.jobId===job.id && (a.costCode||'')===cc && (a.subCode||'')===sk);
    if (items.length) perDate.push([d, items.reduce((s,a)=>s+(a.half?0.5:1),0)]);
  });
  perDate.sort((a,b)=>a[0].localeCompare(b[0]));
  const deadline = sc.targetDate || job.deadline || null;
  if (!perDate.length) return { kind:'unstaffed', deadline };
  let cum = 0, finish = null;
  for (const [d, ld] of perDate) { cum += ld * prod; if (cum >= unitsLeft) { finish = d; break; } }
  if (!finish) { const lastCrew = perDate[perDate.length-1][1] || 1; const moreDays = Math.ceil((unitsLeft - cum) / (lastCrew*prod)); return { kind:'short', scheduledThrough: perDate[perDate.length-1][0], moreDays, deadline }; }
  let onTime = null, daysLate = 0;
  if (deadline) { onTime = finish <= deadline; if (!onTime) daysLate = daysBetween(deadline, finish); }
  return { kind:'ok', finish, deadline, onTime, daysLate };
}
function projChip(job, sc) {
  const p = projectSubCode(job, sc);
  if (p.kind === 'ok') return p.onTime===false ? '<span class="warn">▸ '+shortDate(p.finish)+' +'+p.daysLate+'d</span>' : '<span class="ok">▸ '+shortDate(p.finish)+(p.onTime?' ✓':'')+'</span>';
  if (p.kind === 'short') return '<span class="warn">▸ '+p.moreDays+'d short</span>';
  if (p.kind === 'unstaffed') return (sc.status==='behind'||sc.status==='at-risk') ? '<span class="warn">▸ unstaffed</span>' : '';
  return '';
}
function projLine(job, sc) {
  if (!sc) return '';
  const p = projectSubCode(job, sc); const dl = sc.targetDate || job.deadline;
  if (p.kind === 'no-data') return '<div class="proj muted">No productivity history yet — can’t project a finish date.</div>';
  if (p.kind === 'complete') return '<div class="proj ok">✓ This sub-code is complete.</div>';
  if (p.kind === 'unstaffed') return '<div class="proj warn">Nobody scheduled going forward'+(dl?' · deadline '+dl:'')+'. Add crew below.</div>';
  if (p.kind === 'short') return '<div class="proj warn">Scheduled through '+shortDate(p.scheduledThrough)+' — about '+p.moreDays+' more crew-day(s) needed'+(dl?', deadline '+dl:'')+'.</div>';
  return '<div class="proj '+(p.onTime===false?'warn':'ok')+'">With this plan: finishes <strong>'+shortDate(p.finish)+'</strong>'+(p.onTime===false?' ⚠ '+p.daysLate+' day(s) late':p.onTime?' ✓ on time':'')+(dl?' (deadline '+dl+')':'')+'.</div>';
}

// ── Jobs ────────────────────────────────────────────────────────────────────
function visibleJobs() {
  let jobs = (state.board.jobs || []);
  if (state.divFilter !== 'all') jobs = jobs.filter(j => j.division === state.divFilter);
  const q = state.jobSearch.trim().toLowerCase();
  if (q) jobs = jobs.filter(j => (j.name + ' ' + (j.jobNumber||'')).toLowerCase().includes(q));
  return jobs.slice().sort((a,b) => {
    const ra = Math.min(9, ...(a.subCodes||[]).map(c => STATUS_RANK[c.status] ?? 9));
    const rb = Math.min(9, ...(b.subCodes||[]).map(c => STATUS_RANK[c.status] ?? 9));

}

const BIG_JOB_SUBS = 10; // above this, an expanded job gets a filter box + collapsible cost-code groups
// Renders the rows under an expanded job. Small jobs stay a flat list (no change);

function jobSubSection(job, ds, tStr, searching) {

  if (subs.length <= BIG_JOB_SUBS) return subs.map(sc => subRowHtml(job, sc, ds, tStr)).join('');

  const jobKey = job.division+'::'+job.id;
  const fq = (state.subFilter[jobKey]||'').trim().toLowerCase();
  let shown = subs;
  if (fq) shown = subs.filter(sc => ((sc.costCode||'')+' '+(sc.subCode||'')+' '+(sc.description||'')).toLowerCase().includes(fq));

  const fid = 'subFilter::'+jobKey;

      '<input type="text" id="'+escAttr(fid)+'" class="subfilter-input" placeholder="🔍 Filter '+subs.length+' sub-codes…" value="'+escAttr(state.subFilter[jobKey]||'')+'" oninput="onSubFilter(\''+job.division+'\',\''+escAttr(job.id)+'\')" autocomplete="off">'+
      (fq?'<span class="muted" style="font-size:0.6rem;margin-left:0.4rem">'+shown.length+' match'+(shown.length===1?'':'es')+'</span>':'')+

    const headCells = ds.map(d => {

        '<span class="caret">'+(collapsed?'▸':'▾')+'</span> <strong>'+(cc?esc(cc):'<span class="muted">No cost code</span>')+'</strong> <span class="muted">('+list.length+')</span>'+

// Project-progress detail shown under a cost code on the dispatch sheet so
// crews know the goal, not just the task: today's target quantity (the daily
// pace needed to finish on time), % complete + units left, deadline vs the
// projected finish, and any crew shortfall. Returns { html, color } where
// color tints the code red/amber when it's behind / at-risk.
function dispatchCodeMeta(job, sc) {
  if (!job || !sc) return { html:'', color:'' };
  const unitRaw = (sc.unit||'').trim(); const isLS = unitRaw.toUpperCase()==='LS';
  const unit = (unitRaw && !isLS) ? ' '+esc(unitRaw) : '';
  const color = sc.status==='behind' ? '#b91c1c' : sc.status==='at-risk' ? '#b45309' : '';
  const lines = [];
  if (sc.description) lines.push('<div style="font-style:italic;color:#777">'+esc(sc.description)+'</div>');
  const stat = [];
  if (sc.requiredPace != null && sc.requiredPace > 0) stat.push('<strong>Target '+fmtNum(sc.requiredPace)+unit+'/day</strong>');
  if (sc.pctComplete != null) { let p = Math.round(sc.pctComplete)+'%'; if (!isLS && sc.unitsLeft != null && sc.unitsLeft > 0) p += ' · '+fmtNum(sc.unitsLeft)+unit+' left'; stat.push(p); }
  if (sc.addlLaborersNeeded) stat.push('<span style="color:#b91c1c">needs +'+sc.addlLaborersNeeded+'</span>');
  if (stat.length) lines.push('<div>'+stat.join(' · ')+'</div>');
  const dl = sc.targetDate || job.deadline;
  if (dl) {
    const p = projectSubCode(job, sc); let dline = 'due '+shortDate(dl), dcolor = '#555';
    if (p.kind==='ok') { dline += ' — proj '+shortDate(p.finish)+(p.onTime===false ? ' ⚠ +'+p.daysLate+'d' : ' ✓'); if (p.onTime===false) dcolor = '#b91c1c'; }
    else if (p.kind==='short') { dline += ' — '+p.moreDays+'d short'; dcolor = '#b45309'; }
    lines.push('<div style="color:'+dcolor+'">'+dline+'</div>');
  }
  if (!lines.length) return { html:'', color };
  return { html:'<div style="font-size:10px;line-height:1.4;margin-top:2px;color:#555">'+lines.join('')+'</div>', color };
}
// One-line rollup under a job header on the dispatch sheet: job number, how
// many crew are on it this range, overall % complete (dollar-weighted across
// all cost codes), behind / at-risk counts, and the job deadline.
function dispatchJobSummary(job, days, dates) {
  const bits = [];
  if (job && job.jobNumber) bits.push('Job #'+esc(job.jobNumber));
  const crew = new Set();
  dates.forEach(d => (days[d]||[]).forEach(a => { if (a.kind==='emp') crew.add(a.resource); }));
  if (crew.size) bits.push(crew.size+(crew.size===1?' person':' crew'));
  if (job) {
    const subs = job.subCodes||[];
    const wv = subs.reduce((s,c)=>s+(c.bidValue||0),0);
    let pct = null;
    if (wv > 0) pct = subs.reduce((s,c)=>s+(c.bidValue||0)*((c.pctComplete||0)/100),0)/wv*100;
    else if (subs.length) pct = subs.reduce((s,c)=>s+(c.pctComplete||0),0)/subs.length;
    if (pct != null) bits.push(Math.round(pct)+'% complete');
    const behind = subs.filter(c=>c.status==='behind').length;
    const atRisk = subs.filter(c=>c.status==='at-risk').length;
    if (behind) bits.push('<span style="color:#b91c1c">'+behind+' behind</span>');
    if (atRisk) bits.push('<span style="color:#b45309">'+atRisk+' at-risk</span>');
    if (job.deadline) bits.push('due '+shortDate(job.deadline));
  }
  if (!bits.length) return '';
  return '<div style="font-size:11px;color:#555;margin:2px 0 8px">'+bits.join(' · ')+'</div>';
}
function dispatchBodyJob(dates) {
  const byJob = {};
  dates.forEach(d => (state.assignments[d]||[]).forEach(a => { const k = a.division+'::'+a.jobId; (byJob[k] = byJob[k] || { name:a.jobName, division:a.division, jobId:a.jobId, days:{} }); (byJob[k].days[d] = byJob[k].days[d] || []).push(a); }));

function dispatchBodyPerson(dates) {

function buildAISnapshot() {
  const wk = weekDateStrs();
  const jobs = (state.board.jobs||[]).map(j => ({ division:j.division, name:j.name, jobNumber:j.jobNumber, deadline:j.deadline, status:j.status,
    subCodes: (j.subCodes||[]).filter(c => c.status==='behind'||c.status==='at-risk'||c.notStartedYet).map(c => ({ costCode:c.costCode, subCode:c.subCode, status:c.status, pctComplete:c.pctComplete, currentPace:c.currentPace, requiredPace:c.requiredPace, gap:c.gap, effectiveDaysLeft:c.effectiveDaysLeft, usingPPDays:c.usingPPDays, targetDate:c.targetDate, addlLaborersNeeded:c.addlLaborersNeeded, crew:c.crew })) })).filter(j => j.subCodes.length);
  const conflicts = []; Object.keys(state.assignments).forEach(d => { if (d < todayStr()) return; conflictResourcesOn(d).forEach(r => { conflicts.push({ date:d, resource:r, jobs: assignmentsFor(d,r).map(a => ({ name:a.jobName, costCode:a.costCode, subCode:a.subCode })) }); }); });
  const unstaffed = []; (state.board.jobs||[]).forEach(j => (j.subCodes||[]).forEach(c => { if (c.status==='behind' && (c.addlLaborersNeeded || !c.crew.length)) unstaffed.push({ jobName:j.name, costCode:c.costCode, subCode:c.subCode, addlLaborersNeeded:c.addlLaborersNeeded }); }));
  const total = (state.board.employees||[]).length; const assigned = new Set(); wk.forEach(d => (state.assignments[d]||[]).forEach(a => { if (a.kind==='emp') assigned.add(a.resource); }));
  return { today: todayStr(), jobs, conflicts: conflicts.slice(0,40), unstaffed: unstaffed.slice(0,30), capacity: { totalEmployees: total, assignedThisWeek: assigned.size, idleThisWeek: Math.max(total-assigned.size,0) } };

// ── Attention: gaps + one-click auto-fill ──────────────────────────────────
function gapItems() {
  if (!state.board) return [];
  const wk = weekDateStrs(); const items = [];
  (state.board.jobs||[]).forEach(job => (job.subCodes||[]).forEach(sc => {
    if (sc.status !== 'behind' && sc.status !== 'at-risk') return;
    const staffed = new Set();
    wk.forEach(d => cellAssignments(d, job.division, job.id, sc.costCode, sc.subCode).forEach(a => { if (a.kind === 'emp') staffed.add(a.resource); }));
    if (staffed.size === 0) items.push({ type:'unstaffed', job, sc, need: sc.addlLaborersNeeded || 1, staffed: 0 });
    else if (sc.addlLaborersNeeded && staffed.size < sc.addlLaborersNeeded) items.push({ type:'understaffed', job, sc, need: sc.addlLaborersNeeded, staffed: staffed.size });
  }));
  items.sort((a,b) => (a.type==='unstaffed'?0:1) - (b.type==='unstaffed'?0:1) || (STATUS_RANK[a.sc.status]-STATUS_RANK[b.sc.status]));
  return items;
}
function idleEmployees() { if (!state.board) return []; return (state.board.employees||[]).filter(e => loadForResource(e.name) === 0); }
function firstWorkdayThisWeek() { const wd = weekDateStrs().filter(d => { const dow = new Date(d+'T12:00:00').getDay(); return dow !== 0 && dow !== 6 && d >= todayStr(); }); return wd[0] || todayStr(); }
function autoFill(division, jobId, costCode, subCode) {
  const job = jobById(division, jobId); if (!job) return;
  const sc = subCodeOf(job, costCode, subCode); if (!sc) { toast('Sub-code not found'); return; }
  const need = Math.max(sc.addlLaborersNeeded || 1, 1);
  const dates = weekDateStrs().filter(d => { const dow = new Date(d+'T12:00:00').getDay(); return dow !== 0 && dow !== 6 && d >= todayStr(); });
  if (!dates.length) { toast('No working days left this week'); return; }
  const empByName = {}; (state.board.employees||[]).forEach(e => empByName[e.name] = e);
  const prefTrades = new Set((sc.crew||[]).map(n => empByName[n] && empByName[n].jobClass).filter(Boolean));
  // idle crew with at least one day not on time-off; prefer the sub-code's trade
  const idle = idleEmployees().filter(e => !dates.every(d => isOff(e.name, d))).slice()
    .sort((a,b) => (prefTrades.has(a.jobClass)?0:1) - (prefTrades.has(b.jobClass)?0:1) || a.name.localeCompare(b.name));
  const pick = idle.slice(0, need);
  if (!pick.length) { toast('No available idle crew this week (idle crew are off)'); return; }
  pushUndo();
  let added = 0; const used = [];
  pick.forEach(e => { const okDates = dates.filter(d => !isOff(e.name, d)); const n = addAssignmentSpan(e.name, 'emp', job, sc, okDates); if (n) used.push(e.name.split(' ')[0]); added += n; });
  if (!added) { _undo.pop(); updateUndoButtons(); toast('Those crew are already scheduled here'); return; }
  toast('Assigned ' + used.join(', ') + ' to ' + sc.costCode);
  render();
}
