<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%230a0f1e' stroke='%2360a5fa' stroke-width='6'/><rect x='34' y='30' width='32' height='34' rx='3' fill='none' stroke='%2360a5fa' stroke-width='6'/><line x1='34' y1='42' x2='66' y2='42' stroke='%2360a5fa' stroke-width='5'/></svg>">
  <title>DataWatch — Scheduler</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0f; --surface:#111118; --surface2:#1a1a26; --border:#2a2a3a;
      --text:#e0e0e0; --muted:#666; --green:#22c55e; --green-dim:#16a34a;
      --blue:#60a5fa; --red:#ef4444; --amber:#fbbf24; --orange:#f97316; --purple:#a78bfa;
    }
    body { height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; display:flex; flex-direction:column; }
    a { color:inherit; }
    /* Chrome is two short rows — a 36px bar that carries the brand, the tabs AND
       the account controls, then one toolbar row. On a 768px-tall laptop every
       pixel spent above the grid is a row of crew the scheduler cannot see. */
    header { display:flex; align-items:center; gap:0.5rem; padding:0 0.85rem; height:36px; flex:0 0 36px; background:var(--surface); border-bottom:1px solid var(--border); z-index:40; }
    .brand { font-size:0.62rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--blue); font-weight:700; white-space:nowrap; }
    .header-right { display:flex; align-items:center; gap:0.35rem; }
    .hlink { font-size:0.6rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); background:none; border:1px solid var(--border); border-radius:5px; padding:0.22rem 0.5rem; cursor:pointer; text-decoration:none; transition:.15s; white-space:nowrap; }
    .hlink:hover { color:var(--text); border-color:#555; }
    .avatar { width:22px; height:22px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.58rem; font-weight:700; color:var(--blue); }
    .tabs { display:flex; gap:0.1rem; margin-left:0.45rem; }
    .tab { font-size:0.74rem; font-weight:600; color:var(--muted); background:none; border:none; cursor:pointer; padding:0 0.6rem; height:35px; border-bottom:2px solid transparent; white-space:nowrap; }
    .tab:hover { color:var(--text); }
    .tab.active { color:var(--text); border-bottom-color:var(--blue); }
    .tab .pip { display:inline-block; min-width:15px; padding:0 4px; margin-left:0.3rem; font-size:0.6rem; background:var(--red); color:#fff; border-radius:9px; font-weight:700; }
    .toolbar { display:flex; align-items:center; gap:0.38rem; flex-wrap:wrap; padding:0.34rem 0.85rem; background:var(--surface); border-bottom:1px solid var(--border); }
    .btn { font-size:0.74rem; font-weight:600; color:var(--text); background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:0.26rem 0.6rem; cursor:pointer; transition:.15s; white-space:nowrap; }
    .btn.icon { padding:0.26rem 0.5rem; }
    .btn:hover { border-color:#555; }
    .btn.primary { background:rgba(96,165,250,0.14); border-color:var(--blue); color:var(--blue); }
    .btn.ghost { background:none; }
    .btn:disabled { opacity:0.5; cursor:default; }
    .wknav { display:flex; align-items:center; gap:0.4rem; }
    .wklabel { font-size:0.76rem; font-weight:700; min-width:158px; text-align:center; }
    input[type=text], input[type=time], select { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:0.26rem 0.5rem; font-size:0.76rem; }
    input[type=time]::-webkit-calendar-picker-indicator { filter:invert(0.8); cursor:pointer; }
    .spacer { flex:1; }
    main { padding:0.35rem 0.85rem 0.45rem; flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
    main.scroll { overflow:auto; }
    /* The KPI strip is one thin line, not a row of cards — same numbers, 44px back. */
    .cap { display:flex; align-items:center; gap:0.9rem; flex-wrap:wrap; padding:0 0.1rem 0.28rem; flex:0 0 auto; }
    .cap-card { display:flex; align-items:baseline; gap:0.28rem; }
    .cap-val { font-size:0.8rem; font-weight:800; line-height:1.1; }
    .cap-lbl { font-size:0.56rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); white-space:nowrap; }
    .hint { color:var(--muted); font-size:0.64rem; padding-bottom:0.28rem; display:flex; align-items:center; gap:0.4rem; flex:0 0 auto; }
    .hint .x { font-size:0.78rem; padding:0 0.2rem; }
    .board-note { color:var(--muted); font-size:0.64rem; padding-top:0.3rem; flex:0 0 auto; }
    body.compact .hint { display:none; }
    body.compact .cap { padding-bottom:0.2rem; }
    .board-wrap { overflow:auto; border:1px solid var(--border); border-radius:8px; flex:1 1 auto; min-height:120px; }
    /* Board + crew rail sit side by side, so the rail costs width, not the
       vertical space the laptop is short of. */
    .board-row { display:flex; gap:0.5rem; flex:1 1 auto; min-height:0; }
    .board-row .board-wrap { flex:1 1 auto; min-width:0; }
    .rail { flex:0 0 206px; display:flex; flex-direction:column; border:1px solid var(--border); border-radius:8px; background:var(--surface); overflow:hidden; }
    .rail.drop-off { box-shadow: inset 0 0 0 2px var(--red); }
    .rail-head { display:flex; align-items:center; gap:0.3rem; padding:0.3rem 0.35rem; border-bottom:1px solid var(--border); }
    .rail-head input { flex:1; min-width:0; font-size:0.7rem; padding:0.2rem 0.4rem; }
    .rail-head + .rail-head { border-bottom:1px solid var(--border); }
    .rail-head .tgl { font-size:0.62rem; padding:0.14rem 0.45rem; }
    .rail-tabs { display:flex; flex:1; min-width:0; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .rail-tab { flex:1; min-width:0; background:var(--surface2); border:none; color:var(--muted); font-size:0.66rem; font-weight:700; padding:0.22rem 0.1rem; cursor:pointer; white-space:nowrap; }
    .rail-tab + .rail-tab { border-left:1px solid var(--border); }
    .rail-tab:hover { color:var(--text); }
    .rail-tab.on { background:rgba(96,165,250,0.18); color:var(--blue); cursor:default; }
    .rail-tip { font-size:0.58rem; color:var(--muted); padding:0.28rem 0.4rem 0.15rem; line-height:1.3; }
    .rail-list { flex:1 1 auto; overflow:auto; padding:0 0.3rem 0.35rem; }
    .rail-grp { font-size:0.55rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); padding:0.35rem 0.1rem 0.15rem; position:sticky; top:0; background:var(--surface); z-index:1; }
    .rail-row { display:flex; align-items:center; gap:0.3rem; padding:0.2rem 0.35rem; border:1px solid var(--border); border-radius:5px; margin-bottom:0.16rem; cursor:grab; background:var(--surface2); }
    .rail-row:hover { border-color:#555; }
    .rail-row.dragging { opacity:0.35; }
    .rail-row.off { opacity:0.45; }
    .rail-name { flex:1; min-width:0; font-size:0.69rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .rail-load { font-size:0.54rem; padding:0 0.26rem; border-radius:7px; border:1px solid var(--border); color:var(--muted); white-space:nowrap; }
    .rail-load.free { color:var(--green); border-color:var(--green-dim); }
    .rail-load.full { color:var(--red); border-color:var(--red); }
    .rail-empty { font-size:0.68rem; color:var(--muted); padding:0.6rem 0.3rem; }
    table.board { border-collapse:collapse; width:100%; font-size:0.74rem; }
    table.board th, table.board td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); vertical-align:top; }
    table.board thead th { position:sticky; top:0; background:var(--surface2); z-index:5; padding:0.26rem 0.4rem; text-align:center; font-weight:700; white-space:nowrap; }
    table.board thead th.weekend { color:var(--muted); } table.board thead th.today { color:var(--blue); }
    /* Wider than it was: the board is a handful of job rows now, not 78
       sub-code rows, so the job name fits on one line and the row stays short. */
    .lead-col { position:sticky; left:0; background:var(--surface); z-index:6; min-width:250px; max-width:300px; text-align:left !important; padding:0.26rem 0.5rem !important; }
    thead .lead-col { z-index:7; }
    .cell { position:relative; min-width:120px; height:auto; min-height:34px; padding:0.16rem; cursor:pointer; transition:background .1s; }
    body.compact .cell { min-height:26px; }
    .cell:hover { background:var(--surface2); }
    .cell.weekend { background:rgba(255,255,255,0.015); } .cell.today { box-shadow: inset 2px 0 0 var(--blue); }
    .cnt-cell { text-align:center; font-weight:700; color:var(--muted); } .cnt-cell.has { color:var(--text); }
    .site-time { font-size:0.58rem; font-weight:700; color:var(--blue); margin-top:1px; letter-spacing:-0.02em; }
    .asn { display:inline-block; vertical-align:top; max-width:100%; font-size:0.64rem; line-height:1.3; padding:0.05rem 0.3rem; border-radius:4px; margin:0 0.14rem 0.14rem 0; border-left:3px solid var(--muted); background:var(--surface2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .asn.conflict { background:rgba(239,68,68,0.18); border-left-color:var(--red); } .asn.half { opacity:0.85; font-style:italic; } .asn .cc { color:var(--muted); }
    .grp-row td { background:var(--surface2); cursor:pointer; } .grp-lead { font-weight:700; } .caret { display:inline-block; width:12px; color:var(--muted); }
    .div-badge { font-size:0.58rem; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; padding:0.1rem 0.4rem; border-radius:5px; border:1px solid; }
    .pill { font-size:0.58rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:0.08rem 0.4rem; border-radius:9px; }
    .pill.on-track { background:rgba(34,197,94,0.15); color:var(--green); } .pill.at-risk { background:rgba(251,191,36,0.15); color:var(--amber); }
    .pill.behind { background:rgba(239,68,68,0.15); color:var(--red); } .pill.complete { background:rgba(96,165,250,0.15); color:var(--blue); }
    .pill.no-data, .pill.not-started { background:var(--surface2); color:var(--muted); }
    .need-badge { font-size:0.56rem; font-weight:700; color:var(--red); border:1px solid var(--red); border-radius:8px; padding:0 5px; white-space:nowrap; }
    .sub-meta { font-size:0.62rem; color:var(--muted); margin-top:2px; display:flex; gap:0.35rem; align-items:center; flex-wrap:wrap; }
    .res-meta { font-size:0.6rem; color:var(--muted); display:flex; gap:0.3rem; align-items:center; flex-wrap:wrap; margin-top:0.1rem; }
    .res-load { font-size:0.58rem; padding:0.02rem 0.3rem; border-radius:8px; background:var(--surface2); border:1px solid var(--border); }
    .sup-dot { color:var(--amber); } .muted { color:var(--muted); } .warn { color:var(--red); } .ok { color:var(--green); }
    .ai-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; max-width:920px; }
    .ai-head { display:flex; align-items:center; gap:0.6rem; padding:0.7rem 1rem; background:var(--surface2); border-bottom:1px solid var(--border); }
    .ai-badge { font-size:0.58rem; padding:0.1rem 0.45rem; border-radius:9px; background:rgba(96,165,250,0.15); color:var(--blue); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
    .ai-body { padding:0.9rem 1rem; }
    .rec { display:flex; gap:0.6rem; padding:0.55rem 0; border-top:1px solid var(--border); align-items:flex-start; }
    .rec-dot { width:8px; height:8px; border-radius:50%; margin-top:0.35rem; flex-shrink:0; }
    .rec-meta { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); }
    .rec-issue { font-size:0.82rem; font-weight:600; margin:0.1rem 0; } .rec-action { font-size:0.8rem; color:var(--muted); }
    .reassign { display:flex; align-items:center; gap:0.5rem; font-size:0.78rem; padding:0.4rem 0; border-top:1px solid var(--border); flex-wrap:wrap; } .reassign .arrow { color:var(--blue); }
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:1rem; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:min(500px,96vw); max-height:90vh; overflow:auto; }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:0.8rem 1rem; border-bottom:1px solid var(--border); }
    .modal-body { padding:0.9rem 1rem; }
    .x { background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer; }
    label.fld { display:block; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin:0.7rem 0 0.25rem; }
    select.full, input.full { width:100%; }
    .cur-asn { display:flex; align-items:center; gap:0.5rem; padding:0.4rem 0.5rem; background:var(--surface2); border:1px solid var(--border); border-radius:6px; margin-bottom:0.35rem; font-size:0.76rem; }
    .cur-asn .grow { flex:1; min-width:0; } .mini { font-size:0.66rem; padding:0.2rem 0.45rem; }
    .seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .seg button { background:var(--surface2); border:none; color:var(--muted); font-size:0.7rem; padding:0.3rem 0.6rem; cursor:pointer; }
    .seg button.active { background:rgba(96,165,250,0.18); color:var(--blue); font-weight:700; }
    .proj { font-size:0.76rem; margin:0.5rem 0; padding:0.45rem 0.6rem; border:1px solid var(--border); border-radius:6px; background:var(--surface2); }
    .proj.ok { border-color:var(--green-dim); } .proj.warn { border-color:var(--red); }
    .pick-list { max-height:38vh; overflow:auto; margin-top:0.3rem; }
    .pick-row { display:flex; align-items:center; gap:0.4rem; padding:0.28rem 0.5rem; border:1px solid var(--border); border-radius:6px; margin-bottom:0.2rem; cursor:pointer; }
    .pick-row:hover { border-color:#555; background:var(--surface2); } .pick-row.on-this { border-color:var(--green-dim); }
    .pick-row.blocked { border-color:rgba(239,68,68,0.5); border-left:3px solid var(--red); background:rgba(239,68,68,0.06); opacity:0.7; } .pick-row.blocked .pick-name { text-decoration:line-through; text-decoration-color:var(--red); }
    .pick-name { font-weight:600; white-space:nowrap; } .pick-sub { font-size:0.64rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .pick-status { margin-left:auto; font-size:0.66rem; white-space:nowrap; padding-left:0.4rem; }
    .also-dd { position:relative; }
    .also-trigger { display:flex; align-items:center; justify-content:space-between; gap:0.5rem; width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:0.45rem 0.6rem; font-size:0.78rem; cursor:pointer; }
    .also-trigger:hover { border-color:#555; } .also-caret { color:var(--muted); font-size:0.7rem; }
    .also-panel { margin-top:0.3rem; border:1px solid var(--border); border-radius:6px; background:var(--surface); padding:0.4rem; }
    .also-panel input[type=text] { width:100%; margin-bottom:0.35rem; }
    .also-list { max-height:30vh; overflow:auto; display:flex; flex-direction:column; gap:0.2rem; }
    .also-opt { display:flex; align-items:center; gap:0.5rem; padding:0.32rem 0.5rem; border:1px solid var(--border); border-radius:5px; cursor:pointer; font-size:0.76rem; }
    .also-opt:hover { border-color:#555; background:var(--surface2); }
    .also-opt.on { border-color:var(--blue); background:rgba(96,165,250,0.12); color:var(--blue); }
    .also-check { width:14px; display:inline-block; text-align:center; color:var(--blue); font-weight:800; }
    .also-chips { display:flex; flex-wrap:wrap; gap:0.3rem; } .also-chips:not(:empty) { margin-top:0.35rem; }
    .also-chip { display:inline-flex; align-items:center; gap:0.3rem; font-size:0.7rem; background:rgba(96,165,250,0.12); border:1px solid var(--blue); color:var(--blue); border-radius:12px; padding:0.15rem 0.2rem 0.15rem 0.5rem; }
    .also-chip button { background:none; border:none; color:var(--blue); cursor:pointer; font-size:0.72rem; line-height:1; padding:0 0.25rem; }
    .asn.equip { background:rgba(251,191,36,0.10); }
    .subctl-row td { background:var(--surface); }
    .subfilter-input { width:100%; max-width:232px; font-size:0.72rem; padding:0.3rem 0.5rem; }
    .subgrp-row td { background:rgba(96,165,250,0.06); cursor:pointer; font-size:0.72rem; }
    .subgrp-row:hover td { background:var(--surface2); }
    .cur-asn.equip-sub { margin-left:1rem; background:rgba(251,191,36,0.08); border-color:rgba(251,191,36,0.25); font-size:0.72rem; }
    .equip-pick { border:1px solid var(--border); border-radius:6px; background:var(--surface); padding:0.4rem; margin:0 0 0.4rem 1rem; }
    .equip-pick input[type=text] { width:100%; margin-bottom:0.35rem; }
    .empty { color:var(--muted); font-size:0.82rem; text-align:center; padding:2.5rem 1rem; }
    .loading { color:var(--muted); font-size:0.85rem; text-align:center; padding:3rem 1rem; }
    /* Toolbar toggle chips — one tap, state visible without reading a checkbox. */
    .tgl { display:inline-flex; align-items:center; gap:0.28rem; font-size:0.7rem; font-weight:600; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:14px; padding:0.22rem 0.62rem; cursor:pointer; white-space:nowrap; user-select:none; }
    .tgl:hover { border-color:#555; color:var(--text); }
    .tgl.on { background:rgba(96,165,250,0.14); border-color:var(--blue); color:var(--blue); }
    /* Secondary actions live behind "More" so the toolbar never wraps to a 2nd row. */
    .menu-wrap { position:relative; }
    .menu-pop { position:absolute; right:0; top:calc(100% + 5px); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0.25rem; min-width:210px; z-index:70; box-shadow:0 10px 28px rgba(0,0,0,0.55); }
    .menu-pop button { display:block; width:100%; text-align:left; background:none; border:none; color:var(--text); font-size:0.76rem; padding:0.4rem 0.55rem; border-radius:5px; cursor:pointer; }
    .menu-pop button:hover { background:var(--surface2); }
    .menu-pop hr { border:none; border-top:1px solid var(--border); margin:0.25rem 0; }
    /* Drag to move a name between days / jobs / people; the corner handle repeats a crew. */
    .asn { cursor:grab; }
    .asn.dragging { opacity:0.3; }
    .cell.drop-move { background:rgba(96,165,250,0.2); box-shadow: inset 0 0 0 2px var(--blue); }
    .cell.drop-copy { background:rgba(34,197,94,0.2); box-shadow: inset 0 0 0 2px var(--green); }
    .fill-h { position:absolute; right:2px; bottom:2px; width:10px; height:10px; border:1px solid var(--blue); background:var(--bg); border-radius:2px; cursor:crosshair; opacity:0; transition:opacity .1s; }
    .cell:hover .fill-h { opacity:1; }
    /* Per-name grip: same idiom as the cell handle, scoped to one man. */
    .chip-grip { display:inline-block; width:0; height:9px; overflow:hidden; margin-left:0; vertical-align:middle; border-radius:2px; cursor:crosshair; transition:width .08s; }
    .asn:hover .chip-grip { width:9px; margin-left:0.25rem; border:1px solid var(--blue); background:var(--bg); }
    .done-row td { background:rgba(255,255,255,0.015); }
    /* One row per job: the lead cell names it, every day cell takes men. */
    .job-lead { font-weight:600; }
    .job-row td.cell:hover { background:var(--surface2); }
    /* An empty day says it will take a crew, so the click is discoverable. */
    .job-row td.cell:hover::after { content:'+ crew'; position:absolute; left:0.3rem; top:0.3rem; font-size:0.6rem; color:var(--muted); pointer-events:none; }
    .job-row td.cell:has(.asn):hover::after { content:none; }
    /* Crew board: one job per line, full cell width, name ellipsised. */
    table.board.crew .asn { display:block; margin-right:0; }
    .code-tag { font-size:0.55rem; font-weight:700; letter-spacing:0.03em; color:var(--blue); border:1px solid rgba(96,165,250,0.45); border-radius:4px; padding:0 0.25rem; white-space:nowrap; }
    .lnk { color:var(--blue); cursor:pointer; text-decoration:underline; }
    /* Assign modal: the people picker is the point of the dialog, so it gets the room. */
    .pick-row.kb { border-color:var(--blue); background:rgba(96,165,250,0.14); }
    .more-tog { background:none; border:none; color:var(--muted); font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer; padding:0.35rem 0; margin-top:0.5rem; border-top:1px solid var(--border); width:100%; text-align:left; }
    .more-tog:hover { color:var(--text); }
    /* Bottom-LEFT: the Mathis chat bubble sits bottom-right and was covering
       the confirmations that drag-and-drop relies on. */

// ── Load / save ─────────────────────────────────────────────────────────────

// Persistence: baseline + merge-on-save + undo/redo. Saves are debounced;

// ── Assignment model ────────────────────────────────────────────────────────

  const pctOf = c => isDone(c) ? 100 : (c.pctComplete || 0);

  if (wv > 0) return subs.reduce((t, c) => t + (c.bidValue || 0) * (pctOf(c) / 100), 0) / wv * 100;

}

// ── By Crew board ───────────────────────────────────────────────────────────

function updatePickList() {
  const ctx = state.assignCtx; if (!ctx || ctx.mode !== 'job') return;
  const box = document.getElementById('pickList'); if (!box) return;
  const q = ((document.getElementById('pickSearch')||{}).value || '').trim().toLowerCase();
  const job = jobById(ctx.division, ctx.jobId) || { division:ctx.division, id:ctx.jobId, name:'Job', subCodes:[] };
  const code = ctx.costCode ? codeOf(job, ctx.costCode) : null;
  const emps = (state.board.employees||[]).map(e => ({ name:e.name, kind:'emp', jobClass:e.jobClass, sup:e.isSupervisor }));
  const equips = (state.board.equipment||[]).map(n => ({ name:n, kind:'equip', jobClass:'', sup:false }));
  let cands = emps.concat(equips);
  if (q) cands = cands.filter(c => c.name.toLowerCase().includes(q) || (c.jobClass||'').toLowerCase().includes(q));
  cands.forEach(c => { const items = assignmentsFor(ctx.date, c.name);
    const here = items.filter(a => a.division===ctx.division && a.jobId===ctx.jobId);
    c.onThis = here.length > 0;
    c.hereCode = here.length ? (here[0].costCode || '') : '';
    c.others = [...new Set(items.filter(a => !(a.division===ctx.division && a.jobId===ctx.jobId)).map(a => a.jobName))];
    c.off = isOff(c.name, ctx.date); });
  // Men who have worked this cost code before (or anywhere on this job when no
  // code is named) float up — the scheduler usually wants them back on it.
  const histCrew = new Set(code ? code.crew : jobCodes(job).flatMap(x => x.crew));
  cands.sort((a,b) => { const ao = !!(a.off && !a.off.partial), bo = !!(b.off && !b.off.partial); if (ao !== bo) return ao ? 1 : -1;
    if (a.kind !== b.kind) return a.kind === 'equip' ? 1 : -1;
    const af = a.others.length===0 && !a.onThis, bf = b.others.length===0 && !b.onThis; if (af !== bf) return af ? -1 : 1;
    const ah = histCrew.has(a.name), bh = histCrew.has(b.name); if (ah !== bh) return ah ? -1 : 1; return a.name.localeCompare(b.name); });
  cands = cands.slice(0, 60);

    else if (c.others.length) status = '<span class="warn">→ '+esc(c.others.join(', '))+'</span>';
    else status = '<span class="ok">free</span>';
    const sub = [c.kind==='equip'?'equipment':(c.jobClass||''), histCrew.has(c.name)?'★ worked this':''].filter(Boolean).join(' · ');
    return '<div class="pick-row'+cls+'" onclick="pickAdd(\''+escAttr(c.name)+'\',\''+c.kind+'\')"><span class="pick-name">'+(c.sup?'★ ':'')+esc(c.name)+(c.kind==='equip'?' 🚜':'')+'</span>'+(sub?'<span class="pick-sub">'+esc(sub)+'</span>':'')+'<span class="pick-status">'+status+'</span></div>';

  if (!r.added && !r.retagged) { _undo.pop(); updateUndoButtons();
    if (r.blocked) { const o = isOff(name, dates.find(d => isBlockedOff(name, kind, d))); toast(name+' is approved off for the whole day ('+((o&&o.type)||'time off')+') — not scheduled'); }

// ── Copy week ───────────────────────────────────────────────────────────────
function copyWeekForward() {
  pushUndo();
  const wk = weekDateStrs(); let added = 0, blocked = 0;
  wk.forEach(d => { const items = state.assignments[d] || []; const nd = addDays(d, 7);
    items.forEach(a => { if (isBlockedOff(a.resource, a.kind, nd)) { blocked++; return; } // approved off next week — don't carry forward
      if ((state.assignments[nd]||[]).some(x => x.resource===a.resource && x.division===a.division && x.jobId===a.jobId && (x.costCode||'')===(a.costCode||''))) return;
      dayList(nd).push({ ...a, id: uid() }); added++; }); });
  if (added) { saveAssignments(); toast('Copied '+added+' assignment'+(added>1?'s':'')+' into next week'+(blocked?' · skipped '+blocked+' full days off':'')); state.weekAnchor.setDate(state.weekAnchor.getDate()+7); state.weekAnchor = new Date(state.weekAnchor); render(); }
  else { _undo.pop(); updateUndoButtons(); toast(blocked ? 'Next week is all approved-off for those crew' : 'Nothing to copy (next week already matches)'); }
}

// ── Import division plans ───────────────────────────────────────────────────
function importPlanned() {
  const planned = state.board.plannedAssignments || []; if (!planned.length) { toast('No division plans to import'); return; }
  pushUndo();
  let added = 0, blocked = 0;
  planned.forEach(p => { const kind = p.kind||'emp';
    if (isBlockedOff(p.resource, kind, p.date)) { blocked++; return; } // approved off — never import over it
    // The planner schedules sub-codes; the board keeps only the cost code, so
    // one man planned across three sub-codes of a job imports as one booking.
    const dup = (state.assignments[p.date]||[]).some(a => a.resource===p.resource && a.division===p.division && a.jobId===p.jobId && (a.costCode||'')===(p.costCode||'')); if (dup) return;

  if (job) {

// ── Attention: gaps + one-click auto-fill ──────────────────────────────────
// A gap is a JOB with work behind or at risk and not enough men on it this
// week. The cost codes that are behind come along for the label, because that
// is what a scheduler needs to see to decide who to send.
function gapItems() {
  if (!state.board) return [];
  const wk = weekDateStrs(); const items = [];
  (state.board.jobs||[]).forEach(job => {
    if (state.hideComplete && jobAllDone(job)) return;
    const codes = jobCodes(job).filter(codeNeedsCrew);
    if (!codes.length) return;
    const need = jobRollup(job).needed;
    const staffed = new Set();
    wk.forEach(d => jobCrewOn(d, job.division, job.id).forEach(a => { if (a.kind === 'emp') staffed.add(a.resource); }));
    const worst = worstStatus(codes);
    if (staffed.size === 0) items.push({ type:'unstaffed', job, codes, need: Math.max(need, 1), staffed: 0, worst });
    else if (need && staffed.size < need) items.push({ type:'understaffed', job, codes, need, staffed: staffed.size, worst });
  });
  items.sort((a,b) => (a.type==='unstaffed'?0:1) - (b.type==='unstaffed'?0:1) || ((STATUS_RANK[a.worst] ?? 9) - (STATUS_RANK[b.worst] ?? 9)) || a.job.name.localeCompare(b.job.name));
  return items;
}
function idleEmployees() { if (!state.board) return []; return (state.board.employees||[]).filter(e => loadForResource(e.name) === 0); }
function firstWorkdayThisWeek() { const wd = weekDateStrs().filter(d => { const dow = new Date(d+'T12:00:00').getDay(); return dow !== 0 && dow !== 6 && d >= todayStr(); }); return wd[0] || weekDateStrs()[0] || todayStr(); }
// Put idle men on the JOB for the rest of the week. No cost code — the
// supervisor gives them the task in the morning, which is the whole point.
function autoFill(division, jobId) {
  const job = jobById(division, jobId); if (!job) { toast('Job not found'); return; }
  const need = Math.max(jobRollup(job).needed || 1, 1);
  const dates = weekDateStrs().filter(d => { const dow = new Date(d+'T12:00:00').getDay(); return dow !== 0 && dow !== 6 && d >= todayStr(); });
  if (!dates.length) { toast('No working days left this week'); return; }
  const empByName = {}; (state.board.employees||[]).forEach(e => empByName[e.name] = e);
  const prefTrades = new Set(jobCodes(job).flatMap(c => c.crew).map(n => empByName[n] && empByName[n].jobClass).filter(Boolean));
  // Idle crew with at least one day they are not off for the WHOLE of; prefer
  // the trades that have worked this job before.
  const idle = idleEmployees().filter(e => !dates.every(d => isBlockedOff(e.name, 'emp', d))).slice()
    .sort((a,b) => (prefTrades.has(a.jobClass)?0:1) - (prefTrades.has(b.jobClass)?0:1) || a.name.localeCompare(b.name));
  const pick = idle.slice(0, need);
  if (!pick.length) { toast('No available idle crew this week (idle crew are off all week)'); return; }
  pushUndo();
  let added = 0; const used = [];
  pick.forEach(e => { const n = addAssignmentSpan(e.name, 'emp', job, '', dates); if (n) used.push(e.name.split(' ')[0]); added += n; });
  if (!added) { _undo.pop(); updateUndoButtons(); toast('Those crew are already on this job'); return; }
  toast('Put ' + used.join(', ') + ' on ' + job.name);
  render();
}

  html += '<div style="font-weight:700;margin:0.4rem 0 0.5rem">⚠ Jobs needing crew (' + gaps.length + ')</div>';
  if (!gaps.length) html += '<div class="muted" style="font-size:0.82rem;margin-bottom:1.2rem">No job with behind or at-risk work is short on crew this week. 👍</div>';
  else html += '<div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1.4rem">' + gaps.map(g => {
    const col = divColor(g.job.division); const fwd = firstWorkdayThisWeek();
    const codeNames = g.codes.slice(0,3).map(c => esc(c.costCode || 'no code')).join(', ') + (g.codes.length>3 ? ' +'+(g.codes.length-3) : '');
    return '<div style="display:flex;align-items:center;gap:0.6rem;background:var(--surface);border:1px solid var(--border);border-left:3px solid '+col+';border-radius:8px;padding:0.5rem 0.7rem;flex-wrap:wrap">'+
      '<span class="div-badge" style="color:'+col+';border-color:'+col+'">'+esc(g.job.division)+'</span>'+
      '<span style="font-weight:600">'+esc(g.job.name)+'</span>'+
      '<span class="pill '+g.worst+'">'+g.worst.replace('-',' ')+'</span>'+
      '<span class="muted" style="font-size:0.74rem" title="cost codes behind or at risk">'+codeNames+'</span>'+
      '<span class="warn" style="font-size:0.74rem">'+(g.type==='unstaffed'?'no crew scheduled this week':('needs +'+g.need+', has '+g.staffed))+'</span>'+
      '<span style="flex:1"></span>'+
      '<button class="btn primary mini" title="Put idle crew on this job for the rest of the week" onclick="autoFill(\''+g.job.division+'\',\''+escAttr(g.job.id)+'\')">⚡ Fill</button>'+
      '<button class="btn mini" onclick="openAssignJob(\''+g.job.division+'\',\''+escAttr(g.job.id)+'\',\'\',\''+fwd+'\')">Staff…</button>'+
    '</div>';
  }).join('') + '</div>';
  html += '<div style="font-weight:700;margin:0.4rem 0 0.5rem">🟢 Idle this week (' + idle.length + ')</div>';
  if (!idle.length) html += '<div class="muted" style="font-size:0.82rem;margin-bottom:1.2rem">Everyone is scheduled this week.</div>';
  else { const byTrade = {}; idle.forEach(e => { const t = e.jobClass || 'Other'; (byTrade[t] = byTrade[t] || []).push(e.name); });
    html += '<div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.4rem">' + Object.keys(byTrade).sort().map(t => '<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.45rem 0.7rem;max-width:280px"><div style="font-size:0.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">'+esc(t)+' ('+byTrade[t].length+')</div><div style="font-size:0.78rem">'+byTrade[t].map(n => esc(n)+(wk.some(d=>isBlockedOff(n,'emp',d))?' ⛱':(wk.some(d=>isOff(n,d))?' ⛱½':''))).join(', ')+'</div></div>').join('') + '</div>';
  }
  if (offSched.length) {
    html += '<div style="font-weight:700;margin:0.4rem 0 0.5rem">⛱ Scheduled but off (' + offSched.length + ')</div>';
    html += '<div style="display:flex;flex-direction:column;gap:0.3rem;margin-bottom:1.4rem">' + offSched.map(o => { const appr = o.off.status==='approved';
      return '<div style="font-size:0.78rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap"><span class="warn" style="font-weight:600">'+esc(o.name)+'</span><span class="muted">'+shortDate(o.d)+'</span><span>'+esc(o.off.type)+(appr?' <strong style="color:var(--red)">(APPROVED OFF)</strong>':' (requested)')+' — scheduled on '+esc(o.jobName)+'</span>'+(appr?'<button class="btn mini" title="Remove this assignment" onclick="removeAssignment(\''+o.d+'\',\''+o.id+'\');afterMutate()">Remove</button>':'')+'<button class="btn mini" onclick="openAssignResource(\''+escAttr(o.name)+'\',\'emp\',\''+o.d+'\')">Fix…</button></div>'; }).join('') + '</div>';
  }
  if (conflicts.length) {
    html += '<div style="font-weight:700;margin:0.4rem 0 0.5rem">🔴 Double-booked (' + conflicts.length + ')</div>';
    html += '<div style="display:flex;flex-direction:column;gap:0.3rem">' + conflicts.map(c => {
      const jobs = [...new Set(assignmentsFor(c.d, c.r).map(a => a.jobName))].join(' AND ');
      return '<div style="font-size:0.78rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap"><span class="warn" style="font-weight:600">'+esc(c.r)+'</span><span class="muted">'+shortDate(c.d)+'</span><span>'+esc(jobs)+'</span><button class="btn mini" onclick="openAssignResource(\''+escAttr(c.r)+'\',\'emp\',\''+c.d+'\')">Resolve…</button></div>';
    }).join('') + '</div>';
  }
  return html;
}
function renderAI() {
  if (state.aiLoading) return '<div class="loading">⚡ Analyzing the cross-division schedule…</div>';
  if (!state.ai) return '<div class="empty">No insights yet.<br><span class="muted">Click “Generate insights” to have AI review conflicts, behind work and capacity across every active job.</span></div>';
  const a = state.ai;
  const oc = { 'on-track':'var(--green)','at-risk':'var(--amber)','behind':'var(--red)' }[a.outlook] || 'var(--muted)';
  const ol = { 'on-track':'On Track','at-risk':'At Risk','behind':'Behind' }[a.outlook] || (a.outlook||'');
  const pcol = { high:'var(--red)', medium:'var(--amber)', low:'var(--green)' };
  const recs = (a.recommendations||[]).map(r => '<div class="rec"><div class="rec-dot" style="background:'+(pcol[r.priority]||'var(--muted)')+'"></div><div><div class="rec-meta">'+esc(r.scope||'Overall')+' · '+esc((r.priority||'medium').toUpperCase())+'</div><div class="rec-issue">'+esc(r.issue||'')+'</div><div class="rec-action">'+esc(r.action||'')+'</div></div></div>').join('');
  const re = (a.reassignments||[]).map(r => '<div class="reassign"><strong>'+esc(r.employee)+'</strong><span class="muted">'+esc(r.fromJob||'Unassigned')+'</span><span class="arrow">→</span><strong>'+esc(r.toJob||'')+'</strong>'+(r.reason?'<span class="muted">· '+esc(r.reason)+'</span>':'')+'</div>').join('');
  return '<div class="ai-card"><div class="ai-head"><span>⚡</span><span style="font-weight:700">AI Scheduling Insights</span><span class="ai-badge">Claude</span>'+(ol?'<span style="margin-left:auto;font-weight:700;color:'+oc+'">'+esc(ol)+'</span>':'')+'</div><div class="ai-body"><div style="font-size:0.86rem;line-height:1.6;margin-bottom:0.5rem">'+esc(a.summary||'')+'</div>'+recs+(re?'<div class="rec-meta" style="margin-top:0.9rem">Suggested reassignments</div>'+re:'')+(a.cached?'<div class="muted" style="font-size:0.62rem;margin-top:0.8rem">Cached result</div>':'')+'</div></div>';
}

  newCrew, editCrew, cancelCrewEdit, saveCrewEdit, addCrewMember, removeCrewMember, updateCrewPickList, crewPickKey, onCrewName, copyWeekForward, openDispatchModal, closeDispatch, doPrint, doEmail, autoFill, onSiteTimeInput, clearSiteTime, toggleHideComplete, dismissHint, setCompact });
wireBoardDnD();
loadAll();
