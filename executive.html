<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%230a0f1e' stroke='%23a78bfa' stroke-width='6'/><circle cx='50' cy='50' r='12' fill='%23a78bfa'/></svg>">
  <title>DataWatch — Executive Division</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --surface2:  #1a1a26;
      --border:    #2a2a3a;
      --text:      #e0e0e0;
      --muted:     #666;
      --green:     #22c55e;
      --green-dim: #16a34a;
      --blue:      #60a5fa;
      --red:       #ef4444;
      --amber:     #fbbf24;
      --orange:    #f97316;
      --purple:    #a78bfa;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1.75rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--purple);
      font-weight: 700;
    }
    .brand-sub {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-left: 0.6rem;
      text-transform: uppercase;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .header-link {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.38rem 0.8rem;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s;
    }
    .header-link:hover { color: var(--text); border-color: #555; }
    .header-link.primary {
      color: var(--purple);
      border-color: rgba(167,139,250,0.4);
    }
    .header-link.primary:hover {
      background: rgba(167,139,250,0.08);
      border-color: var(--purple);
    }

    /* ── Action bar ── */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .page-title {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .page-title-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .page-title-logo img,
    .page-title-logo svg { width: 34px; height: 34px; object-fit: contain; color: var(--purple); }
    .page-title-text { display: flex; flex-direction: column; gap: 0.2rem; }
    .page-title-eyebrow {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--purple);
    }
    .page-title-h {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .page-title-sub {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .action-btns { display: flex; gap: 0.6rem; }
    .btn {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn:hover { border-color: #555; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:disabled:hover { border-color: var(--border); }
    .btn.primary {
      background: var(--purple);
      color: #0a0a0f;
      border-color: var(--purple);
    }
    .btn.primary:hover { background: #8b6fe0; border-color: #8b6fe0; }
    .btn.primary:disabled:hover { background: var(--purple); border-color: var(--purple); }
    /* The send-green confirm — the section picker wears it when it is the
       email that is being composed, so the button matches the Send it leads
       to rather than the purple PDF button beside it. */
    .btn.green {
      background: var(--green);
      color: #0a0a0f;
      border-color: var(--green);
    }
    .btn.green:hover { background: var(--green-dim); border-color: var(--green-dim); }
    .btn.green:disabled:hover { background: var(--green); border-color: var(--green); }
    .btn svg { width: 14px; height: 14px; }

    /* ── Section picker ──
       "Generate Report (PDF)" opens this before handing off to the browser's
       print dialog: every section the report rendered, each with a checkbox,
       all of them checked. Unchecking one drops it from the printout. */
    .picker-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10040;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .picker {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: min(560px, 100%);
      max-height: calc(100vh - 3rem);
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .picker-head {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 1rem 1.2rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .picker-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .picker-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .picker-x {
      margin-left: auto;
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 0.15rem;
    }
    .picker-x:hover { color: var(--text); }
    .picker-tools {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.65rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }
    .picker-link {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .picker-link:hover { color: var(--text); border-color: #555; }
    .picker-count {
      margin-left: auto;
      font-size: 0.68rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .picker-list {
      overflow-y: auto;
      padding: 0.5rem 0.7rem;
    }
    .picker-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.55rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .picker-row:hover { background: var(--surface2); }
    .picker-row input {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--purple);
    }
    .picker-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .picker-text {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
    }
    .picker-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }
    .picker-meta {
      font-size: 0.65rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* An excluded section stays legible — it is still a row you can click
       back on — but reads as switched off at a glance. */
    .picker-row.off { opacity: 0.45; }
    .picker-foot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.6rem;
      padding: 0.8rem 1.2rem;
      border-top: 1px solid var(--border);
    }

    /* ── Report container (this is what gets printed) ──
       Wide enough for the eleven-column project table to sit without a
       horizontal scrollbar, which is the point of mirroring the division
       tables: every figure visible at once. */
    .report {
      max-width: 1500px;
      margin: 0 auto 3rem;
      padding: 0 2rem;
      /* body is a flex column and the auto side margins above opt this item
         out of cross-axis stretch, so without an explicit width it sizes to
         fit its content — which the project table's min-width then drags wider
         than the window, scrolling the whole page sideways instead of just the
         table. width + min-width:0 pins it to the window and lets
         .ptable-wrap do the scrolling. */
      width: 100%;
      min-width: 0;
    }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-right: 0.4rem;
    }
    .filter-chip {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }
    .filter-chip.on {
      color: var(--text);
      border-color: var(--purple);
      background: rgba(167,139,250,0.08);
    }

    /* ── Section ── */
    .section {
      margin-bottom: 2.5rem;
    }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .section-sub {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .section-head-projects {
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .section-head-text {
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
      min-width: 0;
    }
    .section-action-btn {
      font-size: 0.65rem;
      padding: 0.5rem 0.85rem;
      flex-shrink: 0;
    }

    /* ── Division portfolio: metric strip ──
       A copy of the strip that heads each division's own home page
       (tracker.html / paving.html / kiewit-pinetree.html), so a figure read
       here is the same figure, in the same place, on the page it came from. */
    /* Four across, two deep: the strip carries eight figures, and a flex row
       that wraps leaves a single orphan on the second line. A grid splits them
       evenly and keeps every label on one line. */
    /* Dust Control's per-book composition, under its metric strip. */
    .dust-books { margin-bottom: 1rem; }
    .dust-books tfoot td { font-weight: 700; border-top: 2px solid var(--border); }
    .dust-book-out td { opacity: 0.55; font-style: italic; }
    .dust-book-warn {
      margin: 0 0 0.75rem;
      padding: 0.55rem 0.8rem;
      border: 1px solid #b45309;
      border-left-width: 3px;
      border-radius: 6px;
      background: rgba(180, 83, 9, 0.10);
      font-size: 0.78rem;
      line-height: 1.4;
    }
    .dust-book-note {
      margin: -0.4rem 0 1.1rem;
      font-size: 0.76rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .dust-book-note > div + div { margin-top: 0.2rem; }
    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      margin-bottom: 1.25rem;
    }
    .metric-item {
      padding: 0.85rem 1.1rem;
      border-right: 1px solid var(--border);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }
    .metric-item:nth-child(4n) { border-right: none; }
    .metric-item:nth-child(-n+4) { border-top: none; }
    .metric-label {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .metric-value {
      font-size: 1.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric-sub { font-size: 0.6rem; color: var(--muted); }
    /* Shared by the metric strip, the status column and the Projected Cost
       cell, so one place decides what "over budget" looks like — and so the
       print rules can swap the whole palette for ink without fighting inline
       styles. The shades match tracker.html's statusTextColor(). */
    .tone-blue    { color: var(--blue); }
    .tone-green   { color: var(--green); }
    .tone-teal    { color: #34d399; }
    .tone-amber   { color: var(--amber); }
    .tone-red     { color: var(--red); }
    .tone-awarded { color: #86efac; }
    .tone-mute    { color: var(--muted); }
    .tone-plain   { color: var(--text); }

    /* ── Division portfolio: section head ── */
    .div-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.5rem;
      vertical-align: middle;
      background: var(--accent, var(--border));
    }
    .section-title .div-status {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      margin-left: 0.6rem;
      vertical-align: middle;
    }
    .ptable-more {
      text-align: center;
      margin-top: 0.85rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .ptable-more a { color: var(--green); text-decoration: none; }
    .ptable-more a:hover { text-decoration: underline; }
    .section-empty {
      padding: 2rem 1rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .inv-head {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    /* ── Rubber inventory strip (on Projects page + PDF) ── */
    .inv-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .inv-card {
      flex: 1 1 150px;
      min-width: 150px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
    }
    .inv-type {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .inv-stock {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1;
    }
    .inv-stock.lo  { color: var(--red); }
    .inv-stock.mid { color: var(--amber); }
    .inv-stock.ok  { color: var(--green); }
    .inv-stock-lbl {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    .inv-meta {
      display: flex;
      gap: 0.7rem;
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 0.45rem;
    }
    .inv-lbs {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 0.18rem;
    }

    /* ── Projects financial table ── */
    .ptable-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem 0.25rem;
      overflow-x: auto;
    }
    .ptable {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      /* Eleven columns of money need the room; the wrap scrolls if the window
         is narrower than this. */
      min-width: 1180px;
    }
    .ptable th {
      text-align: left;
      padding: 0.85rem 0.6rem 0.6rem;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .ptable td {
      padding: 0.7rem 0.6rem;
      border-bottom: 1px solid rgba(42,42,58,0.4);
      vertical-align: middle;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .ptable tr:last-child td { border-bottom: none; }
    .ptable .pname {
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
    }
    /* Names and their job-number / client / PM line are clipped rather than
       allowed to widen the column — every cell in the table is nowrap, so one
       long project name would otherwise push the money columns off the page. */
    .ptable .pname-main {
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
      font-size: 0.85rem;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ptable .pname-sub {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ptable .pstatus {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .ptable .pprogress {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 118px;
    }
    .ptable .pprogress-track {
      flex: 1;
      height: 7px;
      background: rgba(42,42,58,0.5);
      border-radius: 4px;
      overflow: hidden;
      min-width: 80px;
    }
    .ptable .pprogress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .ptable .pprogress-pct {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 600;
      min-width: 32px;
      text-align: right;
    }
    .ptable .col-num   { text-align: right; }
    .ptable .v-contract  { color: #60a5fa; }      /* blue */
    .ptable .v-bid       { color: #22c55e; }      /* green */
    .ptable .v-actual    { color: var(--text); }
    .ptable .v-variance-under { color: #22c55e; }
    .ptable .v-variance-over  { color: #ef4444; }
    .ptable .v-profit-pos     { color: #22c55e; }
    .ptable .v-profit-neg     { color: #ef4444; }
    .ptable .v-profit-pct {
      color: var(--muted);
      font-size: 0.68rem;
      margin-left: 0.25rem;
    }
    .ptable .offbid-flag {
      display: block;
      margin-top: 0.15rem;
      color: var(--amber);
      font-size: 0.62rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: help;
    }
    .ptable .v-mute      { color: var(--muted); }
    /* A table's own total row: separated from the body and set in the page's
       own "this is the sum" weight, the way the pit cards mark Division Total. */
    .ptable tfoot .ptable-total td {
      border-top: 1px solid var(--border);
      border-bottom: none;
      font-weight: 700;
      padding-top: 0.8rem;
    }
    .ptable tfoot .ptable-total .pname-main { color: var(--text); }
    .ptable .pstar       {
      color: #22c55e;
      font-size: 0.95rem;
      text-align: center;
      width: 20px;
      padding-left: 0.3rem;
      padding-right: 0.3rem;
    }
    .ptable .pstar.off   { color: rgba(42,42,58,0.7); }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.62rem;
      color: #2a2a3a;
      letter-spacing: 0.04em;
      border-top: 1px solid var(--border);
    }

    /* ── Print ── */
    @media print {
      @page { size: letter landscape; margin: 0.4in; }
      body { background: #fff; color: #000; }
      header, .action-bar, footer, .filters, .section-action-btn,
      .picker-backdrop, .ptable-more { display: none !important; }
      .report { max-width: none; margin: 0; padding: 0; }
      .section-title { color: #000; }
      .section-sub   { color: #555; }
      .section-head { border-color: #ccc; }
      .ptable-wrap { background: #fff; border: 1px solid #ccc; overflow: visible; }
      .ptable      { min-width: 0; font-size: 0.55rem; table-layout: auto; }
      .ptable th   { color: #555; border-color: #ccc; padding: 0.35rem 0.3rem; font-size: 0.5rem; }
      .ptable td   { border-color: #eee; color: #000; padding: 0.3rem 0.3rem; }
      .ptable .pname-main { color: #000; font-size: 0.65rem; }
      .ptable .v-actual   { color: #000; }
      .ptable .pname-sub, .ptable .pstatus,
      .ptable .pprogress-pct, .ptable .v-mute,
      .ptable .v-profit-pct { color: #555; font-size: 0.5rem; }
      .ptable .offbid-flag { color: #92400e; font-size: 0.5rem; }
      .ptable .pstar.off { color: #ddd; }
      .ptable .pprogress { min-width: 70px; gap: 0.3rem; }
      .ptable .pprogress-track { background: #eee; min-width: 40px; }
      .page-break { break-before: page; page-break-before: always; }

      /* Single-section print scope: a division's "PDF" button marks that
         section .print-scope and puts body in printing-scoped, which hides
         every other section so the browser's native print-to-PDF renders
         just that one. The first printed section must not force a page
         break, or the PDF opens on a blank sheet. */
      body.printing-scoped #reportBody > .section:not(.print-scope),
      body.printing-scoped #portfolioSections > .section:not(.print-scope) {
        display: none !important;
      }
      body.printing-scoped .print-scope {
        break-before: auto !important;
        page-break-before: auto !important;
      }

      /* Picked-section print scope: the section picker marks every section the
         user unchecked .print-omit and puts body in printing-picked, so the
         printout carries only what was left checked. Same first-section rule as
         above — whichever section leads the printout must not force a break. */
      body.printing-picked #reportBody > .section.print-omit,
      body.printing-picked #portfolioSections > .section.print-omit {
        display: none !important;
      }
      body.printing-picked .print-first {
        break-before: auto !important;
        page-break-before: auto !important;
      }

      /* Division sections in print: the metric strip is the whole point of
         the layout, so it keeps its borders and drops to ink-on-paper. */
      .metric-strip { background: #fff; border-color: #ccc; grid-template-columns: repeat(4, 1fr); }
      .metric-item  { border-right-color: #ccc; border-top-color: #ccc; padding: 0.4rem 0.5rem; }
      .metric-item:nth-child(4n)   { border-right: none; }
      .metric-item:nth-child(-n+4) { border-top: none; }
      .metric-value { font-size: 0.8rem; }
      .metric-label { font-size: 0.45rem; }
      .metric-sub   { font-size: 0.45rem; }

      /* Ink versions of the tone palette. The screen shades are tuned for a
         near-black background and several of them (amber especially) are
         unreadable on paper. */
      .tone-plain, .tone-mute    { color: #000; }
      .tone-blue                 { color: #1d4ed8; }
      .tone-green, .tone-awarded,
      .tone-teal                 { color: #166534; }
      .tone-amber                { color: #92400e; }
      .tone-red                  { color: #991b1b; }
      .ptable .pstatus.tone-mute { color: #555; }
      .metric-label, .metric-sub { color: #555; }
      /* No .metric-value colour here: every value carries a tone class, and a
         blanket rule after the palette above flattened the whole strip to black
         on paper — margin, variance and overdue all reading the same. */

      /* Status pills: the screen versions are a translucent tint plus bright
         text, which on paper leaves light-on-light. Give them solid ink. */
      .status-green { background: #e8f7ec; color: #166534; border-color: #bbe5c6; }
      .status-amber { background: #fdf3d6; color: #92400e; border-color: #eedca6; }
      .status-red   { background: #fce8e8; color: #991b1b; border-color: #f2c4c4; }
      .status-mute  { background: #f1f1f4; color: #555;    border-color: #ddd;    }

      /* Rubber inventory cards were never given print colours — they printed as
         a black block in the middle of an otherwise white page. */
      .inv-head { color: #555; }
      .inv-card { background: #fff; border: 1px solid #ccc; }
      .inv-type, .inv-stock-lbl, .inv-meta, .inv-lbs { color: #555; }
      .inv-stock.lo  { color: #991b1b; }
      .inv-stock.mid { color: #92400e; }
      .inv-stock.ok  { color: #166534; }
      .section-empty { background: #fff; border-color: #ccc; color: #555; }
      .division-section .section-title { color: #000; }
      /* The money columns keep their meaning on paper: contract in blue,
         budget and under-budget in green, over-budget and losses in red —
         all at ink-weight rather than the screen's brighter shades. */
      .ptable .v-contract        { color: #1d4ed8; }
      .ptable .v-bid             { color: #166534; }
      .ptable .v-variance-under  { color: #166534; }
      .ptable .v-variance-over   { color: #991b1b; }
      .ptable .v-profit-pos      { color: #166534; }
      .ptable .v-profit-neg      { color: #991b1b; }
      .ptable .pstar             { color: #166534; }
      .ptable tfoot .ptable-total td { border-top-color: #ccc; }
      .ptable tfoot .ptable-total .pname-main { color: #000; }
      .division-section { break-inside: auto; }
    }

    @media (max-width: 1200px) {
      .metric-strip { grid-template-columns: repeat(2, 1fr); }
      .metric-item:nth-child(4n)   { border-right: 1px solid var(--border); }
      .metric-item:nth-child(2n)   { border-right: none; }
      .metric-item:nth-child(-n+4) { border-top: 1px solid var(--border); }
      .metric-item:nth-child(-n+2) { border-top: none; }
    }

    @media (max-width: 900px) {
      .action-bar { padding: 1rem; }
      .report { padding: 0 1rem; }
    }
  </style>
  <script src="report-email.js" defer></script>
</head>
<body>

  <header>
    <div>
      <span class="brand">DataWatch</span>
      <span class="brand-sub">Executive Division</span>
    </div>
    <div class="header-right">
      <a href="divisions.html" class="header-link">← Divisions</a>
      <button class="header-link" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <div class="action-bar">
    <div class="page-title">
      <div class="page-title-logo"><img src="datawatch-tower.png" alt="" /></div>
      <div class="page-title-text">
        <div class="page-title-eyebrow">Cross-Division Roll-Up</div>
        <div class="page-title-h">Executive Report</div>
        <div class="page-title-sub" id="reportDate">—</div>
      </div>
    </div>
    <div class="action-btns">
      <button class="btn" onclick="openEmailPicker()" title="Choose which sections go in the email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Email Report
      </button>
      <button class="btn primary" onclick="openReportPicker()" title="Choose which sections go in the PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"/>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <rect x="6" y="14" width="12" height="8"/>
        </svg>
        Generate Report (PDF)
      </button>
    </div>
  </div>

  <main class="report" id="report">

    <!-- Loading / error overlays (hidden once data renders) -->
    <div id="reportLoading" style="text-align:center;padding:4rem 1rem;color:var(--muted);font-size:0.85rem;letter-spacing:0.04em;">
      Loading executive report…
    </div>
    <div id="reportError" style="display:none;text-align:center;padding:3rem 1rem;color:var(--red);font-size:0.85rem;">
      <div style="margin-bottom:0.6rem;font-weight:700;">Couldn't load the executive report.</div>
      <div id="reportErrorMsg" style="color:var(--muted);font-size:0.75rem;margin-bottom:1rem;"></div>
      <button class="btn" onclick="loadReport()">Retry</button>
    </div>

    <!-- Body sections (populated by JS from /api/executive/report) -->
    <div id="reportBody" style="display:none;">

      <!-- ─────────── ONE SECTION PER DIVISION ───────────
           Turf, Paving and Kiewit get the layout of their own home page — the
           metric strip, then the project table. Quarry, Dust Control and Payroll
           each get the layout of theirs. renderPortfolios() builds them all from
           /api/executive/report. -->
      <div id="portfolioSections"></div>

    </div>

  </main>

  <footer>© DataWatch · Force Corp · Executive Division · All rights reserved</footer>

  <script>
    // ── Auth guard: platform admins or users with executive division access ──
    const token = localStorage.getItem('fct_token');
    let user = null;
    try { user = JSON.parse(localStorage.getItem('fct_user')); } catch {}

    const execRole = user && user.divisionRoles && user.divisionRoles.executive;
    const hasExecAccess = Boolean(user) && (
      user.isPlatformAdmin || (execRole && execRole !== 'no_access')
    );

    if (!token || !user) {
      window.location.replace('index.html');
    } else if (!hasExecAccess) {
      window.location.replace('divisions.html');
    }

    // ── Tiny HTML helpers ──
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));

    function setReportDate(iso) {
      const d = iso ? new Date(iso) : new Date();
      const fmt = d.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
      const el = document.getElementById('reportDate');
      if (el) el.textContent = `Generated ${fmt}`;
    }

    // ── Renderers ──
    // Currency formatter — "$12,345.67" or "—" for null/zero
    function fmtMoney(n, opts = {}) {
      if (n == null || (opts.zeroDash && Math.abs(Number(n)) < 0.005)) return '—';
      const v = Number(n);
      if (!isFinite(v)) return '—';
      return (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-US', {
        minimumFractionDigits: 2, maximumFractionDigits: 2,
      });
    }

    // Tone → colour, shared by the metric strip, the progress bar and the
    // Projected Cost column. Same three bands the division pages use.
    const TONE_COLORS = {
      blue:    '#60a5fa',
      green:   '#22c55e',
      amber:   '#fbbf24',
      red:     '#ef4444',
      awarded: '#86efac',
      mute:    '#666',
      plain:   '#e0e0e0',
    };
    const toneColor = t => TONE_COLORS[t] || TONE_COLORS.plain;

    // Project status → tone, mirroring tracker.html's statusTextColor so a
    // status reads the same colour here as it does on the division page.
    const STATUS_TONES = {
      'Bidding':                'blue',
      'Awarded':                'awarded',
      'In Progress':            'green',
      'Substantially Complete': 'teal',
      'Complete':               'blue',
      'On Hold':                'amber',
    };

    // A signed percentage in parentheses — "(20.0%)" / "(−4.2%)" — matching the
    // division tables, which show the sign only when the figure is negative.
    function pctNote(pct) {
      if (pct == null || !isFinite(pct)) return '';
      const sign = pct < 0 ? '−' : '';
      return ` <span class="v-profit-pct">(${sign}${Math.abs(pct).toFixed(1)}%)</span>`;
    }

    // A profit cell: the money, its sign colour, and the margin percentage.
    // null means "unknowable" (no contract value, or no spend yet for Actual
    // Profit) and shows as a dash rather than a misleading zero.
    function profitCell(value, pct) {
      if (value == null) return '<td class="col-num v-mute">—</td>';
      const cls = value >= 0 ? 'v-profit-pos' : 'v-profit-neg';
      return `<td class="col-num ${cls}">${esc(fmtMoney(value))}${pctNote(pct)}</td>`;
    }

    // Tons and hours, matching the quarry page's formatTons: up to two decimals,
    // none forced, so a round 200 tons reads as "200".
    function fmtTons(n) {
      const v = Number(n);
      if (!isFinite(v)) return '—';
      return v.toLocaleString('en-US', { maximumFractionDigits: 2 });
    }
    // Hours to two decimals, the way payroll reads them.
    function fmtHours(n) {
      const v = Number(n);
      if (!isFinite(v)) return '0.00';
      return v.toFixed(2);
    }
    // "Aug 3 – Aug 16, 2026" for a pay period.
    function fmtPeriod(a, b) {
      if (!a || !b) return 'No pay period';
      const da = new Date(a + 'T00:00:00Z');
      const db = new Date(b + 'T00:00:00Z');
      if (isNaN(da) || isNaN(db)) return 'No pay period';
      const opts  = { month: 'short', day: 'numeric', timeZone: 'UTC' };
      const yOpts = { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' };
      return `${da.toLocaleDateString('en-US', opts)} – ${db.toLocaleDateString('en-US', yOpts)}`;
    }
    // Whole counts — visits, gallons, entries.
    function fmtCount(n) {
      const v = Number(n);
      if (!isFinite(v)) return '—';
      return Math.round(v).toLocaleString('en-US');
    }

    function renderProjectRow(p) {
      const progressPct = Math.max(0, Math.min(100, Number(p.progressPct) || 0));

      // Variance: + = under bid (green), − = over bid (red)
      let varCell;
      if (!p.bid) {
        varCell = `<td class="col-num v-mute">—</td>`;
      } else if (p.variance >= 0) {
        varCell = `<td class="col-num v-variance-under">${esc(fmtMoney(p.variance))} <span class="v-profit-pct">under</span></td>`;
      } else {
        varCell = `<td class="col-num v-variance-over">${esc(fmtMoney(Math.abs(p.variance)))} <span class="v-profit-pct">over</span></td>`;
      }

      // Off-bid flag: part of Actual is booked under codes that aren't on the
      // bid, so it's counted in Actual but not attributed to any bid item (and
      // therefore not reflected in Projected). Surface a ⚠ with the amount +
      // offending codes so the drift is visible and can be cleaned up.
      let offBidFlag = '';
      const offBid = Number(p.offBid) || 0;
      if (offBid > 0.005) {
        const list  = Array.isArray(p.offBidCodes) ? p.offBidCodes : [];
        const lines = list.slice(0, 8)
          .map(c => `  ${c.cost_code || '(blank)'}${c.sub_code ? ' / ' + c.sub_code : ''}: ${fmtMoney(c.actual)}`)
          .join('\n');
        const more  = list.length > 8 ? `\n  …and ${list.length - 8} more` : '';
        const title = `${fmtMoney(offBid)} of Actual is logged under codes not on the bid — counted in Actual but not tied to any bid item (so not in Projected):\n${lines}${more}`;
        offBidFlag  = `<div class="offbid-flag" title="${esc(title)}">⚠ ${esc(fmtMoney(offBid))} off-bid</div>`;
      }

      // Sub-line under the project name: job number, client, project manager —
      // the same line the division tables carry.
      const metaBits = [p.jobNumber, p.client].filter(Boolean).map(esc);
      if (p.pm) metaBits.push('PM: ' + esc(p.pm));
      const meta = metaBits.join(' · ');

      // A bid line flagged At Risk or On Hold outranks the project's own status:
      // it is the thing that needs someone to look at it.
      let statusCell;
      if (p.atRisk > 0) {
        statusCell = `<span class="pstatus tone-red" style="font-weight: 600;">⚠ ${p.atRisk} At Risk</span>`;
      } else if (p.onHold > 0) {
        statusCell = `<span class="pstatus tone-amber" style="font-weight: 600;">◼ ${p.onHold} On Hold</span>`;
      } else if (p.status) {
        statusCell = `<span class="pstatus tone-${STATUS_TONES[p.status] || 'mute'}">${esc(p.status)}</span>`;
      } else {
        statusCell = '<span class="pstatus tone-mute">—</span>';
      }

      // Deadline note, shown only when it is close enough to matter.
      let deadline = '';
      if (p.daysLeft != null) {
        if (p.daysLeft < 0) {
          deadline = `<div class="offbid-flag tone-red">${Math.abs(p.daysLeft)}d overdue</div>`;
        } else if (p.daysLeft <= 14) {
          deadline = `<div class="offbid-flag tone-amber">${p.daysLeft}d left</div>`;
        }
      }

      return `
        <tr>
          <td>
            <div class="pname">
              <span class="pname-main">${esc(p.name)}</span>
              ${meta ? `<span class="pname-sub">${meta}</span>` : ''}
            </div>
          </td>
          <td>${statusCell}${deadline}</td>
          <td>
            <div class="pprogress">
              <div class="pprogress-track">
                <div class="pprogress-fill" style="width: ${progressPct}%; background: ${toneColor(p.progressTone)};"></div>
              </div>
              <span class="pprogress-pct">${progressPct}%</span>
            </div>
          </td>
          <td class="col-num v-contract">${esc(fmtMoney(p.contract, { zeroDash: true }))}</td>
          <td class="col-num v-bid">${esc(fmtMoney(p.bid,      { zeroDash: true }))}</td>
          <td class="col-num v-actual">${esc(fmtMoney(p.actual, { zeroDash: true }))}${offBidFlag}</td>
          ${varCell}
          <td class="col-num tone-${esc(p.projectedTone || 'plain')}">${esc(fmtMoney(p.projected, { zeroDash: true }))}</td>
          ${profitCell(p.profit, p.profitPct)}
          ${profitCell(p.actProfit, p.actProfitPct)}
          <td class="${p.pinned ? 'pstar' : 'pstar off'}">${p.pinned ? '★' : '☆'}</td>
        </tr>
      `;
    }

    // ── Division portfolio sections ──
    // One per job-running division, laid out like that division's home page:
    // the metric strip, then the project table. The executive report and the
    // division page are the same view of the same numbers, which is what makes
    // a figure here traceable without translation.
    const DIVISION_PAGES = {
      turf:   { href: 'tracker.html',          label: 'Turf'   },
      paving: { href: 'paving.html',           label: 'Paving' },
      kiewit: { href: 'kiewit-pinetree.html',  label: 'Kiewit' },
    };

    function renderMetricStrip(metrics) {
      if (!metrics.length) return '';
      return `<div class="metric-strip">${metrics.map(m => `
        <div class="metric-item">
          <span class="metric-label">${esc(m.label)}</span>
          <span class="metric-value tone-${esc(m.tone || 'plain')}">${esc(m.value)}</span>
          <span class="metric-sub">${esc(m.sub || '')}</span>
        </div>`).join('')}</div>`;
    }

    // Section chrome every division shares: its accent dot, name, status pill,
    // sub-line, and its own PDF button — then the metric strip and whatever
    // table that division's page puts under it.
    function renderDivisionSection(d, opts) {
      const id = 'portfolio-' + d.key;
      return `
        <div class="section division-section page-break" id="${id}"
             data-section-name="${esc(d.name)}" style="--accent: ${esc(d.accent || '#666')};">
          <div class="section-head section-head-projects">
            <div class="section-head-text">
              <div class="section-title">
                <span class="div-dot"></span>${esc(d.name)}
                <span class="div-status status-${esc(d.statusKind || 'mute')}">${esc(d.status || '—')}</span>
              </div>
              <div class="section-sub">${esc(opts.sub || '')}</div>
            </div>
            <button class="btn section-action-btn" onclick="printSection('${id}')" title="Print just this division">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              PDF
            </button>
          </div>
          ${renderMetricStrip(Array.isArray(d.metrics) ? d.metrics : [])}
          ${opts.extra || ''}
          ${opts.body || ''}
        </div>
      `;
    }

    function renderPortfolioSection(d, extraHTML) {
      const page  = DIVISION_PAGES[d.key] || null;
      const rows  = Array.isArray(d.rows) ? d.rows : [];
      const parts = [];
      if (d.pinned) parts.push(`${d.pinned} pinned`);
      if (d.recent) parts.push(`${d.recent} most recent`);
      const sub = d.error
        ? 'Could not load this division'
        : (d.total
            ? `${parts.join(' · ') || `${rows.length} shown`} of ${d.total} project${d.total === 1 ? '' : 's'}`
            : 'No projects');

      const body = rows.length ? `
        <div class="ptable-wrap">
          <table class="ptable">
            <thead>
              <tr>
                <th>Project</th>
                <th>Status</th>
                <th>Progress</th>
                <th class="col-num">Contract Value</th>
                <th class="col-num">Bid Budget</th>
                <th class="col-num">Actual</th>
                <th class="col-num">Variance</th>
                <th class="col-num">Projected Cost</th>
                <th class="col-num">Projected Profit</th>
                <th class="col-num" title="Contract value minus actual cost. Final once the job is complete.">Actual Profit</th>
                <th></th>
              </tr>
            </thead>
            <tbody>${rows.map(renderProjectRow).join('')}</tbody>
          </table>
        </div>
        ${d.hidden > 0 && page
          ? `<p class="ptable-more">${d.hidden} more — <a href="${page.href}">View all in ${esc(page.label)}</a></p>`
          : ''}`
        : `<div class="section-empty">${d.error
              ? 'This division\'s projects could not be loaded.'
              : 'No projects in this division yet.'}</div>`;

      return renderDivisionSection(d, { sub, body, extra: extraHTML });
    }

    // ── Quarry ──
    // Mirrors the Quarry page: its eight Home KPIs across the strip, then the
    // Analytics tab's "Performance by Location" table — the pits are what a
    // quarry has instead of projects, so they are the rows.
    function renderQuarrySection(d) {
      const rows  = Array.isArray(d.rows) ? d.rows : [];
      const total = d.total || null;
      const sub   = d.entryCount
        ? `${fmtCount(d.entryCount)} entr${d.entryCount === 1 ? 'y' : 'ies'} for ${esc(d.year || '')}`
        : 'Add entries on Daily, Crushing or Sales to populate this section';

      // Margin carries its percentage the way the pit cards do.
      const marginCell = r => {
        if (r.margin == null) return '<td class="col-num v-mute">—</td>';
        const cls = r.margin >= 0 ? 'v-profit-pos' : 'v-profit-neg';
        const pct = r.marginPct != null
          ? ` <span class="v-profit-pct">(${r.marginPct < 0 ? '−' : ''}${Math.abs(r.marginPct).toFixed(1)}%)</span>`
          : '';
        return `<td class="col-num ${cls}">${esc(fmtMoney(r.margin))}${pct}</td>`;
      };

      const row = (r, isTotal) => `
        <tr${isTotal ? ' class="ptable-total"' : ''}>
          <td>
            <div class="pname">
              <span class="pname-main">${esc(r.name)}</span>
              ${r.meta ? `<span class="pname-sub">${esc(r.meta)}</span>` : ''}
            </div>
          </td>
          <td class="col-num v-contract">${esc(fmtMoney(r.sales))}</td>
          <td class="col-num tone-amber">${esc(fmtMoney(r.cost))}</td>
          ${marginCell(r)}
          <td class="col-num v-actual">${esc(fmtTons(r.tonsSold))}</td>
          <td class="col-num ${r.costPerTonSold == null ? 'v-mute' : 'tone-amber'}">${esc(r.costPerTonSold == null ? '—' : fmtMoney(r.costPerTonSold))}</td>
          <td class="col-num ${r.costPerTon == null ? 'v-mute' : 'tone-amber'}">${esc(r.costPerTon == null ? '—' : fmtMoney(r.costPerTon))}</td>
          <td class="col-num v-actual">${esc(fmtTons(r.tonsCrushed))}</td>
          <td class="col-num ${r.lossPct == null ? 'v-mute' : 'tone-red'}">${esc(r.lossPct == null ? '—' : r.lossPct.toFixed(1) + '%')}</td>
          <td class="col-num ${r.finalScreenTons == null ? 'v-mute' : 'v-bid'}">${esc(r.finalScreenTons == null ? '—' : fmtTons(r.finalScreenTons))}</td>
          <td class="col-num v-mute">${esc(fmtTons(r.hours))}</td>
        </tr>`;

      const body = rows.length ? `
        <div class="ptable-wrap">
          <table class="ptable">
            <thead>
              <tr>
                <th>Location</th>
                <th class="col-num">Sales</th>
                <th class="col-num">Cost</th>
                <th class="col-num">Margin</th>
                <th class="col-num">Tons Sold</th>
                <th class="col-num" title="Total pit cost (daily + crushing) divided by tons sold.">Cost / Ton Sold</th>
                <th class="col-num" title="Crushing cost divided by tons crushed — the production cost.">Cost / Ton (Prod.)</th>
                <th class="col-num">Tons Crushed</th>
                <th class="col-num" title="Share of tonnage fed to the jaw crusher that does not reach the final screen.">Loss %</th>
