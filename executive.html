                <th class="col-num">Hours</th>
              </tr>
            </thead>
            <tbody>${rows.map(r => row(r, false)).join('')}</tbody>
            ${total ? `<tfoot>${row(total, true)}</tfoot>` : ''}
          </table>
        </div>`
        : `<div class="section-empty">No quarry activity recorded for ${esc(d.year || 'this year')}.</div>`;

      return renderDivisionSection(d, { sub, body });
    }

    // ── Dust Control ──
    // Mirrors the Dust Control home dashboard: its year-to-date KPIs plus the
    // invoice picture across the strip, then its Top Customers ranking widened
    // into a table. Customers are the unit of work here, so they are the rows.
    // Dust Control bills off three books — Dust Control Tracking, Other Billing
    // and EES Other — and payroll posts an approved haul into exactly one of
    // them. Revenue is their sum; almost nothing else is, because they measure
    // in different units and only the first carries invoice dates. So the strip
    // above reports the total and this block reports the composition: what each
    // book billed, in its own measures, and what its invoice regime actually is.
    // Without it the reader has a blended number and no way to question it.
    function renderDustBooks(d) {
      const books = Array.isArray(d.books) ? d.books : [];
      if (!books.length) return '';
      const total = books.reduce((n, b) => n + (Number(b.revenue) || 0), 0);
      const lines = books.reduce((n, b) => n + (Number(b.lines) || 0), 0);
      // A book that could not be read makes every total on this page smaller
      // than the truth while looking exactly like a real one, so it is called
      // out above the numbers rather than under them.
      const warn = (Array.isArray(d.unavailable) && d.unavailable.length)
        ? `<div class="dust-book-warn">Could not read ${d.unavailable.map(esc).join(' and ')} —
             the figures on this page exclude ${d.unavailable.length === 1 ? 'it' : 'them'}.</div>`
        : '';
      const untracked = (d.invoices && d.invoices.untracked) || null;
      const unpriced  = d.unpriced || null;
      const notes = [
        untracked && untracked.amount
          ? `${fmtMoney(untracked.amount)} of this revenue has no dust-side invoice state, so it never
             appears in Overdue, Unpaid or Paid however long it goes uncollected.`
          : '',
        unpriced && unpriced.count
          ? `${fmtCount(unpriced.count)} line${unpriced.count === 1 ? '' : 's'} record work at no price —
             they total $0 and are not revenue until somebody rates them.`
          : '',
      ].filter(Boolean);

      return `
        ${warn}
        <div class="ptable-wrap dust-books">
          <table class="ptable">
            <thead>
              <tr>
                <th>Billing book</th>
                <th class="col-num">Lines</th>
                <th class="col-num">Revenue</th>
                <th class="col-num">Share</th>
                <th>Volume</th>
                <th>Hours</th>
                <th>Invoicing</th>
              </tr>
            </thead>
            <tbody>${books.map(b => `
              <tr${b.available ? '' : ' class="dust-book-out"'}>
                <td><div class="pname"><span class="pname-main">${esc(b.label)}</span></div></td>
                <td class="col-num v-actual">${b.available ? esc(fmtCount(b.lines)) : '—'}</td>
                <td class="col-num v-contract">${b.available ? esc(fmtMoney(b.revenue, { zeroDash: true })) : '—'}</td>
                <td class="col-num v-mute">${b.available && total > 0.005
                    ? esc((100 * b.revenue / total).toFixed(0) + '%') : '—'}</td>
                <td class="v-mute">${b.available ? esc(b.volume || '—') : 'unavailable'}</td>
                <td class="v-mute">${b.available ? esc(b.hoursText || '—') : '—'}</td>
                <td class="v-mute">${esc(b.ar)}</td>
              </tr>`).join('')}</tbody>
            <tfoot>
              <tr>
                <td>Division</td>
                <td class="col-num v-actual">${esc(fmtCount(lines))}</td>
                <td class="col-num v-contract">${esc(fmtMoney(total, { zeroDash: true }))}</td>
                <td class="col-num v-mute">100%</td>
                <td class="v-mute" title="The three books measure different things — UB applied, quantity delivered, hours worked — so there is no division total.">—</td>
                <td class="v-mute" title="Field hours, trucking hours and EES hours are three different measures.">—</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
        ${notes.length ? `<div class="dust-book-note">${notes.map(n => `<div>${n}</div>`).join('')}</div>` : ''}`;
    }

    function renderDustSection(d) {
      const rows = Array.isArray(d.rows) ? d.rows : [];
      const sub  = rows.length
        ? `${fmtCount(rows.length)} customer${rows.length === 1 ? '' : 's'} · ${esc(d.year || '')} year to date`
        : 'No dust control jobs recorded this year';

      const body = rows.length ? `
        <div class="ptable-wrap">
          <table class="ptable">
            <thead>
              <tr>
                <th>Customer</th>
                <th class="col-num">Visits</th>
                <th class="col-num">Gallons</th>
                <th class="col-num">Hours</th>
                <th class="col-num">Revenue</th>
                <th class="col-num">Avg / Visit</th>
                <th class="col-num" title="Invoiced, unpaid, and older than 45 days. Dust Control Tracking only — it is the one book that carries invoice dates.">Overdue</th>
                <th class="col-num" title="Invoiced or awaiting invoice, not yet paid. Dust Control Tracking only.">Unpaid</th>
                <th class="col-num" title="Dust Control Tracking only.">Paid</th>
                <th class="col-num" title="Billed off Other Billing or EES Other, which carry no invoice dates — so this money never ages into Overdue, Unpaid or Paid. Overdue + Unpaid + Paid + Untracked = Revenue.">Untracked</th>
              </tr>
            </thead>
            <tbody>${rows.map(r => `
              <tr>
                <td>
                  <div class="pname">
                    <span class="pname-main">${esc(r.name)}</span>
                    ${(r.meta || r.lastVisit)
                      ? `<span class="pname-sub">${[r.meta, r.lastVisit ? `last visit ${r.lastVisit}` : '']
                          .filter(Boolean).map(esc).join(' · ')}</span>`
                      : ''}
                  </div>
                </td>
                <td class="col-num v-actual">${esc(fmtCount(r.visits))}</td>
                <td class="col-num tone-blue">${esc(fmtCount(r.gallons))}</td>
                <td class="col-num v-mute">${esc(Number(r.hours || 0).toFixed(1))}</td>
                <td class="col-num v-contract" title="${esc([
                    `Dust Control Tracking ${fmtMoney(r.revenueTracking || 0)}`,
                    r.revenueOther ? `Other Billing ${fmtMoney(r.revenueOther)}` : '',
                    r.revenueEes   ? `EES Other ${fmtMoney(r.revenueEes)}` : '',
                  ].filter(Boolean).join(' · '))}">${esc(fmtMoney(r.revenue, { zeroDash: true }))}</td>
                <td class="col-num v-mute">${esc(fmtMoney(r.avgPerVisit, { zeroDash: true }))}</td>
                <td class="col-num ${r.overdue > 0.005 ? 'v-profit-neg' : 'v-mute'}">${esc(fmtMoney(r.overdue, { zeroDash: true }))}</td>
                <td class="col-num ${r.unpaid  > 0.005 ? 'tone-amber'   : 'v-mute'}">${esc(fmtMoney(r.unpaid,  { zeroDash: true }))}</td>
                <td class="col-num ${r.paid    > 0.005 ? 'v-profit-pos' : 'v-mute'}">${esc(fmtMoney(r.paid,    { zeroDash: true }))}</td>
                <td class="col-num ${r.untracked > 0.005 ? 'tone-blue' : 'v-mute'}">${esc(fmtMoney(r.untracked, { zeroDash: true }))}</td>
              </tr>`).join('')}</tbody>
          </table>
        </div>`
        : `<div class="section-empty">No dust control jobs recorded for ${esc(d.year || 'this year')}.</div>`;

      return renderDivisionSection(d, { sub, body, extra: renderDustBooks(d) });
    }

    // ── Trucking ──
    // Mirrors the Trucking dashboard's YTD Overview and the Financials sub-tab's
    // averages across the strip, then the Customer Data sub-tab's per-customer
    // aggregation as the table — widened with the invoice state, because the
    // money is only half the question once a haul is done.
    function renderTruckingSection(d) {
      const rows = Array.isArray(d.rows) ? d.rows : [];
      const sub  = d.entryCount
        ? `${fmtCount(d.entryCount)} entr${d.entryCount === 1 ? 'y' : 'ies'} for ${esc(d.year || '')}`
        : 'No hauls recorded';

      const body = rows.length ? `
        <div class="ptable-wrap">
          <table class="ptable">
            <thead>
              <tr>
                <th>Customer</th>
                <th class="col-num">Entries</th>
                <th class="col-num">Hours</th>
                <th class="col-num">Revenue</th>
                <th class="col-num" title="Revenue divided by hours — what the work billed at, on average.">Avg / Hr</th>
                <th class="col-num" title="Billable and not yet invoiced.">To Invoice</th>
                <th class="col-num" title="Invoiced and not yet paid.">Awaiting Payment</th>
                <th class="col-num">Paid</th>
              </tr>
            </thead>
            <tbody>${rows.map(r => `
              <tr>
                <td>
                  <div class="pname">
                    <span class="pname-main">${esc(r.name)}</span>
                    ${r.meta ? `<span class="pname-sub">${esc(r.meta)}</span>` : ''}
                  </div>
                </td>
                <td class="col-num v-actual">${esc(fmtCount(r.entries))}</td>
                <td class="col-num v-mute">${esc(Number(r.hours || 0).toFixed(1))}</td>
                <td class="col-num v-contract">${esc(fmtMoney(r.revenue, { zeroDash: true }))}</td>
                <td class="col-num v-mute">${esc(fmtMoney(r.avgHaulFee, { zeroDash: true }))}</td>
                <td class="col-num ${r.uninvoiced > 0.005 ? 'v-profit-neg' : 'v-mute'}">${esc(fmtMoney(r.uninvoiced, { zeroDash: true }))}</td>
                <td class="col-num ${r.awaiting   > 0.005 ? 'tone-amber'   : 'v-mute'}">${esc(fmtMoney(r.awaiting,   { zeroDash: true }))}</td>
                <td class="col-num ${r.paid       > 0.005 ? 'v-profit-pos' : 'v-mute'}">${esc(fmtMoney(r.paid,       { zeroDash: true }))}</td>
              </tr>`).join('')}</tbody>
          </table>
        </div>`
        : `<div class="section-empty">No hauls recorded for ${esc(d.year || 'this year')}.</div>`;

      return renderDivisionSection(d, { sub, body });
    }

    // ── Intercompany Billing ──
    // Mirrors the Intercompany dashboard: its six KPIs plus the two halves of
    // "outstanding" across the strip, then its Top Companies list as a table.
    // Intercompany and customer revenue sit side by side on purpose — they are
    // two different prices for the same work, and the gap is the point.
    function renderIcSection(d) {
      const rows  = Array.isArray(d.rows) ? d.rows : [];
      const total = d.total || null;
      const bits  = [];
      if (d.entryCount) bits.push(`${fmtCount(d.entryCount)} entr${d.entryCount === 1 ? 'y' : 'ies'} for ${d.year || ''}`);
      if (d.duplicates > 0) bits.push(`${fmtCount(d.duplicates)} duplicate${d.duplicates === 1 ? '' : 's'} collapsed`);
      const sub = bits.length ? bits.join(' · ') : 'No billing entries';

      const row = (r, isTotal) => `
        <tr${isTotal ? ' class="ptable-total"' : ''}>
          <td>
            <div class="pname">
              <span class="pname-main">${esc(r.name)}</span>
              ${r.meta ? `<span class="pname-sub">${esc(r.meta)}</span>` : ''}
            </div>
          </td>
          <td class="col-num v-mute">${esc(fmtCount(r.hours))}</td>
          <td class="col-num tone-red">${esc(fmtMoney(r.truckIc, { zeroDash: true }))}</td>
          <td class="col-num tone-amber">${esc(fmtMoney(r.dustIc, { zeroDash: true }))}</td>
          <td class="col-num v-actual">${esc(fmtMoney(r.ic, { zeroDash: true }))}</td>
          <td class="col-num v-contract">${esc(fmtMoney(r.revenue, { zeroDash: true }))}</td>
          <td class="col-num ${r.notInvoiced     > 0.005 ? 'v-profit-neg' : 'v-mute'}">${esc(fmtMoney(r.notInvoiced,     { zeroDash: true }))}</td>
          <td class="col-num ${r.awaitingPayment > 0.005 ? 'tone-amber'   : 'v-mute'}">${esc(fmtMoney(r.awaitingPayment, { zeroDash: true }))}</td>
          <td class="col-num ${r.paid            > 0.005 ? 'v-profit-pos' : 'v-mute'}">${esc(fmtMoney(r.paid,            { zeroDash: true }))}</td>
        </tr>`;

      const body = rows.length ? `
        <div class="ptable-wrap">
          <table class="ptable">
            <thead>
              <tr>
                <th>Company</th>
                <th class="col-num">Hours</th>
                <th class="col-num">Trucking IC</th>
                <th class="col-num">Dust IC</th>
                <th class="col-num">Total IC</th>
                <th class="col-num" title="What the end customer is billed, at customer rates.">Customer Revenue</th>
                <th class="col-num" title="Billable intercompany work with no invoice sent.">Not Invoiced</th>
                <th class="col-num" title="Invoiced with no payment recorded.">Awaiting Payment</th>
                <th class="col-num">Paid</th>
              </tr>
            </thead>
            <tbody>${rows.map(r => row(r, false)).join('')}</tbody>
            ${total ? `<tfoot>${row(total, true)}</tfoot>` : ''}
          </table>
        </div>`
        : `<div class="section-empty">No intercompany billing entries for ${esc(d.year || 'this year')}.</div>`;

      return renderDivisionSection(d, { sub, body });
    }

    function renderReport(data) {
      renderPortfolios({
        portfolios: Array.isArray(data.portfolios) ? data.portfolios : [],
        inventory:  Array.isArray(data.inventory)  ? data.inventory  : [],
        quarry:       data.quarry       || null,
        dust:         data.dust         || null,
        trucking:     data.trucking     || null,
        intercompany: data.intercompany || null,
        payroll:      data.payroll      || null,
      });
    }

    // One section per division, in the order the report reads: the job-running
    // divisions first, then the service divisions, then Payroll. Each is shaped
    // like its own page. Rubber inventory rides along inside the Turf section,
    // which is where it lives on the division page too — and it means a
    // Turf-only PDF still carries the stock counts.
    function renderPortfolios(data) {
      const wrap = document.getElementById('portfolioSections');
      if (!wrap) return;
      wrap.innerHTML = [
        ...data.portfolios.map(d => renderPortfolioSection(
          d,
          d.key === 'turf' ? renderRubberInventory(data.inventory) : '',
        )),
        data.quarry       ? renderQuarrySection(data.quarry)        : '',
        data.dust         ? renderDustSection(data.dust)            : '',
        data.trucking     ? renderTruckingSection(data.trucking)    : '',
        data.intercompany ? renderIcSection(data.intercompany)      : '',
        data.payroll      ? renderPayrollSection(data.payroll)      : '',
      ].join('');
    }

    // ── Payroll ──
    // Mirrors the Payroll page's Reports tab: its Hours Report totals across the
    // strip, then its per-employee table, twelve columns and a totals row. The
    // travel split and the prevailing/standard split are the point — a single
    // "total hours" figure cannot tell payroll what rate anything is paid at.
    function renderPayrollSection(d) {
      const rows  = Array.isArray(d.rows) ? d.rows : [];
      const total = d.total || null;
      const sub   = rows.length
        ? `${fmtPeriod(d.periodStart, d.periodEnd)} · ${fmtCount(rows.length)} employee${rows.length === 1 ? '' : 's'} · ${fmtHours(total ? total.totalHours : 0)} total hours`
        : `${fmtPeriod(d.periodStart, d.periodEnd)} · no submitted timesheets`;

      const timeOff = r => (r.pendingOff || r.approvedOff)
        ? `${r.pendingOff} pending / ${r.approvedOff} approved`
        : '—';
      const statusCell = r => r.hasPending
        ? `<span class="pstatus tone-amber">${esc(fmtHours(r.pendingHours))} h pending</span>`
        : `<span class="pstatus tone-green">All approved</span>`;

      const row = (r, isTotal) => `
        <tr${isTotal ? ' class="ptable-total"' : ''}>
          <td>
            <div class="pname">
              <span class="pname-main">${esc(r.name)}</span>
              ${r.meta ? `<span class="pname-sub">${esc(r.meta)}</span>` : ''}
            </div>
          </td>
          <td class="col-num v-actual">${esc(fmtHours(r.workHours))}</td>
          <td class="col-num v-mute">${esc(fmtHours(r.travelToSite))}</td>
          <td class="col-num v-mute">${esc(fmtHours(r.travelToShop))}</td>
          <td class="col-num v-mute">${esc(fmtHours(r.travelHours))}</td>
          <td class="col-num v-profit-pos">${esc(fmtHours(r.totalHours))}</td>
          <td class="col-num ${r.pwHours > 0.001 ? 'tone-amber' : 'v-mute'}">${esc(fmtHours(r.pwHours))}</td>
          <td class="col-num v-actual">${esc(fmtHours(r.stdHours))}</td>
          <td class="col-num ${r.pendingHours > 0.001 ? 'tone-amber' : 'v-mute'}">${esc(fmtHours(r.pendingHours))}</td>
          <td class="col-num ${r.approvedHours > 0.001 ? 'v-profit-pos' : 'v-mute'}">${esc(fmtHours(r.approvedHours))}</td>
          <td class="v-mute">${esc(timeOff(r))}</td>
          <td>${statusCell(r)}</td>
        </tr>`;

      const body = rows.length ? `
        <div class="ptable-wrap">
          <table class="ptable">
            <thead>
              <tr>
                <th>Employee</th>
                <th class="col-num">Hours</th>
                <th class="col-num" title="Timesheet field: Travel Time to Site">Travel to Site</th>
                <th class="col-num" title="Timesheet field: Travel Time to Shop">Travel to Shop</th>
                <th class="col-num" title="Travel to site + travel to shop">Travel</th>
                <th class="col-num">Total</th>
                <th class="col-num" title="Work hours on prevailing-wage jobs. Travel is excluded — it is not paid at the prevailing rate.">Prevailing Hrs</th>
                <th class="col-num" title="Everything paid at the standard rate: work on non-prevailing jobs plus all travel time.">Standard Hrs</th>
                <th class="col-num">Pending Hrs</th>
                <th class="col-num">Approved Hrs</th>
                <th>Time Off</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>${rows.map(r => row(r, false)).join('')}</tbody>
            ${total ? `<tfoot>${row(total, true)}</tfoot>` : ''}
          </table>
        </div>`
        : '<div class="section-empty">No submitted timesheets in this pay period.</div>';

      return renderDivisionSection(d, { sub, body });
    }

    // Mirrors the home page's per-rubber-type stock cards so the executive
    // report (and a Turf-only PDF) carries the same inventory snapshot.
    // Returns HTML — the caller decides where it lands.
    function renderRubberInventory(rows) {
      if (!Array.isArray(rows) || !rows.length) return '';
      const fmt = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
      const cards = rows.map(r => {
        const stock    = Number(r.in_stock) || 0;
        const stockCls = stock <= 0 ? 'lo' : stock < 50 ? 'mid' : 'ok';
        return `
          <div class="inv-card">
            <div class="inv-type">${esc(r.rubber_type)}</div>
            <div class="inv-stock ${stockCls}">${fmt(stock)}</div>
            <div class="inv-stock-lbl">bags in stock</div>
            <div class="inv-meta">
              <span>&#8679; ${fmt(r.produced)} produced</span>
              <span>&#8681; ${fmt(r.used)} used</span>
            </div>
            <div class="inv-lbs">${fmt(r.lbs_total)} lbs total</div>
          </div>
        `;
      }).join('');
      return `
        <div class="inv-head">Rubber Inventory</div>
        <div class="inv-strip">${cards}</div>
      `;
    }

    // ── Fetch ──
    async function loadReport() {
      const loadingEl = document.getElementById('reportLoading');
      const errorEl   = document.getElementById('reportError');
      const errorMsg  = document.getElementById('reportErrorMsg');
      const bodyEl    = document.getElementById('reportBody');
      loadingEl.style.display = '';
      errorEl.style.display   = 'none';
      bodyEl.style.display    = 'none';

      try {
        const res = await fetch('/api/executive/report', {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) {
          let msg = `HTTP ${res.status}`;
          try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
          throw new Error(msg);
        }
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Report unavailable');

        setReportDate(data.generatedAt);
        renderReport(data);

        loadingEl.style.display = 'none';
        bodyEl.style.display    = '';
      } catch (err) {
        loadingEl.style.display = 'none';
        errorMsg.textContent    = err.message;
        errorEl.style.display   = '';
      }
    }

    setReportDate();
    loadReport();

    // ── Email Report ──
    // Captures the sections the picker checked, as read on screen. The page's
    // <style> blocks ride along with the CSS variables resolved to literal hex
    // values, so email clients render the colours even when they strip
    // <style>.
    function emailExecutiveReport(picked) {
      if (typeof window.openReportEmailModal !== 'function') {
        alert('Email module is still loading — please try again in a moment.');
        return;
      }
      const bodyEl = document.getElementById('reportBody');
      if (!bodyEl || bodyEl.style.display === 'none') {
        alert('The report is still loading.');
        return;
      }
      // The picker hands over what it checked. Called without a selection —
      // the whole report, in the order it is read on screen.
      const all      = reportSections();
      const sections = Array.isArray(picked) && picked.length ? picked : all;
      if (!sections.length) {
        alert('There is nothing to email yet — the report has no sections.');
        return;
      }
      // Resolve CSS variables to literal values so the email keeps colors
      // even when the email client strips <style> tags.
      const cs = getComputedStyle(document.documentElement);
      const vars = ['--bg','--surface','--surface2','--text','--muted','--border','--green','--red','--amber','--blue'];
      const resolved = vars
        .map(v => `${v}: ${cs.getPropertyValue(v).trim()};`)
        .join(' ');
      const styles = Array.from(document.querySelectorAll('style'))
        .map(s => s.innerHTML)
        .join('\n');
      const reportDate = document.getElementById('reportDate')?.textContent || '';
      // Clone the captured sections so we can apply email-safe inline
      // styles without mutating the live in-page report. The page CSS
      // uses color:#fff for headings/names (dark theme), which becomes
      // white-on-white on the email's light background — and selector
      // specificity beats the wrapper's inline color. Forcing color via
      // inline style on the clones guarantees the text shows up even
      // when the email client strips <style> blocks.
      const darkTextSel = '.pname-main, .pname-sub, .section-title, .page-title-h, .metric-value';
      const clones = sections.map(el => {
        const clone = el.cloneNode(true);
        // The per-division PDF buttons are page controls, not report content.
        clone.querySelectorAll('.section-action-btn').forEach(btn => btn.remove());
        clone.querySelectorAll(darkTextSel).forEach(node => {
          const isMuted = node.classList.contains('pname-sub');
          // A tone class already carries its own colour; overriding it would
          // flatten every metric to plain black.
          if (node.className && /\btone-/.test(node.className)) return;
          node.style.color = isMuted ? '#555' : '#111';
        });
        // Stack name + job-number vertically even when <style> is stripped
        // (the on-page layout relies on flex column on .pname).
        clone.querySelectorAll('.pname').forEach(node => { node.style.display = 'block'; });
        clone.querySelectorAll('.pname-main, .pname-sub').forEach(node => { node.style.display = 'block'; });
        return clone.outerHTML;
      });
      // A partial send says so, in the subject and above the report, so a
      // recipient reading three divisions doesn't take it for the whole
      // roll-up. The full report is left to read exactly as it did before.
      const names   = sections.map(sectionLabel);
      const partial = sections.length < all.length;
      const today   = new Date().toLocaleDateString();
      const subject = partial && names.length === 1
        ? `Executive Report: ${names[0]} — ${today}`
        : partial
          ? `Executive Report (${names.length} of ${all.length} sections) — ${today}`
          : `Executive Report — ${today}`;
      const scopeLine = partial
        ? `<div style="font-size:0.72rem;color:#555;margin-bottom:1rem;">Sections included: ${esc(names.join(' · '))}</div>`
        : '';

      // Order matters: include the page's original <style> blocks first, then
      // an override block that resolves :root CSS variables to literal hex
      // values. This way email clients that respect <style> get the same
      // theme variables (resolved values overriding the variables that
      // would otherwise need :root to resolve). Email clients that strip
      // <style> entirely fall back to plain text with the inline styles
      // already present on most elements.
      const wrapped = `
<div style="background:#fff;color:#111;padding:1.5rem;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">
  <style>${styles}\n:root { ${resolved} }</style>
  <div style="font-size:0.95rem;font-weight:700;margin-bottom:0.2rem;">Executive Report</div>
  <div style="font-size:0.78rem;color:#555;margin-bottom:${scopeLine ? '0.3rem' : '1rem'};">${reportDate}</div>
  ${scopeLine}
  ${clones.join('\n')}
</div>`;
      window.openReportEmailModal({
        reportType: 'executive',
        defaultSubject: subject,
        getHTML: () => wrapped,
      });
    }

    function signOut() {
      localStorage.removeItem('fct_token');
      localStorage.removeItem('fct_user');
      localStorage.removeItem('fct_division');
      window.location.replace('index.html');
    }

    // ── Section picker: what goes in the PDF, and what goes in the email ──
    // Both top-of-page buttons open the same checklist of everything the
    // report rendered, every box checked — the default is the whole report.
    // Unchecking a division drops it from the printout (through the same
    // @media print mechanism the per-division PDF buttons use, just with a
    // set of sections rather than a single one), or drops it out of the
    // emailed HTML. Nothing is remembered between openings: each run starts
    // from the full report again.
    const PICKER_ID = 'pdfPicker';

    // What the picker calls itself, and what it hands the checked sections
    // to. The two flows differ in nothing else.
    const PICKER_MODES = {
      pdf: {
        title: 'Generate Report',
        sub:   "Uncheck any section you don't want in the PDF.",
        cta:   'Generate PDF',
        tone:  'primary',
        icon:  `<polyline points="6 9 6 2 18 2 18 9"/>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                <rect x="6" y="14" width="12" height="8"/>`,
        run:   picked => printSections(picked),
        // Nothing to choose between — straight to the print dialog.
        empty: () => window.print(),
      },
      email: {
        title: 'Email Report',
        sub:   "Uncheck any section you don't want in the email.",
        cta:   'Continue to Email',
        tone:  'green',
        icon:  `<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>`,
        run:   picked => emailExecutiveReport(picked),
        empty: () => alert('There is nothing to email yet — the report has no sections.'),
      },
    };

    // Every section the report currently renders, in the order it is read.
    function reportSections() {
      return Array.from(document.querySelectorAll('#reportBody .section'));
    }

    // A section's name for the checklist, without the status pill that shares
    // its heading. Divisions carry it on the element; anything else falls back
    // to the rendered title.
    function sectionLabel(el) {
      if (el.dataset.sectionName) return el.dataset.sectionName;
      const title = el.querySelector('.section-title');
      if (!title) return 'Section';
      const clone = title.cloneNode(true);
      clone.querySelectorAll('.div-status').forEach(n => n.remove());
      return clone.textContent.trim() || 'Section';
    }

    // The "Email Report" button. The module that owns the email modal loads
    // deferred, so it is checked before the picker opens rather than after a
    // user has already worked through the checklist.
    function openEmailPicker() {
      if (typeof window.openReportEmailModal !== 'function') {
        alert('Email module is still loading — please try again in a moment.');
        return;
      }
      openReportPicker('email');
    }

    function openReportPicker(modeKey) {
      const mode   = PICKER_MODES[modeKey] || PICKER_MODES.pdf;
      const bodyEl = document.getElementById('reportBody');
      if (!bodyEl || bodyEl.style.display === 'none') {
        alert('The report is still loading.');
        return;
      }
      if (document.getElementById(PICKER_ID)) return;  // already open

      const sections = reportSections();
      if (!sections.length) { mode.empty(); return; }

      const rows = sections.map(el => {
        // The division's accent, read back off its own inline custom property.
        // Only a literal colour is echoed into the dot's style attribute.
        const accent = (el.style.getPropertyValue('--accent') || '').trim();
        const dot    = /^#[0-9a-fA-F]{3,8}$/.test(accent) ? ` style="background: ${accent};"` : '';
        const meta   = (el.querySelector('.section-sub')?.textContent || '').trim();
        return `
          <label class="picker-row">
            <input type="checkbox" checked />
            <span class="picker-dot"${dot}></span>
            <span class="picker-text">
              <span class="picker-name">${esc(sectionLabel(el))}</span>
              ${meta ? `<span class="picker-meta">${esc(meta)}</span>` : ''}
            </span>
          </label>`;
      }).join('');

      const wrap = document.createElement('div');
      wrap.id        = PICKER_ID;
      wrap.className = 'picker-backdrop';
      wrap.innerHTML = `
        <div class="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
          <div class="picker-head">
            <div>
              <div class="picker-title" id="pickerTitle">${esc(mode.title)}</div>
              <div class="picker-sub">${esc(mode.sub)}</div>
            </div>
            <button class="picker-x" id="pickerClose" aria-label="Cancel">&times;</button>
          </div>
          <div class="picker-tools">
            <button class="picker-link" id="pickerAll">Select all</button>
            <button class="picker-link" id="pickerNone">Clear all</button>
            <span class="picker-count" id="pickerCount"></span>
          </div>
          <div class="picker-list">${rows}</div>
          <div class="picker-foot">
            <button class="btn" id="pickerCancel">Cancel</button>
            <button class="btn ${mode.tone}" id="pickerGo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                ${mode.icon}
              </svg>
              ${esc(mode.cta)}
            </button>
          </div>
        </div>`;
      document.body.appendChild(wrap);

      // The checkboxes come back in the same order as `sections`, so an index
      // into one is an index into the other.
      const boxes   = Array.from(wrap.querySelectorAll('.picker-list input'));
      const countEl = wrap.querySelector('#pickerCount');
      const goBtn   = wrap.querySelector('#pickerGo');

      function sync() {
        const n = boxes.filter(b => b.checked).length;
        countEl.textContent = `${n} of ${boxes.length} section${boxes.length === 1 ? '' : 's'} included`;
        boxes.forEach(b => b.closest('.picker-row').classList.toggle('off', !b.checked));
        goBtn.disabled = n === 0;
      }
      const setAll = on => { boxes.forEach(b => { b.checked = on; }); sync(); };

      const onKey = ev => { if (ev.key === 'Escape') close(); };
      function close() {
        wrap.remove();
        document.removeEventListener('keydown', onKey);
      }

      boxes.forEach(b => b.addEventListener('change', sync));
      document.addEventListener('keydown', onKey);
      // Click outside to cancel, but only on the dim backdrop itself.
      wrap.addEventListener('click', ev => { if (ev.target === wrap) close(); });
      wrap.querySelector('#pickerClose').onclick  = close;
      wrap.querySelector('#pickerCancel').onclick = close;
      wrap.querySelector('#pickerAll').onclick    = () => setAll(true);
      wrap.querySelector('#pickerNone').onclick   = () => setAll(false);
      goBtn.onclick = () => {
        const picked = sections.filter((_, i) => boxes[i].checked);
        if (!picked.length) return;
        // Close first: the picker is a page control, not report content. The
        // print dialog captures whatever is in the DOM when it opens, and the
        // email modal captures the sections it is handed — neither should see
        // the checklist.
        close();
        mode.run(picked);
      };

      sync();
      setTimeout(() => goBtn.focus(), 30);
    }

    // Print a chosen set of sections: everything else is marked .print-omit and
    // hidden by the print stylesheet, and the first one that survives is
    // cleared of its forced page break so the PDF doesn't open on a blank
    // sheet. Cleanup takes the same two paths as printSection() — the classes
    // must not linger, or the next printout is silently truncated.
    function printSections(picked) {
      const all = reportSections();
      if (!picked.length) return;
      // The whole report: no scoping needed, which keeps the default path
      // identical to printing the page outright.
      if (picked.length === all.length) { window.print(); return; }

      const omitted = all.filter(el => !picked.includes(el));
      const first   = picked[0];
      omitted.forEach(el => el.classList.add('print-omit'));
      first.classList.add('print-first');
      document.body.classList.add('printing-picked');

      const mql = window.matchMedia('print');
      const cleanup = () => {
        document.body.classList.remove('printing-picked');
        omitted.forEach(el => el.classList.remove('print-omit'));
        first.classList.remove('print-first');
        window.removeEventListener('afterprint', cleanup);
        mql.removeEventListener?.('change', onMqlChange);
      };
      const onMqlChange = e => { if (!e.matches) cleanup(); };
      window.addEventListener('afterprint', cleanup, { once: true });
      mql.addEventListener?.('change', onMqlChange);
      window.print();
    }

    // ── PDF: native browser print, scoped to one section ──
    // The per-division "PDF" button — marking one section as the print scope
    // hides every other one via the @media print rules, so the user gets a
    // single-division PDF out of their browser's Save as PDF flow. The
    // top-of-page "Generate Report (PDF)" button does the same thing with a
    // set of sections instead of one; see printSections() below.
    function printSection(sectionId) {
      const target = document.getElementById(sectionId);
      if (!target) { window.print(); return; }
      target.classList.add('print-scope');
      document.body.classList.add('printing-scoped');
      // Two-path cleanup so the scope classes can't linger and break the
      // top-of-page "Generate Report (PDF)" button: afterprint covers
      // Chrome/Firefox/Edge/Safari 14+, the matchMedia('print') change
      // event covers older Safari / iOS that don't fire afterprint.
      const mql = window.matchMedia('print');
      const cleanup = () => {
        document.body.classList.remove('printing-scoped');
        target.classList.remove('print-scope');
        window.removeEventListener('afterprint', cleanup);
        mql.removeEventListener?.('change', onMqlChange);
      };
      const onMqlChange = e => { if (!e.matches) cleanup(); };
      window.addEventListener('afterprint', cleanup, { once: true });
      mql.addEventListener?.('change', onMqlChange);
      window.print();
    }

  </script>

</body>
</html>
