<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCT Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
    }

    header {
      background: #111118;
      border-bottom: 1px solid #2a2a3a;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1rem; font-weight: 700; color: #2ecc71; letter-spacing: 0.1em; text-transform: uppercase; }
    header span { font-size: 0.75rem; color: #555; }

    /* ── Auth gate ── */
    #auth-gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 57px);
    }

    .auth-card {
      background: #111118;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 2rem;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .auth-card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; color: #888; text-align: center; }

    /* ── Main panel ── */
    #main-panel { display: none; padding: 2rem; max-width: 960px; margin: 0 auto; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      background: #111118;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #2ecc71;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #2a2a3a;
    }

    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #777; }

    input, select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      background: #0a0a0f;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: #22c55e; }
    select option { background: #111118; }

    .btn {
      padding: 0.6rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-red   { background: #dc2626; color: #fff; font-size: 0.7rem; padding: 0.3rem 0.6rem; }
    .btn-ghost { background: #1e1e2e; color: #aaa; border: 1px solid #2a2a3a; }

    .result {
      font-size: 0.78rem;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      display: none;
    }
    .result.ok    { background: #052e16; color: #4ade80; border: 1px solid #166534; display: block; }
    .result.error { background: #2d0a0a; color: #f87171; border: 1px solid #7f1d1d; display: block; }

    /* ── Lists ── */
    .list-panel { display: flex; flex-direction: column; gap: 0; max-height: 280px; overflow-y: auto; }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.5rem;
      border-bottom: 1px solid #1a1a2a;
      font-size: 0.82rem;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .meta { font-size: 0.7rem; color: #555; }
    .badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-admin { background: #1e3a5f; color: #60a5fa; }
    .badge-user  { background: #1a2a1a; color: #4ade80; }
    .empty { font-size: 0.78rem; color: #444; text-align: center; padding: 1.5rem 0; }
  </style>
</head>
<body>

<header>
  <h1>FCT Admin Panel</h1>
  <span id="admin-label"></span>
</header>

<!-- ── Auth Gate ── -->
<div id="auth-gate">
  <div class="auth-card">
    <h2>Enter Admin Secret</h2>
    <div class="field">
      <label for="secret-input">Admin Secret</label>
      <input type="password" id="secret-input" placeholder="••••••••••••" />
    </div>
    <div class="result" id="auth-result"></div>
    <button class="btn btn-green" id="auth-btn">Unlock</button>
  </div>
</div>

<!-- ── Main Panel ── -->
<div id="main-panel">
  <div class="grid">

    <!-- Create Company -->
    <div class="panel">
      <div class="panel-title">Create / Update Company</div>
      <div class="field">
        <label>Company Code <span style="color:#555;font-weight:400;text-transform:none">(e.g. ACME)</span></label>
        <input type="text" id="co-code" placeholder="ACME" autocapitalize="characters" />
      </div>
      <div class="field">
        <label>Company Name</label>
        <input type="text" id="co-name" placeholder="Acme Corporation" />
      </div>
      <div class="result" id="co-result"></div>
      <button class="btn btn-green" id="co-btn">Create Company</button>
    </div>

    <!-- Companies List -->
    <div class="panel">
      <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Companies</span>
        <button class="btn btn-ghost" id="refresh-cos-btn" style="padding:0.25rem 0.75rem;font-size:0.7rem;">Refresh</button>
      </div>
      <div class="list-panel" id="companies-list"><div class="empty">Loading…</div></div>
    </div>

    <!-- Create User -->
    <div class="panel">
      <div class="panel-title">Create / Reset User</div>
      <div class="field">
        <label>Company Code</label>
        <input type="text" id="u-company" placeholder="ACME" autocapitalize="characters" />
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="u-username" placeholder="john" />
      </div>
      <div class="field">
        <label>Password <span style="color:#555;font-weight:400;text-transform:none">(min 8 chars)</span></label>
        <input type="password" id="u-password" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Role</label>
        <select id="u-role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="result" id="u-result"></div>
      <button class="btn btn-green" id="u-btn">Create User</button>
    </div>

    <!-- Users List -->
    <div class="panel">
      <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>Users</span>
        <button class="btn btn-ghost" id="refresh-users-btn" style="padding:0.25rem 0.75rem;font-size:0.7rem;">Refresh</button>
      </div>
      <div class="list-panel" id="users-list"><div class="empty">Loading…</div></div>
    </div>

  </div>

  <div style="margin-top:1.5rem;text-align:center;">
    <a href="index.html" class="btn btn-ghost">← Back to Login</a>
  </div>
</div>

<script>
let ADMIN_SECRET = '';

function showResult(id, msg, isOk) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'result ' + (isOk ? 'ok' : 'error');
}

// ── Auth ──────────────────────────────────────────
document.getElementById('auth-btn').addEventListener('click', async () => {
  const secret = document.getElementById('secret-input').value.trim();
  if (!secret) return;

  // Test the secret by hitting the companies list endpoint
  const r = await fetch(`/api/admin/companies?adminSecret=${encodeURIComponent(secret)}`);
  if (r.status === 403) {
    showResult('auth-result', 'Invalid admin secret.', false);
    return;
  }

  ADMIN_SECRET = secret;
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('main-panel').style.display = 'block';
  document.getElementById('admin-label').textContent = 'Authenticated';
  loadCompanies();
  loadUsers();
});

document.getElementById('secret-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('auth-btn').click();
});

// ── Companies ─────────────────────────────────────
async function loadCompanies() {
  const el = document.getElementById('companies-list');
  el.innerHTML = '<div class="empty">Loading…</div>';
  const r = await fetch(`/api/admin/companies?adminSecret=${encodeURIComponent(ADMIN_SECRET)}`);
  const data = await r.json();
  if (!data.companies || !data.companies.length) {
    el.innerHTML = '<div class="empty">No companies yet.</div>';
    return;
  }
  el.innerHTML = data.companies.map(c => `
    <div class="list-item">
      <div>
        <div style="font-weight:600">${c.name}</div>
        <div class="meta">Code: <strong style="color:#aaa">${c.code}</strong></div>
      </div>
    </div>
  `).join('');
}

document.getElementById('co-btn').addEventListener('click', async () => {
  const code = document.getElementById('co-code').value.trim();
  const name = document.getElementById('co-name').value.trim();
  if (!code || !name) { showResult('co-result', 'Both fields are required.', false); return; }

  const btn = document.getElementById('co-btn');
  btn.disabled = true;
  const r = await fetch('/api/admin/companies', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ adminSecret: ADMIN_SECRET, code, name }),
  });
  const data = await r.json();
  btn.disabled = false;

  if (data.ok) {
    showResult('co-result', `Company "${data.code}" saved.`, true);
    document.getElementById('co-code').value = '';
    document.getElementById('co-name').value = '';
    loadCompanies();
  } else {
    showResult('co-result', data.error || 'Error', false);
  }
});

document.getElementById('refresh-cos-btn').addEventListener('click', loadCompanies);

// ── Users ─────────────────────────────────────────
async function loadUsers() {
  const el = document.getElementById('users-list');
  el.innerHTML = '<div class="empty">Loading…</div>';
  const r = await fetch(`/api/admin/users?adminSecret=${encodeURIComponent(ADMIN_SECRET)}`);
  const data = await r.json();
  if (!data.users || !data.users.length) {
    el.innerHTML = '<div class="empty">No users yet.</div>';
    return;
  }
  el.innerHTML = data.users.map(u => `
    <div class="list-item">
      <div>
        <div style="font-weight:600">${u.username} <span class="badge badge-${u.role}">${u.role}</span></div>
        <div class="meta">${u.company_code}</div>
      </div>
      <button class="btn btn-red" onclick="deleteUser(${u.id}, '${u.username}')">Remove</button>
    </div>
  `).join('');
}

document.getElementById('u-btn').addEventListener('click', async () => {
  const companyCode = document.getElementById('u-company').value.trim();
  const username    = document.getElementById('u-username').value.trim();
  const password    = document.getElementById('u-password').value;
  const role        = document.getElementById('u-role').value;

  if (!companyCode || !username || !password) {
    showResult('u-result', 'All fields are required.', false); return;
  }

  const btn = document.getElementById('u-btn');
  btn.disabled = true;
  const r = await fetch('/api/admin/users', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ adminSecret: ADMIN_SECRET, companyCode, username, password, role }),
  });
  const data = await r.json();
  btn.disabled = false;

  if (data.ok) {
    showResult('u-result', `User "${data.username}" saved for ${data.companyCode}.`, true);
    document.getElementById('u-company').value  = '';
    document.getElementById('u-username').value = '';
    document.getElementById('u-password').value = '';
    loadUsers();
  } else {
    showResult('u-result', data.error || 'Error', false);
  }
});

document.getElementById('refresh-users-btn').addEventListener('click', loadUsers);

async function deleteUser(id, username) {
  if (!confirm(`Remove user "${username}"?`)) return;
  const r = await fetch('/api/admin/users', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ adminSecret: ADMIN_SECRET, id }),
  });
  const data = await r.json();
  if (data.ok) loadUsers();
  else alert(data.error || 'Error deleting user');
}
</script>
</body>
</html>
