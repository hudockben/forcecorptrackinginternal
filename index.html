<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataWatch — Sign In</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e0e0e0;
      overflow: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, #0b1512 0%, #080a09 70%);
      z-index: 0;
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .logo-wrap {
      text-align: center;
    }

    .logo-name {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #4fffaa 0%, #22c55e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.7));
      margin-bottom: 0.5rem;
    }

    .logo-title {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff 0%, #a0ffcc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 0.4rem;
    }

    .card {
      width: 100%;
      background: #111118;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-title {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #666;
      text-align: center;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #888;
    }

    input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: #0a0a0f;
      border: 1px solid #2a2a3a;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.15s;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
    }

    input::placeholder {
      color: #444;
    }

    .submit-btn {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s;
      box-shadow: 0 0 20px rgba(22, 163, 74, 0.3);
      margin-top: 0.25rem;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 24px rgba(22, 163, 74, 0.5);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-msg {
      font-size: 0.8rem;
      color: #ef4444;
      text-align: center;
      min-height: 1.2em;
      display: none;
    }

    .error-msg.visible {
      display: block;
    }

    .tagline {
      font-size: 0.8rem;
      color: #444;
      text-align: center;
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap input {
      padding-right: 2.6rem;
    }

    .pw-toggle {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: #555;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .pw-toggle:hover {
      color: #22c55e;
    }

    .pw-toggle svg {
      width: 18px;
      height: 18px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <canvas id="bgCanvas"></canvas>

  <main class="container">
    <div class="logo-wrap">
      <div class="logo-name">DataWatch</div>
      <div class="logo-title">Track. Analyze.<br>Optimize.</div>
    </div>

    <div class="card">
      <div class="card-title">Sign In to Your Account</div>

      <form id="loginForm" novalidate>
        <div style="display:flex;flex-direction:column;gap:1rem;">
          <div class="field">
            <label for="companyCode">Company Code</label>
            <input
              id="companyCode"
              type="text"
              placeholder="e.g. ACME"
              autocomplete="organization"
              autocapitalize="characters"
              spellcheck="false"
              required
            />
          </div>

          <div class="field">
            <label for="username">Username</label>
            <input
              id="username"
              type="text"
              placeholder="your username"
              autocomplete="username"
              spellcheck="false"
              required
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input
                id="password"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
                <!-- eye icon (visible) -->
                <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- eye-off icon (hidden) -->
                <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="error-msg" id="errorMsg"></div>

          <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
        </div>
      </form>
    </div>

    <div class="tagline">Real-time workforce intelligence for the modern enterprise.</div>
  </main>

  <script>
    // ── Floating nodes + connection lines background ───────────────────────
    (function () {
      const canvas = document.getElementById('bgCanvas');
      const ctx    = canvas.getContext('2d');
      const LINK_DIST  = 200;
      const NODE_COUNT = 110;

      // Multi-color palette: green, cyan, blue-purple, amber
      const COLORS = [
        { r: 34,  g: 197, b: 94  },  // green
        { r: 0,   g: 220, b: 255 },  // cyan
        { r: 139, g: 92,  b: 246 },  // violet
        { r: 251, g: 191, b: 36  },  // amber
      ];

      let W, H, nodes;

      function makeNode() {
        const c = COLORS[Math.floor(Math.random() * COLORS.length)];
        return {
          x:  Math.random() * W,
          y:  Math.random() * H,
          vx: (Math.random() - 0.5) * 0.65,
          vy: (Math.random() - 0.5) * 0.65,
          r:  2 + Math.random() * 3,
          c,
        };
      }

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
        nodes = Array.from({ length: NODE_COUNT }, makeNode);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Update positions
        for (const n of nodes) {
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > W) n.vx *= -1;
          if (n.y < 0 || n.y > H) n.vy *= -1;
        }

        // Draw connections — blend the two endpoint colors
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx   = nodes[i].x - nodes[j].x;
            const dy   = nodes[i].y - nodes[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < LINK_DIST) {
              const alpha = (1 - dist / LINK_DIST) * 0.55;
              const ci = nodes[i].c, cj = nodes[j].c;
              const mr = Math.round((ci.r + cj.r) / 2);
              const mg = Math.round((ci.g + cj.g) / 2);
              const mb = Math.round((ci.b + cj.b) / 2);
              ctx.strokeStyle = `rgba(${mr},${mg},${mb},${alpha.toFixed(2)})`;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }
          }
        }

        // Draw nodes with glow
        for (const n of nodes) {
          const { r: cr, g: cg, b: cb } = n.c;
          // outer glow
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r * 3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${cr},${cg},${cb},0.12)`;
          ctx.fill();
          // inner glow
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r * 1.6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${cr},${cg},${cb},0.30)`;
          ctx.fill();
          // solid core
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${cr},${cg},${cb},0.90)`;
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();
  </script>

  <script>
    // Redirect if already logged in
    (function () {
      const token = localStorage.getItem('fct_token');
      if (token) window.location.replace('tracker.html');
    })();

    const form      = document.getElementById('loginForm');
    const errorMsg  = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function clearError() {
      errorMsg.classList.remove('visible');
    }

    // Password show/hide toggle
    const pwToggle  = document.getElementById('pwToggle');
    const pwInput   = document.getElementById('password');
    const eyeOpen   = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    pwToggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type       = show ? 'text' : 'password';
      eyeOpen.style.display   = show ? 'none'  : '';
      eyeClosed.style.display = show ? ''      : 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const companyCode = document.getElementById('companyCode').value.trim();
      const username    = document.getElementById('username').value.trim();
      const password    = document.getElementById('password').value;

      if (!companyCode || !username || !password) {
        showError('All fields are required.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyCode, username, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Sign-in failed. Please try again.');
          return;
        }

        // Persist token + user info
        localStorage.setItem('fct_token', data.token);
        localStorage.setItem('fct_user',  JSON.stringify(data.user));

        window.location.replace('tracker.html');
      } catch {
        showError('Network error — please check your connection.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
