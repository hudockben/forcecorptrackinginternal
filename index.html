<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForceCorpTracking</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e0e0e0;
      overflow: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, #1a1a2e 0%, #0a0a0f 70%);
      z-index: 0;
    }

    .background::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 80%, rgba(0, 200, 100, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 180, 80, 0.08) 0%, transparent 50%);
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .logo {
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #2ecc71;
      font-weight: 600;
      opacity: 0.9;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff 0%, #a0ffcc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1.1rem;
      color: #888;
      max-width: 420px;
      line-height: 1.6;
    }

    .enter-btn {
      margin-top: 1rem;
      padding: 0.85rem 3rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 0 20px rgba(22, 163, 74, 0.35);
    }

    .enter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 32px rgba(22, 163, 74, 0.55);
    }

    .enter-btn:hover::before {
      opacity: 1;
    }

    .enter-btn:active {
      transform: translateY(0);
      box-shadow: 0 0 16px rgba(22, 163, 74, 0.4);
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="grid-lines"></div>

  <main class="container">
    <span class="logo">ForceCorpTracking</span>
    <h1>Track. Analyze.<br>Optimize.</h1>
    <p class="tagline">Real-time workforce intelligence for the modern enterprise.</p>
    <button class="enter-btn" onclick="window.location.href='tracker.html'">Enter</button>
  </main>
</body>
</html>
