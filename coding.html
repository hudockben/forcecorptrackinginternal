<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 11l3 3L22 4'/><path d='M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11'/></svg>" />
  <title>Code Time</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg:#0a0a0f; --surface:#14141d; --surface2:#1c1c28; --border:#2a2a3a;
      --accent:#f59e0b; --accent-d:#b45309; --text:#e8e8ee; --muted:#888;
      --green:#22c55e; --amber:#facc15; --blue:#60a5fa; --red:#ef4444;
    }
    html, body { height:100%; overscroll-behavior-y:none; }
    body {
      background:var(--bg); color:var(--text); font-size:16px; line-height:1.4;
      font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      padding-bottom:env(safe-area-inset-bottom, 0);
    }
    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:0.9rem 1rem; padding-top:calc(0.9rem + env(safe-area-inset-top, 0));
      background:var(--surface); border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:50;
    }
    .brand { font-size:0.65rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent); font-weight:700; }
    .brand small { display:block; letter-spacing:0.12em; color:var(--muted); font-size:0.58rem; margin-top:2px; }
    .header-right { display:flex; align-items:center; gap:0.6rem; }
    .icon-btn {
      background:none; border:1px solid var(--border); color:var(--muted);
      padding:0.5rem 0.7rem; border-radius:6px; font-size:0.65rem; font-weight:600;
      letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; font-family:inherit;
    }
    .icon-btn:active { color:var(--text); border-color:#555; }

    main { max-width:680px; margin:0 auto; padding:1rem; display:flex; flex-direction:column; gap:0.85rem; }

    .daybar { display:flex; align-items:center; gap:0.5rem; }
    .daybar .nav {
      flex:none; min-width:46px; min-height:46px; border-radius:10px;
      background:var(--surface); border:1px solid var(--border); color:var(--text);
      font-size:1.15rem; cursor:pointer; font-family:inherit;
    }
    .daybar .nav:active { background:var(--surface2); }
    .daybar .lbl { flex:1; text-align:center; }
    .daybar .lbl .d { font-size:0.95rem; font-weight:700; }
    .daybar .lbl .s { font-size:0.7rem; color:var(--muted); }
    .daybar .lbl .s.today { color:var(--amber); font-weight:700; }

    .note {
      background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
      border-radius:8px; padding:0.7rem 0.8rem; font-size:0.78rem; color:var(--muted); line-height:1.5;
    }
    .note strong { color:var(--text); }

    .jobgroup { display:flex; flex-direction:column; gap:0.5rem; }
    .jobhead {
      font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase;
      color:var(--accent); font-weight:700; padding:0.2rem 0.1rem;
    }
    .card {
      background:var(--surface); border:1px solid var(--border);
      border-left:3px solid var(--border); border-radius:10px;
      padding:0.8rem 0.9rem; display:flex; gap:0.7rem; align-items:center;
      cursor:pointer;
    }
    .card:active { background:var(--surface2); }
    .card.coded { border-left-color:var(--green); }
    .card.stale { border-left-color:var(--red); }
    /* Already approved once and sent back: the codes on it are the
       supervisor's, not a foreman's. */
    .card.sentback { border-left-color:var(--amber); }
    .card .who { flex:1; min-width:0; }
    .card .who .n { font-size:0.95rem; font-weight:700; }
    .card .who .m { font-size:0.74rem; color:var(--muted); margin-top:2px; }
    .card .hrs { flex:none; text-align:right; }
    .card .hrs .h { font-size:1.05rem; font-weight:800; font-variant-numeric:tabular-nums; }
    .card .hrs .s { font-size:0.66rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
    .pill {
      display:inline-block; margin-top:4px; padding:0.1rem 0.45rem; border-radius:999px;
      font-size:0.66rem; font-weight:700;
    }
    .pill.ok   { color:#86efac; background:rgba(34,197,94,0.14); }
    .pill.warn { color:#fca5a5; background:rgba(239,68,68,0.14); }
    .pill.sup  { color:#fbbf24; background:rgba(245,158,11,0.14); }

    .empty { text-align:center; color:var(--muted); font-size:0.85rem; padding:2.5rem 1rem; line-height:1.6; }

    /* ── Coding sheet ── */
    .backdrop {
      position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:100;
      display:none; align-items:flex-end; justify-content:center;
    }
    .backdrop.open { display:flex; }
    .sheet {
      background:var(--bg); border-top:1px solid var(--border);
      border-radius:14px 14px 0 0; width:100%; max-width:680px;
      max-height:92vh; display:flex; flex-direction:column;
    }
    .sheet-head {
      padding:0.9rem 1rem; border-bottom:1px solid var(--border);
      display:flex; align-items:flex-start; justify-content:space-between; gap:0.8rem;
    }
    .sheet-head .t { font-size:0.95rem; font-weight:700; }
    .sheet-head .s { font-size:0.74rem; color:var(--muted); margin-top:2px; }
    .sheet-body { padding:0.9rem 1rem; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:0.7rem; }
    .sheet-foot {
      padding:0.8rem 1rem; padding-bottom:calc(0.8rem + env(safe-area-inset-bottom, 0));
      border-top:1px solid var(--border); display:flex; gap:0.6rem; align-items:center;
    }
    .tally { flex:1; font-size:0.78rem; font-variant-numeric:tabular-nums; }
    .tally.bad { color:#fca5a5; }
    .tally.good { color:#86efac; }

    .srow {
      border:1px solid var(--border); border-radius:10px; padding:0.7rem;
      display:flex; flex-direction:column; gap:0.5rem; background:var(--surface);
    }
    .srow.travel { border-left:3px solid var(--blue); }
    /* A machine's own line. Green because it is not somebody's time: its hours
       bill the job for iron, and the tally below counts none of them. */
    .srow.equip { border-left:3px solid var(--green); }
    .srow-top { display:flex; align-items:center; justify-content:space-between; gap:0.5rem; }
    .srow-tag { font-size:0.64rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); font-weight:700; }
    .srow-del {
      background:none; border:1px solid var(--border); color:var(--muted);
      border-radius:6px; padding:0.25rem 0.5rem; font-size:0.66rem; cursor:pointer; font-family:inherit;
    }
    .fld { display:flex; flex-direction:column; gap:0.2rem; }
    .fld label { font-size:0.64rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); font-weight:700; }
    .fld select, .fld input {
      background:var(--surface2); border:1px solid var(--border); color:var(--text);
      border-radius:8px; padding:0.6rem 0.55rem; font-size:0.9rem; font-family:inherit; width:100%;
      min-height:44px;
    }
    .fld select:focus, .fld input:focus { outline:none; border-color:var(--accent); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; }
    .fld .hint { font-size:0.68rem; color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0; }
    .fld label .req { color:var(--accent); }
    /* The machine block, set apart from the codes above it so a row reads as
       two questions — what phase, and what iron — rather than six boxes. */
    .eqbox {
      border-top:1px dashed var(--border); padding-top:0.5rem;
      display:flex; flex-direction:column; gap:0.5rem;
    }
    .eqbox .eqhead { font-size:0.64rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); font-weight:700; }
    .addrow { display:flex; gap:0.5rem; }
    .addrow .btn.add { flex:1; }
    .tally .sub { display:block; font-size:0.66rem; color:var(--muted); font-weight:400; }

    .btn {
      border:none; border-radius:9px; padding:0.75rem 1.1rem; font-size:0.82rem;
      font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
      cursor:pointer; font-family:inherit; min-height:46px;
    }
    .btn.primary { background:var(--accent); color:#1a1205; }
    .btn.primary:disabled { opacity:0.45; cursor:not-allowed; }
    .btn.ghost { background:none; border:1px solid var(--border); color:var(--muted); }
    .btn.add { background:none; border:1px dashed var(--border); color:var(--muted); width:100%; }

    .msg { font-size:0.78rem; padding:0.55rem 0.7rem; border-radius:8px; display:none; }
    .msg.show { display:block; }
    .msg.err { color:#fca5a5; background:rgba(239,68,68,0.12); }
    .msg.ok  { color:#86efac; background:rgba(34,197,94,0.12); }

    .toast {
      position:fixed; left:50%; bottom:1.5rem; transform:translateX(-50%) translateY(200%);
      background:var(--surface2); border:1px solid var(--border); color:var(--text);
      padding:0.7rem 1.1rem; border-radius:9px; font-size:0.82rem; z-index:200;
      transition:transform 0.22s ease; max-width:90vw;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <div class="brand">Code Time<small id="brandSub">—</small></div>
    <div class="header-right">
      <button class="icon-btn" onclick="goToDivisions()">Menu</button>
      <button class="icon-btn" onclick="logout()">Out</button>
    </div>
  </header>

  <main id="main"></main>

  <div class="backdrop" id="backdrop">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="t" id="sheetTitle">—</div>
          <div class="s" id="sheetSub">—</div>
        </div>
        <button class="icon-btn" onclick="closeSheet()">Close</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot">
        <div class="tally" id="tally">—</div>
        <button class="btn ghost" onclick="closeSheet()">Cancel</button>
        <button class="btn primary" id="saveBtn" onclick="saveCoding()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ═══════ Auth ═══════
     *
     * This page is the CODER's half of payroll. A foreman running a site his
     * supervisor cannot reach every day fills in the cost codes here; the
     * supervisor still approves the time in payroll.html, and nothing entered
     * on this page reaches job cost until he does.
     *
     * It is a separate page rather than a mode of payroll.html on purpose.
     * Every control on that console renders unconditionally below its one page
     * gate, so "hide what a coder may not use" would be a promise spread over
     * thousands of lines and broken by the first button anyone adds later.
     * This page can do exactly one thing, and the server refuses him the rest
     * regardless — see payrollAccess in api/lib/auth.js.
     */
    const API   = '/api';
    const token = localStorage.getItem('fct_token');
    const user  = (() => { try { return JSON.parse(localStorage.getItem('fct_user')); } catch { return null; } })();
    if (!token || !user) window.location.replace('index.html');

    const isPlatformAdmin  = Boolean(user && user.isPlatformAdmin);
    const allowedDivisions = Array.isArray(user && user.allowedDivisions) ? user.allowedDivisions : [];
    const hasPayroll = isPlatformAdmin || allowedDivisions.includes('payroll');

    /* ═══════ State ═══════ */
    let state = { date: todayStr(), entries: [], loading: true, error: null, ownFiled: null };
    let sheet = null;   // { entry, rows, codes, saving }

    const DIV_LABEL = { turf:'Turf', paving:'Paving', kiewit:'Kiewit' };

    function pad(n) { return String(n).padStart(2, '0'); }
    function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function todayStr() { return dstr(new Date()); }
    function parseD(ds) { return new Date(ds + 'T12:00:00'); }
    function addDays(ds, n) { const d = parseD(ds); d.setDate(d.getDate() + n); return dstr(d); }
    const esc = s => String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const n2 = n => (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);

    function authHeaders(json) {
      const h = { Authorization: 'Bearer ' + token };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }

    function goToDivisions() { localStorage.removeItem('fct_division'); window.location.replace('divisions.html'); }
    function logout() {
      localStorage.removeItem('fct_token');
      localStorage.removeItem('fct_user');
      localStorage.removeItem('fct_division');
      window.location.replace('index.html');
    }

    let toastT = null;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastT);
      toastT = setTimeout(() => el.classList.remove('show'), 2600);
    }

    const r2 = n => Math.round((Number(n) || 0) * 100) / 100;

    /** The day's WORK hours — the punch clock, less the break. Fixed: nothing
     *  on this page can move it, and every work row on the sheet has to add up
     *  to exactly this. */
    function workHours(e) { return r2(e.computed_hours); }

    /** The drive AS FILED, which is the employee's own answer and the figure
     *  the day currently pays. The coder may propose a different one — see
     *  sheetTravel — and until a supervisor applies it, this is still the
     *  number that counts. */
    function filedTravel(e) { return r2(e.travel_hours); }

    /** The figure a split has to add up to — the same one the server balances
     *  against (splitExpectedHours in api/timesheet-entries.js). Work plus
     *  travel, because a travel row is part of the day's allocation.
     *
     *  `travel` overrides the filed drive, which is what a sheet proposing its
     *  own passes. Left out, this is the day exactly as filed. */
    function requiredHours(e, travel) {
      // `== null` and nothing cleverer — see splitExpectedHours in
      // api/timesheet-entries.js. Number.isFinite(Number(travel)) reads NULL as
      // a deliberate zero, because Number(null) is 0 and 0 is finite; that made
      // proposalStale below measure every proposal carrying no drive of its own
      // against the WORK hours alone, so a day with travel on it — a proposal
      // written before that column existed, or an approver's split written back
      // over one — came back "codes no longer add up, redo" with nothing wrong
      // with it, and opening it threw his codes away.
      return r2(workHours(e) + (travel == null ? filedTravel(e) : (Number(travel) || 0)));
    }

    /** The drive a stored proposal was written with — his figure, not the
     *  entry's, and null where the proposal predates the question. */
    function proposedTravel(e) {
      return (e && e.proposed_travel_hours != null) ? r2(e.proposed_travel_hours) : null;
    }

    /** Is the proposal already on this entry still describing this day? Payroll
     *  can edit hours on a submitted entry, and a split written against the old
     *  figure will not save. Mirrors the same check in payroll.html.
     *
     *  A proposal carrying its OWN drive is measured against that, not against
     *  the entry: coded_for_hours is work + HIS travel by construction, so
     *  comparing it to the filed day would mark every travel proposal stale and
     *  throw away codes nobody has looked at yet. What makes one stale is the
     *  same thing it always was — the WORK hours moving underneath it. */
    function proposalStale(e) {
      if (!Array.isArray(e.proposed_split) || !e.proposed_split.length) return false;
      if (e.coded_for_hours == null) return false;
      const pt = proposedTravel(e);
      return Math.abs(Number(e.coded_for_hours) - requiredHours(e, pt)) > 0.001;
    }

    /** Does this entry carry a drive somebody has proposed and nobody has
     *  applied? Worth saying on the card: the hours on it are not the hours
     *  the day will pay until a supervisor acts. */
    function travelPending(e) {
      const pt = proposedTravel(e);
      return pt != null && Math.abs(pt - filedTravel(e)) > 0.001 && !proposalStale(e);
    }

    /* ═══════ Load ═══════ */
    async function load() {
      state.loading = true; state.error = null; render();
      try {
        const qs = new URLSearchParams({
          scope: 'crew', status: 'submitted', from: state.date, to: state.date,
        });
        const r = await fetch(`${API}/timesheet-entries?${qs}`, { headers: authHeaders() });
        const j = await r.json();
        if (!r.ok) throw new Error((j && j.error) || `Could not load (${r.status})`);
        state.entries = Array.isArray(j.entries) ? j.entries : [];
      } catch (err) {
        state.error = err.message;
        state.entries = [];
      }

      // An empty queue has several causes and only one of them is the coder's
      // to act on. Scope comes from HIS OWN submitted day — a draft confers
      // nothing, because a draft costs nothing to create against any job — so
      // opening this page before sending his own time in shows him an empty
      // list, and that is the order people naturally try first. Worth one
      // extra read on the empty path to tell him which of the reasons it is
      // rather than leaving him with a blank screen and three maybes.
      //
      // This request carries no scope, so the server returns his own rows.
      state.ownFiled = null;
      if (!state.error && !state.entries.length) {
        try {
          const qs2 = new URLSearchParams({ from: state.date, to: state.date });
          const r2 = await fetch(`${API}/timesheet-entries?${qs2}`, { headers: authHeaders() });
          const j2 = await r2.json();
          const mine = (r2.ok && Array.isArray(j2.entries)) ? j2.entries : [];
          state.ownFiled = mine.some(x => x.entry_type === 'daily' && x.job_id
            && (x.status === 'submitted' || x.status === 'approved'));
        } catch { state.ownFiled = null; }
      }
      state.loading = false;
      render();
    }

    /* ═══════ Render ═══════ */
    function render() {
      document.getElementById('brandSub').textContent = (user && user.username) || '';
      const main = document.getElementById('main');

      if (!hasPayroll) {
        main.innerHTML = `<div class="empty">This page is for entering cost codes on your crew's time.<br>Your account does not have access to it.</div>`;
        return;
      }

      const d = parseD(state.date);
      const isToday = state.date === todayStr();
      const dayLbl = d.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });

      let body;
      if (state.loading) {
        body = `<div class="empty">Loading…</div>`;
      } else if (state.error) {
        body = `<div class="empty" style="color:#fca5a5">${esc(state.error)}</div>`;
      } else if (!state.entries.length) {
        // The reason matters more than the fact. When we know he simply has
        // not filed his own day yet, say that and point at the fix — "no
        // entries" on its own reads like the feature is broken.
        body = state.ownFiled == null
          ? `<div class="empty">
              Nothing to code for this day.<br><br>
              You code the crew of a job <strong>you worked yourself</strong>, and only
              turf, paving and kiewit jobs are coded here.
            </div>`
          : state.ownFiled === false
          ? `<div class="empty">
              You have not submitted your own time for this day yet.<br><br>
              You code the crew of a job <strong>you worked yourself</strong>, so send your
              own day in first and your crew's days will appear here.<br><br>
              <a class="btn primary" style="display:inline-block;text-decoration:none"
                 href="timesheet.html">Go to my timesheet</a>
            </div>`
          : `<div class="empty">
              Nothing to code for this day.<br><br>
              You have filed your own day, so this will fill in once your men submit
              theirs. Only turf, paving and kiewit jobs are coded here.
            </div>`;
      } else {
        body = renderGroups();
      }

      main.innerHTML = `
        <div class="daybar">
          <button class="nav" onclick="shiftDay(-1)" aria-label="Previous day">‹</button>
          <div class="lbl">
            <div class="d">${esc(dayLbl)}</div>
            <div class="s ${isToday ? 'today' : ''}">${isToday ? 'Today' : esc(state.date)}</div>
          </div>
          <button class="nav" onclick="shiftDay(1)" aria-label="Next day">›</button>
        </div>
        <div class="note">
          Enter the cost codes for what your crew actually did — a
          <strong>cost code and a sub code on every line</strong>, the travel each man
          really had, and any machine he ran with its hours. Your supervisor
          still approves the time — <strong>nothing here pays anybody or posts to the
          job</strong> until he does, and he can change anything you enter.
        </div>
        ${body}
      `;
    }

    function renderGroups() {
      const byJob = new Map();
      for (const e of state.entries) {
        const key = e.division + '||' + e.job_id;
        if (!byJob.has(key)) byJob.set(key, { label: e.job_label || e.job_id, division: e.division, rows: [] });
        byJob.get(key).rows.push(e);
      }
      const out = [];
      for (const g of byJob.values()) {
        g.rows.sort((a, b) => String(a.username).localeCompare(String(b.username)));
        out.push(`
          <div class="jobgroup">
            <div class="jobhead">${esc(DIV_LABEL[g.division] || g.division)} · ${esc(g.label)}</div>
            ${g.rows.map(cardHtml).join('')}
          </div>
        `);
      }
      return out.join('');
    }

    function cardHtml(e) {
      const coded = Array.isArray(e.proposed_split) && e.proposed_split.length;
      const stale = proposalStale(e);
      // WHO put those codes there. The approver's own accepted split is stored
      // in the same place as a proposal — it has to be, so that un-approving a
      // day cannot resurrect the first draft over his correction — and an
      // un-approved day is 'submitted' again, so it lands back here. Showing
      // it as "coded · Allen Strick" reads as though a foreman had entered it
      // and invites somebody to type over a decision his supervisor already
      // made, without ever saying that is what is happening.
      const bySup = coded && e.coded_source === 'approve';
      const cls = stale ? 'stale' : (bySup ? 'sentback' : (coded ? 'coded' : ''));
      const pill = stale
        ? `<span class="pill warn">codes no longer add up — redo</span>`
        : bySup
          ? `<span class="pill sup">sent back — ${esc(e.coded_by_name || 'your supervisor')} had coded it</span>`
          : coded
            ? `<span class="pill ok">coded${e.coded_by_name ? ' · ' + esc(e.coded_by_name) : ''}</span>`
            : '';
      // A drive somebody asked for and nobody has granted. Said as its own
      // pill rather than folded into the hours: the big figure on the right is
      // what the day PAYS today, and a card that quietly showed the proposed
      // total would read as though the change had already gone through.
      const pending = travelPending(e);
      const tPill = pending
        ? `<span class="pill sup">travel ${n2(proposedTravel(e))}h proposed — waiting on your supervisor</span>`
        : '';
      const travel = filedTravel(e);
      return `
        <div class="card ${cls}" onclick="openSheet('${esc(e.id)}')">
          <div class="who">
            <div class="n">${esc(e.username)}</div>
            <div class="m">${esc(e.start_time || '')}–${esc(e.end_time || '')}${travel > 0 ? ` · ${n2(travel)}h travel` : ''}${e.lunch_break ? ' · lunch' : ''}</div>
            ${pill}${tPill}
          </div>
          <div class="hrs">
            <div class="h">${n2(requiredHours(e))}</div>
            <div class="s">hours</div>
          </div>
        </div>
      `;
    }

    function shiftDay(n) { state.date = addDays(state.date, n); load(); }

    /* ═══════ The company's machines ═══════
     *
     * Fetched once and shared by every sheet, exactly as timesheet.html and
     * payroll's split modal do it — the same list, so a name a foreman picks
     * here is one the cost row already understands and nothing has to be
     * translated at approval.
     *
     * Narrowed to the day's OWN division when the server says which lists hold
     * each machine. A paving foreman scrolling turf's mowers to find his paver
     * is how the wrong machine gets billed; an older server sends no
     * `divisions` key at all, nothing lands in a bucket, and every sheet falls
     * back to the flat list, which is no worse than having no picker.
     *
     * A non-2xx is never cached. Falling through to `[]` — which is truthy —
     * left one expired-token 401 holding an empty picker for the rest of the
     * session, and an empty picker reads as "there is nothing to answer here".
     */
    let equipNames        = null;
    let equipByDivision   = null;
    let equipPromise      = null;
    // 'ok' | 'failed'. A picker holding nothing reads as "there is nothing to
    // answer here", and the coder types a machine name from memory instead —
    // which is the one spelling the equipment list does not know, and a name it
    // does not know prices at nothing when the job is billed. The cost codes
    // already say when their lookup failed; this says it the same way.
    let equipState = 'ok';
    function equipLoad() {
      if (equipNames) return Promise.resolve(equipNames);
      if (!equipPromise) {
        equipPromise = fetch(`${API}/equipment`, { headers: authHeaders() })
          .then(r => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
          .then(j => {
            const rows = (j && Array.isArray(j.equipment) ? j.equipment : [])
              .filter(x => x && x.name)
              .sort((a, b) => String(a.name).localeCompare(String(b.name)));
            const byDiv = {};
            for (const x of rows) {
              for (const d of (Array.isArray(x.divisions) ? x.divisions : [])) {
                (byDiv[d] || (byDiv[d] = [])).push(String(x.name));
              }
            }
            equipByDivision = byDiv;
            equipNames = rows.map(x => String(x.name));
            equipState = 'ok';
            return equipNames;
          })
          .catch(err => {
            console.error('[coding] equipment list failed to load:', err.message);
            equipPromise = null;
            equipState = 'failed';
            return null;
          });
      }
      return equipPromise;
    }

    /** The machines THIS sheet may name — its division's list, falling back to
     *  the whole company where that division keeps none. */
    function equipNamesFor(div) {
      const own = (div && equipByDivision) ? equipByDivision[div] : null;
      return (own && own.length) ? own : (equipNames || []);
    }

    /** What the man himself said he ran, in one shape: [{ name, hours }]. A
     *  bare string in an older row reads as a machine with no hours. Mirrors
     *  equipUsedPieces in payroll.html. */
    function equipUsedPieces(e) {
      if (!Array.isArray(e && e.equipment_used)) return [];
      return e.equipment_used
        .map(x => (x && typeof x === 'object') ? x : { name: x })
        .map(x => ({
          name:  String((x && x.name) || '').trim(),
          hours: (x && x.hours != null && Number.isFinite(Number(x.hours))) ? Number(x.hours) : null,
        }))
        .filter(x => x.name);
    }

    /* ═══════ The pickup, and where the drive books ═══════ */

    /**
     * The crew's pickup is not a machine that worked the job — it is how they
     * got there. Its cost belongs on the TRAVEL line, under the travel sub
     * code, which is where the drive is already booked.
     *
     * Copied verbatim from splitEquipIsPickup in payroll.html (and
     * timesheet.html has a third identical copy): matched on the WORD, because
     * the equipment list spells it differently from company to company —
     * "Pickup", "Pickup Truck", "F-250 Pickup", "Pick-up" — and deliberately
     * NOT on "truck", because a Triaxle Dump Truck is a haul unit and has
     * nothing to do with the drive.
     */
    function isPickup(name) {
      return /\bpick\s*-?\s*ups?\b/i.test(String(name == null ? '' : name));
    }

    /* ═══════ Which line the drive books to ═══════
     *
     * THE JOB'S OWN BID ITEMS DECIDE, not a constant. On a turf job the rule
     * below returns Mobilization / Travel by itself, because that is what turf's
     * bid items say — so hardcoding the pair would buy nothing there and would
     * be wrong everywhere else. Paving files the drive under the TASK ("5in
     * Mill & Fill Travel" beside "5in Mill & Fill"), so the answer is not
     * knowable until the work row names a cost code, and a job that carries no
     * travel line at all has no right answer to guess at.
     *
     * Same rules payroll.html applies in the approve modal — see
     * splitTravelCandidates / splitPickTravelCodes there. A wrong code books a
     * day's cost to the wrong task and reads as filled-in while it does it, so
     * every one of them refuses rather than guesses.
     */
    const TRAVEL_CODE_RE = /\btravel\b/i;

    /** Every (cost code, sub code) pair on this job that IS the drive. */
    function travelCandidates(codes) {
      const out = [];
      for (const c of (Array.isArray(codes) ? codes : [])) {
        if (!c) continue;
        const cc   = String(c.cost_code || '').trim();
        const subs = (Array.isArray(c.sub_codes) ? c.sub_codes : [])
                       .map(x => String(x == null ? '' : x).trim());
        const travelSubs = subs.filter(x => TRAVEL_CODE_RE.test(x));
        if (travelSubs.length) {
          for (const x of travelSubs) out.push({ cost_code: cc, sub_code: x });
        } else if (TRAVEL_CODE_RE.test(cc)) {
          // The cost code itself is the drive. A lone sub code under it comes
          // along; several are a real choice, so only the cost code is offered.
          out.push({ cost_code: cc, sub_code: subs.length === 1 ? subs[0] : '' });
        }
      }
      return out;
    }

    /** The travel sub codes this job files under one cost code — what the
     *  travel row's picker offers instead of the whole list. */
    function travelSubsFor(codes, costCode) {
      const cc = String(costCode || '').trim();
      if (!cc) return [];
      return travelCandidates(codes)
        .filter(c => c.cost_code === cc && c.sub_code)
        .map(c => c.sub_code);
    }

    /**
     * Which travel line belongs on the row, given what the work is booked to.
     * Returns null when the job leaves it genuinely open — a blank pair is what
     * the foreman gets today, and a wrong guess costs more to notice and undo
     * than an empty box costs to fill.
     */
    function pickTravelCodes(codes, workCostCode) {
      const cands = travelCandidates(codes);
      if (!cands.length) return null;
      // Paving pairs the drive with the task — hours worked on 5" Mill & Fill
      // drive under 5" Mill & Fill Travel — so once the work row names a cost
      // code, that code decides it.
      const work = String(workCostCode || '').trim();
      if (work) {
        const paired = cands.filter(c => c.cost_code === work);
        if (paired.length === 1) return paired[0];
        // Several travel lines under the one task: fill the cost code and leave
        // the sub code, whose picker is now filtered down to just those.
        if (paired.length > 1) return { cost_code: work, sub_code: '' };
        // Some jobs file the drive as a cost code of its own, named after the
        // task it belongs to: "5in Mill & Fill Travel" sitting beside "5in Mill
        // & Fill". Take the travel word out and what is left is the task, which
        // is what pairs them. Punctuation and spacing go too — the two lines are
        // typed by hand and rarely agree on either.
        const key = t => String(t || '').toLowerCase()
                           .replace(/\btravel\b/g, ' ').replace(/[^a-z0-9]+/g, '');
        const wk = key(work);
        if (wk) {
          const named = cands.filter(c => key(c.cost_code) === wk);
          if (named.length === 1) return named[0];
        }
      }
      if (cands.length === 1) return cands[0];
      const codesOnly = [...new Set(cands.map(c => c.cost_code))];
      if (codesOnly.length === 1) return { cost_code: codesOnly[0], sub_code: '' };
      return null;
    }

    /**
     * Fill the travel row's codes in from the job's own bid items.
     *
     * ONLY A ROW WITH BOTH CELLS STILL BLANK. That one test is the whole guard:
     * it cannot overwrite the foreman, it cannot fight the harvest, and it needs
     * no authorship flag to survive a repaint — which is what payroll's
     * code_source exists for, and payroll needs it because its prefill re-runs
     * over rows a supervisor has already worked in.
     *
     * Runs twice: when the job's cost codes land, and again when the work row's
     * cost code is committed. The second is what carries paving, where the
     * drive's code is not answerable until the task is — and it is safe to
     * repeat precisely because it only ever writes into blanks.
     *
     * Returns true when it changed something.
     */
    function applyTravelCodes() {
      if (!sheet || !Array.isArray(sheet.codes) || !sheet.codes.length) return false;
      // The WORK row, which on this sheet is neither the drive nor a machine's
      // own line — an equipment row carries a cost code too, and reading one as
      // the work would pair the drive with a machine's phase. Same pair
      // renderTally uses to decide which hours are the day's work.
      const workRow = sheet.rows.find(r =>
        !isTravelRow(r) && !isEquipRow(r) && String(r.cost_code || '').trim());
      const pick = pickTravelCodes(sheet.codes, workRow ? workRow.cost_code : '');
      if (!pick) return false;
      let changed = false;
      for (const r of sheet.rows) {
        if (!isTravelRow(r)) continue;
        if (String(r.cost_code || '').trim() || String(r.sub_code || '').trim()) continue;
        r.cost_code = pick.cost_code;
        r.sub_code  = pick.sub_code;
        changed = true;
      }
      return changed;
    }

    /* ═══════ Coding sheet ═══════ */
    /**
     * One line of the breakdown. Three kinds, and the kind decides what the
     * hours on it MEAN:
     *
     *   work    labour against a phase of the job
     *   travel  labour spent driving — the same hours, under the drive's code
     *   equip   NO labour at all: a machine's own line, carrying equip_hours
     *           and nothing else. The server needs labour or equipment hours on
     *           a row, and the total it balances counts labour alone, so these
     *           never disturb work + travel.
     */
    function blankRow(kind) {
      return {
        kind: kind || 'work',
        cost_code:'', sub_code:'', quantity:'',
        labor_hours: kind === 'equip' ? '0' : '',
        equipment:'', equip_hours:'',
        is_travel: kind === 'travel',
      };
    }

    const isEquipRow  = r => r && r.kind === 'equip';
    const isTravelRow = r => r && (r.kind === 'travel' || (!r.kind && r.is_travel));

    /** The drive THIS sheet is proposing — the travel rows' own hours. It is
     *  what the tally balances against and what the save sends, and it may
     *  differ from the figure the employee filed. */
    function sheetTravel() {
      if (!sheet) return 0;
      return r2(sheet.rows.reduce((sum, r) =>
        sum + (isTravelRow(r) ? (Number(r.labor_hours) || 0) : 0), 0));
    }

    async function openSheet(id) {
      const e = state.entries.find(x => String(x.id) === String(id));
      if (!e) return;

      // Reopen whatever was proposed before, unless the day's hours have moved
      // underneath it — a stale split cannot be saved, so offering it to edit
      // would only waste the trip.
      let rows;
      if (Array.isArray(e.proposed_split) && e.proposed_split.length && !proposalStale(e)) {
        rows = e.proposed_split.map(r => {
          // A row carrying a machine and no labour is a machine's own line,
          // and it has to come back as one — read as ordinary work it would
          // demand hours the day does not have and could never be saved.
          const labor = Number(r.labor_hours) || 0;
          const kind  = r.is_travel ? 'travel' : (labor > 0 ? 'work' : 'equip');
          return {
            kind,
            cost_code:   r.cost_code   || '',
            sub_code:    r.sub_code    || '',
            quantity:    r.quantity    ? String(r.quantity) : '',
            labor_hours: r.labor_hours != null ? String(r.labor_hours) : '',
            equipment:   r.equipment   || '',
            equip_hours: r.equip_hours ? String(r.equip_hours) : '',
            is_travel:   !!r.is_travel,
            // Hours that were SAVED are a figure somebody shipped, so the
            // pickup link does not relight over them — the same rule payroll
            // applies when it reads a stored split back. A row that came back
            // with none is still open to it, which is what lets a pickup typed
            // on but never given hours start following the drive.
            _equipHoursTouched: (Number(r.equip_hours) || 0) > 0,
          };
        });
      } else {
        rows = [blankRow('work')];
        // The work hours are known outright, so the common case — one phase all
        // day — needs no arithmetic from anybody.
        rows[0].labor_hours = String(workHours(e));
        // The drive as the employee filed it. A travel row is offered even at
        // zero, because the filed figure is routinely zero and wrong: the
        // travel boxes on the timesheet are optional, the man who drove the
        // crew out knows what it took, and there was no way to say so. The row
        // starts empty in that case and the foreman either fills it in or
        // removes it.
        const t = blankRow('travel');
        t.labor_hours = filedTravel(e) > 0 ? String(filedTravel(e)) : '';
        rows.push(t);

        /* ── The iron he named on his own timesheet, onto the rows it belongs
         *    on rather than a row apiece ──
         *
         * He answered "which machine, and for how long" when he filed the day;
         * retyping it here from a schedule nobody was standing next to is how a
         * pickup gets billed as an excavator. WHERE each machine lands is the
         * rest of the answer, and it is not the same question for all of them:
         *
         *   THE PICKUP is how the crew got to the job, not something that
         *   worked it. It rides the TRAVEL row — under the drive's own cost
         *   code, for the drive's own hours — and gets no row of its own. That
         *   third row was pure friction: two more mandatory code cells on a
         *   line that only ever says "we drove out in the truck".
         *
         *   EVERY OTHER MACHINE worked the site, and what was worked there is
         *   exactly what this page cannot know — so the first one rides the
         *   WORK row, which is the row the foreman is coding anyway, and only a
         *   second machine needs a line of its own.
         *
         * The ordinary day is therefore two rows: the drive, and the work.
         * Same placement splitFillNamedEquipment performs in payroll.html, so a
         * day coded here and a day coded by the approver come out alike.
         */
        const seen = new Set();
        let pickupSeated = false;
        for (const piece of equipUsedPieces(e)) {
          // One machine is one machine. A list naming it twice would otherwise
          // bill the job for two of them.
          const k = piece.name.toLowerCase();
          if (seen.has(k)) continue;
          seen.add(k);

          const hours = piece.hours != null && piece.hours > 0 ? r2(piece.hours) : 0;

          if (isPickup(piece.name) && !pickupSeated) {
            // Only where something will land on it. A pickup with no hours from
            // either source bills the job nothing, and seating it would open the
            // sheet already failing its own check — the travel row is kept the
            // moment it carries a machine, and a machine with no hours is
            // refused. Same guard payroll's pickup branch applies before it
            // makes a travel row at all.
            const drive = filedTravel(e);
            if (drive <= 0 && hours <= 0) continue;
            t.equipment = piece.name;
            // THE DRIVE'S HOURS, because the pickup was running for exactly as
            // long as the man was in it — that is the whole of the rule. His own
            // stated figure is the fallback where the timesheet filed no drive,
            // so the row is not left empty and unsaveable.
            t.equip_hours = drive > 0 ? String(drive) : String(hours);
            pickupSeated = true;
            continue;
          }

          // A machine nobody gave hours to cannot be priced, and a row carrying
          // one opens the sheet already failing validation with the error
          // pointing at a row the foreman did not write. He still has the
          // machine boxes and "+ Equipment" if he wants to add it; the approver
          // still sees what was named on the entry either way.
          if (hours <= 0) continue;

          // The first one rides the work row. HIS figure, not the page's, and
          // marked as his so nothing levels it to the labour hours later.
          //
          // A SECOND PICKUP never takes that seat. The work row's machine is
          // the iron that worked the site, and handing the slot to another
          // truck demotes the excavator behind it to a row of its own while
          // claiming a pickup ran the job. It gets its own line instead — still
          // billed, just not mistaken for site equipment. (Payroll would open a
          // second TRAVEL row for it; this page cannot, because every travel
          // row is summed into the drive being proposed and the server then
          // holds them to that total.)
          if (!isPickup(piece.name) && !String(rows[0].equipment || '').trim()) {
            rows[0].equipment   = piece.name;
            rows[0].equip_hours = String(hours);
            rows[0]._equipHoursTouched = true;
            continue;
          }

          const r = blankRow('equip');
          r.equipment   = piece.name;
          r.equip_hours = String(hours);
          r._equipHoursTouched = true;
          rows.push(r);
        }
      }

      sheet = { entry: e, rows, codes: [], codesState: 'loading', saving: false };
      const mySheet = sheet;
      document.getElementById('sheetTitle').textContent = e.username;
      document.getElementById('backdrop').classList.add('open');
      renderSheet();

      // Bound to THIS sheet, not to whatever is open when it lands. Without
      // the guard a slow response for one man's day could drop its job's bid
      // items into the picker of a day already opened for another job — and
      // nothing, here or on the server, checks a cost code against its job.
      //
      // Both lookups together: the equipment list is company-wide and cached
      // after the first sheet, so on every day but the first it costs nothing.
      try {
        const qs = new URLSearchParams({ division: e.division, jobId: e.job_id });
        const [r] = await Promise.all([
          fetch(`${API}/timesheet-job-costcodes?${qs}`, { headers: authHeaders() }),
          equipLoad(),
        ]);
        const j = await r.json();
        if (r.ok && Array.isArray(j.cost_codes)) {
          mySheet.codes = j.cost_codes;
          mySheet.codesState = j.cost_codes.length ? 'loaded' : 'empty';
        } else {
          mySheet.codesState = 'failed';
        }
      } catch {
        mySheet.codesState = 'failed';
      }
      // AFTER the harvest, before the paint. The harvest copies the DOM back
      // over sheet.rows, so a prefill run before it is thrown away — and it has
      // to see what the foreman has already typed, because it only writes into
      // cells still blank. This is also the earliest it can run at all: the
      // job's bid items are what it reads, and they land on the line above.
      if (sheet === mySheet) { harvestSheetDom(); applyTravelCodes(); renderSheet(); }
    }

    function closeSheet() {
      sheet = null;
      document.getElementById('backdrop').classList.remove('open');
    }

    function subsFor(cc) {
      const hit = sheet.codes.find(c => String(c.cost_code) === String(cc));
      return (hit && Array.isArray(hit.sub_codes)) ? hit.sub_codes : [];
    }

    /**
     * Pull whatever is currently in the form back into sheet.rows.
     *
     * The text fields commit on `change`, which is blur — so anything typed
     * and not yet blurred lives only in the DOM. renderSheet rebuilds the body
     * from sheet.rows, so a repaint that did not harvest first silently threw
     * away what the coder was in the middle of typing. The cost-code lookup
     * landing is the common case: he opens a day on a slow connection, starts
     * typing, and the response repaints under him.
     */
    function harvestSheetDom() {
      if (!sheet) return;
      document.querySelectorAll('#sheetBody .srow').forEach((el, i) => {
        const r = sheet.rows[i];
        if (!r) return;
        el.querySelectorAll('input[data-f]').forEach(inp => {
          r[inp.getAttribute('data-f')] = inp.value;
        });
      });
      // AND THEN RE-DERIVE THE PICKUP'S HOURS, because the loop above has just
      // copied whatever the machine-hours box happened to show back over them.
      // mirrorPickupHours writes that box in place rather than repainting, and
      // the one path where that write is skipped — the box itself has focus —
      // is exactly the path where the stale value would be harvested. This is
      // what makes the link survive the harvest that saveCoding runs a line
      // before it posts. A row the foreman has typed into is untouched: the
      // mirror refuses a row marked _equipHoursTouched.
      sheet.rows.forEach((r, i) => mirrorPickupHours(i));
    }

    /**
     * Repaint on the NEXT tick, keeping what is typed.
     *
     * A commit fires on blur, and the browser is mid-way through moving focus
     * to whatever was tapped or tabbed into. Replacing #sheetBody right then
     * destroys the element the focus is landing on, so the next field never
     * receives it — which was safe while these were <select>s (change fires
     * with focus still on the control) and is not now they are inputs.
     *
     * IT NO LONGER HARVESTS, and its callers do it themselves before they
     * mutate. Harvesting here meant the order was forced to be mutate-then-
     * harvest, and the harvest copies the DOM back over sheet.rows — so a
     * commit that CLEARED a field (the sub code under a changed cost code, the
     * machine hours under a removed machine) had the stale box put straight
     * back over it, and the row shipped a value the foreman had just undone.
     * Both clears looked like they worked, because the deferred repaint then
     * redrew the box from the row it had just been restored into.
     */
    function renderSheetSoon() {
      setTimeout(() => { if (sheet) renderSheet(); }, 0);
    }

    /**
     * What the day was FILED with, said the moment the figure on screen stops
     * matching it.
     *
     * A foreman is entitled to a different answer about the drive — he was in
     * the truck — but he is not entitled to make the change quietly, and
     * neither is this page. The note names both numbers and says plainly that
     * his is a request: nothing on this screen moves anybody's paid hours.
     *
     * Always rendered, hidden when the two agree, so it can be swapped in place
     * while somebody is typing in the travel box — see renderTravelNote.
     */
    function travelNoteHtml() {
      if (!sheet) return '<div id="travelNote" hidden></div>';
      const filed  = filedTravel(sheet.entry);
      const asked  = sheetTravel();
      if (Math.abs(asked - filed) <= 0.001) return '<div id="travelNote" hidden></div>';
      return `<div id="travelNote" class="msg show" style="color:#fbbf24;background:rgba(245,158,11,0.12)">
        ${esc(sheet.entry.username)} filed <strong>${esc(n2(filed))} h</strong> of travel and you are
        coding <strong>${esc(n2(asked))} h</strong>. His hours do not change on this screen —
        your supervisor sees the figure and decides.
      </div>`;
    }

    /**
     * Put that note back on screen WITHOUT repainting the body.
     *
     * The travel box commits on every keystroke, and a full repaint on each one
     * would destroy the input being typed into and take the focus with it.
     * Only this one element is replaced, so the caret never moves.
     */
    function renderTravelNote() {
      const el = document.getElementById('travelNote');
      if (el) el.outerHTML = travelNoteHtml();
      // The header carries the same figure, and it is a text node outside the
      // form — safe to rewrite while he types.
      renderSheetHead();
    }

    /** The line under the name: where this day was worked, and how much time
     *  is being allocated. The total follows the drive on screen, so it is
     *  rebuilt on every repaint rather than written once when the sheet opens. */
    function renderSheetHead() {
      if (!sheet) return;
      const e = sheet.entry;
      document.getElementById('sheetSub').textContent =
        `${DIV_LABEL[e.division] || e.division} · ${e.job_label || e.job_id} · `
        + `${n2(requiredHours(e, sheetTravel()))} hours to allocate`;
    }

    /**
     * Keep the pickup's hours level with the drive it is on.
     *
     * "The pickup equipment hours are the same as the travel hours" — the whole
     * of the user's rule, and it has to hold while the sheet is OPEN, not only
     * at the moment it opens: the foreman correcting the drive is the normal
     * path on this page, not the corner.
     *
     * WRITES THE INPUT AS WELL AS THE ROW, and that is not belt-and-braces.
     * harvestSheetDom copies every input back over sheet.rows, and saveCoding
     * harvests immediately before the POST — so a mirror that touched only the
     * model would be reverted to whatever the stale box still showed, and the
     * stale figure is what would be stored. One element is written in place
     * rather than repainting, the same technique renderTravelNote uses, because
     * this runs on every keystroke in the travel hours box and rebuilding the
     * body would take the caret with it.
     *
     * Stops the moment the foreman types his own machine hours: a pickup that
     * sat running while the crew worked is a real thing, and his answer stands.
     */
    function mirrorPickupHours(i) {
      const r = sheet && sheet.rows[i];
      if (!r || r._equipHoursTouched) return false;
      if (!isTravelRow(r) || !isPickup(r.equipment)) return false;
      const want = String(r2(r.labor_hours));
      if (String(r.equip_hours || '') === want) return false;
      r.equip_hours = want;
      const el = document.getElementById('eqh' + i);
      // Never over a box somebody is typing in. On the path this actually runs
      // from — a keystroke in the TRAVEL HOURS box — the caret is in a
      // different element on the same row, so the guard is near-dead; it earns
      // its place when the machine name is committed by blurring out of the
      // hours box itself. harvestSheetDom re-derives afterwards either way.
      if (el && el !== document.activeElement) el.value = want;
      return true;
    }

    function renderSheet() {
      if (!sheet) return;
      renderSheetHead();
      const body = document.getElementById('sheetBody');
      const ccOpts = sheet.codes.map(c => c.cost_code);

      // Free text with suggestions, never a hard <select>. The job's bid items
      // are a help, not the whole world: the list can come back empty, the
      // lookup can fail, and a day can legitimately want a code the job's items
      // do not carry. A select would turn any of those into a screen where the
      // coder simply cannot proceed and is told nothing.
      // The same warning again where the typing happens. The card can be
      // scrolled past; this sits above the first field.
      const supNote = sheet.entry.coded_source === 'approve'
        ? `<div class="msg err show" style="color:#fbbf24;background:rgba(245,158,11,0.12)">
             This day was already approved and then sent back.
             ${esc(sheet.entry.coded_by_name || 'Your supervisor')} entered the codes below —
             change them only if you know what went wrong with the day.
           </div>`
        : '';

      const ccNote = sheet.codesState === 'failed'
        ? `<div class="msg err show">Could not load this job's cost codes. You can still type them in.</div>`
        : sheet.codesState === 'empty'
          ? `<div class="msg err show">This job has no bid items set up, so there are no codes to pick from. Type them in, or ask the office to add them.</div>`
          : '';

      // Said only where it matters: the machine boxes are optional, so a
      // failed lookup is worth one line rather than an alarm — but it has to be
      // a line, because an empty picker looks exactly like a company with no
      // equipment on its books.
      const eqNote = equipState === 'failed'
        ? `<div class="msg err show">Could not load the equipment list. You can still type a machine in — spell it as it is on the equipment list, or the job gets billed nothing for it.</div>`
        : '';

      // The filed drive, for the hint under the travel box; the note that fires
      // when the figure on screen disagrees with it is travelNoteHtml's.
      const filed = filedTravel(sheet.entry);
      const tNote = travelNoteHtml();

      const eqOpts = equipNamesFor(sheet.entry.division);

      body.innerHTML = supNote + ccNote + eqNote + tNote + sheet.rows.map((r, i) => {
        // On the DRIVE, the sub codes this job files the drive under — not the
        // whole list under that cost code. Where the job spells the drive as a
        // cost code of its own there are no travel subs to offer and the
        // ordinary list is right, so this falls back rather than emptying the
        // picker.
        const travelSubs = isTravelRow(r) ? travelSubsFor(sheet.codes, r.cost_code) : [];
        const subs = travelSubs.length ? travelSubs : subsFor(r.cost_code);
        const equip = isEquipRow(r);
        const tag = equip ? 'Equipment' : (isTravelRow(r) ? 'Travel' : 'Work');
        const cls = equip ? 'equip' : (isTravelRow(r) ? 'travel' : '');
        return `
        <div class="srow ${cls}">
          <div class="srow-top">
            <span class="srow-tag">${tag} · row ${i + 1}</span>
            ${sheet.rows.length > 1 ? `<button class="srow-del" onclick="delRow(${i})">Remove</button>` : ''}
          </div>
          <div class="fld">
            <label>Cost code <span class="req">*</span></label>
            <input list="ccList" data-f="cost_code" value="${esc(r.cost_code)}" placeholder="type or pick"
                   autocapitalize="off" autocorrect="off" spellcheck="false"
                   onchange="setField(${i},'cost_code',this.value)">
          </div>
          <div class="fld">
            <label>Sub code <span class="req">*</span></label>
            <input list="scList${i}" data-f="sub_code" value="${esc(r.sub_code)}"
                   placeholder="${subs.length ? 'type or pick' : 'type it in'}"
                   autocapitalize="off" autocorrect="off" spellcheck="false"
                   onchange="setField(${i},'sub_code',this.value)">
            <datalist id="scList${i}">${subs.map(x => `<option value="${esc(x)}"></option>`).join('')}</datalist>
            ${subs.length ? '' : `<span class="hint">This cost code has no sub codes on the job — type what the work was.</span>`}
          </div>
          ${equip ? '' : `
          <div class="grid2">
            <div class="fld">
              <label>Hours</label>
              <input type="number" data-f="labor_hours" inputmode="decimal" min="0" max="24" step="0.25"
                     value="${esc(r.labor_hours)}" placeholder="0.00"
                     oninput="setField(${i},'labor_hours',this.value)">
              ${isTravelRow(r) ? `<span class="hint">Timesheet says ${n2(filed)} h${filed > 0 ? '' : ' — nothing filed'}</span>` : ''}
            </div>
            <div class="fld">
              <label>Quantity</label>
              <input type="number" data-f="quantity" inputmode="decimal" min="0" step="0.01"
                     value="${esc(r.quantity)}" placeholder="optional"
                     oninput="setField(${i},'quantity',this.value)">
            </div>
          </div>`}
          <div class="eqbox">
            <div class="eqhead">${equip ? 'Machine' : (isTravelRow(r) ? 'What they drove out in (optional)' : 'Equipment on this row (optional)')}</div>
            <div class="grid2">
              <div class="fld">
                <label>Machine</label>
                <input list="eqList" data-f="equipment" value="${esc(r.equipment)}"
                       placeholder="${equip ? 'type or pick' : 'none'}"
                       autocapitalize="off" autocorrect="off" spellcheck="false"
                       onchange="setField(${i},'equipment',this.value)">
              </div>
              <div class="fld">
                <label>Machine hours</label>
                <input type="number" id="eqh${i}" data-f="equip_hours" inputmode="decimal" min="0" max="24" step="0.25"
                       value="${esc(r.equip_hours)}" placeholder="0.00"
                       oninput="setField(${i},'equip_hours',this.value)">
                ${isTravelRow(r) && isPickup(r.equipment) && !r._equipHoursTouched
                  ? `<span class="hint">Follows the drive above — type here if the truck ran longer.</span>`
                  : ''}
              </div>
            </div>
            ${equip ? `<span class="hint">A machine's own line. These hours bill the job for the iron and are not anybody's time, so they do not count toward the ${n2(workHours(sheet.entry))} h below.</span>` : ''}
          </div>
        </div>`;
      }).join('')
      + `<datalist id="ccList">${ccOpts.map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist>
         <datalist id="eqList">${eqOpts.map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist>
         <div class="addrow">
           <button class="btn add" onclick="addRow('work')">+ Phase</button>
           <button class="btn add" onclick="addRow('equip')">+ Equipment</button>
         </div>
         ${sheet.rows.some(isTravelRow) ? '' : `<button class="btn add" onclick="addRow('travel')">+ Travel</button>`}
         <div class="msg err" id="sheetMsg">${esc(sheet.err || '')}</div>`;
      if (sheet.err) document.getElementById('sheetMsg').classList.add('show');

      renderTally();
    }

    /**
     * The running total, and what the drive is doing to it.
     *
     * The WORK hours are fixed — the punch clock, less the break — and the work
     * rows have to land on them exactly. The travel rows are the figure being
     * proposed, so they move the target rather than eating into it: a foreman
     * adding an hour of drive is not taking an hour off the man's work, and a
     * tally that made him re-balance the whole day to say so would teach him to
     * leave the drive alone.
     *
     * Equipment rows carry no labour and are counted in neither.
     */
    function renderTally() {
      if (!sheet) return;
      const work    = workHours(sheet.entry);
      const travel  = sheetTravel();
      const need    = requiredHours(sheet.entry, travel);
      const gotWork = r2(sheet.rows.reduce((sum, r) =>
        sum + ((!isTravelRow(r) && !isEquipRow(r)) ? (Number(r.labor_hours) || 0) : 0), 0));
      const got     = r2(gotWork + travel);
      const ok      = Math.abs(gotWork - work) <= 0.001;
      const el = document.getElementById('tally');
      el.className = 'tally ' + (ok ? 'good' : 'bad');
      const left = r2(work - gotWork);
      el.innerHTML = `${esc(n2(got))} / ${esc(n2(need))} h`
        + `<span class="sub">${esc(n2(work))} h work${ok ? '' : ` · ${esc(n2(left))} left`}`
        + `${travel > 0 ? ` · ${esc(n2(travel))} h travel` : ''}</span>`;
      document.getElementById('saveBtn').disabled = !ok || sheet.saving;
    }

    function setField(i, field, value) {
      if (!sheet || !sheet.rows[i]) return;
      const prev = sheet.rows[i][field];
      sheet.rows[i][field] = value;

      // HIS OWN FIGURE for a machine, which ends the pickup link for good. A
      // pickup left running while the crew worked is a real thing and his
      // answer stands; the same flag payroll reads back off a stored proposal.
      if (field === 'equip_hours') { sheet.rows[i]._equipHoursTouched = true; return; }

      // Changing the cost code invalidates whatever sub code was under the old
      // one, so it is cleared rather than left pointing somewhere it no longer
      // belongs.
      if (field === 'cost_code') {
        // HARVEST FIRST, then clear, then paint. renderSheetSoon harvests the
        // DOM back over sheet.rows, and the sub-code input still shows the code
        // that belonged to the OLD cost code — so clearing and harvesting in
        // the other order put it straight back, and the row shipped a sub code
        // from a cost code it no longer named. That is the one shape the
        // mandatory sub code exists to prevent, and it looked filled in.
        harvestSheetDom();
        sheet.rows[i][field] = value;
        if (String(prev || '') !== String(value || '')) sheet.rows[i].sub_code = '';
        // And now the work row may have named its task, which on a paving job
        // is the moment the drive's own code becomes answerable. Only ever
        // writes into a travel row with both cells blank, so repeating it can
        // never disturb anything the foreman has touched.
        applyTravelCodes();
        // Deferred: this fires on blur, and repainting synchronously would take
        // the element the focus is moving to with it.
        renderSheetSoon();
        return;
      }

      // A machine typed onto the drive by hand — or cleared off it.
      if (field === 'equipment' && isTravelRow(sheet.rows[i])) {
        // Harvest first, exactly as the cost-code branch above does and for the
        // same reason: the repaint is deferred, so the machine-HOURS box still
        // shows the figure that belonged to the machine just removed, and a
        // harvest running after the clear copies it straight back.
        harvestSheetDom();
        sheet.rows[i].equipment = value;
        if (!String(value || '').trim() && !sheet.rows[i]._equipHoursTouched) {
          // The machine the page put there is gone, so the hours it put there
          // go with it. Left behind, they are hours with no machine, which the
          // save refuses — and they were never anybody's answer.
          sheet.rows[i].equip_hours = '';
        } else {
          mirrorPickupHours(i);
        }
        renderSheetSoon();
        return;
      }

      if (field === 'labor_hours') {
        renderTally();
        // A travel figure that has moved changes the note above the fields, the
        // total below them, and the pickup riding the row — its hours ARE the
        // drive's hours. All three are swapped in place rather than repainted:
        // this fires on every keystroke, and rebuilding the body would take the
        // focus out of the box he is typing the number into.
        if (isTravelRow(sheet.rows[i])) { renderTravelNote(); mirrorPickupHours(i); }
        return;
      }
    }

    // Both harvest first. renderSheet rebuilds the body from sheet.rows, and the
    // text fields commit on blur — so a sub code typed and not yet blurred lives
    // only in the DOM, and tapping a button straight from that field repaints
    // over it. saveCoding has guarded this from the start ("tapping Save
    // straight from a text field fires the click before that field's change
    // event on some mobile browsers"); these two never did, and the sheet now
    // has two more buttons on that path and two more text fields per row.
    function addRow(kind) { if (sheet) { harvestSheetDom(); sheet.rows.push(blankRow(kind)); renderSheet(); } }
    function delRow(i)    { if (sheet) { harvestSheetDom(); sheet.rows.splice(i, 1);        renderSheet(); } }

    async function saveCoding() {
      if (!sheet || sheet.saving) return;
      // Tapping Save straight from a text field fires the click before that
      // field's change event on some mobile browsers, so read the form rather
      // than trusting the last commit to have landed.
      harvestSheetDom();
      const msg = document.getElementById('sheetMsg');
      msg.className = 'msg err';
      // Cleared up front, not after the loop. sheet.err is what survives a
      // repaint, so a stale server error left set here reappeared over the
      // validation message the coder was actually acting on.
      sheet.err = '';

      const fail = m => {
        sheet.err = m; msg.textContent = m; msg.classList.add('show');
      };

      // An UNTOUCHED travel row is not an error, it is the answer "there was no
      // drive". Every sheet opens with one — the filed figure is routinely zero
      // and wrong, and a foreman who cannot see the box will not think to add
      // it — so on the ordinary day it is simply left empty and dropped here.
      // Kept once anything is on it: hours, or the pickup that did the driving.
      //
      // Numbered by where it sits ON SCREEN, not by where it lands in the body:
      // dropping a row renumbers everything after it, and "row 3 needs a sub
      // code" pointing at row 4 is worse than no message at all.
      const kept = sheet.rows
        .map((r, i) => ({ r, n: i + 1 }))
        .filter(({ r }) =>
          !isTravelRow(r)
          || (Number(r.labor_hours) || 0) > 0
          || String(r.equipment || '').trim()
          || (Number(r.equip_hours) || 0) > 0);
      const rows = kept.map(x => x.r);

      if (!rows.length) {
        fail('There is nothing on this day to code.');
        return;
      }

      // Mirrors the server's own rules so an obvious mistake is caught here
      // rather than after a round trip. The server checks all of it again.
      for (const { r, n } of kept) {
        const h  = Number(r.labor_hours) || 0;
        const eh = Number(r.equip_hours) || 0;
        const eq = String(r.equipment || '').trim();
        // A machine and its hours, or neither. Either one alone is a row the
        // job is billed nothing for, or billed for iron nobody can name.
        if (eq && !(eh > 0))  { fail(`Row ${n} names ${eq} but gives it no hours.`); return; }
        if (!eq && eh > 0)    { fail(`Row ${n} has machine hours but no machine. Pick one, or clear the hours.`); return; }
        if (isEquipRow(r)) {
          if (!eq) { fail(`Row ${n} is an equipment row with no machine on it. Pick one, or remove the row.`); return; }
        } else if (h <= 0 && !eq) {
          // Labour OR a machine, the same rule the server applies. A row
          // carrying neither is empty, and an empty row is a mistake whichever
          // of the two the coder meant to fill in.
          fail(`Row ${n} has no hours on it. Give it hours or remove it.`); return;
        }
        if (!String(r.cost_code || '').trim()) {
          fail(`Row ${n} needs a cost code.`); return;
        }
        // MANDATORY, not "one of the two". The sub code is where the phase of
        // the work actually lives, and a cost row without one cannot be
        // measured against the bid it came from — which is the whole reason
        // the man who was on the job is the one filling this in.
        if (!String(r.sub_code || '').trim()) {
          fail(`Row ${n} needs a sub code — say which part of ${String(r.cost_code).trim()} it was.`); return;
        }
      }

      // The work rows are the day's clocked time and have to land on it
      // exactly. Checked here as well as by the disabled Save button, because
      // Save is re-enabled from several places and a body that does not balance
      // earns a 400 the coder has no way to read.
      const wantWork = workHours(sheet.entry);
      const gotWork  = r2(rows.reduce((sum, r) =>
        sum + ((!isTravelRow(r) && !isEquipRow(r)) ? (Number(r.labor_hours) || 0) : 0), 0));
      if (Math.abs(gotWork - wantWork) > 0.001) {
        fail(`The work rows add up to ${n2(gotWork)} h and this day was worked ${n2(wantWork)} h.`
             + ` Travel and equipment rows are counted separately.`);
        return;
      }
      msg.classList.remove('show');

      // Everything the continuation needs, taken BEFORE the await. Cancel and
      // Close stay live while the POST is in flight and both set sheet = null,
      // and the coder can open another man's day in the meantime — so nothing
      // after the await may assume `sheet` is still this sheet, or is anything
      // at all.
      const mySheet = sheet;
      const myId    = String(sheet.entry.id);
      const who     = sheet.entry.username;
      const filedT  = filedTravel(sheet.entry);
      // The drive as the rows actually being SENT state it — an empty travel
      // row dropped above is zero travel, and the figure has to agree with the
      // rows or the server refuses the pair.
      const askedT  = r2(rows.reduce((sum, r) =>
        sum + (isTravelRow(r) ? (Number(r.labor_hours) || 0) : 0), 0));

      sheet.saving = true;
      document.getElementById('saveBtn').disabled = true;
      try {
        // Classification only. The haul questions, the routing to another
        // division and the rates are the approver's, and the server strips
        // them from a coder's proposal regardless of what is sent.
        //
        // The MACHINE is not one of those. Naming it settles which iron was on
        // the job — the man coding the day watched it run — and its rate still
        // comes from the equipment list at approval, exactly as it does for a
        // machine the approver types himself.
        const split = rows.map(r => ({
          cost_code:   String(r.cost_code || '').trim(),
          sub_code:    String(r.sub_code  || '').trim(),
          quantity:    Number(r.quantity) || 0,
          labor_hours: Number(r.labor_hours) || 0,
          equipment:   String(r.equipment || '').trim(),
          equip_hours: Number(r.equip_hours) || 0,
          is_travel:   isTravelRow(r),
        }));
        const r = await fetch(`${API}/timesheet-entries?action=precode&id=${encodeURIComponent(myId)}`, {
          method: 'POST', headers: authHeaders(true),
          // The drive this breakdown is balanced against. The server stores it
          // beside the codes and changes nothing about the entry — his filed
          // hours stand until a supervisor applies the figure.
          body: JSON.stringify({ split, travel_hours: askedT }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error((j && j.error) || `Could not save (${r.status})`);
        // The save landed, so the list is updated whether or not this sheet is
        // still the one on screen.
        if (j.entry) {
          const idx = state.entries.findIndex(x => String(x.id) === String(j.entry.id));
          if (idx >= 0) state.entries[idx] = j.entry;
        }
        if (sheet === mySheet) closeSheet();
        render();
        toast(Math.abs(askedT - filedT) > 0.001
          ? `${who}'s day is coded. Your ${n2(askedT)} h of travel is a request — your supervisor decides.`
          : `${who}'s day is coded — waiting on your supervisor.`);
      } catch (err) {
        mySheet.saving = false;
        // Only touch the form if it is still this one, and re-resolve the
        // message node rather than reusing the reference taken before the
        // await — any interaction during the save re-renders the body and
        // detaches it, and the error would land on an orphan nobody can see.
        if (sheet === mySheet) {
          sheet.err = err.message;
          const btn = document.getElementById('saveBtn');
          if (btn) btn.disabled = false;
          const el = document.getElementById('sheetMsg');
          if (el) { el.textContent = err.message; el.classList.add('show'); }
        } else {
          toast(`${who}'s day did not save: ${err.message}`);
        }
      }
    }

    load();
  </script>
</body>
</html>
