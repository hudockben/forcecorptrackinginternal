        division: '', project: '', location: '', address: '', material: '',
        unit: '', unitType: '',
        start: '', end: '', planHrs: '',
        actStart: rep.actual_start || '', actEnd: rep.actual_end || '', actHrs: actHrs,
        tons: tons, loads: loads, tph: schedRecRate(tons, actHrs),
        tickets: rep.tickets || '', notes: '', driverNotes: rep.notes || '',
        status: 'Report only',
        id: id || '',
      };
    }

    /** What a cell reads as. One definition for the screen, the filter boxes,
     *  the search and the workbook's text columns alike. */
    function schedRecText(row, key) {
      const col = SCHED_REC_BY_KEY[key];
      const v   = row[key];
      if (v === '' || v == null) return '';
      if (col && col.type === 'time') return schedTime12(v);
      if (col && col.type === 'num')  return schedNum(v, col.dp);
      return String(v);
    }

    /* ── Filter and sort ── */

    function schedRecFilter(rows) {
      const q    = String(schedRec.q || '').trim().toLowerCase();
      const cols = Object.keys(schedRec.col)
        .map(k => [k, String(schedRec.col[k] || '').trim().toLowerCase()])
        .filter(pair => pair[1]);
      return rows.filter(r => {
        if (schedRec.board  !== 'all' && r.boardId !== schedRec.board)  return false;
        if (schedRec.status !== 'all' && r.status  !== schedRec.status) return false;
        for (const pair of cols) {
          if (!schedRecText(r, pair[0]).toLowerCase().includes(pair[1])) return false;
        }
        if (q) {
          const hay = SCHED_REC_COLS.map(c => schedRecText(r, c.key)).join('  ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    /** Newest day first, then the order the day ran. The tie-break under every
     *  sort, so rows equal on the sorted column still come out in a stable,
     *  meaningful order rather than in whatever order the blob held them. */
    function schedRecTie(a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''))
          || String(a.start || '~').localeCompare(String(b.start || '~'))
          || String(a.driver || '').localeCompare(String(b.driver || ''))
          || String(a.id || '').localeCompare(String(b.id || ''));
    }

    function schedRecSort(rows) {
      const key = schedRec.sort.key;
      const mul = schedRec.sort.dir === 'desc' ? -1 : 1;
      const col = SCHED_REC_BY_KEY[key] || {};
      const asNum  = col.type === 'num';
      const asTime = col.type === 'time';
      return rows.slice().sort((a, b) => {
        if (asNum || asTime) {
          const av = asNum ? (a[key] === '' || a[key] == null ? null : Number(a[key])) : schedMins(a[key]);
          const bv = asNum ? (b[key] === '' || b[key] == null ? null : Number(b[key])) : schedMins(b[key]);
          const aBad = av === null || isNaN(av), bBad = bv === null || isNaN(bv);
          // Blanks sort last whichever way the column points: a haul with no
          // tons reported is not the smallest haul of the day.
          if (aBad) return bBad ? schedRecTie(a, b) : 1;
          if (bBad) return -1;
          return av !== bv ? (av - bv) * mul : schedRecTie(a, b);
        }
        const c = String(a[key] == null ? '' : a[key])
          .localeCompare(String(b[key] == null ? '' : b[key]), undefined, { numeric: true, sensitivity: 'base' });
        return c ? c * mul : schedRecTie(a, b);
      });
    }

    /** Everything the view is showing, filtered and sorted — what the totals
     *  are taken over, and what the workbook is written from. */
    function schedRecView() { return schedRecSort(schedRecFilter(schedRecBuild())); }

    function schedRecTotals(rows) {
      const t = { rows: rows.length, planHrs: 0, actHrs: 0, tons: 0, loads: 0, reported: 0,
                  drivers: new Set(), trucks: new Set(), days: new Set() };
      rows.forEach(r => {
        if (r.driver) t.drivers.add(r.driver);
        if (r.unit)   t.trucks.add(r.unit);
        if (r.date)   t.days.add(r.date);
        if (r.planHrs !== '') t.planHrs += r.planHrs;
        if (r.actHrs  !== '') t.actHrs  += r.actHrs;
        if (r.tons    !== '') t.tons    += r.tons;
        if (r.loads   !== '') t.loads   += r.loads;
        if (r.status  !== 'Planned') t.reported++;
      });
      return t;
    }

    /* ── Driver reports for the range ── */

    async function schedRecEnsureReports() {
      const from = schedRec.from, to = schedRec.to;
      if (!from || !to) return;
      const key = from + '..' + to;
      // A range that already failed is not retried by the next repaint — every
      // keystroke repaints, and a dead endpoint would otherwise be hammered
      // once per character. Retry is a button.
      if (schedRec.reportsRange === key || schedRec.reportsLoading === key
          || schedRec.reportsErrRange === key) return;
      schedRec.reportsLoading = key;
      schedRec.reportsErr = null;
      schedRec.reportsShort = '';
      try {
        const map = new Map();
        let cur = from, reached = from;
        for (let i = 0; i < SCHED_REC_MAX_PULL && cur <= to; i++) {
          const stop = schedAddDays(cur, SCHED_REC_CHUNK - 1);
          const end  = stop > to ? to : stop;
          const r = await fetch(
            `${API_BASE}/trucking-driver-reports?from=${encodeURIComponent(cur)}&to=${encodeURIComponent(end)}`,
            { headers: { 'Authorization': `Bearer ${token}` } });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          (Array.isArray(j.reports) ? j.reports : []).forEach(x => {
            if (x && x.assignment_id) map.set(x.assignment_id, x);
          });
          reached = end;
          if (end >= to) break;
          cur = schedAddDays(end, 1);
        }
        // The range may have moved on while this was in flight; the newer pull
        // owns the map, and this one throws away what it fetched.
        if (schedRec.reportsLoading !== key) return;
        schedRec.reports      = map;
        schedRec.reportsRange = key;
        // A range wider than the chunk budget stops short. Said out loud rather
        // than left to look like nobody reported anything that far back.
        schedRec.reportsShort = reached < to ? reached : '';
      } catch (err) {
        if (schedRec.reportsLoading !== key) return;
        schedRec.reportsErr      = (err && err.message) || 'could not load driver reports';
        schedRec.reportsErrRange = key;
      } finally {
        if (schedRec.reportsLoading === key) {
          schedRec.reportsLoading = '';
          if (schedTabShowing() && schedView === 'records') schedRecPaint();
        }
      }
    }

    /* ── Render ════════════════════════════════════════════════════════════
       The shell is built once and then only the header, the body, the totals
       and the note are repainted. The filter boxes live in the shell for that
       reason: a save landing or a board finishing its load repaints this
       view, and a rebuilt input would take the caret with it mid-word. */

    function renderSchedRecords() {
      const root = document.getElementById('sched-board-records');
      if (!root) return;
      // A board whose load failed is left alone: schedEnsureLoaded retries on
      // every call, this runs on every repaint, and the two together would sit
      // in a fetch loop against an endpoint that is already down. Retry is the
      // button in the note.
      SCHED_BOARDS.forEach(cfg => {
        const st = _schedStates[cfg.id];
        if (st && !st.loadError) schedEnsureLoaded(cfg.id);
      });
      if (!schedRec.from || !schedRec.to) schedRecApplyPreset(schedRec.preset);
      // "All time" is the span of the boards, and the boards arrive after the
      // first paint — so it is recomputed until they have.
      else if (schedRec.preset === 'all') { schedRecApplyPreset('all'); schedRecSyncRange(); }
      // Rebuilt only when the panel really is empty — switching sub-tabs blanks
      // it, and nothing else may throw away what is typed into the filters.
      if (!document.getElementById('sched-rec-body')) root.innerHTML = schedRecShellHTML();
      schedRecPaint();
    }

    function schedRecShellHTML() {
      const presets = SCHED_REC_PRESETS.map(p =>
        `<option value="${p.key}"${p.key === schedRec.preset ? ' selected' : ''}>${schedEsc(p.label)}</option>`).join('');
      const boards = `<option value="all"${schedRec.board === 'all' ? ' selected' : ''}>All boards</option>` +
        SCHED_BOARDS.map(b =>
          `<option value="${b.id}"${b.id === schedRec.board ? ' selected' : ''}>${schedEsc(b.noun)}</option>`).join('');
      const statuses = `<option value="all"${schedRec.status === 'all' ? ' selected' : ''}>Any status</option>` +
        SCHED_REC_STATUSES.map(s =>
          `<option value="${schedEsc(s)}"${s === schedRec.status ? ' selected' : ''}>${schedEsc(s)}</option>`).join('');
      const filterRow = SCHED_REC_COLS.map(c => {
        const st = schedRecStick(c.key);
        return `<th class="${st.cls}" style="${st.style}">${c.f
          ? `<input type="text" id="sched-rec-f-${c.key}" autocomplete="off"
               class="${schedRec.col[c.key] ? 'on' : ''}" placeholder="Filter"
               value="${schedEsc(schedRec.col[c.key] || '')}"
               oninput="schedRecSetCol('${c.key}', this.value, this)">`
          : ''}</th>`;
      }).join('');

      return `
        <div style="padding:1.25rem">
          <p class="home-section-title">Schedule Records</p>
          <div class="rec-bar">
            <label for="sched-rec-from">From</label>
            <input type="date" id="sched-rec-from" value="${schedEsc(schedRec.from)}" onchange="schedRecSetRange()">
            <label for="sched-rec-to">To</label>
            <input type="date" id="sched-rec-to" value="${schedEsc(schedRec.to)}" onchange="schedRecSetRange()">
            <select id="sched-rec-preset" onchange="schedRecSetPreset(this.value)"
                    title="Jump the range to a period">${presets}</select>
            <span class="rec-sep"></span>
            <select id="sched-rec-board" onchange="schedRecSetBoard(this.value)"
                    title="Which board's records to show">${boards}</select>
            <select id="sched-rec-status" onchange="schedRecSetStatus(this.value)"
                    title="Planned, reported back, or reported with no assignment left">${statuses}</select>
            <input type="text" class="rec-search" id="sched-rec-q" autocomplete="off"
                   placeholder="Search every column…" value="${schedEsc(schedRec.q)}"
                   oninput="schedRecSetQ(this.value)">
            <button class="rec-btn" onclick="schedRecClear()" title="Clear every filter">Clear</button>
            <span style="flex:1"></span>
            <button class="rec-btn primary" onclick="schedRecDownload()"
                    title="Download what is on screen as an Excel workbook">&#8595; Download XLSX</button>
          </div>
          <div class="totals-bar" id="sched-rec-totals"></div>
          <div class="rec-scroll">
            <table class="rec-tbl">
              <thead>
                <tr class="hdr-row" id="sched-rec-hdr"></tr>
                <tr class="filter-row">${filterRow}</tr>
              </thead>
              <tbody id="sched-rec-body"></tbody>
            </table>
          </div>
          <p class="rec-note" id="sched-rec-note" style="margin-top:0.55rem"></p>
        </div>`;
    }

    function schedRecHeadHTML() {
      return SCHED_REC_COLS.map(c => {
        const on = schedRec.sort.key === c.key;
        const st = schedRecStick(c.key);
        return `<th class="${c.type === 'num' ? 'r ' : ''}${on ? 'sorted ' : ''}${st.cls}" style="${st.style}"
          onclick="schedRecSortBy('${c.key}')" title="Sort by ${schedEsc(c.label)}">${schedEsc(c.label)}${
          on ? `<span class="arw">${schedRec.sort.dir === 'asc' ? '▲' : '▼'}</span>` : ''}</th>`;
      }).join('');
    }

    function schedRecBodyHTML(rows) {
      if (!rows.length) {
        return `<tr><td class="rec-empty" colspan="${SCHED_REC_COLS.length}">
          No records in this range.<br>
          <span style="font-size:0.75rem">Widen the dates, or clear the filters.</span></td></tr>`;
      }
      const draw = schedRec.showAll ? rows : rows.slice(0, SCHED_REC_DRAW);
      return draw.map(r => {
        const cells = SCHED_REC_COLS.map(c => {
          const st = schedRecStick(c.key);
          if (c.key === 'status') {
            const pill = r.status === 'Reported' ? 'yes' : r.status === 'Report only' ? 'only' : 'no';
            return `<td class="${st.cls}" style="${st.style}"><span class="pill ${pill}">${
              schedEsc(r.status)}</span></td>`;
          }
          const txt = schedRecText(r, c.key);
          const cls = (c.key === 'id' ? 'id'
            : (c.type === 'num' || c.type === 'time') ? 'r'
            : txt ? '' : 'dim') + (st.cls ? ' ' + st.cls : '');
          return `<td class="${cls}" style="${st.style}" title="${schedEsc(txt)}">${
            schedEsc(txt) || '<span class="dim">—</span>'}</td>`;
        }).join('');
        return `<tr class="${r.status === 'Report only' ? 'orphan' : ''}">${cells}</tr>`;
      }).join('');
    }

    function schedRecTotalsHTML(t) {
      const cell = (lbl, val) =>
        `<span><span class="lbl">${lbl}</span><span class="val">${val}</span></span>`;
      return [
        cell('Records',    schedNum(t.rows, 0)),
        cell('Days',       schedNum(t.days.size, 0)),
        cell('Drivers',    schedNum(t.drivers.size, 0)),
        cell('Trucks',     schedNum(t.trucks.size, 0)),
        cell('Sched hrs',  schedNum(t.planHrs, 2)),
        cell('Actual hrs', schedNum(t.actHrs, 2)),
        cell('Tons',       schedNum(t.tons, 2)),
        cell('Loads',      schedNum(t.loads, 0)),
        cell('Tons / hr',  t.actHrs > 0 ? schedNum(t.tons / t.actHrs, 2) : '—'),
        cell('Reported',   schedNum(t.reported, 0) + ' / ' + schedNum(t.rows, 0)),
      ].join('');
    }

    function schedRecPaint() {
      const body = document.getElementById('sched-rec-body');
      if (!body) return;
      schedRecEnsureReports();

      const rows = schedRecView();
      const hdr  = document.getElementById('sched-rec-hdr');
      if (hdr) hdr.innerHTML = schedRecHeadHTML();
      body.innerHTML = schedRecBodyHTML(rows);

      const tot = document.getElementById('sched-rec-totals');
      if (tot) tot.innerHTML = schedRecTotalsHTML(schedRecTotals(rows));

      const note = document.getElementById('sched-rec-note');
      if (!note) return;
      // Everything the tab has to admit to, in one line: what is still loading,
      // what failed and how to try it again, what was left out of the pull, and
      // what is not drawn. Nothing is capped or dropped silently.
      const bits = [], btns = [];
      const btn = (label, fn) =>
        `<button class="rec-btn" style="margin-left:0.4rem" onclick="${fn}">${label}</button>`;
      const waiting = SCHED_BOARDS.filter(cfg => {
        const st = _schedStates[cfg.id];
        return st && !st.loaded && !st.loadError;
      });
      const broke = SCHED_BOARDS.filter(cfg => (_schedStates[cfg.id] || {}).loadError);
      let cls = 'rec-note';
      if (waiting.length) bits.push('Loading the ' + waiting.map(c => c.noun.toLowerCase()).join(' and ') + ' schedule…');
      if (schedRec.reportsLoading) bits.push('Loading driver reports…');
      if (broke.length) {
        cls = 'rec-note err';
        bits.push('Could not load the ' + broke.map(c => c.noun.toLowerCase()).join(' and ') +
          ' schedule, so those records are missing.');
        btns.push(btn('Retry', 'schedRecRetryBoards()'));
      }
      if (schedRec.reportsErr) {
        if (cls === 'rec-note') cls = 'rec-note warn';
        bits.push('Driver reports could not be loaded (' + schedRec.reportsErr +
          '), so the reported columns are empty.');
        btns.push(btn('Retry reports', 'schedRecRetryReports()'));
      } else if (schedRec.reportsShort) {
        if (cls === 'rec-note') cls = 'rec-note warn';
        bits.push('That range is wider than one pull: driver reports were read through ' +
          schedRec.reportsShort + ' only. Narrow the dates for the rest.');
      }
      if (!schedRec.showAll && rows.length > SCHED_REC_DRAW) {
        bits.push('Showing the first ' + schedNum(SCHED_REC_DRAW, 0) + ' of ' +
          schedNum(rows.length, 0) + ' records — the download carries all of them.');
        btns.push(btn('Show all', 'schedRecShowAll()'));
      }
      if (!bits.length) bits.push('Click a column heading to sort · every filter narrows the download too.');
      note.className = cls;
      note.innerHTML = schedEsc(bits.join(' · ')) + btns.join('');
    }

    /* ── Controls ── */

    /** Put the range state back into the boxes that show it. */
    function schedRecSyncRange() {
      const f = document.getElementById('sched-rec-from');    if (f) f.value = schedRec.from;
      const t = document.getElementById('sched-rec-to');      if (t) t.value = schedRec.to;
      const p = document.getElementById('sched-rec-preset');  if (p) p.value = schedRec.preset;
    }

    /** Both retries are buttons rather than something a repaint does on its
     *  own: every keystroke repaints, and an endpoint that is down would be
     *  asked again once per character. */
    function schedRecRetryBoards() {
      SCHED_BOARDS.forEach(cfg => {
        const st = _schedStates[cfg.id];
        if (st) st.loadError = null;
      });
      renderSchedRecords();
    }

    function schedRecRetryReports() {
      schedRec.reportsErr      = null;
      schedRec.reportsErrRange = '';
      schedRecPaint();
    }

    function schedRecSetRange() {
      const f = document.getElementById('sched-rec-from');
      const t = document.getElementById('sched-rec-to');
      let from = f ? f.value : schedRec.from;
      let to   = t ? t.value : schedRec.to;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(from) || !/^\d{4}-\d{2}-\d{2}$/.test(to)) return;
      if (to < from) { const s = from; from = to; to = s; }   // typed back to front
      schedRec.from    = from;
      schedRec.to      = to;
      schedRec.preset  = 'custom';
      schedRec.showAll = false;
      schedRecSyncRange();
      schedRecPaint();
    }

    function schedRecSetPreset(key) {
      if (key === 'custom') { schedRec.preset = 'custom'; return; }
      schedRecApplyPreset(key);
      schedRec.showAll = false;
      schedRecSyncRange();
      schedRecPaint();
    }

    function schedRecSetBoard(v)  { schedRec.board  = v; schedRec.showAll = false; schedRecPaint(); }
    function schedRecSetStatus(v) { schedRec.status = v; schedRec.showAll = false; schedRecPaint(); }
    function schedRecSetQ(v)      { schedRec.q      = v; schedRec.showAll = false; schedRecPaint(); }
    function schedRecShowAll()    { schedRec.showAll = true; schedRecPaint(); }

    function schedRecSetCol(key, v, el) {
      schedRec.col[key] = v;
      schedRec.showAll  = false;
      if (el) el.classList.toggle('on', !!String(v || '').trim());
      schedRecPaint();
    }

    function schedRecSortBy(key) {
      const col = SCHED_REC_BY_KEY[key];
      if (!col) return;
      // A column opens on the reading its values are usually wanted in:
      // biggest or latest first for a figure or a date, A–Z for a name.
      if (schedRec.sort.key === key) {
        schedRec.sort.dir = schedRec.sort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        schedRec.sort.key = key;
        schedRec.sort.dir = (col.type === 'num' || col.type === 'date') ? 'desc' : 'asc';
      }
      schedRecPaint();
    }

    function schedRecClear() {
      schedRec.col     = {};
      schedRec.q       = '';
      schedRec.board   = 'all';
      schedRec.status  = 'all';
      schedRec.showAll = false;
      SCHED_REC_COLS.forEach(c => {
        const el = document.getElementById('sched-rec-f-' + c.key);
        if (el) { el.value = ''; el.classList.remove('on'); }
      });
      const q = document.getElementById('sched-rec-q');      if (q) q.value = '';
      const b = document.getElementById('sched-rec-board');  if (b) b.value = 'all';
      const s = document.getElementById('sched-rec-status'); if (s) s.value = 'all';
      schedRecPaint();
    }

    /* ── Workbook ══════════════════════════════════════════════════════════
       Two sheets. Records is every row on screen — filters and sort and all —
       under a frozen header with Excel's own auto-filter already switched on,
       dates written as dates so a date filter works on them. Summary rolls the
       same rows up the ways the office reads them: per driver, division, job,
       truck, truck type, material and day, with the hours, tons, loads and the
       rates that come out of them. */

    function schedRecXlsx(rows) {
      const cell = (r, c, v, style) => {
        const ref = _colName(c) + r;
        if (v === '' || v == null) return style ? `<c r="${ref}" s="${style}"/>` : '';
        if (typeof v === 'number') {
          if (!isFinite(v)) return '';
          return `<c r="${ref}"${style ? ` s="${style}"` : ''}><v>${v}</v></c>`;
        }
        return `<c r="${ref}"${style ? ` s="${style}"` : ''} t="inlineStr">` +
               `<is><t xml:space="preserve">${_xmlEsc(v)}</t></is></c>`;
      };

      /* ── Sheet 1: the records ── */
      const recXml = [`<row r="1">${SCHED_REC_COLS.map((c, i) =>
        cell(1, i, c.label, _XLSX_S.HEAD)).join('')}</row>`];
      rows.forEach((row, i) => {
        const r = i + 2;
        recXml.push(`<row r="${r}">${SCHED_REC_COLS.map((c, ci) => {
          if (c.type === 'date') {
            const ser = _xlsxSerial(row[c.key]);
            return ser === null ? cell(r, ci, String(row[c.key] || '')) : cell(r, ci, ser, _XLSX_S.DATE);
          }
          if (c.type === 'num') {
            const v = row[c.key];
            if (v === '' || v == null) return '';
            return cell(r, ci, Number(v), c.dp === 0 ? _XLSX_S.PLAIN : _XLSX_S.NUM2);
          }
          return cell(r, ci, schedRecText(row, c.key));
        }).join('')}</row>`);
      });
      const recCols = `<cols>${SCHED_REC_COLS.map((c, i) =>
        `<col min="${i + 1}" max="${i + 1}" width="${c.w}" customWidth="1"/>`).join('')}</cols>`;

      /* ── Sheet 2: the rollups ── */
      const t   = schedRecTotals(rows);
      const now = new Date().toLocaleString('en-US', { weekday: 'short', month: 'short',
        day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      const boardLbl = schedRec.board === 'all'
        ? 'All boards'
        : ((SCHED_BOARDS.find(b => b.id === schedRec.board) || {}).noun || schedRec.board);
      const r2 = n => Math.round(n * 100) / 100;

      const sum = [];
      let sr = 0;
      const put = (vals, style) => {
        sr++;
        sum.push(`<row r="${sr}">${vals.map((v, c) => cell(sr, c, v, style)).join('')}</row>`);
      };
      const gap = () => { sr++; };

      put(['Schedule Records — Summary'], _XLSX_S.BOLD);
      put(['Range',     schedRec.from + '  to  ' + schedRec.to]);
      put(['Board',     boardLbl]);
      put(['Status',    schedRec.status === 'all' ? 'Any' : schedRec.status]);
      put(['Filters',   schedRecFilterSummary()]);
      put(['Generated', now]);
      gap();
      put(['TOTALS'], _XLSX_S.HEAD);
      put(['Records',          t.rows]);
      put(['Days',             t.days.size]);
      put(['Drivers',          t.drivers.size]);
      put(['Trucks',           t.trucks.size]);
      put(['Scheduled hours',  r2(t.planHrs)]);
      put(['Actual hours',     r2(t.actHrs)]);
      put(['Tons',             r2(t.tons)]);
      put(['Loads',            t.loads]);
      put(['Tons / hour',      t.actHrs > 0 ? r2(t.tons  / t.actHrs) : '']);
      put(['Loads / hour',     t.actHrs > 0 ? r2(t.loads / t.actHrs) : '']);
      put(['Reported',         t.reported]);

      const ROLLUPS = [
        { title: 'BY DRIVER',        key: 'driver'   },
        { title: 'BY DIVISION',      key: 'division' },
        { title: 'BY PROJECT / JOB', key: 'project'  },
        { title: 'BY TRUCK',         key: 'unit'     },
        { title: 'BY TRUCK TYPE',    key: 'unitType' },
        { title: 'BY MATERIAL',      key: 'material' },
        { title: 'BY DAY',           key: 'date'     },
      ];
      ROLLUPS.forEach(g => {
        gap();
        put([g.title], _XLSX_S.HEAD);
        put(['', 'Records', 'Sched hrs', 'Actual hrs', 'Tons', 'Loads', 'Tons / hr', 'Loads / hr'], _XLSX_S.BOLD);
        schedRecRollup(rows, g.key).forEach(x => {
          sr++;
          sum.push(`<row r="${sr}">` +
            cell(sr, 0, x.label || '(blank)') +
            cell(sr, 1, x.rows) +
            cell(sr, 2, r2(x.planHrs), _XLSX_S.NUM2) +
            cell(sr, 3, r2(x.actHrs),  _XLSX_S.NUM2) +
            cell(sr, 4, r2(x.tons),    _XLSX_S.NUM2) +
            cell(sr, 5, x.loads) +
            cell(sr, 6, x.actHrs > 0 ? r2(x.tons  / x.actHrs) : '', _XLSX_S.NUM2) +
            cell(sr, 7, x.actHrs > 0 ? r2(x.loads / x.actHrs) : '', _XLSX_S.NUM2) +
            '</row>');
        });
      });
      const sumCols = '<cols><col min="1" max="1" width="34" customWidth="1"/>' +
        '<col min="2" max="8" width="13" customWidth="1"/></cols>';

      return _xlsxPackage([
        { name: 'Records', colsXml: recCols, rowsXml: recXml.join(''), freeze: true,
          autoFilterRef: 'A1:' + _colName(SCHED_REC_COLS.length - 1) + (rows.length + 1) },
        { name: 'Summary', colsXml: sumCols, rowsXml: sum.join('') },
      ]);
    }

    /** One rollup: the rows grouped on a column. */
    function schedRecRollup(rows, key) {
      const m = new Map();
      rows.forEach(r => {
        const k = schedRecText(r, key);
        let g = m.get(k);
        if (!g) { g = { label: k, rows: 0, planHrs: 0, actHrs: 0, tons: 0, loads: 0 }; m.set(k, g); }
        g.rows++;
        if (r.planHrs !== '') g.planHrs += r.planHrs;
        if (r.actHrs  !== '') g.actHrs  += r.actHrs;
        if (r.tons    !== '') g.tons    += r.tons;
        if (r.loads   !== '') g.loads   += r.loads;
      });
      const out = [...m.values()];
      // Days read in date order; everything else busiest first.
      if (key === 'date') return out.sort((a, b) => String(a.label).localeCompare(String(b.label)));
      return out.sort((a, b) => b.rows - a.rows || String(a.label).localeCompare(String(b.label)));
    }

    /** The column filters and the search box in words, for the summary sheet —
     *  so a workbook that left the building says what it was narrowed to. */
    function schedRecFilterSummary() {
      const bits = [];
      SCHED_REC_COLS.forEach(c => {
        const v = String(schedRec.col[c.key] || '').trim();
        if (v) bits.push(c.label + ' contains "' + v + '"');
      });
      const q = String(schedRec.q || '').trim();
      if (q) bits.push('search "' + q + '"');
      return bits.length ? bits.join('; ') : 'none';
    }

    function schedRecDownload() {
      const rows = schedRecView();
      const blob = new Blob([schedRecXlsx(rows)],
        { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'schedule-records-' + schedRec.from + '_to_' + schedRec.to + '.xlsx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      // Revoked on a timer rather than immediately: Safari reads the blob after
      // the click returns, and pulling it out downloads an empty file.
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }

    /* ═══════════════════════════════════════════
       CSV UPLOAD
    ═══════════════════════════════════════════ */
    /* ═══════════════════════════════════════════
       DASHBOARD
    ═══════════════════════════════════════════ */
    function renderDashboard() {
      const root = document.getElementById('tab-dashboard');
      if (!root) return;

      const fmtMoney = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
      const fmtHrs   = n => n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
      const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      const rev = e => (parseFloat(e.total_hours)||0)*(parseFloat(e.haul_fee)||0);
      const hrs = e => parseFloat(e.total_hours)||0;

      // Determine "current" year — most recent year in data, else calendar year
      const allYears = [...new Set(
        divEntries.map(e=>(e.actual_date||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y))
      )].sort();
      const curYear  = allYears.length ? allYears[allYears.length-1] : String(new Date().getFullYear());
      const prevYear = allYears.length > 1 ? allYears[allYears.length-2] : null;

      const curEntries  = divEntries.filter(e=>(e.actual_date||'').startsWith(curYear));
      const prevEntries = prevYear ? divEntries.filter(e=>(e.actual_date||'').startsWith(prevYear)) : [];

      const curRev   = curEntries.reduce((s,e)=>s+rev(e),0);
      const curHrs   = curEntries.reduce((s,e)=>s+hrs(e),0);
      const prevRev  = prevEntries.reduce((s,e)=>s+rev(e),0);
      const prevHrs  = prevEntries.reduce((s,e)=>s+hrs(e),0);

      const totalRevAll  = divEntries.reduce((s,e)=>s+rev(e),0);
      const totalHrsAll  = divEntries.reduce((s,e)=>s+hrs(e),0);
      const activeUnits  = [...new Set(curEntries.map(e=>e.unit).filter(Boolean))].length;
      const activeDrivers= [...new Set(curEntries.map(e=>e.driver).filter(Boolean))].length;

      // ── Shared helpers ──
      const barRow = (name, val, max, color, label, nameW='140px') =>
        `<div style="display:flex;align-items:center;gap:0.65rem;margin-bottom:0.5rem">
          <span style="font-size:0.74rem;color:var(--text);width:${nameW};flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(name)}">${esc(name)}</span>
          <div style="flex:1;background:var(--border);border-radius:3px;height:9px;overflow:hidden;min-width:0">
            <div style="width:${Math.min(100,(val/max)*100).toFixed(2)}%;height:100%;background:${color};border-radius:3px;transition:width 0.3s"></div>
          </div>
          <span style="font-size:0.7rem;color:var(--muted);white-space:nowrap;min-width:80px">${label}</span>
        </div>`;

      const chartCard = (title, color, body) =>
        `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem">
          <div style="font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:${color};margin-bottom:1rem">${title}</div>
          ${body || `<div style="color:var(--muted);font-size:0.8rem">No data.</div>`}
        </div>`;

      const noData = `<div style="color:var(--muted);font-size:0.8rem;padding:0.5rem 0">No data yet.</div>`;

      // ── Monthly Revenue (current year) ──
      const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const byMonth = {};
      curEntries.forEach(e => {
        const idx = parseInt((e.actual_date||'').slice(5,7),10)-1;
        if (idx < 0 || idx > 11) return;
        const k = MONTHS[idx];
        if (!byMonth[k]) byMonth[k] = { revenue:0, hours:0, idx };
        byMonth[k].revenue += rev(e);
        byMonth[k].hours   += hrs(e);
      });
      const monthKeys    = Object.keys(byMonth).sort((a,b)=>byMonth[a].idx-byMonth[b].idx);
      const maxMonthRev  = Math.max(...monthKeys.map(k=>byMonth[k].revenue),1);
      const monthRevRows = monthKeys.length
        ? monthKeys.map(k=>barRow(k,byMonth[k].revenue,maxMonthRev,'#4ade80',fmtMoney(byMonth[k].revenue),'55px')).join('')
        : noData;

      // ── By customer (current year) ──
      // Replaces the old top-5 revenue bars. The bars ranked customers and
      // stopped there; this says what each one is worth AND what is still owed
      // on it, which is the question the office actually has to answer. Invoice
      // state comes off the row's own sub-row fields — the same ones the Truck
      // Tracking tab edits, so the two never disagree.
      const invState = e => {
        if (rev(e) <= 0)          return 'none';
        if (e.date_paid)          return 'paid';
        if (e.invoice_sent_date)  return 'awaiting';
        return 'uninvoiced';
      };
      const byCust = {};
      curEntries.forEach(e => {
        const k = e.customer || '(none)';
        if (!byCust[k]) byCust[k] = {
          name:k, entries:0, hours:0, revenue:0,
          uninvoiced:0, awaiting:0, paid:0,
          units:new Set(), drivers:new Set(), lastHaul:'',
        };
        const c = byCust[k];
        c.entries++;
        c.hours   += hrs(e);
        c.revenue += rev(e);
        const st = invState(e);
        if (st !== 'none') c[st] += rev(e);
        if (e.unit)   c.units.add(e.unit);
        if (e.driver) c.drivers.add(e.driver);
        const d = (e.actual_date||'').slice(0,10);
        if (d > c.lastHaul) c.lastHaul = d;
      });
      const custRows = Object.values(byCust)
        .sort((a,b)=>b.revenue-a.revenue || a.name.localeCompare(b.name));

      const custTotals = custRows.reduce((t,c)=>({
        entries:t.entries+c.entries, hours:t.hours+c.hours, revenue:t.revenue+c.revenue,
        uninvoiced:t.uninvoiced+c.uninvoiced, awaiting:t.awaiting+c.awaiting, paid:t.paid+c.paid,
      }), { entries:0, hours:0, revenue:0, uninvoiced:0, awaiting:0, paid:0 });

      const money0 = v => v > 0.005 ? fmtMoney(v) : '—';
      const custTableRows = custRows.map(c => {
        const meta = [
          c.units.size   ? `${c.units.size} unit${c.units.size === 1 ? '' : 's'}` : '',
          c.drivers.size ? `${c.drivers.size} driver${c.drivers.size === 1 ? '' : 's'}` : '',
          c.lastHaul ? `last haul ${c.lastHaul}` : '',
        ].filter(Boolean).join(' · ');
        return `<tr>
          <td>
            <div class="pt-name" title="${esc(c.name)}">${esc(c.name)}</div>
            ${meta ? `<div class="pt-meta">${esc(meta)}</div>` : ''}
          </td>
          <td class="pt-num">${c.entries}</td>
          <td class="pt-num" style="color:var(--muted)">${fmtHrs(c.hours)}</td>
          <td class="pt-num" style="color:var(--blue)">${fmtMoney(c.revenue)}</td>
          <td class="pt-num" style="color:var(--muted)">${c.hours > 0 ? fmtMoney(c.revenue / c.hours) : '—'}</td>
          <td class="pt-num" style="color:${c.uninvoiced > 0.005 ? 'var(--orange)' : 'var(--muted)'}">${money0(c.uninvoiced)}</td>
          <td class="pt-num" style="color:${c.awaiting   > 0.005 ? 'var(--amber)'  : 'var(--muted)'}">${money0(c.awaiting)}</td>
          <td class="pt-num" style="color:${c.paid       > 0.005 ? 'var(--green)'  : 'var(--muted)'}">${money0(c.paid)}</td>
        </tr>`;
      }).join('');

      const custTableHtml = custRows.length ? `
        <div class="proj-table-wrap">
          <table class="proj-table">
            <thead><tr>
              <th>Customer</th>
              <th style="text-align:right">Entries</th>
              <th style="text-align:right">Hours</th>
              <th style="text-align:right">Revenue</th>
              <th style="text-align:right" title="Revenue divided by hours — what the work billed at, on average.">Avg / Hr</th>
              <th style="text-align:right" title="Billable and not yet invoiced.">To Invoice</th>
              <th style="text-align:right" title="Invoiced and not yet paid.">Awaiting Payment</th>
              <th style="text-align:right">Paid</th>
            </tr></thead>
            <tbody>${custTableRows}</tbody>
            <tfoot><tr>
              <td>Totals · ${custRows.length} customer${custRows.length === 1 ? '' : 's'}</td>
              <td class="pt-num">${custTotals.entries}</td>
              <td class="pt-num" style="color:var(--muted)">${fmtHrs(custTotals.hours)}</td>
              <td class="pt-num" style="color:var(--blue)">${fmtMoney(custTotals.revenue)}</td>
              <td class="pt-num"></td>
              <td class="pt-num" style="color:${custTotals.uninvoiced > 0.005 ? 'var(--orange)' : 'var(--muted)'}">${money0(custTotals.uninvoiced)}</td>
              <td class="pt-num" style="color:${custTotals.awaiting   > 0.005 ? 'var(--amber)'  : 'var(--muted)'}">${money0(custTotals.awaiting)}</td>
              <td class="pt-num" style="color:${custTotals.paid       > 0.005 ? 'var(--green)'  : 'var(--muted)'}">${money0(custTotals.paid)}</td>
            </tr></tfoot>
          </table>
        </div>`
        : `<div class="home-empty">No hauls recorded for ${curYear}.</div>`;

      // ── Invoice state across the year, for the strip ──
      const invTotals = { uninvoiced:{amt:0,n:0}, awaiting:{amt:0,n:0}, paid:{amt:0,n:0} };
      curEntries.forEach(e => {
        const st = invState(e);
        if (st === 'none') return;
        invTotals[st].amt += rev(e);
        invTotals[st].n++;
      });

      // Averages, as the Financials sub-tab reads them: revenue per entry, and
      // the mean haul fee across entries — not revenue ÷ hours.
      const avgRevPerEntry = curEntries.length ? curRev / curEntries.length : 0;
      const avgHaulFee     = curEntries.length
        ? curEntries.reduce((s,e)=>s+(parseFloat(e.haul_fee)||0),0) / curEntries.length : 0;

      // ── Top 5 drivers by hours (current year) ──
      const byDrv = {};
      curEntries.forEach(e => {
        const k = e.driver||'(none)';
        if (!byDrv[k]) byDrv[k] = 0;
        byDrv[k] += hrs(e);
      });
      const topDrv = Object.entries(byDrv).sort((a,b)=>b[1]-a[1]).slice(0,5);
      const maxDH  = Math.max(...topDrv.map(r=>r[1]),1);
      const drvBarRows = topDrv.length
        ? topDrv.map(([n,v])=>barRow(n,v,maxDH,'#34d399',fmtHrs(v)+' hrs')).join('')
        : noData;

      // ── Recent 10 entries ──
      const recent = [...divEntries]
        .filter(e=>e.actual_date)
        .sort((a,b)=>b.actual_date.localeCompare(a.actual_date))
        .slice(0,10);

      const recentRows = recent.length ? recent.map(e => `
        <tr>
          <td style="color:var(--muted)">${esc(e.actual_date)}</td>
          <td style="color:var(--orange);font-weight:600">${esc(e.task_number)}</td>
          <td>${esc(e.driver)}</td>
          <td>${esc(e.customer)}</td>
          <td class="pt-num">${fmtHrs(hrs(e))} hrs</td>
          <td class="pt-num" style="color:var(--amber);font-weight:600">${fmtMoney(rev(e))}</td>
        </tr>`).join('')
        : `<tr><td colspan="6" style="padding:1.5rem;text-align:center;color:var(--muted)">No entries yet.</td></tr>`;

      // Year-over-year now rides on the strip as a signed percentage next to the
      // figure it describes, the way the other division pages carry theirs. The
      // old pair of side-by-side cards said the same thing in a lot more space.
      const vsPrev = (curr, prev) => {
        if (!prevYear || !prev) return null;
        const p = ((curr - prev) / prev) * 100;
        return `${p >= 0 ? '+' : '−'}${Math.abs(p).toFixed(1)}% vs ${prevYear}`;
      };

      const metric = (label, value, sub, color) => `
        <div class="home-metric-item">
          <span class="home-metric-label">${label}</span>
          <span class="home-metric-value"${color ? ` style="color:${color}"` : ''}>${value}</span>
          <span class="home-metric-sub">${sub}</span>
        </div>`;

      const entryWord = n => `${n} entr${n === 1 ? 'y' : 'ies'}`;

      root.innerHTML = `<div style="padding:1.25rem;max-width:1400px">

        <p class="home-section-title">${curYear} Overview <span style="font-weight:400;text-transform:none;letter-spacing:0">(${entryWord(curEntries.length)})</span></p>
        <div class="home-metric-strip">
          ${metric('Total Revenue', fmtMoney(curRev),
                   vsPrev(curRev, prevRev) || `${entryWord(curEntries.length)} this year`, 'var(--amber)')}
          ${metric('Total Hours', fmtHrs(curHrs),
                   vsPrev(curHrs, prevHrs) || 'logged this year', 'var(--blue)')}
          ${metric('Active Units', activeUnits, 'units running')}
          ${metric('Active Drivers', activeDrivers, 'drivers active')}
          ${metric('Avg Revenue / Entry', fmtMoney(avgRevPerEntry), entryWord(curEntries.length), 'var(--green)')}
          ${metric('Avg Haul Fee', fmtMoney(avgHaulFee), 'per hour, averaged')}
          ${metric('To Invoice', fmtMoney(invTotals.uninvoiced.amt),
                   `${invTotals.uninvoiced.n} haul${invTotals.uninvoiced.n === 1 ? '' : 's'} not yet sent`,
                   invTotals.uninvoiced.amt > 0.005 ? 'var(--orange)' : 'var(--green)')}
          ${metric('Awaiting Payment', fmtMoney(invTotals.awaiting.amt),
                   `${fmtMoney(invTotals.paid.amt)} paid`,
                   invTotals.awaiting.amt > 0.005 ? 'var(--amber)' : 'var(--green)')}
        </div>

        <p class="home-section-title">By Customer — ${curYear}</p>
        ${custTableHtml}

        <p class="home-section-title">Monthly Revenue — ${curYear}</p>
        ${chartCard('Revenue by Month', '#4ade80', monthRevRows)}

    /* ═══════════════════════════════════════════
       ANALYTICS — FINANCIALS
    ═══════════════════════════════════════════ */
    function renderFinancials() {
      const root = document.getElementById('sub-financials');
      if (!root) return;

      const esc = s => String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      const fmtMoney = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
      const fmtHrs   = n => n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
      const pct = (a, b) => b ? ((a - b) / b * 100) : null;

      const allYears = [...new Set(
        divEntries.map(e=>(e.actual_date||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y))
      )].sort();
      const tabYears = [...new Set([...allYears,'2025','2026'])].sort();

      const filtered = financialsYearFilter === 'all'
        ? divEntries
        : divEntries.filter(e=>(e.actual_date||'').startsWith(financialsYearFilter));

      const rev  = e => (parseFloat(e.total_hours)||0) * (parseFloat(e.haul_fee)||0);
      const hrs  = e => parseFloat(e.total_hours)||0;

      const totalRev   = filtered.reduce((s,e)=>s+rev(e),0);
      const totalHrs   = filtered.reduce((s,e)=>s+hrs(e),0);
      const avgRevEntry = filtered.length ? totalRev / filtered.length : 0;
      const avgHaulFee  = filtered.length
        ? filtered.reduce((s,e)=>s+(parseFloat(e.haul_fee)||0),0) / filtered.length : 0;

      // ── Shared helpers ──
      const statCard = (label, value, sub, accent=false) =>
        `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem">
          <div style="font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:0.45rem">${label}</div>
          <div style="font-size:1.55rem;font-weight:700;color:${accent?'#facc15':'var(--text)'};line-height:1.15;margin-bottom:0.25rem">${value}</div>
          <div style="font-size:0.7rem;color:var(--muted)">${sub}</div>
        </div>`;

      const sectionLabel = txt =>
        `<div style="font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:0.65rem;margin-top:1.75rem">${txt}</div>`;

      const chartCard = (title, color, rowsHtml) =>
        `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem">
          <div style="font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:${color};margin-bottom:1rem">${title}</div>
          ${rowsHtml || `<div style="color:var(--muted);font-size:0.8rem">No data.</div>`}
        </div>`;

      const barRow = (name, val, max, color, label) =>
        `<div style="display:flex;align-items:center;gap:0.65rem;margin-bottom:0.5rem">
          <span style="font-size:0.74rem;color:var(--text);width:130px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(name)}">${esc(name)}</span>
          <div style="flex:1;background:var(--border);border-radius:3px;height:9px;overflow:hidden;min-width:0">
            <div style="width:${Math.min(100,(val/max)*100).toFixed(2)}%;height:100%;background:${color};border-radius:3px;transition:width 0.3s"></div>
          </div>
          <span style="font-size:0.7rem;color:var(--muted);white-space:nowrap;min-width:85px">${label}</span>
        </div>`;

      const noData = `<div style="color:var(--muted);font-size:0.8rem;padding:0.5rem 0">No data for this period.</div>`;

      const thStyle = `padding:0.6rem 0.75rem;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)`;
      const thL = `${thStyle};text-align:left`;
      const thR = `${thStyle};text-align:right`;

      // ── Year-over-Year aggregation (always all data) ──
      const byYear = {};
      divEntries.forEach(e => {
        const y = (e.actual_date||'').slice(0,4);
        if (!/^\d{4}$/.test(y)) return;
        if (!byYear[y]) byYear[y] = { revenue:0, hours:0, count:0 };
        byYear[y].revenue += rev(e);
        byYear[y].hours   += hrs(e);
        byYear[y].count++;
      });
      const yoyYears = Object.keys(byYear).sort();
      const maxYoyRev = Math.max(...yoyYears.map(y=>byYear[y].revenue), 1);
      const maxYoyHrs = Math.max(...yoyYears.map(y=>byYear[y].hours), 1);

      const yoyRevRows = yoyYears.map(y => barRow(y, byYear[y].revenue, maxYoyRev, '#facc15', fmtMoney(byYear[y].revenue))).join('');
      const yoyHrsRows = yoyYears.map(y => barRow(y, byYear[y].hours,   maxYoyHrs, '#60a5fa', fmtHrs(byYear[y].hours)+' hrs')).join('');

      const yoyTableRows = yoyYears.map((y, i) => {
        const d = byYear[y];
        const prev = byYear[yoyYears[i-1]];
        const change = prev ? pct(d.revenue, prev.revenue) : null;
        const changeHtml = change === null
          ? `<span style="color:var(--muted)">—</span>`
          : `<span style="color:${change>=0?'#4ade80':'#f87171'};font-weight:600">${change>=0?'+':''}${change.toFixed(1)}%</span>`;
        return `<tr style="border-bottom:1px solid var(--border);${i%2===1?'background:rgba(255,255,255,0.02)':''}">
          <td style="padding:0.55rem 1rem;color:var(--text);font-weight:600">${esc(y)}</td>
          <td style="padding:0.55rem 0.75rem;text-align:right;color:var(--muted)">${d.count}</td>
          <td style="padding:0.55rem 0.75rem;text-align:right;color:var(--text)">${fmtHrs(d.hours)} hrs</td>
          <td style="padding:0.55rem 0.75rem;text-align:right;color:#facc15;font-weight:600">${fmtMoney(d.revenue)}</td>
          <td style="padding:0.55rem 0.75rem;text-align:right;color:var(--muted)">${fmtMoney(d.count ? d.revenue/d.count : 0)}</td>
          <td style="padding:0.55rem 1rem;text-align:right">${changeHtml}</td>
        </tr>`;
      }).join('');

      // ── Monthly breakdown (filtered year) ──
      const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const byMonth = {};
      filtered.forEach(e => {
        const m = (e.actual_date||'').slice(5,7);
        if (!m) return;
        const idx = parseInt(m,10) - 1;
        const label = MONTHS[idx] || m;
        if (!byMonth[label]) byMonth[label] = { revenue:0, hours:0, idx };
        byMonth[label].revenue += rev(e);
        byMonth[label].hours   += hrs(e);
      });
      const monthKeys = Object.keys(byMonth).sort((a,b)=>byMonth[a].idx-byMonth[b].idx);
      const maxMonthRev = Math.max(...monthKeys.map(k=>byMonth[k].revenue), 1);
      const maxMonthHrs = Math.max(...monthKeys.map(k=>byMonth[k].hours),   1);
      const monthRevRows = monthKeys.length ? monthKeys.map(k=>barRow(k,byMonth[k].revenue,maxMonthRev,'#4ade80',fmtMoney(byMonth[k].revenue))).join('') : noData;
      const monthHrsRows = monthKeys.length ? monthKeys.map(k=>barRow(k,byMonth[k].hours,  maxMonthHrs,'#60a5fa',fmtHrs(byMonth[k].hours)+' hrs')).join('') : noData;

      // ── Revenue by customer / driver (filtered) ──
      const groupBy = (field) => {
        const map = {};
        filtered.forEach(e => {
          const k = e[field] || '(none)';
          if (!map[k]) map[k] = { revenue:0, hours:0, count:0 };
          map[k].revenue += rev(e);
          map[k].hours   += hrs(e);
          map[k].count++;
        });
        return Object.entries(map).map(([name,d])=>({name,...d})).sort((a,b)=>b.revenue-a.revenue);
      };
      const custRows   = groupBy('customer');
      const driverRows = groupBy('driver');
      const maxCustRev   = Math.max(...custRows.map(r=>r.revenue),   1);
      const maxDriverRev = Math.max(...driverRows.map(r=>r.revenue), 1);
      const custRevRows   = custRows.length   ? custRows.map(r=>barRow(r.name,r.revenue,maxCustRev,'#facc15',fmtMoney(r.revenue))).join('')   : noData;
      const driverRevRows = driverRows.length ? driverRows.map(r=>barRow(r.name,r.revenue,maxDriverRev,'#fb923c',fmtMoney(r.revenue))).join('') : noData;

      // ── Year tabs ──
      const yrTabsHtml = `
        <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:1.25rem;flex-wrap:wrap">
          <button class="yr-tab${financialsYearFilter==='all'?' active':''}" onclick="financialsYearFilter='all';renderFinancials()">All</button>
          ${tabYears.map(y=>`<button class="yr-tab${financialsYearFilter===y?' active':''}" onclick="financialsYearFilter='${y}';renderFinancials()">${y}</button>`).join('')}
        </div>`;

      const yoySection = yoyYears.length < 2 ? '' : `
        ${sectionLabel('Year-over-Year Comparison')}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1rem">
          ${chartCard('Revenue by Year', '#facc15', yoyRevRows)}
          ${chartCard('Hours by Year',   '#60a5fa', yoyHrsRows)}
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:0.25rem">
          <table style="width:100%;border-collapse:collapse;font-size:0.78rem">
            <thead>
              <tr style="background:var(--surface2)">
                <th style="${thL};padding-left:1rem">Year</th>
                <th style="${thR}">Entries</th>
                <th style="${thR}">Total Hours</th>
                <th style="${thR}">Total Revenue</th>
                <th style="${thR}">Avg Rev / Entry</th>
                <th style="${thR};padding-right:1rem">YoY Change</th>
              </tr>
            </thead>
            <tbody>${yoyTableRows}</tbody>
          </table>
        </div>`;

      root.innerHTML = `
        <div style="padding:1.25rem">
          ${yrTabsHtml}

          <div style="font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:0.65rem">Overview${financialsYearFilter!=='all'?' — '+financialsYearFilter:''}</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0.8rem">
            ${statCard('Total Revenue', fmtMoney(totalRev), filtered.length+' entries', true)}
            ${statCard('Total Hours', fmtHrs(totalHrs)+' hrs', 'across all entries')}
            ${statCard('Avg Revenue / Entry', fmtMoney(avgRevEntry), 'per truck tracking record')}
            ${statCard('Avg Haul Fee', fmtMoney(avgHaulFee), 'average rate per entry')}
          </div>

          ${yoySection}

          ${sectionLabel('Monthly Breakdown' + (financialsYearFilter!=='all'?' — '+financialsYearFilter:''))}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:0.25rem">
            ${chartCard('Revenue by Month', '#4ade80', monthRevRows)}
            ${chartCard('Hours by Month',   '#60a5fa', monthHrsRows)}
          </div>

          ${sectionLabel('Revenue Sources')}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:0.25rem">
            ${chartCard('Revenue by Customer', '#facc15', custRevRows)}
            ${chartCard('Revenue by Driver',   '#fb923c', driverRevRows)}
          </div>
        </div>`;
    }

    /* ═══════════════════════════════════════════
       ANALYTICS — CUSTOMER DATA

    function renderCustomerData() {
      const root = document.getElementById('sub-customer-data');
      if (!root) return;

      const esc = s => String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      const fmtMoney = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
      const fmtHrs   = n => n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});

      // Year tabs
      const dataYears = [...new Set(
        divEntries.map(e=>(e.actual_date||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y))
      )].sort();
      const tabYears = [...new Set([...dataYears,'2025','2026'])].sort();

      const entries = analyticsYearFilter === 'all'
        ? divEntries
        : divEntries.filter(e=>(e.actual_date||'').startsWith(analyticsYearFilter));

      // Summary stats
      const uniqueCustomers = [...new Set(entries.map(e=>e.customer).filter(Boolean))];
      const totalHours   = entries.reduce((s,e)=>s+(parseFloat(e.total_hours)||0),0);
      const totalRevenue = entries.reduce((s,e)=>s+(parseFloat(e.total_hours)||0)*(parseFloat(e.haul_fee)||0),0);

      // Aggregate by customer
      const byCustomer = {};
      entries.forEach(e => {
        const c = e.customer || '(none)';
        if (!byCustomer[c]) byCustomer[c] = { hours:0, revenue:0, count:0 };
        byCustomer[c].hours   += parseFloat(e.total_hours)||0;
        byCustomer[c].revenue += (parseFloat(e.total_hours)||0)*(parseFloat(e.haul_fee)||0);

      const custRows = Object.entries(byCustomer)

          <div style="font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:0.45rem">${label}</div>
          <div style="font-size:1.55rem;font-weight:700;color:${accent?'#facc15':'var(--text)'};line-height:1.15;margin-bottom:0.25rem">${value}</div>

          <span style="font-size:0.74rem;color:var(--text);width:130px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(name)}">${esc(name)}</span>
          <div style="flex:1;background:var(--border);border-radius:3px;height:9px;overflow:hidden;min-width:0">
            <div style="width:${Math.min(100,(val/max)*100).toFixed(2)}%;height:100%;background:${color};border-radius:3px;transition:width 0.3s"></div>
          </div>
          <span style="font-size:0.7rem;color:var(--muted);white-space:nowrap;min-width:85px">${label}</span>
        </div>`;

      const noData = `<div style="color:var(--muted);font-size:0.8rem;padding:0.5rem 0">No data for this period.</div>`;

      const revenueRows = custRows.length ? custRows.map(c=>barRow(c.name,c.revenue,maxRev,'#facc15',fmtMoney(c.revenue))).join('') : noData;
      const hoursRows   = custRows.length ? custRows.map(c=>barRow(c.name,c.hours,maxHours,'#60a5fa',fmtHrs(c.hours)+' hrs')).join('') : noData;

      const yrTabsHtml = `
        <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:1.25rem;flex-wrap:wrap">
          <button class="yr-tab${analyticsYearFilter==='all'?' active':''}" onclick="analyticsYearFilter='all';renderCustomerData()">All</button>
          ${tabYears.map(y=>`<button class="yr-tab${analyticsYearFilter===y?' active':''}" onclick="analyticsYearFilter='${y}';renderCustomerData()">${y}</button>`).join('')}
        </div>`;

      root.innerHTML = `
        <div style="padding:1.25rem">
          ${yrTabsHtml}
          <div style="font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:0.65rem">Overview</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0.8rem;margin-bottom:1.75rem">
            ${statCard('Active Customers', uniqueCustomers.length, entries.length+' total entries')}
            ${statCard('Total Hours', fmtHrs(totalHours)+' hrs', 'across all customers')}
            ${statCard('Total Revenue', fmtMoney(totalRevenue), 'combined invoice total', true)}
            ${statCard('Total Entries', entries.length.toLocaleString(), 'truck tracking records')}
          </div>
          <div style="font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:0.65rem">Breakdown by Customer</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1.75rem">
            ${chartCard('Revenue by Customer','#facc15',revenueRows)}

                  <th style="padding:0.6rem 0.75rem;text-align:right;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)">Avg Haul Fee</th>
                  <th style="padding:0.6rem 1rem;text-align:right;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)">Total Revenue</th>

    /* ═══════════════════════════════════════════
       ANALYTICS — EQUIPMENT UTILIZATION
    ═══════════════════════════════════════════ */
    function renderEquipmentUtilization() {
      const root = document.getElementById('sub-equipment-utilization');
      if (!root) return;

      const esc      = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      const fmtMoney = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
      const fmtHrs   = n => n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});

      const dataYears = [...new Set(divEntries.map(e=>(e.actual_date||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort();
      const tabYears  = [...new Set([...dataYears,'2025','2026'])].sort();
      const entries   = equipYearFilter === 'all' ? divEntries : divEntries.filter(e=>(e.actual_date||'').startsWith(equipYearFilter));

      const totalHrs = entries.reduce((s,e)=>s+(parseFloat(e.total_hours)||0),0);
      const totalRev = entries.reduce((s,e)=>s+(parseFloat(e.total_hours)||0)*(parseFloat(e.haul_fee)||0),0);

      // ── Build unit aggregates ──
      const byUnit = {};
      entries.forEach(e => {
        const k = e.unit || '(none)';
        if (!byUnit[k]) byUnit[k] = { hours:0, revenue:0, fees:[], dates:new Set(), customers:new Set(), drivers:new Set(), entries:[] };
        byUnit[k].hours += parseFloat(e.total_hours)||0;
        byUnit[k].revenue += (parseFloat(e.total_hours)||0)*(parseFloat(e.haul_fee)||0);

        if (e.driver) byUnit[k].drivers.add(e.driver);
        byUnit[k].entries.push(e);

      const unitRows = Object.entries(byUnit)
        .map(([name,d]) => ({ name, ...d,
          daysActive: d.dates.size,
          lastUsed:   [...d.dates].sort().pop() || '',
          avgFee:     d.fees.length ? d.fees.reduce((a,b)=>a+b,0)/d.fees.length : 0,

    const CSV_FIELD_MAP = {
      'task number': 'task_number', 'task_number': 'task_number',
      'actual date':  'actual_date',  'actual_date': 'actual_date',  'date': 'actual_date',
      'driver':       'driver',
      'unit':         'unit',         'unit name':   'unit',          'unit_name': 'unit',
      'actual start': 'actual_start', 'actual_start':'actual_start',  'start': 'actual_start',
      'actual end':   'actual_end',   'actual_end':  'actual_end',    'end':   'actual_end',
      'total hours':  'total_hours',  'total_hours': 'total_hours',   'hours': 'total_hours',
      'haul fee':     'haul_fee',     'haul_fee':    'haul_fee',      'fee':   'haul_fee',
      'customer':     'customer',
      'description':  'description',  'desc':        'description',
      'division':     'division',
      'notes':        'notes',        'note':        'notes',
    };

    /* Normalise a CSV date value → YYYY-MM-DD for <input type="date"> */
    function _csvDate(v) {
      v = v.trim();
      // MM/DD/YYYY or M/D/YYYY
      const a = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (a) return `${a[3]}-${a[1].padStart(2,'0')}-${a[2].padStart(2,'0')}`;
      // Already YYYY-MM-DD
      if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
      return v;
    }

    /* Normalise a CSV time value → HH:MM (24-hr) for <input type="time"> */
    function _csvTime(v) {
      v = v.trim();
      const a = v.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)$/i);
      if (a) {
        let h = parseInt(a[1], 10);
        const period = a[3].toUpperCase();
        if (period === 'AM' && h === 12) h = 0;
        if (period === 'PM' && h !== 12) h += 12;
        return `${String(h).padStart(2,'0')}:${a[2]}`;
      }
      if (/^\d{2}:\d{2}$/.test(v)) return v;
      return v;
    }

    /* Strip currency symbols / commas so parseFloat works */
    function _csvNum(v) { return String(v == null ? '' : v).replace(/[$,\s]/g, ''); }

    function _parseCSVLine(line) {
      const out = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
        else cur += c;
      }
      out.push(cur);
      return out;
    }

    function triggerCSVUpload() {
      document.getElementById('csv-upload-input').click();
    }

    function handleCSVUpload(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => { importCSV(ev.target.result); input.value = ''; };
      reader.readAsText(file);
    }

    function importCSV(text) {
      const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n')
        .split('\n').filter(l => l.trim());
      if (lines.length < 2) return;

      const headers = _parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
      const newEntries = [];

      // Track running max so task numbers stay unique across all imported rows
      let maxTaskNum = Math.max(0, ...divEntries.map(e => {
        const m = (e.task_number || '').match(/^TR-(\d+)$/);
        return m ? parseInt(m[1], 10) : 0;
      }));

      for (let i = 1; i < lines.length; i++) {
        const cols = _parseCSVLine(lines[i]);
        if (cols.every(c => !c.trim())) continue;

        const entry = {
          id: crypto.randomUUID(), task_number: '',
          actual_date: '', driver: '', unit: '',
          actual_start: '', actual_end: '',
          total_hours: '', haul_fee: '',
          customer: '', description: '', division: '', notes: ''
        };

        headers.forEach((h, idx) => {
          const field = CSV_FIELD_MAP[h];
          if (!field || cols[idx] === undefined) return;
          const raw = cols[idx].trim();
          if (field === 'actual_date')                      entry[field] = _csvDate(raw);
          else if (field === 'actual_start' || field === 'actual_end') entry[field] = _csvTime(raw);
          else if (field === 'total_hours' || field === 'haul_fee')    entry[field] = _csvNum(raw);
          else entry[field] = raw;
        });

        if (!entry.task_number) {
          maxTaskNum++;
          entry.task_number = 'TR-' + String(maxTaskNum).padStart(4, '0');
        }
        newEntries.push(entry);
      }

      if (newEntries.length === 0) return;

      // Prepend so newly imported rows appear at the top
      divEntries.unshift(...newEntries);
      const add = (key, arr, val) =>
        val && !arr.includes(val) && !_isRemovedName(key, val) ? [...arr, val] : arr;
      newEntries.forEach(e => {
        divTruckLists.drivers   = add('drivers',   divTruckLists.drivers,   e.driver);
        divTruckLists.customers = add('customers', divTruckLists.customers, e.customer);
        if (e.unit && !divTruckLists.units.some(u => u.name === e.unit)
            && !_isRemovedName('units', e.unit))
          divTruckLists.units.push({ name: e.unit, number: '', type: '' });
      });
      divTruckLists.drivers.sort((a,b) => a.localeCompare(b));
      divTruckLists.customers.sort((a,b) => a.localeCompare(b));
      divTruckLists.units.sort((a,b) => a.name.localeCompare(b.name));
      saveTruckLists();

      schedSave();
      renderTrackingTab();
      const el = document.getElementById('save-status');
      if (el) {
        el.textContent = `${newEntries.length} row${newEntries.length === 1 ? '' : 's'} imported`;
        el.style.display = '';
        setTimeout(() => { if (el.textContent.includes('imported')) el.textContent = 'SAVED'; }, 3000);
      }
    }

    function downloadCSVTemplate() {
      const headers = ['Task Number','Actual Date','Driver','Unit','Actual Start','Actual End',
        'Total Hours','Haul Fee','Customer','Description','Division','Notes'];
      const blob = new Blob([headers.join(',') + '\n'], { type: 'text/csv' });
      const a = Object.assign(document.createElement('a'),
        { href: URL.createObjectURL(blob), download: 'truck_tracking_template.csv' });
      a.click();
      URL.revokeObjectURL(a.href);
    }

    loadTrackingData();

    /* ═══════════════════════════════════════════
       DATA SYNC — poll shared data every 60s
       Keeps truck division entries, managed lists,
       and intercompany billing status in sync
       when another user makes changes.
    ═══════════════════════════════════════════ */
    (function () {
      const POLL_MS = 60_000;

      function _isEditing() {
        const el = document.activeElement;
        return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
      }

      function _activeTabId() {
        const btn = document.querySelector('.tab-btn.active');
        return btn ? btn.dataset.tab : 'dashboard';
      }

      async function pollTruckDivision() {
        try {
          const divData = await tdDivGet();
          if (!divData) return;
          const inEntries = Array.isArray(divData.entries) ? divData.entries : [];
          const tl        = divData.lists || {};
          const inDrivers   = Array.isArray(tl.drivers)   ? tl.drivers   : divTruckLists.drivers;
          const inCustomers = Array.isArray(tl.customers)  ? tl.customers : divTruckLists.customers;
          const inUnits     = Array.isArray(tl.units)      ? tl.units     : divTruckLists.units;
          const inLocations = Array.isArray(tl.locations)  ? tl.locations : divTruckLists.locations;
          const inMaterials = Array.isArray(tl.materials)  ? tl.materials : divTruckLists.materials;
          // Guard: if the server returned significantly fewer entries than we currently
          // hold, the server blob is stale or corrupted — skip this poll cycle so we
          // don't overwrite good in-memory data and trigger a save with the smaller set.
          if (divEntries.length > 5 && inEntries.length < divEntries.length * 0.9) {
            console.warn('[poll] server returned fewer entries (' + inEntries.length + ' vs ' + divEntries.length + ') — skipping update');
            return;
          }
          const entriesChanged = JSON.stringify(inEntries)   !== JSON.stringify(divEntries);
          const listsChanged   = JSON.stringify(inDrivers)   !== JSON.stringify(divTruckLists.drivers)   ||
                                 JSON.stringify(inCustomers) !== JSON.stringify(divTruckLists.customers) ||
                                 JSON.stringify(inUnits)     !== JSON.stringify(divTruckLists.units)     ||
                                 JSON.stringify(inLocations) !== JSON.stringify(divTruckLists.locations) ||
                                 JSON.stringify(inMaterials) !== JSON.stringify(divTruckLists.materials);
          if (!entriesChanged && !listsChanged) return;
          // Skip the cycle entirely while the user is typing — otherwise
          // we replace the in-memory entries/lists with the server
          // snapshot and the next save echoes that snapshot back,
          // wiping the user's pending edits.
          if (_isEditing()) return;
          // Set alongside the assignment, never before it: the cycle can bail
          // out above while the user is typing, and a flag set without the rows
          // behind it would tell the IC reconciler every payroll row is gone.
          _divEntriesLoaded = true;
          divEntries = inEntries;
          if (Array.isArray(tl.drivers))   divTruckLists.drivers   = tl.drivers;
          if (Array.isArray(tl.customers)) divTruckLists.customers = tl.customers;
          if (Array.isArray(tl.units))     divTruckLists.units     = tl.units;
          if (Array.isArray(tl.locations)) divTruckLists.locations = tl.locations;
          if (Array.isArray(tl.materials)) divTruckLists.materials = tl.materials;
          if (tl.removed && typeof tl.removed === 'object') divTruckLists.removed = _normRemoved(tl.removed);
          if (tl.rates   && typeof tl.rates   === 'object') divTruckLists.rates   = _normRates(tl.rates);
          const tab = _activeTabId();
          if (tab === 'dashboard')      renderDashboard();
          if (tab === 'truck-tracking') renderTrackingTab();
          // Managed lists panel — refresh if open
          const listsBackdrop = document.getElementById('lists-backdrop');
          if (listsBackdrop && listsBackdrop.classList.contains('open')) renderListsPanel();
        } catch { /* non-fatal */ }
      }

      async function pollFctLists() {
        try {
          const saved = await tdGet('fct_lists');
          if (!saved) return;
          const inEmps = Array.isArray(saved.employees) ? saved.employees.map(e => typeof e === 'string' ? { name: e } : e) : null;
          const inEq   = Array.isArray(saved.equipment) ? saved.equipment : null;
          let changed = false;
          if (inEmps && JSON.stringify(inEmps) !== JSON.stringify(divLists.employees)) { divLists.employees = inEmps; changed = true; }
          if (inEq   && JSON.stringify(inEq)   !== JSON.stringify(divLists.equipment)) { divLists.equipment = inEq;   changed = true; }
          if (!changed || _isEditing()) return;
          const tab = _activeTabId();
          if (tab === 'truck-tracking') renderTrackingTab();
        } catch { /* non-fatal */ }
      }

      async function pollIcSentMap() {
        try {
          const r = await fetch(`${API_BASE}/data/fct_intercompany_billing_entries`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (!r.ok) return;
          const { value } = await r.json();
          if (!Array.isArray(value)) return;
          const newMap = new Map();
          value.forEach(e => { if (e.source === 'trucking' && e.source_id) newMap.set(e.source_id, e); });
          const cur = JSON.stringify([...icSentMap].sort((a, b) => a[0].localeCompare(b[0])));
          const nxt = JSON.stringify([...newMap].sort((a, b) => a[0].localeCompare(b[0])));
          if (cur === nxt) return;
          icSentMap = newMap;
          if (!_icBillingDirty) icBillingArr = value;
          if (!_isEditing() && _activeTabId() === 'truck-tracking') renderTrackingTab();
        } catch { /* non-fatal */ }
      }

      // Background polling stands down when the tab is hidden — a window left
      // open has nothing to render, so every request it makes is wasted — and
      // once the session is over, when the timers could only produce 401s.
      // _pollCycleBusy keeps one cycle from overlapping the next: setInterval
      // fires on a fixed schedule no matter how long the previous cycle took,
      // so a slow cycle used to be joined by the following one and under load
      // they stacked without limit.
      let _pollCycleBusy = false;
      function _pollsSuspended() {
        return document.visibilityState === 'hidden' || !localStorage.getItem('fct_token');
      }

      async function pollAll() {
        if (_pollCycleBusy || _pollsSuspended()) return;
        _pollCycleBusy = true;
        try {
          await Promise.allSettled([pollTruckDivision(), pollFctLists(), pollIcSentMap()]);
        } finally {
          _pollCycleBusy = false;
        }
      }

      setInterval(pollAll, POLL_MS);
      // Coming back to a tab that stood down should not wait out a full interval.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') pollAll();
      });

    })();

    /* ═══════════════════════════════════════════
       WHO'S ONLINE — presence heartbeat
    ═══════════════════════════════════════════ */
    (function () {
      if (!user) return;
      const PRESENCE_KEY = 'fct_presence';
      const HEARTBEAT_MS = 30_000;
      const STALE_MS     = 120_000;

      const myId    = String(user.userId || user.username);
      const myName  = user.name || user.username || '';
      const myUser  = user.username || '';
      const parts   = myName.trim().split(/\s+/);
      const myInit  = parts.length >= 2
        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
        : myName.slice(0, 2).toUpperCase() || '?';
      const palette = ['#2ecc71','#3498db','#9b59b6','#e67e22','#e74c3c','#1abc9c','#f39c12','#16a085'];
      let h = 0;
      for (let i = 0; i < myName.length; i++) h = (h * 31 + myName.charCodeAt(i)) & 0xffff;
      const myColor = palette[h % palette.length];

      async function _presenceFetch() {
        try {
          const r = await fetch(`${API_BASE}/data/${PRESENCE_KEY}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!r.ok) return {};
          const j = await r.json();
          return j.value || {};
        } catch { return {}; }
      }

      async function _presencePut(data) {
        try {
          await fetch(`${API_BASE}/data/${PRESENCE_KEY}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ value: data })
          });
        } catch { /* best-effort */ }
      }

      window._presenceRemoveSelf = async function () {
        const data = await _presenceFetch();
        delete data[myId];
        await _presencePut(data);
      };

      function renderOnline(data) {
        const el = document.getElementById('online-users');
        if (!el) return;
        const now    = Date.now();
        const others = Object.entries(data)
          .filter(([id, u]) => id !== myId && (now - (u.ts || 0)) < STALE_MS)
          .sort((a, b) => (a[1].username || '').localeCompare(b[1].username || ''));
        if (!others.length) { el.innerHTML = ''; return; }
        el.innerHTML =
          '<span class="online-users-label">Online:</span>' +
          others.map(([, u]) =>
            `<span class="online-avatar-wrap">` +
              `<span class="user-avatar" style="background:${u.color||'#555'};width:26px;height:26px;font-size:0.62rem;" title="${u.username||''}">${u.initials||'?'}</span>` +
              `<span class="online-dot"></span>` +
            `</span>`
          ).join('');
      }

      async function heartbeat() {
        const data = await _presenceFetch();
        data[myId] = { username: myUser, initials: myInit, color: myColor, ts: Date.now() };
        await _presencePut(data);
        renderOnline(data);
      }

      heartbeat();
      setInterval(heartbeat, HEARTBEAT_MS);
    })();
  </script>
</body>
