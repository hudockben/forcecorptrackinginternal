<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%230a0f1e' stroke='%23ef4444' stroke-width='6'/><circle cx='50' cy='50' r='12' fill='%23f97316'/></svg>">
  <title>DataWatch — Trucking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0a0f;
      --surface:     #111118;
      --surface2:    #1a1a26;
      --border:      #2a2a3a;
      --orange:      #ef4444;
      --orange-dim:  #b91c1c;
      --text:        #e0e0e0;
      --muted:       #666;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 300;
      gap: 1rem;
    }

    .hdr-left { display: flex; align-items: center; gap: 1rem; min-width: 0; }

    .brand {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--orange);
      font-weight: 700;
      flex-shrink: 0;
    }

    .div-label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-left: 1px solid var(--border);
      padding-left: 1rem;
      white-space: nowrap;
    }

    .hdr-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }

    .user-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--orange-dim);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    .user-info { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .user-info strong { color: var(--text); }

    .btn-ghost {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
      background: none; border: 1px solid var(--border);
      border-radius: 4px; padding: 0.32rem 0.7rem; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .btn-ghost:hover { color: var(--text); border-color: #555; }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      position: sticky;
      top: 45px;
      z-index: 200;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 0.6rem 1.25rem;
      font-size: 0.67rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: color 0.15s, border-color 0.15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }

    /* ── Panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Truck Tracking table ── */
    .td-task-num { font-family: monospace; font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
    .td-total    { text-align: right; color: #facc15; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }

    /* ── Scrollable table wrapper ── */
    .tbl-scroll-wrap { overflow: auto; max-height: calc(100vh - 290px); border-radius: 6px; }

    /* ── Totals bar ── */
    .totals-bar {
      display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.55rem 1rem; margin-bottom: 0.65rem;
      font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .totals-bar .lbl { color: var(--muted); }
    .totals-bar .val { color: #facc15; font-weight: 700; margin-left: 0.35rem; }

    .tr-tbl { width: 100%; border-collapse: collapse; background: var(--surface); min-width: 1600px; }

    /* ── Sticky column headers ── */
    .tr-tbl thead tr.hdr-row th {
      position: sticky; top: 0; z-index: 3;
      padding: 0.55rem 0.6rem;
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      white-space: nowrap; text-align: left;
    }
    .tr-tbl thead tr.hdr-row th.r { text-align: right; }

    /* ── Sticky filter row ── */
    .tr-tbl thead tr.filter-row th {
      position: sticky; top: 31px; z-index: 3;
      background: var(--surface);
      padding: 0.25rem 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    .tr-tbl thead tr.filter-row input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 3px;
      color: var(--muted); font-size: 0.7rem;
      padding: 0.18rem 0.35rem; outline: none; box-sizing: border-box;
    }
    .tr-tbl thead tr.filter-row input:focus { border-color: #555; color: var(--text); }

    .tr-tbl tbody tr { border-bottom: 1px solid var(--border); }
    .tr-tbl tbody td { padding: 0.35rem 0.6rem; }
    .tr-tbl input[type=text],
    .tr-tbl input[type=date],
    .tr-tbl input[type=time],
    .tr-tbl input[type=number] {
      width: 100%; background: transparent; border: none;
      color: var(--text); font-size: 0.8rem; outline: none; padding: 0.15rem 0;
    }
    .tr-tbl select {
      background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
      color: var(--text); font-size: 0.8rem; outline: none; width: 100%; padding: 0.1rem 0.2rem;
    }
    .btn-add-row {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: #fff; background: var(--orange); border: none; border-radius: 4px;
      padding: 0.4rem 0.85rem; cursor: pointer;
    }
    .btn-add-row:hover { background: var(--orange-dim); }
    .btn-del-row {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.9rem; padding: 0.1rem 0.3rem; border-radius: 3px;
    }
    .btn-del-row:hover { color: var(--orange); background: rgba(239,68,68,0.1); }

    /* ── Manage Lists panel ── */
    .lists-backdrop {
      display: none; position: fixed; inset: 0; z-index: 400;
    }
    .lists-backdrop.open { display: block; }
    .lists-panel {
      position: absolute; top: 0; right: 0;
      width: 300px; background: var(--surface2);
      border-left: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 0 0 8px;
      padding: 1rem 1.1rem 1.25rem;
      box-shadow: -4px 4px 24px rgba(0,0,0,0.5);
      max-height: calc(100vh - 3rem);
      overflow-y: auto;
    }
    .lists-panel::-webkit-scrollbar { width: 5px; }
    .lists-panel::-webkit-scrollbar-track { background: transparent; }
    .lists-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .lists-panel::-webkit-scrollbar-thumb:hover { background: #555; }
    .lists-panel h3 {
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1rem; font-weight: 600;
    }
    .lists-section { margin-bottom: 1.1rem; }
    .lists-section-title {
      font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.45rem; font-weight: 600;
    }
    .lists-add-row {
      display: flex; gap: 0.4rem; margin-bottom: 0.5rem;
    }
    .lists-add-row input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 0.78rem;
      padding: 0.3rem 0.5rem; outline: none;
    }
    .lists-add-row input:focus { border-color: #555; }
    .lists-add-btn {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em;
      color: #fff; background: var(--orange); border: none;
      border-radius: 4px; padding: 0.3rem 0.6rem; cursor: pointer; white-space: nowrap;
    }
    .lists-add-btn:hover { background: var(--orange-dim); }
    .lists-items { display: flex; flex-direction: column; gap: 0.25rem; }
    .lists-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.28rem 0.55rem; font-size: 0.78rem;
    }
    .lists-item-del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.75rem; padding: 0 0.2rem; line-height: 1;
    }
    .lists-item-del:hover { color: var(--orange); }
    .btn-manage-lists {
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      background: none; border: 1px solid var(--border);
      border-radius: 4px; padding: 0.28rem 0.6rem; cursor: pointer;
    }
    .btn-manage-lists:hover { color: var(--text); border-color: #555; }

    /* ── Year filter tabs ── */
    .yr-tabs { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.85rem; }
    .yr-tab {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      background: none; border: 1px solid var(--border); border-radius: 20px;
      padding: 0.26rem 0.8rem; cursor: pointer; color: var(--muted);
      transition: color 0.12s, border-color 0.12s, background 0.12s;
      white-space: nowrap;
    }
    .yr-tab:hover { color: var(--text); border-color: #555; }
    .yr-tab.active { background: #facc15; color: #0a0a0f; border-color: #facc15; font-weight: 800; }
    .yr-row-count { font-size: 0.72rem; color: var(--muted); margin-left: 0.5rem; }

    /* ── Analytics sub-tabs ── */
    .sub-tab-bar {
      display: flex; align-items: center; background: var(--surface);
      border-bottom: 1px solid var(--border); padding: 0 1rem;
    }
    .sub-tab-btn {
      padding: 0.55rem 1.1rem;
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); background: none; border: none;
      border-bottom: 2px solid transparent; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .sub-tab-btn:hover { color: var(--text); }
    .sub-tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }
    .sub-tab-panel { display: none; }
    .sub-tab-panel.active { display: block; }
    .pdf-btn {
      margin-left: auto; padding: 0.3rem 0.75rem;
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--orange); background: none; border: 1px solid var(--orange);
      border-radius: 4px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .pdf-btn:hover { background: var(--orange); color: #fff; }

    /* ── Print / PDF styles ── */
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      :root {
        --bg: #ffffff; --surface: #f5f5f5; --surface2: #ebebeb;
        --border: #cccccc; --text: #111111; --muted: #555555; --orange: #cc0000;
      }
      body { background: #fff !important; }
      header, nav.tab-bar, .sub-tab-bar,
      .tab-panel:not(#tab-analytics),
      .sub-tab-panel:not(.active),
      .yr-tab, .pdf-btn { display: none !important; }
      #tab-analytics { display: block !important; }
      #tab-analytics::before {
        content: "Analytics Report — Trucking Division";
        display: block; font-size: 1rem; font-weight: 700;
        color: #111; padding: 0.5rem 1.25rem 0.75rem;
        border-bottom: 2px solid #ccc; margin-bottom: 0.5rem;
      }
      .sub-tab-panel.active { display: block !important; }
    }
    .online-avatar-wrap { position:relative; display:inline-flex; }
    .online-avatar-wrap .user-avatar { opacity:0.9; }
    .online-dot { position:absolute; bottom:-1px; right:-1px; width:8px; height:8px; background:#22c55e; border-radius:50%; border:1.5px solid #0a0a0a; }
    .online-users-label { font-size:0.65rem; color:#555; letter-spacing:0.04em; white-space:nowrap; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="hdr-left">
      <div class="brand">DataWatch</div>
      <div class="div-label">Trucking</div>
    </div>
    <div class="hdr-right">
      <span id="online-users" style="display:flex;align-items:center;gap:0.3rem;margin-right:0.25rem;"></span>
      <div class="user-avatar" id="userAvatar"></div>
      <div class="user-info" id="userInfo"></div>
      <button class="btn-ghost" onclick="switchDivision()">Switch Division</button>
      <button class="btn-ghost" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <!-- ── Tab bar ── -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="truck-tracking">Truck Tracking</button>
    <button class="tab-btn" data-tab="analytics">Analytics</button>
  </nav>

  <!-- hidden CSV upload input — must live outside the re-rendered tab panel -->
  <input type="file" id="csv-upload-input" accept=".csv" style="display:none"
    onchange="handleCSVUpload(this)">

  <!-- ── Manage Lists overlay ── -->
  <div class="lists-backdrop" id="lists-backdrop" onclick="closeManageLists(event)">
    <div class="lists-panel" id="lists-panel" onclick="event.stopPropagation()">
      <h3>Manage Lists</h3>
      <div id="lists-panel-body"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       DASHBOARD TAB
  ══════════════════════════════════════════════ -->
  <div class="tab-panel active" id="tab-dashboard">
  </div>

  <!-- ══════════════════════════════════════════════
       ANALYTICS TAB
  ══════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-analytics">
    <div class="sub-tab-bar">
      <button class="sub-tab-btn active" data-sub="customer-data">Customer Data</button>
      <button class="sub-tab-btn" data-sub="financials">Financials</button>
      <button class="sub-tab-btn" data-sub="equipment-utilization">Equipment Utilization</button>
      <button class="sub-tab-btn" data-sub="driver-performance">Driver Performance</button>
      <button class="pdf-btn" onclick="downloadAnalyticsPDF()">&#8595; Download PDF</button>
    </div>
    <div class="sub-tab-panel active" id="sub-customer-data"></div>
    <div class="sub-tab-panel" id="sub-financials"></div>
    <div class="sub-tab-panel" id="sub-equipment-utilization"></div>
    <div class="sub-tab-panel" id="sub-driver-performance"></div>
  </div>

  <!-- ══════════════════════════════════════════════
       TRUCK TRACKING TAB
  ══════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-truck-tracking">
  </div>

  <script>
    /* ═══════════════════════════════════════════
       AUTH
    ═══════════════════════════════════════════ */
    const token    = localStorage.getItem('fct_token');
    const user     = (() => { try { return JSON.parse(localStorage.getItem('fct_user')); } catch { return null; } })();
    const division = localStorage.getItem('fct_division');

    if (!token || !user) window.location.replace('index.html');
    if (division !== 'trucking') window.location.replace('divisions.html');

    /* ── Populate header ── */
    const avatarEl = document.getElementById('userAvatar');
    const infoEl   = document.getElementById('userInfo');

    if (user) {
      avatarEl.textContent = (user.username || '?').charAt(0).toUpperCase();
      infoEl.innerHTML =
        `<strong>${(user.username || '').replace(/</g, '&lt;')}</strong>&nbsp;·&nbsp;${(user.companyName || user.companyCode || '').replace(/</g, '&lt;')}`;
    }

    /* ═══════════════════════════════════════════
       TAB SWITCHING
    ═══════════════════════════════════════════ */
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b =>
          b.classList.toggle('active', b === btn));
        document.querySelectorAll('.tab-panel').forEach(p =>
          p.classList.toggle('active', p.id === 'tab-' + btn.dataset.tab));
        if (btn.dataset.tab === 'dashboard') renderDashboard();
        if (btn.dataset.tab === 'truck-tracking') renderTrackingTab();
        if (btn.dataset.tab === 'analytics') {
          const activeSub = document.querySelector('.sub-tab-btn.active');
          if (activeSub?.dataset.sub === 'equipment-utilization') renderEquipmentUtilization();
          else if (activeSub?.dataset.sub === 'financials') renderFinancials();
          else if (activeSub?.dataset.sub === 'driver-performance') renderDriverPerformance();
          else renderCustomerData();
        }
      });
    });

    /* ── Analytics sub-tab switching ── */
    document.querySelectorAll('.sub-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sub-tab-btn').forEach(b =>
          b.classList.toggle('active', b === btn));
        document.querySelectorAll('.sub-tab-panel').forEach(p =>
          p.classList.toggle('active', p.id === 'sub-' + btn.dataset.sub));
        if (btn.dataset.sub === 'customer-data') renderCustomerData();
        if (btn.dataset.sub === 'financials') renderFinancials();
        if (btn.dataset.sub === 'equipment-utilization') renderEquipmentUtilization();
        if (btn.dataset.sub === 'driver-performance') renderDriverPerformance();
      });
    });

    /* ═══════════════════════════════════════════
       NAVIGATION
    ═══════════════════════════════════════════ */
    function switchDivision() {
      localStorage.removeItem('fct_division');
      window.location.replace('divisions.html');
    }

    function signOut() {
      const go = () => {
        localStorage.removeItem('fct_token');
        localStorage.removeItem('fct_user');
        localStorage.removeItem('fct_division');
        window.location.replace('index.html');
      };
      if (window._presenceRemoveSelf) window._presenceRemoveSelf().finally(go);
      else go();
    }

    /* ═══════════════════════════════════════════
       TRUCK TRACKING — DATA LAYER
    ═══════════════════════════════════════════ */
    const API_BASE = '/api';
    let divEntries    = [];
    let divLists      = { employees: [], equipment: [] };
    let divTruckLists = { drivers: [], customers: [], units: [] };
    let _saveTimer       = null;
    let _isSaved         = false;
    let icSentMap = new Map(); // source_id → full IC entry (trucking)
    let icBillingArr = [];        // full IC billing list for syncing updates back
    let _icBillingDirty = false;  // pending IC billing changes not yet saved

    function fmtSentAt(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      if (isNaN(d)) return '';
      const mo = d.getMonth() + 1, day = d.getDate();
      let hr = d.getHours(), min = d.getMinutes();
      const ampm = hr >= 12 ? 'p' : 'a';
      hr = hr % 12 || 12;
      return `Sent ${mo}/${day} ${hr}:${String(min).padStart(2,'0')}${ampm}`;
    }

    async function loadIcSentMap() {
      try {
        const r = await fetch(`${API_BASE}/data/fct_intercompany_billing_entries`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!r.ok) return;
        const { value } = await r.json();
        icSentMap.clear();
        icBillingArr = Array.isArray(value) ? value : [];
        icBillingArr.forEach(e => { if (e.source === 'trucking' && e.source_id) icSentMap.set(e.source_id, e); });
      } catch { /* non-fatal */ }
    }

    let activeYearFilter          = new Date().getFullYear().toString();
    let analyticsYearFilter       = 'all';
    let equipYearFilter           = 'all';
    let financialsYearFilter      = 'all';

    function setYearFilter(year) {
      activeYearFilter = year;
      renderTrackingTab();
    }

    // Generic data key accessor (used for fct_lists and any non-truck-division keys)
    async function tdGet(key) {
      try {
        const r = await fetch(`${API_BASE}/data/${key}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!r.ok) return null;
        const { value } = await r.json();
        return value;
      } catch { return null; }
    }

    function tdPut(key, value) {
      fetch(`${API_BASE}/data/${key}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ value })
      }).catch(() => {});
    }

    // Truck division dedicated endpoint — entries + lists in one call
    async function tdDivGet() {
      try {
        const r = await fetch(`${API_BASE}/truck-division`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!r.ok) return null;
        return await r.json();
      } catch { return null; }
    }

    function tdDivPut() {
      fetch(`${API_BASE}/truck-division`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ entries: divEntries, lists: divTruckLists })
      }).catch(() => {});
      if (_icBillingDirty && icBillingArr.length) {
        _icBillingDirty = false;
        fetch(`${API_BASE}/data/fct_intercompany_billing_entries`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ value: icBillingArr })
        }).catch(() => {});
      }
    }

    /* Fix entries that were saved before the CSV normalisation was in place.
       Safe to call on every load — no-op when data is already clean. */
    function _migrateExistingEntries() {
      const _migrateEntryCount = divEntries.length;
      let dataChanged  = false;
      let listsChanged = false;

      const addStr = (arr, val) => {
        if (!val || arr.includes(val)) return arr;
        listsChanged = true;
        return arr.concat(val);
      };

      divEntries.forEach(e => {
        // Date: MM/DD/YYYY → YYYY-MM-DD
        const d = _csvDate(e.actual_date || '');
        if (d !== (e.actual_date || '')) { e.actual_date = d; dataChanged = true; }

        // Times: 12-hr AM/PM → 24-hr HH:MM
        const ts = _csvTime(e.actual_start || '');
        if (ts !== (e.actual_start || '')) { e.actual_start = ts; dataChanged = true; }
        const te = _csvTime(e.actual_end || '');
        if (te !== (e.actual_end || '')) { e.actual_end = te; dataChanged = true; }

        // Haul fee / hours: strip currency symbols
        const hf = _csvNum(e.haul_fee || '');
        if (hf !== (e.haul_fee || '')) { e.haul_fee = hf; dataChanged = true; }
        const th = _csvNum(e.total_hours || '');
        if (th !== (e.total_hours || '')) { e.total_hours = th; dataChanged = true; }

        // Auto-populate managed lists from stored entries
        divTruckLists.drivers   = addStr(divTruckLists.drivers,   e.driver);
        divTruckLists.customers = addStr(divTruckLists.customers, e.customer);
        if (e.unit && !divTruckLists.units.some(u => u.name === e.unit)) {
          divTruckLists.units.push({ name: e.unit, number: '' });
          listsChanged = true;
        }
      });

      if (listsChanged) {
        divTruckLists.drivers.sort((a, b) => a.localeCompare(b));
        divTruckLists.customers.sort((a, b) => a.localeCompare(b));
        divTruckLists.units.sort((a, b) => a.name.localeCompare(b.name));
        listsChanged = true;
      }
      // Only save if the entry count didn't drop — guards against saving a
      // partially-loaded set that was pulled from a stale server blob.
      if ((dataChanged || listsChanged) && divEntries.length >= _migrateEntryCount) tdDivPut();
    }

    async function loadTrackingData() {
      const [divData, lists] = await Promise.all([
        tdDivGet(),
        tdGet('fct_lists'),
        loadIcSentMap(),
      ]);
      if (divData) {
        divEntries = Array.isArray(divData.entries) ? divData.entries : [];
        const tl   = divData.lists || {};
        if (Array.isArray(tl.drivers))   divTruckLists.drivers   = tl.drivers;
        if (Array.isArray(tl.customers)) divTruckLists.customers = tl.customers;
        if (Array.isArray(tl.units))     divTruckLists.units     = tl.units;
      }
      if (lists) {
        if (Array.isArray(lists.employees)) {
          divLists.employees = lists.employees.map(e => typeof e === 'string' ? { name: e } : e);
        }
        if (Array.isArray(lists.equipment)) divLists.equipment = lists.equipment;
      }
      _recoverEntriesFromIcBilling();
      _migrateExistingEntries();
      _syncStaleIcEntries();
      renderDashboard();
    }

    // Rebuild truck entries that are present in IC billing but missing from divEntries
    // (e.g. lost when the truck-division blob was overwritten or rolled back).
    // Uses source_id as the canonical truck entry ID so re-running is idempotent.
    function _recoverEntriesFromIcBilling() {
      const existingIds = new Set(divEntries.map(e => e.id));
      const recovered = [];
      icBillingArr.forEach(ic => {
        if (ic.source !== 'trucking' || !ic.source_id) return;
        if (existingIds.has(ic.source_id)) return;
        recovered.push({
          id:               ic.source_id,
          task_number:      ic.task_number      || '',
          actual_date:      ic.actual_date      || '',
          driver:           ic.driver           || '',
          unit:             ic.unit             || '',
          actual_start:     ic.actual_start     || '',
          actual_end:       ic.actual_end       || '',
          total_hours:      ic.total_hours      || '',
          haul_fee:         ic.haul_fee         || '',
          customer:         ic.customer         || '',
          description:      ic.description      || '',
          division:         ic.division         || '',
          notes:            ic.notes            || '',
          qb_invoice:       ic.qb_invoice       || '',
          invoiced_date:    ic.invoiced_date     || '',
          invoice_sent_date: ic.invoice_sent_date || '',
          invoice_status:   ic.invoice_status   || 'Unpaid',
          date_paid:        ic.date_paid        || '',
        });
        existingIds.add(ic.source_id);
      });
      if (recovered.length > 0) {
        divEntries.push(...recovered);
        tdDivPut();
        console.log('[recovery] restored', recovered.length, 'truck entry/entries from IC billing');
      }
    }

    function _syncStaleIcEntries() {
      let changed = false;
      icBillingArr.forEach((icEntry, idx) => {
        if (icEntry.source !== 'trucking' || !icEntry.source_id) return;
        const te = divEntries.find(e => e.id === icEntry.source_id);
        if (!te) return;
        const tot = (parseFloat(te.total_hours) || 0) * (parseFloat(te.haul_fee) || 0);
        if (icEntry.total_hours !== te.total_hours || icEntry.haul_fee !== te.haul_fee) {
          icBillingArr[idx] = { ...icEntry, total_hours: te.total_hours, haul_fee: te.haul_fee, total: tot };
          icSentMap.set(icEntry.source_id, icBillingArr[idx]);
          changed = true;
        }
      });
      if (changed) _icBillingDirty = true;
    }

      const inp = document.getElementById('lists-new-' + key);

      divTruckLists[key].sort((a, b) => a.localeCompare(b));

      inp.value = '';
      renderListsPanel();
      renderTrackingTab();

      divTruckLists[key] = divTruckLists[key].filter(v => v !== val);

    function addUnit() {
      const nameInp = document.getElementById('lists-new-unit-name');
      const numInp  = document.getElementById('lists-new-unit-number');
      if (!nameInp || !numInp) return;
      const name   = nameInp.value.trim();

      divTruckLists.units.push({ name, number });
      divTruckLists.units.sort((a, b) => a.name.localeCompare(b.name));

      nameInp.value = '';
      numInp.value  = '';
      renderListsPanel();
      renderTrackingTab();

    function nextTaskNum() {
      const nums = divEntries.map(e => {
        const m = (e.task_number || '').match(/^TR-(\d+)$/);
        return m ? parseInt(m[1], 10) : 0;
      });
      return 'TR-' + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4, '0');
    }

    function addRow() {
      const countEl = document.getElementById('bulk-add-count');
      const count = Math.min(Math.max(parseInt(countEl?.value) || 1, 1), 100);
      const today = new Date().toISOString().slice(0, 10);
      let defaultDate = today;
      if (activeYearFilter !== 'all' && !today.startsWith(activeYearFilter)) {
        defaultDate = activeYearFilter + '-01-01';
      }

        divEntries.unshift({

          task_number: nextTaskNum(),
          actual_date: defaultDate, driver: '', unit: '',
          actual_start: '', actual_end: '',

        });

      schedSave();
      renderTrackingTab();

    async function sendToIntercompany(id) {
      const e = divEntries.find(r => r.id === id);
      if (!e) return;

      const btn    = document.getElementById('ic-btn-' + id);
      const status = document.getElementById('ic-status-' + id);
      if (btn) btn.disabled = true;
      if (status) { status.style.color = 'var(--muted)'; status.textContent = 'Checking…'; }

      const IC_CO_KEY      = 'fct_intercompany_companies';
      const IC_BILLING_KEY = 'fct_intercompany_billing_entries';

      try {
        // Load company list
        const coRes = await fetch(`${API_BASE}/data/${IC_CO_KEY}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const { value: companies } = await coRes.json();
        const coList = Array.isArray(companies) ? companies : [];

        const customer = (e.customer || '').trim().toLowerCase();
        const matched  = coList.find(c => c.name.trim().toLowerCase() === customer
          && (c.divisions || []).includes('trucking'));

        if (!matched) {
          if (status) { status.style.color = 'var(--red)'; status.textContent = 'Customer not in Intercompany list.'; }
          setTimeout(() => { if (status) status.textContent = ''; }, 3500);
          if (btn) btn.disabled = false;
          return;
        }

        // Load existing billing entries
        const beRes = await fetch(`${API_BASE}/data/${IC_BILLING_KEY}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const { value: existing } = await beRes.json();
        let entries = Array.isArray(existing) ? existing : [];

        // Avoid exact duplicates (same source row already sent)
        if (entries.some(x => x.source === 'trucking' && x.source_id === id)) {
          if (status) { status.style.color = '#f59e0b'; status.textContent = 'Already sent.'; }
          setTimeout(() => { if (status) status.textContent = ''; }, 2500);
          if (btn) btn.disabled = false;
          return;
        }

        const tot = (parseFloat(e.total_hours) || 0) * (parseFloat(e.haul_fee) || 0);
        const entry = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2),
          source: 'trucking', source_id: id,
          company_id: matched.id, company_name: matched.name,
          task_number: e.task_number, actual_date: e.actual_date,
          driver: e.driver, unit: e.unit,
          actual_start: e.actual_start, actual_end: e.actual_end,
          total_hours: e.total_hours, haul_fee: e.haul_fee, total: tot,
          customer: e.customer, description: e.description,
          division: e.division, notes: e.notes,
          qb_invoice: e.qb_invoice, invoiced_date: e.invoiced_date,
          invoice_sent_date: e.invoice_sent_date,
          invoice_status: e.invoice_status, date_paid: e.date_paid,
          sent_at: new Date().toISOString(),
          sent_by: (typeof user !== 'undefined' && user?.username) || ''
        };
        entries.unshift(entry);

        await fetch(`${API_BASE}/data/${IC_BILLING_KEY}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ value: entries })
        });

        icSentMap.set(id, entry);
        const tsEl = document.getElementById('ic-ts-' + id);
        if (tsEl) tsEl.textContent = fmtSentAt(entry?.sent_at);
        const mainBadge = document.getElementById('ic-main-' + id);
        if (mainBadge) { mainBadge.innerHTML = `&#10003; IC ${fmtSentAt(entry?.sent_at)}`; mainBadge.style.color = '#22c55e'; }
        if (status) { status.style.color = '#22c55e'; status.textContent = 'Sent ✓'; }
        setTimeout(() => { if (status) status.textContent = ''; }, 3000);
      } catch (err) {
        if (status) { status.style.color = 'var(--red)'; status.textContent = 'Error — try again.'; }
        setTimeout(() => { if (status) status.textContent = ''; }, 3500);
      }

      if (btn) btn.disabled = false;
    }

        setRef.delete(key);
        const r = document.getElementById(rowPrefix + key);
        const c = document.getElementById(caretPrefix + key);
        if (r) r.style.display = 'none';

    function toggleDriverRow(key) { _toggleDrillRow(key, expandedDriverRows, 'drv-sub-', 'drv-c-'); }

    function calcHours(start, end) {
      if (!start || !end) return null;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      if ([sh, sm, eh, em].some(isNaN)) return null;
      let mins = (eh * 60 + em) - (sh * 60 + sm);
      if (mins < 0) mins += 24 * 60;
      return Math.round(mins / 60 * 100) / 100;
    }

    function updateField(id, field, value) {
      const e = divEntries.find(e => e.id === id);
      if (!e) return;
      e[field] = value;

      if (field === 'actual_start' || field === 'actual_end') {
        const calc = calcHours(e.actual_start, e.actual_end);
        if (calc !== null) {
          e.total_hours = calc;
          const hrsEl = document.getElementById('th-hrs-' + id);
          if (hrsEl) hrsEl.value = calc;
        }
      }

      if (['total_hours', 'haul_fee', 'actual_start', 'actual_end'].includes(field)) {
        const tot = (parseFloat(e.total_hours) || 0) * (parseFloat(e.haul_fee) || 0);
        const el  = document.getElementById('td-tot-' + id);
        if (el) el.textContent = '$' + tot.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const icIdx = icBillingArr.findIndex(x => x.source === 'trucking' && x.source_id === id);
        if (icIdx >= 0) {
          icBillingArr[icIdx].total_hours = e.total_hours;
          icBillingArr[icIdx].haul_fee    = e.haul_fee;
          icBillingArr[icIdx].total       = tot;
          icSentMap.set(id, icBillingArr[icIdx]);
          _icBillingDirty = true;
        }
      }
      if (field === 'unit') {
        const unit  = divTruckLists.units.find(u => u.name === value);
        const numEl = document.getElementById('unit-num-' + id);
        if (numEl) numEl.textContent = unit ? unit.number : '';
      }
      schedSave();
    }

    /* ═══════════════════════════════════════════
       COLUMN FILTERS
    ═══════════════════════════════════════════ */
    let trColFilters      = {};
    let _activeFilterFld  = null;
    const expandedRows     = new Set();
    const expandedEquipRows  = new Set();
    const expandedDriverRows = new Set();

    function setColFilter(field, val) {
      _activeFilterFld = field;
      if (val) trColFilters[field] = val;
      else delete trColFilters[field];
      renderTrackingTab();
    }

    function applyColFilters(entries) {
      const active = Object.entries(trColFilters).filter(([, v]) => v);
      if (!active.length) return entries;
      return entries.filter(e =>
        active.every(([field, val]) =>
          String(e[field] || '').toLowerCase().includes(val.toLowerCase())
        )
      );
    }

    /* ═══════════════════════════════════════════
       TRUCK TRACKING — RENDER
    ═══════════════════════════════════════════ */
    function renderTrackingTab() {
      const root = document.getElementById('tab-truck-tracking');
      if (!root) return;

      const esc = s => String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      const driverOpts = cur => '<option value="">— select —</option>' +
        divTruckLists.drivers.map(d =>
          `<option value="${esc(d)}"${d === cur ? ' selected' : ''}>${esc(d)}</option>`
        ).join('');

      const customerOpts = cur => '<option value="">— select —</option>' +
        divTruckLists.customers.map(c =>
          `<option value="${esc(c)}"${c === cur ? ' selected' : ''}>${esc(c)}</option>`
        ).join('');

      const unitOpts = cur => '<option value="">— select —</option>' +
        divTruckLists.units.map(u =>
          `<option value="${esc(u.name)}"${u.name === cur ? ' selected' : ''}>${esc(u.name)}</option>`
        ).join('');

      const inp = (id, field, type, placeholder, val) =>
        `<input type="${type}" value="${esc(val || '')}"
          placeholder="${placeholder}"
          onchange="updateField('${id}','${field}',this.value)"
          style="width:100%;background:transparent;border:none;color:var(--text);font-size:0.8rem;outline:none;padding:0.15rem 0">`;

      const sel = (id, field, opts) =>
        `<select onchange="updateField('${id}','${field}',this.value)"
          style="background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.8rem;width:100%;padding:0.1rem 0.2rem">${opts}</select>`;

      // ── Year tabs + column filter ──
      const dataYears = [...new Set(
        divEntries.map(e => (e.actual_date || '').slice(0, 4)).filter(y => /^\d{4}$/.test(y))
      )].sort();
      const tabYears = [...new Set([...dataYears, '2025', '2026'])].sort();

      const yearFiltered = activeYearFilter === 'all'
        ? divEntries
        : divEntries.filter(e => (e.actual_date || '').startsWith(activeYearFilter));

      const filteredEntries = applyColFilters(yearFiltered);

      // ── Totals ──
      let sumHours = 0, sumRevenue = 0;
      filteredEntries.forEach(e => {
        const h = parseFloat(e.total_hours) || 0;
        const f = parseFloat(e.haul_fee)    || 0;
        sumHours   += h;
        sumRevenue += h * f;
      });
      const fmtMoney = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      const totalsHTML = `
        <div class="totals-bar">
          <span><span class="lbl">Total Hours</span><span class="val">${sumHours.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2})}</span></span>
          <span><span class="lbl">Total Revenue</span><span class="val">${fmtMoney(sumRevenue)}</span></span>
          <span><span class="lbl">Entries</span><span class="val">${filteredEntries.length}</span></span>
        </div>`;

      const yearTabsHTML = `
        <div class="yr-tabs">
          <button class="yr-tab${activeYearFilter === 'all' ? ' active' : ''}" onclick="setYearFilter('all')">All</button>
          ${tabYears.map(y => `<button class="yr-tab${activeYearFilter === y ? ' active' : ''}" onclick="setYearFilter('${y}')">${y}</button>`).join('')}
          <span class="yr-row-count">${filteredEntries.length} of ${divEntries.length} row${divEntries.length === 1 ? '' : 's'}</span>
        </div>`;

      // ── Filter input helper ──
      const fi = field => {
        const v = trColFilters[field] || '';
        return `<input type="text" value="${esc(v)}" placeholder="filter…"
          data-filter-field="${field}"
          oninput="setColFilter('${field}',this.value)">`;
      };

      const invInp = (id, field, type, placeholder, val) =>
        `<input type="${type}" value="${esc(val || '')}"
          placeholder="${placeholder}"
          onchange="updateField('${id}','${field}',this.value)"
          style="background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.8rem;padding:0.2rem 0.4rem;width:100%;outline:none">`;

      const invSel = (id, field, cur) => {
        const opts = ['Unpaid','Paid','Partial'].map(v=>
          `<option${v===cur?' selected':''}>${v}</option>`).join('');
        return `<select onchange="updateField('${id}','${field}',this.value)"
          style="background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.8rem;padding:0.2rem 0.4rem;width:100%">${opts}</select>`;
      };

      const rowsHTML = divEntries.length === 0
        ? `<tr><td colspan="15" style="padding:1.5rem;text-align:center;color:var(--muted);font-size:0.85rem">No entries yet — click + Add Row to begin.</td></tr>`
        : filteredEntries.length === 0
        ? `<tr><td colspan="15" style="padding:1.5rem;text-align:center;color:var(--muted);font-size:0.85rem">No entries match the current filters.</td></tr>`
        : filteredEntries.map(e => {
            const tot     = (parseFloat(e.total_hours)||0) * (parseFloat(e.haul_fee)||0);
            const isOpen  = expandedRows.has(e.id);
            const caretStyle = `display:inline-block;transition:transform 0.18s;transform:rotate(${isOpen?'90':'0'}deg);color:var(--muted);font-size:0.85rem;line-height:1;cursor:pointer;user-select:none`;
            const subLabel = `font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:0.3rem`;
            const missingInvoice = !e.invoiced_date || !e.invoice_sent_date;
            const rowBg = missingInvoice ? 'background:rgba(239,68,68,0.18)' : '';
            const icEntry = icSentMap.get(e.id);
            const icBadge = icEntry
              ? `<div id="ic-main-${e.id}" style="font-size:0.62rem;color:#22c55e;font-weight:600;margin-top:0.18rem;white-space:nowrap;letter-spacing:0.01em">&#10003; IC ${fmtSentAt(icEntry.sent_at)}</div>`
              : `<div id="ic-main-${e.id}"></div>`;
            return `<tr style="${rowBg}">
              <td style="width:28px;text-align:center;padding:0 0.25rem;cursor:pointer" onclick="toggleInvoiceRow('${e.id}')">
                <span id="caret-${e.id}" style="${caretStyle}">&#8250;</span>
              </td>
              <td class="td-task-num">${esc(e.task_number)}</td>
              <td style="min-width:110px">${inp(e.id,'actual_date','date','',e.actual_date)}</td>
              <td style="min-width:140px">${sel(e.id,'driver',driverOpts(e.driver))}</td>
              <td style="min-width:140px">
                ${sel(e.id,'unit',unitOpts(e.unit))}
                <div id="unit-num-${e.id}" style="font-size:0.68rem;color:var(--muted);margin-top:0.1rem;padding-left:0.15rem">${esc((divTruckLists.units.find(u=>u.name===e.unit)||{}).number||'')}</div>
              </td>
              <td style="min-width:90px">${inp(e.id,'actual_start','time','',e.actual_start)}</td>
              <td style="min-width:90px">${inp(e.id,'actual_end','time','',e.actual_end)}</td>
              <td style="min-width:80px;text-align:right;background:rgba(251,191,36,0.06)">
                <input type="number" id="th-hrs-${e.id}" value="${esc(e.total_hours || '')}"
                  placeholder="0"
                  onchange="updateField('${e.id}','total_hours',this.value)"
                  style="width:100%;background:transparent;border:none;color:#fbbf24;font-size:0.8rem;outline:none;padding:0.15rem 0;text-align:right;font-weight:600">
              </td>
              <td style="min-width:90px;text-align:right">${inp(e.id,'haul_fee','number','0.00',e.haul_fee)}</td>
              <td class="td-total" id="td-tot-${e.id}">${fmtMoney(tot)}</td>
              <td style="min-width:130px">${sel(e.id,'customer',customerOpts(e.customer))}</td>
              <td style="min-width:160px">${inp(e.id,'description','text','Description',e.description)}</td>
              <td style="min-width:100px">${inp(e.id,'division','text','Division',e.division)}</td>
              <td style="min-width:130px">${inp(e.id,'notes','text','Notes',e.notes)}${icBadge}</td>
              <td style="text-align:center;width:36px">
                <button class="btn-del-row" onclick="deleteRow('${e.id}')" title="Delete">&#10005;</button>
              </td>
            </tr>
            <tr id="inv-row-${e.id}" style="display:${isOpen?'table-row':'none'};background:var(--surface2)">
              <td colspan="15" style="padding:0.65rem 1rem 0.75rem 2.5rem;border-bottom:2px solid var(--border)">
                <div style="display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start">
                  <div style="min-width:120px">
                    <div style="${subLabel}">QB Invoice #</div>
                    ${invInp(e.id,'qb_invoice','text','Invoice #',e.qb_invoice)}
                  </div>
                  <div style="min-width:140px">
                    <div style="${subLabel}">Invoiced Date</div>
                    ${invInp(e.id,'invoiced_date','date','',e.invoiced_date)}
                  </div>
                  <div style="min-width:160px">
                    <div style="${subLabel}">Date Sent to Customer</div>
                    ${invInp(e.id,'invoice_sent_date','date','',e.invoice_sent_date)}
                  </div>
                  <div style="min-width:120px">
                    <div style="${subLabel}">Paid?</div>
                    ${invSel(e.id,'invoice_status',e.invoice_status||'Unpaid')}
                  </div>
                  <div style="min-width:140px">
                    <div style="${subLabel}">Date Paid</div>
                    ${invInp(e.id,'date_paid','date','',e.date_paid)}
                  </div>
                  <div style="display:flex;flex-direction:column;gap:0.3rem;padding-bottom:0.1rem">
                    <div style="display:flex;align-items:center;gap:0.5rem">
                      <button onclick="sendToIntercompany('${e.id}')"
                        id="ic-btn-${e.id}"
                        style="font-size:0.68rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:0.32rem 0.8rem;background:rgba(167,139,250,0.1);color:#a78bfa;border:1px solid rgba(167,139,250,0.3);border-radius:4px;cursor:pointer;white-space:nowrap;transition:background 0.15s,border-color 0.15s"
                        onmouseover="this.style.background='rgba(167,139,250,0.2)';this.style.borderColor='#a78bfa'"
                        onmouseout="this.style.background='rgba(167,139,250,0.1)';this.style.borderColor='rgba(167,139,250,0.3)'">
                        &#8644; Intercompany Billing
                      </button>
                      <span id="ic-status-${e.id}" style="font-size:0.7rem;font-weight:600;min-width:1em"></span>
                    </div>
                    <span id="ic-ts-${e.id}" style="font-size:0.63rem;color:#22c55e;font-weight:600;letter-spacing:0.02em">${icSentMap.has(e.id) ? fmtSentAt(icSentMap.get(e.id)?.sent_at) : ''}</span>
                  </div>
                </div>
              </td>
            </tr>`;
          }).join('');

      const savedStyle = _isSaved ? '' : 'display:none';

      root.innerHTML = `
        <div style="padding:1.25rem 1.25rem 0">
          <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.85rem;flex-wrap:wrap">
            <button class="btn-add-row" onclick="addRow()">+ Add Row</button>
            <input type="number" id="bulk-add-count" min="1" max="100" value="1"
              title="Number of rows to add"
              style="width:52px;padding:0.28rem 0.4rem;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:0.72rem;text-align:center;outline:none">
            <button class="btn-ghost" onclick="triggerCSVUpload()" style="font-size:0.65rem;padding:0.28rem 0.65rem">&#8679; Upload CSV</button>
            <button class="btn-ghost" onclick="downloadCSVTemplate()" style="font-size:0.65rem;padding:0.28rem 0.65rem">&#8681; CSV Template</button>
            <span style="font-size:0.72rem;color:var(--muted)">${divEntries.length} ${divEntries.length === 1 ? 'entry' : 'entries'}</span>
            <button class="btn-manage-lists" onclick="openManageLists()" style="margin-left:auto">⚙ Manage Lists</button>
            <span id="save-status" style="font-size:0.72rem;font-weight:600;color:#22c55e;letter-spacing:0.06em;text-transform:uppercase;${savedStyle}">SAVED</span>
          </div>
          ${yearTabsHTML}
          ${totalsHTML}
        </div>
        <div style="padding:0 1.25rem 1.25rem">
          <div class="tbl-scroll-wrap">
            <table class="tr-tbl">
              <thead>
                <tr class="hdr-row">
                  <th style="width:28px"></th>
                  <th>Task Number</th>
                  <th>Actual Date</th>
                  <th>Driver</th>
                  <th>Unit</th>
                  <th>Actual Start</th>
                  <th>Actual End</th>
                  <th class="r" style="color:#fbbf24">Total Hours <span title="Auto-calculated from start &amp; end times" style="font-size:0.55rem;vertical-align:middle;opacity:0.7">⚡</span></th>
                  <th class="r">Haul Fee</th>
                  <th class="r">Total</th>
                  <th>Customer</th>
                  <th>Description</th>
                  <th>Division</th>
                  <th>Notes</th>
                  <th style="width:36px"></th>
                </tr>
                <tr class="filter-row">
                  <th></th>
                  <th>${fi('task_number')}</th>
                  <th>${fi('actual_date')}</th>
                  <th>${fi('driver')}</th>
                  <th>${fi('unit')}</th>
                  <th>${fi('actual_start')}</th>
                  <th>${fi('actual_end')}</th>
                  <th>${fi('total_hours')}</th>
                  <th>${fi('haul_fee')}</th>
                  <th></th>
                  <th>${fi('customer')}</th>
                  <th>${fi('description')}</th>
                  <th>${fi('division')}</th>
                  <th>${fi('notes')}</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>${rowsHTML}</tbody>
            </table>
          </div>
        </div>`;

      // Restore focus to the active filter input after re-render
      if (_activeFilterFld) {
        const inp = root.querySelector(`input[data-filter-field="${_activeFilterFld}"]`);
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }
    }
