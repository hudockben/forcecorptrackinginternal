<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%230a0f1e' stroke='%23ef4444' stroke-width='6'/><circle cx='50' cy='50' r='12' fill='%23f97316'/></svg>">
  <title>DataWatch — Trucking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0a0f;
      --surface:     #111118;
      --surface2:    #1a1a26;
      --border:      #2a2a3a;
      --orange:      #ef4444;
      --orange-dim:  #b91c1c;
      --text:        #e0e0e0;
      --muted:       #666;
      /* Same accents the other division pages use, so the dashboard's figures
         read in the same colours here as they do on Turf, Paving and Kiewit —
         and as they do on the executive report that rolls them up. */
      --green:       #22c55e;
      --yellow:      #eab308;
      --blue:        #60a5fa;
      --amber:       #facc15;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Dashboard layout ──
       The metric strip and project table are the same components tracker.html,
       paving.html and kiewit-pinetree.html use for their home tabs. Copied
       rather than invented so every division page opens the same way and a
       figure keeps its position when someone moves between them. */
    .home-section-title {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
    }
    .home-section-title:not(:first-child) { margin-top: 2rem; }

    .home-metric-strip {
      display: flex;
      /* The strip's cards will not fit one row on most screens, and the values
         are nowrap + ellipsis, so without wrapping the money gets cut mid-number. */
      flex-wrap: wrap;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 2rem;
      background: var(--surface);
    }
    .home-metric-item {
      flex: 1 1 150px;
      padding: 1rem 1.25rem;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }
    .home-metric-item:last-child { border-right: none; }
    .home-metric-label {
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .home-metric-value {
      font-size: 1.3rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .home-metric-sub {
      font-size: 0.63rem;
      color: var(--muted);
    }
    .home-empty {
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 2rem;
    }

    .proj-table-wrap { overflow-x: auto; margin-bottom: 2rem; }
    .proj-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .proj-table thead th {
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: left;
      padding: 0 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-weight: 400;
      white-space: nowrap;
    }
    .proj-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .proj-table tbody tr:last-child { border-bottom: none; }
    .proj-table tbody tr:hover { background: var(--surface2); }
    .proj-table tfoot td {
      border-top: 1px solid var(--border);
      font-weight: 700;
      padding: 0.6rem 0.75rem;
    }
    .proj-table td {
      padding: 0.6rem 0.75rem;
      vertical-align: middle;
    }
    .pt-name {
      font-weight: 600;
      color: var(--text);
      font-size: 0.83rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    .pt-meta {
      font-size: 0.63rem;
      color: var(--muted);
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }
    .pt-num {
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
      white-space: nowrap;
      text-align: right;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 300;
      gap: 1rem;
    }

    .hdr-left { display: flex; align-items: center; gap: 1rem; min-width: 0; }

    .brand {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--orange);
      font-weight: 700;
      flex-shrink: 0;
    }

    .div-label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-left: 1px solid var(--border);
      padding-left: 1rem;
      white-space: nowrap;
    }

    .hdr-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }

    .user-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--orange-dim);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    .user-info { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .user-info strong { color: var(--text); }

    .btn-ghost {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
      background: none; border: 1px solid var(--border);
      border-radius: 4px; padding: 0.32rem 0.7rem; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .btn-ghost:hover { color: var(--text); border-color: #555; }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      position: sticky;
      top: 45px;
      z-index: 200;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 0.6rem 1.25rem;
      font-size: 0.67rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: color 0.15s, border-color 0.15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }

    /* ── Panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Truck Tracking table ── */
    .td-task-num { font-family: monospace; font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
    .td-total    { text-align: right; color: #facc15; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }

    /* ── Scrollable table wrapper ── */
    .tbl-scroll-wrap { overflow: auto; max-height: calc(100vh - 290px); border-radius: 6px; }

    /* ── Totals bar ── */
    .totals-bar {
      display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.55rem 1rem; margin-bottom: 0.65rem;
      font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .totals-bar .lbl { color: var(--muted); }
    .totals-bar .val { color: #facc15; font-weight: 700; margin-left: 0.35rem; }

    .tr-tbl { width: 100%; border-collapse: collapse; background: var(--surface); min-width: 1600px; }

    /* ── Sticky column headers ── */
    .tr-tbl thead tr.hdr-row th {
      position: sticky; top: 0; z-index: 3;
      padding: 0.55rem 0.6rem;
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      white-space: nowrap; text-align: left;
    }
    .tr-tbl thead tr.hdr-row th.r { text-align: right; }

    /* ── Sticky filter row ── */
    .tr-tbl thead tr.filter-row th {
      position: sticky; top: 31px; z-index: 3;
      background: var(--surface);
      padding: 0.25rem 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    .tr-tbl thead tr.filter-row input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 3px;
      color: var(--muted); font-size: 0.7rem;
      padding: 0.18rem 0.35rem; outline: none; box-sizing: border-box;
    }
    .tr-tbl thead tr.filter-row input:focus { border-color: #555; color: var(--text); }

    .tr-tbl tbody tr { border-bottom: 1px solid var(--border); }
    .tr-tbl tbody td { padding: 0.35rem 0.6rem; }
    .tr-tbl input[type=text],
    .tr-tbl input[type=date],
    .tr-tbl input[type=time],
    .tr-tbl input[type=number] {
      width: 100%; background: transparent; border: none;
      color: var(--text); font-size: 0.8rem; outline: none; padding: 0.15rem 0;
    }
    .tr-tbl select {
      background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
      color: var(--text); font-size: 0.8rem; outline: none; width: 100%; padding: 0.1rem 0.2rem;
    }
    .btn-add-row {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: #fff; background: var(--orange); border: none; border-radius: 4px;
      padding: 0.4rem 0.85rem; cursor: pointer;
    }
    .btn-add-row:hover { background: var(--orange-dim); }
    .btn-del-row {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.9rem; padding: 0.1rem 0.3rem; border-radius: 3px;
    }
    .btn-del-row:hover { color: var(--orange); background: rgba(239,68,68,0.1); }

    /* ── Manage Lists ──
       A centred dialog rather than the 340px rail this used to be. The rail
       stacked six lists in one column, so cleaning up 26 customers meant
       scrolling past the drivers to reach them and scrolling back to check.
       One list at a time, across the full width, is a screenful instead. */
    .lists-backdrop {
      display: none; position: fixed; inset: 0; z-index: 400;
      background: rgba(0,0,0,0.62);
      align-items: center; justify-content: center; padding: 2rem 1.5rem;
    }
    .lists-backdrop.open { display: flex; }
    .lists-panel {
      display: flex; flex-direction: column;
      /* A fixed frame, not one that fits its contents: the dialog is centred,
         so a list that shrinks as you filter would slide what you are reading
         up the screen on every keystroke. The body scrolls inside it. */
      width: min(1120px, 95vw); height: min(820px, 86vh);
      background: var(--surface2);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.6);
    }
    .lists-head {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1.1rem 0.7rem; border-bottom: 1px solid var(--border);
    }
    .lists-head h3 { margin: 0; flex: none; }
    .lists-search {
      flex: 1; max-width: 280px; margin-left: auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 0.78rem;
      padding: 0.3rem 0.55rem; outline: none;
    }
    .lists-search:focus { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb33; }
    .lists-close {
      flex: none; background: none; border: none; color: var(--muted);
      font-size: 1rem; line-height: 1; cursor: pointer; padding: 0.2rem 0.3rem;
    }
    .lists-close:hover { color: var(--orange); }
    /* One list at a time. The strip is the section title, so the sections
       below no longer carry one of their own. */
    .lists-tabs {
      display: flex; flex-wrap: wrap; gap: 0.3rem;
      padding: 0.6rem 1.1rem; border-bottom: 1px solid var(--border);
    }
    .lists-tab {
      display: flex; align-items: center; gap: 0.35rem;
      background: none; border: 1px solid var(--border); border-radius: 4px;
      color: var(--muted); font-family: inherit;
      font-size: 0.66rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0.28rem 0.55rem; cursor: pointer;
      white-space: nowrap;
    }
    .lists-tab:hover { color: var(--text); border-color: #555; }
    .lists-tab.active { color: #fff; background: var(--orange); border-color: var(--orange); }
    .lists-tab .n {
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0;
      opacity: 0.75; font-variant-numeric: tabular-nums;
    }
    .lists-body {
      flex: 1; min-height: 0; overflow-y: auto; padding: 0.9rem 1.1rem 1.2rem;
    }
    .lists-body::-webkit-scrollbar { width: 7px; }
    .lists-body::-webkit-scrollbar-track { background: transparent; }
    .lists-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .lists-body::-webkit-scrollbar-thumb:hover { background: #555; }
    .lists-panel h3 {
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); font-weight: 600;
    }
    .lists-section { margin-bottom: 1.1rem; }
    .lists-section-title {
      font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.45rem; font-weight: 600;
    }
    .lists-add-row {
      display: flex; gap: 0.4rem; margin-bottom: 0.6rem;
      max-width: 460px;
    }
    .lists-add-row input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 0.78rem;
      padding: 0.3rem 0.5rem; outline: none;
    }
    .lists-add-row input:focus { border-color: #555; }
    .lists-add-btn {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em;
      color: #fff; background: var(--orange); border: none;
      border-radius: 4px; padding: 0.3rem 0.6rem; cursor: pointer; white-space: nowrap;
    }
    .lists-add-btn:hover { background: var(--orange-dim); }
    .lists-add-btn:disabled { background: #3a3f4a; color: #8b909c; cursor: default; }
    /* Names across the width, not down it: 26 customers is four rows here and
       twenty-six in a single column. */
    .lists-items {
      display: grid; gap: 0.3rem 0.55rem;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      align-items: start;
    }
    .lists-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.28rem 0.55rem; font-size: 0.78rem;
    }
    .lists-item-del {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.75rem; padding: 0 0.2rem; line-height: 1;
    }
    .lists-item-del:hover { color: var(--orange); }
    /* A managed name and what rides with it: how many rows use it, and — for a
       customer — the rate a new row bills at. Kept on one line at 340px, so the
       name is what gives way when it is long. */
    .li-name {
      flex: 1; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .li-count {
      flex: none; color: var(--muted); font-size: 0.64rem;
      font-variant-numeric: tabular-nums; margin-left: 0.35rem;
    }
    .li-rate {
      flex: none; width: 62px; margin-left: 0.4rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 3px; color: var(--text); font-size: 0.72rem;
      padding: 0.12rem 0.3rem; text-align: right; outline: none;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }
    .li-rate::-webkit-outer-spin-button,
    .li-rate::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .li-rate:focus { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb33; }
    .li-rate::placeholder { color: #5b6270; }
    /* A unit is three facts — what it is called, the number painted on it and
       what kind of truck it is — and all three were read-only text until the
       only way to fix a typo was to delete the unit and add it again, which
       cost every row that named it. They are fields now. Styled to read as the
       row they sit in rather than as a form: a box only on hover or focus, so
       a list of thirty units is still a list. */
    .li-edit, .li-num, .li-type {
      background: transparent; border: 1px solid transparent; border-radius: 3px;
      color: var(--text); font-family: inherit; font-size: 0.78rem;
      padding: 0.12rem 0.3rem; outline: none; min-width: 0;
    }
    .li-edit { flex: 1; }
    .li-num  { flex: none; width: 62px; text-align: right; font-size: 0.72rem;
               color: var(--muted); font-variant-numeric: tabular-nums; }
    .li-type { flex: none; max-width: 118px; font-size: 0.7rem; color: var(--muted); }
    /* A type the office set is a fact about the truck; a blank one is the
       report reading the name, so it stays quiet. */
    .li-type.set { color: var(--text); }
    .li-edit:hover, .li-num:hover, .li-type:hover { border-color: var(--border); }
    .li-edit:focus, .li-num:focus, .li-type:focus {
      background: var(--surface2); border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb33;
      color: var(--text);
    }
    .li-num::placeholder { color: #5b6270; }
    .li-type option { background: var(--surface2); color: var(--text); }
    /* Three fields and three buttons do not fit the column width the name-only
       lists use, so the units list gets a wider one rather than a second line
       per unit. */
    .lists-items.wide { grid-template-columns: repeat(auto-fill, minmax(392px, 1fr)); }
    /* Said, not done — the one thing the panel refuses (a rename onto a name
       already in the list), in the place the undo bar would have been. */
    .lists-note {
      display: flex; align-items: baseline; gap: 0.5rem; max-width: 70ch;
      background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.4);
      border-radius: 4px; padding: 0.35rem 0.55rem; margin-bottom: 0.8rem;
      font-size: 0.72rem; color: var(--text); line-height: 1.45;
    }
    /* The merge form stands in for the row it belongs to, so it is boxed like
       one and marked as the thing being acted on. */
    .lists-merge {
      background: var(--surface); border: 1px solid #2563eb;
      border-radius: 4px; padding: 0.5rem 0.55rem 0.55rem;
    }
    .lists-merge-sel {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 0.78rem;
      padding: 0.28rem 0.4rem; outline: none;
    }
    .lists-merge-sel:focus { border-color: #2563eb; }
    .lists-hint {
      font-size: 0.66rem; color: var(--muted); line-height: 1.45;
      margin-bottom: 0.45rem; max-width: 62ch;
    }
    .lists-link {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.66rem; padding: 0; text-decoration: underline;
      text-underline-offset: 2px; font-family: inherit;
    }
    .lists-link:hover { color: var(--text); }
    /* Undo sits where the eye already is — at the top of the panel, right
       after the click that removed something. */
    .lists-undo {
      display: flex; align-items: baseline; gap: 0.5rem; max-width: 70ch;
      background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.4);
      border-radius: 4px; padding: 0.35rem 0.55rem; margin-bottom: 0.8rem;
      font-size: 0.72rem; color: var(--text);
    }
    /* Wraps rather than truncates: the half that gets cut — that the rows are
       unchanged — is the half that answers "what did I just do?". */
    .lists-undo .u-txt { flex: 1; min-width: 0; line-height: 1.45; }
    .lists-undo button {
      flex: none; background: none; border: none; color: #93b4fd;
      font-size: 0.72rem; font-weight: 700; cursor: pointer; padding: 0;
      font-family: inherit; text-decoration: underline; text-underline-offset: 2px;
    }
    .lists-undo button:hover { color: #fff; }
    .btn-manage-lists {
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      background: none; border: 1px solid var(--border);
      border-radius: 4px; padding: 0.28rem 0.6rem; cursor: pointer;
    }
    .btn-manage-lists:hover { color: var(--text); border-color: #555; }

    /* ── Scheduler ──
       Rows are drivers, columns are the days of the week — the shape a
       dispatcher already thinks in, and the one that makes an open driver
       (an empty row) and a truck booked twice (a flagged chip) visible
       without reading anything. The Day toggle collapses the same data to
       one date as a dispatch sheet for the morning read. */
    .sch-toolbar {
      display: flex; align-items: center; gap: 0.6rem;
      flex-wrap: wrap; margin-bottom: 0.9rem;
    }
    .sch-nav { display: flex; align-items: center; gap: 0.3rem; }
    .sch-navbtn {
      font-size: 0.72rem; font-weight: 600; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.3rem 0.6rem; cursor: pointer;
      line-height: 1.2;
    }
    .sch-navbtn:hover { color: var(--text); border-color: #555; }
    .sch-label {
      font-size: 0.85rem; font-weight: 700; min-width: 210px;
      text-align: center; font-variant-numeric: tabular-nums;
    }
    .sch-viewtoggle {
      display: flex; border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .sch-viewbtn {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted);
      background: var(--surface); border: none;
      padding: 0.32rem 0.7rem; cursor: pointer;
    }
    .sch-viewbtn:hover { color: var(--text); }
    .sch-viewbtn.active { background: var(--orange); color: #fff; }
    .sch-status { font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
    .sch-status.err { color: var(--orange); }
    .sch-warn {
      font-size: 0.68rem; font-weight: 600; color: #0a0a0f;
      background: var(--amber); border-radius: 3px;
      padding: 0.18rem 0.45rem; white-space: nowrap;
    }

    /* ── Week grid ── */
    .sch-grid-wrap {
      overflow-x: auto; border: 1px solid var(--border);
      border-radius: 6px; background: var(--surface);
    }
    .sch-grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 980px; }
    .sch-grid th, .sch-grid td { border-bottom: 1px solid var(--border); }
    .sch-grid th {
      background: var(--surface2); padding: 0.45rem 0.5rem;
      font-size: 0.66rem; font-weight: 700; letter-spacing: 0.05em;
      color: var(--muted); text-transform: uppercase; text-align: center;
      border-left: 1px solid var(--border);
    }
    .sch-grid th .dnum { font-size: 0.74rem; color: var(--text); letter-spacing: 0; margin-top: 0.1rem; }
    .sch-grid th.is-today .dnum { color: var(--amber); }
    /* The driver column stays put while the week scrolls sideways — without it
       the names leave the viewport and the rows stop meaning anything. */
    .sch-corner, .sch-driver-cell {
      position: sticky; left: 0; z-index: 3;
      background: var(--surface2); text-align: left !important;
      min-width: 165px; border-left: none !important;
      border-right: 1px solid var(--border);
    }
    .sch-driver-cell {
      background: var(--surface); padding: 0.5rem 0.6rem;
      font-size: 0.8rem; font-weight: 600; vertical-align: top;
    }
    .sch-load {
      float: right; font-size: 0.62rem; font-weight: 700;
      color: var(--muted); background: var(--surface2);
      border-radius: 8px; padding: 0.05rem 0.4rem; margin-left: 0.4rem;
    }
    .sch-cell {
      border-left: 1px solid var(--border); vertical-align: top;
      padding: 0.28rem; min-width: 118px; cursor: pointer; position: relative;
    }
    .sch-cell:hover { background: var(--surface2); }
    .sch-cell.is-today { background: rgba(250,204,21,0.035); }
    .sch-cell.is-today:hover { background: rgba(250,204,21,0.07); }
    .sch-cell.is-weekend { background: rgba(0,0,0,0.22); }
    .sch-add {
      display: block; width: 100%; background: none; border: 1px dashed transparent;
      border-radius: 4px; color: transparent; font-size: 0.8rem;
      padding: 0.15rem 0; cursor: pointer; line-height: 1.3;
    }
    .sch-cell:hover .sch-add { border-color: var(--border); color: var(--muted); }

    .sch-driver-cell.is-hidden { color: var(--muted); font-weight: 500; }
    .sch-hidtag {
      font-size: 0.55rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--border); border-radius: 3px;
      padding: 0.02rem 0.25rem; margin-left: 0.35rem; vertical-align: middle;
    }

    /* ── Assignment chip ── */
    .sch-chip {
      background: var(--surface2); border: 1px solid var(--border);
      border-left: 3px solid var(--orange); border-radius: 4px;
      padding: 0.25rem 0.4rem; margin-bottom: 0.22rem;
      font-size: 0.72rem; line-height: 1.35; cursor: pointer;
    }
    .sch-chip:hover { border-color: #555; border-left-color: var(--orange); }
    .sch-chip.conflict { border-left-color: var(--amber); background: rgba(250,204,21,0.09); }
    .sch-chip .cust { font-weight: 600; color: var(--text); display: block; }
    .sch-chip .meta { color: var(--muted); font-size: 0.66rem; display: block; }
    .sch-chip .start { color: var(--amber); font-weight: 600; }

    /* ── Day timeline ──
       Rows are drivers, the x axis is the clock. What the dispatch sheet below
       states as two columns of times, this shows as length and position, so a
       gap in someone's day, a truck handed between shifts, and two hauls that
       run over each other are all visible without reading a single time.
       Widths are in px rather than percentages because the track scrolls: an
       hour has to stay an hour whatever the window is doing. */
    .sch-tl-wrap {
      overflow-x: auto; border: 1px solid var(--border);
      border-radius: 6px; background: var(--surface); margin-bottom: 1.5rem;
    }
    .sch-tl-wrap::-webkit-scrollbar { height: 7px; }
    .sch-tl-wrap::-webkit-scrollbar-track { background: transparent; }
    .sch-tl-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .sch-tl-wrap::-webkit-scrollbar-thumb:hover { background: #555; }
    .sch-tl-row { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); }
    .sch-tl-row:last-child { border-bottom: none; }
    .sch-tl-head { position: sticky; top: 0; z-index: 4; }
    .sch-tl-name, .sch-tl-corner {
      position: sticky; left: 0; z-index: 3; flex: none;
      width: 165px; box-sizing: border-box;
      border-right: 1px solid var(--border);
      padding: 0.45rem 0.6rem; font-size: 0.78rem; font-weight: 600;
      background: var(--surface); display: flex; align-items: center; gap: 0.35rem;
    }
    .sch-tl-corner {
      background: var(--surface2); z-index: 5;
      font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); font-weight: 700;
    }
    .sch-tl-name.is-hidden { color: var(--muted); font-weight: 500; }
    .sch-tl-name.is-open   { color: var(--muted); font-weight: 500; }
    .sch-tl-hours { flex: none; display: flex; background: var(--surface2); }
    .sch-tl-hr {
      flex: none; box-sizing: border-box;
      border-left: 1px solid var(--border);
      padding: 0.4rem 0 0.35rem; text-align: center;
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em;
      color: var(--muted); white-space: nowrap;
    }
    .sch-tl-hr.is-now { color: var(--amber); }
    /* Hour rules are painted rather than built out of cells — one element per
       row instead of one per hour per row. */
    .sch-tl-track {
      flex: none; position: relative; cursor: pointer;
      background-image: repeating-linear-gradient(to right,
        var(--border) 0, var(--border) 1px, transparent 1px, transparent var(--hw));
    }
    .sch-tl-track:hover { background-color: rgba(255,255,255,0.012); }
    .sch-tl-bar {
      position: absolute; box-sizing: border-box;
      background: var(--surface2); border: 1px solid var(--border);
      border-left: 3px solid var(--orange); border-radius: 4px;
      padding: 0 0.4rem; overflow: hidden; cursor: pointer;
      display: flex; align-items: center; gap: 0.35rem;
      font-size: 0.7rem; line-height: 1; white-space: nowrap;
    }
    .sch-tl-bar:hover { border-color: #666; border-left-color: var(--orange); z-index: 2; }
    .sch-tl-bar.conflict { border-left-color: var(--amber); background: rgba(250,204,21,0.13); }
    /* No end time yet: the bar is drawn at a nominal hour and frayed on the
       right so its length never reads as a real finish. */
    .sch-tl-bar.open-end { border-right: 1px dashed var(--muted); border-radius: 4px 0 0 4px; }
    .sch-tl-bar .b-rep { color: var(--green); font-size: 0.7rem; font-weight: 700; flex: none; }
    .sch-tl-bar .b-cust { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
    .sch-tl-bar .b-unit { color: var(--muted); font-size: 0.64rem; }
    .sch-tl-now {
      position: absolute; top: 0; bottom: 0; width: 1px;
      background: var(--amber); opacity: 0.55; pointer-events: none; z-index: 1;
    }
    .sch-tl-unplaced {
      display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
      padding: 0.5rem 0.7rem; border-top: 1px solid var(--border);
      background: rgba(250,204,21,0.05);
    }
    .sch-tl-unplaced .lbl { font-size: 0.66rem; color: var(--amber); font-weight: 700; }
    .sch-tl-chip {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.2rem 0.45rem; font-size: 0.7rem; cursor: pointer;
    }
    .sch-tl-chip:hover { border-color: #555; }

    /* ── Day view (dispatch sheet) ── */
    .sch-day-tbl { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .sch-day-tbl thead th {
      background: var(--surface2); padding: 0.45rem 0.7rem; text-align: left;
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em;
      color: var(--muted); text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .sch-day-tbl tbody td { padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    .sch-day-tbl tbody tr:hover { background: var(--surface2); }
    .sch-day-tbl tbody tr.conflict td { background: rgba(250,204,21,0.07); }
    /* Section band and its closing totals — the shape a daily trucking report
       is read in, so the eye can find a group without reading every row. */
    .sch-day-tbl tbody tr.sch-grp td {
      background: var(--surface2); padding: 0.4rem 0.7rem;
      font-size: 0.66rem; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--orange);
      border-top: 2px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .sch-day-tbl tbody tr.sch-grp td .ct {
      margin-left: 0.5rem; color: var(--muted); font-weight: 600;
      letter-spacing: 0.04em; text-transform: none; font-size: 0.66rem;
    }
    .sch-day-tbl tbody tr.sch-grp:hover td { background: var(--surface2); }
    .sch-day-tbl tbody tr.sch-sub td {
      background: rgba(255,255,255,0.02); font-weight: 700;
      font-size: 0.74rem; color: var(--amber);
      font-variant-numeric: tabular-nums; padding: 0.35rem 0.7rem;
    }
    .sch-day-tbl tbody tr.sch-sub:hover td { background: rgba(255,255,255,0.02); }
    .sch-open-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .sch-open-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.25rem 0.55rem;
      font-size: 0.75rem; color: var(--muted); cursor: pointer;
    }
    .sch-open-chip:hover { color: var(--text); border-color: #555; }

    /* ── Driver picker ── */
    .sch-pick-bulk { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem; }
    .sch-pick-list {
      max-height: 320px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 5px; background: var(--surface);
    }
    .sch-pick-list::-webkit-scrollbar { width: 5px; }
    .sch-pick-list::-webkit-scrollbar-track { background: transparent; }
    .sch-pick-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .sch-pick-row {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 0.55rem; font-size: 0.78rem; cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .sch-pick-row:last-child { border-bottom: none; }
    .sch-pick-row:hover { background: var(--surface2); }
    .sch-pick-row input { accent-color: var(--orange); cursor: pointer; flex: none; }
    .sch-pick-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sch-pick-row input:not(:checked) ~ .nm { color: var(--muted); text-decoration: line-through; }
    .sch-pick-row .ct {
      font-size: 0.62rem; font-weight: 700; color: var(--amber);
      background: rgba(250,204,21,0.12); border-radius: 8px; padding: 0.05rem 0.4rem; flex: none;
    }

    /* ── Assignment editor ── */
    .sch-backdrop {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.55);
    }
    .sch-backdrop.open { display: flex; align-items: center; justify-content: center; }
    .sch-modal {
      width: 380px; max-width: calc(100vw - 2rem);
      max-height: calc(100vh - 3rem); overflow-y: auto;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 1.1rem 1.2rem 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .sch-modal h3 {
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1rem; font-weight: 600;
    }
    .sch-fld { margin-bottom: 0.7rem; }
    .sch-fld label {
      display: block; font-size: 0.62rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 0.28rem; font-weight: 600;
    }
    .sch-fld input, .sch-fld select, .sch-fld textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 0.8rem;
      padding: 0.36rem 0.5rem; outline: none; font-family: inherit;
    }
    .sch-fld input:focus, .sch-fld select:focus, .sch-fld textarea:focus { border-color: #555; }
    .sch-fld input[type=date]::-webkit-calendar-picker-indicator,
    .sch-fld input[type=time]::-webkit-calendar-picker-indicator { filter: invert(0.75); cursor: pointer; }
    .sch-fld textarea { resize: vertical; min-height: 52px; }
    .sch-fld-row { display: flex; gap: 0.6rem; }
    .sch-fld-row .sch-fld { flex: 1; min-width: 0; }
    .sch-modal-actions {
      display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;
    }
    .sch-btn {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em;
      border-radius: 4px; padding: 0.4rem 0.85rem; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    }
    .sch-btn:hover { color: var(--text); border-color: #555; }
    .sch-btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
    .sch-btn.primary:hover { background: var(--orange-dim); border-color: var(--orange-dim); color: #fff; }
    .sch-btn.danger:hover { color: var(--orange); border-color: var(--orange); }
    .sch-modal-err { font-size: 0.7rem; color: var(--orange); margin-top: 0.5rem; min-height: 1em; }

    /* ── Year filter tabs ── */
    .yr-tabs { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.85rem; }
    .yr-tab {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      background: none; border: 1px solid var(--border); border-radius: 20px;
      padding: 0.26rem 0.8rem; cursor: pointer; color: var(--muted);
      transition: color 0.12s, border-color 0.12s, background 0.12s;
      white-space: nowrap;
    }
    .yr-tab:hover { color: var(--text); border-color: #555; }
    .yr-tab.active { background: #facc15; color: #0a0a0f; border-color: #facc15; font-weight: 800; }
    .yr-row-count { font-size: 0.72rem; color: var(--muted); margin-left: 0.5rem; }

    /* ── Analytics sub-tabs ── */
    .sub-tab-bar {
      display: flex; align-items: center; background: var(--surface);
      border-bottom: 1px solid var(--border); padding: 0 1rem;
    }
    .sub-tab-btn {
      padding: 0.55rem 1.1rem;
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); background: none; border: none;
      border-bottom: 2px solid transparent; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .sub-tab-btn:hover { color: var(--text); }
    .sub-tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }
    .sub-tab-panel { display: none; }
    .sub-tab-panel.active { display: block; }

    /* ── Scheduler sub-tabs (Trucking / Labor boards) ──
       Their own classes rather than Analytics' .sub-tab-btn: that handler
       toggles every .sub-tab-panel on the page, so sharing the class would
       make picking an Analytics sub-tab blank a schedule board. */
    .sched-sub-btn {
      padding: 0.55rem 1.1rem;
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); background: none; border: none;
      border-bottom: 2px solid transparent; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .sched-sub-btn:hover { color: var(--text); }
    .sched-sub-btn.active { color: var(--orange); border-bottom-color: var(--orange); }
    /* A dot on a board with work still unsaved. The status pill in the toolbar
       only ever describes the board on screen, so without this a failed save
       on the other one is invisible until you switch to it. */
    .sched-sub-btn.unsaved::after, .sched-sub-btn.err::after {
      content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      margin-left: 0.4rem; vertical-align: middle; background: var(--amber);
    }
    .sched-sub-btn.err::after { background: var(--orange); }
    .sched-board-panel { display: none; }
    .sched-board-panel.active { display: block; }

    /* ── Scheduler Records ──
       The archive behind the two boards: every assignment either of them has
       ever carried, flattened into one table a dispatcher can filter and pull
       for a date range. Built on the Truck Tracking table's own classes where
       they fit — sticky header, sticky filter row — so the two read as the
       same tool. Its own prefix throughout: the boards are blanked when this
       is showing, but nothing here may collide with an id over there. */
    .rec-bar {
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 0.6rem;
    }
    .rec-bar label {
      font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin-right: 0.2rem;
    }
    .rec-bar input[type=date], .rec-bar select, .rec-bar input[type=text] {
      background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-size: 0.75rem; padding: 0.28rem 0.4rem;
      outline: none; font-family: inherit;
    }
    .rec-bar input[type=date]:focus, .rec-bar select:focus, .rec-bar input[type=text]:focus {
      border-color: #555;
    }
    .rec-bar input.rec-search { min-width: 190px; }
    .rec-bar .rec-sep { width: 1px; height: 20px; background: var(--border); margin: 0 0.15rem; }
    .rec-btn {
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 0.32rem 0.7rem; cursor: pointer; white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .rec-btn:hover { color: var(--text); border-color: #555; }
    .rec-btn.primary { color: var(--orange); border-color: var(--orange); }
    .rec-btn.primary:hover { background: var(--orange); color: #fff; }
    .rec-btn[disabled] { opacity: 0.45; cursor: default; }
    .rec-btn[disabled]:hover { color: var(--muted); border-color: var(--border); background: none; }

    .rec-note { font-size: 0.7rem; color: var(--muted); }
    .rec-note.warn { color: var(--amber); }
    .rec-note.err  { color: var(--orange); }

    .rec-scroll { overflow: auto; max-height: calc(100vh - 340px); border: 1px solid var(--border); border-radius: 6px; }
    .rec-tbl { width: 100%; border-collapse: collapse; background: var(--surface); min-width: 2400px; }
    .rec-tbl thead tr.hdr-row th {
      position: sticky; top: 0; z-index: 3;
      padding: 0.5rem 0.55rem; background: var(--surface2); color: var(--muted);
      font-size: 0.63rem; letter-spacing: 0.07em; text-transform: uppercase;
      border-bottom: 1px solid var(--border); white-space: nowrap; text-align: left;
      cursor: pointer; user-select: none;
    }
    .rec-tbl thead tr.hdr-row th.r { text-align: right; }
    .rec-tbl thead tr.hdr-row th:hover { color: var(--text); }
    .rec-tbl thead tr.hdr-row th.sorted { color: var(--orange); }
    .rec-tbl thead tr.hdr-row th .arw { font-size: 0.6rem; margin-left: 0.2rem; }
    .rec-tbl thead tr.filter-row th {
      position: sticky; top: 29px; z-index: 3; background: var(--surface);
      padding: 0.22rem 0.3rem; border-bottom: 1px solid var(--border);
    }
    .rec-tbl thead tr.filter-row input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 3px; color: var(--muted); font-size: 0.68rem;
      padding: 0.16rem 0.3rem; outline: none; font-family: inherit;
    }
    .rec-tbl thead tr.filter-row input:focus { border-color: #555; color: var(--text); }
    .rec-tbl thead tr.filter-row input.on { color: var(--text); border-color: #4b5563; }
    .rec-tbl tbody tr { border-bottom: 1px solid var(--border); }
    .rec-tbl tbody tr:hover { background: var(--surface2); }
    .rec-tbl tbody td {
      padding: 0.32rem 0.55rem; font-size: 0.76rem; white-space: nowrap;
      max-width: 320px; overflow: hidden; text-overflow: ellipsis;
    }
    /* Board, Date and Driver stay put while the other twenty-two columns
       scroll past, so a row half a screen to the right is still somebody's.
       Sticky cells need an opaque background of their own — the row's would
       scroll out from under them — and their own border, which border-collapse
       does not carry onto a stuck cell. */
    .rec-tbl th.stk, .rec-tbl td.stk { position: sticky; z-index: 2; }
    .rec-tbl tbody td.stk { background: var(--surface); border-bottom: 1px solid var(--border); }
    .rec-tbl tbody tr:hover td.stk { background: var(--surface2); }
    .rec-tbl tbody tr.orphan td.stk { background: #1b1a17; }
    .rec-tbl thead tr.hdr-row th.stk    { z-index: 5; background: var(--surface2); }
    .rec-tbl thead tr.filter-row th.stk { z-index: 5; background: var(--surface); }
    .rec-tbl .stk-edge { box-shadow: 1px 0 0 var(--border); }
    .rec-tbl tbody td.r { text-align: right; font-variant-numeric: tabular-nums; }
    .rec-tbl tbody td.dim { color: var(--muted); }
    .rec-tbl tbody td.id  { color: var(--muted); font-family: monospace; font-size: 0.66rem; }
    .rec-tbl tbody tr.orphan td { background: rgba(250,204,21,0.05); }
    .rec-tbl tbody td .pill {
      display: inline-block; padding: 0.05rem 0.4rem; border-radius: 999px;
      font-size: 0.62rem; letter-spacing: 0.04em; border: 1px solid var(--border); color: var(--muted);
    }
    .rec-tbl tbody td .pill.yes  { color: var(--green);  border-color: rgba(34,197,94,0.4);  }
    .rec-tbl tbody td .pill.no   { color: var(--muted); }
    .rec-tbl tbody td .pill.only { color: var(--amber);  border-color: rgba(250,204,21,0.4); }
    .rec-empty { padding: 3rem 1.5rem; text-align: center; color: var(--muted); font-size: 0.85rem; }
    .pdf-btn {
      margin-left: auto; padding: 0.3rem 0.75rem;
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--orange); background: none; border: 1px solid var(--orange);
      border-radius: 4px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .pdf-btn:hover { background: var(--orange); color: #fff; }

    /* ── Print / PDF styles ── */
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      :root {
        --bg: #ffffff; --surface: #f5f5f5; --surface2: #ebebeb;
        --border: #cccccc; --text: #111111; --muted: #555555; --orange: #cc0000;
      }
      body { background: #fff !important; }
      header, nav.tab-bar, .sub-tab-bar,
      .tab-panel:not(#tab-analytics),
      .sub-tab-panel:not(.active),
      .yr-tab, .pdf-btn { display: none !important; }
      #tab-analytics { display: block !important; }
      #tab-analytics::before {
        content: "Analytics Report — Trucking Division";
        display: block; font-size: 1rem; font-weight: 700;
        color: #111; padding: 0.5rem 1.25rem 0.75rem;
        border-bottom: 2px solid #ccc; margin-bottom: 0.5rem;
      }
      .sub-tab-panel.active { display: block !important; }
    }
    .online-avatar-wrap { position:relative; display:inline-flex; }
    .online-avatar-wrap .user-avatar { opacity:0.9; }
    .online-dot { position:absolute; bottom:-1px; right:-1px; width:8px; height:8px; background:#22c55e; border-radius:50%; border:1.5px solid #0a0a0a; }
    .online-users-label { font-size:0.65rem; color:#555; letter-spacing:0.04em; white-space:nowrap; }

    /* Typeahead combobox — replaces native <select> for driver / customer /
       unit tracking-row dropdowns. Native <select> typeahead jumps to the
       wrong option on slow typing; this filters as you type and only
       commits the option the user actually picks. */
    .cb { position: relative; width: 100%; }
    .cb-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-size: 0.8rem;
      padding: 0.1rem 0.2rem;
      outline: none;
      font-family: inherit;
    }
    .cb-input:focus { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb33; }
    .cb-input::placeholder { color: #6b7280; }
    .cb-menu {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      min-width: 100%;
      max-width: 260px;
      z-index: 1000;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    .cb-menu[hidden] { display: none; }
    .cb-opt {
      padding: 0.3rem 0.5rem;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cb-opt.hi, .cb-opt:hover { background: #2563eb; color: #fff; }
    .cb-opt-empty { padding: 0.3rem 0.5rem; font-size: 0.74rem; color: #6b7280; font-style: italic; }
  </style>
<script src="report-branding.js" defer></script>
<script src="mathis.js" defer></script>
</head>
<body>

  <!-- Save-error banner — surfaces backend failures (auth, network, 409
       bulk-wipe protection) so users know when an edit didn't reach the
       server. Hidden by default. -->
  <div id="save-error-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#b91c1c;color:#fff;font-size:0.85rem;padding:0.5rem 1rem;text-align:center;">
    <span id="save-error-msg">⚠ Changes could not be saved to the server. Your edits are kept locally.</span>
    &nbsp;<a href="index.html" style="color:#fff;font-weight:600;text-decoration:underline;" id="save-error-login-link" hidden>Log in again</a>
    <button onclick="document.getElementById('save-error-banner').style.display='none'" style="margin-left:1rem;background:rgba(255,255,255,0.2);border:none;color:#fff;cursor:pointer;padding:0.15rem 0.5rem;border-radius:3px;">Dismiss</button>
  </div>

  <!-- ── Header ── -->
  <header>
    <div class="hdr-left">
      <div class="brand">DataWatch</div>
      <div class="div-label">Trucking</div>
    </div>
    <div class="hdr-right">
      <span id="online-users" style="display:flex;align-items:center;gap:0.3rem;margin-right:0.25rem;"></span>
      <div class="user-avatar" id="userAvatar"></div>
      <div class="user-info" id="userInfo"></div>
      <button class="btn-ghost" onclick="switchDivision()">Switch Division</button>
      <button class="btn-ghost" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <!-- ── Tab bar ── -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="truck-tracking">Truck Tracking</button>
    <button class="tab-btn" data-tab="scheduler">Scheduler</button>
    <button class="tab-btn" data-tab="analytics">Analytics</button>
  </nav>

  <!-- hidden CSV upload input — must live outside the re-rendered tab panel -->
  <input type="file" id="csv-upload-input" accept=".csv" style="display:none"
    onchange="handleCSVUpload(this)">

  <!-- ── Scheduler assignment editor ──
       Lives outside the board panels on purpose: renderScheduler() replaces a
       panel's innerHTML, which would tear the dialog out mid-edit. Shared by
       both boards — schedCtx records which one it was opened from. -->
  <div class="sch-backdrop" id="sched-backdrop" onclick="schedCloseEditor(event)">
    <div class="sch-modal" id="sched-modal" onclick="event.stopPropagation()">
      <h3 id="sched-modal-title"></h3>
      <div id="sched-modal-body"></div>
    </div>
  </div>

  <!-- ── Scheduler dispatch report (print / PDF / email) ── -->
  <div class="sch-backdrop" id="sched-rep-backdrop" onclick="schedCloseReport(event)">
    <div class="sch-modal" id="sched-rep-modal" onclick="event.stopPropagation()">
      <h3>Print or email this schedule</h3>
      <div id="sched-rep-body"></div>
    </div>
  </div>

  <!-- ── Scheduler driver picker ── -->
  <div class="sch-backdrop" id="sched-pick-backdrop" onclick="schedClosePicker(event)">
    <div class="sch-modal" id="sched-pick-modal" onclick="event.stopPropagation()">
      <h3>Drivers on the board</h3>
      <div id="sched-pick-body"></div>
    </div>
  </div>

  <!-- ── Manage Lists overlay ── -->
  <div class="lists-backdrop" id="lists-backdrop" onclick="closeManageLists(event)">
    <div class="lists-panel" id="lists-panel" onclick="event.stopPropagation()">
      <div class="lists-head">
        <h3>Manage Lists</h3>
        <!-- Outside the re-rendered body on purpose: filtering redraws the list
             on every keystroke, and a box inside it would lose the caret. -->
        <input type="text" id="lists-search" class="lists-search" autocomplete="off"
          placeholder="Filter names…" oninput="listsSearch(this.value)">
        <button class="lists-close" onclick="closeManageLists()" title="Close (Esc)">&#10005;</button>
      </div>
      <div class="lists-tabs" id="lists-tabs"></div>
      <div class="lists-body" id="lists-panel-body"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       DASHBOARD TAB
  ══════════════════════════════════════════════ -->
  <div class="tab-panel active" id="tab-dashboard">
  </div>

  <!-- ══════════════════════════════════════════════
       ANALYTICS TAB
  ══════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-analytics">
    <div class="sub-tab-bar">
      <button class="sub-tab-btn active" data-sub="customer-data">Customer Data</button>
      <button class="sub-tab-btn" data-sub="financials">Financials</button>
      <button class="sub-tab-btn" data-sub="equipment-utilization">Equipment Utilization</button>
      <button class="sub-tab-btn" data-sub="driver-performance">Driver Performance</button>
      <button class="pdf-btn" onclick="downloadAnalyticsPDF()">&#8595; Download PDF</button>
    </div>
    <div class="sub-tab-panel active" id="sub-customer-data"></div>
    <div class="sub-tab-panel" id="sub-financials"></div>
    <div class="sub-tab-panel" id="sub-equipment-utilization"></div>
    <div class="sub-tab-panel" id="sub-driver-performance"></div>
  </div>

  <!-- ══════════════════════════════════════════════
       TRUCK TRACKING TAB
  ══════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-truck-tracking">
  </div>

  <!-- ══════════════════════════════════════════════
       SCHEDULER TAB — two boards and their archive, one tool
       Trucking and Labor are the same board pointed at different blobs.
       Records is the third sub-tab: every assignment either board has ever
       carried, flattened into one filterable table that pulls for a date
       range and downloads as a workbook.
       Only the selected panel is drawn; the others are emptied on the way
       out so no element id exists twice in the document.
  ══════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-scheduler">
    <div class="sub-tab-bar">
      <button class="sched-sub-btn active" data-board="trucking">Trucking Schedule</button>
      <button class="sched-sub-btn" data-board="labor">Labor Schedule</button>
      <button class="sched-sub-btn" data-board="records">Records</button>
    </div>
    <div class="sched-board-panel active" id="sched-board-trucking"></div>
    <div class="sched-board-panel" id="sched-board-labor"></div>
    <div class="sched-board-panel" id="sched-board-records"></div>
  </div>

  <script>
    /* ═══════════════════════════════════════════
       AUTH
    ═══════════════════════════════════════════ */
    const token    = localStorage.getItem('fct_token');
    const user     = (() => { try { return JSON.parse(localStorage.getItem('fct_user')); } catch { return null; } })();
    const division = localStorage.getItem('fct_division');

    if (!token || !user) window.location.replace('index.html');
    if (division !== 'trucking') window.location.replace('divisions.html');

    /* ── Populate header ── */
    const avatarEl = document.getElementById('userAvatar');
    const infoEl   = document.getElementById('userInfo');

    if (user) {
      avatarEl.textContent = (user.username || '?').charAt(0).toUpperCase();
      infoEl.innerHTML =
        `<strong>${(user.username || '').replace(/</g, '&lt;')}</strong>&nbsp;·&nbsp;${(user.companyName || user.companyCode || '').replace(/</g, '&lt;')}`;
    }

    /* ═══════════════════════════════════════════
       TAB SWITCHING
    ═══════════════════════════════════════════ */
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b =>
          b.classList.toggle('active', b === btn));
        document.querySelectorAll('.tab-panel').forEach(p =>
          p.classList.toggle('active', p.id === 'tab-' + btn.dataset.tab));
        if (btn.dataset.tab === 'dashboard') renderDashboard();
        if (btn.dataset.tab === 'truck-tracking') renderTrackingTab();
        if (btn.dataset.tab === 'scheduler') schedRerender();
        if (btn.dataset.tab === 'analytics') {
          const activeSub = document.querySelector('.sub-tab-btn.active');
          if (activeSub?.dataset.sub === 'equipment-utilization') renderEquipmentUtilization();
          else if (activeSub?.dataset.sub === 'financials') renderFinancials();
          else if (activeSub?.dataset.sub === 'driver-performance') renderDriverPerformance();
          else renderCustomerData();
        }
      });
    });

    /* ── Scheduler sub-tab switching ── */
    document.querySelectorAll('.sched-sub-btn').forEach(btn => {
      btn.addEventListener('click', () => schedSwitchBoard(btn.dataset.board));
    });

    /* ── Analytics sub-tab switching ── */
    document.querySelectorAll('.sub-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sub-tab-btn').forEach(b =>
          b.classList.toggle('active', b === btn));
        document.querySelectorAll('.sub-tab-panel').forEach(p =>
          p.classList.toggle('active', p.id === 'sub-' + btn.dataset.sub));
        if (btn.dataset.sub === 'customer-data') renderCustomerData();
        if (btn.dataset.sub === 'financials') renderFinancials();
        if (btn.dataset.sub === 'equipment-utilization') renderEquipmentUtilization();
        if (btn.dataset.sub === 'driver-performance') renderDriverPerformance();
      });
    });

    /* ═══════════════════════════════════════════
       NAVIGATION
    ═══════════════════════════════════════════ */
    function switchDivision() {
      localStorage.removeItem('fct_division');
      window.location.replace('divisions.html');
    }

    function signOut() {
      const go = () => {
        localStorage.removeItem('fct_token');
        localStorage.removeItem('fct_user');
        localStorage.removeItem('fct_division');
        window.location.replace('index.html');
      };
      if (window._presenceRemoveSelf) window._presenceRemoveSelf().finally(go);
      else go();
    }

    /* ═══════════════════════════════════════════
       TRUCK TRACKING — DATA LAYER
    ═══════════════════════════════════════════ */
    const API_BASE = '/api';
    let divEntries    = [];
    let divLists      = { employees: [], equipment: [] };
    // `removed` is the roster of names the office deleted from a managed list.
    // Drivers, customers and units are re-seeded from every stored entry on
    // load (see _migrateExistingEntries), so without a record of the deletion
    // a name that still appears on any historical row came straight back on
    // the next load. Deleting a name never touches the rows that carry it —
    // those keep their value and still read correctly — it only drops the name
    // out of the pickers. Re-adding the same name un-suppresses it.
    // `rates` is the haul fee a customer is billed at — { 'Kinkead': '121' } —
    // and is what a new row's Haul Fee fills itself in from once the customer
    // is named. Kept beside the customers list rather than on the row: the rate
    // is a fact about the company, the row is what was actually billed, and a
    // row already carrying a fee is never rewritten by a later rate change.
    // `notDrivers` is the other half of the drivers list: the sign-ins the
    // office has said are not drivers at all — an office login, a shared
    // account. Every other unlinked sign-in is offered as a name to add, and
    // without somewhere to put the answer "no" the same office accounts get
    // offered for ever.
    let divTruckLists = { drivers: [], customers: [], units: [], locations: [], materials: [],
                          rates: {}, notDrivers: [],
                          removed: { drivers: [], customers: [], units: [], materials: [] } };
    let _saveTimer       = null;
    let _isSaved         = false;
    let icSentMap = new Map(); // source_id → full IC entry (trucking)
    let icBillingArr = [];        // full IC billing list for syncing updates back
    let _icBillingDirty = false;  // pending IC billing changes not yet saved
    // True once divEntries has come back from the server at least once. The IC
    // reconciler prunes billing entries whose truck row is gone, and "gone" is
    // only meaningful against a list we actually loaded — before that, every row
    // is absent and the prune would wipe the division's billing.
    let _divEntriesLoaded = false;

    // Rows autofilled from an approved timesheet entry. Payroll owns them end to
    // end: this tab renders them locked, refuses to delete them, and treats their
    // absence as an un-approval rather than as data loss.
    function isPayrollRowId(id) { return String(id || '').startsWith('tst-'); }

    function fmtSentAt(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      if (isNaN(d)) return '';
      const mo = d.getMonth() + 1, day = d.getDate();
      let hr = d.getHours(), min = d.getMinutes();
      const ampm = hr >= 12 ? 'p' : 'a';
      hr = hr % 12 || 12;
      return `Sent ${mo}/${day} ${hr}:${String(min).padStart(2,'0')}${ampm}`;
    }

    async function loadIcSentMap() {
      try {
        const r = await fetch(`${API_BASE}/data/fct_intercompany_billing_entries`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!r.ok) return;
        const { value } = await r.json();
        icSentMap.clear();
        icBillingArr = Array.isArray(value) ? value : [];
        icBillingArr.forEach(e => { if (e.source === 'trucking' && e.source_id) icSentMap.set(e.source_id, e); });
      } catch { /* non-fatal */ }
    }

    let activeYearFilter          = new Date().getFullYear().toString();
    let analyticsYearFilter       = 'all';
    let equipYearFilter           = 'all';
    let financialsYearFilter      = 'all';

    function setYearFilter(year) {
      activeYearFilter = year;
      renderTrackingTab();
    }

    // Generic data key accessor (used for fct_lists and any non-truck-division keys)
    async function tdGet(key) {
      try {
        const r = await fetch(`${API_BASE}/data/${key}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!r.ok) return null;
        const { value } = await r.json();
        return value;
      } catch { return null; }
    }

    /** Show the save-error banner. customMsg lets backend conflict
     *  detail (the bulk-wipe protection's response body) flow through. */
    function _showSaveError(isAuth, customMsg) {
      const banner = document.getElementById('save-error-banner');
      if (!banner) return;
      const msgEl = document.getElementById('save-error-msg');
      const link  = document.getElementById('save-error-login-link');
      if (isAuth) {
        if (msgEl) msgEl.textContent = '⚠ Your session has expired — changes could not be saved. Your edits are kept locally.';
        if (link)  link.hidden = false;
      } else if (customMsg) {
        if (msgEl) msgEl.textContent = '⚠ ' + customMsg + ' Your edits are kept locally.';
        if (link)  link.hidden = true;
      } else {
        if (msgEl) msgEl.textContent = '⚠ Changes could not be saved to the server. Your edits are kept locally.';
        if (link)  link.hidden = true;
      }
      banner.style.display = '';
    }

    /** Standard error handler for a PUT response. Surfaces 409 detail
     *  and 401 auth issues via the save-error banner. */
    async function _handleSaveResponse(r, label) {
      if (r.ok) return;
      console.warn(`[${label}] PUT failed: HTTP ${r.status}`);
      if (r.status === 409) {
        let detail = 'A save was refused to prevent accidental data loss.';
        try { const j = await r.json(); if (j && j.detail) detail = j.detail; } catch {}
        _showSaveError(false, detail);
        return;
      }
      _showSaveError(r.status === 401);
    }

    function tdPut(key, value) {
      fetch(`${API_BASE}/data/${key}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ value })
      }).then(r => _handleSaveResponse(r, 'tdPut:' + key)).catch(() => _showSaveError(false));
    }

    // Truck division dedicated endpoint — entries + lists in one call
    async function tdDivGet() {
      try {
        const r = await fetch(`${API_BASE}/truck-division`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!r.ok) return null;
        return await r.json();
      } catch { return null; }
    }

    function tdDivPut(opts = {}) {
      const init = {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ entries: divEntries, lists: divTruckLists })
      };
      // Page-unload flushes need keepalive:true so the browser doesn't
      // cancel the request when the tab navigates away.
      if (opts.keepalive) init.keepalive = true;
      fetch(`${API_BASE}/truck-division`, init)
        .then(r => _handleSaveResponse(r, 'tdDivPut')).catch(() => _showSaveError(false));
      // Auto-mirror qualifying rows into Intercompany Billing: create entries for
      // newly-billable rows, keep already-sent ones in sync, and void any that
      // dropped to $0. Skipped on the page-unload path (keepalive) — the reconcile
      // needs a GET the browser won't reliably run mid-unload; the next load's
      // backfill reconciles instead.
      if (!opts.keepalive) autoSyncIntercompanyTrucking();
    }

    // Flush any pending debounced save immediately. Hooked to beforeunload
    // and visibilitychange so edits within the 600ms schedSave debounce
    // window aren't dropped on navigation.
    function _flushPendingDivSave() {
      if (!_saveTimer) return;
      clearTimeout(_saveTimer);
      _saveTimer = null;
      tdDivPut({ keepalive: true });
      _isSaved = true;
      const el = document.getElementById('save-status');
      if (el) el.style.display = '';
    }
    window.addEventListener('beforeunload', _flushPendingDivSave);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') _flushPendingDivSave();
    });

    /* ═══════════════════════════════════════════
       INTERCOMPANY BILLING — AUTO-SEND
       Mirrors qualifying truck-tracking rows into the shared Intercompany
       Billing blob automatically (no button click), matching the Dust Control
       and Quarry divisions. A row is mirrored once it names a customer enrolled
       in Intercompany under the 'trucking' division AND has a real invoice total
       (hours × haul fee > 0). Each entry is keyed by source_id (the truck row
       id) — Intercompany dedups trucking entries by (source, source_id) — so a
       row creates exactly one entry, stamped with a sent_at timestamp that the
       "✓ IC" row badge and the expanded-panel note display and that later edits
       preserve.

       Safeguards mirror the Dust implementation:
        - Never writes on a failed/partial billing-blob read (that would wipe
          every other division's entries from the shared blob).
        - Voids a previously-synced entry when its row drops to a $0 total, so IC
          never bills a figure the row no longer carries.
        - Leaves entries whose customer is no longer enrolled untouched — never
          wipes history (or IC-side invoice/payment dates) on un-enrollment.
        - Preserves Intercompany-owned fields (invoice_sent_date,
          payment_received_date, …) that the Intercompany screen edits directly.
        - Reflects sent-state in the UI only after the PUT actually persists.
    ═══════════════════════════════════════════ */
    let _icAutoSyncRunning = false;
    let _icAutoSyncQueued  = false;

    // Fields the trucking row owns. A change in any of these warrants rewriting
    // the mirrored entry; Intercompany-side fields (invoice/payment dates) are
    // deliberately excluded so an IC-side edit never looks like a trucking change.
    function _icTruckEntrySig(e) {
      return JSON.stringify([
        e.company_id, e.company_name, e.task_number, e.actual_date,
        e.driver, e.unit, e.actual_start, e.actual_end,
        e.total_hours, e.haul_fee, e.total,
        e.customer, e.description, e.division, e.notes,
      ]);
    }

    // Guarded read of the shared billing blob. Returns the array, or null to
    // signal "do not proceed" (failed / partial / unexpected read). Never treats
    // a failed read as an empty blob — that would let us overwrite the whole
    // shared blob and wipe every other division's billing.
    async function _readIcBilling() {
      try {
        const r = await fetch(`${API_BASE}/data/fct_intercompany_billing_entries`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!r.ok) return null;
        const body = await r.json();
        const value = body ? body.value : null;
        if (value != null && !Array.isArray(value)) return null;   // unexpected shape
        return {
          entries:   Array.isArray(value) ? value : [],            // 200 + null ⇒ genuinely empty
          updatedAt: body ? (body.updated_at || null) : null,
        };
      } catch { return null; }
    }

    // Write the shared blob back, refusing to land on top of a value written
    // since we read it. Trucking and the three dust tabs all read-modify-write
    // this one blob; without this the last writer silently erased the others'
    // entries. On a conflict the caller re-queues and reconciles onto the newer
    // value. Returns { ok, conflict }.
    //
    // An empty result needs ?force=1: the backend refuses a plain empty-array
    // PUT as bulk-wipe protection, so without it a genuine "everything voided"
    // fails silently and a stale figure lingers in IC.
    async function _writeIcBilling(entries, baseUpdatedAt) {
      const qs = entries.length === 0 ? '?force=1' : '';
      try {
        const r = await fetch(`${API_BASE}/data/fct_intercompany_billing_entries${qs}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ value: entries, baseUpdatedAt }),
        });
        if (r.status === 409) {
          // Two different 409s: a stale base (retry onto the newer value, and
          // say nothing — it resolves itself) and the bulk-wipe guard, which no
          // retry can clear and which the user needs to see.
          let stale = false, detail = null;
          try { const b = await r.json(); stale = !!b && b.error === 'Conflict'; detail = b && b.detail; } catch { /* fatal */ }
          if (stale) return { ok: false, conflict: true };
          _showSaveError(false, detail || 'A save was refused to prevent accidental data loss.');
          return { ok: false, conflict: false };
        }
        if (!r.ok) {
          console.warn(`[autoSyncIntercompanyTrucking] PUT failed: HTTP ${r.status}`);
          _showSaveError(r.status === 401);
        }
        return { ok: r.ok, conflict: false };
      } catch { return { ok: false, conflict: false }; }
    }

    // Bounded so a persistently busy blob can't spin forever.
    const IC_MAX_CONFLICT_RETRIES = 3;
    let _icConflictRetries = 0;

    // Rows an Intercompany user deleted. Trucking owns these rows, so "absent
    // from the blob" is what the reconciler reads as "new" — without this list
    // a deletion over there is undone on the next sync and looks like the page
    // ignored it. Only creation is suppressed: an entry that still exists keeps
    // being maintained, so a stale record can't freeze a live row.
    const IC_REMOVED_KEY = 'fct_intercompany_removed_entries';
    let _icSuppressed = new Set();

    function icIsSuppressed(sourceId) { return _icSuppressed.has(`trucking|${sourceId}`); }

    async function _loadIcSuppressions() {
      try {
        const r = await fetch(`${API_BASE}/data/${IC_REMOVED_KEY}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!r.ok) return;
        const { value } = await r.json();
        if (!Array.isArray(value)) return;
        _icSuppressed = new Set(
          value.filter(t => t && t.source_id).map(t => `${t.source || ''}|${t.source_id}`)
        );
      } catch { /* non-fatal — worst case a removed row reappears */ }
    }

    // Reconcile every truck row into `entries` (MUTATED in place):
    //  • pull the entry for a payroll row that no longer exists (un-approved),
    //  • create an entry for a newly-billable row (stamped sent_at = now),
    //  • keep an existing entry in sync when a trucking-owned field changed
    //    (preserving its original sent_at and any Intercompany-side fields),
    //  • void a previously-synced entry whose row dropped to a $0 total,
    //  • never touch an entry whose customer is no longer enrolled.
    // Returns what changed so the caller can update the UI after a good write.
    function _reconcileTruckingBilling(entries, coByName) {
      const bySourceId = new Map();
      entries.forEach(e => {
        if (e.source === 'trucking' && e.source_id) bySourceId.set(e.source_id, e);
      });

      let changed = false;
      const sentNow  = [];   // {id, sentAt}
      const clearNow = [];   // ids whose stale entry we voided

      // Payroll rows un-approved or deleted since they were mirrored: pull their
      // billing entry so Intercompany stops invoicing hours payroll took back.
      // The server does this at un-approve time; this is the backstop for entries
      // stranded before it did, and it is what keeps _recoverEntriesFromIcBilling
      // from having anything left to resurrect.
      //
      // Restricted to payroll rows on purpose. A manual row the office deletes is
      // handled by the $0-total rule below while it still exists, and absence
      // alone is not safe to read as deletion for rows this tab creates — that is
      // the very thing _recoverEntriesFromIcBilling exists to undo. For a payroll
      // row, absence IS the deletion: nothing else can remove one.
      if (_divEntriesLoaded) {
        const liveIds = new Set(divEntries.map(e => e && e.id).filter(Boolean));
        for (const [sourceId, prev] of bySourceId) {
          if (!isPayrollRowId(sourceId) || liveIds.has(sourceId)) continue;
          const i = entries.indexOf(prev);
          if (i !== -1) { entries.splice(i, 1); changed = true; }
          bySourceId.delete(sourceId);
          clearNow.push(sourceId);
        }
      }

      for (const row of divEntries) {
        const tot  = (parseFloat(row.total_hours) || 0) * (parseFloat(row.haul_fee) || 0);
        const prev = bySourceId.get(row.id);

        if (!(tot > 0)) {
          // Row no longer has a billable total — void any stale entry.
          if (prev) {
            const i = entries.indexOf(prev);
            if (i !== -1) { entries.splice(i, 1); changed = true; }
            bySourceId.delete(row.id);
            clearNow.push(row.id);
          }
          continue;
        }

        const matched = coByName.get((row.customer || '').trim().toLowerCase());
        if (!matched) {
          // Customer isn't enrolled in IC trucking billing. Don't create an
          // entry — and don't delete an existing one either: it was valid when
          // sent, and un-enrolling a customer shouldn't retroactively wipe its
          // history (or any IC-side invoice/payment dates on it).
          continue;
        }

        const sentAt = prev?.sent_at || new Date().toISOString();
        const entry  = {
          ...(prev || {}),                    // preserve Intercompany-side fields
          id: prev?.id || (Date.now().toString(36) + Math.random().toString(36).slice(2)),
          source: 'trucking', source_id: row.id,
          company_id: matched.id, company_name: matched.name,
          task_number: row.task_number, actual_date: row.actual_date,
          driver: row.driver, unit: row.unit,
          actual_start: row.actual_start, actual_end: row.actual_end,
          total_hours: row.total_hours, haul_fee: row.haul_fee, total: tot,
          customer: row.customer, description: row.description,
          division: row.division, notes: row.notes,
          sent_at: sentAt,
          sent_by: (typeof user !== 'undefined' && user?.username) || '',
        };
        // On first mirror, snapshot the invoice/payment fields the trucking
        // office fills in the sub-row. On later syncs leave whatever's on the IC
        // entry — the Intercompany screen owns invoice_sent_date / payment dates.
        if (!prev) {
          entry.qb_invoice        = row.qb_invoice        || '';
          entry.invoiced_date     = row.invoiced_date     || '';
          entry.invoice_sent_date = row.invoice_sent_date || '';
          entry.invoice_status    = row.invoice_status    || 'Unpaid';
          entry.date_paid         = row.date_paid         || '';
        }

        if (prev) {
          if (_icTruckEntrySig(prev) !== _icTruckEntrySig(entry)) {
            const i = entries.indexOf(prev);
            if (i !== -1) entries[i] = entry; else entries.unshift(entry);
            bySourceId.set(row.id, entry);
            changed = true;
          }
          sentNow.push({ id: row.id, sentAt });
        } else if (icIsSuppressed(row.id)) {
          continue;   // deleted in Intercompany — leave it deleted
        } else {
          entries.unshift(entry);
          bySourceId.set(row.id, entry);
          changed = true;
          sentNow.push({ id: row.id, sentAt });
        }
      }

      return { changed, sentNow, clearNow };
    }

    // Refresh the "✓ IC {sent}" row badge and the expanded-panel timestamp for
    // the given rows in place — no full re-render, so a row the user is mid-edit
    // on is never disrupted.
    function _refreshTruckIcBadges(sentNow) {
      sentNow.forEach(({ id, sentAt }) => {
        const mainBadge = document.getElementById('ic-main-' + id);
        if (mainBadge) { mainBadge.innerHTML = `&#10003; IC ${fmtSentAt(sentAt)}`; mainBadge.style.color = '#22c55e'; }
        const tsEl = document.getElementById('ic-ts-' + id);
        if (tsEl) { tsEl.textContent = fmtSentAt(sentAt); tsEl.style.color = '#22c55e'; }
      });
    }

    // Clear the badge + reset the panel note for rows whose IC entry was voided.
    function _clearTruckIcBadges(clearNow) {
      clearNow.forEach(id => {
        const mainBadge = document.getElementById('ic-main-' + id);
        if (mainBadge) mainBadge.innerHTML = '';
        const tsEl = document.getElementById('ic-ts-' + id);
        if (tsEl) { tsEl.textContent = 'Needs customer & total'; tsEl.style.color = 'var(--muted)'; }
      });
    }

    async function autoSyncIntercompanyTrucking() {
      // Coalesce: if a sync is already in flight, run once more after it finishes
      // rather than piling up concurrent read-modify-writes on the shared blob.
      if (_icAutoSyncRunning) { _icAutoSyncQueued = true; return; }
      _icAutoSyncRunning = true;
      try {
        await _loadIcSuppressions();
        const companies = await tdGet('fct_intercompany_companies');
        const coList = Array.isArray(companies) ? companies : [];
        if (!coList.length) return;              // nothing to match against
