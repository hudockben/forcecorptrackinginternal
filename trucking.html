          <td style="white-space:nowrap;color:var(--amber);font-weight:600">${schedEsc(schedTime12(a.end)) || '<span style="color:var(--muted);font-weight:400">—</span>'}</td>
          <td style="${G}">${rep && rep.actual_start ? schedEsc(schedTime12(rep.actual_start)) : DASH}</td>
          <td style="${G}">${rep && rep.actual_end   ? schedEsc(schedTime12(rep.actual_end))   : DASH}</td>
          <td style="text-align:right;${G}">${hrs ? schedEsc(hrs) : DASH}</td>
          <td style="font-weight:600">${schedEsc(a.driver)}${schedS().hidden.has(a.driver)
            ? '<span class="sch-hidtag" title="Hidden from the board — still listed because they are scheduled">hidden</span>' : ''}${
            clash && clash.driver ? ' <span class="sch-warn" style="font-size:0.6rem" title="Booked on another haul over the same hours">double-booked</span>' : ''}</td>
          <td style="color:var(--muted);white-space:nowrap">${schedEsc(schedDivLabel(a.division)) || '—'}</td>
          <td>${schedEsc(schedJobOf(a)) || '<span style="color:var(--muted)">—</span>'}${
            a.address ? `<span style="display:block;color:var(--muted);font-size:0.7rem;line-height:1.3">${schedEsc(a.address)}</span>` : ''}</td>
          <td>${schedEsc(a.material) || '<span style="color:var(--muted)">—</span>'}</td>
          <td>${schedEsc(a.unit) || DASH}${clash && clash.unit
            ? ' <span class="sch-warn" style="font-size:0.6rem" title="This truck is booked on another haul over the same hours">overlap</span>' : ''}</td>
          <td style="color:var(--muted);white-space:nowrap">${schedEsc(unitTypeLabel(a.unit)) || DASH}</td>
          <td style="text-align:right;${G}">${rep && rep.tons != null
            ? schedEsc(Number(rep.tons).toLocaleString('en-US', { maximumFractionDigits: 2 })) : DASH}</td>
          <td style="text-align:right;${G}">${rep && rep.loads != null ? schedEsc(rep.loads) : DASH}</td>
          <td style="${G};font-weight:500">${rep && rep.tickets ? schedEsc(rep.tickets) : DASH}</td>
          <td style="color:var(--muted);min-width:150px">${schedEsc(a.notes)}${
            rep && rep.notes ? `<span style="display:block;color:var(--green);font-size:0.72rem;line-height:1.35">${schedEsc(rep.notes)}</span>` : ''}</td>
        </tr>`;
      };

      // Sections, the way the supervisor's daily report reads, each closing
      // with the totals that get read off the bottom of a group.
      const groups = schedGroupedItems(date);
      const rows = groups.length ? groups.map(g => `
          <tr class="sch-grp"><td colspan="15">${schedEsc(g.label)}
            <span class="ct">${g.rows.length} haul${g.rows.length === 1 ? '' : 's'}</span></td></tr>
          ${g.rows.map(oneRow).join('')}
          <tr class="sch-sub">
            <td colspan="4"></td>
            <td style="text-align:right">${g.hours ? schedEsc(schedNum(g.hours, 2)) : ''}</td>
            <td colspan="6" style="color:var(--muted)">${schedEsc(g.label)} total</td>
            <td style="text-align:right">${g.tons  ? schedEsc(schedNum(g.tons))  : ''}</td>
            <td style="text-align:right">${g.loads ? schedEsc(schedNum(g.loads, 0)) : ''}</td>
            <td colspan="2"></td>
          </tr>`).join('')
        : `<tr><td colspan="15" style="padding:1.5rem;text-align:center;color:var(--muted);font-size:0.85rem">Nothing scheduled for this day.</td></tr>`;

      const assigned = new Set(items.map(a => a.driver));
      const open     = drivers.filter(d => !assigned.has(d));

      return `
        <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.6rem">
          <button class="sch-btn primary" onclick="schedAddAssign('${date}',-1)">+ Add assignment</button>
          <span style="font-size:0.7rem;color:var(--muted)">Click a driver's row at the hour you want to start them.</span>
        </div>
        ${schedTimelineHTML(date, drivers, clashes)}
        <p class="home-section-title">Dispatch Sheet</p>
        <div style="display:flex;align-items:center;gap:0.5rem;margin:-0.35rem 0 0.6rem;flex-wrap:wrap">
          <button class="sch-btn" onclick="schedSheetPrint()">Print / PDF</button>
          <button class="sch-btn" onclick="schedSheetEmail()">Email</button>
          <button class="sch-btn" onclick="schedSheetDownload()">Download Excel</button>
          <span style="font-size:0.68rem;color:var(--muted)">This day's sheet, reported figures included.</span>
          <span id="sched-sheet-msg" style="font-size:0.7rem;color:var(--orange)"></span>
        </div>
        <div class="proj-table-wrap" style="border:1px solid var(--border);border-radius:6px;margin-bottom:1.5rem">
          <table class="sch-day-tbl">
            <thead><tr>
              <th>Start</th><th>End</th>
              <th>Act. Start</th><th>Act. End</th><th>Hours</th>
              <th>Driver</th><th>Division</th><th>Project</th><th>Material</th>
              <th>Truck</th><th>Truck Type</th>
              <th>Tons</th><th>Loads</th><th>Tickets</th><th>Notes</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <p class="home-section-title">Open Drivers <span style="font-weight:400;text-transform:none;letter-spacing:0">(${open.length} of ${drivers.length})</span></p>
        ${open.length
          ? `<div class="sch-open-list">${open.map(d =>
              `<button class="sch-open-chip" onclick="schedAddAssign('${date}',${drivers.indexOf(d)})">${schedEsc(d)} +</button>`
            ).join('')}</div>`
          : `<div style="color:var(--muted);font-size:0.8rem">Every driver on the roster is scheduled.</div>`}`;
    }




    /* ═══════ How the daily report is grouped ═══════
       The truck supervisor's daily report reads as sections — the tri-axles,
       then the lowboys, then anything hauled for EES — so the sheet is
       built the same way rather than as one flat run of rows.

       EES is decided before the truck type because that is how the report
       reads: work for EES is called out on its own whatever it went out
       on, rather than being split across the truck sections.

       The truck type is the unit's own (see UNIT_TYPES, set in Manage Lists),
       falling back to what its name gives away for a unit nobody has typed one
       on. It used to be only the name, which meant a unit called 2757 — a
       tri-axle to everyone in the yard — was filed under Other on every sheet
       that went out. Anything still unrecognised lands in Other: a haul is
       never dropped for want of a type. */
    const SCHED_GROUPS = [
      ...UNIT_TYPES.map(t => ({ key: t.key, label: t.label })),
      { key: 'dust',  label: 'EES'   },
      { key: 'other', label: 'Other' },
    ];

    function schedTruckGroup(a) {
      if ((a && a.division) === 'dust') return 'dust';
      return unitType(a && a.unit) || 'other';
    }

    /** The day's hauls as report sections, empty ones dropped, each carrying
     *  the totals a supervisor reads off the bottom of a group. */
    function schedGroupedItems(date) {
      const items = schedRepItems(date);
      return SCHED_GROUPS.map(g => {
        const rows = items.filter(a => schedTruckGroup(a) === g.key);
        let hours = 0, tons = 0, loads = 0;
        rows.forEach(a => {
          const rep = schedReports.get(a.id);
          if (!rep) return;
          const h = parseFloat(schedHoursBetween(rep.actual_start, rep.actual_end).replace(/,/g, ''));
          if (isFinite(h)) hours += h;
          if (rep.tons  != null) tons  += Number(rep.tons)  || 0;
          if (rep.loads != null) loads += Number(rep.loads) || 0;
        });
        return { ...g, rows, hours, tons, loads };
      }).filter(g => g.rows.length);
    }

    const schedNum = (n, dp) => Number(n).toLocaleString('en-US',
      { minimumFractionDigits: dp || 0, maximumFractionDigits: dp === undefined ? 2 : dp });

    /* ═══════ Dispatch sheet — print, email, Excel ═══════
       The toolbar's PDF/Email carries the plan: what dispatch handed out.
       This carries the whole sheet, reported figures included, which is the
       version the office reconciles against — so it is built here from the
       same fourteen columns rather than folded into that report. */

    /** One row of the sheet as plain values, in the order the columns read.
     *  Every output below is built from this, so the printed page, the email
     *  and the workbook can never disagree about what the sheet said. */
    const SCHED_SHEET_COLS = [
      'Start', 'End', 'Act. Start', 'Act. End', 'Hours', 'Driver', 'Division',
      'Project', 'Address', 'Material', 'Truck', 'Truck Type', 'Tons', 'Loads',
      'Tickets', 'Notes', 'Driver notes',
    ];

    function schedSheetRow(a) {
      const rep = schedReports.get(a.id) || null;
      return [
        schedTime12(a.start), schedTime12(a.end),
        rep ? schedTime12(rep.actual_start) : '',
        rep ? schedTime12(rep.actual_end)   : '',
        rep ? schedHoursBetween(rep.actual_start, rep.actual_end) : '',
        a.driver || '', schedDivLabel(a.division), schedJobOf(a), a.address || '',
        a.material || '', a.unit || '', unitTypeLabel(a.unit),
        rep && rep.tons  != null ? rep.tons  : '',
        rep && rep.loads != null ? rep.loads : '',
        rep ? (rep.tickets || '') : '',
        a.notes || '',
        rep ? (rep.notes || '') : '',
      ];
    }

    function schedSheetRows(date) { return schedRepItems(date).map(schedSheetRow); }

    function schedSheetTitle(date) {
      return schedBoardCfg().noun + ' Dispatch Sheet — ' + schedRepDayLabel(date);
    }

    /** The sheet as a table, for the print window and the email alike —
     *  sectioned and subtotalled the same way the screen shows it. */
    function schedSheetHTML(date) {
      // Tons and loads read as figures, so they are right-aligned like figures.
      const numeric = new Set([4, 12, 13]);
      const N = SCHED_SHEET_COLS.length;
      const band = 'background:#e9e9e9;border:1px solid #ccc;padding:4px 7px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:#111';
      const subt = 'border:1px solid #ddd;padding:4px 7px;font-size:10.5px;font-weight:700;background:#f7f7f7';
      const groups = schedGroupedItems(date);
      const body = groups.length ? groups.map(g => `
          <tr><td style="${band}" colspan="${N}">${schedEsc(g.label)} — ${g.rows.length} haul${g.rows.length === 1 ? '' : 's'}</td></tr>
          ${g.rows.map(a => { const r = schedSheetRow(a); return `<tr>${r.map((c, i) =>
              `<td style="${_RP.td}${numeric.has(i) ? ';text-align:right' : ''}">${schedEsc(c) || '<span style="color:#bbb">—</span>'}</td>`
            ).join('')}</tr>`; }).join('')}
          <tr>
            <td style="${subt}" colspan="4"></td>
            <td style="${subt};text-align:right">${g.hours ? schedEsc(schedNum(g.hours, 2)) : ''}</td>
            <td style="${subt};color:#555" colspan="7">${schedEsc(g.label)} total</td>
            <td style="${subt};text-align:right">${g.tons  ? schedEsc(schedNum(g.tons))  : ''}</td>
            <td style="${subt};text-align:right">${g.loads ? schedEsc(schedNum(g.loads, 0)) : ''}</td>
            <td style="${subt}" colspan="3"></td>
          </tr>`).join('')
        : `<tr><td style="${_RP.none}" colspan="${N}">Nothing scheduled.</td></tr>`;
      return `<table style="${_RP.tbl}"><thead><tr>${
        SCHED_SHEET_COLS.map(h => `<th style="${_RP.th}">${schedEsc(h)}</th>`).join('')
      }</tr></thead><tbody>${body}</tbody></table>`;
    }

    function schedSheetPrint() {
      const date = schedS().anchor;
      const w = window.open('', '_blank');
      const msg = document.getElementById('sched-sheet-msg');
      if (!w) {
        if (msg) msg.textContent = 'Allow pop-ups for this site to open the print view.';
        return;
      }
      if (msg) msg.textContent = '';
      const ts = new Date().toLocaleString('en-US',
        { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      const co = (user && (user.companyName || user.companyCode)) || 'Force Corp';
      // Seventeen columns will not fit a portrait page, so this one asks for
      // landscape and a smaller body than the plan report uses.
      dwWrite(w, `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${schedEsc(schedSheetTitle(date))}</title>
        <style>@page{size:landscape;margin:10mm}body{margin:0}
        table{page-break-inside:auto;font-size:9.5px}tr{page-break-inside:avoid}thead{display:table-header-group}
        th,td{font-size:9.5px !important}</style></head>
        <body style="${_RP.wrap};padding:14px">
        <div style="${_RP.mast}">
          <div style="margin-bottom:5px">
            <span style="${_RP.brand}">DataWatch</span><span style="${_RP.dvsn}">Trucking</span>
          </div>
          <div style="${_RP.h1}">${schedEsc(schedSheetTitle(date))}</div>
          <div style="${_RP.subT}">${schedEsc(co)} · Generated ${schedEsc(ts)}</div>
        </div>
        ${schedSheetHTML(date)}</body></html>`);
      w.document.close();
      w.focus();
      setTimeout(() => { try { w.print(); } catch { /* the user can still print manually */ } }, 350);
    }

    /* ── Excel ──
       A real .xlsx rather than a CSV renamed: no import dialog, no dates and
       ticket numbers mangled into something else on open, and the columns
       arrive sized. Written by hand because the page loads no libraries — the
       ZIP is stored rather than deflated, which is a valid archive and means
       no compressor is needed. */
    function _crc32(bytes) {
      let c, crc = 0xFFFFFFFF;
      if (!_crc32.table) {
        _crc32.table = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
          c = i;
          for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          _crc32.table[i] = c >>> 0;
        }
      }
      for (let i = 0; i < bytes.length; i++) crc = _crc32.table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    function _zip(files) {
      const enc = new TextEncoder();
      const parts = [], central = [];
      let offset = 0;
      const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
      const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];

      files.forEach(f => {
        const name = enc.encode(f.name);
        const data = enc.encode(f.data);
        const crc  = _crc32(data);
        const lh = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0), u16(0), u16(0), u16(0),
          u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
        parts.push(new Uint8Array(lh), name, data);
        central.push([].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
          u32(crc), u32(data.length), u32(data.length), u16(name.length),
          u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)));
        central.push(name);
        offset += lh.length + name.length + data.length;
      });

      const cd = [];
      central.forEach(c => cd.push(c instanceof Uint8Array ? c : new Uint8Array(c)));
      const cdSize = cd.reduce((n, c) => n + c.length, 0);
      const eocd = new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0),
        u16(files.length), u16(files.length), u32(cdSize), u32(offset), u16(0)));

      const all = [...parts, ...cd, eocd];
      const total = all.reduce((n, p) => n + p.length, 0);
      const out = new Uint8Array(total);
      let at = 0;
      all.forEach(p => { out.set(p, at); at += p.length; });
      return out;
    }

    const _xmlEsc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
      // Excel refuses to open a workbook containing control characters.
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');

    function _colName(i) {
      let s = '';
      for (i += 1; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + ((i - 1) % 26)) + s;
      return s;
    }

    /** Excel's own day number for a YYYY-MM-DD: days since 1899-12-30. Built
     *  from UTC so no time zone can push a date onto the day before it, the
     *  same reason every parse on this page goes through local noon. */
    function _xlsxSerial(ds) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ds || ''));
      if (!m) return null;
      return Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30)) / 86400000);
    }

    /** Excel will not open a workbook whose sheet name carries one of its
     *  reserved characters, or runs past 31. */
    function _xlsxSheetName(name, i) {
      const s = String(name == null ? '' : name).replace(/[:\\\/?*\[\]]/g, ' ').trim().slice(0, 31);
      return s || ('Sheet' + (i + 1));
    }

    /* Style slots every sheet below writes against. 0 and 1 are what the
       dispatch sheet has always used, so they keep their meaning:
         0 default · 1 bold · 2 date · 3 two decimals · 4 header band */
    const _XLSX_S = { PLAIN: 0, BOLD: 1, DATE: 2, NUM2: 3, HEAD: 4 };

    /** Wrap worksheets into a workbook.
     *  Each sheet is { name, colsXml, rowsXml, freeze, autoFilterRef } — the
     *  rows already rendered, because the two workbooks on this page lay their
     *  rows out very differently and only the packaging is common. */
    function _xlsxPackage(sheets) {
      const list = (sheets || []).map((sh, i) => ({ ...sh, name: _xlsxSheetName(sh.name, i) }));
      const sheetXml = sh => {
        const views = sh.freeze
          ? `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" ` +
            `activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
          : '';
        // autoFilter belongs after sheetData in the schema; putting it before
        // it is the one ordering mistake Excel refuses to open the file over.
        const filter = sh.autoFilterRef ? `<autoFilter ref="${sh.autoFilterRef}"/>` : '';
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
          `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
          `${views}${sh.colsXml || ''}<sheetData>${sh.rowsXml || ''}</sheetData>${filter}</worksheet>`;
      };
      // The hidden name Excel keeps beside an auto-filter. Without it the
      // dropdowns still appear, but the range is forgotten on the first save.
      const names = list.map((sh, i) => sh.autoFilterRef
        ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${
            sh.name.replace(/'/g, "''")}'!${sh.autoFilterRef.split(':').map(r => '$' + r.replace(/(\d+)/, '$$$1')).join(':')}</definedName>`
        : '').filter(Boolean).join('');

      const files = [
        { name: '[Content_Types].xml', data:
          `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
          `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
          `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
          `<Default Extension="xml" ContentType="application/xml"/>` +
          `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
          list.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ` +
            `ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
          `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>` +
          `</Types>` },
        { name: '_rels/.rels', data:
          `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
          `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
          `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>` +
          `</Relationships>` },
        { name: 'xl/workbook.xml', data:
          `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
          `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ` +
          `xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
          `<sheets>${list.map((sh, i) =>
            `<sheet name="${_xmlEsc(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>` +
          (names ? `<definedNames>${names}</definedNames>` : '') +
          `</workbook>` },
        { name: 'xl/_rels/workbook.xml.rels', data:
          `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
          `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
          list.map((_, i) => `<Relationship Id="rId${i + 1}" ` +
            `Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" ` +
            `Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
          `<Relationship Id="rId${list.length + 1}" ` +
            `Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>` +
          `</Relationships>` },
        { name: 'xl/styles.xml', data:
          `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
          `<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
          `<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>` +
          `<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>` +
          `<fills count="3"><fill><patternFill patternType="none"/></fill>` +
          `<fill><patternFill patternType="gray125"/></fill>` +
          `<fill><patternFill patternType="solid"><fgColor rgb="FFD9D9D9"/><bgColor indexed="64"/></patternFill></fill></fills>` +
          `<borders count="2"><border/>` +
          `<border><left/><right/><top/><bottom style="thin"><color rgb="FF808080"/></bottom><diagonal/></border></borders>` +
          `<cellStyleXfs count="1"><xf/></cellStyleXfs>` +
          `<cellXfs count="5">` +
            `<xf xfId="0"/>` +
            `<xf xfId="0" fontId="1" applyFont="1"/>` +
            `<xf xfId="0" numFmtId="14" applyNumberFormat="1"/>` +
            `<xf xfId="0" numFmtId="2" applyNumberFormat="1"/>` +
            `<xf xfId="0" fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/>` +
          `</cellXfs>` +
          // Without a named Normal style some readers warn the workbook has no
          // default; Excel copes either way, but the file should be clean.
          `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>` +
          `</styleSheet>` },
        ...list.map((sh, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(sh) })),
      ];
      return _zip(files);
    }

    function schedSheetXlsx(date) {
      const header = SCHED_SHEET_COLS;
      const numeric = new Set([4, 12, 13]);   // hours, tons, loads

      const cell = (r, c, v, isHeader) => {
        const ref = _colName(c) + (r + 1);
        const num = numeric.has(c) && v !== '' && v !== null && isFinite(Number(String(v).replace(/,/g, '')));
        if (num) return `<c r="${ref}" s="0"><v>${Number(String(v).replace(/,/g, ''))}</v></c>`;
        if (v === '' || v == null) return '';
        return `<c r="${ref}" t="inlineStr"${isHeader ? ' s="1"' : ''}><is><t xml:space="preserve">${_xmlEsc(v)}</t></is></c>`;
      };

      // Sections and their totals are rows like any other, so the workbook
      // opens reading the way the printed sheet does.
      const groups = schedGroupedItems(date);
      const out = [`<row r="1">${header.map((h, c) => cell(0, c, h, true)).join('')}</row>`];
      let r = 1;
      groups.forEach(g => {
        out.push(`<row r="${++r}">${cell(r - 1, 0, g.label.toUpperCase(), true)}</row>`);
        g.rows.forEach(a => {
          const vals = schedSheetRow(a);
          out.push(`<row r="${++r}">${vals.map((v, c) => cell(r - 1, c, v, false)).join('')}</row>`);
        });
        r++;
        out.push(`<row r="${r}">` +
          cell(r - 1, 4, g.hours ? Number(g.hours.toFixed(2)) : '', true) +
          cell(r - 1, 5, g.label + ' total', true) +
          cell(r - 1, 12, g.tons  ? Number(g.tons.toFixed(2)) : '', true) +
          cell(r - 1, 13, g.loads || '', true) +
          `</row>`);
      });
      const sheetRows = out.join('');

      const widths = [9, 9, 11, 10, 8, 18, 12, 30, 30, 16, 14, 14, 8, 8, 16, 26, 26];
      const cols = `<cols>${widths.map((w, i) =>
        `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>`;

      return _xlsxPackage([{ name: 'Dispatch', colsXml: cols, rowsXml: sheetRows }]);
    }

    function schedSheetDownload() {
      const date = schedS().anchor;
      const blob = new Blob([schedSheetXlsx(date)],
        { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = schedBoard + '-dispatch-' + date + '.xlsx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      // Revoked on a timer rather than immediately: Safari reads the blob
      // after the click returns, and pulling it out from under it downloads
      // an empty file.
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }

    /* ── Email the sheet ── */
    function schedSheetEmail() {
      _schedRepSheetMode = true;
      schedOpenReport();
    }

    /* ═══════ Dispatch report — print / PDF / email ═══════
       One HTML body serves both routes: the print window the browser turns
       into a PDF, and the email the server sends. It is built with inline
       styles on plain tables because that is the only thing that survives
       both a stylesheet-less print window and an email client — the
       send-report sanitizer keeps <style> blocks, but Outlook and Gmail
       largely ignore them. Light palette throughout: the board is dark, and
       nobody wants that on paper. */
    function schedReportType() { return schedBoardCfg().reportType; }
    let _schedRepGroups = [];
    // Set by the dispatch sheet's Email button; cleared when the modal opens
    // from the toolbar, so the two never send each other's content.
    let _schedRepSheetMode = false;

    const _RP = {
      wrap:  'font-family:Segoe UI,system-ui,-apple-system,sans-serif;color:#111;font-size:12px',
      h1:    'font-size:17px;font-weight:800;color:#111;margin:0 0 2px',
      sub:   'font-size:11px;color:#666;margin:0 0 14px',
      h2:    'font-size:12px;font-weight:800;color:#111;text-transform:uppercase;letter-spacing:0.06em;margin:16px 0 5px;padding-bottom:3px;border-bottom:1.5px solid #333;page-break-after:avoid;break-after:avoid',
      tbl:   'border-collapse:collapse;width:100%;margin-bottom:4px',
      th:    'text-align:left;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#555;background:#f0f0f0;border:1px solid #ccc;padding:4px 7px',
      td:    'border:1px solid #ddd;padding:4px 7px;font-size:11.5px;vertical-align:top',
      tdT:   'border:1px solid #ddd;padding:4px 7px;font-size:11.5px;white-space:nowrap;font-weight:600',
      // Where the driver is going. `pre-line` keeps the line breaks typed into
      // the address box — a street and a suite stay on their own lines.
      tdA:   'border:1px solid #ddd;padding:4px 7px;font-size:11px;line-height:1.35;vertical-align:top;white-space:pre-line',
      none:  'border:1px solid #ddd;padding:7px;font-size:11px;color:#888;text-align:center',
      open:  'font-size:10.5px;color:#666;margin:3px 0 0;line-height:1.5',
      // Masthead. Mirrors the app header — wordmark in the division red, the
      // division name behind a divider — so a printed sheet is recognisably
      // the same system it came out of.
      mast:  'border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px',
      brand: 'font-size:11.5px;letter-spacing:0.3em;text-transform:uppercase;color:#cc0000;font-weight:800',
      dvsn:  'font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:#777;border-left:1px solid #bbb;margin-left:11px;padding-left:11px',
      subT:  'font-size:11px;color:#666;margin:2px 0 0',
    };

    function schedRepDayLabel(ds) {
      return schedParse(ds).toLocaleDateString('en-US',
        { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }
    function schedRepDayShort(ds) {
      return schedParse(ds).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function schedRepTitle(scope) {
      const head = schedBoardCfg().noun + ' Dispatch — ';
      return scope === 'week'
        ? (() => { const d = schedWeekDates();
            return head + 'Week of ' +
              schedParse(d[0]).toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) +
              '–' + schedParse(d[6]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); })()
        : head + schedRepDayLabel(schedS().anchor);
    }

    function schedRepDates(scope) { return scope === 'week' ? schedWeekDates() : [schedS().anchor]; }

    /** Rows for one date, in run order. */
    function schedRepItems(date) {
      return (schedS().assignments[date] || []).slice().sort((a, b) =>
        String(a.start || '~').localeCompare(String(b.start || '~')) ||
        String(a.driver || '').localeCompare(String(b.driver || '')));
    }

    function schedRepCell(v) { return schedEsc(v) || '<span style="color:#aaa">—</span>'; }

    /** The job a haul is for. Assignments written before divisions existed
     *  carry only a customer, so that is the fallback rather than a blank. */
    function schedJobOf(a) { return (a && (a.project || a.customer)) || ''; }
    function schedDivLabel(k) {
      const d = SCHED_DIVISIONS.find(x => x.key === k);
      return d ? d.label : (k || '');
    }

    /** Layout A — by day. What you pin on the wall. */
    function schedRepByDay(dates) {
      return dates.map(d => {
        const items = schedRepItems(d);
        const clashes = schedConflicts(d);
        const rows  = items.length ? items.map(a => {
          const clash = clashes.ids.get(a.id) || {};
          return `<tr>
            <td style="${_RP.tdT}">${schedEsc(schedTime12(a.start)) || '—'}</td>
            <td style="${_RP.tdT}">${schedEsc(schedTime12(a.end)) || '—'}</td>
            <td style="${_RP.td};font-weight:600">${schedEsc(a.driver)}${
              clash.driver ? ' <span style="color:#b45309;font-weight:700">(double-booked)</span>' : ''}</td>
            <td style="${_RP.td}">${schedRepCell(schedJobOf(a))}${
              a.division ? `<span style="display:block;color:#888;font-size:9px;text-transform:uppercase;letter-spacing:0.05em">${schedEsc(schedDivLabel(a.division))}</span>` : ''}</td>
            <td style="${_RP.tdA}">${schedRepCell(a.address)}</td>
            <td style="${_RP.td}">${schedRepCell(a.material)}</td>
            <td style="${_RP.td}">${schedRepCell(a.unit)}${clash.unit ? ' <span style="color:#b45309;font-weight:700">(overlap)</span>' : ''}${
              unitTypeLabel(a.unit) ? `<span style="display:block;color:#888;font-size:9px">${schedEsc(unitTypeLabel(a.unit))}</span>` : ''}</td>
            <td style="${_RP.td};color:#555">${schedEsc(a.notes)}</td>
          </tr>`;
        }).join('') : `<tr><td style="${_RP.none}" colspan="8">Nothing scheduled.</td></tr>`;

        // Drivers with no hours are listed on purpose — an empty day for
        // someone on the roster is the thing a dispatcher needs to notice.
        const roster = schedDrivers([d]);
        const busy   = new Set(items.map(a => a.driver));
        // Only worth naming when some of the day is staffed. On a day with
        // nothing at all, "Nothing scheduled." already says it, and printing
        // the whole roster under every empty day is what turns a one-page
        // week into four.
        const open   = items.length ? roster.filter(n => !busy.has(n)) : [];

        return `<div style="${_RP.h2}">${schedEsc(schedRepDayLabel(d))}</div>
          <table style="${_RP.tbl}"><thead><tr>
            <th style="${_RP.th};width:58px">Start</th><th style="${_RP.th};width:58px">End</th>
            <th style="${_RP.th};width:108px">Driver</th><th style="${_RP.th};width:130px">Project</th>
            <th style="${_RP.th};width:140px">Address</th>
            <th style="${_RP.th};width:84px">Material</th>
            <th style="${_RP.th};width:72px">Truck</th><th style="${_RP.th}">Notes</th>
          </tr></thead><tbody>${rows}</tbody></table>
          ${open.length ? `<p style="${_RP.open}"><strong>No hauling hours (${open.length}):</strong> ${schedEsc(open.join(' · '))}</p>` : ''}`;
      }).join('');
    }

    /** Layout B — by driver. What you hand each driver. */
    function schedRepByDriver(dates) {
      const roster = schedDrivers(dates);
      const byDriver = new Map(roster.map(n => [n, []]));
      dates.forEach(d => {
        // The sheet a driver is handed is where their own double-booking has
        // to be visible — it is the one they cannot work.
        const clashes = schedConflicts(d);
        schedRepItems(d).forEach(a => {
          if (byDriver.has(a.driver)) byDriver.get(a.driver).push({ ...a, _d: d, _clash: clashes.ids.get(a.id) || {} });
        });
      });

      // Only a driver with work gets a table. An empty one used to get a full
      // bordered table with column headers just to say "none", which on a
      // normal week was fourteen tables of nothing; they are named together at
      // the end instead, the same way the by-day layout does it.
      const working = roster.filter(n => (byDriver.get(n) || []).length);
      const idle    = roster.filter(n => !(byDriver.get(n) || []).length);

      const blocks = working.map(n => {
        const rows = (byDriver.get(n) || []).map(a => `<tr>
            <td style="${_RP.tdT}">${schedEsc(schedRepDayShort(a._d))}</td>
            <td style="${_RP.tdT}">${schedEsc(schedWindow(a)) || '—'}${
              a._clash.driver ? '<span style="display:block;color:#b45309;font-weight:700;font-size:9px">double-booked</span>' : ''}</td>
            <td style="${_RP.td}">${schedRepCell(schedJobOf(a))}${
              a.division ? `<span style="display:block;color:#888;font-size:9px;text-transform:uppercase;letter-spacing:0.05em">${schedEsc(schedDivLabel(a.division))}</span>` : ''}</td>
            <td style="${_RP.tdA}">${schedRepCell(a.address)}</td>
            <td style="${_RP.td}">${schedRepCell(a.material)}</td>
            <td style="${_RP.td}">${schedRepCell(a.unit)}${
              a._clash.unit ? ' <span style="color:#b45309;font-weight:700">(overlap)</span>' : ''}${
              unitTypeLabel(a.unit) ? `<span style="display:block;color:#888;font-size:9px">${schedEsc(unitTypeLabel(a.unit))}</span>` : ''}</td>
            <td style="${_RP.td};color:#555">${schedEsc(a.notes)}</td>
          </tr>`).join('');
        return `<div style="${_RP.h2}">${schedEsc(n)}</div>
          <table style="${_RP.tbl}"><thead><tr>
            <th style="${_RP.th};width:90px">Day</th><th style="${_RP.th};width:110px">Hours</th>
            <th style="${_RP.th};width:136px">Project</th><th style="${_RP.th};width:140px">Address</th>
            <th style="${_RP.th};width:84px">Material</th>
            <th style="${_RP.th};width:72px">Truck</th>
            <th style="${_RP.th}">Notes</th>
          </tr></thead><tbody>${rows}</tbody></table>`;
      }).join('');

      const span = dates.length > 1 ? 'this week' : 'this day';
      const tail = idle.length
        ? `<div style="${_RP.h2}">No hauling hours ${schedEsc(span)} (${idle.length})</div>
           <p style="${_RP.open}">${schedEsc(idle.join(' · '))}</p>`
        : '';
      const none = working.length ? '' :
        `<p style="${_RP.none};margin-top:10px">Nothing scheduled ${schedEsc(span)}.</p>`;
      return blocks + none + tail;
    }

    function schedRepBody(scope, layout) {
      const dates  = schedRepDates(scope);
      const total  = dates.reduce((n, d) => n + (schedS().assignments[d] || []).length, 0);
      const busy   = new Set();
      dates.forEach(d => (schedS().assignments[d] || []).forEach(a => busy.add(a.driver)));
      const roster = schedDrivers(dates);
      const clash  = dates.reduce((acc, d) => {
        const c = schedConflicts(d);
        c.drivers.forEach(v => acc.drivers.add(d + '|' + v));
        c.units.forEach(v => acc.units.add(d + '|' + v));
        return acc;
      }, { drivers: new Set(), units: new Set() });

      const summary = `<p style="${_RP.sub}">
        ${total} assignment${total === 1 ? '' : 's'} ·
        ${busy.size} of ${roster.length} driver${roster.length === 1 ? '' : 's'} with hauling hours
        ${clash.drivers.size ? ` · <strong style="color:#b45309">${clash.drivers.size} driver${
          clash.drivers.size === 1 ? '' : 's'} double-booked</strong>` : ''}
        ${clash.units.size ? ` · <strong style="color:#b45309">${clash.units.size} truck overlap${
          clash.units.size === 1 ? '' : 's'}</strong>` : ''}
      </p>`;

      return summary + (layout === 'driver' ? schedRepByDriver(dates) : schedRepByDay(dates));
    }

    function schedRepHasWork(scope) {
      return schedRepDates(scope).some(d => (schedS().assignments[d] || []).length);
    }

    /* ── Modal ── */
    function schedOpenPlanReport() { _schedRepSheetMode = false; schedOpenReport(); }

    async function schedOpenReport() {
      const scope = schedS().view === 'week' ? 'week' : 'day';
      const sheet = _schedRepSheetMode;
      document.getElementById('sched-rep-body').innerHTML = `
        ${sheet ? `
        <input type="hidden" id="sched-rep-scope" value="day">
        <input type="hidden" id="sched-rep-layout" value="day">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:6px;
                    padding:0.6rem 0.7rem;margin-bottom:0.9rem;font-size:0.78rem">
          <strong>${schedEsc(schedSheetTitle(schedS().anchor))}</strong>
          <span style="display:block;color:var(--muted);font-size:0.7rem;margin-top:0.15rem">
            The full sheet, reported figures included.</span>
        </div>` : `
        <div class="sch-fld">
          <label for="sched-rep-scope">Range</label>
          <select id="sched-rep-scope" onchange="schedRepPreviewNote()">
            <option value="day"${scope === 'day' ? ' selected' : ''}>This day — ${schedEsc(schedRepDayLabel(schedS().anchor))}</option>
            <option value="week"${scope === 'week' ? ' selected' : ''}>This week</option>
          </select>
        </div>
        <div class="sch-fld">
          <label for="sched-rep-layout">Layout</label>
          <select id="sched-rep-layout" onchange="schedRepPreviewNote()">
            <option value="day">By day — one table per date</option>
            <option value="driver">By driver — one table per driver</option>
          </select>
        </div>
        <div id="sched-rep-note" style="font-size:0.68rem;color:var(--muted);margin:-0.2rem 0 0.8rem"></div>`}
        <button class="sch-btn" style="width:100%" onclick="${sheet ? 'schedSheetPrint()' : 'schedPrintReport()'}">Open print view — print or save as PDF</button>

        <div style="border-top:1px solid var(--border);margin:1rem 0 0.9rem"></div>
        <div style="font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:0.6rem">Email it out</div>
        <div class="sch-fld">
          <label for="sched-rep-group">Saved distribution list</label>
          <select id="sched-rep-group"><option value="">Loading…</option></select>
        </div>
        <div class="sch-fld">
          <label for="sched-rep-emails">Additional emails</label>
          <input type="text" id="sched-rep-emails" autocomplete="off" placeholder="dispatch@…, foreman@…">
        </div>
        <div class="sch-fld">
          <label for="sched-rep-msg">Note (optional)</label>
          <textarea id="sched-rep-msg" placeholder="e.g. Updated plan — check your trucks before 6."></textarea>
        </div>
        <label style="display:flex;align-items:flex-start;gap:0.5rem;margin:0.1rem 0 0.7rem;cursor:pointer">
          <input type="checkbox" id="sched-rep-pdf" checked style="margin-top:0.15rem;cursor:pointer">
          <span>
            <span style="display:block;font-size:0.78rem;font-weight:600">Attach the schedule as a PDF</span>
            <span style="display:block;font-size:0.68rem;color:var(--muted);margin-top:0.1rem">Reads the same on every device. Uncheck to put the schedule in the email body instead.</span>
          </span>
        </label>
        <div class="sch-modal-err" id="sched-rep-result"></div>
        <div class="sch-modal-actions">
          <button class="sch-btn primary" id="sched-rep-send" onclick="schedEmailReport()">Send email</button>
          <button class="sch-btn" onclick="schedCloseReport()">Close</button>
        </div>`;
      document.getElementById('sched-rep-backdrop').classList.add('open');
      schedRepPreviewNote();

      try {
        const r = await fetch(`${API_BASE}/email/recipient-groups?report_type=${schedReportType()}`,
          { headers: { 'Authorization': `Bearer ${token}` } });
        _schedRepGroups = r.ok ? ((await r.json()).groups || []) : [];
      } catch { _schedRepGroups = []; }
      const sel = document.getElementById('sched-rep-group');
      if (sel) sel.innerHTML = '<option value="">— none —</option>' +
        _schedRepGroups.map(g => `<option value="${schedEsc(g.id)}">${schedEsc(g.name)} (${(g.emails || []).length})</option>`).join('');
    }

    function schedCloseReport(e) {
      if (e && document.getElementById('sched-rep-modal').contains(e.target)) return;
      document.getElementById('sched-rep-backdrop').classList.remove('open');
    }

    function schedRepPreviewNote() {
      const el = document.getElementById('sched-rep-note');
      if (!el) return;   // absent in sheet mode, which states its own scope
      const scope = (document.getElementById('sched-rep-scope') || {}).value || 'day';
      const dates = schedRepDates(scope);
      const total = dates.reduce((n, d) => n + (schedS().assignments[d] || []).length, 0);
      el.textContent = total
        ? `${total} assignment${total === 1 ? '' : 's'} across ${dates.length} day${dates.length === 1 ? '' : 's'}.`
        : 'Nothing scheduled in this range yet.';
    }

    function schedRepShell(title, body) {
      const ts = new Date().toLocaleString('en-US',
        { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      const co = (user && (user.companyName || user.companyCode)) || 'Force Corp';
      return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${schedEsc(title)}</title>
        <style>@page{margin:14mm}body{margin:0}
        /* Never split a day or a driver across a page break mid-table. */
        table{page-break-inside:auto}tr{page-break-inside:avoid}thead{display:table-header-group}</style>
        </head><body style="${_RP.wrap};padding:18px">
        <div style="${_RP.mast}">
          <div style="margin-bottom:5px">
            <span style="${_RP.brand}">DataWatch</span><span style="${_RP.dvsn}">Trucking</span>
          </div>
          <div style="${_RP.h1}">${schedEsc(title)}</div>
          <div style="${_RP.subT}">${schedEsc(co)} · Generated ${schedEsc(ts)}</div>
        </div>
        ${body}</body></html>`;
    }

    function schedPrintReport() {
      const scope  = document.getElementById('sched-rep-scope').value;
      const layout = document.getElementById('sched-rep-layout').value;
      const result = document.getElementById('sched-rep-result');
      const w = window.open('', '_blank');
      if (!w) { result.textContent = 'Allow pop-ups for this site to open the print view.'; return; }
      result.textContent = '';
      dwWrite(w, schedRepShell(schedRepTitle(scope), schedRepBody(scope, layout)));
      w.document.close();
      w.focus();
      setTimeout(() => { try { w.print(); } catch { /* the user can still print manually */ } }, 350);
    }

    function schedParseEmails(s) {
      return String(s || '').split(/[,;\s]+/).map(x => x.trim()).filter(Boolean);
    }

    async function schedEmailReport() {
      const result = document.getElementById('sched-rep-result');
      const btn    = document.getElementById('sched-rep-send');
      const scope  = document.getElementById('sched-rep-scope').value;
      const layout = document.getElementById('sched-rep-layout').value;

      let to = [];
      const gid = document.getElementById('sched-rep-group').value;
      if (gid) {
        const g = _schedRepGroups.find(x => String(x.id) === String(gid));
        if (g) to = to.concat(g.emails || []);
      }
      to = [...new Set(to.concat(schedParseEmails(document.getElementById('sched-rep-emails').value))
        .map(e => e.toLowerCase()))];

      result.style.color = '';
      if (!to.length) { result.textContent = 'Pick a saved list or type at least one email address.'; return; }
      const hasWork = _schedRepSheetMode
        ? schedRepItems(schedS().anchor).length > 0
        : schedRepHasWork(scope);
      if (!hasWork) { result.textContent = 'Nothing scheduled in this range to send.'; return; }

      const attachPdf = !!(document.getElementById('sched-rep-pdf') || {}).checked;
      btn.disabled = true;
      result.style.color = 'var(--muted)';
      // Chrome has to boot and lay the schedule out, which on a cold
      // serverless container is a few seconds — say so rather than look hung.
      result.textContent = attachPdf ? 'Rendering PDF and sending…' : 'Sending…';
      try {
        const r = await fetch(`${API_BASE}/email/send-report`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({
            report_type: schedReportType(),
            subject:     _schedRepSheetMode ? schedSheetTitle(schedS().anchor) : schedRepTitle(scope),
            note:        document.getElementById('sched-rep-msg').value || '',
            recipients:  to,
            // Stamp the DataWatch header, same as the print path and the shared
            // email modal — this board rolls its own send rather than using
            // report-email.js.
            html:        (window.dwBrand || String)(
              _schedRepSheetMode ? schedSheetHTML(schedS().anchor) : schedRepBody(scope, layout)),
            attach_pdf:  attachPdf,
          }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
        const who = (j.recipientCount || to.length) + ' recipient(s)';
        if (j.warning) {
          // It went out, just not as a PDF — say so rather than claiming success.
          result.style.color = 'var(--orange)';
          result.textContent = 'Sent to ' + who + '. ' + j.warning;
        } else {
          result.style.color = 'var(--green)';
          result.textContent = '✓ Sent to ' + who + '.'
            + (j.pdfAttached
                ? ' PDF attached' + (j.pdfPages ? ' (' + j.pdfPages + ' page' + (j.pdfPages === 1 ? '' : 's') + ')' : '') + '.'
                : '');
        }
      } catch (err) {
        result.style.color = 'var(--orange)';
        result.textContent = 'Could not send: ' + (err.message || 'unknown error');
      } finally {
        btn.disabled = false;
      }
    }

    /* ═══════ Driver picker ═══════
       Which drivers the board shows. A name only reaches the managed drivers
       list by being typed there or by appearing on a stored entry, and the
       loader re-seeds it from entries every time — so office usernames that
       came in on a timesheet cannot be removed from the list, only hidden
       from this board. */
    function schedOpenPicker() {
      schedS().pickQuery = '';
      schedRenderPicker();
      document.getElementById('sched-pick-backdrop').classList.add('open');
      const q = document.getElementById('sched-pick-search');
      if (q) q.focus();
    }

    function schedClosePicker(e) {
      if (e && document.getElementById('sched-pick-modal').contains(e.target)) return;
      document.getElementById('sched-pick-backdrop').classList.remove('open');
    }

    function schedRenderPicker() {
      const all    = schedAllDrivers();
      const totals = schedTotalsByDriver();
      const q      = schedS().pickQuery.trim().toLowerCase();
      const rows   = all.filter(n => !q || n.toLowerCase().includes(q));
      const shown  = all.filter(n => !schedS().hidden.has(n)).length;

      const list = rows.length ? rows.map(n => {
        const i = all.indexOf(n);
        const c = totals.get(n) || 0;
        return `
          <label class="sch-pick-row" title="${schedEsc(n)}">
            <input type="checkbox" ${schedS().hidden.has(n) ? '' : 'checked'} onchange="schedTogglePick(${i})">
            <span class="nm">${schedEsc(n)}</span>
            ${c ? `<span class="ct" title="${c} assignment${c === 1 ? '' : 's'} on the board">${c}</span>` : ''}
          </label>`;
      }).join('')
        : `<div style="padding:1rem;text-align:center;color:var(--muted);font-size:0.78rem">No driver matches “${schedEsc(schedS().pickQuery)}”.</div>`;

      document.getElementById('sched-pick-body').innerHTML = `
        <div class="sch-fld" style="margin-bottom:0.5rem">
          <input type="text" id="sched-pick-search" placeholder="Filter drivers…" autocomplete="off"
                 value="${schedEsc(schedS().pickQuery)}" oninput="schedPickSearch(this.value)">
        </div>
        <div class="sch-pick-bulk">
          <button class="sch-btn" onclick="schedPickAll(true)">Show all</button>
          <button class="sch-btn" onclick="schedPickAll(false)">Hide all</button>
          <span style="flex:1"></span>
          <span style="font-size:0.68rem;color:var(--muted)">${shown} of ${all.length} shown</span>
        </div>
        <div class="sch-pick-list">${list}</div>
        <p style="font-size:0.66rem;color:var(--muted);margin-top:0.6rem;line-height:1.45">
          Hiding only affects this board — the driver stays in Truck Tracking and keeps any
          history. Anyone holding an assignment still appears on the days they are scheduled.
        </p>
        <div class="sch-modal-actions">
          <button class="sch-btn primary" onclick="schedClosePicker()">Done</button>
        </div>`;
    }

    function schedPickSearch(v) {
      schedS().pickQuery = v;
      schedRenderPicker();
      // innerHTML was replaced, so the box the user is typing in is a new node.
      const q = document.getElementById('sched-pick-search');
      if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }

    // Toggled by roster index rather than by name — a driver called
    // O'Neil, D. would otherwise have to survive quoting into an attribute.
    function schedTogglePick(i) {
      const name = schedAllDrivers()[i];
      if (!name) return;
      if (schedS().hidden.has(name)) schedS().hidden.delete(name); else schedS().hidden.add(name);
      schedMarkDirty();
      schedRenderPicker();
      renderScheduler();
    }

    function schedPickAll(show) {
      const all = schedAllDrivers();
      const q   = schedS().pickQuery.trim().toLowerCase();
      // Applies to what the search is showing, so "hide all" after a search
      // hides that subset rather than the whole roster.
      all.filter(n => !q || n.toLowerCase().includes(q))
         .forEach(n => { if (show) schedS().hidden.delete(n); else schedS().hidden.add(n); });
      schedMarkDirty();
      schedRenderPicker();
      renderScheduler();
    }


    /* ═══════ Divisions and their jobs ═══════
       A driver hauls for whichever division has work, so an assignment names
       the division first and then a job inside it. The jobs come from
       /api/timesheet-jobs, the same picker the Timesheet field form uses —
       one definition of "which jobs are live", already carrying the project
       number in its label, rather than a second list to keep in step.

       Trucking's own entry there is its customer roster, so picking Trucking
       gives the customer list this tab has always had. */
    const SCHED_DIVISIONS = [
      { key: 'turf',     label: 'Turf'          },
      { key: 'paving',   label: 'Paving'        },
      { key: 'kiewit',   label: 'Kiewit'        },
      { key: 'dust',     label: 'EES'           },
      { key: 'trucking', label: 'Trucking'      },
      { key: 'quarry',   label: 'Quarry'        },
    ];
    const schedJobsCache = new Map();   // division → [{id,label}]
    const schedJobsErr   = new Map();   // division → error text

    async function schedLoadJobs(division) {
      if (!division) return [];
      if (schedJobsCache.has(division)) return schedJobsCache.get(division);
      try {
        const r = await fetch(`${API_BASE}/timesheet-jobs?division=${encodeURIComponent(division)}`,
          { headers: { 'Authorization': `Bearer ${token}` } });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        const jobs = Array.isArray(j.jobs) ? j.jobs : [];
        schedJobsCache.set(division, jobs);
        schedJobsErr.delete(division);
        return jobs;
      } catch (err) {
        schedJobsErr.set(division, err.message || 'could not load');
        return [];
      }
    }

    /** Fill the Project select for the chosen division.
     *  `keep` is the project already on the assignment: a job that has since
     *  closed drops off the live list, and blanking the field would quietly
     *  rewrite what the assignment said. It is re-added instead, marked. */
    async function schedFillProjects(division, keepId, keepLabel) {
      const sel = document.getElementById('sched-f-project');
      if (!sel) return;
      if (!division) {
        sel.innerHTML = '<option value="">— pick a division first —</option>';
        sel.disabled = true;
        return;
      }
      sel.disabled = true;
      sel.innerHTML = '<option value="">Loading…</option>';
      const jobs = await schedLoadJobs(division);
      // The editor may have been closed or switched while this was in flight.
      const now = document.getElementById('sched-f-project');
      if (!now || now !== sel) return;
      const cur = document.getElementById('sched-f-division');
      if (cur && cur.value !== division) return;

      const known = jobs.some(j => String(j.id) === String(keepId) || j.label === keepLabel);
      const extra = (!known && (keepId || keepLabel))
        ? `<option value="${schedEsc(keepId || keepLabel)}" data-label="${schedEsc(keepLabel || '')}" selected>${schedEsc(keepLabel || keepId)} (closed)</option>`
        : '';
      const err = schedJobsErr.get(division);
      sel.disabled = false;
      sel.innerHTML =
        `<option value="">${err ? '— could not load jobs —' : '— select —'}</option>` +
        extra +
        jobs.map(j => `<option value="${schedEsc(j.id)}" data-label="${schedEsc(j.label)}"${
          String(j.id) === String(keepId) || j.label === keepLabel ? ' selected' : ''
        }>${schedEsc(j.label)}</option>`).join('');
    }

    function schedOnDivisionChange() {
      const d = document.getElementById('sched-f-division');
      schedFillProjects(d ? d.value : '', '', '');
    }

    /** The label is what everything downstream reads — the board, the printed
     *  sheet, the driver's phone — so it is stored alongside the id rather
     *  than re-resolved later against a list that will have moved on. */
    function schedProjectLabel() {
      const sel = document.getElementById('sched-f-project');
      if (!sel || !sel.selectedIndex) return '';
      const opt = sel.options[sel.selectedIndex];
      return (opt && (opt.dataset.label || opt.textContent.replace(/ \(closed\)$/, ''))) || '';
    }

    /* ═══════ Assignment editor ═══════
       Driver is passed by roster index rather than by name so a name carrying
       a quote or an ampersand can't break out of the inline handler. */
    function schedAddAssign(date, driverIdx, startHint) {
      const roster = schedDrivers(schedS().view === 'week' ? schedWeekDates() : [date]);
      const driver = driverIdx >= 0 ? (roster[driverIdx] || '') : '';
      schedOpenEditor(date, null, driver, startHint);
    }
    function schedEditAssign(date, id) { schedOpenEditor(date, id, ''); }

    function schedOpenEditor(date, id, driverHint, startHint) {
      const a = id ? (schedS().assignments[date] || []).find(x => x.id === id) : null;
      if (id && !a) return;
      schedCtx = { board: schedBoard, date, id: id || null };

      // Hidden drivers stay out of the picker list, except the one already on
      // the assignment being edited — it must remain selectable to be saved.
      const roster    = schedDrivers([date]).filter(n => !schedS().hidden.has(n) || (a && n === a.driver));
      const driver    = a ? a.driver : driverHint;
      const customers = (divTruckLists.customers || []).filter(Boolean);
      const locs      = (divTruckLists.locations || []).filter(l => l && l.name);
      const materials = (divTruckLists.materials || []).filter(Boolean);
      // An assignment made before divisions existed carries only a customer,
      // and trucking's job list IS the customer roster — so it opens on
      // Trucking with that customer still selectable rather than blank.
      const curDivision = a ? (a.division || (a.customer ? 'trucking' : '')) : '';
      const units     = (divTruckLists.units || []).map(u => u && u.name).filter(Boolean);
      const opts      = [...new Set([...roster, driver].filter(Boolean))]
        .sort((x, y) => String(x).localeCompare(String(y)));

      document.getElementById('sched-modal-title').textContent = a ? 'Edit assignment' : 'New assignment';
      document.getElementById('sched-modal-body').innerHTML = `
        <div class="sch-fld" style="max-width:190px">
          <label for="sched-f-date">Date</label>
          <input type="date" id="sched-f-date" value="${schedEsc(date)}">
        </div>
        <div class="sch-fld-row">
          <div class="sch-fld">
            <label for="sched-f-start">Start</label>
            <input type="time" id="sched-f-start" value="${schedEsc(a ? (a.start || '') : (startHint || ''))}">
          </div>
          <div class="sch-fld">
            <label for="sched-f-end">End</label>
            <input type="time" id="sched-f-end" value="${schedEsc(a ? (a.end || '') : '')}">
          </div>
        </div>
        <div class="sch-fld">
          <label for="sched-f-driver">Driver</label>
          <select id="sched-f-driver">
            <option value="">— select —</option>
            ${opts.map(d => `<option value="${schedEsc(d)}"${d === driver ? ' selected' : ''}>${schedEsc(d)}</option>`).join('')}
          </select>
        </div>
        <div class="sch-fld">
          <label for="sched-f-division">Division</label>
          <select id="sched-f-division" onchange="schedOnDivisionChange()">
            <option value="">— select —</option>
            ${SCHED_DIVISIONS.map(d => `<option value="${d.key}"${d.key === curDivision ? ' selected' : ''}>${d.label}</option>`).join('')}
          </select>
        </div>
        <div class="sch-fld">
          <label for="sched-f-project">Project / job</label>
          <select id="sched-f-project" disabled>
            <option value="">— pick a division first —</option>
          </select>
        </div>
        <div class="sch-fld">
          <label for="sched-f-location">Location</label>
          <select id="sched-f-location" onchange="schedPickLocation()">
            <option value="">— none / type an address below —</option>
            ${locs.map(l => `<option value="${schedEsc(l.name)}"${a && a.location === l.name ? ' selected' : ''}>${schedEsc(l.name)}</option>`).join('')}
          </select>
        </div>
        <div class="sch-fld">
          <label for="sched-f-address">Address</label>
          <textarea id="sched-f-address" style="min-height:44px"
            placeholder="Street, city — where the driver is going">${schedEsc(a ? (a.address || '') : '')}</textarea>
        </div>
        <div class="sch-fld">
          <label for="sched-f-unit">Truck / unit</label>
          <input type="text" id="sched-f-unit" list="sched-dl-units" autocomplete="off"
                 placeholder="Unit" value="${schedEsc(a ? (a.unit || '') : '')}">
          <!-- The type rides along in the option's label: a list of unit numbers
               says nothing about which of them is the lowboy. -->
          <datalist id="sched-dl-units">${units.map(u =>
            `<option value="${schedEsc(u)}">${schedEsc(unitTypeLabel(u))}</option>`).join('')}</datalist>
        </div>
        <div class="sch-fld">
          <label for="sched-f-material">Material</label>
          <input type="text" id="sched-f-material" list="sched-dl-materials" autocomplete="off"
                 placeholder="What is being hauled" value="${schedEsc(a ? (a.material || '') : '')}">
          <datalist id="sched-dl-materials">${materials.map(m => `<option value="${schedEsc(m)}"></option>`).join('')}</datalist>
        </div>
        <div class="sch-fld">
          <label for="sched-f-notes">Load / notes</label>
          <textarea id="sched-f-notes" placeholder="Material, origin → destination, instructions…">${schedEsc(a ? (a.notes || '') : '')}</textarea>
        </div>
        <div class="sch-modal-err" id="sched-modal-err"></div>
        <div class="sch-modal-actions">
          <button class="sch-btn primary" onclick="schedSaveEditor()">${a ? 'Save' : 'Add'}</button>
          <button class="sch-btn" onclick="schedCloseEditor()">Cancel</button>
          <span style="flex:1"></span>
          ${a ? `<button class="sch-btn danger" onclick="schedDeleteEditor()">Delete</button>` : ''}
        </div>`;

      document.getElementById('sched-backdrop').classList.add('open');
      schedFillProjects(curDivision, a ? (a.project_id || '') : '',
        a ? (a.project || a.customer || '') : '');
      const focusEl = driver ? document.getElementById('sched-f-division') : document.getElementById('sched-f-driver');
      if (focusEl) focusEl.focus();
    }

    /** Picking a saved location fills the address in. It stays editable —
     *  a one-off delivery still needs somewhere to type. */
    function schedPickLocation() {
      const sel  = document.getElementById('sched-f-location');
      const addr = document.getElementById('sched-f-address');
      if (!sel || !addr) return;
      const hit = (divTruckLists.locations || []).find(l => l && l.name === sel.value);
      if (hit) addr.value = hit.address || '';
    }

    function schedCloseEditor(e) {
      if (e && document.getElementById('sched-modal').contains(e.target)) return;
      document.getElementById('sched-backdrop').classList.remove('open');
      schedCtx = null;
    }

    function schedSaveEditor() {
      if (!schedCtx) return;
      // The board the editor was opened from, not whichever is showing now —
      // switching sub-tabs closes it, so these agree, and saying so here is
      // what keeps them agreeing.
      const st   = schedS(schedCtx.board);
      const v    = id => (document.getElementById(id) || {}).value || '';
      const err  = document.getElementById('sched-modal-err');
      const date = v('sched-f-date').trim();
      const driver = v('sched-f-driver').trim();
      if (!driver)              { if (err) err.textContent = 'Pick a driver.'; return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { if (err) err.textContent = 'Pick a valid date.'; return; }

      const prevRec  = schedCtx.id
        ? (st.assignments[schedCtx.date] || []).find(x => x.id === schedCtx.id)
        : null;
      const projLabel = schedProjectLabel();

      const rec = {
        id:       schedCtx.id || (crypto.randomUUID ? crypto.randomUUID() : 'sa-' + Date.now() + '-' + Math.random().toString(36).slice(2)),
        driver,
        division:   v('sched-f-division').trim(),
        project_id: v('sched-f-project').trim(),
        project:    projLabel,
        material:   v('sched-f-material').trim(),
        // Everything written before divisions existed reads `customer`, so it
        // is kept in step with the project label. Falls back to whatever the
        // row already said rather than blanking it — an edit that never opened
        // the project picker must not quietly erase the job.
        customer:   projLabel || (prevRec ? (prevRec.customer || '') : ''),
        unit:     v('sched-f-unit').trim(),
        location: v('sched-f-location').trim(),
        address:  v('sched-f-address').trim(),
        start:    v('sched-f-start').trim(),
        end:      v('sched-f-end').trim(),
        notes:    v('sched-f-notes').trim(),
      };
      // Remove first, then re-add: the date field is editable, so an edit can
      // move the assignment to a different day's list.
      if (schedCtx.id) schedRemoveById(schedCtx.date, schedCtx.id, schedCtx.board);
      (st.assignments[date] = st.assignments[date] || []).push(rec);

      schedMarkDirty(schedCtx.board);
      schedCloseEditor();
      renderScheduler();
    }

    function schedDeleteEditor() {
      if (!schedCtx || !schedCtx.id) return;
      schedRemoveById(schedCtx.date, schedCtx.id, schedCtx.board);
      schedMarkDirty(schedCtx.board);
      schedCloseEditor();
      renderScheduler();
    }

    function schedRemoveById(date, id, board) {
      const st   = schedS(board);
      const list = st.assignments[date];
      if (!list) return;
      const next = list.filter(a => a.id !== id);
      if (next.length) st.assignments[date] = next;
      else delete st.assignments[date];   // keep the blob free of empty days
    }


    /* ═══════════════════════════════════════════
       SCHEDULER RECORDS — the archive behind the boards

       The two boards answer "what is running this week". This answers "what
       did we run", which is a different question and a different shape: one
       flat table of every assignment either board has ever carried, over a
       date range you choose, filterable column by column and downloadable as
       a workbook the office can pivot.

       It reads the same two blobs the boards save to — nothing is copied into
       a third store that could drift out of step with them — joined to the
       driver reports for the range so plan and actual sit on one line. A
       report whose assignment has since been deleted is still a record of
       work someone did, so it is carried too, marked "Report only" rather
       than quietly dropped out of the record.

       Read-only throughout. Pulling records must never be able to change what
       is on a board.
    ═══════════════════════════════════════════ */

    /** The columns, once. The table, the filter boxes, the sort and the
     *  workbook are all built from this list, so the screen and the download
     *  can never disagree about what a record says.
     *    type — how the value sorts, and how the workbook types the cell
     *    dp   — decimal places for a number
     *    f    — carries a filter box in the header
     *    w    — column width in the workbook */
    const SCHED_REC_COLS = [
      { key: 'board',       label: 'Board',          w: 12,              px: 88  },
      { key: 'date',        label: 'Date',           w: 12, type: 'date', px: 100, f: 1 },
      { key: 'dow',         label: 'Day',            w: 7,               f: 1 },
      { key: 'driver',      label: 'Driver',         w: 20,              px: 160, f: 1 },
      { key: 'division',    label: 'Division',       w: 13,              f: 1 },
      { key: 'project',     label: 'Project / Job',  w: 34,              f: 1 },
      { key: 'location',    label: 'Location',       w: 20,              f: 1 },
      { key: 'address',     label: 'Address',        w: 32,              f: 1 },
      { key: 'material',    label: 'Material',       w: 18,              f: 1 },
      { key: 'unit',        label: 'Truck',          w: 14,              f: 1 },
      { key: 'unitType',    label: 'Truck Type',     w: 16,              f: 1 },
      { key: 'start',       label: 'Sched Start',    w: 11, type: 'time' },
      { key: 'end',         label: 'Sched End',      w: 11, type: 'time' },
      { key: 'planHrs',     label: 'Sched Hrs',      w: 10, type: 'num', dp: 2 },
      { key: 'actStart',    label: 'Act. Start',     w: 11, type: 'time' },
      { key: 'actEnd',      label: 'Act. End',       w: 11, type: 'time' },
      { key: 'actHrs',      label: 'Act. Hrs',       w: 10, type: 'num', dp: 2 },
      { key: 'tons',        label: 'Tons',           w: 10, type: 'num', dp: 2 },
      { key: 'loads',       label: 'Loads',          w: 9,  type: 'num', dp: 0 },
      { key: 'tph',         label: 'Tons / Hr',      w: 11, type: 'num', dp: 2 },
      { key: 'tickets',     label: 'Tickets',        w: 18,              f: 1 },
      { key: 'notes',       label: 'Dispatch Notes', w: 34,              f: 1 },
      { key: 'driverNotes', label: 'Driver Notes',   w: 34,              f: 1 },
      { key: 'status',      label: 'Status',         w: 13               },
      { key: 'id',          label: 'Record ID',      w: 38,              f: 1 },
    ];

    const SCHED_REC_STATUSES = ['Planned', 'Reported', 'Report only'];

    /* The columns pinned to the left edge, in order from it. They carry a `px`
       width because a sticky column has to be told where it starts, and that
       offset is the sum of the ones before it. Day is deliberately not among
       them: three columns is already 350px of a scrolling table. */
    const SCHED_REC_STUCK = ['board', 'date', 'driver'];

    /* Worked out once. Both of these are read for every cell of every row —
       twenty-five times a row, hundreds of rows, on every keystroke — and a
       linear scan of the column list in there is the difference between a
       table that keeps up with typing and one that does not. */
    const SCHED_REC_BY_KEY = SCHED_REC_COLS.reduce((m, c) => { m[c.key] = c; return m; },
      Object.create(null));   // no prototype, so an odd key cannot answer with Object's
    const SCHED_REC_STICK = (() => {
      const out = {};
      let left = 0;
      SCHED_REC_STUCK.forEach((key, i) => {
        const px = (SCHED_REC_BY_KEY[key] || {}).px || 0;
        out[key] = {
          cls: 'stk' + (i === SCHED_REC_STUCK.length - 1 ? ' stk-edge' : ''),
          style: `left:${left}px;width:${px}px;min-width:${px}px;max-width:${px}px`,
        };
        left += px;
      });
      return out;
    })();
    const SCHED_REC_LOOSE = { cls: '', style: '' };

    /** The style and class a pinned column needs, or neither for the rest. */
    function schedRecStick(key) { return SCHED_REC_STICK[key] || SCHED_REC_LOOSE; }

    /* Driver reports are fetched a window at a time: the endpoint clamps any
       range longer than 400 days, so a multi-year pull is chunked rather than
       silently answered with the first year of it. */
    const SCHED_REC_CHUNK    = 366;
    const SCHED_REC_MAX_PULL = 24;    // chunks in one pull — a runaway backstop
    const SCHED_REC_DRAW     = 750;   // rows drawn before "show all" is offered

    const schedRec = {
      from: '', to: '', preset: '30',
      board: 'all', status: 'all', q: '',
      col:  {},                       // column key → filter text
      sort: { key: 'date', dir: 'desc' },
      reports:        new Map(),      // assignment id → driver report
      reportsRange:   '',             // the range `reports` covers
      reportsLoading: '',             // the range in flight, '' when idle
      reportsErr:     null,
      reportsErrRange: '',            // the range that failed — not retried on its own
      reportsShort:   '',             // last day actually pulled, when the pull ran out of chunks
      showAll: false,
    };

    /** Decimal hours between two HH:MM times as a number, or '' when either is
     *  missing. An end at or before the start reads as running past midnight,
     *  the same rule schedHoursBetween uses on the dispatch sheet — a night
     *  haul from 10p to 6a is eight hours on both. */
    function schedRecHours(start, end) {
      const s0 = schedMins(start), e0 = schedMins(end);
      if (s0 === null || e0 === null) return '';
      const mins = e0 > s0 ? e0 - s0 : (e0 + 1440) - s0;
      return Math.round(mins / 60 * 100) / 100;
    }

    /** Tons an hour, to two places — the production rate the office reads off
     *  a haul. Blank unless both figures are there and the hours are real: a
     *  rate over zero hours is a division by zero dressed up as a number. */
    function schedRecRate(qty, hours) {
      if (qty === '' || hours === '' || !(hours > 0)) return '';
      return Math.round((Number(qty) / Number(hours)) * 100) / 100;
    }

    /* ── Range ── */

    const SCHED_REC_PRESETS = [
      { key: '7',      label: 'Last 7 days'  },
      { key: '30',     label: 'Last 30 days' },
      { key: '90',     label: 'Last 90 days' },
      { key: 'mtd',    label: 'This month'   },
      { key: 'lastm',  label: 'Last month'   },
      { key: 'qtd',    label: 'This quarter' },
      { key: 'ytd',    label: 'This year'    },
      { key: 'all',    label: 'All time'     },
      { key: 'custom', label: 'Custom'       },
    ];

    /** The earliest and latest date either board holds anything on. Both null
     *  when nothing is scheduled at all. */
    function schedRecSpan() {
      let lo = null, hi = null;
      SCHED_BOARDS.forEach(cfg => {
        const st = _schedStates[cfg.id];
        if (!st) return;
        Object.keys(st.assignments || {}).forEach(d => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !(st.assignments[d] || []).length) return;
          if (lo === null || d < lo) lo = d;
          if (hi === null || d > hi) hi = d;
        });
      });
      return { lo, hi };
    }

    function schedRecApplyPreset(key) {
      const today = schedTodayStr();
      const d = schedParse(today);
      let from = today, to = today;
      switch (key) {
        case '7':   from = schedAddDays(today, -6);  break;
        case '30':  from = schedAddDays(today, -29); break;
        case '90':  from = schedAddDays(today, -89); break;
        case 'mtd': from = schedStr(new Date(d.getFullYear(), d.getMonth(), 1)); break;
        case 'lastm':
          from = schedStr(new Date(d.getFullYear(), d.getMonth() - 1, 1));
          to   = schedStr(new Date(d.getFullYear(), d.getMonth(), 0));
          break;
        case 'qtd': from = schedStr(new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1)); break;
        case 'ytd': from = schedStr(new Date(d.getFullYear(), 0, 1)); break;
        case 'all': {
          // Bounded by what is actually on the boards, so "all time" is a real
          // range to fetch reports for rather than an open-ended one. Work is
          // scheduled ahead, so the end runs past today when the boards do.
          const span = schedRecSpan();
          from = span.lo || schedAddDays(today, -365);
          to   = span.hi && span.hi > today ? span.hi : today;
          if (from > to) to = from;
          break;
        }
        default: return;   // 'custom' — the dates stay as typed
      }
      schedRec.preset = key;
      schedRec.from   = from;
      schedRec.to     = to;
    }

    /* ── Rows ═════════════════════════════════════════════════════════════
       Rebuilt on every paint rather than cached: the boards can be saving
       underneath this, and a stale archive is worse than a few milliseconds.
       The two lookups that are not cheap — the truck's type, and the weekday
       a date falls on — are memoised for the length of one build. */

    function schedRecBuild() {
      const from = schedRec.from, to = schedRec.to;
      if (!from || !to) return [];
      const typeMemo = new Map(), dowMemo = new Map();
      const unitTypeOf = u => {
        const k = String(u == null ? '' : u);
        if (!typeMemo.has(k)) typeMemo.set(k, k ? unitTypeLabel(k) : '');
        return typeMemo.get(k);
      };
      const dowOf = ds => {
        if (!dowMemo.has(ds)) dowMemo.set(ds, schedParse(ds).toLocaleDateString('en-US', { weekday: 'short' }));
        return dowMemo.get(ds);
      };

      const rows = [], known = new Set();
      SCHED_BOARDS.forEach(cfg => {
        const st = _schedStates[cfg.id];
        if (!st || !st.loaded) return;
        Object.keys(st.assignments || {}).forEach(d => {
          const list = st.assignments[d] || [];
          list.forEach(a => { if (a && a.id) known.add(a.id); });
          if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d < from || d > to) return;
          list.forEach(a => { if (a) rows.push(schedRecRow(cfg, d, a, unitTypeOf, dowOf)); });
        });
      });

      // A report against an assignment nobody can find any more. The haul was
      // run and reported; only the plan for it is gone. Kept, and said so.
      schedRec.reports.forEach((rep, id) => {
        if (!rep || known.has(id)) return;
        const d = String(rep.work_date || '').slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d < from || d > to) return;
        rows.push(schedRecOrphanRow(id, rep, dowOf));
      });
      return rows;
    }

    function schedRecRow(cfg, date, a, unitTypeOf, dowOf) {
      const rep    = schedRec.reports.get(a.id) || null;
      const actHrs = rep ? schedRecHours(rep.actual_start, rep.actual_end) : '';
      const tons   = rep && rep.tons  != null && rep.tons  !== '' ? Number(rep.tons)  : '';
      const loads  = rep && rep.loads != null && rep.loads !== '' ? Number(rep.loads) : '';
      return {
        boardId:     cfg.id,
        board:       cfg.noun,
        date,
        dow:         dowOf(date),
        driver:      a.driver   || '',
        division:    schedDivLabel(a.division),
        project:     schedJobOf(a),
        location:    a.location || '',
        address:     a.address  || '',
        material:    a.material || '',
        unit:        a.unit     || '',
        unitType:    unitTypeOf(a.unit),
        start:       a.start    || '',
        end:         a.end      || '',
        planHrs:     schedRecHours(a.start, a.end),
        actStart:    rep ? (rep.actual_start || '') : '',
        actEnd:      rep ? (rep.actual_end   || '') : '',
        actHrs:      actHrs,
        tons:        tons,
        loads:       loads,
        tph:         schedRecRate(tons, actHrs),
        tickets:     rep ? (rep.tickets || '') : '',
        notes:       a.notes || '',
        driverNotes: rep ? (rep.notes || '') : '',
        status:      rep ? 'Reported' : 'Planned',
        id:          a.id || '',
      };
    }

    function schedRecOrphanRow(id, rep, dowOf) {
      const date   = String(rep.work_date || '').slice(0, 10);
      const actHrs = schedRecHours(rep.actual_start, rep.actual_end);
      const tons   = rep.tons  != null && rep.tons  !== '' ? Number(rep.tons)  : '';
      const loads  = rep.loads != null && rep.loads !== '' ? Number(rep.loads) : '';
      return {
        boardId: '', board: '—',
        date: date, dow: dowOf(date),
        driver: rep.driver_name || rep.username || '',
