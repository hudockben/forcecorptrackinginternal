        // customer name (lowercased) → matched IC company, restricted to 'trucking'
        const coByName = new Map();
        coList.forEach(c => {
          if ((c.divisions || []).includes('trucking')) {
            coByName.set((c.name || '').trim().toLowerCase(), c);
          }
        });
        if (!coByName.size) return;

        // Probe read: is any write warranted at all? Skips a needless second read
        // + PUT in the common steady state where nothing IC-relevant changed.
        const probe = await _readIcBilling();
        if (probe == null) return;
        if (!_reconcileTruckingBilling(probe.entries, coByName).changed) { _icBillingDirty = false; return; }

        // Re-read immediately before writing and reconcile onto the FRESH blob so
        // IC-side edits (invoice/payment dates), deletes, and other divisions'
        // writes that landed since the probe are preserved rather than clobbered
        // by a stale snapshot. The write then carries the version it was based
        // on, so a writer that beat us to it is detected rather than overwritten.
        const fresh = await _readIcBilling();
        if (fresh == null) return;
        const entries = fresh.entries;
        const { changed, sentNow, clearNow } = _reconcileTruckingBilling(entries, coByName);
        if (!changed) { _icBillingDirty = false; return; }

        const { ok, conflict } = await _writeIcBilling(entries, fresh.updatedAt);

        // Somebody else wrote between our read and our write. Re-queue so the
        // next pass reconciles onto their value instead of clobbering it, and
        // leave _icBillingDirty set so the work isn't forgotten.
        if (conflict && _icConflictRetries < IC_MAX_CONFLICT_RETRIES) {
          _icConflictRetries++;
          _icAutoSyncQueued = true;
          return;
        }
        if (ok) _icConflictRetries = 0;

        // Only reflect sent-state in the UI once the blob actually persisted, so a
        // failed PUT never leaves a badge claiming a row reached IC.
        if (ok) {
          icBillingArr = entries;
          icSentMap.clear();
          entries.forEach(e => { if (e.source === 'trucking' && e.source_id) icSentMap.set(e.source_id, e); });
          _icBillingDirty = false;
          _refreshTruckIcBadges(sentNow);
          _clearTruckIcBadges(clearNow);
        }
      } catch { /* non-fatal — the next save or poll retries */ }
      finally {
        _icAutoSyncRunning = false;
        if (_icAutoSyncQueued) { _icAutoSyncQueued = false; autoSyncIntercompanyTrucking(); }
      }
    }

    /* ── Deleted-name roster ──
       A managed list is two things at once: what the office typed into it, and
       whatever it swept up from the stored rows. The sweep is what makes a
       deleted name reappear, and these keep the deletion on record so it
       doesn't.

       Names match on their trimmed text, case and all. This list carries
       several spellings of the same company — "kovalchick", "Kovalchick",
       "KOVALCHICK" — because each was typed onto a row and swept up as its own
       entry, and deleting the duplicate has to leave the one being kept alone.
       Trailing space is the exception: " Kinkead" and "Kinkead" are one entry
       to anyone reading the panel, so they delete together. */
    const _remKey = v => String(v == null ? '' : v).trim();

    /* ── Customer rates ──
       What a company is billed per hour. A rate is only ever read forward, onto
       a row whose Haul Fee is still blank — correcting a rate must not silently
       restate what was already invoiced.

       Rates match on case as well as space, unlike the lists themselves. The
       difference is what each thing is about: a list entry is a spelling, and
       deleting the duplicate "kovalchick" has to leave "Kovalchick" alone,
       while a rate is about the company — a haul typed in lower case bills the
       same customer at the same price. */
    const _rateKey = v => String(v == null ? '' : v).trim().toLowerCase();

    function _normRates(r) {
      const out = {};
      if (r && typeof r === 'object') {
        Object.keys(r).forEach(k => {
          const name = String(k).trim();
          const v    = String(r[k] == null ? '' : r[k]).trim();
          if (name && v && !isNaN(parseFloat(v))) out[name] = v;
        });
      }
      return out;
    }

    /** The stored rate for a customer, or '' — matched the way the list is. */
    function customerRate(name) {
      const k = _rateKey(name);
      if (!k) return '';
      const rates = divTruckLists.rates || {};
      const hit = Object.keys(rates).find(n => _rateKey(n) === k);
      return hit ? String(rates[hit]) : '';
    }

    /** Set or clear a customer's rate. Returns true if anything changed. */
    function setCustomerRate(name, value) {
      const k = _rateKey(name);
      if (!k) return false;
      if (!divTruckLists.rates || typeof divTruckLists.rates !== 'object') divTruckLists.rates = {};
      const rates = divTruckLists.rates;
      // Rewrite under whatever spelling is already stored, so a rate does not
      // fork into two entries for the same company.
      const key = Object.keys(rates).find(n => _rateKey(n) === k) || String(name).trim();
      const v   = String(value == null ? '' : value).trim();
      const cur = rates[key] == null ? '' : String(rates[key]);
      const next = (v && !isNaN(parseFloat(v))) ? v : '';
      if (cur === next) return false;
      if (next) rates[key] = next; else delete rates[key];
      return true;
    }

    /** The fee this customer's stored rows are actually billed at most often.
     *  What the office would otherwise read off the rows by eye to fill a rate
     *  in — 1,944 of them — so the panel offers it instead. */
    function _historicRate(name) {
      const k = _rateKey(name);
      if (!k) return '';
      const seen = new Map();
      divEntries.forEach(e => {
        if (_rateKey(e.customer) !== k) return;
        const f = parseFloat(e.haul_fee);
        if (!f) return;
        const key = String(f);
        seen.set(key, (seen.get(key) || 0) + 1);
      });
      let best = '', bestN = 0;
      seen.forEach((n, v) => {
        // Ties go to the higher fee — the rate more likely to be current.
        if (n > bestN || (n === bestN && parseFloat(v) > parseFloat(best || '0'))) { best = v; bestN = n; }
      });
      return best;
    }

    /* What a removed unit was, kept with the removal. Everything else on these
       lists is just a name; a unit is a name AND the number the office reads
       beside it on every row AND what kind of truck it is, and dropping those
       on the way out means Put back hands back half a unit. */
    function _keepRemovedUnit(name) {
      const u   = (divTruckLists.units || []).find(x => x && x.name === name);
      if (!divTruckLists.removed || typeof divTruckLists.removed !== 'object') divTruckLists.removed = {};
      const key = String(name).trim();
      const nums  = divTruckLists.removed.unitNumbers = divTruckLists.removed.unitNumbers || {};
      const types = divTruckLists.removed.unitTypes   = divTruckLists.removed.unitTypes   || {};
      nums[key]  = (u && u.number) || '';
      types[key] = (u && u.type)   || '';
    }
    function _removedUnitFact(map, name) {
      const m = (divTruckLists.removed || {})[map] || {};
      const hit = Object.keys(m).find(n => _remKey(n) === _remKey(name));
      return hit ? String(m[hit] == null ? '' : m[hit]) : '';
    }
    function _removedUnitNumber(name) { return _removedUnitFact('unitNumbers', name); }
    function _removedUnitType(name) {
      const t = _removedUnitFact('unitTypes', name);
      return UNIT_TYPE_LABEL[t] ? t : '';
    }
    function _forgetRemovedUnit(name) {
      ['unitNumbers', 'unitTypes'].forEach(k => {
        const map = (divTruckLists.removed || {})[k];
        if (!map) return;
        Object.keys(map).forEach(n => { if (_remKey(n) === _remKey(name)) delete map[n]; });
      });
    }

    /* ── What kind of truck a unit is ──
       The dispatch report reads as sections — the tri-axles, then the lowboys
       — and it used to work that out from the unit's NAME, which only ever
       worked for the two units actually called TriAxle and Lowboy. 2757 is a
       tri-axle to everyone in the yard and "Other" to the report.

       So a unit carries its type, set once in Manage Lists, and every sheet
       that goes out says what the haul went out on. The name is still read
       when nobody has set one — a company that never opens the panel keeps the
       report it had — but what the office types always wins.

       Kept with the lists rather than with the scheduler because the panel and
       the report both need it, and they must not disagree about what a
       tri-axle is. */
    const UNIT_TYPES = [
      { key: 'triaxle', label: 'Tri-Axle'         },
      { key: 'quad',    label: 'Quad-Axle'        },
      { key: 'tractor', label: 'Tractor Trailer'  },
      { key: 'lowboy',  label: 'Lowboy'           },
      { key: 'flatbed', label: 'Flatbed'          },
      { key: 'spray',   label: 'Spray Truck'      },
      { key: 'winch',   label: 'Winch Truck'      },
      { key: 'pickup',  label: 'Pickup / Service' },
    ];
    const UNIT_TYPE_LABEL = UNIT_TYPES.reduce((m, t) => { m[t.key] = t.label; return m; }, {});

    /** The type a unit's name gives away, for a unit nobody has typed one on.
     *  `lowboy` and `tri` are the two words intercompany.html already sorts
     *  trucking cost by, so a guess here and the billing rollup cannot end up
     *  calling the same truck different things. Tri last: it is the loosest
     *  match of the lot and would otherwise swallow anything with "tri" in it. */
    function _guessUnitType(name) {
      const u = String(name == null ? '' : name).toLowerCase();
      if (!u) return '';
      if (u.includes('lowboy'))  return 'lowboy';
      if (u.includes('spray'))   return 'spray';
      if (u.includes('winch'))   return 'winch';
      if (u.includes('quad'))    return 'quad';
      if (u.includes('flat'))    return 'flatbed';
      if (u.includes('tractor') || u.includes('trailer')) return 'tractor';
      if (u.includes('pickup')  || u.includes('service')) return 'pickup';
      if (u.includes('tri'))     return 'triaxle';
      return '';
    }

    /** The unit behind a name, however the row spells it. */
    function unitRecord(name) {
      const k = _remKey(name);
      if (!k) return null;
      return (divTruckLists.units || []).find(u => u && _remKey(u.name) === k) || null;
    }

    /** What kind of truck a haul went out on: what the office set on the unit,
     *  and only failing that what its name suggests. '' when neither says —
     *  an unrecognised unit is never dropped, it lands in Other. */
    function unitType(name) {
      const rec = unitRecord(name);
      const set = rec && String(rec.type == null ? '' : rec.type).trim();
      if (set && UNIT_TYPE_LABEL[set]) return set;
      return _guessUnitType(rec ? rec.name : name);
    }

    function unitTypeLabel(name) {
      const t = unitType(name);
      return t ? UNIT_TYPE_LABEL[t] : '';
    }

    /** The dismissed sign-ins, as trimmed usernames with no repeats. Compared
     *  case-insensitively throughout: usernames are created by hand and their
     *  casing wanders, the same reason api/driver/logins.js sorts on LOWER(). */
    function _normNotDrivers(v) {
      const out = [], seen = new Set();
      (Array.isArray(v) ? v : []).forEach(u => {
        const s = String(u == null ? '' : u).trim();
        const k = s.toLowerCase();
        if (!s || seen.has(k)) return;
        seen.add(k);
        out.push(s);
      });
      return out;
    }

    /** Shape whatever the server hands back into the four string arrays, plus
     *  the numbers and types of any units among them. */
    function _normRemoved(r) {
      const out = { drivers: [], customers: [], units: [], materials: [], unitNumbers: {}, unitTypes: {} };
      if (r && typeof r === 'object') {
        ['drivers', 'customers', 'units', 'materials'].forEach(k => {
          if (Array.isArray(r[k])) out[k] = r[k].map(v => String(v == null ? '' : v).trim()).filter(Boolean);
        });
        ['unitNumbers', 'unitTypes'].forEach(k => {
          if (!r[k] || typeof r[k] !== 'object') return;
          Object.keys(r[k]).forEach(n => {
            const name = String(n).trim();
            if (name) out[k][name] = String(r[k][n] == null ? '' : r[k][n]).trim();
          });
        });
      }
      return out;
    }

    function _removedSet(key) {
      const r = divTruckLists.removed || {};
      return new Set((Array.isArray(r[key]) ? r[key] : []).map(_remKey));
    }

    function _isRemovedName(key, val) {
      const k = _remKey(val);
      return !!k && _removedSet(key).has(k);
    }

    /** Record (on = true) or clear a deletion. Returns true if anything changed. */
    function _setRemovedName(key, val, on) {
      const k = _remKey(val);
      if (!k) return false;
      if (!divTruckLists.removed || typeof divTruckLists.removed !== 'object') divTruckLists.removed = {};
      const cur = Array.isArray(divTruckLists.removed[key]) ? divTruckLists.removed[key] : [];
      const has = cur.some(v => _remKey(v) === k);
      if (on === has) return false;
      divTruckLists.removed[key] = on
        ? cur.concat(String(val).trim())
        : cur.filter(v => _remKey(v) !== k);
      return true;
    }

    /* Fix entries that were saved before the CSV normalisation was in place.
       Safe to call on every load — no-op when data is already clean. */
    function _migrateExistingEntries() {
      const _migrateEntryCount = divEntries.length;
      let dataChanged  = false;
      let listsChanged = false;

      const addStr = (key, arr, val) => {
        if (!val || arr.includes(val)) return arr;
        // Deleted on purpose — the row keeps the name, the picker doesn't.
        if (_isRemovedName(key, val)) return arr;
        listsChanged = true;
        return arr.concat(val);
      };

      divEntries.forEach(e => {
        // Date: MM/DD/YYYY → YYYY-MM-DD
        const d = _csvDate(e.actual_date || '');
        if (d !== (e.actual_date || '')) { e.actual_date = d; dataChanged = true; }

        // Times: 12-hr AM/PM → 24-hr HH:MM
        const ts = _csvTime(e.actual_start || '');
        if (ts !== (e.actual_start || '')) { e.actual_start = ts; dataChanged = true; }
        const te = _csvTime(e.actual_end || '');
        if (te !== (e.actual_end || '')) { e.actual_end = te; dataChanged = true; }

        // Haul fee / hours: strip currency symbols
        const hf = _csvNum(e.haul_fee || '');
        if (hf !== (e.haul_fee || '')) { e.haul_fee = hf; dataChanged = true; }
        const th = _csvNum(e.total_hours || '');
        if (th !== (e.total_hours || '')) { e.total_hours = th; dataChanged = true; }

        // Auto-populate managed lists from stored entries
        divTruckLists.drivers   = addStr('drivers',   divTruckLists.drivers,   e.driver);
        divTruckLists.customers = addStr('customers', divTruckLists.customers, e.customer);
        if (e.unit && !divTruckLists.units.some(u => u.name === e.unit)
            && !_isRemovedName('units', e.unit)) {
          divTruckLists.units.push({ name: e.unit, number: '', type: '' });
          listsChanged = true;
        }
      });

      // Converge on the deletions: a save from another tab (or one that raced a
      // re-seed) can hand back a name this company already deleted, so drop it
      // here rather than waiting for someone to delete it a second time.
      ['drivers', 'customers', 'materials'].forEach(key => {
        const arr = divTruckLists[key];
        if (!Array.isArray(arr) || arr.length === 0) return;
        const kept = arr.filter(v => !_isRemovedName(key, v));
        if (kept.length !== arr.length) { divTruckLists[key] = kept; listsChanged = true; }
      });
      if (Array.isArray(divTruckLists.units) && divTruckLists.units.length) {
        const keptU = divTruckLists.units.filter(u => !_isRemovedName('units', u && u.name));
        if (keptU.length !== divTruckLists.units.length) { divTruckLists.units = keptU; listsChanged = true; }
      }

      if (listsChanged) {
        divTruckLists.drivers.sort((a, b) => a.localeCompare(b));
        divTruckLists.customers.sort((a, b) => a.localeCompare(b));
        divTruckLists.units.sort((a, b) => a.name.localeCompare(b.name));
      }
      // Only save if the entry count didn't drop — guards against saving a
      // partially-loaded set that was pulled from a stale server blob.
      if ((dataChanged || listsChanged) && divEntries.length >= _migrateEntryCount) tdDivPut();
    }

    async function loadTrackingData() {
      const [divData, lists] = await Promise.all([
        tdDivGet(),
        tdGet('fct_lists'),
        loadIcSentMap(),
      ]);
      if (divData) {
        // Only a real array counts as "loaded" — see _divEntriesLoaded. A
        // malformed response would otherwise read as a division with no rows.
        _divEntriesLoaded = Array.isArray(divData.entries);
        divEntries = Array.isArray(divData.entries) ? divData.entries : [];
        const tl   = divData.lists || {};
        if (Array.isArray(tl.drivers))   divTruckLists.drivers   = tl.drivers;
        if (Array.isArray(tl.customers)) divTruckLists.customers = tl.customers;
        if (Array.isArray(tl.units))     divTruckLists.units     = tl.units;
        if (Array.isArray(tl.locations)) divTruckLists.locations = tl.locations;
        if (Array.isArray(tl.materials)) divTruckLists.materials = tl.materials;
        if (tl.removed && typeof tl.removed === 'object') divTruckLists.removed = _normRemoved(tl.removed);
        if (tl.rates   && typeof tl.rates   === 'object') divTruckLists.rates   = _normRates(tl.rates);
        if (Array.isArray(tl.notDrivers)) divTruckLists.notDrivers = _normNotDrivers(tl.notDrivers);
      }
      if (lists) {
        if (Array.isArray(lists.employees)) {
          divLists.employees = lists.employees.map(e => typeof e === 'string' ? { name: e } : e);
        }
        if (Array.isArray(lists.equipment)) divLists.equipment = lists.equipment;
      }
      _recoverEntriesFromIcBilling();
      _migrateExistingEntries();
      // Backfill: mirror any qualifying rows into Intercompany Billing on load —
      // creates entries for rows entered before auto-send existed and keeps
      // already-sent ones in sync, without waiting for the next edit.
      autoSyncIntercompanyTrucking();
      renderDashboard();
    }

    // Rebuild truck entries that are present in IC billing but missing from divEntries
    // (e.g. lost when the truck-division blob was overwritten or rolled back).
    // Uses source_id as the canonical truck entry ID so re-running is idempotent.
    //
    // Payroll-injected rows ("tst-" ids) are deliberately excluded. For a row the
    // trucking office owns, missing-from-the-blob really does mean lost — nothing
    // else deletes it. For a payroll row it means the opposite: payroll un-approved
    // or deleted the timesheet entry, which is the only supported way to remove one.
    // Recovering those resurrected un-approved work — the row came back with its
    // original id, which this tab refuses to delete and which a later re-approval
    // (under a new id, before those were made stable) no longer owned, so it sat
    // here permanently double-counting the corrected row's hours and dollars.
    //
    // If a payroll row ever IS genuinely lost, un-approving and re-approving the
    // entry rebuilds it — re-injection reuses the row's id now, so that restores
    // the row rather than adding a second one.
    function _recoverEntriesFromIcBilling() {
      const existingIds = new Set(divEntries.map(e => e.id));
      const recovered = [];
      icBillingArr.forEach(ic => {
        if (ic.source !== 'trucking' || !ic.source_id) return;
        if (existingIds.has(ic.source_id)) return;
        if (isPayrollRowId(ic.source_id)) return;
        recovered.push({
          id:               ic.source_id,
          task_number:      ic.task_number      || '',
          actual_date:      ic.actual_date      || '',
          driver:           ic.driver           || '',
          unit:             ic.unit             || '',
          actual_start:     ic.actual_start     || '',
          actual_end:       ic.actual_end       || '',
          total_hours:      ic.total_hours      || '',
          haul_fee:         ic.haul_fee         || '',
          customer:         ic.customer         || '',
          description:      ic.description      || '',
          division:         ic.division         || '',
          notes:            ic.notes            || '',
          qb_invoice:       ic.qb_invoice       || '',
          invoiced_date:    ic.invoiced_date     || '',
          invoice_sent_date: ic.invoice_sent_date || '',
          invoice_status:   ic.invoice_status   || 'Unpaid',
          date_paid:        ic.date_paid        || '',
        });
        existingIds.add(ic.source_id);
      });
      if (recovered.length > 0) {
        divEntries.push(...recovered);
        tdDivPut();
        console.log('[recovery] restored', recovered.length, 'truck entry/entries from IC billing');
      }
    }

    function saveTruckLists() {
      tdDivPut();
    }


    /* ═══════ Driver logins ═══════
       Which sign-in belongs to which driver. The Scheduler names people from
       the office's own drivers list; a login is a username, and nothing joins
       the two. Stating it here is what lets the driver app answer "which of
       these hauls are mine" without ever handing a phone the whole board. */
    let driverLoginMap   = {};   // username → driver name
    let driverLoginUsers = [];   // the company's sign-ins, for the picker
    let _driverLoginsLoaded = false;

    async function loadDriverLogins() {
      try {
        const r = await fetch(`${API_BASE}/driver/logins`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!r.ok) return;
        const j = await r.json();
        driverLoginMap   = (j && j.map && typeof j.map === 'object') ? j.map : {};
        driverLoginUsers = Array.isArray(j && j.users) ? j.users : [];
        _driverLoginsLoaded = true;
      } catch { /* non-fatal — the panel says it couldn't load */ }
    }

    function saveDriverLogins() {
      fetch(`${API_BASE}/driver/logins`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ map: driverLoginMap }),
      }).then(r => _handleSaveResponse(r, 'driverLogins')).catch(() => _showSaveError(false));
    }

    function linkDriverLogin() {
      const uSel = document.getElementById('lists-login-user');
      const dSel = document.getElementById('lists-login-driver');
      if (!uSel || !dSel) return;
      const u = (uSel.value || '').trim();
      const d = (dSel.value || '').trim();
      if (!u || !d) return;
      driverLoginMap[u] = d;
      saveDriverLogins();
      uSel.value = ''; dSel.value = '';
      renderListsPanel();
    }

    function unlinkDriverLogin(username) {
      delete driverLoginMap[username];
      saveDriverLogins();
      renderListsPanel();
    }

    /* ── Reading a sign-in against the drivers list ──
       A username and a driver name are separate strings that nothing joins,
       which is the gap the link above exists to close. These read the one
       against the other well enough to propose a pairing. Nothing here ever
       links on its own: a guess is shown beside the sign-in it came from and
       the office clicks it, so being wrong costs a glance rather than sending
       one driver's schedule to another. */
    const _loginKey = v => String(v == null ? '' : v).toLowerCase().replace(/[^a-z]/g, '');

    /** "Wetzel, John" → { last: 'wetzel', first: 'john' }. A name with no
     *  comma is taken as a surname on its own, which is how the bare usernames
     *  that reached the drivers list through a timesheet read. */
    function _driverNameParts(name) {
      const s = String(name == null ? '' : name);
      const i = s.indexOf(',');
      return i === -1
        ? { last: _loginKey(s), first: '' }
        : { last: _loginKey(s.slice(0, i)), first: _loginKey(s.slice(i + 1)) };
    }

    /** The driver a sign-in most likely belongs to, or '' for no guess.
     *
     *  The rule is the one this company's own usernames already follow —
     *  surname, then the first name starting ("cribbsjon" → "Cribbs, Jonathan",
     *  "barrmike" → "Barr, Michael") — so it wants the whole surname and, at
     *  the least, the first initial after it. Anything looser starts pairing
     *  people who merely share a few letters.
     *
     *  Ranked on the surname first, because matching eight characters of it is
     *  far more evidence than matching four, and then on how much of the first
     *  name agrees: "kirkdave" is Kirk, Dave rather than Kirk, Dan, which only
     *  shares the initial. Two drivers still level on both are two people this
     *  username genuinely cannot tell apart — that is left for the office to
     *  say rather than settled by list order. */
    function _guessDriverForLogin(username) {
      const u = _loginKey(username);
      if (!u) return '';
      let best = '', bestLen = -1, bestFit = -1, tied = false;
      (divTruckLists.drivers || []).forEach(d => {
        const { last, first } = _driverNameParts(d);
        if (!last || !u.startsWith(last)) return;
        const rest = u.slice(last.length);
        // A surname alone matches only the username that is exactly it —
        // otherwise the remainder has to look like a first name starting.
        // Whole first name either way round beats a shared initial: the
        // username may shorten it ("jon" for Jonathan) or the list may
        // ("Nick" against a longer sign-in).
        const fit = !first ? (rest ? -1 : 1)
          : !rest ? -1
          : (first.startsWith(rest) || rest.startsWith(first)) ? 2
          : rest[0] === first[0] ? 1
          : -1;
        if (fit < 0) return;
        if (last.length > bestLen || (last.length === bestLen && fit > bestFit)) {
          best = d; bestLen = last.length; bestFit = fit; tied = false;
        } else if (last.length === bestLen && fit === bestFit && d !== best) {
          tied = true;
        }
      });
      return tied ? '' : best;
    }

    /** Sign-ins with no driver name behind them: every one of the company's
     *  logins less the linked ones and the ones dismissed as not drivers.
     *  Each comes back with the driver it looks like, when it looks like one. */
    function _unlinkedLogins() {
      const linked = new Set(Object.keys(driverLoginMap || {}).map(u => String(u).trim().toLowerCase()));
      const said   = new Set((divTruckLists.notDrivers || []).map(u => String(u).trim().toLowerCase()));
      return (driverLoginUsers || [])
        .map(u => String((u && u.username) || '').trim())
        .filter(u => u && !linked.has(u.toLowerCase()) && !said.has(u.toLowerCase()))
        .map(u => ({ username: u, guess: _guessDriverForLogin(u) }));
    }

    function driverLoginsHTML(esc) {
      if (!_driverLoginsLoaded) {
        return `
          <div class="lists-section">
            <span style="font-size:0.72rem;color:var(--muted)">Loading sign-ins…</span>
          </div>`;
      }
      const allLinked = Object.keys(driverLoginMap).sort((a, b) => a.localeCompare(b));
      // Matched on either half: the office knows some of these by username and
      // some by the driver they belong to.
      const linked = allLinked.filter(u => _listsMatch(u) || _listsMatch(driverLoginMap[u]));
      const taken  = new Set(linked.map(u => u.toLowerCase()));
      const free   = driverLoginUsers.filter(u => !taken.has(String(u.username).toLowerCase()));
      const drivers = (divTruckLists.drivers || []).slice().sort((a, b) => String(a).localeCompare(String(b)));

      return `
        <div class="lists-section">
          <div class="lists-hint">
            Links a sign-in to a name on the drivers list, so the driver app can show
            that person their own hauls. An unlinked sign-in sees nothing.
            ${free.length ? `A sign-in whose driver isn't on that list yet is added
              from <button class="lists-link" onclick="listsOpenTab('drivers')">Drivers</button>,
              which offers every one of them.` : ''}
          </div>
          <div class="lists-add-row" style="flex-wrap:wrap;gap:0.3rem">
            <select id="lists-login-user" style="flex:1;min-width:104px;background:var(--surface);
              border:1px solid var(--border);border-radius:4px;color:var(--text);
              font-size:0.76rem;padding:0.3rem 0.4rem;outline:none">
              <option value="">Sign-in…</option>
              ${free.map(u => `<option value="${esc(u.username)}">${esc(u.username)}</option>`).join('')}
            </select>
            <select id="lists-login-driver" style="flex:1;min-width:104px;background:var(--surface);
              border:1px solid var(--border);border-radius:4px;color:var(--text);
              font-size:0.76rem;padding:0.3rem 0.4rem;outline:none">
              <option value="">Driver…</option>
              ${drivers.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('')}
            </select>
            <button class="lists-add-btn" onclick="linkDriverLogin()">Link</button>
          </div>
          <div class="lists-items">
            ${linked.length === 0
              ? (_listsFilter.trim()
                  ? `<span style="font-size:0.72rem;color:var(--muted)">No sign-in matches “${esc(_listsFilter.trim())}”${allLinked.length ? ` — ${allLinked.length} linked` : ''}.</span>`
                  : `<span style="font-size:0.72rem;color:var(--muted)">No sign-ins linked yet.</span>`)
              : linked.map(u => {
                  const d = driverLoginMap[u];
                  // A link pointing at a name no longer on the drivers list still
                  // resolves for the driver, so it is flagged rather than hidden.
                  const stale = !(divTruckLists.drivers || []).includes(d);
                  return `
                    <div class="lists-item">
                      <span class="li-name">
                        ${esc(u)}
                        <span style="color:var(--muted)">&rarr;</span>
                        <span style="color:${stale ? 'var(--amber)' : 'var(--text)'}">${esc(d)}</span>
                        ${stale ? `<span title="Not on the drivers list any more" style="color:var(--amber);font-size:0.62rem"> (?)</span>` : ''}
                      </span>
                      <button class="lists-item-del" onclick="unlinkDriverLogin('${esc(u).replace(/'/g, "\\'")}')"
                        title="Unlink">&#10005;</button>
                    </div>`;
                }).join('')
            }
          </div>
        </div>`;
    }

    /* ── Manage Lists panel ── */
    // The last removal, so it can be taken back from the panel itself, and
    // which "N removed" strips are folded open. Both are view state: neither
    // is saved, and opening the panel fresh starts with a clean slate.
    let _listsUndo = null;
    let _listsShowRemoved = new Set();
    // The one thing the panel refuses rather than does: a unit renamed onto a
    // name already in the list. Said where the undo bar would have been, then
    // dropped on the next action — it is an answer to what just happened, not
    // a state the panel sits in.
    let _listsNote = '';
    // Which list is open, and what is being looked for in it. Six lists stacked
    // in one column is what made this hard to work in; one at a time, filtered,
    // is what replaced it.
    let _listsTab = 'customers';
    let _listsFilter = '';
    const LISTS_TABS = [
      { key: 'drivers',   label: 'Drivers' },
      { key: 'customers', label: 'Customers & Rates' },
      { key: 'units',     label: 'Units' },
      { key: 'materials', label: 'Materials' },
      { key: 'locations', label: 'Locations' },
      { key: 'logins',    label: 'Driver Sign-ins' },
    ];

    /** The names in one list, as plain strings — what the tab counts and the
     *  filter matches against. */
    function _listsNamesFor(key) {
      if (key === 'units')     return (divTruckLists.units || []).map(u => u && u.name).filter(Boolean);
      if (key === 'locations') return (divTruckLists.locations || []).map(l => l && l.name).filter(Boolean);
      // A sign-in matches on either half: the office knows some by username and
      // some by the driver they belong to.
      if (key === 'logins')    return Object.keys(driverLoginMap || {}).map(u => u + ' ' + (driverLoginMap[u] || ''));
      return divTruckLists[key] || [];
    }

    function _listsMatch(v) {
      const q = _listsFilter.trim().toLowerCase();
      return !q || String(v == null ? '' : v).toLowerCase().includes(q);
    }

    function listsSearch(v) {
      _listsFilter = String(v == null ? '' : v);
      renderListsPanel();
    }

    function listsOpenTab(key) {
      _listsTab = key;
      _listsMerge = null;   // a form open on another list is not this one's
      _listsNote = '';
      renderListsPanel();
    }
    // The item whose merge form is open, as { key, from }. One at a time: the
    // form replaces the row it belongs to, so it reads as that name's own.
    let _listsMerge = null;

    function openManageLists() {
      _listsUndo = null;
      _listsMerge = null;
      _listsNote = '';
      _listsFilter = '';
      const q = document.getElementById('lists-search');
      if (q) q.value = '';
      document.getElementById('lists-backdrop').classList.add('open');
      renderListsPanel();
      // Fetched on first open rather than at page load: most visits to this
      // tab never open the panel, and this is the only thing in it needing a
      // round trip.
      if (!_driverLoginsLoaded) loadDriverLogins().then(renderListsPanel);
    }

    function closeManageLists(e) {
      if (e && document.getElementById('lists-panel').contains(e.target)) return;
      document.getElementById('lists-backdrop').classList.remove('open');
    }

    // Escape backs out one step at a time: an open merge form first — it is a
    // question waiting on an answer — and the dialog only once nothing is.
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      const b = document.getElementById('lists-backdrop');
      if (!b || !b.classList.contains('open')) return;
      if (_listsMerge) { cancelMerge(); return; }
      closeManageLists();
    });

    function renderListsPanel() {
      const esc = s => String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      // A name reaches an onclick as a JS string literal inside an HTML
      // attribute, so it needs both escapes — esc() alone leaves an apostrophe
      // to break the call, and "Kinkead's" then refuses to delete.
      const argEsc = v => esc(v).replace(/'/g, "\\'");

      /* How many stored rows name each thing. A list this long is mostly
         near-duplicates of the same company typed three ways, and the count is
         what tells the office which spelling is the real one — and that
         removing the other costs nothing. */
      const uses = { drivers: new Map(), customers: new Map(), units: new Map() };
      divEntries.forEach(e => {
        const bump = (m, v) => { const k = _remKey(v); if (k) m.set(k, (m.get(k) || 0) + 1); };
        bump(uses.drivers,   e.driver);
        bump(uses.customers, e.customer);
        bump(uses.units,     e.unit);
      });
      const useCount = (key, v) => (uses[key] ? uses[key].get(_remKey(v)) || 0 : 0);
      const countChip = (key, v) => {
        const n = useCount(key, v);
        return n
          ? `<span class="li-count" title="${n} stored row${n === 1 ? '' : 's'} name${n === 1 ? 's' : ''} this">${n}</span>`
          : `<span class="li-count" title="No stored row names this — nothing depends on it" style="opacity:0.55">—</span>`;
      };

      /* The last removal, offered straight back. Deleting a name is safe and
         reversible, and saying so where the click happened beats a dialog in
         front of every one of them. */
      const noteHTML = () => _listsNote
        ? `<div class="lists-note">${esc(_listsNote)}</div>`
        : '';

      const undoHTML = () => {
        const u = _listsUndo;
        if (!u) return '';
        const txt = u.kind === 'notdriver'
          ? `<strong>${esc(u.value)}</strong> is not a driver — it won't be offered again.`
          : u.kind === 'rename'
          ? `Renamed <strong>${esc(u.from)}</strong> to <strong>${esc(u.to)}</strong> — ${
              u.ids.length ? `${u.ids.length} row${u.ids.length === 1 ? '' : 's'}` : 'no rows'
            }${u.sched.length ? ` and ${u.sched.length} assignment${u.sched.length === 1 ? '' : 's'}` : ''} renamed with it${
              u.locked ? `, ${u.locked} payroll row${u.locked === 1 ? '' : 's'} left alone (fix ${u.locked === 1 ? 'it' : 'those'} in Payroll)` : ''}.`
          : u.kind === 'merge'
          ? `Merged <strong>${esc(u.from)}</strong> into <strong>${esc(u.to)}</strong> — ${
              u.ids.length ? `${u.ids.length} row${u.ids.length === 1 ? '' : 's'} renamed` : 'no rows to rename'
            }${u.locked ? `, ${u.locked} payroll row${u.locked === 1 ? '' : 's'} left alone (fix ${u.locked === 1 ? 'it' : 'those'} in Payroll)` : ''}.`
          : `Removed <strong>${esc(u.value)}</strong>${
              u.uses
                ? ` — ${u.uses} row${u.uses === 1 ? '' : 's'} keep it and still total the same.`
                : ' — no rows used it.'
            }`;
        return `
          <div class="lists-undo">
            <span class="u-txt">${txt}</span>
            <button onclick="undoListChange()">Undo</button>
          </div>`;
      };

      /* Sign-ins with nobody behind them, offered straight onto the drivers
         list. A login and a driver name are separate strings that nothing
         joins (see api/driver/logins.js), so a new hire can have an account
         and still not exist to the board — and the only symptom is a driver
         who opens the app to an empty schedule. Sitting here, on the list that
         is missing the name, is what makes that visible before it happens.

         Offered, never taken: each one is a name the office types or a guess
         it clicks, because the app matches a haul to a person by this exact
         string and a wrong link shows one driver another's day. */
      const unlinkedLoginsHTML = () => {
        // Nothing is claimed until the sign-ins are actually in hand — an
        // empty strip and one that hasn't loaded are different things.
        if (!_driverLoginsLoaded) return '';
        // The filter runs over this the way it runs over the list above it,
        // matching on either half — the office knows some of these by username
        // and some by the driver they belong to.
        const pend = _unlinkedLogins().filter(c => _listsMatch(c.username) || _listsMatch(c.guess));
        const said = (divTruckLists.notDrivers || []).filter(u => u && _listsMatch(u));
        if (pend.length === 0 && said.length === 0) return '';

        const rows = pend.map((c, i) => {
          const uArg = argEsc(c.username);
          const dismiss = `<button class="lists-item-del" style="flex:none"
            onclick="dismissLoginCandidate('${uArg}')"
            title="Not a driver — an office login. Stops offering it.">&#10005;</button>`;
          // A guess is shown as the pairing it would make, both halves
          // readable, so what the button does is on the button.
          if (c.guess) {
            return `
              <div class="lists-item" style="gap:0.4rem">
                <span class="li-name" style="flex:none;color:var(--muted)">${esc(c.username)}</span>
                <span style="flex:none;color:var(--muted)">&rarr;</span>
                <span class="li-name">${esc(c.guess)}</span>
                <button class="lists-add-btn" style="flex:none"
                  onclick="linkLoginToDriver('${uArg}','${argEsc(c.guess)}')"
                  title="Link this sign-in to ${esc(c.guess)}">Link</button>
                ${dismiss}
              </div>`;
          }
          return `
            <div class="lists-item" style="gap:0.4rem">
              <span class="li-name" style="flex:none;color:var(--muted)">${esc(c.username)}</span>
              <input type="text" id="lists-login-name-${i}" placeholder="Last, First"
                onkeydown="if(event.key==='Enter')addDriverFromLogin('${uArg}',${i})"
                style="flex:1;min-width:110px;background:var(--bg);border:1px solid var(--border);
                  border-radius:4px;color:var(--text);font-size:0.76rem;
                  padding:0.22rem 0.4rem;outline:none">
              <button class="lists-add-btn" style="flex:none"
                onclick="addDriverFromLogin('${uArg}',${i})"
                title="Add the name to this list and give this sign-in to it">Add &amp; link</button>
              ${dismiss}
            </div>`;
        }).join('');

        // The answers already given, foldable. Small, but the only way back
        // from a dismissal made a month ago.
        const saidHTML = said.length === 0 ? '' : `
          <div style="margin-top:${pend.length ? '0.5rem' : '0'}">
            <button class="lists-link" onclick="toggleNotDrivers()">
              ${_listsShowNotDrivers ? '&#9662;' : '&#9656;'} ${said.length} sign-in${said.length === 1 ? '' : 's'} marked not a driver
            </button>
            ${!_listsShowNotDrivers ? '' : `
              <div style="display:flex;flex-direction:column;gap:0.3rem;max-width:560px;margin-top:0.4rem">
                ${said.map(u => `
                  <div class="lists-item" style="opacity:0.65;gap:0.4rem">
                    <span class="li-name">${esc(u)}</span>
                    <button class="lists-link" style="flex:none"
                      onclick="restoreLoginCandidate('${argEsc(u)}')">Offer again</button>
                  </div>`).join('')}
              </div>`}
          </div>`;

        return `
          <div style="margin-top:0.6rem;padding-top:0.5rem;border-top:1px solid rgba(255,255,255,0.07)">
            ${pend.length === 0 ? '' : `
              <div class="lists-hint" style="margin-bottom:0.45rem">
                <span style="color:var(--amber)">${pend.length} sign-in${pend.length === 1 ? '' : 's'} with no name on this list.</span>
                Until ${pend.length === 1 ? 'it is' : 'they are'} linked to a driver, that person opens the driver app to an empty schedule.
              </div>
              <div style="display:flex;flex-direction:column;gap:0.3rem;max-width:560px">${rows}</div>`}
            ${saidHTML}
          </div>`;
      };

      /* Names deleted from this list, offered back. Deletion is remembered
         (see removeFromList) precisely so the loader can't re-seed them from
         the stored rows — which also means this is the only way back. Folded
         away by default: it is a recycle bin, not part of the list. */
      const removedHTML = (key, label) => {
        const bucket = (divTruckLists.removed || {})[key];
        const gone = (Array.isArray(bucket) ? bucket : []).filter(Boolean);
        if (gone.length === 0) return '';
        const open = _listsShowRemoved.has(key);
        return `
          <div style="margin-top:0.5rem;padding-top:0.45rem;border-top:1px solid rgba(255,255,255,0.07)">
            <button class="lists-link" onclick="toggleRemoved('${key}')">
              ${open ? '&#9662;' : '&#9656;'} ${gone.length} removed ${label.toLowerCase()}
            </button>
            ${!open ? '' : `
              <div class="lists-hint" style="margin:0.4rem 0 0.35rem">
                Kept off the picker even though old rows still name ${gone.length === 1 ? 'it' : 'them'}.
              </div>
              <div class="lists-items">
                ${gone.map(v => `
                  <div class="lists-item" style="opacity:0.65">
                    <span class="li-name">${esc(v)}</span>
                    ${countChip(key, v)}
                    <button class="lists-link" style="margin-left:0.5rem;flex:none"
                      onclick="restoreToList('${key}','${argEsc(v)}')">Put back</button>
                  </div>`).join('')}
              </div>`}
          </div>`;
      };

      const delBtn = (key, v) =>
        `<button class="lists-item-del" style="margin-left:0.4rem"
           onclick="removeFromList('${key}','${argEsc(v)}')"
           title="Remove from the picker. Rows that already name it keep it and still total the same.">&#10005;</button>`;

      /* Merging is the answer to two spellings of one company, so the button
         only appears where there is something to merge into. */
      const mergeBtn = (key, v) => {
        const others = key === 'units'
          ? (divTruckLists.units || []).map(u => u && u.name).filter(Boolean)
          : (divTruckLists[key] || []);
        if (others.filter(o => _remKey(o) !== _remKey(v)).length === 0) return '';
        return `<button class="lists-item-del" style="margin-left:0.3rem"
          onclick="openMerge('${key}','${argEsc(v)}')"
          title="Merge into another name — renames it on the rows that carry it, then removes it from the picker.">&#8676;</button>`;
      };

      /* The form for one name, in the place that name sits. Says what it will
         do — how many rows, and how many it cannot — before it is run.

         Nothing is preselected unless it is obviously right. The list is
         alphabetical, so a plain <select> would sit on whatever sorts first
         and one stray click would fold a company into an unrelated one. */
      const mergeForm = (key, v) => {
        const others = (key === 'units'
          ? (divTruckLists.units || []).map(u => u && u.name).filter(Boolean)
          : (divTruckLists[key] || []))
          .filter(o => _remKey(o) !== _remKey(v))
          .sort((a, b) => String(a).localeCompare(String(b)));
        const pick = _mergeSuggestion(key, v, others);
        const { ids, locked } = _mergeTargets(key, v);
        return `
          <div class="lists-merge">
            <div class="lists-hint" style="margin-bottom:0.35rem;color:var(--text)">
              Merge <strong>${esc(v)}</strong> into:
            </div>
            <select id="lists-merge-into" class="lists-merge-sel"
              onchange="var b=document.getElementById('lists-merge-go'); if(b) b.disabled = !this.value">
              ${pick ? '' : '<option value="">— choose a name —</option>'}
              ${others.map(o => `<option value="${esc(o)}"${o === pick ? ' selected' : ''}>${esc(o)}${
                o === pick ? ' — same name, different spelling' : ''}</option>`).join('')}
            </select>
            <div class="lists-hint" style="margin:0.35rem 0 0.4rem">
              ${ids.length
                ? `Renames it on ${ids.length} row${ids.length === 1 ? '' : 's'}, then drops it from the picker.`
                : `No rows carry it — this just drops it from the picker.`}
              ${locked ? `<br><span style="color:var(--amber)">${locked} payroll row${locked === 1 ? '' : 's'} keep${locked === 1 ? 's' : ''} the old name — change ${locked === 1 ? 'it' : 'those'} in Payroll.</span>` : ''}
            </div>
            <div style="display:flex;gap:0.4rem;align-items:center">
              <button class="lists-add-btn" id="lists-merge-go" onclick="confirmMerge()"${pick ? '' : ' disabled'}>Merge</button>
              <button class="lists-link" onclick="cancelMerge()">Cancel</button>
            </div>
          </div>`;
      };
      const merging = (key, v) => !!(_listsMerge && _listsMerge.key === key && _remKey(_listsMerge.from) === _remKey(v));

      /* Nothing found, said in terms of what was looked for — a filter that
         hides everything and an empty list are not the same problem. */
      const emptyHTML = (label, total) => _listsFilter.trim()
        ? `<span style="font-size:0.72rem;color:var(--muted)">No ${label.toLowerCase()} match “${esc(_listsFilter.trim())}”${
            total ? ` — ${total} in the list` : ''}.</span>`
        : `<span style="font-size:0.72rem;color:var(--muted)">No ${label.toLowerCase()} yet.</span>`;

      const section = (key, label, all) => {
        const items = all.filter(_listsMatch);
        return `
        <div class="lists-section">
          <div class="lists-add-row">
            <input type="text" id="lists-new-${key}" placeholder="Add ${label.toLowerCase()}…"
              onkeydown="if(event.key==='Enter')addToList('${key}')">
            <button class="lists-add-btn" onclick="addToList('${key}')">Add</button>
          </div>
          <div class="lists-items">
            ${items.length === 0
              ? emptyHTML(label, all.length)
              : items.map(v => merging(key, v) ? mergeForm(key, v) : `
                  <div class="lists-item">
                    <span class="li-name">${esc(v)}</span>
                    ${uses[key] ? countChip(key, v) : ''}
                    ${uses[key] ? mergeBtn(key, v) : ''}
                    ${delBtn(key, v)}
                  </div>`).join('')
            }
          </div>
          ${key === 'drivers' ? unlinkedLoginsHTML() : ''}
          ${removedHTML(key, label)}
        </div>`;
      };

      /* Customers carry a rate, so they get their own section rather than the
         generic one: the number beside the name is what a new row bills at. */
      const customersHTML = () => {
        const all      = divTruckLists.customers || [];
        const items    = all.filter(_listsMatch);
        // Counted over the whole list, not the filtered view: it is one action
        // on every blank rate, and a filter is only how you are looking.
        const fillable = all.filter(c => !customerRate(c) && _historicRate(c));
        return `
        <div class="lists-section">
          <div class="lists-hint">
            The rate fills in a row's Haul Fee once you name the customer. A row that
            already has a fee is left alone. Two spellings of one company?
            <strong>&#8676;</strong> folds one into the other and renames its rows.
          </div>
          <div class="lists-add-row">
            <input type="text" id="lists-new-customers" placeholder="Add customer…"
              onkeydown="if(event.key==='Enter')addToList('customers')">
            <input type="number" id="lists-new-customers-rate" class="li-rate" style="margin-left:0" step="0.01" min="0"
              placeholder="rate" title="Rate — optional" onkeydown="if(event.key==='Enter')addToList('customers')">
            <button class="lists-add-btn" onclick="addToList('customers')">Add</button>
          </div>
          ${fillable.length ? `
            <div class="lists-hint" style="margin-bottom:0.5rem">
              <button class="lists-link" onclick="fillRatesFromHistory()"
                title="Sets each blank rate to the fee that customer's own rows are billed at most often">
                Fill ${fillable.length} blank rate${fillable.length === 1 ? '' : 's'} from past rows
              </button>
            </div>` : ''}
          <div class="lists-items">
            ${items.length === 0
              ? emptyHTML('Customers', all.length)
              : items.map(c => {
                  if (merging('customers', c)) return mergeForm('customers', c);
                  const rate = customerRate(c);
                  const past = rate ? '' : _historicRate(c);
                  return `
                  <div class="lists-item">
                    <span class="li-name" title="${esc(c)}">${esc(c)}</span>
                    ${countChip('customers', c)}
                    <input type="number" class="li-rate" step="0.01" min="0"
                      value="${esc(rate)}" placeholder="${past ? esc(past) : 'rate'}"
                      title="${past ? 'Usually billed at ' + esc(past) + ' on past rows' : 'Rate this customer is billed at'}"
                      onchange="updateCustomerRate('${argEsc(c)}', this.value)">
                    ${mergeBtn('customers', c)}
                    ${delBtn('customers', c)}
                  </div>`;
                }).join('')
            }
          </div>
          ${removedHTML('customers', 'customers')}
        </div>`;
      };

      const locationsHTML = () => {
        const all   = divTruckLists.locations || [];
        const items = all.filter(l => l && (_listsMatch(l.name) || _listsMatch(l.address)));
        return `
        <div class="lists-section">
          <div class="lists-hint">
            Save a place once and pick it on an assignment — the address fills itself in,
            and the driver gets it on their phone.
          </div>
          <div class="lists-add-row" style="flex-wrap:wrap;gap:0.3rem">
            <input type="text" id="lists-new-loc-name" placeholder="Name — e.g. Pinetree Pit"
              style="flex:1;min-width:100%" onkeydown="if(event.key==='Enter')addLocation()">
            <input type="text" id="lists-new-loc-address" placeholder="Address…"
              style="flex:1;min-width:90px" onkeydown="if(event.key==='Enter')addLocation()">
            <button class="lists-add-btn" onclick="addLocation()">Add</button>
          </div>
          <div class="lists-items">
            ${items.length === 0
              ? emptyHTML('Locations', all.length)
              : items.map(l => `
                  <div class="lists-item">
                    <span class="li-name" style="white-space:normal">
                      ${esc(l.name)}
                      <span style="display:block;color:var(--muted);font-size:0.68rem;line-height:1.3">${esc(l.address) || 'no address'}</span>
                    </span>
                    <button class="lists-item-del" onclick="removeLocation('${argEsc(l.name)}')" title="Remove">&#10005;</button>
                  </div>`).join('')
            }
          </div>
        </div>`;
      };

      /* The type picker, on the add row and on every unit. The blank option is
         not "no type" — it is what the report will call this truck if nobody
         says, which for a unit named 3999 SPRAY is Spray Truck and for one
         named 2757 is Other. Saying so on the option is what keeps a whole
         list of blanks from looking like a job left half done. */
      const unitTypeOpts = (cur, name) => {
        const set   = String(cur == null ? '' : cur).trim();
        const known = UNIT_TYPE_LABEL[set] ? set : '';
        const guess = known ? '' : _guessUnitType(name);
        return `<option value="">${guess ? esc(UNIT_TYPE_LABEL[guess]) + ' (from the name)' : '— no type —'}</option>` +
          UNIT_TYPES.map(t =>
            `<option value="${t.key}"${t.key === known ? ' selected' : ''}>${esc(t.label)}</option>`).join('');
      };

      const unitsHTML = () => {
        const all   = divTruckLists.units || [];
        const items = all.filter(u => u && _listsMatch(u.name));
        return `
        <div class="lists-section">
          <div class="lists-hint">
            A unit's name, its number and what kind of truck it is are all fields — fix a
            typo here and the rows and assignments that carry it are renamed with it.
            The type is what sections the <strong>dispatch sheet</strong>: set it and 2757
            reads as a tri-axle instead of landing in Other.
          </div>
          <div class="lists-add-row" style="flex-wrap:wrap;gap:0.3rem;max-width:560px">
            <input type="text" id="lists-new-unit-name" placeholder="Unit Name…"
              style="flex:1;min-width:90px"
              onkeydown="if(event.key==='Enter')addUnit()">
            <input type="text" id="lists-new-unit-number" placeholder="# Number…"
              style="flex:1;min-width:75px"
              onkeydown="if(event.key==='Enter')addUnit()">
            <select id="lists-new-unit-type" class="li-type" style="max-width:130px"
              title="What kind of truck this is — the dispatch sheet groups by it">
              ${unitTypeOpts('', '')}
            </select>
            <button class="lists-add-btn" onclick="addUnit()">Add</button>
          </div>
          <div class="lists-items wide">
            ${items.length === 0
              ? emptyHTML('Units', all.length)
              : items.map(u => merging('units', u.name) ? mergeForm('units', u.name) : `
                  <div class="lists-item">
                    <input type="text" class="li-edit" value="${esc(u.name)}"
                      title="Unit name — renaming it renames the rows and assignments that carry it"
                      onkeydown="if(event.key==='Enter')this.blur()"
                      onchange="renameUnit('${argEsc(u.name)}',this.value)">
                    <input type="text" class="li-num" value="${esc(u.number)}" placeholder="#"
                      title="The number the office reads beside this unit on a row"
                      onkeydown="if(event.key==='Enter')this.blur()"
                      onchange="updateUnitNumber('${argEsc(u.name)}',this.value)">
                    <select class="li-type${UNIT_TYPE_LABEL[String(u.type || '').trim()] ? ' set' : ''}"
                      title="What kind of truck this is — the dispatch sheet groups by it"
                      onchange="updateUnitType('${argEsc(u.name)}',this.value)">
                      ${unitTypeOpts(u.type, u.name)}
                    </select>
                    ${countChip('units', u.name)}
                    ${mergeBtn('units', u.name)}
                    <button class="lists-item-del" style="margin-left:0.4rem" onclick="removeUnit('${argEsc(u.name)}')"
                      title="Remove from the picker. Rows that already name it keep it and still total the same.">&#10005;</button>
                  </div>`).join('')
            }
          </div>
          ${removedHTML('units', 'Units')}
        </div>`;
      };

      // One list at a time, and the strip says how many are in each — with a
      // filter running, how many of each MATCH, so a name you cannot find is
      // one click away rather than six lists of scrolling.
      const tabsEl = document.getElementById('lists-tabs');
      if (tabsEl) {
        const filtering = !!_listsFilter.trim();
        tabsEl.innerHTML = LISTS_TABS.map(t => {
          const names = _listsNamesFor(t.key);
          const n = filtering ? names.filter(_listsMatch).length : names.length;
          // Sign-ins with no driver name behind them, counted on the tab that
          // fixes it. Nobody opens a list to check it is still complete, and
          // the gap has no symptom on this screen — only on the driver's.
          const gap = (t.key !== 'drivers' || !_driverLoginsLoaded) ? 0
            : filtering
              ? _unlinkedLogins().filter(c => _listsMatch(c.username) || _listsMatch(c.guess)).length
              : _unlinkedLogins().length;
          return `<button class="lists-tab${t.key === _listsTab ? ' active' : ''}"
            onclick="listsOpenTab('${t.key}')"
            title="${filtering ? n + ' of ' + names.length + ' match' : names.length + ' in this list'}${
              gap ? ` — ${gap} sign-in${gap === 1 ? '' : 's'} with no name here` : ''}">
            ${esc(t.label)}<span class="n">${n}</span>${
              gap ? `<span class="n" style="color:var(--amber);opacity:1">+${gap}</span>` : ''}</button>`;
        }).join('');
      }

      const bodyFor = {
        drivers:   () => section('drivers',   'Drivers',   divTruckLists.drivers || []),
        customers: () => customersHTML(),
        units:     () => unitsHTML(),
        materials: () => section('materials', 'Materials', divTruckLists.materials || []),
        locations: () => locationsHTML(),
        logins:    () => driverLoginsHTML(esc),
      };
      const render = bodyFor[_listsTab] || bodyFor.drivers;

      document.getElementById('lists-panel-body').innerHTML = noteHTML() + undoHTML() + render();
    }

    function addToList(key) {
      const inp = document.getElementById('lists-new-' + key);
      if (!inp) return;
      const val = inp.value.trim();
      // A customer can be added with its rate in one go — the two boxes sit
      // side by side, and typing the name only to go find it again in the list
      // below is the long way round.
      const rateInp = key === 'customers' ? document.getElementById('lists-new-customers-rate') : null;
      if (val && rateInp && rateInp.value.trim()) setCustomerRate(val, rateInp.value);
      if (rateInp) rateInp.value = '';
      if (!val || divTruckLists[key].includes(val)) {
        inp.value = '';
        if (key === 'customers') { saveTruckLists(); renderListsPanel(); }
        return;
      }
      // Typing a name back in is how a deleted one comes back.
      _setRemovedName(key, val, false);
      _listsUndo = null;
      divTruckLists[key].push(val);
      divTruckLists[key].sort((a, b) => a.localeCompare(b));
      saveTruckLists();
      inp.value = '';
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    function removeFromList(key, val) {
      // Recorded, not just filtered: the loader re-seeds drivers and customers
      // from every stored row, so a name still on a historical row would
      // otherwise be back the next time the page opened.
      _setRemovedName(key, val, true);
      divTruckLists[key] = divTruckLists[key].filter(v => v !== val);
      _listsUndo = { kind: 'remove', key, value: val, uses: _countRowsNaming(key, val) };
      saveTruckLists();
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    /** How many stored rows name this thing. What the panel puts beside a name
     *  so a deletion is a decision rather than a guess. */
    function _countRowsNaming(key, val) {
      const k = _remKey(val);
      if (!k) return 0;
      const field = key === 'customers' ? 'customer' : key === 'drivers' ? 'driver' : key === 'units' ? 'unit' : null;
      if (!field) return 0;
      return divEntries.filter(e => _remKey(e[field]) === k).length;
    }

    /** Take back the last change to a list, from the bar it put up. */
    function undoListChange() {
      const u = _listsUndo;
      if (!u) return;
      _listsUndo = null;
      if (u.kind === 'merge') _undoMerge(u);
      else if (u.kind === 'rename') _undoRename(u);
      else if (u.kind === 'notdriver') restoreLoginCandidate(u.value);
      else restoreToList(u.key, u.value);
    }

    /** Open the merge form on one name, or shut it. */
    function openMerge(key, val) {
      _listsMerge = { key, from: String(val == null ? '' : val).trim() };
      renderListsPanel();
    }
    function cancelMerge() {
      _listsMerge = null;
      renderListsPanel();
    }
    /** Run the merge the open form describes. */
    function confirmMerge() {
      if (!_listsMerge) return;
      const sel = document.getElementById('lists-merge-into');
      const to  = sel ? (sel.value || '').trim() : '';
      if (!to) return;
      mergeIntoName(_listsMerge.key, _listsMerge.from, to);
    }

    /* ── The unlinked sign-ins offered on the drivers list ──
       Adding the name and linking the sign-in were always one job done in two
       places, and doing only the first is what leaves a driver signing in to
       an empty schedule with nothing to explain why. These do both. */

    /** Put a name on the drivers list and hand this sign-in to it, in one go.
     *  `idx` addresses the row's own box: usernames can differ by punctuation
     *  alone, so the position in the strip is what identifies it. */
    function addDriverFromLogin(username, idx) {
      const u   = String(username == null ? '' : username).trim();
      const inp = document.getElementById('lists-login-name-' + idx);
      const d   = inp ? String(inp.value == null ? '' : inp.value).trim() : '';
      if (!u || !d) { if (inp && inp.focus) inp.focus(); return; }
      // Typing a name in is how a deleted one comes back — the same rule the
      // add row above follows, and the reason a driver removed once can still
      // be offered here.
      _setRemovedName('drivers', d, false);
      if (!Array.isArray(divTruckLists.drivers)) divTruckLists.drivers = [];
      if (!divTruckLists.drivers.includes(d)) {
        divTruckLists.drivers.push(d);
        divTruckLists.drivers.sort((a, b) => String(a).localeCompare(String(b)));
      }
      _listsUndo = null;
      driverLoginMap[u] = d;
      saveTruckLists();
      saveDriverLogins();
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    /** Take the guess: link a sign-in to a name already on the list. */
    function linkLoginToDriver(username, driverName) {
      const u = String(username == null ? '' : username).trim();
      const d = String(driverName == null ? '' : driverName).trim();
      if (!u || !d) return;
      driverLoginMap[u] = d;
      saveDriverLogins();
      renderListsPanel();
    }

    /** "Not a driver" — an office login, and no amount of offering it will
     *  make it one. Kept with the lists rather than per-browser so one
     *  dispatcher's answer settles it for the rest. */
    function dismissLoginCandidate(username) {
      const u = String(username == null ? '' : username).trim();
      if (!u) return;
      if (!Array.isArray(divTruckLists.notDrivers)) divTruckLists.notDrivers = [];
      const k = u.toLowerCase();
      if (!divTruckLists.notDrivers.some(v => String(v).trim().toLowerCase() === k)) {
        divTruckLists.notDrivers.push(u);
      }
      _listsUndo = { kind: 'notdriver', value: u };
      saveTruckLists();
      renderListsPanel();
    }

    /** Offer a dismissed sign-in again. */
    function restoreLoginCandidate(username) {
      const u = String(username == null ? '' : username).trim();
      if (!u) return;
      const k = u.toLowerCase();
      divTruckLists.notDrivers = (divTruckLists.notDrivers || [])
        .filter(v => String(v).trim().toLowerCase() !== k);
      if (_listsUndo && _listsUndo.kind === 'notdriver'
          && String(_listsUndo.value).trim().toLowerCase() === k) _listsUndo = null;
      saveTruckLists();
      renderListsPanel();
    }

    /** Fold the dismissed-sign-ins strip open or shut. Its own flag rather
     *  than a key in _listsShowRemoved: that set is keyed by list name, and
     *  this sits under the drivers list without being part of it. */
    let _listsShowNotDrivers = false;
    function toggleNotDrivers() {
      _listsShowNotDrivers = !_listsShowNotDrivers;
      renderListsPanel();
    }

    /** Fold a section's removed-names strip open or shut. */
    function toggleRemoved(key) {
      if (_listsShowRemoved.has(key)) _listsShowRemoved.delete(key);
      else _listsShowRemoved.add(key);
      renderListsPanel();
    }

    /** Rate box beside a customer. Blank clears it. */
    function updateCustomerRate(name, value) {
      if (!setCustomerRate(name, value)) return;
      saveTruckLists();
      renderListsPanel();
    }

    /** Fill every blank rate from what that customer's own rows are billed at
     *  most often. The alternative is reading it off 1,944 rows by eye. */
    function fillRatesFromHistory() {
      let filled = 0;
      (divTruckLists.customers || []).forEach(c => {
        if (customerRate(c)) return;              // never overwrite a rate someone set
        const past = _historicRate(c);
        if (past && setCustomerRate(c, past)) filled++;
      });
      if (!filled) return;
      saveTruckLists();
      renderListsPanel();
    }

    /* ── Merging two spellings of the same thing ──
       Deleting a duplicate tidies the picker and leaves the rows alone, which
       is right for a name nobody should pick again. It is not enough for
       "kovalchick" and "Kovalchick": the rows still say two different things,
       so Analytics bills one company as two and the Scheduler boards it twice.
       Merging is the other half — it renames the spelling on the rows that
       carry it, then removes it from the picker.

       What it will not touch is a payroll-injected row: its driver, unit and
       customer come off an approved timesheet, and the server refuses this
       tab's writes to them (api/lib/injected-blob-guard.js). Those are counted
       and named rather than silently skipped — the fix for one is in Payroll. */
    const MERGE_FIELD = { customers: 'customer', drivers: 'driver', units: 'unit' };

    /** Rows naming `val` that this tab may rewrite, and the count of those it
     *  may not. Exact spelling: merging is what joins two spellings, so it must
     *  not quietly take a third along with them. */
    function _mergeTargets(key, val) {
      const field = MERGE_FIELD[key];
      const k = _remKey(val);
      const out = { ids: [], locked: 0 };
      if (!field || !k) return out;
      divEntries.forEach(e => {
        if (_remKey(e[field]) !== k) return;
        if (isPayrollRowId(e.id)) out.locked++;
        else out.ids.push(e.id);
      });
      return out;
    }

    /** The name this one is obviously a spelling of, if there is exactly one:
     *  same letters and digits, ignoring case, spaces and punctuation — which
     *  is what separates "kovalchick" from "Kovalchick" and "Kinkead HC" from
     *  "Kinkead". Ties go to the spelling more rows use, and anything less
     *  clear-cut is left for the office to choose. */
    function _mergeSuggestion(key, from, others) {
      const norm = v => String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9]/g, '');
      const k = norm(from);
      if (!k) return '';
      const same = (others || []).filter(o => norm(o) === k);
      if (same.length === 0) return '';
      return same.reduce((best, o) =>
        _countRowsNaming(key, o) > _countRowsNaming(key, best) ? o : best, same[0]);
    }

    /** Fold `from` into `to`: rename the rows, then drop `from` from the list. */
    async function mergeIntoName(key, from, to) {
      const field = MERGE_FIELD[key];
      const src = String(from == null ? '' : from).trim();
      const dst = String(to == null ? '' : to).trim();
      if (!field || !src || !dst || _remKey(src) === _remKey(dst)) return;

      const { ids, locked } = _mergeTargets(key, src);
      const idSet = new Set(ids);
      divEntries.forEach(e => { if (idSet.has(e.id)) e[field] = dst; });

      // The picker loses the spelling, and the sweep is told so — a payroll row
      // still naming it would otherwise put it straight back.
      _setRemovedName(key, src, true);
      if (key === 'units') {
        _keepRemovedUnit(src);
        divTruckLists.units = (divTruckLists.units || []).filter(u => u && u.name !== src);
      } else {
        divTruckLists[key] = (divTruckLists[key] || []).filter(v => v !== src);
      }

      // A rate follows its company, but never over one already set: the
      // surviving name's rate is the one the office chose to keep.
      let rateMoved = false;
      if (key === 'customers') {
        const srcRate = customerRate(src);
        if (srcRate && !customerRate(dst)) rateMoved = setCustomerRate(dst, srcRate);
      }

      // A sign-in points at a driver by name, so a merged name leaves the phone
      // matching nothing and the driver seeing an empty board.
      const logins = [];
      if (key === 'drivers') {
        Object.keys(driverLoginMap || {}).forEach(u => {
          if (_remKey(driverLoginMap[u]) === _remKey(src)) { driverLoginMap[u] = dst; logins.push(u); }
        });
        if (logins.length) saveDriverLogins();
      }

      // The boards name the same people and companies — both of them, so the
      // rename is applied to each rather than to whichever sub-tab happens to
      // be open. Loaded first on purpose: renaming an empty board and marking
      // it dirty is how a merge could cost someone their week's assignments.
      const sched = [];
      if (MERGE_FIELD[key] && (field === 'driver' || field === 'customer' || field === 'unit')) {
        for (const cfg of SCHED_BOARDS) {
          try { await schedEnsureLoaded(cfg.id); } catch { /* board stays as it is */ }
          const st = schedS(cfg.id);
          if (!st.loaded) continue;
          let hit = 0;
          Object.keys(st.assignments || {}).forEach(d => {
            (st.assignments[d] || []).forEach(a => {
              if (a && _remKey(a[field]) === _remKey(src)) {
                a[field] = dst; hit++; sched.push({ board: cfg.id, d, id: a.id });
              }
            });
          });
          if (hit) schedMarkDirty(cfg.id);
        }
      }

      _listsUndo = { kind: 'merge', key, field, from: src, to: dst,
                     ids, locked, rateMoved, logins, sched };
      _listsMerge = null;
      saveTruckLists();
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    /** Unpick a merge: every row, link and assignment it renamed carried the
     *  same old name, so putting them back is setting that name again. */
    function _undoMerge(u) {
      const idSet = new Set(u.ids);
      divEntries.forEach(e => { if (idSet.has(e.id)) e[u.field] = u.from; });
      (u.logins || []).forEach(usr => { if (driverLoginMap) driverLoginMap[usr] = u.from; });
      if ((u.logins || []).length) saveDriverLogins();
      // Grouped by board: an undo written before the labor board existed has
      // no board on its rows, so those go back to the trucking board.
      SCHED_BOARDS.forEach(cfg => {
        const ids = (u.sched || []).filter(x => (x.board || 'trucking') === cfg.id);
        const st  = schedS(cfg.id);
        if (!ids.length || !st.loaded) return;
        const back = new Set(ids.map(x => x.id));
        Object.keys(st.assignments || {}).forEach(d =>
          (st.assignments[d] || []).forEach(a => { if (a && back.has(a.id)) a[u.field] = u.from; }));
        schedMarkDirty(cfg.id);
      });
      if (u.rateMoved) setCustomerRate(u.to, '');
      // Last, because it is what saves the whole undo and redraws behind it.
      restoreToList(u.key, u.from);
    }

    /** Put a deleted name back. Clears the record of the deletion and re-adds
     *  the name, so the next load's re-seed leaves it alone either way. */
    function restoreToList(key, val) {
      const v = String(val == null ? '' : val).trim();
      if (!v) return;
      _setRemovedName(key, v, false);
      if (_listsUndo && _listsUndo.key === key && _remKey(_listsUndo.value || _listsUndo.from) === _remKey(v)) _listsUndo = null;
      if (key === 'units') {
        // The number and the type came off the list with the name. Putting a
        // unit back without them leaves every row that names it showing a
        // blank and the dispatch sheet filing it under Other, so both are kept
        // with the removal and handed back here.
        if (!divTruckLists.units.some(u => u && u.name === v)) {
          divTruckLists.units.push({ name: v, number: _removedUnitNumber(v), type: _removedUnitType(v) });
        }
        _forgetRemovedUnit(v);
        divTruckLists.units.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      } else {
        if (!Array.isArray(divTruckLists[key])) divTruckLists[key] = [];
        if (!divTruckLists[key].includes(v)) divTruckLists[key].push(v);
        divTruckLists[key].sort((a, b) => String(a).localeCompare(String(b)));
      }
      saveTruckLists();
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    /* ── Saved locations ──
       A haul goes to a place, and the place gets typed the same way every
       week. Kept as its own roster rather than as an address on the customer:
       a customer can have several — two pits, a yard, a job site — and the
       assignment has to say which one. */
    function addLocation() {
      const nameInp = document.getElementById('lists-new-loc-name');
      const addrInp = document.getElementById('lists-new-loc-address');
      if (!nameInp || !addrInp) return;
      const name    = nameInp.value.trim();
      const address = addrInp.value.trim();
      if (!name) return;
      // Re-adding a name updates its address rather than leaving two entries
      // the picker cannot tell apart.
      const at = divTruckLists.locations.findIndex(l => l && l.name === name);
      if (at !== -1) divTruckLists.locations[at] = { name, address };
      else divTruckLists.locations.push({ name, address });
      divTruckLists.locations.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      saveTruckLists();
      nameInp.value = '';
      addrInp.value = '';
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    function removeLocation(name) {
      divTruckLists.locations = divTruckLists.locations.filter(l => l && l.name !== name);
      saveTruckLists();
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    function addUnit() {
      const nameInp = document.getElementById('lists-new-unit-name');
      const numInp  = document.getElementById('lists-new-unit-number');
      const typeInp = document.getElementById('lists-new-unit-type');
      if (!nameInp || !numInp) return;
      const name   = nameInp.value.trim();
      const number = numInp.value.trim();
      // A unit goes onto the list with its type in one go — the three boxes sit
      // side by side, and typing the name only to go find it again in the list
      // below is the long way round.
      const type   = typeInp ? String(typeInp.value || '').trim() : '';
      if (!name) return;
      if (divTruckLists.units.some(u => u.name === name)) {
        nameInp.value = ''; numInp.value = '';
        if (typeInp) typeInp.value = '';
        return;
      }
      _setRemovedName('units', name, false);
      _listsNote = '';
      divTruckLists.units.push({ name, number, type: UNIT_TYPE_LABEL[type] ? type : '' });
      divTruckLists.units.sort((a, b) => a.name.localeCompare(b.name));
      saveTruckLists();
      nameInp.value = '';
      numInp.value  = '';
      if (typeInp) typeInp.value = '';
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    function removeUnit(name) {
      _setRemovedName('units', name, true);
      _keepRemovedUnit(name);
      divTruckLists.units = divTruckLists.units.filter(u => u.name !== name);
      _listsNote = '';
      _listsUndo = { kind: 'remove', key: 'units', value: name, uses: _countRowsNaming('units', name) };
      saveTruckLists();
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    /** The number painted on the truck. Nothing else carries it — a row shows
     *  whatever the unit says today — so this is a list edit and no more. */
    function updateUnitNumber(name, value) {
      const rec = unitRecord(name);
      if (!rec) return;
      const next = String(value == null ? '' : value).trim();
      if (next === String(rec.number == null ? '' : rec.number).trim()) return;
      rec.number = next;
