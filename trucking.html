      _listsNote = '';
      saveTruckLists();
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    /** What kind of truck this is. Redraws the scheduler because the dispatch
     *  sheet is sectioned by it — the change is on the sheet, not just here. */
    function updateUnitType(name, value) {
      const rec = unitRecord(name);
      if (!rec) return;
      const raw  = String(value == null ? '' : value).trim();
      const next = UNIT_TYPE_LABEL[raw] ? raw : '';
      if (next === String(rec.type == null ? '' : rec.type).trim()) return;
      rec.type = next;
      _listsNote = '';
      saveTruckLists();
      renderListsPanel();
      if (schedIsActive()) renderScheduler();
    }

    /* Renaming a unit is not a list edit. Every row and assignment stores the
       unit as the plain string it was typed as, so changing the name here
       alone would leave them naming a unit that no longer exists — and the
       loader's sweep, which re-seeds any unit name it finds on a row, would
       put the old one straight back as a second unit. The rows come too. */
    async function renameUnit(oldName, value) {
      const rec  = unitRecord(oldName);
      if (!rec) return;
      const from = _remKey(rec.name);
      const to   = _remKey(value);
      // An empty box or the same name again is a field the office tabbed
      // through. Redrawn rather than left as typed, so the row shows what is
      // actually stored.
      if (!to || to === from) { renderListsPanel(); return; }

      // Two units cannot share a name, and folding one into the other is a
      // different operation with different consequences — it rewrites stored
      // rows onto a unit that already has its own history. Said, not guessed.
      if ((divTruckLists.units || []).some(u => u && u !== rec && _remKey(u.name) === to)) {
        _listsNote = `There is already a unit named ${to} — use \u21e4 on ${from} to fold it into ${to} instead.`;
        renderListsPanel();
        return;
      }

      // Payroll owns its own rows; they keep the old name and are counted out
      // loud rather than rewritten from here.
      const { ids, locked } = _mergeTargets('units', from);
      const idSet = new Set(ids);
      divEntries.forEach(e => { if (idSet.has(e.id)) e.unit = to; });

      // Both boards name the truck. Loaded first on purpose: renaming an empty
      // board and marking it dirty is how this could cost a week of work.
      const sched = [];
      for (const cfg of SCHED_BOARDS) {
        try { await schedEnsureLoaded(cfg.id); } catch { /* board stays as it is */ }
        const st = schedS(cfg.id);
        if (!st.loaded) continue;
        let hit = 0;
        Object.keys(st.assignments || {}).forEach(d => {
          (st.assignments[d] || []).forEach(a => {
            if (a && _remKey(a.unit) === from) { a.unit = to; hit++; sched.push({ board: cfg.id, d, id: a.id }); }
          });
        });
        if (hit) schedMarkDirty(cfg.id);
      }

      rec.name = to;
      divTruckLists.units.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      // Only when something the rename could not reach still names it: the
      // sweep would otherwise read that payroll row and hand the old name back
      // as a unit of its own on the next load. The number goes with the record
      // of it, the same as a removal, so Put back hands back a whole unit.
      if (locked) { _keepRemovedUnit(from); _setRemovedName('units', from, true); }
      _listsNote = '';
      _listsUndo = { kind: 'rename', key: 'units', field: 'unit', from, to, ids, locked, sched, removed: !!locked };
      saveTruckLists();
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    /** Put a rename back: the rows, the assignments and the unit itself all
     *  carried one string, so undoing it is setting that string again. */
    function _undoRename(u) {
      const idSet = new Set(u.ids);
      divEntries.forEach(e => { if (idSet.has(e.id)) e[u.field] = u.from; });
      SCHED_BOARDS.forEach(cfg => {
        const ids = (u.sched || []).filter(x => (x.board || 'trucking') === cfg.id);
        const st  = schedS(cfg.id);
        if (!ids.length || !st.loaded) return;
        const back = new Set(ids.map(x => x.id));
        Object.keys(st.assignments || {}).forEach(d =>
          (st.assignments[d] || []).forEach(a => { if (a && back.has(a.id)) a[u.field] = u.from; }));
        schedMarkDirty(cfg.id);
      });
      const rec = unitRecord(u.to);
      if (rec) rec.name = u.from;
      if (u.removed) { _setRemovedName('units', u.from, false); _forgetRemovedUnit(u.from); }
      (divTruckLists.units || []).sort((a, b) => String(a.name).localeCompare(String(b.name)));
      saveTruckLists();
      renderListsPanel();
      renderTrackingTab();
      if (schedIsActive()) renderScheduler();
    }

    function schedSave() {
      _isSaved = false;
      const el = document.getElementById('save-status');
      if (el) el.style.display = 'none';
      clearTimeout(_saveTimer);
      _saveTimer = setTimeout(() => {
        tdDivPut();
        _isSaved = true;
        const el2 = document.getElementById('save-status');
        if (el2) el2.style.display = '';
      }, 600);
    }

    function nextTaskNum() {
      const nums = divEntries.map(e => {
        const m = (e.task_number || '').match(/^TR-(\d+)$/);
        return m ? parseInt(m[1], 10) : 0;
      });
      return 'TR-' + String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4, '0');
    }

    function addRow() {
      const countEl = document.getElementById('bulk-add-count');
      const count = Math.min(Math.max(parseInt(countEl?.value) || 1, 1), 100);
      const today = new Date().toISOString().slice(0, 10);
      let defaultDate = today;
      if (activeYearFilter !== 'all' && !today.startsWith(activeYearFilter)) {
        defaultDate = activeYearFilter + '-01-01';
      }
      for (let i = 0; i < count; i++) {
        divEntries.unshift({
          id: crypto.randomUUID(),
          task_number: nextTaskNum(),
          actual_date: defaultDate, driver: '', unit: '',
          actual_start: '', actual_end: '',
          total_hours: '', haul_fee: '',
          customer: '', description: '', division: '', notes: ''
        });
      }
      schedSave();
      renderTrackingTab();
    }

    function deleteRow(id) {
      // Payroll-injected rows (tst- prefix) are locked — remove them by
      // un-approving the timesheet entry in Payroll, not from here.
      if (String(id).startsWith('tst-')) return;
      divEntries = divEntries.filter(e => e.id !== id);
      schedSave();
      renderTrackingTab();
    }

    function toggleInvoiceRow(id) {
      if (expandedRows.has(id)) {
        expandedRows.delete(id);
        const row   = document.getElementById('inv-row-' + id);
        const caret = document.getElementById('caret-' + id);
        if (row)   row.style.display = 'none';
        if (caret) caret.style.transform = 'rotate(0deg)';
      } else {
        expandedRows.add(id);
        const row   = document.getElementById('inv-row-' + id);
        const caret = document.getElementById('caret-' + id);
        if (row)   row.style.display = 'table-row';
        if (caret) caret.style.transform = 'rotate(90deg)';
      }
    }

    function _toggleDrillRow(key, setRef, rowPrefix, caretPrefix) {
      if (setRef.has(key)) {
        setRef.delete(key);
        const r = document.getElementById(rowPrefix + key);
        const c = document.getElementById(caretPrefix + key);
        if (r) r.style.display = 'none';
        if (c) c.style.transform = 'rotate(0deg)';
      } else {
        setRef.add(key);
        const r = document.getElementById(rowPrefix + key);
        const c = document.getElementById(caretPrefix + key);
        if (r) r.style.display = 'table-row';
        if (c) c.style.transform = 'rotate(90deg)';
      }
    }
    function toggleEquipRow(key)  { _toggleDrillRow(key, expandedEquipRows,  'equ-sub-', 'equ-c-'); }
    function toggleDriverRow(key) { _toggleDrillRow(key, expandedDriverRows, 'drv-sub-', 'drv-c-'); }

    function calcHours(start, end) {
      if (!start || !end) return null;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      if ([sh, sm, eh, em].some(isNaN)) return null;
      let mins = (eh * 60 + em) - (sh * 60 + sm);
      if (mins < 0) mins += 24 * 60;
      return Math.round(mins / 60 * 100) / 100;
    }

    // Format a 24-hour "HH:MM" as 12-hour "HH:MM AM/PM" so read-only (locked)
    // rows match the native time-input display on editable rows. Leaves anything
    // that isn't a HH:MM value untouched.
    function fmtTime12(hhmm) {
      const m = String(hhmm || '').trim().match(/^(\d{1,2}):(\d{2})/);
      if (!m) return String(hhmm || '');
      let h = parseInt(m[1], 10);
      const ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12; if (h === 0) h = 12;
      return String(h).padStart(2, '0') + ':' + m[2] + ' ' + ap;
    }

    // Updates time field in memory and refreshes hours/total display without triggering a save.
    // Called by oninput so the display stays live while the user is still typing.
    function _liveHours(id, field, value) {
      const e = divEntries.find(e => e.id === id);
      if (!e) return;
      e[field] = value;
      const calc = calcHours(e.actual_start, e.actual_end);
      if (calc !== null) {
        e.total_hours = calc;
        const hrsEl = document.getElementById('th-hrs-' + id);
        if (hrsEl) hrsEl.value = calc;
        const totEl = document.getElementById('td-tot-' + id);
        if (totEl) {
          const tot = calc * (parseFloat(e.haul_fee) || 0);
          totEl.textContent = '$' + tot.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
      }
    }

    /* ═══════════════════════════════════════════
       TYPEAHEAD COMBOBOX
       Replaces native <select> for driver / customer / unit dropdowns.
       Native typeahead jumps to the first match of the typed letter and
       resets after ~500ms — so typing a name slowly lands on the wrong
       option without warning. This combobox filters as you type and only
       commits the option the user actually picks (free text is preserved
       so renamed/typo'd drivers don't silently vanish from existing rows).
    ═══════════════════════════════════════════ */
    const _cbState = new WeakMap();
    const _cbEscape = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    function cbHtml(uid, field, currentValue, placeholder) {
      const ph = placeholder == null ? '— select —' : placeholder;
      return `<div class="cb" data-uid="${_cbEscape(String(uid))}" data-field="${_cbEscape(field)}">` +
        `<input type="text" class="cb-input" value="${_cbEscape(currentValue || '')}" ` +
          `placeholder="${_cbEscape(ph)}" autocomplete="off" spellcheck="false" ` +
          `onfocus="cbOnFocus(this)" oninput="cbOnInput(this)" ` +
          `onkeydown="cbOnKey(event, this)" onblur="cbOnBlur(this)">` +
        `<div class="cb-menu" hidden></div>` +
      `</div>`;
    }

    /** Names list for the dropdown identified by (uid=entry.id, field). */
    function cbOptionsFor(uid, field) {
      if (field === 'driver')   return (divTruckLists.drivers   || []).slice().sort((a,b) => String(a).localeCompare(String(b)));
      if (field === 'customer') return (divTruckLists.customers || []).slice().sort((a,b) => String(a).localeCompare(String(b)));
      if (field === 'unit')     return (divTruckLists.units || []).map(u => u && u.name).filter(Boolean).slice().sort((a,b) => a.localeCompare(b));
      return [];
    }

    /** Commit the user's selection — routes through the existing
     *  updateField so the no-op guard, save scheduling, and any other
     *  side effects continue to apply. */
    function cbDispatch(uid, field, value) {
      const cur = (divEntries.find(e => e.id === uid) || {})[field] || '';
      if (cur === value) return; // no-op guard
      updateField(uid, field, value);
    }

    function cbOnFocus(input) {
      const cb = input.closest('.cb');
      if (!cb) return;
      const options = cbOptionsFor(cb.dataset.uid, cb.dataset.field);
      _cbState.set(input, {
        options,
        filtered: options,
        highlight: Math.max(0, options.indexOf(input.value)),
        originalValue: input.value,
      });
      cbRenderMenu(input);
      input.select();
    }
    function cbOnInput(input) {
      const state = _cbState.get(input);
      if (!state) return;
      const q = input.value.trim().toLowerCase();
      state.filtered = q ? state.options.filter(o => o.toLowerCase().includes(q)) : state.options;
      const exact = state.filtered.findIndex(o => o.toLowerCase() === q);
      state.highlight = exact >= 0 ? exact : (state.filtered.length ? 0 : -1);
      cbRenderMenu(input);
    }
    function cbOnKey(event, input) {
      const state = _cbState.get(input);
      if (!state) return;
      const list = state.filtered;
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        if (list.length) { state.highlight = (state.highlight + 1) % list.length; cbRenderMenu(input); cbScrollHi(input); }
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (list.length) { state.highlight = (state.highlight - 1 + list.length) % list.length; cbRenderMenu(input); cbScrollHi(input); }
      } else if (event.key === 'Enter') {
        event.preventDefault();
        const pick = list[state.highlight];
        if (pick != null) input.value = pick;
        cbCommitInput(input);
        input.blur();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        input.value = state.originalValue;
        cbClose(input);
        input.blur();
      } else if (event.key === 'Tab') {
        const pick = list[state.highlight];
        if (pick != null) input.value = pick;
        cbCommitInput(input);
      }
    }
    function cbOnBlur(input) {
      setTimeout(() => { if (document.activeElement !== input) cbCommitInput(input); }, 120);
    }
    function cbRenderMenu(input) {
      const state = _cbState.get(input);
      const menu = input.nextElementSibling;
      if (!state || !menu) return;
      if (state.filtered.length === 0) {
        menu.innerHTML = '<div class="cb-opt-empty">No matches — value will be saved as typed</div>';
      } else {
        menu.innerHTML = state.filtered.map((opt, i) =>
          `<div class="cb-opt${i === state.highlight ? ' hi' : ''}" data-val="${_cbEscape(opt)}">${_cbEscape(opt)}</div>`
        ).join('');
      }
      menu.hidden = false;
    }
    function cbScrollHi(input) {
      const hi = input.nextElementSibling && input.nextElementSibling.querySelector('.cb-opt.hi');
      if (hi) hi.scrollIntoView({ block: 'nearest' });
    }
    function cbClose(input) {
      const menu = input.nextElementSibling;
      if (menu) menu.hidden = true;
      _cbState.delete(input);
    }
    function cbCommitInput(input) {
      const cb = input.closest('.cb');
      if (!cb) return;
      const value = input.value.trim();
      cbClose(input);
      cbDispatch(cb.dataset.uid, cb.dataset.field, value);
    }
    document.addEventListener('mousedown', (e) => {
      const opt = e.target.closest('.cb-opt');
      if (opt) {
        const menu = opt.closest('.cb-menu');
        if (!menu) return;
        e.preventDefault();
        const input = menu.previousElementSibling;
        if (input) {
          input.value = opt.dataset.val || '';
          cbCommitInput(input);
          input.blur();
        }
        return;
      }
      const cb = e.target.closest('.cb');
      document.querySelectorAll('.cb-menu:not([hidden])').forEach(m => {
        if (m.closest('.cb') !== cb) {
          const input = m.previousElementSibling;
          if (input) cbClose(input);
        }
      });
    });

    /** Re-total a row and keep its Intercompany Billing mirror in step. */
    function _syncRowTotal(e) {
      const tot = (parseFloat(e.total_hours) || 0) * (parseFloat(e.haul_fee) || 0);
      const el  = document.getElementById('td-tot-' + e.id);
      if (el) el.textContent = '$' + tot.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const icIdx = icBillingArr.findIndex(x => x.source === 'trucking' && x.source_id === e.id);
      if (icIdx >= 0) {
        icBillingArr[icIdx].total_hours = e.total_hours;
        icBillingArr[icIdx].haul_fee    = e.haul_fee;
        icBillingArr[icIdx].total       = tot;
        icSentMap.set(e.id, icBillingArr[icIdx]);
        _icBillingDirty = true;
      }
    }

    function updateField(id, field, value) {
      const e = divEntries.find(e => e.id === id);
      if (!e) return;
      e[field] = value;

      if (field === 'actual_start' || field === 'actual_end') {
        const calc = calcHours(e.actual_start, e.actual_end);
        if (calc !== null) {
          e.total_hours = calc;
          const hrsEl = document.getElementById('th-hrs-' + id);
          if (hrsEl) hrsEl.value = calc;
        }
      }

      if (['total_hours', 'haul_fee', 'actual_start', 'actual_end'].includes(field)) _syncRowTotal(e);

      if (field === 'customer') {
        // The rate is a fact about the company, so a row that names one bills
        // at it without anyone typing the number again. Only ever onto a blank
        // fee: a row already carrying one was priced deliberately, and quietly
        // restating an invoiced haul is the one thing this must not do.
        const rate = customerRate(value);
        if (rate && !(parseFloat(e.haul_fee) || 0)) {
          e.haul_fee = rate;
          const feeEl = document.getElementById('th-fee-' + id);
          if (feeEl) feeEl.value = rate;
          _syncRowTotal(e);
        }
      }
      if (field === 'unit') {
        const unit  = divTruckLists.units.find(u => u.name === value);
        const numEl = document.getElementById('unit-num-' + id);
        if (numEl) numEl.textContent = unit ? unit.number : '';
      }
      schedSave();
    }

    /* ═══════════════════════════════════════════
       BACKUP HAUL FEE  (payroll-injected rows)
       Every cost column on a "← Timesheet" row is payroll's and renders
       read-only, because the timesheet entry is where that data belongs. The
       fee was the one field where that rule cost more than it protected: a
       haul approved with no fee — nobody typed one in the approve modal and
       the customer has no rate set — lands here at $0.00, and THIS is the tab
       where somebody notices, because it is the tab the invoice comes out of.
       Fixing it meant finding the entry in Payroll, un-approving it and
       re-approving it with a fee.

       So the fee box stays open on a locked row, as a backup rather than a
       takeover. What is typed here is stored as haul_fee_override beside
       payroll's own figure, never on top of it — the server derives haul_fee
       from the pair (api/lib/truck-injected.js, "The backup haul fee"), so
       every reader that prices a haul off haul_fee needs to know nothing about
       any of this. Payroll goes on owning the fee: it can still correct one
       from the entry, the row says when the two disagree, and clearing the box
       hands the number straight back.
    ═══════════════════════════════════════════ */

    // The server's fee gate, restated: '' for "nobody has set one", a rounded
    // number for a price, null for something that is not one. Kept in step with
    // normalizeHaulFee in api/lib/truck-injected.js — a box the page accepts
    // and the server then drops is a fee that vanishes on the next load.
    const HAUL_FEE_MAX = 1e7;
    function _feeVal(v) {
      if (v == null || String(v).trim() === '') return '';
      const n = Number(v);
      if (!Number.isFinite(n) || n < 0 || n > HAUL_FEE_MAX) return null;
      return Math.round(n * 10000) / 10000;
    }
    const _sameFee = (a, b) => {
      const x = _feeVal(a), y = _feeVal(b);
      return x !== null && y !== null && x === y;
    };

    /** Is a backup fee standing on this row? */
    function _hasBackupFee(e) {
      return !!e && isPayrollRowId(e.id) && _feeVal(e.haul_fee_override) !== ''
        && _feeVal(e.haul_fee_override) !== null;
    }

    /** Payroll's own fee for a row — behind the override when one stands. */
    function _payrollFee(e) {
      if (!e) return '';
      return _hasBackupFee(e) ? (e.haul_fee_payroll == null ? '' : e.haul_fee_payroll) : e.haul_fee;
    }

    /** Settle haul_fee from the override, exactly as the server will on save. */
    function _applyBackupFee(e) {
      const payroll = Object.prototype.hasOwnProperty.call(e, 'haul_fee_payroll')
        ? e.haul_fee_payroll
        : e.haul_fee;
      const v = _feeVal(e.haul_fee_override);
      if (v === null || v === '' || _sameFee(v, payroll)) {
        delete e.haul_fee_override;
        delete e.haul_fee_payroll;
        e.haul_fee = payroll == null ? '' : payroll;
      } else {
        e.haul_fee_override = v;
        e.haul_fee_payroll  = payroll == null ? '' : payroll;
        e.haul_fee          = v;
      }
    }

    /**
     * The note under an overridden fee: that it was set here, what payroll says
     * instead, and a click that goes back to payroll's answer. Payroll's figure
     * is labelled rather than shown bare — an unlabelled number under a fee box
     * reads as the fee.
     */
    function _backupFeeNote(e) {
      if (!_hasBackupFee(e)) return '';
      const pay  = _feeVal(_payrollFee(e));
      const has  = pay !== '' && pay !== null;
      const said = has
        ? '$' + Number(pay).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        : '';
      const label = has ? `&#8635; set here &middot; payroll ${said}` : '&#8635; set here';
      const title = has
        ? `Set in this tab, not in Payroll. Payroll has ${said} on this haul — click to bill payroll's figure instead.`
        : 'Set in this tab, not in Payroll. Payroll has no fee on this haul — click to clear this one and leave the haul unpriced.';
      return `<span onclick="clearBackupFee('${e.id}')" title="${title}" style="cursor:pointer;font-size:0.6rem;color:#fbbf24;white-space:nowrap">${label}</span>`;
    }

    /** Repaint one row's fee box, its note and its total after a fee change. */
    function _paintBackupFee(e) {
      const box = document.getElementById('th-fee-' + e.id);
      if (box) box.value = e.haul_fee == null ? '' : e.haul_fee;
      const note = document.getElementById('fee-ovr-' + e.id);
      if (note) note.innerHTML = _backupFeeNote(e);
      _syncRowTotal(e);
    }

    /**
     * Price a locked row from the tab. Refuses anything that is not a price and
     * puts the box back, rather than saving a figure the server would drop.
     * A blank clears the override and returns payroll's number.
     */
    function setBackupFee(id, value) {
      const e = divEntries.find(x => x.id === id);
      if (!e || !isPayrollRowId(id)) return;
      const v = _feeVal(value);
      if (v === null) { _paintBackupFee(e); return; }
      e.haul_fee_override = v;
      _applyBackupFee(e);
      _paintBackupFee(e);
      schedSave();
    }

    function clearBackupFee(id) { setBackupFee(id, ''); }

    /* ═══════════════════════════════════════════
       COLUMN FILTERS
    ═══════════════════════════════════════════ */
    let trColFilters      = {};
    let _activeFilterFld  = null;
    const expandedRows     = new Set();
    const expandedEquipRows  = new Set();
    const expandedDriverRows = new Set();

    function setColFilter(field, val) {
      _activeFilterFld = field;
      if (val) trColFilters[field] = val;
      else delete trColFilters[field];
      renderTrackingTab();
    }

    function applyColFilters(entries) {
      const active = Object.entries(trColFilters).filter(([, v]) => v);
      if (!active.length) return entries;
      return entries.filter(e =>
        active.every(([field, val]) =>
          String(e[field] || '').toLowerCase().includes(val.toLowerCase())
        )
      );
    }

    /* ═══════════════════════════════════════════
       TRUCK TRACKING — RENDER
    ═══════════════════════════════════════════ */
    function renderTrackingTab() {
      const root = document.getElementById('tab-truck-tracking');
      if (!root) return;

      const esc = s => String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      const driverOpts = cur => '<option value="">— select —</option>' +
        divTruckLists.drivers.map(d =>
          `<option value="${esc(d)}"${d === cur ? ' selected' : ''}>${esc(d)}</option>`
        ).join('');

      const customerOpts = cur => '<option value="">— select —</option>' +
        divTruckLists.customers.map(c =>
          `<option value="${esc(c)}"${c === cur ? ' selected' : ''}>${esc(c)}</option>`
        ).join('');

      const unitOpts = cur => '<option value="">— select —</option>' +
        divTruckLists.units.map(u =>
          `<option value="${esc(u.name)}"${u.name === cur ? ' selected' : ''}>${esc(u.name)}</option>`
        ).join('');

      const inp = (id, field, type, placeholder, val, elId) =>
        `<input type="${type}"${elId ? ` id="${elId}"` : ''} value="${esc(val || '')}"
          placeholder="${placeholder}"
          onchange="updateField('${id}','${field}',this.value)"
          style="width:100%;background:transparent;border:none;color:var(--text);font-size:0.8rem;outline:none;padding:0.15rem 0">`;

      const sel = (id, field, opts) =>
        `<select onchange="updateField('${id}','${field}',this.value)"
          style="background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.8rem;width:100%;padding:0.1rem 0.2rem">${opts}</select>`;

      // ── Year tabs + column filter ──
      const dataYears = [...new Set(
        divEntries.map(e => (e.actual_date || '').slice(0, 4)).filter(y => /^\d{4}$/.test(y))
      )].sort();
      const tabYears = [...new Set([...dataYears, '2025', '2026'])].sort();

      const yearFiltered = activeYearFilter === 'all'
        ? divEntries
        : divEntries.filter(e => (e.actual_date || '').startsWith(activeYearFilter));

      const filteredEntries = applyColFilters(yearFiltered)
        .slice().sort((a, b) => (b.actual_date || '').localeCompare(a.actual_date || '') || (b.task_number || '').localeCompare(a.task_number || ''));

      // ── Totals ──
      let sumHours = 0, sumRevenue = 0;
      filteredEntries.forEach(e => {
        const h = parseFloat(e.total_hours) || 0;
        const f = parseFloat(e.haul_fee)    || 0;
        sumHours   += h;
        sumRevenue += h * f;
      });
      const fmtMoney = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      const totalsHTML = `
        <div class="totals-bar">
          <span><span class="lbl">Total Hours</span><span class="val">${sumHours.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2})}</span></span>
          <span><span class="lbl">Total Revenue</span><span class="val">${fmtMoney(sumRevenue)}</span></span>
          <span><span class="lbl">Entries</span><span class="val">${filteredEntries.length}</span></span>
        </div>`;

      const yearTabsHTML = `
        <div class="yr-tabs">
          <button class="yr-tab${activeYearFilter === 'all' ? ' active' : ''}" onclick="setYearFilter('all')">All</button>
          ${tabYears.map(y => `<button class="yr-tab${activeYearFilter === y ? ' active' : ''}" onclick="setYearFilter('${y}')">${y}</button>`).join('')}
          <span class="yr-row-count">${filteredEntries.length} of ${divEntries.length} row${divEntries.length === 1 ? '' : 's'}</span>
        </div>`;

      // ── Filter input helper ──
      const fi = field => {
        const v = trColFilters[field] || '';
        return `<input type="text" value="${esc(v)}" placeholder="filter…"
          data-filter-field="${field}"
          oninput="setColFilter('${field}',this.value)">`;
      };

      const invInp = (id, field, type, placeholder, val) =>
        `<input type="${type}" value="${esc(val || '')}"
          placeholder="${placeholder}"
          onchange="updateField('${id}','${field}',this.value)"
          style="background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.8rem;padding:0.2rem 0.4rem;width:100%;outline:none">`;

      const invSel = (id, field, cur) => {
        const opts = ['Unpaid','Paid','Partial'].map(v=>
          `<option${v===cur?' selected':''}>${v}</option>`).join('');
        return `<select onchange="updateField('${id}','${field}',this.value)"
          style="background:var(--surface);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.8rem;padding:0.2rem 0.4rem;width:100%">${opts}</select>`;
      };

      const rowsHTML = divEntries.length === 0
        ? `<tr><td colspan="15" style="padding:1.5rem;text-align:center;color:var(--muted);font-size:0.85rem">No entries yet — click + Add Row to begin.</td></tr>`
        : filteredEntries.length === 0
        ? `<tr><td colspan="15" style="padding:1.5rem;text-align:center;color:var(--muted);font-size:0.85rem">No entries match the current filters.</td></tr>`
        : filteredEntries.map(e => {
            const tot     = (parseFloat(e.total_hours)||0) * (parseFloat(e.haul_fee)||0);
            // Rows autofilled from an approved timesheet entry (payroll → Truck
            // Tracking) carry a "tst-" id prefix. Flag them so the office knows
            // to fill in the still-blank haul fee and division.
            const isInjected = String(e.id || '').startsWith('tst-');
            const isOpen  = expandedRows.has(e.id);
            const caretStyle = `display:inline-block;transition:transform 0.18s;transform:rotate(${isOpen?'90':'0'}deg);color:var(--muted);font-size:0.85rem;line-height:1;cursor:pointer;user-select:none`;
            const subLabel = `font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:0.3rem`;
            const missingInvoice = !e.invoiced_date || !e.invoice_sent_date;
            const rowBg = missingInvoice ? 'background:rgba(239,68,68,0.18)' : '';
            const icEntry = icSentMap.get(e.id);
            const icBadge = icEntry

              : `<div id="ic-main-${e.id}"></div>`;
            // Read-only cell for locked (payroll-injected) rows.
            const ro = v => `<span style="color:var(--text);font-size:0.8rem">${esc(v == null ? '' : String(v))}</span>`;
            // …except the fee, which stays typeable on a locked row. See
            // "BACKUP HAUL FEE" above: an unpriced haul is noticed in this tab
            // and used to be fixable only by un-approving the timesheet entry.
            // Dashed underline so it reads as the one open box on a locked row
            // rather than as a cell that was left unlocked by accident.
            const feeBox = !isInjected ? '' : `
              <input type="number" id="th-fee-${e.id}" min="0" step="0.01"
                value="${esc(e.haul_fee == null ? '' : String(e.haul_fee))}" placeholder="0.00"
                title="Backup edit — payroll owns this fee, but you can price the haul here if it came over without one. Clear the box to go back to payroll's figure."
                onchange="setBackupFee('${e.id}',this.value)"
                style="width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--text);font-size:0.8rem;outline:none;padding:0.15rem 0;text-align:right">
              <div id="fee-ovr-${e.id}" style="text-align:right;line-height:1.2;margin-top:0.1rem">${_backupFeeNote(e)}</div>`;
            const unitNum = `<div id="unit-num-${e.id}" style="font-size:0.68rem;color:var(--muted);margin-top:0.1rem;padding-left:0.15rem">${esc((divTruckLists.units.find(u=>u.name===e.unit)||{}).number||'')}</div>`;
            const caretCell = `<td style="width:28px;text-align:center;padding:0 0.25rem;cursor:pointer" onclick="toggleInvoiceRow('${e.id}')"><span id="caret-${e.id}" style="${caretStyle}">&#8250;</span></td>`;
            const tsBadge = `<span title="Injected from an approved timesheet entry — edit it in Payroll, not here. The haul fee is the exception: it can be set here as a backup." style="display:inline-block;font-size:0.56rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;color:#2dd4bf;background:rgba(45,212,191,0.12);border:1px solid rgba(45,212,191,0.35);border-radius:3px;padding:0.05rem 0.32rem;white-space:nowrap">&#8592; Timesheet</span>`;
            // Payroll numbers its rows out of the same TR-#### series this tab
            // uses (api/lib/truck-injected.js), so an injected haul is named in
            // the Task Number column like any other — the badge keeps its place
            // and the number sits to its right. A row still waiting on the
            // read-time backfill shows the badge alone rather than a gap.
            const tsTaskCell = `<div style="display:flex;align-items:center;gap:0.4rem">${tsBadge}${
              e.task_number ? `<span>${esc(e.task_number)}</span>` : ''}</div>`;
            // Payroll-injected rows are locked here — the core data is read-only
            // (edited in Payroll), but the invoice sub-row below stays editable so
            // the trucking office can still manage billing.
            const mainRow = isInjected
              ? `<tr style="${rowBg}" title="Injected from an approved timesheet entry — edit it in Payroll, not here. The haul fee is the exception: it can be set here as a backup.">
                  ${caretCell}
                  <td class="td-task-num">${tsTaskCell}</td>
                  <td style="min-width:110px">${ro(e.actual_date)}</td>
                  <td style="min-width:140px">${ro(e.driver)}</td>
                  <td style="min-width:140px">${ro(e.unit)}${unitNum}</td>
                  <td style="min-width:90px">${ro(fmtTime12(e.actual_start))}</td>
                  <td style="min-width:90px">${ro(fmtTime12(e.actual_end))}</td>
                  <td style="min-width:80px;text-align:right;background:rgba(251,191,36,0.06)"><span style="color:#fbbf24;font-size:0.8rem;font-weight:600">${esc(e.total_hours||'')}</span></td>
                  <td style="min-width:90px;text-align:right">${feeBox}</td>
                  <td class="td-total" id="td-tot-${e.id}">${fmtMoney(tot)}</td>
                  <td style="min-width:130px">${ro(e.customer)}</td>
                  <td style="min-width:160px">${ro(e.description)}</td>
                  <td style="min-width:100px">${ro(e.division)}</td>
                  <td style="min-width:130px">${ro(e.notes)}${icBadge}</td>
                  <td style="text-align:center;width:36px"><span title="Locked — edit this row in Payroll. The haul fee can be set here as a backup." style="color:var(--muted);font-size:0.9rem">&#128274;</span></td>
                </tr>`
              : `<tr style="${rowBg}">
                  ${caretCell}
                  <td class="td-task-num">${esc(e.task_number)}</td>
                  <td style="min-width:110px">${inp(e.id,'actual_date','date','',e.actual_date)}</td>
                  <td style="min-width:140px">${cbHtml(e.id, 'driver', e.driver || '')}</td>
                  <td style="min-width:140px">${cbHtml(e.id, 'unit', e.unit || '')}${unitNum}</td>
                  <td style="min-width:90px"><input type="time" value="${esc(e.actual_start||'')}" oninput="_liveHours('${e.id}','actual_start',this.value)" onchange="updateField('${e.id}','actual_start',this.value)" style="width:100%;background:transparent;border:none;color:var(--text);font-size:0.8rem;outline:none;padding:0.15rem 0"></td>
                  <td style="min-width:90px"><input type="time" value="${esc(e.actual_end||'')}" oninput="_liveHours('${e.id}','actual_end',this.value)" onchange="updateField('${e.id}','actual_end',this.value)" style="width:100%;background:transparent;border:none;color:var(--text);font-size:0.8rem;outline:none;padding:0.15rem 0"></td>
                  <td style="min-width:80px;text-align:right;background:rgba(251,191,36,0.06)"><input type="number" id="th-hrs-${e.id}" value="${esc(e.total_hours || '')}" placeholder="0" onchange="updateField('${e.id}','total_hours',this.value)" style="width:100%;background:transparent;border:none;color:#fbbf24;font-size:0.8rem;outline:none;padding:0.15rem 0;text-align:right;font-weight:600"></td>
                  <td style="min-width:90px;text-align:right">${inp(e.id,'haul_fee','number','0.00',e.haul_fee,'th-fee-' + e.id)}</td>

    /* ═══════════════════════════════════════════
       SCHEDULER — the plan side of the division.

       Truck Tracking is the RECORD: its rows are injected from approved
       timesheet entries (api/lib/truck-injected.js), locked, and swept back
       out on un-approval. It only ever describes work that already happened.
       The schedule is the opposite — what we intend to run — so it lives in
       its own blob rather than in divEntries, where the payroll sweep would
       fight it and unworked hauls would land in the revenue and hours
       analytics.

       The two are deliberately the same shape. A tracking row carries
       actual_date / actual_start; an assignment carries date / start against
       the same driver, unit and customer lists, so plan-vs-actual is a join
       on (date, driver) whenever we want to add it.
    ═══════════════════════════════════════════ */
    /* Two boards live under the Scheduler tab and share every line of this
       code: the trucking board that has always been here, and a labor board
       that is the same tool pointed at a second blob. Only the key they save
       to differs, so a haul and a labor call can never land on one another's
       board. The trucking key is unchanged, so everything already scheduled
       opens exactly where it was left. */
    const SCHED_BOARDS = [
      { id: 'trucking', label: 'Trucking Schedule', noun: 'Trucking',
        key: 'fct_trucking_schedule',       reportType: 'trucking_dispatch'       },
      { id: 'labor',    label: 'Labor Schedule',    noun: 'Labor',
        key: 'fct_trucking_labor_schedule', reportType: 'trucking_labor_dispatch' },
    ];
    let schedBoard = 'trucking';    // the board the Trucking/Labor UI acts on
    /* Which sub-tab is showing. Either board id, or 'records' — the archive
       view, which is not a board: it reads both of them and owns no blob. It
       is tracked apart from schedBoard so that opening Records leaves the
       board selection alone, and closing it lands back on the board you left. */
    let schedView = 'trucking';

    function schedBoardCfg(board) {
      return SCHED_BOARDS.find(b => b.id === (board || schedBoard)) || SCHED_BOARDS[0];
    }

    function _schedNewState() {
      return {
        assignments: {},   // { 'YYYY-MM-DD': [ {id,driver,customer,unit,start,notes} ] }
        view:      'day',  // 'week' | 'day' — opens on the day being dispatched
        anchor:    null,   // the focused date; week view shows the week around it
        baseline:  '{}',   // server state as of last successful read/write
        dirty:     false,
        saveTimer: null,
        flushing:  false,
        loaded:    false,
        loading:   false,
        loadError: null,
        status:    'saved', // 'saved' | 'pending' | 'saving' | 'error'
        // Drivers hidden from the board. The managed drivers list is shared with
        // Truck Tracking and re-seeded from every stored entry on load, so a name
        // that reached it via a timesheet entry (a username like an office login)
        // cannot be removed there — deleting it just comes back on the next load,
        // and it is still wanted in Tracking's dropdown for the historical rows.
        // Hiding is therefore the board's own view setting, and each board keeps
        // its own — the people on the labor board are not the people on the
        // trucking one. Stored with the schedule rather than per-browser so every
        // dispatcher sees one board.
        hidden:         new Set(),
        hiddenBaseline: '[]',
        pickQuery:      '',
      };
    }
    const _schedStates = {};
    SCHED_BOARDS.forEach(b => { _schedStates[b.id] = _schedNewState(); });

    /** One board's state — the board on screen unless another is named.
     *  Everything asynchronous captures its board on the way in and passes it
     *  down, so a save still in flight can never write one board's rows under
     *  the other's key. */
    function schedS(board) { return _schedStates[board] || _schedStates[schedBoard]; }

    let schedCtx = null;   // open editor: { board, date, id|null }

    const schedEsc = s => String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    /* ── Date helpers. Every parse goes through local noon so a DST boundary
          can't roll a date back a day the way midnight parsing does. ── */
    function schedPad(n) { return String(n).padStart(2, '0'); }
    function schedStr(d) { return d.getFullYear() + '-' + schedPad(d.getMonth()+1) + '-' + schedPad(d.getDate()); }
    function schedParse(ds) { return new Date(ds + 'T12:00:00'); }
    function schedAddDays(ds, n) { const d = schedParse(ds); d.setDate(d.getDate() + n); return schedStr(d); }
    function schedTodayStr() { return schedStr(new Date()); }
    function schedMonday(ds) {
      const d = schedParse(ds), dow = d.getDay();
      d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow));
      return schedStr(d);
    }
    function schedWeekDates() {
      const m = schedMonday(schedS().anchor);
      return Array.from({ length: 7 }, (_, i) => schedAddDays(m, i));
    }
    function schedTime12(hhmm) {
      if (!hhmm) return '';
      const [h, m] = String(hhmm).split(':').map(Number);
      if (isNaN(h)) return '';
      const ap = h < 12 ? 'a' : 'p', h12 = (h % 12) || 12;
      return h12 + (m ? ':' + schedPad(m) : '') + ap;
    }

    /** "6:30a–3p", or just the one end of it that is filled in. Both are
     *  optional: a haul can be booked before its finish time is known. */
    function schedWindow(a) {
      const st = schedTime12(a && a.start), en = schedTime12(a && a.end);
      if (st && en) return st + '\u2013' + en;
      return st || (en ? '\u2013' + en : '');
    }

    /** Minutes past midnight, or null when the time is absent/unparseable. */
    function schedMins(hhmm) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim());
      if (!m) return null;
      const h = +m[1], mi = +m[2];
      if (h > 23 || mi > 59) return null;
      return h * 60 + mi;
    }

    /** True when the named board is the one on screen: the Scheduler tab is
     *  showing and that board's sub-tab is the selected one. Work that
     *  finishes for the other board updates its state and leaves the DOM
     *  alone — its panel is drawn from scratch when it is picked. */
    function schedIsActive(board) {
      if (!schedTabShowing()) return false;
      if (schedView !== schedBoard) return false;   // Records is up; no board is drawn
      return (board || schedBoard) === schedBoard;
    }

    /** The Scheduler tab is the one selected — whichever of its sub-tabs. */
    function schedTabShowing() {
      const b = document.querySelector('.tab-btn.active');
      return !!b && b.dataset.tab === 'scheduler';
    }

    /** Redraw whatever the Scheduler is showing. Board data reaches Records as
     *  well as the boards — a schedule that finishes loading, or a save that
     *  lands, changes the archive too — so the board-scoped redraws go through
     *  here rather than calling renderScheduler() directly. */
    function schedRerender(board) {
      if (!schedTabShowing()) return;
      if (schedView === 'records') { renderSchedRecords(); return; }
      const b = board || schedBoard;
      if (schedIsActive(b)) renderScheduler(b);
    }

    /* ── Roster. The managed driver list is the roster, but any driver who
          still holds an assignment is unioned in — dropping someone from the
          list must not hide work that is still on the board. ── */
    function schedDrivers(dates) {
      // Anyone holding an assignment in view is shown whatever their settings —
      // hiding a driver must never make scheduled work disappear with them.
      const assigned = new Set();
      (dates || []).forEach(d => (schedS().assignments[d] || []).forEach(a => { if (a.driver) assigned.add(a.driver); }));
      const set = new Set(assigned);
      (divTruckLists.drivers || []).forEach(n => { if (n && !schedS().hidden.has(n)) set.add(n); });
      return [...set].sort((a, b) => String(a).localeCompare(String(b)));
    }
    /** Every name the picker can offer: the managed list plus anyone who
     *  holds an assignment on any date, hidden or not. */
    function schedAllDrivers() {
      const set = new Set((divTruckLists.drivers || []).filter(Boolean));
      Object.keys(schedS().assignments).forEach(d =>
        (schedS().assignments[d] || []).forEach(a => { if (a.driver) set.add(a.driver); }));
      return [...set].sort((a, b) => String(a).localeCompare(String(b)));
    }
    /** Assignments per driver across every date — shown in the picker so it is
     *  clear before hiding someone whether they carry any work. */
    function schedTotalsByDriver() {
      const m = new Map();
      Object.keys(schedS().assignments).forEach(d =>
        (schedS().assignments[d] || []).forEach(a => { if (a.driver) m.set(a.driver, (m.get(a.driver) || 0) + 1); }));
      return m;
    }
    function schedFor(date, driver) {
      return (schedS().assignments[date] || [])
        .filter(a => a.driver === driver)
        .sort((a, b) => String(a.start || '~').localeCompare(String(b.start || '~')));
    }
    /* ═══════ Double-booking ═══════
       Two things on this board are impossible rather than merely untidy: one
       driver on two hauls at the same time, and one truck on two hauls at the
       same time. Those are what the flag is for.

       It used to be neither of them. The rule was "this truck appears on two
       drivers' rows today", which on a board of twenty-six drivers fired on
       every truck that changed hands between shifts, and said nothing at all
       about a driver booked twice over the same hours — the one a dispatcher
       most needs to see. A flag that goes up on the normal case is a flag
       people learn to scroll past.

       An overlap now has to be a real overlap in time, and it is checked on
       both keys. A truck handed over at 2pm — 6a–2p, then 2p–10p — is not a
       conflict on either.

       A window with no end is read as the instant it starts. It clashes with a
       haul already running at that moment, or with another starting on the
       same minute, and otherwise says nothing: we do not know how long it runs
       and guessing is what put warnings on the board that nobody could act
       on. */
    function _schedSpan(a) {
      const s = schedMins(a && a.start);
      if (s === null) return null;
      const e = schedMins(a && a.end);
      // An end that runs backwards (a haul booked past midnight) tells us
      // nothing beyond when it started.
      return [s, e !== null && e > s ? e : s];
    }

    function _schedOverlap(x, y) {
      // The same starting minute is the one thing a zero-length window can
      // prove: nobody starts two hauls at once, and no truck leaves twice.
      if (x[0] === y[0]) return true;
      return x[0] < y[1] && y[0] < x[1];
    }

    /** The day's double-bookings: which assignments are caught in one, and
     *  what each of them is — `{ ids: Map<id, {driver, unit}>, drivers: Set,
     *  units: Set }`. The sets are the names involved, which is what the
     *  toolbar counts; the map is what each row, chip and bar reads. */
    function schedConflicts(date) {
      const items = (schedS().assignments[date] || []).filter(a => a && a.id);
      const out = { ids: new Map(), drivers: new Set(), units: new Set() };
      ['driver', 'unit'].forEach(field => {
        const by = new Map();
        items.forEach(a => {
          const k = _remKey(a[field]);
          if (!k) return;
          if (!by.has(k)) by.set(k, []);
          by.get(k).push(a);
        });
        by.forEach((list, k) => {
          const spans = list.map(a => ({ a, span: _schedSpan(a) })).filter(x => x.span);
          for (let i = 0; i < spans.length; i++) {
            for (let j = i + 1; j < spans.length; j++) {
              if (!_schedOverlap(spans[i].span, spans[j].span)) continue;
              [spans[i].a, spans[j].a].forEach(x => {
                const cur = out.ids.get(x.id) || { driver: false, unit: false };
                cur[field] = true;
                out.ids.set(x.id, cur);
              });
              (field === 'driver' ? out.drivers : out.units).add(k);
            }
          }
        });
      });
      return out;
    }

    /** What a flagged assignment is flagged for, in words — the same sentence
     *  on the chip, the bar, the row and the printed sheet. */
    function schedClashNote(c) {
      if (!c) return '';
      if (c.driver && c.unit) return 'this driver and this truck are both booked on another haul over the same hours';
      if (c.driver)           return 'this driver is booked on another haul over the same hours';
      return 'this truck is booked on another haul over the same hours';
    }

    /* ═══════ Persistence ═══════
       Merge-on-save against a baseline, the same scheme the company-wide
       scheduler uses: before each write we re-read the server copy and
       reconcile by assignment id, so two dispatchers on the board at once
       don't overwrite each other's rows. Adds and edits from either side
       survive; only rows this session actually removed are removed. */
    function _schedFlat(a) {
      const m = {};
      for (const d in a) for (const x of (a[d] || [])) m[x.id] = { ...x, _d: d };
      return m;
    }
    function _schedUnflat(m) {
      const o = {};
      for (const id in m) { const { _d, ...rest } = m[id]; (o[_d] = o[_d] || []).push(rest); }
      return o;
    }
    function schedMerge(baseStr, ours, theirs) {
      let base = {};
      try { base = JSON.parse(baseStr || '{}'); } catch { base = {}; }
      const b = _schedFlat(base), o = _schedFlat(ours), t = _schedFlat(theirs), res = { ...t };
      for (const id in o) if (!(id in b)) res[id] = o[id];                                                 // we added
      for (const id in b) if (!(id in o)) delete res[id];                                                  // we removed
      for (const id in o) if (id in b && JSON.stringify(o[id]) !== JSON.stringify(b[id])) res[id] = o[id]; // we edited
      return _schedUnflat(res);
    }

    async function schedEnsureLoaded(board) {
      const b  = board || schedBoard;
      const st = schedS(b);
      if (st.loaded || st.loading) return;
      st.loading = true;
      st.loadError = null;
      try {
        const r = await fetch(`${API_BASE}/data/${schedBoardCfg(b).key}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const { value } = await r.json();
        const a = value && typeof value === 'object' ? value.assignments : null;
        st.assignments = (a && typeof a === 'object' && !Array.isArray(a)) ? a : {};
        st.baseline = JSON.stringify(st.assignments);
        const h = value && typeof value === 'object' ? value.hidden : null;
        st.hidden = new Set(Array.isArray(h) ? h.filter(x => typeof x === 'string') : []);
        st.hiddenBaseline = schedHiddenStr(b);
        st.loaded = true;
      } catch (err) {
        // Surfaced as a retryable error rather than an empty board: an empty
        // week and a failed read look identical, and only one of them is safe
        // to start typing into.
        st.loadError = err && err.message ? err.message : 'Could not load the schedule.';
      } finally {
        st.loading = false;
        schedRerender(b);
      }
    }

    function schedRetryLoad(board) {
      const b = board || schedBoard;
      schedS(b).loadError = null;
      renderScheduler(b);
      schedEnsureLoaded(b);
    }

    function schedHiddenStr(board) { return JSON.stringify([...schedS(board).hidden].sort()); }

    /** A dot on the sub-tab of any board carrying unsaved work. The toolbar's
     *  status pill belongs to the board on screen, so this is the only thing
     *  that can say a save failed on the one you are not looking at. */
    function schedMarkSubTabs() {
      document.querySelectorAll('.sched-sub-btn').forEach(btn => {
        const st = _schedStates[btn.dataset.board];
        if (!st) return;
        const bad  = st.status === 'error';
        const busy = st.status === 'pending' || st.status === 'saving';
        btn.classList.toggle('err', bad);
        btn.classList.toggle('unsaved', busy && !bad);
        btn.title = bad  ? 'Changes on this board are not saved yet — still retrying'
                  : busy ? 'Unsaved changes on this board'
                  : '';
      });
    }

    function schedSetStatus(s, board) {
      const b = board || schedBoard;
      schedS(b).status = s;
      schedMarkSubTabs();
      // Only the board on screen has a status pill in the DOM; the other one
      // picks its state up from st.status the next time it is drawn.
      if (!schedIsActive(b)) return;
      const el = document.getElementById('sched-status');
      if (!el) return;
      const txt = { saved: 'All changes saved', pending: 'Unsaved changes…', saving: 'Saving…', error: '⚠ Not saved — retrying' };
      el.textContent = txt[s] || '';
      el.classList.toggle('err', s === 'error');
    }

    function schedMarkDirty(board) {
      const b  = board || schedBoard;
      const st = schedS(b);
      st.dirty = true;
      schedSetStatus('pending', b);
      clearTimeout(st.saveTimer);
      st.saveTimer = setTimeout(() => schedFlush(b), 600);
    }

    async function schedFlush(board) {
      const b   = board || schedBoard;
      const st  = schedS(b);
      const KEY = schedBoardCfg(b).key;
      clearTimeout(st.saveTimer);
      st.saveTimer = null;
      if (!st.dirty) return;
      // A flush already in flight owns the merge; queue behind it rather than
      // racing a second read-modify-write against the same key.
      if (st.flushing) { st.saveTimer = setTimeout(() => schedFlush(b), 300); return; }
      st.flushing = true;
      schedSetStatus('saving', b);
      try {
        const r0 = await fetch(`${API_BASE}/data/${KEY}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (r0.ok) {
          const { value } = await r0.json();
          const a = value && typeof value === 'object' ? value.assignments : null;
          const theirs = (a && typeof a === 'object' && !Array.isArray(a)) ? a : {};
          if (JSON.stringify(theirs) !== st.baseline) {
            st.assignments = schedMerge(st.baseline, st.assignments, theirs);
            schedRerender(b);
          }
          // The hidden set is one small list rather than keyed rows, so there is
          // nothing to merge per-item: whoever last changed it wins. If we have
          // not touched ours since the last read, theirs is the newer answer.
          const h = value && typeof value === 'object' ? value.hidden : null;
          if (Array.isArray(h) && schedHiddenStr(b) === st.hiddenBaseline) {
            const next = new Set(h.filter(x => typeof x === 'string'));
            if (JSON.stringify([...next].sort()) !== st.hiddenBaseline) {
              st.hidden = next;
              schedRerender(b);
            }
          }
        }
        const r = await fetch(`${API_BASE}/data/${KEY}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ value: { version: 1, assignments: st.assignments, hidden: [...st.hidden].sort() } })
        });
        await _handleSaveResponse(r, 'schedFlush');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        st.baseline = JSON.stringify(st.assignments);
        st.hiddenBaseline = schedHiddenStr(b);
        st.dirty = false;
        schedSetStatus('saved', b);
      } catch {
        // Left dirty on purpose so the next edit — or the retry below — picks
        // it back up instead of the change being silently dropped.
        schedSetStatus('error', b);
        st.saveTimer = setTimeout(() => schedFlush(b), 5000);
      } finally {
        st.flushing = false;
      }
    }

    // Edits inside the 600ms debounce would otherwise be lost on navigation.
    // keepalive lets the PUT outlive the page; the merge is skipped because it
    // needs a GET the browser will not reliably run mid-unload.
    function schedFlushKeepalive() {
      // Both boards, not just the one on screen: an edit on the trucking board
      // is still unsaved after switching to labor, and the page can be left
      // from either.
      SCHED_BOARDS.forEach(cfg => {
        const st = schedS(cfg.id);
        if (!st.dirty) return;
        clearTimeout(st.saveTimer);
        st.saveTimer = null;
        try {
          fetch(`${API_BASE}/data/${cfg.key}`, {
            method: 'PUT', keepalive: true,
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ value: { version: 1, assignments: st.assignments, hidden: [...st.hidden].sort() } })
          }).catch(() => {});
        } catch { /* best-effort */ }
      });
    }
    window.addEventListener('beforeunload', schedFlushKeepalive);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') schedFlushKeepalive();
    });

    /* ═══════ Navigation ═══════ */
    function schedStep(n) {
      schedS().anchor = schedAddDays(schedS().anchor, schedS().view === 'week' ? n * 7 : n);
      renderScheduler();
    }
    function schedGoToday() { schedS().anchor = schedTodayStr(); renderScheduler(); }
    function schedSetView(v) { schedS().view = v; renderScheduler(); }
    function schedGoDay(date) { schedS().anchor = date; schedS().view = 'day'; renderScheduler(); }

    /* ═══════ Render ═══════
       Only the board whose sub-tab is selected is ever drawn, and the other
       panel is emptied on the way out — every id in here (the status pill, the
       sheet message) would otherwise exist twice in the document, and
       getElementById would start answering for the board nobody is looking
       at. Everything below reads schedS() for that reason: it is always the
       board being drawn. */
    function renderScheduler(board) {
      const b = board || schedBoard;
      // Not the selected board, or the Records sub-tab is up and both board
      // panels are blank — either way there is nothing of this board on screen.
      if (b !== schedBoard || schedView !== schedBoard) return;
      const st   = schedS(b);
      const cfg  = schedBoardCfg(b);
      const root = document.getElementById('sched-board-' + b);
      if (!root) return;
      if (!st.anchor) st.anchor = schedTodayStr();

      if (st.loadError) {
        root.innerHTML = `
          <div style="padding:1.25rem;max-width:1600px">
            <p class="home-section-title">${schedEsc(cfg.label)}</p>
            <div style="border:1px solid var(--border);border-radius:6px;padding:2.5rem 1.5rem;text-align:center">
              <div style="color:var(--orange);font-size:0.85rem;margin-bottom:0.25rem">Could not load the schedule.</div>
              <div style="color:var(--muted);font-size:0.75rem;margin-bottom:1rem">${schedEsc(st.loadError)}</div>
              <button class="sch-btn" onclick="schedRetryLoad()">Retry</button>
            </div>
          </div>`;
        return;
      }
      if (!st.loaded) {
        schedEnsureLoaded(b);
        root.innerHTML = `
          <div style="padding:1.25rem;max-width:1600px">
            <p class="home-section-title">${schedEsc(cfg.label)}</p>
            <div style="border:1px solid var(--border);border-radius:6px;padding:3rem 1.5rem;
                        text-align:center;color:var(--muted);font-size:0.85rem;">Loading schedule…</div>
          </div>`;
        return;
      }

      const rng = st.view === 'week' ? schedWeekDates() : [st.anchor];
      schedLoadReports(rng[0], rng[rng.length - 1]);

      root.innerHTML = `
        <div style="padding:1.25rem;max-width:1600px">
          ${schedToolbarHTML()}
          ${st.view === 'week' ? schedWeekHTML() : schedDayHTML()}
        </div>`;
      schedSetStatus(st.status, b);
    }

    /* ═══════ Sub-tabs ═══════
       Switching boards closes anything the old board had open — the editor,
       the picker, the report dialog all sit outside the panels and would
       otherwise save into whichever board came next — and blanks the panel
       being left so no id is in the document twice. */
    function schedSwitchBoard(board) {
      if (board !== 'records' && !_schedStates[board]) return;
      schedCloseEditor();
      schedClosePicker();
      schedCloseReport();
      const prev = document.getElementById('sched-board-' + schedView);
      if (prev && board !== schedView) prev.innerHTML = '';
      schedView = board;
      // Records is a view over both boards, not a board: the board selection
      // is left exactly as it was so leaving Records lands back on it.
      if (board !== 'records') schedBoard = board;
      document.querySelectorAll('.sched-sub-btn').forEach(btn =>
        btn.classList.toggle('active', btn.dataset.board === board));
      document.querySelectorAll('.sched-board-panel').forEach(pnl =>
        pnl.classList.toggle('active', pnl.id === 'sched-board-' + board));
      if (board === 'records') renderSchedRecords();
      else renderScheduler(board);
    }

    function schedToolbarHTML() {
      const dates = schedS().view === 'week' ? schedWeekDates() : [schedS().anchor];
      let label;
      if (schedS().view === 'week') {
        const a = schedParse(dates[0]), b = schedParse(dates[6]);
        const opt = { month: 'short', day: 'numeric' };
        label = a.toLocaleDateString(undefined, opt) + ' – ' +
                b.toLocaleDateString(undefined, opt) + ', ' + b.getFullYear();
      } else {
        label = schedParse(schedS().anchor)
          .toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
      }
      // Counted as the people and the trucks involved, not as the rows: two
      // hauls booked over each other are one problem to sort out.
      const clash = dates.reduce((acc, d) => {
        const c = schedConflicts(d);
        c.drivers.forEach(v => acc.drivers.add(d + '|' + v));
        c.units.forEach(v => acc.units.add(d + '|' + v));
        return acc;
      }, { drivers: new Set(), units: new Set() });
      const planned   = dates.reduce((n, d) => n + (schedS().assignments[d] || []).length, 0);
      const roster    = schedAllDrivers();
      const total     = roster.length;
      const shown     = roster.filter(n => !schedS().hidden.has(n)).length;

      return `
        <div class="sch-toolbar">
          <div class="sch-nav">
            <button class="sch-navbtn" onclick="schedStep(-1)" title="Previous">&#8249;</button>
            <button class="sch-navbtn" onclick="schedGoToday()">Today</button>
            <button class="sch-navbtn" onclick="schedStep(1)" title="Next">&#8250;</button>
          </div>
          <div class="sch-label">${schedEsc(label)}</div>
          <div class="sch-viewtoggle">
            <button class="sch-viewbtn${schedS().view === 'week' ? ' active' : ''}" onclick="schedSetView('week')">Week</button>
            <button class="sch-viewbtn${schedS().view === 'day'  ? ' active' : ''}" onclick="schedSetView('day')">Day</button>
          </div>
          <span style="font-size:0.7rem;color:var(--muted)">${planned} assigned</span>
          ${clash.drivers.size ? `<span class="sch-warn" title="A driver is booked on two hauls over the same hours">${
            clash.drivers.size} driver${clash.drivers.size === 1 ? '' : 's'} double-booked</span>` : ''}
          ${clash.units.size ? `<span class="sch-warn" title="A truck is booked on two hauls over the same hours">${
            clash.units.size} truck conflict${clash.units.size === 1 ? '' : 's'}</span>` : ''}
          <span style="flex:1"></span>
          <span id="sched-status" class="sch-status"></span>
          <button class="btn-manage-lists" onclick="schedOpenPlanReport()"
            title="Print, save as PDF, or email this schedule">PDF / Email</button>
          <button class="btn-manage-lists" onclick="schedOpenPicker()"
            title="Choose which drivers appear on the board">Drivers ${shown}/${total}</button>
          <button class="btn-manage-lists" onclick="openManageLists()">Manage Lists</button>
        </div>`;
    }

    function schedNoDriversHTML() {
      return `
        <div style="border:1px solid var(--border);border-radius:6px;padding:3rem 1.5rem;
                    text-align:center;color:var(--muted);font-size:0.85rem;">
          No drivers on the roster yet.<br>
          <span style="font-size:0.78rem">Add them under <strong>Manage Lists</strong> — the same list Truck Tracking uses.</span>
        </div>`;
    }

    /** One assignment on the week board. `clash` is that assignment's entry in
     *  schedConflicts(date).ids, or undefined when it is not double-booked. */
    function schedChipHTML(a, clash) {
      const bits = [];
      if (a.unit)     bits.push(schedEsc(a.unit));
      if (a.material) bits.push(schedEsc(a.material));
      if (a.notes)    bits.push(schedEsc(a.notes));
      const unitBit = a.unit
        ? a.unit + (unitTypeLabel(a.unit) ? ' (' + unitTypeLabel(a.unit) + ')' : '')
        : '';
      const tipBits = [schedWindow(a), schedDivLabel(a.division), schedJobOf(a), a.address,
        unitBit, a.material, a.notes].filter(Boolean).join(' \u00b7 ');
      const title = ' title="' + schedEsc(tipBits + (clash
        ? ' \u2014 ' + schedClashNote(clash) : '')) + '"';
      const win   = schedWindow(a);
      return `
        <div class="sch-chip${clash ? ' conflict' : ''}"${title}
             onclick="event.stopPropagation();schedEditAssign('${a._d}','${a.id}')">
          <span class="cust">${win ? `<span class="start">${schedEsc(win)}</span> ` : ''}${schedEsc(schedJobOf(a) || '—')}</span>
          ${bits.length ? `<span class="meta">${bits.join(' · ')}</span>` : ''}
        </div>`;
    }

    function schedWeekHTML() {
      const dates   = schedWeekDates();
      const drivers = schedDrivers(dates);
      if (!drivers.length) return schedNoDriversHTML();
      const today = schedTodayStr();
      const conflictsByDate = {};
      dates.forEach(d => { conflictsByDate[d] = schedConflicts(d); });

      const head = dates.map(d => {
        const dd = schedParse(d);
        return `<th class="${d === today ? 'is-today' : ''}">
          <div class="dow">${dd.toLocaleDateString(undefined, { weekday: 'short' })}</div>
          <div class="dnum">${dd.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</div>
        </th>`;
      }).join('');

      const body = drivers.map((dr, di) => {
        const load = dates.reduce((n, d) => n + schedFor(d, dr).length, 0);
        const cells = dates.map(d => {
          const dow  = schedParse(d).getDay();
          const cls  = [ 'sch-cell', d === today ? 'is-today' : '', (dow === 0 || dow === 6) ? 'is-weekend' : '' ]
                         .filter(Boolean).join(' ');
          const clashes = conflictsByDate[d];
          const rows = schedFor(d, dr)
            .map(a => schedChipHTML({ ...a, _d: d }, clashes.ids.get(a.id)))
            .join('');
          return `<td class="${cls}" onclick="schedAddAssign('${d}',${di})">
            ${rows}<button class="sch-add" onclick="event.stopPropagation();schedAddAssign('${d}',${di})">+</button>
          </td>`;
        }).join('');
        // A hidden driver still appears on the days they hold work. Marked so
        // that reads as "kept because it is scheduled" rather than as the hide
        // having failed to apply.
        const hid = schedS().hidden.has(dr);
        return `<tr>
          <td class="sch-driver-cell${hid ? ' is-hidden' : ''}"${hid
            ? ' title="Hidden from the board — still listed because they have assignments this week"' : ''}>
            ${schedEsc(dr)}${hid ? '<span class="sch-hidtag">hidden</span>' : ''}<span class="sch-load">${load}</span>
          </td>
          ${cells}
        </tr>`;
      }).join('');

      return `
        <div class="sch-grid-wrap">
          <table class="sch-grid">
            <thead><tr><th class="sch-corner">Driver</th>${head}</tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>
        <p style="margin-top:0.6rem;font-size:0.7rem;color:var(--muted)">
          Click a cell to assign · click an assignment to edit it · the count beside each driver is their assignments this week.
        </p>`;
    }


    /* ═══════ What the drivers sent back ═══════
       Reported against the assignment it answers, so the day sheet can show
       plan and actual on one line. Read-only here: a report is the driver's
       account of their own day. Correcting a haul means correcting the
       schedule or the payroll entry, each of which has its own owner. */
    let schedReports = new Map();   // assignment id → report
    let _schedReportsRange = '';

    async function schedLoadReports(from, to) {
      const key = from + '..' + to;
      if (_schedReportsRange === key) return;
      try {
        const r = await fetch(`${API_BASE}/trucking-driver-reports?from=${from}&to=${to}`,
          { headers: { 'Authorization': `Bearer ${token}` } });
        if (!r.ok) return;
        const j = await r.json();
        const m = new Map();
        (Array.isArray(j.reports) ? j.reports : []).forEach(x => m.set(x.assignment_id, x));
        schedReports = m;
        _schedReportsRange = key;
        if (schedIsActive()) renderScheduler();
      } catch { /* non-fatal — the column just stays empty */ }
    }

    /** Decimal hours between two HH:MM times, or '' when either is missing.
     *  An end at or before the start is read as running past midnight rather
     *  than as a mistake — a night haul is 10p to 6a, and that is eight hours,
     *  not minus sixteen. */
    function schedHoursBetween(start, end) {
      const s0 = schedMins(start), e0 = schedMins(end);
      if (s0 === null || e0 === null) return '';
      const mins = e0 > s0 ? e0 - s0 : (e0 + 1440) - s0;
      return (mins / 60).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    /** "24.5 t · 3 loads · 6:05a–2:20p" — only the parts they filled in. */
    function schedReportSummary(rep) {
      if (!rep) return '';
      const bits = [];
      if (rep.tons  != null) bits.push(Number(rep.tons).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' t');
      if (rep.loads != null) bits.push(rep.loads + (rep.loads === 1 ? ' load' : ' loads'));
      const win = schedWindow({ start: rep.actual_start, end: rep.actual_end });
      if (win) bits.push(win);
      return bits.join(' · ');
    }

    /* ═══════ Day timeline ═══════ */
    const SCH_HOUR_W = 92;   // px per hour
    const SCH_BAR_H  = 24;   // px per bar
    const SCH_LANE_G = 3;    // px between stacked bars

    /** The hours the day gets drawn across: the work that is on it, padded an
     *  hour each side, never narrower than 8 so a single short haul doesn't
     *  blow up to fill the screen. Falls back to a normal haul day when
     *  nothing is scheduled. */
    function schedDayRange(items) {
      let lo = null, hi = null;
      items.forEach(it => {
        lo = lo === null ? it.s : Math.min(lo, it.s);
        hi = hi === null ? it.e : Math.max(hi, it.e);
      });
      if (lo === null) { lo = 5 * 60; hi = 18 * 60; }
      let h0 = Math.max(0,  Math.floor(lo / 60) - 1);
      let h1 = Math.min(24, Math.ceil(hi / 60) + 1);
      if (h1 - h0 < 8) {
        h0 = Math.max(0, Math.min(h0, h1 - 8));
        h1 = Math.min(24, h0 + 8);
      }
      return { h0, h1 };
    }

    /** Placeable assignments for one driver, with overlaps packed into lanes.
     *  Drivers are allowed to overlap, so two hauls that run over each other
     *  stack instead of one hiding the other. */
    function schedPlace(list) {
      const out = list
        .map(a => {
          const s = schedMins(a.start);
          if (s === null) return null;                 // nothing to anchor it to
          let e = schedMins(a.end), openEnd = false;
          if (e === null || e <= s) { e = s + 60; openEnd = true; }  // incl. past-midnight
          return { a, s, e, openEnd, lane: 0 };
        })
        .filter(Boolean)
        .sort((x, y) => x.s - y.s || x.e - y.e);

      const laneEnds = [];
      out.forEach(it => {
        let i = laneEnds.findIndex(end => end <= it.s);
        if (i === -1) { laneEnds.push(it.e); i = laneEnds.length - 1; }
        else laneEnds[i] = it.e;
        it.lane = i;
      });
      return { placed: out, lanes: Math.max(1, laneEnds.length) };
    }

    function schedHourLabel(h) {
      const ap = h < 12 || h === 24 ? 'AM' : 'PM';
      const h12 = (h % 12) || 12;
      return h12 + ':00 ' + ap;
    }

    function schedTimelineHTML(date, drivers, clashes) {
      const byDriver = new Map(drivers.map(d => [d, []]));
      const unplaced = [];
      (schedS().assignments[date] || []).forEach(a => {
        if (!byDriver.has(a.driver)) return;
        if (schedMins(a.start) === null) unplaced.push(a);   // no start — nothing to draw
        else byDriver.get(a.driver).push(a);
      });

      const prepared = drivers.map(d => ({ driver: d, ...schedPlace(byDriver.get(d) || []) }));
      const { h0, h1 } = schedDayRange(prepared.flatMap(p => p.placed));
      const hours  = h1 - h0;
      const trackW = hours * SCH_HOUR_W;
      const originM = h0 * 60;
      const x = m => Math.round((m - originM) / 60 * SCH_HOUR_W);

      const nowM = date === schedTodayStr()
        ? (() => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); })() : null;
      const nowIn = nowM !== null && nowM >= originM && nowM <= h1 * 60;

      const head = `
        <div class="sch-tl-row sch-tl-head">
          <div class="sch-tl-corner">Driver</div>
          <div class="sch-tl-hours" style="width:${trackW}px">
            ${Array.from({ length: hours }, (_, i) => {
              const h = h0 + i;
              return `<div class="sch-tl-hr${nowM !== null && Math.floor(nowM / 60) === h ? ' is-now' : ''}"
                style="width:${SCH_HOUR_W}px">${schedHourLabel(h)}</div>`;
            }).join('')}
          </div>
        </div>`;

      const rows = prepared.map((p, di) => {
        const h = p.lanes * SCH_BAR_H + (p.lanes + 1) * SCH_LANE_G;
        const bars = p.placed.map(it => {
          const a = it.a;
          const left = x(it.s), w = Math.max(26, x(Math.min(it.e, h1 * 60)) - left);
          const clash = clashes.ids.get(a.id);
          const rep = schedReports.get(a.id);
          const tip = [schedWindow(a) || 'no time set', schedDivLabel(a.division), schedJobOf(a),
            a.address, a.unit, a.material, a.notes]
            .filter(Boolean).join(' · ') + (it.openEnd ? ' · no end time yet' : '')
            + (clash ? ' · ' + schedClashNote(clash) : '')
            + (rep ? '\nReported: ' + (schedReportSummary(rep) || 'yes')
                   + [rep.tickets, rep.notes].filter(Boolean).map(x => ' · ' + x).join('') : '');
          return `<div class="sch-tl-bar${clash ? ' conflict' : ''}${it.openEnd ? ' open-end' : ''}"
            style="left:${left}px;width:${w}px;top:${SCH_LANE_G + it.lane * (SCH_BAR_H + SCH_LANE_G)}px;height:${SCH_BAR_H}px"
            title="${schedEsc(tip)}" onclick="event.stopPropagation();schedEditAssign('${date}','${a.id}')">
            ${rep ? '<span class="b-rep" title="Reported by the driver">&#10003;</span>' : ''}
            <span class="b-cust">${schedEsc(schedJobOf(a) || '—')}</span>
            ${a.unit ? `<span class="b-unit">${schedEsc(a.unit)}</span>` : ''}
          </div>`;
        }).join('');
        const isOpen = !p.placed.length;
        const hid    = schedS().hidden.has(p.driver);
        return `
          <div class="sch-tl-row">
            <div class="sch-tl-name${hid ? ' is-hidden' : isOpen ? ' is-open' : ''}">
              ${schedEsc(p.driver)}${hid ? '<span class="sch-hidtag">hidden</span>' : ''}
            </div>
            <div class="sch-tl-track" style="width:${trackW}px;height:${h}px"
                 onclick="schedTimelineAdd(event,${di},${h0})">
              ${bars}${nowIn ? `<div class="sch-tl-now" style="left:${x(nowM)}px"></div>` : ''}
            </div>
          </div>`;
      }).join('');

      const strip = unplaced.length ? `
        <div class="sch-tl-unplaced">
          <span class="lbl">No start time —</span>
          ${unplaced.map(a => `<button class="sch-tl-chip" onclick="schedEditAssign('${date}','${a.id}')">
            ${schedEsc(a.driver)}${a.customer ? ' · ' + schedEsc(a.customer) : ''}</button>`).join('')}
        </div>` : '';

      return `<div class="sch-tl-wrap"><div style="--hw:${SCH_HOUR_W}px;min-width:min-content">${head}${rows}</div>${strip}</div>`;
    }

    /** Clicking empty track opens a new assignment for that driver, started at
     *  the hour under the pointer. */
    function schedTimelineAdd(ev, driverIdx, h0) {
      const r = ev.currentTarget.getBoundingClientRect();
      const h = h0 + Math.floor((ev.clientX - r.left) / SCH_HOUR_W);
      schedAddAssign(schedS().anchor, driverIdx, schedPad(Math.max(0, Math.min(23, h))) + ':00');
    }

    function schedDayHTML() {
      const date    = schedS().anchor;
      const drivers = schedDrivers([date]);
      if (!drivers.length) return schedNoDriversHTML();
      const clashes = schedConflicts(date);
      const items = (schedS().assignments[date] || []).slice().sort((a, b) =>
        String(a.start || '~').localeCompare(String(b.start || '~')) ||
        String(a.driver || '').localeCompare(String(b.driver || '')));

      // Everything the driver sent back is green, so a glance still says which
      // rows have come in — the single Reported column used to carry that.
      const G   = 'color:var(--green);font-weight:600;white-space:nowrap';
      const DASH = '<span style="color:var(--muted)">—</span>';
      const oneRow = a => {
        const clash = clashes.ids.get(a.id);
        const rep = schedReports.get(a.id) || null;
        const hrs = rep ? schedHoursBetween(rep.actual_start, rep.actual_end) : '';
        return `<tr class="${clash ? 'conflict' : ''}" onclick="schedEditAssign('${date}','${a.id}')" style="cursor:pointer">
          <td style="white-space:nowrap;color:var(--amber);font-weight:600">${schedEsc(schedTime12(a.start)) || '<span style="color:var(--muted);font-weight:400">—</span>'}</td>
