<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchase Orders</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --surface2:  #1a1a26;
      --border:    #2a2a3a;
      --green:     #818cf8;
      --green-dim: #6366f1;
      --red:       #ef4444;
      --yellow:    #eab308;
      --blue:      #60a5fa;
      --text:      #e0e0e0;
      /* 5.8:1 against the page background. #666 measured 3.41:1 — under AA for
         text this small, and --muted carries the vendor, the date, the job line
         and every field label, on a screen used outdoors in the sun. */
      --muted:     #8a8a99;
      --ok:        #4ade80;

      /* One colour per source division, used on the division chip so a long
         list reads at a glance. They match each division's own card on
         divisions.html — the same green means turf there and turf here. */
      --div-turf:   #22c55e;
      --div-paving: #60a5fa;
      --div-kiewit: #fdb913;
      --div-none:   #818cf8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; padding: 0.75rem 1.25rem;
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 200;
    }
    header .brand {
      font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--green); font-weight: 600; white-space: nowrap;
    }
    header .actions { display: flex; gap: 0.5rem; align-items: center; }
    .user-avatar {
      width: 26px; height: 26px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; font-size: 0.66rem;
      font-weight: 700; color: #fff;
    }

    .btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: 5px; padding: 0.38rem 0.8rem; font-size: 0.78rem;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: var(--green); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-green { background: var(--green); border-color: var(--green); color: #12121c; font-weight: 600; }
    .btn-green:hover:not(:disabled) { background: var(--green-dim); border-color: var(--green-dim); }

    main { padding: 1.25rem; max-width: 1600px; margin: 0 auto; }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.85rem;
    }
    .toolbar h1 {
      font-size: 1rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text);
    }
    .toolbar .tools { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

    .search {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); font-size: 0.85rem;
      padding: 0.5rem 0.75rem; outline: none; margin-bottom: 0.85rem;
      font-family: inherit;
    }
    .search:focus { border-color: var(--green); }

    .filter-bar {
      display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
      margin-bottom: 0.85rem;
    }
    .filter-bar select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 5px; font-size: 0.78rem; padding: 0.35rem 0.5rem;
      outline: none; font-family: inherit;
    }
    .chip {
      font-size: 0.72rem; padding: 0.25rem 0.6rem; border-radius: 12px;
      border: 1px solid rgba(234,179,8,0.4); background: rgba(234,179,8,0.12);
      color: var(--yellow); cursor: pointer; font-family: inherit;
    }
    .chip.on { background: var(--yellow); color: #1a1a26; font-weight: 700; }

    /* ── Division chip ── */
    .div-chip {
      display: inline-block; font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.12rem 0.45rem; border-radius: 10px; white-space: nowrap;
    }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table.po { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 6px; min-width: 1180px; }
    table.po th {
      padding: 0.55rem 0.6rem; color: var(--muted); font-size: 0.66rem;
      letter-spacing: 0.08em; text-transform: uppercase; text-align: left;
      border-bottom: 1px solid var(--border); white-space: nowrap; font-weight: 600;
    }
    table.po th.r, table.po td.r { text-align: right; }
    table.po td { padding: 0.35rem 0.6rem; vertical-align: middle; }
    table.po tr.po-head { border-bottom: 1px solid var(--border); }
    table.po tr.po-head:hover { background: rgba(129,140,248,0.04); }

    td input, td select {
      width: 100%; background: transparent; border: none; color: var(--text);
      font-size: 0.8rem; outline: none; padding: 0.15rem 0; font-family: inherit;
    }
    td select, td input.boxed {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 3px; padding: 0.15rem 0.25rem;
    }
    td input:focus, td select:focus { border-color: var(--green); }
    td input[type="date"] { color-scheme: dark; }

    .lines-wrap { padding: 0.5rem 1.25rem 0.75rem 2.25rem; background: #0b0b14; }
    .lines-wrap table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 760px; }
    .lines-wrap th {
      padding: 0.25rem 0.5rem; font-size: 0.62rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; text-align: left; font-weight: 600;
    }
    .lines-wrap td { padding: 0.3rem 0.5rem; }
    .lines-wrap tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .section-label {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin: 0.4rem 0;
    }

    .del-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.85rem; opacity: 0.6; padding: 0.15rem 0.3rem; font-family: inherit;
    }
    .del-btn:hover { color: var(--red); opacity: 1; }
    .icon-btn {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; padding: 0.15rem 0.4rem; font-size: 0.72rem;
      color: var(--muted); white-space: nowrap; font-family: inherit;
    }
    .icon-btn:hover { border-color: var(--green); }
    .icon-btn.has { color: var(--ok); }

    .empty { padding: 1.75rem; text-align: center; color: var(--muted); font-size: 0.85rem; }

    /* ── Save indicator ── */
    .save-indicator {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 400;
      font-size: 0.72rem; padding: 0.35rem 0.7rem; border-radius: 14px;
      border: 1px solid var(--border); background: var(--surface2);
      transition: opacity 0.2s; pointer-events: none;
    }
    .save-indicator.idle  { opacity: 0; }
    .save-indicator.saving{ opacity: 1; color: var(--muted); }
    .save-indicator.saved { opacity: 1; color: var(--ok); border-color: rgba(74,222,128,0.4); }
    .save-indicator.error { opacity: 1; color: var(--red); border-color: rgba(239,68,68,0.5); pointer-events: auto; }

    /* ── Modal / sheet ── */
    .backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 500;
      display: none; align-items: center; justify-content: center; padding: 1rem;
      overflow-y: auto;
    }
    .backdrop.open { display: flex; }
    .sheet {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
      padding: 1.25rem;
    }
    .sheet h2 { font-size: 0.95rem; margin-bottom: 0.25rem; }
    .sheet .sub { font-size: 0.76rem; color: var(--muted); margin-bottom: 1rem; }
    .field { margin-bottom: 0.8rem; }
    .field label {
      display: block; font-size: 0.66rem; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.25rem;
    }
    .field input, .field select, .field textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); font-size: 0.88rem;
      padding: 0.5rem 0.6rem; outline: none; font-family: inherit;
    }
    .field input:focus, .field select:focus { border-color: var(--green); }
    .field input[type="date"] { color-scheme: dark; }
    /* Two across when there is room for two, one when there is not. At 200%
       accessibility text the fixed pair kept its second column and pushed it
       off the side of the screen: Invoice #, Unit Cost and Total all ran past
       the viewport edge, and the sheet clips rather than scrolling sideways, so
       three of the figures the person is there to check simply could not be
       seen or reached. */
    .grid2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      gap: 0.6rem;
    }
    .sheet-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }

    .receipt-preview {
      width: 100%; max-height: 240px; object-fit: contain; border-radius: 6px;
      border: 1px solid var(--border); background: #000; margin-bottom: 0.85rem;
    }
    .scan-status {
      font-size: 0.8rem; padding: 0.6rem 0.75rem; border-radius: 6px;
      background: var(--surface2); border: 1px solid var(--border); margin-bottom: 0.85rem;
    }
    .scan-status.err { color: var(--red); border-color: rgba(239,68,68,0.4); }
    .scan-status.warn { color: var(--yellow); border-color: rgba(234,179,8,0.4); }
    .scanned-mark { color: var(--green); font-size: 0.62rem; margin-left: 0.3rem; }

    .spinner {
      display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
      border: 2px solid var(--border); border-top-color: var(--green);
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 1.25rem;
      z-index: 600; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.55rem 0.9rem; font-size: 0.82rem;
      max-width: 90vw; display: none;
    }
    .toast.show { display: block; }
    .toast.err { border-color: rgba(239,68,68,0.5); color: var(--red); }

    .pager { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-top: 0.85rem; }

    /* The office view is the table; the phone view is the cards. This default
       has to sit BEFORE the media query below, not after it: both rules are a
       single class, so at equal specificity the later one wins, and declaring
       it afterwards hid the cards at EVERY width — the phone got a header, a
       filter bar, "4 orders", and then nothing at all. */
    .cards { display: none; }

    /* ── Phone ──
       The table is the office view. On a phone the same orders render as
       cards: this page's whole point on a phone is photographing a receipt at
       the supply counter, and a thirteen-column grid cannot be used one-handed. */
    /* Narrow OR short. Keying on width alone put a big phone in landscape —
       932px on an iPhone 15 Pro Max, 892px on a Pixel 7 Pro — back on the
       thirteen-column office table, in a viewport 430px tall. Any laptop window
       short enough to match this is one the cards suit better anyway. */
    @media (max-width: 860px), (max-height: 540px) {
      main { padding: 0.75rem; }
      header { padding: 0.6rem 0.75rem; }
      .table-wrap { display: none; }
      .cards { display: block; }
      .toolbar h1 { font-size: 0.9rem; }
      .scan-cta { flex: 1 1 100%; }
      .scan-cta button { width: 100%; padding: 0.7rem; font-size: 0.92rem; }

      /* Touch targets. This page exists to be used one-handed at a supply
         counter, often with a glove on, and the sheet's controls came out at
         34-36px with its buttons at 29 — under the 44px both Apple's and
         Android's guidance ask for, and under WCAG 2.5.5. 16px on the inputs
         is the other half of it: iOS Safari ZOOMS THE PAGE IN on focusing any
         field with a smaller font, and it does not zoom back out, so tapping
         the vendor box left the whole sheet scaled up and off to one side. */
      .field input, .field select, .field textarea {
        min-height: 44px; font-size: 16px; padding: 0.55rem 0.7rem;
      }
      .sheet-actions button, .po-card .card-actions button { min-height: 44px; }
      /* Wraps, and each button may shrink to its text. Two side by side stopped
         fitting at 200% accessibility text and Cancel was pushed off the edge —
         which is also the only way back out of the sheet. */
      .sheet-actions { gap: 0.6rem; flex-wrap: wrap; }
      .sheet-actions button { flex: 1 1 8rem; min-width: 0; font-size: 0.92rem; }

      /* The preview was a fixed 240px on a 664px screen, so every field — and
         the figures the person is here to check — started below the fold. Its
         job on a phone is to confirm the right receipt was photographed, which
         a smaller one does just as well. */
      .receipt-preview { max-height: 22vh; min-height: 110px; }

      .sheet { max-height: 100%; border-radius: 12px; }
      .backdrop { padding: 0.5rem; align-items: flex-start; }

      /* The filter row and the search box are taps too, and were left out of
         the pass above. 16px again so focusing one does not zoom the page. */
      .filter-bar select, .search, .chip {
        min-height: 44px; font-size: 16px;
      }
      /* A <select> sizes to its widest option, so one long supplier name made
         the whole page wider than the screen and left it scrolling sideways.
         The names are long by nature — "Tri-State Aggregates & Supply Co". */
      .filter-bar select { max-width: 100%; flex: 1 1 8rem; min-width: 0; }
      .filter-bar { flex-wrap: wrap; }
    }
    .po-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem; margin-bottom: 0.65rem;
    }
    .po-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem; }
    .po-card .num { font-family: monospace; font-size: 0.8rem; color: var(--muted); }
    .po-card .title { font-size: 0.92rem; font-weight: 600; margin-bottom: 0.15rem; word-break: break-word; }
    .po-card .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.15rem; word-break: break-word; }
    .po-card .amt { font-size: 1.02rem; font-weight: 700; color: var(--yellow); }
    .po-card .card-actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; flex-wrap: wrap; }

    .status-pill {
      font-size: 0.66rem; font-weight: 700; padding: 0.15rem 0.5rem;
      border-radius: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-pending  { background: rgba(234,179,8,0.15);  color: var(--yellow); }
    .status-approved { background: rgba(74,222,128,0.15); color: var(--ok); }
    .status-closed   { background: rgba(255,255,255,0.07);color: var(--muted); }

    .banner {
      background: var(--surface2); border: 1px solid var(--border);
      border-left: 3px solid var(--yellow); border-radius: 5px;
      padding: 0.6rem 0.8rem; font-size: 0.8rem; margin-bottom: 0.85rem;
      color: var(--muted);
    }
    /* Set while a sheet is open. `fixed` rather than `overflow:hidden` because
       iOS Safari ignores the latter on body. */
    body.sheet-open { position: fixed; width: 100%; overflow: hidden; left: 0; right: 0; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:1rem;min-width:0">
    <span class="brand">Purchase Orders</span>
    <span id="user-badge" style="font-size:0.7rem;color:#444;letter-spacing:0.05em;"></span>
  </div>
  <div class="actions">
    <button class="btn" onclick="switchDivision()">Divisions</button>
    <button class="btn" onclick="logout()">Sign out</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap">
      <h1>Purchase Orders</h1>
      <span id="pending-chip-slot"></span>
    </div>
    <div class="tools">
      <div class="scan-cta">
        <button class="btn btn-green" id="scan-btn" onclick="openScanSheet()">&#128247; Scan Receipt</button>
      </div>
      <button class="btn" id="clear-filters-btn" onclick="clearFilters()" style="display:none">Clear Filters</button>
      <button class="btn" onclick="exportCSV()">&#8595; Export CSV</button>
      <button class="btn btn-green" id="new-po-btn" onclick="newPO()">+ New PO</button>
    </div>
  </div>

  <div id="load-banner" class="banner" style="display:none"></div>

  <input class="search" id="po-search" type="text" placeholder="&#128269; Search orders — PO number, vendor, job, invoice…"
         oninput="onSearch(this.value)" autocomplete="off" />

  <div class="filter-bar">
    <select id="f-division" onchange="onFilter('division', this.value)" aria-label="Filter by division">
      <option value="">All divisions</option>
    </select>
    <select id="f-status" onchange="onFilter('status', this.value)" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="closed">Closed</option>
    </select>
    <select id="f-job" onchange="onFilter('job', this.value)" aria-label="Filter by job">
      <option value="">Job and non-job</option>
      <option value="job">Tied to a job</option>
      <option value="general">General — no job</option>
    </select>
    <select id="f-vendor" onchange="onFilter('vendor', this.value)" aria-label="Filter by vendor">
      <option value="">All vendors</option>
    </select>
    <span id="result-count" style="font-size:0.74rem;color:var(--muted);margin-left:auto"></span>
  </div>

  <div class="table-wrap">
    <table class="po">
      <thead><tr>
        <th style="width:26px"></th>
        <th>PO #</th>
        <th style="min-width:118px">Date</th>
        <th style="min-width:130px">Division</th>
        <th style="min-width:160px">Job</th>
        <th style="min-width:180px">Cost / Sub Code</th>
        <th style="min-width:140px">Description</th>
        <th style="min-width:140px">Vendor</th>
        <th class="r">Qty</th>
        <th class="r">Amount</th>
        <th class="r">Total</th>
        <th style="min-width:118px">Status</th>
        <th style="width:46px;text-align:center" title="Attached receipts">&#128206;</th>
        <th style="width:34px"><span class="sr-only">Delete</span></th>
      </tr></thead>
      <tbody id="po-body"></tbody>
    </table>
  </div>

  <div class="cards" id="po-cards"></div>

  <div id="pager" class="pager" style="display:none"></div>
</main>

<div class="save-indicator idle" id="save-indicator"><span class="si-label"></span></div>
<div class="toast" id="toast"></div>

<!-- ══════════════ RECEIPT SCAN SHEET ══════════════ -->
<div class="backdrop" id="scan-backdrop">
  <div class="sheet" id="scan-sheet"></div>
</div>

<!-- ══════════════ ATTACHMENTS SHEET ══════════════ -->
<div class="backdrop" id="docs-backdrop">
  <div class="sheet" id="docs-sheet"></div>
</div>

<!-- Hidden capture inputs. `capture="environment"` was on the receipt input to
     jump straight to the rear camera, and on iOS that is all it offers: the
     camera roll is unreachable, so a receipt photographed before signing in, or
     one a driver sent through, could not be used at all. Without it both phones
     show a chooser whose first option is still the camera, which costs one tap
     and buys back every photo already on the device. The old comment below
     described the attach input, which never had it.
     `capture` asks a phone for the rear camera and is
     ignored on a desktop, which then offers the file picker instead. -->
<input type="file" id="receipt-capture" accept="image/*" style="display:none" />
<input type="file" id="attach-capture"  accept="image/*,application/pdf" style="display:none" />

<datalist id="vendor-list"></datalist>

<script>
/* ═══════════════════════════════════════════
   AUTH
═══════════════════════════════════════════ */
const fctToken    = localStorage.getItem('fct_token');
const fctUser     = (() => { try { return JSON.parse(localStorage.getItem('fct_user')); } catch { return null; } })();
const fctDivision = localStorage.getItem('fct_division');

const DIVISION = 'purchase_orders';
// The list general orders live in — the same key, named for what it holds.
// Declared here beside DIVISION because capsFor() below reads it, and a const
// still in its temporal dead zone throws on load rather than reading undefined.
const GENERAL  = 'purchase_orders';
const API_BASE = '/api';

if (!fctToken || !fctUser) {
  window.location.replace('index.html');
}
// Arrived through the division selector for this system, same guard the other
// division pages apply.
if (fctDivision !== DIVISION) {
  window.location.replace('divisions.html');
}

let _loggingOut = false;
function logout() {
  if (_loggingOut) return;
  _loggingOut = true;
  localStorage.removeItem('fct_token');
  localStorage.removeItem('fct_user');
  localStorage.removeItem('fct_division');
  window.location.replace('index.html');
}
function switchDivision() {
  localStorage.removeItem('fct_division');
  window.location.replace('divisions.html');
}

/**
 * What this user may do HERE.
 *
 * fctUser.role is the caller's TURF role — login.js sets it from
 * divisionRoles.turf for tracker.html's benefit — so reading it directly would
 * answer about the wrong division. The per-division map comes first and role is
 * only the fallback for a legacy token that carries no map. This mirrors
 * levelFor() in api/lib/auth.js.
 */
// The job divisions purchasing raises orders against. Mirrors
// PO_SOURCE_DIVISIONS in api/lib/auth.js.
const PO_SOURCE = ['turf', 'paving', 'kiewit'];

/**
 * This user's level in one division, with no cross-division guessing.
 *
 * Mirrors levelFor() and hasDivisionAccess() in api/lib/auth.js TOGETHER, which
 * is the only way to get the same answer the server gives. Reading only
 * divisionRoles locked a user with no such map out of every list here while the
 * API accepted every write they made: users.division_roles is nullable, login
 * puts `divisionRoles: null` in the token when it is unset, and the server then
 * falls back to the flat role for whatever allowedDivisions reaches.
 *
 * The fallback is ONLY for a token with no map at all. Reading fctUser.role
 * when a map EXISTS is the trap that put a delete button on rows the server
 * refused — that field is the caller's TURF role, whatever division is asked
 * about.
 */
function _levelIn(division) {
  if (!fctUser) return 'no_access';
  if (fctUser.isPlatformAdmin) return 'admin';

  const dr = fctUser.divisionRoles;
  if (dr && typeof dr === 'object') {
    const r = dr[division];
    return (r && r !== 'no_access') ? r : 'no_access';
  }

  // Legacy token: the division is reachable through allowedDivisions — turf
  // alone when even that is absent — and the level is the flat role.
  const reach = Array.isArray(fctUser.allowedDivisions) && fctUser.allowedDivisions.length
    ? fctUser.allowedDivisions.includes(division)
    : division === 'turf';
  return reach ? (fctUser.role || 'level1') : 'no_access';
}

/**
 * What this user may do with ONE division's orders.
 *
 * Rights here are per division, because that is how the server decides: an
 * order tied to paving is checked against paving. Working it out once for the
 * page and applying it to every row put a delete button on rows the server then
 * refused — and it was worse than that, because the old code fell back to
 * `fctUser.role` when there was no purchasing role, and that field is the
 * caller's TURF role. A turf administrator with no purchasing role was told
 * they could do anything here and could actually do nothing with the general
 * list: the order they raised never saved, and the row could not be deleted
 * either. Mirrors poCapabilities() in api/lib/auth.js.
 */
function capsFor(division) {
  const own = _levelIn(division);
  // The general list is purchasing's own, so only a purchasing role reaches it.
  const viaPurchasing = (division === GENERAL || PO_SOURCE.includes(division))
    ? _levelIn(DIVISION) : 'no_access';
  const canUpload = l => ['admin', 'level3', 'level2'].includes(l);
  const canManage = l => ['admin', 'level3'].includes(l);
  return {
    canEdit:   canUpload(own) || canUpload(viaPurchasing),
    canDelete: canManage(own) || canManage(viaPurchasing),
  };
}

// Page-level gating: what the toolbar offers. True when the user can act in at
// least one list they can see — the per-row checks decide the rest.
const perm = (() => {
  const reachable = PO_SOURCE.concat([GENERAL]);
  return {
    level:     _levelIn(DIVISION),
    isAdmin:   _levelIn(DIVISION) === 'admin',
    canEdit:   reachable.some(d => capsFor(d).canEdit),
    canDelete: reachable.some(d => capsFor(d).canDelete),
  };
})();

(function renderUserBadge() {

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/**
 * Escape a value for a JS string literal inside an HTML attribute.
 *
 * esc() is not enough here and never was: it turns ' into &#39;, which the HTML
 * parser decodes back to ' before the JS parser ever sees the attribute — so
 * for `onclick="f('...')"` it protects nothing. Ids are uid()-generated
 * everywhere today, but the full-list PUT validates nothing about po.id or
 * line.id, so a crafted id stored by any division user would land here and run
 * in a purchasing session — which holds a carve-out into three divisions that
 * the author does not. Backslash-escape first, then HTML-escape what is left.
 */
/**
 * Escape a value for use inside an id="..." attribute.
 *
 * The companion to jsAttr below, and the other half of the same hole: jsAttr
 * closed the handler ARGUMENTS, but ids were interpolated into id= attributes
 * with no escaping at all, so a double quote in one closed the attribute and
 * could add an event handler of its own. getElementById is given the raw value,
 * which is what it matches on, so only the markup side is encoded.
 */
function idAttr(v) { return esc(v); }

function jsAttr(v) {
  return esc(String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function fmt(n)  { return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function qfmt(n) { const v = Number(n) || 0; return v % 1 === 0 ? v.toLocaleString('en-US') : v.toLocaleString('en-US', { maximumFractionDigits: 3 }); }
function localDateStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/** Whatever the user is in the middle of. A <select> counts. */
function isTyping() {
  const el = document.activeElement;
  return Boolean(el) && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
}

let _toastTimer = null;
function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind === 'err' ? ' err' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'err' ? 6000 : 3000);
}

let _saveHideTimer = null;
function showSave(state, text) {
  const el = document.getElementById('save-indicator');
  el.className = 'save-indicator ' + state;
  el.querySelector('.si-label').textContent = text || '';
  clearTimeout(_saveHideTimer);
  if (state === 'saved') {
    _saveHideTimer = setTimeout(() => {
      if (el.classList.contains('saved')) el.className = 'save-indicator idle';
    }, 2500);
  }
}

async function api(method, path, body) {
  const init = {
    method,
    headers: { 'Authorization': 'Bearer ' + fctToken },
  };
  if (body !== undefined) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(body);
  }
  const res = await fetch(API_BASE + path, init);
  if (res.status === 401) { logout(); throw new Error('Signed out'); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { /* non-JSON error page */ }
  if (!res.ok) {
    const msg = (data && (data.detail || data.error)) || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return data;
}

/* ═══════════════════════════════════════════
   LINE MATH
   Mirrors api/lib/po-sync.js and the division tabs: tax is entered as a
   percentage of the line amount and the dollar figure is kept in step with it,
   so every downstream reader still sees dollars.
═══════════════════════════════════════════ */
function lineAmt(l)    { return (parseFloat(l.qty) || 0) * (parseFloat(l.unit_cost) || 0); }
function lineTaxPct(l) { const p = parseFloat(l.tax_pct); return isNaN(p) ? null : p; }
function lineTax(l)    { const p = lineTaxPct(l); return p === null ? (parseFloat(l.tax) || 0) : lineAmt(l) * p / 100; }
function recalcLineTax(l) {
  if (l.tax_pct == null) return;
  const p = lineTaxPct(l);
  const t = p === null ? 0 : lineAmt(l) * p / 100;
  l.tax = t ? String(t) : '';
}
function poTotals(po) {
  let qty = 0, amt = 0, tax = 0;
  (po.lines || []).forEach(l => { qty += parseFloat(l.qty) || 0; amt += lineAmt(l); tax += lineTax(l); });
  return { qty, amt, tax, total: amt + tax };
}
function newLine() {
  return { id: uid(), invoice_num: '', date: localDateStr(), qty: '', unit_cost: '', tax: '', tax_pct: '', employee: '', po_row_id: null };
}

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */

// poId → the division the SERVER has this order under, which is not always
// where the screen now shows it: re-tying an order sets po._division straight
// away, and this still says where it has to be removed from. Seeded whenever a
// list is read, because an order that arrived before this page did is exactly
// the one someone is most likely to re-tie.
const _savedDivision = {};

// Bumped by every write that reaches the server, so a poll can tell that its
// own fetch predates one. _inflight only says whether a save is in the air at
// the instant it is read — a save that both starts and finishes inside a poll's
// fetch window is invisible to it, and the stale response that comes back then
// shows a completed move as undone and points _savedDivision at the list the
// order has already left.
let _saveEpoch = 0;
const DIV_COLORS = { turf: 'var(--div-turf)', paving: 'var(--div-paving)', kiewit: 'var(--div-kiewit)' };

let catalog       = { divisions: [], vendors: [], employees: [], truncated: [] };
let sourceDivs    = [];        // [{ division, label, projects: [...] }]
let purchaseOrders = [];       // every order across every list, each tagged _division
let docCounts     = {};        // poId → attached document count
// Lists that came back this load. A list that FAILED is not an empty list, and
// treating it as one numbers new orders from PO-0001 straight into a division
// that already has a PO-0001.
let loadedLists   = new Set();
let expanded      = new Set();
let page          = 0;
const PER_PAGE    = 12;
let search        = '';
let filters       = { division: '', status: '', job: '', vendor: '' };

// The canonical labels, so a catalogue failure degrades to the right names
// rather than to raw keys. Mirrors DIVISION_BLOBS in api/po-catalog.js.
const PO_SOURCE_LABELS = { turf: 'Turf Management', paving: 'Paving', kiewit: 'Kiewit Pinetree' };

/**
 * The division rows the UI offers.
 *
 * The catalogue's when it loaded, and the canonical ones when it did not. Every
 * picker and label used to read sourceDivs directly, so a /api/po-catalog
 * failure left it empty and the Division control on every turf, paving and
 * kiewit order collapsed to a single "General" option — showing the general
 * list as selected for orders that are really stored in a job division. The
 * orders come from their own endpoint and arrive fine; only the JOB and CODE
 * pickers genuinely need the catalogue, and those correctly stay empty because
 * the fallback rows carry no projects.
 */
function listDivs() {
  return sourceDivs.length
    ? sourceDivs
    : PO_SOURCE.map(d => ({ division: d, label: PO_SOURCE_LABELS[d] || d, projects: [] }));
}

function divMeta(key) { return listDivs().find(d => d.division === key) || null; }
function divLabel(key) {
  if (!key || key === GENERAL) return 'General';
  const m = divMeta(key);
  return m ? m.label : key;
}
function divColor(key) { return DIV_COLORS[key] || 'var(--div-none)'; }

function projectsFor(divKey) {
  const m = divMeta(divKey);
  return m ? m.projects : [];
}
function projectFor(divKey, projId) {
  return projectsFor(divKey).find(p => p.id === projId) || null;
}
function codesFor(divKey, projId) {
  const p = projectFor(divKey, projId);
  return p ? p.codes : [];
}

/** The label a cost/sub code pair renders as, matching the division tabs. */
function codeLabel(c) {
  const base = [c.cost_code, c.sub_code].filter(Boolean).join(' / ');
  return c.description ? base + ' — ' + c.description : base;
}
function codeValue(c) { return (c.cost_code || '') + '||' + (c.sub_code || ''); }

/**
 * Next PO number for a division's own list.
 *
 * Scoped to that division on purpose: its own tab numbers the same way, off the
 * same list, so an order raised here continues that division's sequence instead
 * of starting a parallel one.
 *
 * `excludeId` is the order being renumbered. Re-tying an order sets its
 * division first, so without this it counts ITSELF — an order carrying PO-0042
 * moved into a list whose highest is PO-0003 would come out as PO-0043,
 * skipping forty numbers of that division's sequence for no reason.
 */
function nextPONumber(divKey, excludeId) {
  // A list that did not load is not an empty one. Numbering off it would start
  // at PO-0001 in a division that already has a PO-0001, and both orders would
  // then live in that division's tab sharing a number.
  if (!loadedLists.has(divKey)) return '';
  const nums = purchaseOrders
    .filter(po => po._division === divKey && po.id !== excludeId)
    .map(po => { const m = (po.po_number || '').match(/^PO-(\d+)$/); return m ? parseInt(m[1], 10) : 0; });
  const next = nums.length ? Math.max.apply(null, nums) + 1 : 1;
  return 'PO-' + String(next).padStart(4, '0');
}

/* ═══════════════════════════════════════════
   LOAD
═══════════════════════════════════════════ */
/** The division filter's options. Built from listDivs so the orders restored
 *  after a catalogue failure stay filterable. */
function renderDivisionFilter() {
  const fDiv = document.getElementById('f-division');
  if (!fDiv) return;
  fDiv.innerHTML = '<option value="">All divisions</option>'
    + listDivs().map(d => '<option value="' + esc(d.division) + '">' + esc(d.label) + '</option>').join('')
    + '<option value="' + GENERAL + '">General — no division</option>';
}

async function loadCatalog() {
  catalog = await api('GET', '/po-catalog');
  sourceDivs = Array.isArray(catalog.divisions) ? catalog.divisions : [];

  renderDivisionFilter();

  const vendors = Array.isArray(catalog.vendors) ? catalog.vendors : [];
  document.getElementById('vendor-list').innerHTML =
    vendors.map(v => '<option value="' + esc(v.name) + '"></option>').join('');
  document.getElementById('f-vendor').innerHTML = '<option value="">All vendors</option>'
    + vendors.map(v => '<option value="' + esc(v.name) + '">' + esc(v.name) + '</option>').join('');

  // What this user can actually do, said once and correctly. The old wording
  // promised Turf, Paving and Kiewit to exactly the users who could not use
  // them either — capsFor(GENERAL) and the purchasing role are the same thing,
  // so it fired for a view-only purchasing user, who can edit nothing anywhere.
  const notes = [];
  const editable = PO_SOURCE.concat([GENERAL]).filter(d => capsFor(d).canEdit);
  const named = d => (d === GENERAL ? 'general (non-job)' : divLabel(d));
  if (!editable.length) {
    notes.push('You can read purchase orders here but not change them. Ask an administrator for a higher level under Manage Users.');
  } else if (!editable.includes(GENERAL)) {
    notes.push('You can raise orders against ' + editable.map(named).join(', ') +
               ' jobs, but not general (non-job) ones — those need a Purchase Orders role.');
  } else if (editable.length === 1) {
    notes.push('You can raise general (non-job) orders here. Raising one against a Turf, Paving or Kiewit job needs a role in that division.');
  }
  if (!sourceDivs.length) {
    notes.push('The job and vendor lists are unavailable, so orders cannot be tied to a job right now.');
  }
  (catalog.truncated || []).forEach(t => {
    notes.push('Showing the ' + t.shown + ' most recent of ' + t.total + ' ' + divLabel(t.division) + ' jobs.');
  });
  const banner = document.getElementById('load-banner');
  banner.style.display = notes.length ? '' : 'none';
  banner.textContent = notes.join(' ');
}

/**
 * Every list this user can see: the job divisions, then the general one.
 *
 * Falls back to the canonical source divisions when the catalogue did not load.
 * Reading the list off `sourceDivs` alone meant a catalogue failure silently
 * collapsed this to the general list, so every turf, paving and kiewit order
 * disappeared from the page — while the banner said orders already raised were
 * still shown below. The orders live behind their own endpoint and are fetched
 * fine without the catalogue; only the job and vendor pickers need it.
 */
function listKeys() {
  return listDivs().map(d => d.division).concat([GENERAL]);
}

async function loadPurchaseOrders() {
  const results = await Promise.all(listKeys().map(async key => {
    try {
      const data = await api('GET', '/purchase-orders?division=' + encodeURIComponent(key));
      const list = Array.isArray(data.purchaseOrders) ? data.purchaseOrders : [];
      // _division is where the order is STORED, which is what makes it visible
      // in that division's own tab. It is stripped before every save so it
      // never reaches the blob the division tabs round-trip.
      list.forEach(po => {
        po._division = key;
        // Where the server ALREADY has this order. Re-tying it to another
        // division sends this as `from` so the order moves lists instead of
        // being copied into the second one — without it the same id goes live
        // in two divisions' tabs at once and the old job keeps its costs.
        _savedDivision[po.id] = key;
        migratePO(po);
      });
      loadedLists.add(key);
      return list;
    } catch (err) {
      console.warn('[po] could not load ' + key + ':', err.message);
      toast(divLabel(key) + ' orders could not be loaded — you cannot raise one there until they are: '
            + err.message, 'err');
      return [];
    }
  }));
  purchaseOrders = [].concat.apply([], results);
}

/**
 * Same upgrade the division tabs apply on read: orders predating the lines[]
 * format, and the move from a flat dollar tax to a percentage. Running it here
 * too keeps an old order editable on this page rather than showing it blank.
 */
function migratePO(po) {
  if (!po.lines) {
    const hasData = po.qty || po.unit_cost;
    po.lines = hasData ? [{
      id: uid(), invoice_num: '', date: po.date_created || localDateStr(),
      qty: po.qty || '', unit_cost: po.unit_cost || '', tax: po.tax || '',
      employee: po.employee || '', po_row_id: po.po_row_id || null,
    }] : [];
  }
  (po.lines || []).forEach(l => {
    if (!l || l.tax_pct != null) return;
    const t = parseFloat(l.tax) || 0;
    if (t <= 0) { l.tax_pct = ''; return; }
    const amt = lineAmt(l);
    if (amt <= 0) return;
    const pct = Math.round(t / amt * 1e6) / 1e4;
    if (Math.abs(amt * pct / 100 - t) >= 0.005) return;
    l.tax_pct = String(pct);
    recalcLineTax(l);
  });
}

async function loadDocCounts() {
  const counts = {};
  await Promise.all(listKeys().map(async key => {
    try {
      // poId names the order the carve-out is granted for. The counts come
      // back for the whole division either way — purchasing can list those
      // orders regardless — but without an order to check against, a caller
      // holding no role in the division is refused and every paperclip on the
      // page reads zero however many receipts are attached.
      const anyPO = purchaseOrders.find(po => po._division === key);
      const q = '/documents?division=' + encodeURIComponent(key) + '&poCounts=1'
              + (anyPO ? '&poId=' + encodeURIComponent(anyPO.id) : '');
      const data = await api('GET', q);
      Object.assign(counts, data.counts || {});
    } catch (err) {
      // A division whose document vault is not reachable just shows no
      // paperclip counts — never a reason to fail the page.
      console.warn('[po] doc counts for ' + key + ':', err.message);
    }
  }));
  docCounts = counts;
}

/* ═══════════════════════════════════════════
   SAVE
   One order at a time, through POST /api/purchase-orders. Never the full-list
   PUT the division tabs use: this page writes into lists it does not own, and
   replacing one wholesale would erase whatever that division saved meanwhile.
═══════════════════════════════════════════ */
const _saveTimers  = {};
let   _inflight    = 0;

// Orders whose latest save did NOT reach the server. Two jobs: the poll must
// not overwrite them with the server's older copy — losing the edit with no
// prompt and no way back — and the poll retries them, so a save lost to a
// dropped connection lands on its own once the signal returns.
const _unsaved = new Set();

// Deliveries this page has removed, per order, until a save confirms it.
// Without this the server cannot tell a delivery the user DELETED from one
// somebody else added while this page held a stale copy — and it has to keep
// the second kind, so it has to be told about the first.
const _deletedLines = {};

// The save in flight for each order, so a second one QUEUES behind it instead
// of racing it. Without this, two saves of one order could both read the stored
// order before either had written, neither would see a po_row_id for the
// delivery, and both would insert a job cost row — charging the job twice and
// orphaning one of the rows past the reach of even deleting the order.
const _saveChain = {};

// Orders deletePO is part-way through. It yields twice — once waiting out a
// save already in flight, once for the DELETE itself — and the row stays on
// screen and editable across both, because nothing re-renders until it is done.
// A keystroke in that window arms a save that outlives the row: the POST lands
// after the order is gone from this page, and for a brand-new order there is no
// DELETE to follow it, so what is left is an order on the server that this
// screen does not show and cannot remove.
const _deleting = new Set();

// Edits made while a delete was in flight. The row stays on screen and editable
// for the whole of it — that is the premise of the guard — so a keystroke lands
// on an order savePO is refusing to queue. On the two paths where the order
// really does go, that is right. On the path where the DELETE FAILS the order
// is still there, still showing what was typed, with nothing queued to write
// it: no timer, no retry-queue entry, and the beforeunload flush reads only
// those two, so the poll silently replaced it with the server's copy 60 seconds
// later and the only thing the page had said was "Not deleted".
const _deferredSaves = new Set();

function poPayload(po) {
  const out = {};
  Object.keys(po).forEach(k => { if (k.charAt(0) !== '_') out[k] = po[k]; });
  out.origin = 'purchasing';
  return out;
}

/** The deliveries removed from this order and not yet confirmed to the server. */
function deletedLinesFor(poId) {
  return _deletedLines[poId] ? [..._deletedLines[poId]] : [];
}

/**
 * Queue a save. Failures are reported and remembered, never thrown here —
 * a debounce timer has nobody to throw to.
 */
function savePO(po, opts) {
  // On its way out: do not resurrect it — but remember that something wanted
  // saving, in case the delete fails and the order survives after all.
  if (_deleting.has(po.id)) { _deferredSaves.add(po.id); return; }
  clearTimeout(_saveTimers[po.id]);
  const delay = (opts && opts.immediate) ? 0 : 500;
  _saveTimers[po.id] = setTimeout(() => {
    _savePONow(po).catch(() => { /* reported by _savePONow; _unsaved holds it */ });
  }, delay);
}

/**
 * Save an order, never concurrently with another save of the same order.
 *
 * Everything that saves goes through here. The chain is per order, so two
 * different orders still save in parallel.
 */
function _savePONow(po) {
  // Checked here too, not only in savePO: the poll's retry loop and commitScan
  // reach this directly.
  //
  // Rejected rather than quietly resolved. commitScan awaits this and, on
  // anything that is not a throw, goes on to tell the user the order was
  // "Saved … with the receipt attached" — which would be false for a save that
  // never happened. Its catch puts the sheet back with the figures and the
  // photo intact. The other two direct callers already catch.
  if (_deleting.has(po.id)) {
    return Promise.reject(new Error('That order is being deleted'));
  }
  const prior = _saveChain[po.id] || Promise.resolve();
  const next = prior
    .catch(() => {})          // a failure must not poison the orders behind it
    .then(() => _savePOWrite(po));
  _saveChain[po.id] = next.catch(() => {});
  return next;
}

async function _savePOWrite(po) {
  delete _saveTimers[po.id];
  _inflight++;
  showSave('saving', 'Saving…');
  try {
    const from = _savedDivision[po.id];
    const qs = '/purchase-orders?division=' + encodeURIComponent(po._division)
             + (from && from !== po._division ? '&from=' + encodeURIComponent(from) : '');
    const sentDeletions = deletedLinesFor(po.id);
    const res = await api('POST', qs, {
      purchaseOrder: poPayload(po),
      deletedLineIds: sentDeletions,
    });

    // The deletions this save carried are now on the server, so stop resending
    // them. Anything removed since is still pending and stays.
    if (_deletedLines[po.id]) {
      sentDeletions.forEach(id => _deletedLines[po.id].delete(id));
      if (!_deletedLines[po.id].size) delete _deletedLines[po.id];
    }

    // The server mints a po_row_id for any delivery line it created a job cost
    // row for. Keeping those is what stops the next save creating a SECOND row
    // for the same delivery.
    if (res && res.purchaseOrder && Array.isArray(res.purchaseOrder.lines)) {
      const byId = {};
      res.purchaseOrder.lines.forEach(l => { if (l && l.id) byId[l.id] = l; });
      (po.lines || []).forEach(l => {
        if (l && byId[l.id]) l.po_row_id = byId[l.id].po_row_id || null;
      });

      // Deliveries somebody else recorded on this order while this page held an
      // older copy. The server kept them rather than letting this save drop
      // them; take them on screen too, so the list stops being short and the
      // user can see what arrived.
      if (res.mergedLines > 0 && !isTyping()) {
        po.lines = res.purchaseOrder.lines;
        toast(res.mergedLines + ' ' + (res.mergedLines === 1 ? 'delivery was' : 'deliveries were') +
              ' added to ' + (po.po_number || 'this order') + ' by someone else — shown now.');
        render();
      }
    }
    // Only once the server confirms the order is out of the list it came from.
    // staleCopy means the move half-landed: the order is saved, but the old
    // division still lists it. Leaving this note alone means the next save
    // sends the same `from` and finishes the move.
    if (res && res.staleCopy) {
      // The move half landed: stored in the new list, still listed in the old.
      // _savedDivision stays on the old division so the next save repeats the
      // move — and the order stays in _unsaved so there IS a next save. Without
      // that nothing was scheduled and the duplicate became permanent.
      toast('Saved, but ' + divLabel(from) + ' still shows a copy. Clearing it…', 'err');
      _unsaved.add(po.id);
    } else {
      _savedDivision[po.id] = po._division;
      _unsaved.delete(po.id);
    }

    _saveEpoch++;
    _inflight = Math.max(0, _inflight - 1);
    if (_inflight === 0) showSave('saved', 'Saved');
    return po;
  } catch (err) {
    // Remembered, so the poll keeps this copy instead of replacing it with the
    // server's older one, and retries it on the next tick.
    _unsaved.add(po.id);
    // Bumped on failure too: a save can fail having already changed the server,
    // and a poll that fetched before it has no way to know which.
    _saveEpoch++;
    _inflight = Math.max(0, _inflight - 1);
    showSave('error', 'Not saved');
    toast('Could not save ' + (po.po_number || 'the order') + ': ' + err.message +
          ' — it will be retried.', 'err');
    // Rethrown so a caller awaiting this save learns it failed. commitScan told
    // the user "Saved … with the receipt attached" for an order that was never
    // written, because this swallowed the error and it fell through to the
    // success path.
    throw err;
  }
}

/** Flush anything still debounced before the tab goes away. */
window.addEventListener('beforeunload', () => {
  // Debounced saves AND ones that failed. A failed save has no timer, so
  // flushing only the timers let a delivery the user could still see on screen
  // — and had been told would be retried — leave with the tab.
  const outstanding = new Set(Object.keys(_saveTimers).concat([..._unsaved]));
  outstanding.forEach(id => {
    // An order on its way out leaves with the tab. This is the one writer the
    // delete guard did not reach, and the worst placed to miss it: the DELETE
    // is an ordinary fetch the unload aborts, while this POST is keepalive and
    // gets delivered regardless — so closing the tab straight after a delete
    // re-created the order and its job cost rows behind the user.
    if (_deleting.has(id)) return;
    const po = purchaseOrders.find(p => p.id === id);
    if (!po) return;
    clearTimeout(_saveTimers[id]);
    const from = _savedDivision[id];
    const qs = API_BASE + '/purchase-orders?division=' + encodeURIComponent(po._division)
             + (from && from !== po._division ? '&from=' + encodeURIComponent(from) : '');
    try {
      fetch(qs, {
        method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + fctToken },
        // The deletions go too. Without them the server cannot tell a delivery
        // this tab REMOVED from one it never saw, so unseenLines merges it back
        // and the removal the user watched happen is undone by the save meant
        // to record it.
        body: JSON.stringify({
          purchaseOrder:  poPayload(po),
          deletedLineIds: deletedLinesFor(id),
        }),
      });
    } catch { /* the tab is closing; nothing useful to do */ }
  });
});

/* ═══════════════════════════════════════════
   CRUD
═══════════════════════════════════════════ */
/** The list a new order should start in: general when that is usable, else the
 *  first job division this user can actually write to. Starting somewhere they
 *  cannot save to produces an order that never reaches the server. */
function defaultNewDivision() {
  const usable = d => capsFor(d).canEdit && loadedLists.has(d);
  if (usable(GENERAL)) return GENERAL;
  return listDivs().map(d => d.division).find(usable) || null;
}

function newPO(seed) {
  if (!perm.canEdit) return;
  if (!(seed && seed._division) && !defaultNewDivision()) {
    toast('No purchase-order list is available to raise an order in right now. Reload and try again.', 'err');
    return;
  }
  // A new order starts general where that is allowed. Picking a division is the
  // first thing the form asks for, and until it is answered the order belongs to
  // no job ledger — which is also the finished state for the many orders that
  // never have one.
  const div = (seed && seed._division) || defaultNewDivision();
  const po = {
    id:           uid(),
    po_number:    nextPONumber(div),
    title:        (seed && seed.title)    || '',
    supplier:     (seed && seed.supplier) || '',
    status:       'pending',
    date_created: (seed && seed.date_created) || localDateStr(),
    project_id:   (seed && seed.project_id) || '',
    cost_code:    (seed && seed.cost_code)  || '',
    sub_code:     (seed && seed.sub_code)   || '',
    notes:        (seed && seed.notes)      || '',
    origin:       'purchasing',
    lines:        (seed && seed.lines) || [newLine()],
    _division:    div,
  };
  purchaseOrders.push(po);
  expanded.add(po.id);
  page = 0;
  savePO(po, { immediate: true });
  render();
  return po;
}

function addLine(poId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  if (!po.lines) po.lines = [];
  po.lines.push(newLine());
  expanded.add(poId);
  savePO(po);
  render();
}

function deleteLine(poId, lineId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  // Remembered until the save lands. The server keeps any stored delivery this
  // page did not send, so without this a removal would simply be undone.
  (_deletedLines[poId] || (_deletedLines[poId] = new Set())).add(lineId);
  po.lines = (po.lines || []).filter(l => l.id !== lineId);
  // The job cost row this delivery created goes with it — the server reconciles
  // that from the line list, so nothing else is needed here.
  savePO(po, { immediate: true });
  render();
}

async function deletePO(poId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canDelete) return;
  const tied = po.project_id ? ' It will also be removed from that job’s costs.' : '';
  if (!confirm('Delete ' + (po.po_number || 'this order') + '?' + tied)) return;

  // Held for the whole of what follows. Both awaits below leave the row on
  // screen and editable, and savePO/_savePONow check this — otherwise a
  // keystroke in either window arms a save that outlives the row.
  _deleting.add(poId);
  try {
    clearTimeout(_saveTimers[poId]);
    delete _saveTimers[poId];

    // "Never stored" is not the same as "not stored YET". An order whose first
    // save is still on the wire will exist a moment from now, so let that save
    // settle before deciding — otherwise the row leaves the screen, no DELETE is
    // sent, and the POST lands afterwards leaving an order nobody can see and
    // nobody will ever remove.
    if (_saveChain[poId]) {
      try { await _saveChain[poId]; } catch { /* it failed, so nothing was stored */ }
    }

    // An order the server has never stored is only on this screen, so there is
    // nothing to ask it to delete — and asking would fail. A new order whose
    // first save never landed used to be undeletable for exactly that reason:
    // the delete was refused, the row stayed, and it sat in the retry queue
    // failing forever with no way to get rid of it.
    if (!_savedDivision[poId]) {
      purchaseOrders = purchaseOrders.filter(p => p.id !== poId);
      expanded.delete(poId);
      _unsaved.delete(poId);
      clearTimeout(_saveTimers[poId]);
      delete _saveTimers[poId];
      delete _saveChain[poId];
      delete _deletedLines[poId];
      showSave('saved', 'Removed');
      render();
      return;
    }

    showSave('saving', 'Deleting…');
    try {
      await api('DELETE', '/purchase-orders?division=' + encodeURIComponent(po._division)
                        + '&id=' + encodeURIComponent(poId));
      purchaseOrders = purchaseOrders.filter(p => p.id !== poId);
      expanded.delete(poId);
      _unsaved.delete(poId);
      clearTimeout(_saveTimers[poId]);
      delete _saveTimers[poId];
      delete _savedDivision[poId];
      delete _saveChain[poId];
      delete _deletedLines[poId];
      // A DELETE is a server write like any other: a poll that fetched before it
      // would otherwise bring the order back.
      _saveEpoch++;
      showSave('saved', 'Deleted');
      render();
    } catch (err) {
      showSave('error', 'Not deleted');
      toast('Could not delete ' + (po.po_number || 'the order') + ': ' + err.message, 'err');
    }
  } finally {
    _deleting.delete(poId);
    // Replayed only if the order is still here, which means the delete failed.
    // On both success paths it has been spliced out and there is nothing to
    // save; the entry is dropped either way.
    if (_deferredSaves.delete(poId)) {
      const survived = purchaseOrders.find(p => p.id === poId);
      if (survived) savePO(survived, { immediate: true });
    }
  }
}

function toggleLines(poId) {
  if (expanded.has(poId)) expanded.delete(poId); else expanded.add(poId);
  render();
}

/* ═══════════════════════════════════════════
   FIELD EDITS
═══════════════════════════════════════════ */

/**
 * Re-tie an order to a different division.
 *
 * The order MOVES list: it is written into the new division's and removed from
 * the old one's in a single call, so it can never be in two at once. The job
 * and its codes are cleared because they belonged to the old division — a
 * paving job id means nothing in turf, and silently keeping it would cost the
 * wrong job.
 */
function setDivision(poId, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  const next = value || GENERAL;
  if (next === po._division) return;

  // Renumbered into the sequence of the list it is joining, so it does not
  // collide with an order that division already has. Its own id is excluded —
  // it is about to be moved into that list.
  //
  // Worked out BEFORE anything is mutated, because a list that did not load
  // cannot be numbered against and nextPONumber says so with ''. Storing that
  // put the order live in the other division's tab with a blank PO number,
  // which nothing on this page or the division tabs can ever set.
  const num = nextPONumber(next, po.id);
  if (!num) {
    toast(divLabel(next) + ' orders could not be loaded, so an order cannot be moved into that list yet. Reload and try again.', 'err');
    render();   // put the dropdown back on the division the order is still in
    return;
  }

  po._division  = next;
  po.project_id = '';
  po.cost_code  = '';
  po.sub_code   = '';
  po.po_number  = num;
  savePO(po, { immediate: true });
  render();
}

function setProject(poId, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  if ((po.project_id || '') === (value || '')) return;
  po.project_id = value || '';
  // Codes come from the job's own bid items, so they cannot survive a job change.
  po.cost_code = '';
  po.sub_code  = '';
  savePO(po, { immediate: true });
  render();
}

function setSubCode(poId, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  const parts = String(value || '').split('||');
  po.cost_code = parts[0] || '';
  po.sub_code  = parts[1] || '';
  savePO(po, { immediate: true });
  render();
}

function setField(poId, field, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  if (field === 'status' && po.status !== value) {
    po.status_changed_at = new Date().toISOString();
    po.status_changed_by = (fctUser && fctUser.username) || '';
  }
  po[field] = value;
  savePO(po, field === 'status' ? { immediate: true } : undefined);
  if (field === 'status') render();
}

function setLineField(poId, lineId, field, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  const line = (po.lines || []).find(l => l.id === lineId);
  if (!line) return;
  line[field] = value;
  if (field === 'qty' || field === 'unit_cost' || field === 'tax_pct') recalcLineTax(line);
  savePO(po);
  updateTotalsInPlace(po, line);
}

/**
 * Repaint just the money on screen after a keystroke.
 *
 * A full re-render would tear the focus out of the input being typed in, which
 * is what the division tabs avoid the same way.
 */
function updateTotalsInPlace(po, line) {
  const tot = poTotals(po);
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };

  if (line) {
    const amt = lineAmt(line), tax = lineTax(line);
    // Both surfaces. The table and the card editor are both in the document at
    // all times — only one is displayed — so updating a single prefix leaves
    // whichever the user is actually looking at frozen.
    ['tbl', 'card'].forEach(sfc => {
      set(sfc + '-amt-' + line.id, amt !== 0 ? '$' + fmt(amt) : '—');
      set(sfc + '-tax-' + line.id, tax !== 0 ? '$' + fmt(tax) : '');
      set(sfc + '-tot-' + line.id, (amt + tax) !== 0 ? '$' + fmt(amt + tax) : '—');
    });
  }

  set('po-qty-' + po.id, tot.qty !== 0 ? qfmt(tot.qty) : '—');
  set('po-amt-' + po.id, tot.amt !== 0 ? '$' + fmt(tot.amt) : '—');
  set('po-tot-' + po.id, tot.total !== 0 ? '$' + fmt(tot.total) : '—');
  set('card-tot-' + po.id, '$' + fmt(tot.total));

  // The RUNNING TOTAL under a multi-delivery order. Without this it kept the
  // pre-edit figures while the order's header total moved, so the two
  // disagreed on screen — and somebody reconciling against an invoice read the
  // wrong sub-total — until an unrelated re-render happened to run.
  set('run-qty-' + po.id, qfmt(tot.qty));
  set('run-amt-' + po.id, '$' + fmt(tot.amt));
  set('run-tax-' + po.id, '$' + fmt(tot.tax));
  set('run-tot-' + po.id, '$' + fmt(tot.total));
}

/* ═══════════════════════════════════════════
   FILTER / SEARCH
═══════════════════════════════════════════ */
let _searchTimer = null;
function onSearch(value) {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => { search = value; page = 0; render(); }, 180);
}
function onFilter(key, value) { filters[key] = value; page = 0; render(); }
function clearFilters() {
  filters = { division: '', status: '', job: '', vendor: '' };
  search = '';
  page = 0;
  ['f-division','f-status','f-job','f-vendor'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('po-search').value = '';
  render();
}
function hasFilters() {
  return Boolean(search) || Object.keys(filters).some(k => filters[k]);
}
function togglePending() {
  filters.status = filters.status === 'pending' ? '' : 'pending';
  document.getElementById('f-status').value = filters.status;
  page = 0;
  render();
}

function visiblePOs() {
  const q = search.trim().toLowerCase();
  return purchaseOrders.filter(po => {
    if (filters.division && po._division !== filters.division) return false;
    if (filters.status   && (po.status || 'pending') !== filters.status) return false;
    if (filters.vendor   && (po.supplier || '') !== filters.vendor) return false;
    if (filters.job === 'job'     && !po.project_id) return false;
    if (filters.job === 'general' && po.project_id)  return false;
    if (!q) return true;
    const proj = projectFor(po._division, po.project_id);
    const lineHay = (po.lines || []).map(l => [l.invoice_num, l.employee, l.date].join(' ')).join(' ');
    const hay = [
      po.po_number, divLabel(po._division), proj ? proj.name : '', proj ? proj.jobNumber : '',
      po.cost_code, po.sub_code, po.title, po.supplier, po.status, po.date_created, po.notes, lineHay,
    ].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function divisionSelectHTML(po) {
  // A division this user cannot write to is offered only when the order is
  // already in it — moving an order somewhere it could never be saved just
  // produces a failure the user cannot undo. A list that did not LOAD is the
  // same: its orders are not here, so nothing could be numbered against them.
  const offer = d => (capsFor(d).canEdit && loadedLists.has(d)) || po._division === d;
  const opts = [];
  if (offer(GENERAL)) {
    opts.push('<option value="' + GENERAL + '"' + (po._division === GENERAL ? ' selected' : '') + '>General — no division</option>');
  }
  listDivs().forEach(d => {
    if (!offer(d.division)) return;
    opts.push('<option value="' + esc(d.division) + '"' + (po._division === d.division ? ' selected' : '') + '>' + esc(d.label) + '</option>');
  });
  return '<select ' + (capsFor(po._division).canEdit ? '' : 'disabled ') +
    'onchange="setDivision(\'' + jsAttr(po.id) + '\', this.value)" aria-label="Division">' + opts.join('') + '</select>';
}

function projectSelectHTML(po) {
  if (po._division === GENERAL) {
    return '<span style="color:var(--muted);font-size:0.76rem">Pick a division first</span>';
  }
  const list = projectsFor(po._division);
  const opts = ['<option value=""' + (!po.project_id ? ' selected' : '') + '>General — no job</option>']
    .concat(list.map(p => {
      const label = p.name + (p.jobNumber ? '  (#' + p.jobNumber + ')' : '');
      return '<option value="' + esc(p.id) + '"' + (po.project_id === p.id ? ' selected' : '') + '>' + esc(label) + '</option>';
    }));
  // A job that has since been removed from the division still labels its order,
  // rather than the select silently snapping to another job.
  if (po.project_id && !projectFor(po._division, po.project_id)) {
    opts.push('<option value="' + esc(po.project_id) + '" selected>' + esc(po.project_id) + ' (missing)</option>');
  }
  return '<select ' + (capsFor(po._division).canEdit ? '' : 'disabled ') +
    'onchange="setProject(\'' + jsAttr(po.id) + '\', this.value)" aria-label="Job">' + opts.join('') + '</select>';
}

function subCodeSelectHTML(po) {
  if (!po.project_id) {
    return '<span style="color:var(--muted);font-size:0.76rem">' +
      (po._division === GENERAL ? '—' : 'No job — no code') + '</span>';
  }
  const codes = codesFor(po._division, po.project_id);
  const current = (po.cost_code || '') + '||' + (po.sub_code || '');
  if (!codes.length) {
    return '<span style="color:var(--muted);font-size:0.76rem">No bid items on this job</span>';
  }
  const opts = ['<option value=""' + (current === '||' ? ' selected' : '') + '>— select —</option>']
    .concat(codes.map(c =>
      '<option value="' + esc(codeValue(c)) + '"' + (codeValue(c) === current ? ' selected' : '') + '>' + esc(codeLabel(c)) + '</option>'));
  if (current !== '||' && !codes.some(c => codeValue(c) === current)) {
    opts.push('<option value="' + esc(current) + '" selected>' +
      esc([po.cost_code, po.sub_code].filter(Boolean).join(' / ')) + ' (not on this job)</option>');
  }
  return '<select ' + (capsFor(po._division).canEdit ? '' : 'disabled ') +
    'onchange="setSubCode(\'' + jsAttr(po.id) + '\', this.value)" aria-label="Cost and sub code">' + opts.join('') + '</select>';
}

function statusSelectHTML(po) {
  const cur = po.status || 'pending';
  const opts = [['pending','Pending'],['approved','Approved'],['closed','Closed']]
    .map(o => '<option value="' + o[0] + '"' + (cur === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('');
  return '<select ' + (capsFor(po._division).canEdit ? '' : 'disabled ') +
    'onchange="setField(\'' + jsAttr(po.id) + '\', \'status\', this.value)" aria-label="Status">' + opts + '</select>';
}

function docBtnHTML(po) {
  const n = docCounts[po.id] || 0;
  return '<button class="icon-btn' + (n ? ' has' : '') + '" onclick="openDocs(\'' + jsAttr(po.id) + '\')" ' +
    'title="' + (n ? n + ' attached' : 'Attach a receipt') + '">&#128206;' + (n || '') + '</button>';
}

function divChipHTML(key) {
  return '<span class="div-chip" style="background:' + divColor(key) + '22;color:' + divColor(key) + '">' +
    esc(divLabel(key)) + '</span>';
}

/**
 * Delivery rows for one order.
 *
 * `surface` prefixes the cell ids. Both the desktop table and the phone card
 * editor render these into the live document — the media query only sets
 * display:none, so both trees always exist — and without the prefix each id
 * existed twice. getElementById returns the first match, which is the hidden
 * desktop table, so on a phone the Amount, Tax and Total a user was typing
 * into never moved off "—" while the order's headline total did.
 */
function lineRowsHTML(po, surface) {
  // Markup-encoded; getElementById is still given the raw value it matches on.
  const cell = (kind, id) => esc((surface || 'tbl') + '-' + kind + '-' + id);
  return (po.lines || []).map(l => {
    const amt = lineAmt(l), tax = lineTax(l);
    const inp = (field, type, val, extra) =>
      '<input type="' + type + '" class="boxed" value="' + esc(val == null ? '' : val) + '" ' +
      (capsFor(po._division).canEdit ? '' : 'disabled ') + (extra || '') +
      ' oninput="setLineField(\'' + jsAttr(po.id) + '\',\'' + jsAttr(l.id) + '\',\'' + field + '\', this.value)">';
    return '<tr>' +
      '<td style="min-width:120px">' + inp('invoice_num','text', l.invoice_num, 'placeholder="Invoice / Ticket #"') + '</td>' +
      '<td style="min-width:118px">' + inp('date','date', l.date) + '</td>' +
      '<td style="min-width:74px">'  + inp('qty','number', l.qty, 'step="any" placeholder="0"') + '</td>' +
      '<td style="min-width:92px">'  + inp('unit_cost','number', l.unit_cost, 'step="any" placeholder="0.00"') + '</td>' +
      '<td class="r" style="color:var(--ok)" id="' + cell('amt', l.id) + '">' + (amt !== 0 ? '$' + fmt(amt) : '—') + '</td>' +
      '<td style="min-width:92px">' +
        '<div style="display:flex;align-items:center;gap:0.15rem">' +
          inp('tax_pct','number', l.tax_pct, 'step="any" placeholder="0"') +
          '<span style="color:var(--muted);font-size:0.72rem">%</span></div>' +
        '<div class="r" style="font-size:0.62rem;color:var(--muted);padding-right:0.6rem" id="' + cell('tax', l.id) + '">' +
          (tax !== 0 ? '$' + fmt(tax) : '') + '</div>' +
      '</td>' +
      '<td class="r" style="color:var(--yellow);font-weight:600" id="' + cell('tot', l.id) + '">' +
        ((amt + tax) !== 0 ? '$' + fmt(amt + tax) : '—') + '</td>' +
