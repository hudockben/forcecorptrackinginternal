/** Every list this user can see: the job divisions, then the general one. */
function listKeys() {
  return sourceDivs.map(d => d.division).concat([GENERAL]);
}

async function loadPurchaseOrders() {
  const results = await Promise.all(listKeys().map(async key => {
    try {
      const data = await api('GET', '/purchase-orders?division=' + encodeURIComponent(key));
      const list = Array.isArray(data.purchaseOrders) ? data.purchaseOrders : [];
      // _division is where the order is STORED, which is what makes it visible
      // in that division's own tab. It is stripped before every save so it
      // never reaches the blob the division tabs round-trip.
      list.forEach(po => {
        po._division = key;
        // Where the server ALREADY has this order. Re-tying it to another
        // division sends this as `from` so the order moves lists instead of
        // being copied into the second one — without it the same id goes live
        // in two divisions' tabs at once and the old job keeps its costs.
        _savedDivision[po.id] = key;
        migratePO(po);
      });
      return list;
    } catch (err) {
      console.warn('[po] could not load ' + key + ':', err.message);
      toast('Could not load ' + divLabel(key) + ' orders: ' + err.message, 'err');
      return [];
    }
  }));
  purchaseOrders = [].concat.apply([], results);
}

/**
 * Same upgrade the division tabs apply on read: orders predating the lines[]
 * format, and the move from a flat dollar tax to a percentage. Running it here
 * too keeps an old order editable on this page rather than showing it blank.
 */
function migratePO(po) {
  if (!po.lines) {
    const hasData = po.qty || po.unit_cost;
    po.lines = hasData ? [{
      id: uid(), invoice_num: '', date: po.date_created || localDateStr(),
      qty: po.qty || '', unit_cost: po.unit_cost || '', tax: po.tax || '',
      employee: po.employee || '', po_row_id: po.po_row_id || null,
    }] : [];
  }
  (po.lines || []).forEach(l => {
    if (!l || l.tax_pct != null) return;
    const t = parseFloat(l.tax) || 0;
    if (t <= 0) { l.tax_pct = ''; return; }
    const amt = lineAmt(l);
    if (amt <= 0) return;
    const pct = Math.round(t / amt * 1e6) / 1e4;
    if (Math.abs(amt * pct / 100 - t) >= 0.005) return;
    l.tax_pct = String(pct);
    recalcLineTax(l);
  });
}

async function loadDocCounts() {
  const counts = {};
  await Promise.all(listKeys().map(async key => {
    try {
      // poId names the order the carve-out is granted for. The counts come
      // back for the whole division either way — purchasing can list those
      // orders regardless — but without an order to check against, a caller
      // holding no role in the division is refused and every paperclip on the
      // page reads zero however many receipts are attached.
      const anyPO = purchaseOrders.find(po => po._division === key);
      const q = '/documents?division=' + encodeURIComponent(key) + '&poCounts=1'
              + (anyPO ? '&poId=' + encodeURIComponent(anyPO.id) : '');
      const data = await api('GET', q);
      Object.assign(counts, data.counts || {});
    } catch (err) {
      // A division whose document vault is not reachable just shows no
      // paperclip counts — never a reason to fail the page.
      console.warn('[po] doc counts for ' + key + ':', err.message);
    }
  }));
  docCounts = counts;
}

/* ═══════════════════════════════════════════
   SAVE
   One order at a time, through POST /api/purchase-orders. Never the full-list
   PUT the division tabs use: this page writes into lists it does not own, and
   replacing one wholesale would erase whatever that division saved meanwhile.
═══════════════════════════════════════════ */
const _saveTimers  = {};
let   _inflight    = 0;

// Orders whose latest save did NOT reach the server. Two jobs: the poll must
// not overwrite them with the server's older copy — losing the edit with no
// prompt and no way back — and the poll retries them, so a save lost to a
// dropped connection lands on its own once the signal returns.
const _unsaved = new Set();

// The save in flight for each order, so a second one QUEUES behind it instead
// of racing it. Without this, two saves of one order could both read the stored
// order before either had written, neither would see a po_row_id for the
// delivery, and both would insert a job cost row — charging the job twice and
// orphaning one of the rows past the reach of even deleting the order.
const _saveChain = {};

function poPayload(po) {
  const out = {};
  Object.keys(po).forEach(k => { if (k.charAt(0) !== '_') out[k] = po[k]; });
  out.origin = 'purchasing';
  return out;
}

/**
 * Queue a save. Failures are reported and remembered, never thrown here —
 * a debounce timer has nobody to throw to.
 */
function savePO(po, opts) {
  clearTimeout(_saveTimers[po.id]);
  const delay = (opts && opts.immediate) ? 0 : 500;
  _saveTimers[po.id] = setTimeout(() => {
    _savePONow(po).catch(() => { /* reported by _savePONow; _unsaved holds it */ });
  }, delay);
}

/**
 * Save an order, never concurrently with another save of the same order.
 *
 * Everything that saves goes through here. The chain is per order, so two
 * different orders still save in parallel.
 */
function _savePONow(po) {
  const prior = _saveChain[po.id] || Promise.resolve();
  const next = prior
    .catch(() => {})          // a failure must not poison the orders behind it
    .then(() => _savePOWrite(po));
  _saveChain[po.id] = next.catch(() => {});
  return next;
}

async function _savePOWrite(po) {
  delete _saveTimers[po.id];
  _inflight++;
  showSave('saving', 'Saving…');
  try {
    const from = _savedDivision[po.id];
    const qs = '/purchase-orders?division=' + encodeURIComponent(po._division)
             + (from && from !== po._division ? '&from=' + encodeURIComponent(from) : '');
    const res = await api('POST', qs, { purchaseOrder: poPayload(po) });

    // The server mints a po_row_id for any delivery line it created a job cost
    // row for. Keeping those is what stops the next save creating a SECOND row
    // for the same delivery.
    if (res && res.purchaseOrder && Array.isArray(res.purchaseOrder.lines)) {
      const byId = {};
      res.purchaseOrder.lines.forEach(l => { if (l && l.id) byId[l.id] = l; });
      (po.lines || []).forEach(l => {
        if (l && byId[l.id]) l.po_row_id = byId[l.id].po_row_id || null;
      });
    }
    // Only once the server confirms the order is out of the list it came from.
    // staleCopy means the move half-landed: the order is saved, but the old
    // division still lists it. Leaving this note alone means the next save
    // sends the same `from` and finishes the move.
    if (res && res.staleCopy) {
      // The move half landed: stored in the new list, still listed in the old.
      // _savedDivision stays on the old division so the next save repeats the
      // move — and the order stays in _unsaved so there IS a next save. Without
      // that nothing was scheduled and the duplicate became permanent.
      toast('Saved, but ' + divLabel(from) + ' still shows a copy. Clearing it…', 'err');
      _unsaved.add(po.id);
    } else {
      _savedDivision[po.id] = po._division;
      _unsaved.delete(po.id);
    }

    _inflight = Math.max(0, _inflight - 1);
    if (_inflight === 0) showSave('saved', 'Saved');
    return po;
  } catch (err) {
    // Remembered, so the poll keeps this copy instead of replacing it with the
    // server's older one, and retries it on the next tick.
    _unsaved.add(po.id);
    _inflight = Math.max(0, _inflight - 1);
    showSave('error', 'Not saved');
    toast('Could not save ' + (po.po_number || 'the order') + ': ' + err.message +
          ' — it will be retried.', 'err');
    // Rethrown so a caller awaiting this save learns it failed. commitScan told
    // the user "Saved … with the receipt attached" for an order that was never
    // written, because this swallowed the error and it fell through to the
    // success path.
    throw err;
  }
}

/** Flush anything still debounced before the tab goes away. */
window.addEventListener('beforeunload', () => {
  // Debounced saves AND ones that failed. A failed save has no timer, so
  // flushing only the timers let a delivery the user could still see on screen
  // — and had been told would be retried — leave with the tab.
  const outstanding = new Set(Object.keys(_saveTimers).concat([..._unsaved]));
  outstanding.forEach(id => {
    const po = purchaseOrders.find(p => p.id === id);
    if (!po) return;
    clearTimeout(_saveTimers[id]);
    const from = _savedDivision[id];
    const qs = API_BASE + '/purchase-orders?division=' + encodeURIComponent(po._division)
             + (from && from !== po._division ? '&from=' + encodeURIComponent(from) : '');
    try {
      fetch(qs, {
        method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + fctToken },
        body: JSON.stringify({ purchaseOrder: poPayload(po) }),
      });
    } catch { /* the tab is closing; nothing useful to do */ }
  });
});

/* ═══════════════════════════════════════════
   CRUD
═══════════════════════════════════════════ */
/** The list a new order should start in: general when that is usable, else the
 *  first job division this user can actually write to. Starting somewhere they
 *  cannot save to produces an order that never reaches the server. */
function defaultNewDivision() {
  if (capsFor(GENERAL).canEdit) return GENERAL;
  const usable = sourceDivs.map(d => d.division).find(d => capsFor(d).canEdit);
  return usable || GENERAL;
}

function newPO(seed) {
  if (!perm.canEdit) return;
  // A new order starts general where that is allowed. Picking a division is the
  // first thing the form asks for, and until it is answered the order belongs to
  // no job ledger — which is also the finished state for the many orders that
  // never have one.
  const div = (seed && seed._division) || defaultNewDivision();
  const po = {
    id:           uid(),
    po_number:    nextPONumber(div),
    title:        (seed && seed.title)    || '',
    supplier:     (seed && seed.supplier) || '',
    status:       'pending',
    date_created: (seed && seed.date_created) || localDateStr(),
    project_id:   (seed && seed.project_id) || '',
    cost_code:    (seed && seed.cost_code)  || '',
    sub_code:     (seed && seed.sub_code)   || '',
    notes:        (seed && seed.notes)      || '',
    origin:       'purchasing',
    lines:        (seed && seed.lines) || [newLine()],
    _division:    div,
  };
  purchaseOrders.push(po);
  expanded.add(po.id);
  page = 0;
  savePO(po, { immediate: true });
  render();
  return po;
}

function addLine(poId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  if (!po.lines) po.lines = [];
  po.lines.push(newLine());
  expanded.add(poId);
  savePO(po);
  render();
}

function deleteLine(poId, lineId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  po.lines = (po.lines || []).filter(l => l.id !== lineId);
  // The job cost row this delivery created goes with it — the server reconciles
  // that from the line list, so nothing else is needed here.
  savePO(po, { immediate: true });
  render();
}

async function deletePO(poId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canDelete) return;
  const tied = po.project_id ? ' It will also be removed from that job’s costs.' : '';
  if (!confirm('Delete ' + (po.po_number || 'this order') + '?' + tied)) return;

  clearTimeout(_saveTimers[poId]);
  delete _saveTimers[poId];

  // An order the server has never stored is only on this screen, so there is
  // nothing to ask it to delete — and asking would fail. A new order whose
  // first save never landed used to be undeletable for exactly that reason:
  // the delete was refused, the row stayed, and it sat in the retry queue
  // failing forever with no way to get rid of it.
  if (!_savedDivision[poId]) {
    purchaseOrders = purchaseOrders.filter(p => p.id !== poId);
    expanded.delete(poId);
    _unsaved.delete(poId);
    delete _saveChain[poId];
    showSave('saved', 'Removed');
    render();
    return;
  }

  showSave('saving', 'Deleting…');
  try {
    await api('DELETE', '/purchase-orders?division=' + encodeURIComponent(po._division)
                      + '&id=' + encodeURIComponent(poId));
    purchaseOrders = purchaseOrders.filter(p => p.id !== poId);
    expanded.delete(poId);
    _unsaved.delete(poId);
    delete _savedDivision[poId];
    delete _saveChain[poId];
    showSave('saved', 'Deleted');
    render();
  } catch (err) {
    showSave('error', 'Not deleted');
    toast('Could not delete ' + (po.po_number || 'the order') + ': ' + err.message, 'err');
  }
}

function toggleLines(poId) {
  if (expanded.has(poId)) expanded.delete(poId); else expanded.add(poId);
  render();
}

/* ═══════════════════════════════════════════
   FIELD EDITS
═══════════════════════════════════════════ */

/**
 * Re-tie an order to a different division.
 *
 * The order MOVES list: it is written into the new division's and removed from
 * the old one's in a single call, so it can never be in two at once. The job
 * and its codes are cleared because they belonged to the old division — a
 * paving job id means nothing in turf, and silently keeping it would cost the
 * wrong job.
 */
function setDivision(poId, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  const next = value || GENERAL;
  if (next === po._division) return;
  po._division = next;
  po.project_id = '';
  po.cost_code  = '';
  po.sub_code   = '';
  // Renumbered into the sequence of the list it is joining, so it does not
  // collide with an order that division already has. Its own id is excluded —
  // it has already been moved into that list above.
  po.po_number = nextPONumber(next, po.id);
  savePO(po, { immediate: true });
  render();
}

function setProject(poId, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  if ((po.project_id || '') === (value || '')) return;
  po.project_id = value || '';
  // Codes come from the job's own bid items, so they cannot survive a job change.
  po.cost_code = '';
  po.sub_code  = '';
  savePO(po, { immediate: true });
  render();
}

function setSubCode(poId, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  const parts = String(value || '').split('||');
  po.cost_code = parts[0] || '';
  po.sub_code  = parts[1] || '';
  savePO(po, { immediate: true });
  render();
}

function setField(poId, field, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  if (field === 'status' && po.status !== value) {
    po.status_changed_at = new Date().toISOString();
    po.status_changed_by = (fctUser && fctUser.username) || '';
  }
  po[field] = value;
  savePO(po, field === 'status' ? { immediate: true } : undefined);
  if (field === 'status') render();
}

function setLineField(poId, lineId, field, value) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po || !capsFor(po._division).canEdit) return;
  const line = (po.lines || []).find(l => l.id === lineId);
  if (!line) return;
  line[field] = value;
  if (field === 'qty' || field === 'unit_cost' || field === 'tax_pct') recalcLineTax(line);
  savePO(po);
  updateTotalsInPlace(po, line);
}

/**
 * Repaint just the money on screen after a keystroke.
 *
 * A full re-render would tear the focus out of the input being typed in, which
 * is what the division tabs avoid the same way.
 */
function updateTotalsInPlace(po, line) {
  const tot = poTotals(po);
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };

  if (line) {
    const amt = lineAmt(line), tax = lineTax(line);
    // Both surfaces. The table and the card editor are both in the document at
    // all times — only one is displayed — so updating a single prefix leaves
    // whichever the user is actually looking at frozen.
    ['tbl', 'card'].forEach(sfc => {
      set(sfc + '-amt-' + line.id, amt !== 0 ? '$' + fmt(amt) : '—');
      set(sfc + '-tax-' + line.id, tax !== 0 ? '$' + fmt(tax) : '');
      set(sfc + '-tot-' + line.id, (amt + tax) !== 0 ? '$' + fmt(amt + tax) : '—');
    });
  }

  set('po-qty-' + po.id, tot.qty !== 0 ? qfmt(tot.qty) : '—');
  set('po-amt-' + po.id, tot.amt !== 0 ? '$' + fmt(tot.amt) : '—');
  set('po-tot-' + po.id, tot.total !== 0 ? '$' + fmt(tot.total) : '—');
  set('card-tot-' + po.id, '$' + fmt(tot.total));

  // The RUNNING TOTAL under a multi-delivery order. Without this it kept the
  // pre-edit figures while the order's header total moved, so the two
  // disagreed on screen — and somebody reconciling against an invoice read the
  // wrong sub-total — until an unrelated re-render happened to run.
  set('run-qty-' + po.id, qfmt(tot.qty));
  set('run-amt-' + po.id, '$' + fmt(tot.amt));
  set('run-tax-' + po.id, '$' + fmt(tot.tax));
  set('run-tot-' + po.id, '$' + fmt(tot.total));
}

/* ═══════════════════════════════════════════
   FILTER / SEARCH
═══════════════════════════════════════════ */
let _searchTimer = null;
function onSearch(value) {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => { search = value; page = 0; render(); }, 180);
}
function onFilter(key, value) { filters[key] = value; page = 0; render(); }
function clearFilters() {
  filters = { division: '', status: '', job: '', vendor: '' };
  search = '';
  page = 0;
  ['f-division','f-status','f-job','f-vendor'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('po-search').value = '';
  render();
}
function hasFilters() {
  return Boolean(search) || Object.keys(filters).some(k => filters[k]);
}
function togglePending() {
  filters.status = filters.status === 'pending' ? '' : 'pending';
  document.getElementById('f-status').value = filters.status;
  page = 0;
  render();
}

function visiblePOs() {
  const q = search.trim().toLowerCase();
  return purchaseOrders.filter(po => {
    if (filters.division && po._division !== filters.division) return false;
    if (filters.status   && (po.status || 'pending') !== filters.status) return false;
    if (filters.vendor   && (po.supplier || '') !== filters.vendor) return false;
    if (filters.job === 'job'     && !po.project_id) return false;
    if (filters.job === 'general' && po.project_id)  return false;
    if (!q) return true;
    const proj = projectFor(po._division, po.project_id);
    const lineHay = (po.lines || []).map(l => [l.invoice_num, l.employee, l.date].join(' ')).join(' ');
    const hay = [
      po.po_number, divLabel(po._division), proj ? proj.name : '', proj ? proj.jobNumber : '',
      po.cost_code, po.sub_code, po.title, po.supplier, po.status, po.date_created, po.notes, lineHay,
    ].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function divisionSelectHTML(po) {
  // A division this user cannot write to is offered only when the order is
  // already in it — moving an order somewhere it could never be saved just
  // produces a failure the user cannot undo.
  const offer = d => capsFor(d).canEdit || po._division === d;
  const opts = [];
  if (offer(GENERAL)) {
    opts.push('<option value="' + GENERAL + '"' + (po._division === GENERAL ? ' selected' : '') + '>General — no division</option>');
  }
  sourceDivs.forEach(d => {
    if (!offer(d.division)) return;
    opts.push('<option value="' + esc(d.division) + '"' + (po._division === d.division ? ' selected' : '') + '>' + esc(d.label) + '</option>');
  });
  return '<select ' + (capsFor(po._division).canEdit ? '' : 'disabled ') +
    'onchange="setDivision(\'' + jsAttr(po.id) + '\', this.value)" aria-label="Division">' + opts.join('') + '</select>';
}

function projectSelectHTML(po) {
  if (po._division === GENERAL) {
    return '<span style="color:var(--muted);font-size:0.76rem">Pick a division first</span>';
  }
  const list = projectsFor(po._division);
  const opts = ['<option value=""' + (!po.project_id ? ' selected' : '') + '>General — no job</option>']
    .concat(list.map(p => {
      const label = p.name + (p.jobNumber ? '  (#' + p.jobNumber + ')' : '');
      return '<option value="' + esc(p.id) + '"' + (po.project_id === p.id ? ' selected' : '') + '>' + esc(label) + '</option>';
    }));
  // A job that has since been removed from the division still labels its order,
  // rather than the select silently snapping to another job.
  if (po.project_id && !projectFor(po._division, po.project_id)) {
    opts.push('<option value="' + esc(po.project_id) + '" selected>' + esc(po.project_id) + ' (missing)</option>');
  }
  return '<select ' + (capsFor(po._division).canEdit ? '' : 'disabled ') +
    'onchange="setProject(\'' + jsAttr(po.id) + '\', this.value)" aria-label="Job">' + opts.join('') + '</select>';
}

function subCodeSelectHTML(po) {
  if (!po.project_id) {
    return '<span style="color:var(--muted);font-size:0.76rem">' +
      (po._division === GENERAL ? '—' : 'No job — no code') + '</span>';
  }
  const codes = codesFor(po._division, po.project_id);
  const current = (po.cost_code || '') + '||' + (po.sub_code || '');
  if (!codes.length) {
    return '<span style="color:var(--muted);font-size:0.76rem">No bid items on this job</span>';
  }
  const opts = ['<option value=""' + (current === '||' ? ' selected' : '') + '>— select —</option>']
    .concat(codes.map(c =>
      '<option value="' + esc(codeValue(c)) + '"' + (codeValue(c) === current ? ' selected' : '') + '>' + esc(codeLabel(c)) + '</option>'));
  if (current !== '||' && !codes.some(c => codeValue(c) === current)) {
    opts.push('<option value="' + esc(current) + '" selected>' +
      esc([po.cost_code, po.sub_code].filter(Boolean).join(' / ')) + ' (not on this job)</option>');
  }
  return '<select ' + (capsFor(po._division).canEdit ? '' : 'disabled ') +
    'onchange="setSubCode(\'' + jsAttr(po.id) + '\', this.value)" aria-label="Cost and sub code">' + opts.join('') + '</select>';
}

function statusSelectHTML(po) {
  const cur = po.status || 'pending';
  const opts = [['pending','Pending'],['approved','Approved'],['closed','Closed']]
    .map(o => '<option value="' + o[0] + '"' + (cur === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('');
  return '<select ' + (capsFor(po._division).canEdit ? '' : 'disabled ') +
    'onchange="setField(\'' + jsAttr(po.id) + '\', \'status\', this.value)" aria-label="Status">' + opts + '</select>';
}

function docBtnHTML(po) {
  const n = docCounts[po.id] || 0;
  return '<button class="icon-btn' + (n ? ' has' : '') + '" onclick="openDocs(\'' + jsAttr(po.id) + '\')" ' +
    'title="' + (n ? n + ' attached' : 'Attach a receipt') + '">&#128206;' + (n || '') + '</button>';
}

function divChipHTML(key) {
  return '<span class="div-chip" style="background:' + divColor(key) + '22;color:' + divColor(key) + '">' +
    esc(divLabel(key)) + '</span>';
}

/**
 * Delivery rows for one order.
 *
 * `surface` prefixes the cell ids. Both the desktop table and the phone card
 * editor render these into the live document — the media query only sets
 * display:none, so both trees always exist — and without the prefix each id
 * existed twice. getElementById returns the first match, which is the hidden
 * desktop table, so on a phone the Amount, Tax and Total a user was typing
 * into never moved off "—" while the order's headline total did.
 */
function lineRowsHTML(po, surface) {
  // Markup-encoded; getElementById is still given the raw value it matches on.
  const cell = (kind, id) => esc((surface || 'tbl') + '-' + kind + '-' + id);
  return (po.lines || []).map(l => {
    const amt = lineAmt(l), tax = lineTax(l);
    const inp = (field, type, val, extra) =>
      '<input type="' + type + '" class="boxed" value="' + esc(val == null ? '' : val) + '" ' +
      (capsFor(po._division).canEdit ? '' : 'disabled ') + (extra || '') +
      ' oninput="setLineField(\'' + jsAttr(po.id) + '\',\'' + jsAttr(l.id) + '\',\'' + field + '\', this.value)">';
    return '<tr>' +
      '<td style="min-width:120px">' + inp('invoice_num','text', l.invoice_num, 'placeholder="Invoice / Ticket #"') + '</td>' +
      '<td style="min-width:118px">' + inp('date','date', l.date) + '</td>' +
      '<td style="min-width:74px">'  + inp('qty','number', l.qty, 'step="any" placeholder="0"') + '</td>' +
      '<td style="min-width:92px">'  + inp('unit_cost','number', l.unit_cost, 'step="any" placeholder="0.00"') + '</td>' +
      '<td class="r" style="color:var(--ok)" id="' + cell('amt', l.id) + '">' + (amt !== 0 ? '$' + fmt(amt) : '—') + '</td>' +
      '<td style="min-width:92px">' +
        '<div style="display:flex;align-items:center;gap:0.15rem">' +
          inp('tax_pct','number', l.tax_pct, 'step="any" placeholder="0"') +
          '<span style="color:var(--muted);font-size:0.72rem">%</span></div>' +
        '<div class="r" style="font-size:0.62rem;color:var(--muted);padding-right:0.6rem" id="' + cell('tax', l.id) + '">' +
          (tax !== 0 ? '$' + fmt(tax) : '') + '</div>' +
      '</td>' +
      '<td class="r" style="color:var(--yellow);font-weight:600" id="' + cell('tot', l.id) + '">' +
        ((amt + tax) !== 0 ? '$' + fmt(amt + tax) : '—') + '</td>' +
      '<td style="min-width:120px">' + inp('employee','text', l.employee, 'placeholder="Received by" list="employee-list"') + '</td>' +
      '<td style="width:30px;text-align:center">' +
        (capsFor(po._division).canEdit ? '<button class="del-btn" onclick="deleteLine(\'' + jsAttr(po.id) + '\',\'' + jsAttr(l.id) + '\')" title="Remove delivery">&#10005;</button>' : '') +
      '</td></tr>';
  }).join('');
}

function linesPanelHTML(po, colspan) {
  const tot = poTotals(po);
  const count = (po.lines || []).length;
  const totalRow = count > 1
    ? '<tr style="border-top:1px solid var(--border);background:rgba(255,255,255,0.03)">' +
        '<td colspan="2" style="font-size:0.72rem;color:var(--muted);font-weight:600;white-space:nowrap">RUNNING TOTAL — ' + count + ' deliveries</td>' +
        '<td class="r" style="font-weight:700" id="run-qty-' + idAttr(po.id) + '">' + qfmt(tot.qty) + '</td><td></td>' +
        '<td class="r" style="color:var(--ok);font-weight:700" id="run-amt-' + idAttr(po.id) + '">$' + fmt(tot.amt) + '</td>' +
        '<td class="r" style="color:var(--muted);font-weight:700" id="run-tax-' + idAttr(po.id) + '">$' + fmt(tot.tax) + '</td>' +
        '<td class="r" style="color:var(--yellow);font-weight:700" id="run-tot-' + idAttr(po.id) + '">$' + fmt(tot.total) + '</td>' +
        '<td colspan="2"></td></tr>'
    : '';
  return '<td colspan="' + colspan + '" style="padding:0;border-bottom:2px solid var(--border)">' +
    '<div class="lines-wrap">' +
      '<div class="section-label">Deliveries / Invoices</div>' +
      '<div style="overflow-x:auto"><table>' +
        '<thead><tr><th>Invoice / Ticket #</th><th>Delivery Date</th><th>Qty</th><th>Unit Cost</th>' +
        '<th style="text-align:right">Amount</th><th>Tax %</th><th style="text-align:right">Total</th>' +
        '<th>Received By</th><th></th></tr></thead>' +
        '<tbody>' + lineRowsHTML(po, 'tbl') + '</tbody>' + totalRow +
      '</table></div>' +
      '<div style="display:flex;gap:0.5rem;margin-top:0.6rem;flex-wrap:wrap">' +
        (capsFor(po._division).canEdit ? '<button class="btn" onclick="addLine(\'' + jsAttr(po.id) + '\')" style="font-size:0.72rem;padding:0.25rem 0.75rem;background:rgba(129,140,248,0.12);border-color:rgba(129,140,248,0.35);color:var(--green)">+ Add Delivery</button>' : '') +
        (capsFor(po._division).canEdit ? '<button class="btn" onclick="scanIntoPO(\'' + jsAttr(po.id) + '\')" style="font-size:0.72rem;padding:0.25rem 0.75rem">&#128247; Scan a receipt into this order</button>' : '') +
      '</div>' +
      '<div style="margin-top:0.7rem">' +
        '<div class="section-label">Notes</div>' +
        '<input type="text" class="boxed" style="width:100%;padding:0.35rem 0.5rem" placeholder="Anything worth recording about this order" ' +
          (capsFor(po._division).canEdit ? '' : 'disabled ') + 'value="' + esc(po.notes || '') + '" ' +
          'oninput="setField(\'' + jsAttr(po.id) + '\',\'notes\', this.value)">' +
      '</div>' +
    '</div></td>';
}

const COLS = 14;

function renderTable(rows) {
  const body = document.getElementById('po-body');
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="' + COLS + '" class="empty">' +
      (purchaseOrders.length === 0
        ? 'No purchase orders yet. Click <strong>+ New PO</strong>, or scan a receipt.'
        : 'No orders match the current filters.') + '</td></tr>';
    return;
  }
  body.innerHTML = rows.map(po => {
    const tot  = poTotals(po);
    const open = expanded.has(po.id);
    const n    = (po.lines || []).length;
    const badge = n
      ? '<span style="background:rgba(96,165,250,0.18);color:#93c5fd;border-radius:10px;padding:0.1rem 0.45rem;font-size:0.66rem;font-weight:700;margin-left:0.35rem">' + n + '</span>'
      : '';
    const meta = po.status_changed_at
      ? '<div style="font-size:0.6rem;color:var(--muted);margin-top:0.2rem;white-space:nowrap">' +
        (po.status_changed_by ? esc(po.status_changed_by) + ' &middot; ' : '') +
        esc(new Date(po.status_changed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })) + '</div>'
      : '';

    const head = '<tr class="po-head">' +
      '<td style="text-align:center;cursor:pointer" onclick="toggleLines(\'' + jsAttr(po.id) + '\')">' +
        '<span style="display:inline-block;transition:transform 0.15s;transform:rotate(' + (open ? 90 : 0) + 'deg)">&#9654;</span></td>' +
      '<td style="white-space:nowrap"><span style="font-family:monospace;font-size:0.78rem;color:var(--muted)">' + esc(po.po_number) + '</span>' + badge + '</td>' +
      '<td><input type="date" class="boxed" value="' + esc(po.date_created || '') + '" ' + (capsFor(po._division).canEdit ? '' : 'disabled ') +
        'onchange="setField(\'' + jsAttr(po.id) + '\',\'date_created\', this.value)"></td>' +
      '<td>' + divisionSelectHTML(po) + '</td>' +
      '<td>' + projectSelectHTML(po) + '</td>' +
      '<td>' + subCodeSelectHTML(po) + '</td>' +
      '<td><input type="text" class="boxed" placeholder="Material / description" value="' + esc(po.title || '') + '" ' +
        (capsFor(po._division).canEdit ? '' : 'disabled ') + 'oninput="setField(\'' + jsAttr(po.id) + '\',\'title\', this.value)"></td>' +
      '<td><input type="text" class="boxed" list="vendor-list" placeholder="Vendor" value="' + esc(po.supplier || '') + '" ' +
        (capsFor(po._division).canEdit ? '' : 'disabled ') + 'oninput="setField(\'' + jsAttr(po.id) + '\',\'supplier\', this.value)"></td>' +
      '<td class="r" style="color:var(--muted)" id="po-qty-' + idAttr(po.id) + '">' + (tot.qty !== 0 ? qfmt(tot.qty) : '—') + '</td>' +
      '<td class="r" style="color:var(--ok);white-space:nowrap" id="po-amt-' + idAttr(po.id) + '">' + (tot.amt !== 0 ? '$' + fmt(tot.amt) : '—') + '</td>' +
      '<td class="r" style="color:var(--yellow);font-weight:600;white-space:nowrap" id="po-tot-' + idAttr(po.id) + '">' + (tot.total !== 0 ? '$' + fmt(tot.total) : '—') + '</td>' +
      '<td>' + statusSelectHTML(po) + meta + '</td>' +
      '<td style="text-align:center">' + docBtnHTML(po) + '</td>' +
      '<td style="text-align:center">' +
        (capsFor(po._division).canDelete ? '<button class="del-btn" onclick="deletePO(\'' + jsAttr(po.id) + '\')" title="Delete order">&#10005;</button>' : '') +
      '</td></tr>';

    const lines = open ? '<tr>' + linesPanelHTML(po, COLS) + '</tr>' : '';
    return head + lines;
  }).join('');
}

function renderCards(rows) {
  const wrap = document.getElementById('po-cards');
  if (!rows.length) {
    wrap.innerHTML = '<div class="empty">' +
      (purchaseOrders.length === 0
        ? 'No purchase orders yet. Tap <strong>Scan Receipt</strong> to start one from a photo.'
        : 'No orders match the current filters.') + '</div>';
    return;
  }
  wrap.innerHTML = rows.map(po => {
    const tot  = poTotals(po);
    const proj = projectFor(po._division, po.project_id);
    const jobLine = po.project_id
      ? (proj ? proj.name + (proj.jobNumber ? ' · #' + proj.jobNumber : '') : po.project_id)
      : 'General — no job';
    const codes = [po.cost_code, po.sub_code].filter(Boolean).join(' / ');
    const n = docCounts[po.id] || 0;
    const open = expanded.has(po.id);

    return '<div class="po-card">' +
      '<div class="row1">' +
        '<span class="num">' + esc(po.po_number) + '</span>' +
        '<span class="status-pill status-' + esc(po.status || 'pending') + '">' + esc(po.status || 'pending') + '</span>' +
      '</div>' +
      '<div class="title">' + esc(po.title || 'Untitled order') + '</div>' +
      '<div class="meta">' + esc(po.supplier || 'No vendor') + ' · ' + esc(po.date_created || '') + '</div>' +
      '<div class="meta">' + divChipHTML(po._division) + ' ' + esc(jobLine) + (codes ? ' · ' + esc(codes) : '') + '</div>' +
      '<div class="amt" id="card-tot-' + idAttr(po.id) + '" style="margin-top:0.4rem">$' + fmt(tot.total) + '</div>' +
      '<div class="card-actions">' +
        '<button class="btn" onclick="toggleLines(\'' + jsAttr(po.id) + '\')">' + (open ? 'Hide' : 'Edit') + ' details</button>' +
        '<button class="icon-btn' + (n ? ' has' : '') + '" onclick="openDocs(\'' + jsAttr(po.id) + '\')" style="padding:0.38rem 0.6rem">&#128206; ' + (n || 'Attach') + '</button>' +
        (capsFor(po._division).canDelete ? '<button class="btn" onclick="deletePO(\'' + jsAttr(po.id) + '\')" style="color:var(--red)">Delete</button>' : '') +
      '</div>' +
      (open ? '<div style="margin-top:0.75rem;border-top:1px solid var(--border);padding-top:0.6rem">' + cardEditorHTML(po) + '</div>' : '') +
    '</div>';
  }).join('');
}

/** The full editor for one order on a phone — the table's columns, stacked. */
function cardEditorHTML(po) {
  return '<div class="field"><label>Division</label>' + divisionSelectHTML(po) + '</div>' +
    '<div class="field"><label>Job</label>' + projectSelectHTML(po) + '</div>' +
    '<div class="field"><label>Cost / Sub Code</label>' + subCodeSelectHTML(po) + '</div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Date</label><input type="date" value="' + esc(po.date_created || '') + '" ' +
        (capsFor(po._division).canEdit ? '' : 'disabled ') + 'onchange="setField(\'' + jsAttr(po.id) + '\',\'date_created\', this.value)"></div>' +
      '<div class="field"><label>Status</label>' + statusSelectHTML(po) + '</div>' +
    '</div>' +
    '<div class="field"><label>Description</label><input type="text" value="' + esc(po.title || '') + '" ' +
      (capsFor(po._division).canEdit ? '' : 'disabled ') + 'oninput="setField(\'' + jsAttr(po.id) + '\',\'title\', this.value)"></div>' +
    '<div class="field"><label>Vendor</label><input type="text" list="vendor-list" value="' + esc(po.supplier || '') + '" ' +
      (capsFor(po._division).canEdit ? '' : 'disabled ') + 'oninput="setField(\'' + jsAttr(po.id) + '\',\'supplier\', this.value)"></div>' +
    '<div class="section-label">Deliveries</div>' +
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:0.8rem;min-width:700px">' +
      '<thead><tr><th style="text-align:left;font-size:0.62rem;color:var(--muted)">Invoice</th>' +
      '<th style="text-align:left;font-size:0.62rem;color:var(--muted)">Date</th>' +
      '<th style="text-align:left;font-size:0.62rem;color:var(--muted)">Qty</th>' +
      '<th style="text-align:left;font-size:0.62rem;color:var(--muted)">Unit</th>' +
      '<th style="text-align:right;font-size:0.62rem;color:var(--muted)">Amount</th>' +
      '<th style="text-align:left;font-size:0.62rem;color:var(--muted)">Tax %</th>' +
      '<th style="text-align:right;font-size:0.62rem;color:var(--muted)">Total</th>' +
      '<th style="text-align:left;font-size:0.62rem;color:var(--muted)">Received By</th><th></th></tr></thead>' +
      '<tbody>' + lineRowsHTML(po, 'card') + '</tbody></table></div>' +
    '<div style="display:flex;gap:0.5rem;margin-top:0.6rem;flex-wrap:wrap">' +
      (capsFor(po._division).canEdit ? '<button class="btn" onclick="addLine(\'' + jsAttr(po.id) + '\')">+ Delivery</button>' : '') +
      (capsFor(po._division).canEdit ? '<button class="btn" onclick="scanIntoPO(\'' + jsAttr(po.id) + '\')">&#128247; Scan receipt</button>' : '') +
    '</div>' +
    '<div class="field" style="margin-top:0.7rem"><label>Notes</label><input type="text" value="' + esc(po.notes || '') + '" ' +
      (capsFor(po._division).canEdit ? '' : 'disabled ') + 'oninput="setField(\'' + jsAttr(po.id) + '\',\'notes\', this.value)"></div>';
}

function render() {
  const all = visiblePOs().slice().reverse();
  const totalPages = Math.max(1, Math.ceil(all.length / PER_PAGE));
  if (page >= totalPages) page = totalPages - 1;
  if (page < 0) page = 0;
  const rows = all.slice(page * PER_PAGE, (page + 1) * PER_PAGE);

  renderTable(rows);
  renderCards(rows);

  const pending = purchaseOrders.filter(po => (po.status || 'pending') === 'pending').length;
  document.getElementById('pending-chip-slot').innerHTML = pending
    ? '<button class="chip' + (filters.status === 'pending' ? ' on' : '') + '" onclick="togglePending()">' +
      pending + ' pending approval</button>'
    : '';

  document.getElementById('clear-filters-btn').style.display = hasFilters() ? '' : 'none';
  document.getElementById('result-count').textContent =
    all.length + ' order' + (all.length === 1 ? '' : 's') +
    (all.length !== purchaseOrders.length ? ' of ' + purchaseOrders.length : '');

  const pager = document.getElementById('pager');
  if (totalPages > 1) {
    pager.style.display = '';
    pager.innerHTML =
      '<button class="btn" ' + (page === 0 ? 'disabled' : '') + ' onclick="page=Math.max(0,page-1);render()">&larr; Prev</button>' +
      '<span style="font-size:0.78rem;color:var(--muted)">Page ' + (page + 1) + ' of ' + totalPages + '</span>' +
      '<button class="btn" ' + (page === totalPages - 1 ? 'disabled' : '') + ' onclick="page=Math.min(' + (totalPages - 1) + ',page+1);render()">Next &rarr;</button>';
  } else {
    pager.style.display = 'none';
  }

  if (!perm.canEdit) {
    document.getElementById('new-po-btn').style.display = 'none';
    document.getElementById('scan-btn').style.display = 'none';
  }
}

/* ═══════════════════════════════════════════
   CSV EXPORT
═══════════════════════════════════════════ */
function exportCSV() {
  const rows = visiblePOs();
  const head = ['PO #','Division','Job','Job #','Cost Code','Sub Code','Description','Vendor','Date','Status',
                'Invoice #','Delivery Date','Qty','Unit Cost','Amount','Tax %','Tax','Line Total','Received By'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const out = [head.map(q).join(',')];
  rows.forEach(po => {
    const proj = projectFor(po._division, po.project_id);
    const base = [
      po.po_number || '', divLabel(po._division),
      proj ? proj.name : (po.project_id || 'General — no job'),
      proj ? proj.jobNumber : '',
      po.cost_code || '', po.sub_code || '', po.title || '', po.supplier || '',
      po.date_created || '', po.status || '',
    ];
    const lines = po.lines || [];
    if (!lines.length) {
      out.push(base.concat(['','','','','','','','','']).map(q).join(','));
      return;
    }
    lines.forEach((l, i) => {
      const amt = lineAmt(l), tax = lineTax(l), pct = lineTaxPct(l);
      // The header repeats only on the first delivery, so an order reads as one
      // block in a spreadsheet instead of the same job restated per line.
      const lead = i === 0 ? base : base.map(() => '');
      out.push(lead.concat([
        l.invoice_num || '', l.date || '',
        (parseFloat(l.qty) || '') , (parseFloat(l.unit_cost) || ''),
        amt.toFixed(2), pct === null ? '' : pct, tax.toFixed(2), (amt + tax).toFixed(2),
        l.employee || '',
      ]).map(q).join(','));
    });
  });
  const blob = new Blob([out.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'purchase_orders_' + localDateStr() + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ═══════════════════════════════════════════
   RECEIPT PHOTOS
═══════════════════════════════════════════ */

/**
 * Shrink a camera photo before it goes anywhere.
 *
 * A modern phone shoots 4–12 MB, over both the platform's request ceiling and
 * what the scan endpoint accepts. 1600px on the long edge is more than enough
 * to read a receipt and lands around 200–400 KB, which also makes the upload
 * survivable on jobsite LTE. Drawing through a canvas converts HEIC to JPEG on
 * the way, which is the other reason this is not optional.
 */
function downscaleImage(file, maxEdge) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        if (!blob) { reject(new Error('Could not read that photo')); return; }
        resolve({ blob, dataUrl: canvas.toDataURL('image/jpeg', 0.85), width: w, height: h });
      }, 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not an image this browser can read')); };
    img.src = url;
  });
}

/** Ask for one photo through a hidden input, and hand back the File. */
function pickImage(inputId) {
  return new Promise(resolve => {
    const input = document.getElementById(inputId);
    input.value = '';
    const onChange = () => {
      input.removeEventListener('change', onChange);
      resolve(input.files && input.files[0] ? input.files[0] : null);
    };
    input.addEventListener('change', onChange);
    input.click();
  });
}

/**
 * File a photo against an order, in the order's OWN division.
 *
 * That last part is the whole point: a receipt filed under purchasing would be
 * invisible from the paperclip on the same order in the paving tab. The upload
 * is the three-step dance every division page uses — ticket, bytes straight to
 * storage, then register — with the relay fallback for a bucket that has no
 * CORS rule, since a phone on LTE is exactly where that bites.
 */
async function attachToPO(po, blob, filename, note) {
  const division = po._division;
  const poQ = '&poId=' + encodeURIComponent(po.id);
  const projQ = po.project_id ? '&projectId=' + encodeURIComponent(po.project_id) : '';

  // 1. Make sure the folders exist, and find the one this belongs in. An
  //    order's own folder is created by the registration below, so the first
  //    receipt files into the job's Purchase Orders root (or Unassigned POs
  //    when the order has no job) and later ones join it there.
  let folderId = null;
  try {
    const tree = await api('PUT', '/documents?division=' + encodeURIComponent(division) + poQ + projQ, {});
    const folders = (tree && tree.folders) || [];
    const bySlug = slug => (folders.find(f => f.slug === slug) || {}).id || null;
    folderId = bySlug('po-' + po.id)
            || (po.project_id ? bySlug('purchase-orders') : bySlug('unassigned-pos'))
            || (folders[0] || {}).id || null;
  } catch (err) {
    throw new Error('Could not open the document folders: ' + err.message);
  }
  if (!folderId) throw new Error('No folder to file this receipt in');

  // 2. Ticket.
  const ticket = await api('POST', '/document-upload-url?division=' + encodeURIComponent(division) + poQ, {
    filename, sizeBytes: blob.size, projectId: po.project_id || undefined, poId: po.id,
  });

  // 3. Bytes.
  let put;
  try {
    put = await fetch(ticket.uploadUrl, { method: 'PUT', body: blob, headers: { 'Content-Type': ticket.contentType } });
  } catch (err) {
    // A cross-origin PUT needs a preflight and a bucket with no CORS rule
    // refuses it, which surfaces as a bare "Failed to fetch" with nothing in
    // any log. Relay through the API, which is same-origin.
    const b64 = await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload  = () => resolve(String(fr.result).split(',')[1] || '');
      fr.onerror = () => reject(new Error('Could not read the photo back'));
      fr.readAsDataURL(blob);
    });
    await api('PUT', '/document-upload-url?division=' + encodeURIComponent(division) + poQ,
              { storageKey: ticket.storageKey, contentBase64: b64, poId: po.id });
    put = { ok: true };
  }
  if (!put.ok) throw new Error('Upload to storage failed (' + put.status + ')');

  // 4. Register — and clean up the stored bytes if it does not land, or they
  //    sit in the bucket with nothing pointing at them.
  try {
    // poQ as well as projQ: the carve-out reads the order it was granted for
    // from the QUERY, so without it this leg 403s and the bytes already in the
    // bucket are thrown away — no receipt could be filed against a turf,
    // paving or kiewit order at all.
    await api('POST', '/documents?division=' + encodeURIComponent(division) + projQ + poQ, {
      documentId: ticket.documentId,
      filename,
      storageKey: ticket.storageKey,
      sizeBytes:  blob.size,
      folderId,
      poId:       po.id,
      poNumber:   po.po_number,
      note:       note || undefined,
    });
  } catch (err) {
    try {
      await api('DELETE', '/document-upload-url?division=' + encodeURIComponent(division) +
                '&storageKey=' + encodeURIComponent(ticket.storageKey) + poQ);
    } catch (cleanupErr) {
      console.warn('[po] could not remove the orphaned upload:', cleanupErr.message);
    }
    throw err;
  }

  docCounts[po.id] = (docCounts[po.id] || 0) + 1;
}

/* ═══════════════════════════════════════════
   SCAN SHEET
═══════════════════════════════════════════ */
let scanState = null;   // { dataUrl, blob, filename, receipt, targetPoId, token }

// Which scan is current. Every scan takes a number, and a reply whose number is
// no longer the live one is dropped — that is what stops an abandoned scan
// re-opening the sheet, and what stops two scans crossing receipt #1's figures
// with receipt #2's photo.
let _scanToken = 0;

function closeScan() {
  document.getElementById('scan-backdrop').classList.remove('open');
  _scanToken++;          // whatever is in flight is no longer wanted
  scanState = null;
}

function renderScanSheet(body) {
  const sheet = document.getElementById('scan-sheet');
  sheet.innerHTML = body;
  document.getElementById('scan-backdrop').classList.add('open');
}

/** Toolbar entry point: a photo becomes a brand-new order. */
async function openScanSheet() { await beginScan(null); }

/** Row entry point: a photo becomes another delivery on an existing order. */
async function scanIntoPO(poId) { await beginScan(poId); }

/** Guard against a double tap on Create/Add booking the same receipt twice. */
let _committing = false;

async function beginScan(targetPoId) {
  if (!perm.canEdit) return;
  const file = await pickImage('receipt-capture');
  if (!file) return;

  // This scan's number. Every step below checks it is still the live one before
  // touching the screen, so a scan the user dismissed — or one they replaced by
  // starting another — finishes quietly instead of taking the page over.
  const token = ++_scanToken;
  const live  = () => _scanToken === token;

  renderScanSheet(
    '<h2>Reading the receipt</h2>' +
    '<div class="sub">This takes a few seconds.</div>' +
    '<div class="scan-status"><span class="spinner"></span>Looking at the photo…</div>');

  let shot;
  try {
    shot = await downscaleImage(file, 1600);
  } catch (err) {
    if (!live()) return;
    renderScanSheet(
      '<h2>Could not read that photo</h2>' +
      '<div class="scan-status err">' + esc(err.message) + '</div>' +
      '<div class="sheet-actions"><button class="btn" onclick="closeScan()">Close</button></div>');
    return;
  }
  if (!live()) return;

  scanState = {
    dataUrl: shot.dataUrl,
    blob: shot.blob,
    filename: 'receipt-' + localDateStr() + '-' + Date.now().toString(36) + '.jpg',
    receipt: null,
    targetPoId: targetPoId || null,
    token,
  };

  let receipt = null, scanError = null;
  try {
    const res = await api('POST', '/ai/receipt-scan', {
      imageBase64: shot.dataUrl.split(',')[1],
      mediaType: 'image/jpeg',
      vendors: (catalog.vendors || []).map(v => v.name),
    });
    receipt = res && res.receipt ? res.receipt : null;
  } catch (err) {
    scanError = err.message;
  }

  // Dismissed, or replaced by a later scan, while the model was reading. Say
  // nothing and touch nothing.
  if (!live()) return;

  // A scan that failed is not a dead end: the photo is still worth attaching
  // and the fields are still worth typing, so the form opens either way.
  scanState.receipt = receipt;
  renderScanForm(receipt, scanError);
}

function renderScanForm(receipt, scanError) {
  const r = receipt || {};
  const target = scanState.targetPoId ? purchaseOrders.find(p => p.id === scanState.targetPoId) : null;

  let status;
  if (scanError) {
    status = '<div class="scan-status err">Could not read the receipt automatically (' + esc(scanError) +
             '). Fill it in below — the photo still gets attached.</div>';
  } else if (r.confidence === 'low') {
    status = '<div class="scan-status warn">Read with low confidence — check every figure before saving.' +
             (r.notes ? ' ' + esc(r.notes) : '') + '</div>';
  } else {
    status = '<div class="scan-status">Read from the photo. Check the figures, then save.' +
             (r.notes ? ' <span style="color:var(--muted)">' + esc(r.notes) + '</span>' : '') + '</div>';
  }

  const mark = v => v == null || v === '' ? '' : '<span class="scanned-mark">scanned</span>';
  const val  = v => v == null ? '' : String(v);

  // An order tied to a job is the common case but not the only one, so the
  // division picker leads and "General" is a real answer, not a placeholder.
  const divOpts = ['<option value="' + GENERAL + '">General — no division</option>']
    .concat(sourceDivs.map(d => '<option value="' + esc(d.division) + '">' + esc(d.label) + '</option>')).join('');

  renderScanSheet(
    '<h2>' + (target ? 'Add to ' + esc(target.po_number) : 'New purchase order') + '</h2>' +
    '<div class="sub">' + (target ? 'From a photographed receipt.' : 'Everything here can be changed afterwards.') + '</div>' +
    '<img class="receipt-preview" src="' + scanState.dataUrl + '" alt="The receipt being read" />' +
    status +
    (target ? '' :
      '<div class="field"><label>Division' + '</label>' +
        '<select id="sc-division" onchange="onScanDivision(this.value)">' + divOpts + '</select></div>' +
      '<div class="field"><label>Job</label><select id="sc-project" onchange="onScanProject(this.value)">' +
        '<option value="">General — no job</option></select></div>' +
      '<div class="field"><label>Cost / Sub Code</label><select id="sc-code">' +
        '<option value="">— pick a job first —</option></select></div>') +
    '<div class="field"><label>Vendor' + mark(r.vendor) + '</label>' +
      '<input type="text" id="sc-vendor" list="vendor-list" value="' + esc(val(r.vendor)) + '" placeholder="Who it was bought from"></div>' +
    '<div class="field"><label>Description' + mark(r.description) + '</label>' +
      '<input type="text" id="sc-title" value="' + esc(val(r.description)) + '" placeholder="What was bought"></div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Date' + mark(r.date) + '</label>' +
        '<input type="date" id="sc-date" value="' + esc(r.date || localDateStr()) + '"></div>' +
      '<div class="field"><label>Invoice #' + mark(r.invoice_number) + '</label>' +
        '<input type="text" id="sc-invoice" value="' + esc(val(r.invoice_number)) + '"></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Qty' + mark(r.qty) + '</label>' +
        '<input type="number" step="any" id="sc-qty" value="' + esc(val(r.qty)) + '" placeholder="1"></div>' +
      '<div class="field"><label>Unit Cost' + mark(r.unit_cost) + '</label>' +
        '<input type="number" step="any" id="sc-unit" value="' + esc(val(r.unit_cost)) + '"></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Tax %' + mark(r.tax_pct) + '</label>' +
        '<input type="number" step="any" id="sc-taxpct" value="' + esc(val(r.tax_pct)) + '"></div>' +
      '<div class="field"><label>Total' + mark(r.total) + '</label>' +
        '<input type="number" step="any" id="sc-total" value="' + esc(val(r.total)) + '"></div>' +
    '</div>' +
    '<div class="sub" id="sc-hint" style="margin-bottom:0">' +
      'Qty and Unit Cost go together — with either missing, the order is booked ' +
      'as one line at the Total shown.</div>' +
    '<div class="sheet-actions">' +
      '<button class="btn" onclick="closeScan()">Cancel</button>' +
      '<button class="btn btn-green" id="sc-save" onclick="commitScan()">' +
        (target ? 'Add delivery' : 'Create order') + '</button>' +
    '</div>');

  if (!target) onScanDivision(GENERAL);
}

function onScanDivision(divKey) {
  const projSel = document.getElementById('sc-project');
  const codeSel = document.getElementById('sc-code');
  if (!projSel) return;
  const list = divKey === GENERAL ? [] : projectsFor(divKey);
  projSel.innerHTML = '<option value="">General — no job</option>' + list.map(p =>
    '<option value="' + esc(p.id) + '">' + esc(p.name + (p.jobNumber ? '  (#' + p.jobNumber + ')' : '')) + '</option>').join('');
  projSel.disabled = divKey === GENERAL;
  codeSel.innerHTML = '<option value="">' + (divKey === GENERAL ? '—' : '— pick a job first —') + '</option>';
  codeSel.disabled = true;
}

function onScanProject(projId) {
  const divKey = document.getElementById('sc-division').value;
  const codeSel = document.getElementById('sc-code');
  const codes = projId ? codesFor(divKey, projId) : [];
  codeSel.innerHTML = '<option value="">' + (projId ? '— select —' : 'No job — no code') + '</option>' +
    codes.map(c => '<option value="' + esc(codeValue(c)) + '">' + esc(codeLabel(c)) + '</option>').join('');
  codeSel.disabled = !projId || !codes.length;
}

/**
 * Turn the reviewed scan into a saved order, then attach the photo to it.
 *
 * The order is saved first and the photo second, deliberately: the attachment
 * needs an order id that already exists in the division's list, because that is
 * what the document endpoint checks before letting purchasing write there.
 */
async function commitScan() {
  // A second tap before the first finishes would raise a second order from the
  // same receipt. The button is disabled below, but a phone can register both
  // taps before the handler runs.
  if (_committing || !scanState) return;
  _committing = true;
  const btn = document.getElementById('sc-save');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…'; }

  const qty   = document.getElementById('sc-qty').value;
  const unit  = document.getElementById('sc-unit').value;
  const total = parseFloat(document.getElementById('sc-total').value);
  const taxPct = document.getElementById('sc-taxpct').value;

  // A line is only worth money when it has BOTH a quantity and a unit cost:
  // amount is one times the other, so either alone books the delivery at zero
  // while the job is charged for a real load. A thermal ticket printing
  // "8.5 TON" with the price column illegible produces exactly that, and so
  // does anyone tabbing past one of the two fields.
  //
  // So the fallback fires whenever the pair is incomplete and a total is
  // known: the order goes in as a single unit priced at the total, which is
  // the shape the division tabs produce for a one-off purchase and keeps the
  // job cost right.
  // On the AMOUNT, not on whether the boxes are blank: "0" is a non-empty
  // string, so a ticket read as 8.5 TON at a unit cost of 0 looked like a
  // complete pair, discarded the Total, and booked the delivery at nothing.
  let lineQty = qty, lineUnit = unit;
  const pairAmount = (parseFloat(lineQty) || 0) * (parseFloat(lineUnit) || 0);
  const pairIncomplete = pairAmount === 0;
  if (pairIncomplete && !isNaN(total) && total !== 0) {
    const pct = parseFloat(taxPct);
    lineQty = '1';
    lineUnit = String(!isNaN(pct) && pct > 0 ? total / (1 + pct / 100) : total);
  } else if (pairIncomplete) {
    // No total either — there is no amount to book. Better to say so than to
    // write a $0 delivery that reads as a real material entry on the job.
    _committing = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Create order'; }
    toast('Enter a Total, or both Qty and Unit Cost — otherwise the order books at $0.', 'err');
    return;
  }

  const line = Object.assign(newLine(), {
    invoice_num: document.getElementById('sc-invoice').value || '',
    date:        document.getElementById('sc-date').value || localDateStr(),
    qty:         lineQty || '',
    unit_cost:   lineUnit || '',
    tax_pct:     taxPct || '',
  });
  recalcLineTax(line);

  // The photo, read before anything can clear it: dismissing the sheet during
  // the attach nulls scanState, and reading it afterwards threw a raw
  // TypeError at the user instead of a sentence.
  const shotBlob = scanState.blob;
  const shotName = scanState.filename;

  let po;
  let undo = null;   // how to put the page back if the save does not land
  try {
    if (scanState.targetPoId) {
      po = purchaseOrders.find(p => p.id === scanState.targetPoId);
      if (!po) throw new Error('That order is no longer on this page');
      const before = (po.lines || []).slice();
      const hadSupplier = po.supplier, hadTitle = po.title;
      po.lines = (po.lines || []).concat([line]);
      if (!po.supplier) po.supplier = document.getElementById('sc-vendor').value || '';
      if (!po.title)    po.title    = document.getElementById('sc-title').value || '';
      undo = () => { po.lines = before; po.supplier = hadSupplier; po.title = hadTitle; };
      expanded.add(po.id);
      await _savePONow(po);
    } else {
      const divKey  = document.getElementById('sc-division').value || GENERAL;
      const projId  = document.getElementById('sc-project').value || '';
      const codeVal = (document.getElementById('sc-code').value || '').split('||');
      po = {
        id:           uid(),
        po_number:    nextPONumber(divKey),
        title:        document.getElementById('sc-title').value || '',
        supplier:     document.getElementById('sc-vendor').value || '',
        status:       'pending',
        date_created: document.getElementById('sc-date').value || localDateStr(),
        project_id:   projId,
        cost_code:    codeVal[0] || '',
        sub_code:     codeVal[1] || '',
        notes:        '',
        origin:       'purchasing',
        lines:        [line],
        _division:    divKey,
      };
      purchaseOrders.push(po);
      undo = () => { purchaseOrders = purchaseOrders.filter(p => p.id !== po.id); };
      expanded.add(po.id);
      await _savePONow(po);
    }
  } catch (err) {
    // _savePONow rethrows now, so this catches a save that never landed. It
    // used to swallow everything and fall through to "Saved … with the receipt
    // attached" for an order that was never written — and scanState is nulled
    // on close, so the photo was gone and there was no way to retry. The sheet
    // stays open with the figures intact.
    // Put the page back. Saying "nothing was saved" while leaving the order in
    // purchaseOrders AND in _unsaved was false twice over: the poll's retry
    // would write it anyway, and tapping "Try again" would append a SECOND
    // delivery for the same receipt on top of it.
    if (undo) undo();
    if (po) { _unsaved.delete(po.id); clearTimeout(_saveTimers[po.id]); delete _saveTimers[po.id]; }
    _committing = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Try again'; }
    toast('Could not save the order: ' + err.message + ' — nothing was saved. Try again.', 'err');
    render();
    return;
  }

  if (btn) btn.innerHTML = '<span class="spinner"></span>Attaching photo…';
  let attachError = null;
  try {
    await attachToPO(po, shotBlob, shotName, 'Scanned receipt');
  } catch (err) {
    attachError = err.message;
  }

  _committing = false;
  closeScan();
  page = 0;
  render();
  if (attachError) {
    // The order is saved either way — say which half did not land rather than
    // implying the whole thing failed.
    toast('Order saved, but the photo did not attach: ' + attachError, 'err');
  } else {
    toast('Saved ' + po.po_number + ' with the receipt attached.');
  }
}

/* ═══════════════════════════════════════════
   ATTACHMENTS SHEET
═══════════════════════════════════════════ */
function closeDocs() { document.getElementById('docs-backdrop').classList.remove('open'); }

async function openDocs(poId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po) return;
  const sheet = document.getElementById('docs-sheet');
  sheet.innerHTML = '<h2>' + esc(po.po_number) + ' — attachments</h2>' +
    '<div class="scan-status"><span class="spinner"></span>Loading…</div>';
  document.getElementById('docs-backdrop').classList.add('open');

  let docs = [];
  let loadError = null;
  try {
    const res = await api('GET', '/documents?division=' + encodeURIComponent(po._division) +
                          '&poId=' + encodeURIComponent(po.id));
    docs = (res && res.documents) || [];
    docCounts[po.id] = docs.length;
  } catch (err) {
    loadError = err.message;
  }

  const list = docs.length
    ? docs.map(d =>
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0.45rem 0;border-bottom:1px solid var(--border)">' +
          '<div style="min-width:0"><div style="font-size:0.84rem;word-break:break-all">' + esc(d.filename) + '</div>' +
          '<div style="font-size:0.7rem;color:var(--muted)">' + esc(d.uploaded_by || '') +
            (d.uploaded_at ? ' · ' + esc(new Date(d.uploaded_at).toLocaleDateString('en-US')) : '') + '</div></div>' +
          '<button class="btn" onclick="openDoc(\'' + jsAttr(po._division) + '\',\'' + jsAttr(d.id) + '\',\'' + jsAttr(po.id) + '\')">Open</button>' +
        '</div>').join('')
    : '<div style="color:var(--muted);font-size:0.82rem;padding:0.5rem 0">Nothing attached yet.</div>';

  sheet.innerHTML =
    '<h2>' + esc(po.po_number) + ' — attachments</h2>' +
    '<div class="sub">Filed under ' + esc(divLabel(po._division)) +
      (po.project_id ? ', on ' + esc((projectFor(po._division, po.project_id) || {}).name || po.project_id) : ', with no job') +
      ' — so it is on the paperclip in that division’s own tab too.</div>' +
    (loadError ? '<div class="scan-status err">' + esc(loadError) + '</div>' : list) +
    '<div class="sheet-actions">' +
      '<button class="btn" onclick="closeDocs()">Close</button>' +
      (capsFor(po._division).canEdit ? '<button class="btn btn-green" id="doc-add" onclick="addAttachment(\'' + jsAttr(po.id) + '\')">+ Add photo or file</button>' : '') +
    '</div>';
}

async function openDoc(division, docId, poId) {
  try {
    // poId is what lets a purchasing user open a receipt filed in a division it
    // holds no role in — the endpoint checks the document is linked to it.
    const res = await api('GET', '/document-download?division=' + encodeURIComponent(division) +
                          '&id=' + encodeURIComponent(docId) +
                          '&poId=' + encodeURIComponent(poId));
    if (res && res.url) window.open(res.url, '_blank', 'noopener');
    else toast('That file has no download link.', 'err');
  } catch (err) {
    toast('Could not open it: ' + err.message, 'err');
  }
}

async function addAttachment(poId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po) return;
  const file = await pickImage('attach-capture');
  if (!file) return;

  const btn = document.getElementById('doc-add');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Uploading…'; }
  try {
    // Images go through the downscale; a PDF is passed along untouched, since
    // rasterizing one would destroy it.
    let blob = file, filename = file.name;
    if (/^image\//.test(file.type)) {
      const shot = await downscaleImage(file, 1600);
      blob = shot.blob;
      filename = (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg';
    }
    await attachToPO(po, blob, filename);
    toast('Attached.');
    await openDocs(poId);
    render();
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = '+ Add photo or file'; }
    toast('Could not attach: ' + err.message, 'err');
  }
}

/* Close a sheet by clicking its backdrop, the way the other pages' modals do.
   The scan sheet goes through closeScan() rather than just hiding itself: a
   dismissal while the spinner is up has to CANCEL the scan, or the reply lands
   a few seconds later, re-opens the sheet over whatever the user moved on to,
   and — if they started a second scan meanwhile — renders the first receipt's
   figures against the second receipt's photo and order. */
document.getElementById('scan-backdrop').addEventListener('click', function (e) {
  if (e.target === this) closeScan();
});
document.getElementById('docs-backdrop').addEventListener('click', function (e) {
  if (e.target === this) closeDocs();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('scan-backdrop').classList.contains('open')) closeScan();
  if (document.getElementById('docs-backdrop').classList.contains('open')) closeDocs();
});

/* ═══════════════════════════════════════════
   POLL — pick up what the division tabs change

   An order raised here is stored in its division's OWN list, which is the same
   list that division's tab reads and writes. So the traffic goes both ways: a
   paving supervisor adding a delivery to an order, approving one, or raising
   one of their own is editing a list this page is showing.

   Their pages poll purchase orders every 60 seconds, so what happens here
   reaches them on its own. This is the other direction, on the same interval —
   without it a purchasing screen left open all morning shows the list as it
   was at login.

   Nothing here risks a lost edit. Saves go one order at a time and the server
   re-reads the stored list before merging, so a stale copy of an order nobody
   touched can never be written back over a division's work; and an order whose
   save is still queued OR has failed keeps its local copy through the merge
   below rather than being replaced by the server's older one. The poll is about
   what is on screen.
═══════════════════════════════════════════ */
(function () {
  const POLL_MS = 60_000;

  // Whatever the user is in the middle of. A <select> counts: the division and
  // job pickers are how an order gets re-tied, and swapping the list out from
  // under an open dropdown would drop the choice being made.
  function isEditing() {
    const el = document.activeElement;
    return Boolean(el) && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
  }

  /**
   * Orders whose local copy is newer than the server's: one with a debounce
   * timer still to fire, and one whose save failed. Both have to survive the
   * merge below or the poll quietly throws the user's typing away.
   */
  function pendingIds() {
    return new Set(Object.keys(_saveTimers).concat([..._unsaved]));
  }

  async function poll() {
    if (document.visibilityState === 'hidden') return;

    // Retry anything that failed to save, BEFORE the guards below. It touches
    // no DOM, and a cursor resting in the field someone just typed into — the
    // normal state right after an edit — would otherwise hold the only retry
    // path this page has for as long as it stayed there.
    for (const id of [..._unsaved]) {
      const po = purchaseOrders.find(p => p.id === id);
      if (!po) { _unsaved.delete(id); continue; }
      try { await _savePONow(po); } catch { /* stays in _unsaved for the next tick */ }
    }

    if (_inflight > 0) return;          // a save is in the air; its result lands first
    if (isEditing()) return;

    let fetched;
    try {
      fetched = await Promise.all(listKeys().map(async key => {
        const data = await api('GET', '/purchase-orders?division=' + encodeURIComponent(key));
        const list = Array.isArray(data.purchaseOrders) ? data.purchaseOrders : [];
        list.forEach(po => {
          po._division = key;
          // Same reason as on load — an order raised in a division tab since
          // this page opened must be movable, not copyable.
          //
          // Except for an order this page is still saving: a half-landed move
          // leaves it in BOTH lists, and re-seeding from whichever fetch
          // happened to finish last could set this to the division it was
          // moving TO. The next save would then send no `from`, the old copy
          // would never be cleared, and the duplicate would be permanent.
          if (!_unsaved.has(po.id) && !_saveTimers[po.id]) _savedDivision[po.id] = key;
          migratePO(po);
        });
        return list;
      }));
    } catch (err) {
      // A poll that fails changes nothing. The page keeps what it has.
      console.warn('[po] poll failed:', err.message);
      return;
    }

    const incoming = [].concat.apply([], fetched);

    // An order with a debounced save outstanding keeps its LOCAL copy — the
    // user typed it a moment ago and the server has not been told yet.
    const pending = pendingIds();
    const merged = incoming.map(po => {
      if (!pending.has(po.id)) return po;
      return purchaseOrders.find(p => p.id === po.id) || po;
    });
    // ...and one raised here but not yet stored is not dropped for being absent.
    purchaseOrders.forEach(po => {
      if (pending.has(po.id) && !merged.some(p => p.id === po.id)) merged.push(po);
    });

    // migratePO runs on both sides before this, so an unconverted blob does not
    // read as a change on every poll and re-render the table in a loop.
    if (JSON.stringify(merged) === JSON.stringify(purchaseOrders)) return;

    // Checked again: the fetch above took time, and a keystroke may have
    // landed while it was in flight.
    if (isEditing() || _inflight > 0) return;

    purchaseOrders = merged;
    render();
  }

  setInterval(poll, POLL_MS);
  // Coming back to a tab that has been in the background is exactly when the
  // list is most out of date, and waiting out the rest of the interval to find
  // out is the wrong behaviour.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') poll();
  });
})();

/* ═══════════════════════════════════════════
   BOOT
═══════════════════════════════════════════ */
(async function boot() {
  try {
    await loadCatalog();
  } catch (err) {
    document.getElementById('load-banner').style.display = '';
    document.getElementById('load-banner').textContent =
      'Could not load the jobs and vendors list: ' + err.message + ' — orders already raised are still shown below.';
  }
  try {
    await loadPurchaseOrders();
  } catch (err) {
    toast('Could not load purchase orders: ' + err.message, 'err');
  }
  render();

  // The employee datalist is built after the first paint: the delivery rows
  // reference it by id, and nothing needs it before one is opened.
  const emps = (catalog.employees || []).map(e => '<option value="' + esc(e.name) + '"></option>').join('');
  const dl = document.createElement('datalist');
  dl.id = 'employee-list';
  dl.innerHTML = emps;
  document.body.appendChild(dl);

  // Counts feed the paperclip badges, and are slow enough (one request per
  // division) that the table should not wait on them.
  // Counts feed the paperclip badges and arrive a second or two after the
  // table. Re-rendering then would destroy whatever input the user had already
  // started typing into, so it waits for them to finish — the same guard the
  // poll uses. A badge is never worth a lost keystroke.
  loadDocCounts().then(() => {
    const el = document.activeElement;
    const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
    if (typing) {
      el.addEventListener('blur', () => render(), { once: true });
      return;
    }
    render();
  });
})();
</script>
