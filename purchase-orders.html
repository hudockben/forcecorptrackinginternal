<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchase Orders</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --surface2:  #1a1a26;
      --border:    #2a2a3a;
      --green:     #818cf8;
      --green-dim: #6366f1;
      --red:       #ef4444;
      --yellow:    #eab308;
      --blue:      #60a5fa;
      --text:      #e0e0e0;
      --muted:     #666;
      --ok:        #4ade80;

      /* One colour per source division, used on the division chip so a long
         list reads at a glance. They match each division's own card on
         divisions.html — the same green means turf there and turf here. */
      --div-turf:   #22c55e;
      --div-paving: #60a5fa;
      --div-kiewit: #fdb913;
      --div-none:   #818cf8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; padding: 0.75rem 1.25rem;
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 200;
    }
    header .brand {
      font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--green); font-weight: 600; white-space: nowrap;
    }
    header .actions { display: flex; gap: 0.5rem; align-items: center; }
    .user-avatar {
      width: 26px; height: 26px; border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center; font-size: 0.66rem;
      font-weight: 700; color: #fff;
    }

    .btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      border-radius: 5px; padding: 0.38rem 0.8rem; font-size: 0.78rem;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: var(--green); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-green { background: var(--green); border-color: var(--green); color: #12121c; font-weight: 600; }
    .btn-green:hover:not(:disabled) { background: var(--green-dim); border-color: var(--green-dim); }

    main { padding: 1.25rem; max-width: 1600px; margin: 0 auto; }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.85rem;
    }
    .toolbar h1 {
      font-size: 1rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text);
    }
    .toolbar .tools { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

    .search {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); font-size: 0.85rem;
      padding: 0.5rem 0.75rem; outline: none; margin-bottom: 0.85rem;
      font-family: inherit;
    }
    .search:focus { border-color: var(--green); }

    .filter-bar {
      display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
      margin-bottom: 0.85rem;
    }
    .filter-bar select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 5px; font-size: 0.78rem; padding: 0.35rem 0.5rem;
      outline: none; font-family: inherit;
    }
    .chip {
      font-size: 0.72rem; padding: 0.25rem 0.6rem; border-radius: 12px;
      border: 1px solid rgba(234,179,8,0.4); background: rgba(234,179,8,0.12);
      color: var(--yellow); cursor: pointer; font-family: inherit;
    }
    .chip.on { background: var(--yellow); color: #1a1a26; font-weight: 700; }

    /* ── Division chip ── */
    .div-chip {
      display: inline-block; font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.12rem 0.45rem; border-radius: 10px; white-space: nowrap;
    }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table.po { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 6px; min-width: 1180px; }
    table.po th {
      padding: 0.55rem 0.6rem; color: var(--muted); font-size: 0.66rem;
      letter-spacing: 0.08em; text-transform: uppercase; text-align: left;
      border-bottom: 1px solid var(--border); white-space: nowrap; font-weight: 600;
    }
    table.po th.r, table.po td.r { text-align: right; }
    table.po td { padding: 0.35rem 0.6rem; vertical-align: middle; }
    table.po tr.po-head { border-bottom: 1px solid var(--border); }
    table.po tr.po-head:hover { background: rgba(129,140,248,0.04); }

    td input, td select {
      width: 100%; background: transparent; border: none; color: var(--text);
      font-size: 0.8rem; outline: none; padding: 0.15rem 0; font-family: inherit;
    }
    td select, td input.boxed {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 3px; padding: 0.15rem 0.25rem;
    }
    td input:focus, td select:focus { border-color: var(--green); }
    td input[type="date"] { color-scheme: dark; }

    .lines-wrap { padding: 0.5rem 1.25rem 0.75rem 2.25rem; background: #0b0b14; }
    .lines-wrap table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 760px; }
    .lines-wrap th {
      padding: 0.25rem 0.5rem; font-size: 0.62rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; text-align: left; font-weight: 600;
    }
    .lines-wrap td { padding: 0.3rem 0.5rem; }
    .lines-wrap tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .section-label {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin: 0.4rem 0;
    }

    .del-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.85rem; opacity: 0.6; padding: 0.15rem 0.3rem; font-family: inherit;
    }
    .del-btn:hover { color: var(--red); opacity: 1; }
    .icon-btn {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      cursor: pointer; padding: 0.15rem 0.4rem; font-size: 0.72rem;
      color: var(--muted); white-space: nowrap; font-family: inherit;
    }
    .icon-btn:hover { border-color: var(--green); }
    .icon-btn.has { color: var(--ok); }

    .empty { padding: 1.75rem; text-align: center; color: var(--muted); font-size: 0.85rem; }

    /* ── Save indicator ── */
    .save-indicator {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 400;
      font-size: 0.72rem; padding: 0.35rem 0.7rem; border-radius: 14px;
      border: 1px solid var(--border); background: var(--surface2);
      transition: opacity 0.2s; pointer-events: none;
    }
    .save-indicator.idle  { opacity: 0; }
    .save-indicator.saving{ opacity: 1; color: var(--muted); }
    .save-indicator.saved { opacity: 1; color: var(--ok); border-color: rgba(74,222,128,0.4); }
    .save-indicator.error { opacity: 1; color: var(--red); border-color: rgba(239,68,68,0.5); pointer-events: auto; }

    /* ── Modal / sheet ── */
    .backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 500;
      display: none; align-items: center; justify-content: center; padding: 1rem;
      overflow-y: auto;
    }
    .backdrop.open { display: flex; }
    .sheet {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
      padding: 1.25rem;
    }
    .sheet h2 { font-size: 0.95rem; margin-bottom: 0.25rem; }
    .sheet .sub { font-size: 0.76rem; color: var(--muted); margin-bottom: 1rem; }
    .field { margin-bottom: 0.8rem; }
    .field label {
      display: block; font-size: 0.66rem; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.25rem;
    }
    .field input, .field select, .field textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); font-size: 0.88rem;
      padding: 0.5rem 0.6rem; outline: none; font-family: inherit;
    }
    .field input:focus, .field select:focus { border-color: var(--green); }
    .field input[type="date"] { color-scheme: dark; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .sheet-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }

    .receipt-preview {
      width: 100%; max-height: 240px; object-fit: contain; border-radius: 6px;
      border: 1px solid var(--border); background: #000; margin-bottom: 0.85rem;
    }
    .scan-status {
      font-size: 0.8rem; padding: 0.6rem 0.75rem; border-radius: 6px;
      background: var(--surface2); border: 1px solid var(--border); margin-bottom: 0.85rem;
    }
    .scan-status.err { color: var(--red); border-color: rgba(239,68,68,0.4); }
    .scan-status.warn { color: var(--yellow); border-color: rgba(234,179,8,0.4); }
    .scanned-mark { color: var(--green); font-size: 0.62rem; margin-left: 0.3rem; }

    .spinner {
      display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
      border: 2px solid var(--border); border-top-color: var(--green);
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 1.25rem;
      z-index: 600; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.55rem 0.9rem; font-size: 0.82rem;
      max-width: 90vw; display: none;
    }
    .toast.show { display: block; }
    .toast.err { border-color: rgba(239,68,68,0.5); color: var(--red); }

    .pager { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-top: 0.85rem; }

    /* ── Phone ──
       The table is the office view. On a phone the same orders render as
       cards: this page's whole point on a phone is photographing a receipt at
       the supply counter, and a thirteen-column grid cannot be used one-handed. */
    @media (max-width: 860px) {
      main { padding: 0.75rem; }
      header { padding: 0.6rem 0.75rem; }
      .table-wrap { display: none; }
      .cards { display: block; }
      .toolbar h1 { font-size: 0.9rem; }
      .scan-cta { flex: 1 1 100%; }
      .scan-cta button { width: 100%; padding: 0.7rem; font-size: 0.92rem; }
    }
    .cards { display: none; }
    .po-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.75rem; margin-bottom: 0.65rem;
    }
    .po-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem; }
    .po-card .num { font-family: monospace; font-size: 0.8rem; color: var(--muted); }
    .po-card .title { font-size: 0.92rem; font-weight: 600; margin-bottom: 0.15rem; word-break: break-word; }
    .po-card .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.15rem; word-break: break-word; }
    .po-card .amt { font-size: 1.02rem; font-weight: 700; color: var(--yellow); }
    .po-card .card-actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; flex-wrap: wrap; }

    .status-pill {
      font-size: 0.66rem; font-weight: 700; padding: 0.15rem 0.5rem;
      border-radius: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-pending  { background: rgba(234,179,8,0.15);  color: var(--yellow); }
    .status-approved { background: rgba(74,222,128,0.15); color: var(--ok); }
    .status-closed   { background: rgba(255,255,255,0.07);color: var(--muted); }

    .banner {
      background: var(--surface2); border: 1px solid var(--border);
      border-left: 3px solid var(--yellow); border-radius: 5px;
      padding: 0.6rem 0.8rem; font-size: 0.8rem; margin-bottom: 0.85rem;
      color: var(--muted);
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:1rem;min-width:0">
    <span class="brand">Purchase Orders</span>
    <span id="user-badge" style="font-size:0.7rem;color:#444;letter-spacing:0.05em;"></span>
  </div>
  <div class="actions">
    <button class="btn" onclick="switchDivision()">Divisions</button>
    <button class="btn" onclick="logout()">Sign out</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap">
      <h1>Purchase Orders</h1>
      <span id="pending-chip-slot"></span>
    </div>
    <div class="tools">
      <div class="scan-cta">
        <button class="btn btn-green" id="scan-btn" onclick="openScanSheet()">&#128247; Scan Receipt</button>
      </div>
      <button class="btn" id="clear-filters-btn" onclick="clearFilters()" style="display:none">Clear Filters</button>
      <button class="btn" onclick="exportCSV()">&#8595; Export CSV</button>
      <button class="btn btn-green" id="new-po-btn" onclick="newPO()">+ New PO</button>
    </div>
  </div>

  <div id="load-banner" class="banner" style="display:none"></div>

  <input class="search" id="po-search" type="text" placeholder="&#128269; Search orders — PO number, vendor, job, invoice…"
         oninput="onSearch(this.value)" autocomplete="off" />

  <div class="filter-bar">
    <select id="f-division" onchange="onFilter('division', this.value)" aria-label="Filter by division">
      <option value="">All divisions</option>
    </select>
    <select id="f-status" onchange="onFilter('status', this.value)" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="closed">Closed</option>
    </select>
    <select id="f-job" onchange="onFilter('job', this.value)" aria-label="Filter by job">
      <option value="">Job and non-job</option>
      <option value="job">Tied to a job</option>
      <option value="general">General — no job</option>
    </select>
    <select id="f-vendor" onchange="onFilter('vendor', this.value)" aria-label="Filter by vendor">
      <option value="">All vendors</option>
    </select>
    <span id="result-count" style="font-size:0.74rem;color:var(--muted);margin-left:auto"></span>
  </div>

  <div class="table-wrap">
    <table class="po">
      <thead><tr>
        <th style="width:26px"></th>
        <th>PO #</th>
        <th style="min-width:118px">Date</th>
        <th style="min-width:130px">Division</th>
        <th style="min-width:160px">Job</th>
        <th style="min-width:180px">Cost / Sub Code</th>
        <th style="min-width:140px">Description</th>
        <th style="min-width:140px">Vendor</th>
        <th class="r">Qty</th>
        <th class="r">Amount</th>
        <th class="r">Total</th>
        <th style="min-width:118px">Status</th>
        <th style="width:46px;text-align:center" title="Attached receipts">&#128206;</th>
        <th style="width:34px"><span class="sr-only">Delete</span></th>
      </tr></thead>
      <tbody id="po-body"></tbody>
    </table>
  </div>

  <div class="cards" id="po-cards"></div>

  <div id="pager" class="pager" style="display:none"></div>
</main>

<div class="save-indicator idle" id="save-indicator"><span class="si-label"></span></div>
<div class="toast" id="toast"></div>

<!-- ══════════════ RECEIPT SCAN SHEET ══════════════ -->
<div class="backdrop" id="scan-backdrop">
  <div class="sheet" id="scan-sheet"></div>
</div>

<!-- ══════════════ ATTACHMENTS SHEET ══════════════ -->
<div class="backdrop" id="docs-backdrop">
  <div class="sheet" id="docs-sheet"></div>
</div>

<!-- Hidden capture inputs. `capture` asks a phone for the rear camera and is
     ignored on a desktop, which then offers the file picker instead. -->
<input type="file" id="receipt-capture" accept="image/*" capture="environment" style="display:none" />
<input type="file" id="attach-capture"  accept="image/*,application/pdf" style="display:none" />

<datalist id="vendor-list"></datalist>

<script>
/* ═══════════════════════════════════════════
   AUTH
═══════════════════════════════════════════ */
const fctToken    = localStorage.getItem('fct_token');
const fctUser     = (() => { try { return JSON.parse(localStorage.getItem('fct_user')); } catch { return null; } })();
const fctDivision = localStorage.getItem('fct_division');

const DIVISION = 'purchase_orders';
// The list general orders live in — the same key, named for what it holds.
// Declared here beside DIVISION because capsFor() below reads it, and a const
// still in its temporal dead zone throws on load rather than reading undefined.
const GENERAL  = 'purchase_orders';
const API_BASE = '/api';

if (!fctToken || !fctUser) {
  window.location.replace('index.html');
}
// Arrived through the division selector for this system, same guard the other
// division pages apply.
if (fctDivision !== DIVISION) {
  window.location.replace('divisions.html');
}

let _loggingOut = false;
function logout() {
  if (_loggingOut) return;
  _loggingOut = true;
  localStorage.removeItem('fct_token');
  localStorage.removeItem('fct_user');
  localStorage.removeItem('fct_division');
  window.location.replace('index.html');
}
function switchDivision() {
  localStorage.removeItem('fct_division');
  window.location.replace('divisions.html');
}

/**
 * What this user may do HERE.
 *
 * fctUser.role is the caller's TURF role — login.js sets it from
 * divisionRoles.turf for tracker.html's benefit — so reading it directly would
 * answer about the wrong division. The per-division map comes first and role is
 * only the fallback for a legacy token that carries no map. This mirrors
 * levelFor() in api/lib/auth.js.
 */
// The job divisions purchasing raises orders against. Mirrors
// PO_SOURCE_DIVISIONS in api/lib/auth.js.
const PO_SOURCE = ['turf', 'paving', 'kiewit'];

/** This user's level in one division, with no cross-division guessing. */
function _levelIn(division) {
  if (!fctUser) return 'no_access';
  if (fctUser.isPlatformAdmin) return 'admin';
  const r = fctUser.divisionRoles && fctUser.divisionRoles[division];
  return (r && r !== 'no_access') ? r : 'no_access';
}

/**
 * What this user may do with ONE division's orders.
 *
 * Rights here are per division, because that is how the server decides: an
 * order tied to paving is checked against paving. Working it out once for the
 * page and applying it to every row put a delete button on rows the server then
 * refused — and it was worse than that, because the old code fell back to
 * `fctUser.role` when there was no purchasing role, and that field is the
 * caller's TURF role. A turf administrator with no purchasing role was told
 * they could do anything here and could actually do nothing with the general
 * list: the order they raised never saved, and the row could not be deleted
 * either. Mirrors poCapabilities() in api/lib/auth.js.
 */
function capsFor(division) {
  const own = _levelIn(division);
  // The general list is purchasing's own, so only a purchasing role reaches it.
  const viaPurchasing = (division === GENERAL || PO_SOURCE.includes(division))
    ? _levelIn(DIVISION) : 'no_access';
  const canUpload = l => ['admin', 'level3', 'level2'].includes(l);
  const canManage = l => ['admin', 'level3'].includes(l);
  return {
    canEdit:   canUpload(own) || canUpload(viaPurchasing),
    canDelete: canManage(own) || canManage(viaPurchasing),
  };
}

// Page-level gating: what the toolbar offers. True when the user can act in at
// least one list they can see — the per-row checks decide the rest.
const perm = (() => {
  const reachable = PO_SOURCE.concat([GENERAL]);
  return {
    level:     _levelIn(DIVISION),
    isAdmin:   _levelIn(DIVISION) === 'admin',
    canEdit:   reachable.some(d => capsFor(d).canEdit),
    canDelete: reachable.some(d => capsFor(d).canDelete),
  };
})();

(function renderUserBadge() {
  const badge = document.getElementById('user-badge');
  if (!badge || !fctUser) return;
  const name = fctUser.name || fctUser.username || '';
  const parts = name.trim().split(/\s+/);
  const initials = parts.length >= 2
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : name.slice(0, 2).toUpperCase() || '?';
  const palette = ['#2ecc71','#3498db','#9b59b6','#e67e22','#e74c3c','#1abc9c','#f39c12','#16a085'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  badge.style.cssText = 'display:flex;align-items:center;gap:0.5rem;min-width:0';
  badge.innerHTML =
    '<span class="user-avatar" style="background:' + palette[h % palette.length] + '">' + esc(initials) + '</span>' +
    '<span style="font-size:0.7rem;color:#888;letter-spacing:0.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
    esc(fctUser.companyName || fctUser.companyCode) + ' &middot; ' + esc(fctUser.username) + '</span>';
})();

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/**
 * Escape a value for a JS string literal inside an HTML attribute.
 *
 * esc() is not enough here and never was: it turns ' into &#39;, which the HTML
 * parser decodes back to ' before the JS parser ever sees the attribute — so
 * for `onclick="f('...')"` it protects nothing. Ids are uid()-generated
 * everywhere today, but the full-list PUT validates nothing about po.id or
 * line.id, so a crafted id stored by any division user would land here and run
 * in a purchasing session — which holds a carve-out into three divisions that
 * the author does not. Backslash-escape first, then HTML-escape what is left.
 */
/**
 * Escape a value for use inside an id="..." attribute.
 *
 * The companion to jsAttr below, and the other half of the same hole: jsAttr
 * closed the handler ARGUMENTS, but ids were interpolated into id= attributes
 * with no escaping at all, so a double quote in one closed the attribute and
 * could add an event handler of its own. getElementById is given the raw value,
 * which is what it matches on, so only the markup side is encoded.
 */
function idAttr(v) { return esc(v); }

function jsAttr(v) {
  return esc(String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function fmt(n)  { return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function qfmt(n) { const v = Number(n) || 0; return v % 1 === 0 ? v.toLocaleString('en-US') : v.toLocaleString('en-US', { maximumFractionDigits: 3 }); }
function localDateStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

let _toastTimer = null;
function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind === 'err' ? ' err' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'err' ? 6000 : 3000);
}

let _saveHideTimer = null;
function showSave(state, text) {
  const el = document.getElementById('save-indicator');
  el.className = 'save-indicator ' + state;
  el.querySelector('.si-label').textContent = text || '';
  clearTimeout(_saveHideTimer);
  if (state === 'saved') {
    _saveHideTimer = setTimeout(() => {
      if (el.classList.contains('saved')) el.className = 'save-indicator idle';
    }, 2500);
  }
}

async function api(method, path, body) {
  const init = {
    method,
    headers: { 'Authorization': 'Bearer ' + fctToken },
  };
  if (body !== undefined) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(body);
  }
  const res = await fetch(API_BASE + path, init);
  if (res.status === 401) { logout(); throw new Error('Signed out'); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { /* non-JSON error page */ }
  if (!res.ok) {
    const msg = (data && (data.detail || data.error)) || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return data;
}

/* ═══════════════════════════════════════════
   LINE MATH
   Mirrors api/lib/po-sync.js and the division tabs: tax is entered as a
   percentage of the line amount and the dollar figure is kept in step with it,
   so every downstream reader still sees dollars.
═══════════════════════════════════════════ */
function lineAmt(l)    { return (parseFloat(l.qty) || 0) * (parseFloat(l.unit_cost) || 0); }
function lineTaxPct(l) { const p = parseFloat(l.tax_pct); return isNaN(p) ? null : p; }
function lineTax(l)    { const p = lineTaxPct(l); return p === null ? (parseFloat(l.tax) || 0) : lineAmt(l) * p / 100; }
function recalcLineTax(l) {
  if (l.tax_pct == null) return;
  const p = lineTaxPct(l);
  const t = p === null ? 0 : lineAmt(l) * p / 100;
  l.tax = t ? String(t) : '';
}
function poTotals(po) {
  let qty = 0, amt = 0, tax = 0;
  (po.lines || []).forEach(l => { qty += parseFloat(l.qty) || 0; amt += lineAmt(l); tax += lineTax(l); });
  return { qty, amt, tax, total: amt + tax };
}
function newLine() {
  return { id: uid(), invoice_num: '', date: localDateStr(), qty: '', unit_cost: '', tax: '', tax_pct: '', employee: '', po_row_id: null };
}

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */

// poId → the division the SERVER has this order under, which is not always
// where the screen now shows it: re-tying an order sets po._division straight
// away, and this still says where it has to be removed from. Seeded whenever a
// list is read, because an order that arrived before this page did is exactly
// the one someone is most likely to re-tie.
const _savedDivision = {};
const DIV_COLORS = { turf: 'var(--div-turf)', paving: 'var(--div-paving)', kiewit: 'var(--div-kiewit)' };

let catalog       = { divisions: [], vendors: [], employees: [], truncated: [] };
let sourceDivs    = [];        // [{ division, label, projects: [...] }]
let purchaseOrders = [];       // every order across every list, each tagged _division
let docCounts     = {};        // poId → attached document count
let expanded      = new Set();
let page          = 0;
const PER_PAGE    = 12;
let search        = '';
let filters       = { division: '', status: '', job: '', vendor: '' };

function divMeta(key) { return sourceDivs.find(d => d.division === key) || null; }
function divLabel(key) {
  if (!key || key === GENERAL) return 'General';
  const m = divMeta(key);
  return m ? m.label : key;
}
function divColor(key) { return DIV_COLORS[key] || 'var(--div-none)'; }

function projectsFor(divKey) {
  const m = divMeta(divKey);
  return m ? m.projects : [];
}
function projectFor(divKey, projId) {
  return projectsFor(divKey).find(p => p.id === projId) || null;
}
function codesFor(divKey, projId) {
  const p = projectFor(divKey, projId);
  return p ? p.codes : [];
}

/** The label a cost/sub code pair renders as, matching the division tabs. */
function codeLabel(c) {
  const base = [c.cost_code, c.sub_code].filter(Boolean).join(' / ');
  return c.description ? base + ' — ' + c.description : base;
}
function codeValue(c) { return (c.cost_code || '') + '||' + (c.sub_code || ''); }

/**
 * Next PO number for a division's own list.
 *
 * Scoped to that division on purpose: its own tab numbers the same way, off the
 * same list, so an order raised here continues that division's sequence instead
 * of starting a parallel one.
 *
 * `excludeId` is the order being renumbered. Re-tying an order sets its
 * division first, so without this it counts ITSELF — an order carrying PO-0042
 * moved into a list whose highest is PO-0003 would come out as PO-0043,
 * skipping forty numbers of that division's sequence for no reason.
 */
function nextPONumber(divKey, excludeId) {
  const nums = purchaseOrders
    .filter(po => po._division === divKey && po.id !== excludeId)
    .map(po => { const m = (po.po_number || '').match(/^PO-(\d+)$/); return m ? parseInt(m[1], 10) : 0; });
  const next = nums.length ? Math.max.apply(null, nums) + 1 : 1;
  return 'PO-' + String(next).padStart(4, '0');
}

═══════════════════════════════════════════ */
async function loadCatalog() {

    + vendors.map(v => '<option value="' + esc(v.name) + '">' + esc(v.name) + '</option>').join('');

  }

  }
