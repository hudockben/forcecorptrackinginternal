function render() {
  const all = visiblePOs().slice().reverse();
  const totalPages = Math.max(1, Math.ceil(all.length / PER_PAGE));
  if (page >= totalPages) page = totalPages - 1;
  if (page < 0) page = 0;
  const rows = all.slice(page * PER_PAGE, (page + 1) * PER_PAGE);

  renderTable(rows);
  renderCards(rows);

  const pending = purchaseOrders.filter(po => (po.status || 'pending') === 'pending').length;
  document.getElementById('pending-chip-slot').innerHTML = pending
    ? '<button class="chip' + (filters.status === 'pending' ? ' on' : '') + '" onclick="togglePending()">' +
      pending + ' pending approval</button>'
    : '';

  document.getElementById('clear-filters-btn').style.display = hasFilters() ? '' : 'none';
  document.getElementById('result-count').textContent =
    all.length + ' order' + (all.length === 1 ? '' : 's') +
    (all.length !== purchaseOrders.length ? ' of ' + purchaseOrders.length : '');

  const pager = document.getElementById('pager');
  if (totalPages > 1) {
    pager.style.display = '';
    pager.innerHTML =
      '<button class="btn" ' + (page === 0 ? 'disabled' : '') + ' onclick="page=Math.max(0,page-1);render()">&larr; Prev</button>' +
      '<span style="font-size:0.78rem;color:var(--muted)">Page ' + (page + 1) + ' of ' + totalPages + '</span>' +
      '<button class="btn" ' + (page === totalPages - 1 ? 'disabled' : '') + ' onclick="page=Math.min(' + (totalPages - 1) + ',page+1);render()">Next &rarr;</button>';
  } else {
    pager.style.display = 'none';
  }

  if (!perm.canEdit) {
    document.getElementById('new-po-btn').style.display = 'none';
    document.getElementById('scan-btn').style.display = 'none';
  }
}

/* ═══════════════════════════════════════════
   CSV EXPORT
═══════════════════════════════════════════ */
function exportCSV() {
  const rows = visiblePOs();
  const head = ['PO #','Division','Job','Job #','Cost Code','Sub Code','Description','Vendor','Date','Status',
                'Invoice #','Delivery Date','Qty','Unit Cost','Amount','Tax %','Tax','Line Total','Received By'];
  // Quoting makes the CSV parse; it does not stop a spreadsheet EVALUATING a
  // field that begins with =, +, - or @. A vendor recorded as =HYPERLINK(...)
  // or a WEBSERVICE payload runs the moment somebody opens the export. A
  // leading apostrophe is the standard defusing and Excel and Sheets both hide
  // it.
  // A negative NUMBER is not a formula. Prefixing one makes the cell text, so a
  // credit or a return drops out of every column sum and the export stops
  // reconciling with what this page shows — the exact thing an export is for.
  const NUMERIC = /^-?\d+(\.\d+)?([eE][-+]?\d+)?$/;
  const q = v => {
    let t = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(t) && !NUMERIC.test(t)) t = "'" + t;
    return '"' + t.replace(/"/g, '""') + '"';
  };
  const out = [head.map(q).join(',')];
  rows.forEach(po => {
    const proj = projectFor(po._division, po.project_id);
    const base = [
      po.po_number || '', divLabel(po._division),
      proj ? proj.name : (po.project_id || 'General — no job'),
      proj ? proj.jobNumber : '',
      po.cost_code || '', po.sub_code || '', po.title || '', po.supplier || '',
      po.date_created || '', po.status || '',
    ];
    const lines = po.lines || [];
    if (!lines.length) {
      out.push(base.concat(['','','','','','','','','']).map(q).join(','));
      return;
    }
    lines.forEach((l, i) => {
      const amt = lineAmt(l), tax = lineTax(l), pct = lineTaxPct(l);
      // The header repeats only on the first delivery, so an order reads as one
      // block in a spreadsheet instead of the same job restated per line.
      const lead = i === 0 ? base : base.map(() => '');
      out.push(lead.concat([
        l.invoice_num || '', l.date || '',
        (parseFloat(l.qty) || '') , (parseFloat(l.unit_cost) || ''),
        amt.toFixed(2), pct === null ? '' : pct, tax.toFixed(2), (amt + tax).toFixed(2),
        l.employee || '',
      ]).map(q).join(','));
    });
  });
  const blob = new Blob([out.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'purchase_orders_' + localDateStr() + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ═══════════════════════════════════════════
   RECEIPT PHOTOS
═══════════════════════════════════════════ */

/**
 * Shrink a camera photo before it goes anywhere.
 *
 * A modern phone shoots 4–12 MB, over both the platform's request ceiling and
 * what the scan endpoint accepts. 1600px on the long edge is more than enough
 * to read a receipt and lands around 200–400 KB, which also makes the upload
 * survivable on jobsite LTE. Drawing through a canvas converts HEIC to JPEG on
 * the way, which is the other reason this is not optional.
 */
function downscaleImage(file, maxEdge) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        if (!blob) { reject(new Error('Could not read that photo')); return; }
        resolve({ blob, dataUrl: canvas.toDataURL('image/jpeg', 0.85), width: w, height: h });
      }, 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not an image this browser can read')); };
    img.src = url;
  });
}

/** Ask for one photo through a hidden input, and hand back the File. */
/** The listeners a previous pick left behind, so a new one can clear them. */
const _pickCleanup = {};

function pickImage(inputId) {
  return new Promise(resolve => {
    const input = document.getElementById(inputId);

    // Opening the camera and backing out fires no `change` at all on most
    // phones, so the old listener stayed attached and its promise never
    // settled. The next photo then fired EVERY listener still on the input:
    // one receipt was decoded, uploaded and read once per abandoned attempt,
    // each a paid call to the scan endpoint, with the sheets racing each other.
    if (_pickCleanup[inputId]) { _pickCleanup[inputId](); }

    let done = false;
    const finish = file => {
      if (done) return;
      done = true;
      cleanup();
      resolve(file);
    };
    const onChange = () => finish(input.files && input.files[0] ? input.files[0] : null);
    function cleanup() {
      input.removeEventListener('change', onChange);
      if (_pickCleanup[inputId] === abandon) delete _pickCleanup[inputId];
    }
    // Called by the NEXT pick: settle this one as a cancellation so its caller
    // unwinds instead of waiting forever, and detach its listener.
    //
    // Deliberately NOT the input's own `cancel` event, which would be the
    // direct way to notice a dismissed picker. Its firing is not consistent —
    // a programmatic click() can raise it immediately, before any chooser is
    // shown, and that kills the scan before the photo arrives. Settling on the
    // next attempt is later but cannot misfire, and the leak is what mattered.
    const abandon = () => finish(null);

    input.value = '';
    input.addEventListener('change', onChange);
    _pickCleanup[inputId] = abandon;
    input.click();
  });
}

/**
 * File a photo against an order, in the order's OWN division.
 *
 * That last part is the whole point: a receipt filed under purchasing would be
 * invisible from the paperclip on the same order in the paving tab. The upload
 * is the three-step dance every division page uses — ticket, bytes straight to
 * storage, then register — with the relay fallback for a bucket that has no
 * CORS rule, since a phone on LTE is exactly where that bites.
 */
async function attachToPO(po, blob, filename, note) {
  const division = po._division;
  const poQ = '&poId=' + encodeURIComponent(po.id);
  const projQ = po.project_id ? '&projectId=' + encodeURIComponent(po.project_id) : '';

  // 1. Make sure the folders exist, and find the one this belongs in. An
  //    order's own folder is created by the registration below, so the first
  //    receipt files into the job's Purchase Orders root (or Unassigned POs
  //    when the order has no job) and later ones join it there.
  let folderId = null;
  try {
    const tree = await api('PUT', '/documents?division=' + encodeURIComponent(division) + poQ + projQ, {});
    const folders = (tree && tree.folders) || [];
    const bySlug = slug => (folders.find(f => f.slug === slug) || {}).id || null;
    folderId = bySlug('po-' + po.id)
            || (po.project_id ? bySlug('purchase-orders') : bySlug('unassigned-pos'))
            || (folders[0] || {}).id || null;
  } catch (err) {
    throw new Error('Could not open the document folders: ' + err.message);
  }
  if (!folderId) throw new Error('No folder to file this receipt in');

  // 2. Ticket.
  const ticket = await api('POST', '/document-upload-url?division=' + encodeURIComponent(division) + poQ, {
    filename, sizeBytes: blob.size, projectId: po.project_id || undefined, poId: po.id,
  });

  // 3. Bytes.
  let put;
  try {
    put = await fetch(ticket.uploadUrl, { method: 'PUT', body: blob, headers: { 'Content-Type': ticket.contentType } });
  } catch (err) {
    // A cross-origin PUT needs a preflight and a bucket with no CORS rule
    // refuses it, which surfaces as a bare "Failed to fetch" with nothing in
    // any log. Relay through the API, which is same-origin.
    const b64 = await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload  = () => resolve(String(fr.result).split(',')[1] || '');
      fr.onerror = () => reject(new Error('Could not read the photo back'));
      fr.readAsDataURL(blob);
    });
    await api('PUT', '/document-upload-url?division=' + encodeURIComponent(division) + poQ,
              { storageKey: ticket.storageKey, contentBase64: b64, poId: po.id });
    put = { ok: true };
  }
  if (!put.ok) throw new Error('Upload to storage failed (' + put.status + ')');

  // 4. Register — and clean up the stored bytes if it does not land, or they
  //    sit in the bucket with nothing pointing at them.
  try {
    // poQ as well as projQ: the carve-out reads the order it was granted for
    // from the QUERY, so without it this leg 403s and the bytes already in the
    // bucket are thrown away — no receipt could be filed against a turf,
    // paving or kiewit order at all.
    await api('POST', '/documents?division=' + encodeURIComponent(division) + projQ + poQ, {
      documentId: ticket.documentId,
      filename,
      storageKey: ticket.storageKey,
      sizeBytes:  blob.size,
      folderId,
      poId:       po.id,
      poNumber:   po.po_number,
      note:       note || undefined,
    });
  } catch (err) {
    try {
      await api('DELETE', '/document-upload-url?division=' + encodeURIComponent(division) +
                '&storageKey=' + encodeURIComponent(ticket.storageKey) + poQ);
    } catch (cleanupErr) {
      console.warn('[po] could not remove the orphaned upload:', cleanupErr.message);
    }
    throw err;
  }

  docCounts[po.id] = (docCounts[po.id] || 0) + 1;
}

/* ═══════════════════════════════════════════
   SCAN SHEET
═══════════════════════════════════════════ */
let scanState = null;   // { dataUrl, blob, filename, receipt, targetPoId, token }

// Which scan is current. Every scan takes a number, and a reply whose number is
// no longer the live one is dropped — that is what stops an abandoned scan
// re-opening the sheet, and what stops two scans crossing receipt #1's figures
// with receipt #2's photo.
let _scanToken = 0;

// Where the list was when a sheet took over the screen.
let _scrollUnderSheet = 0;

/** Stop the page behind a sheet scrolling with it, without losing the reader's
 *  place. `position: fixed` is the only thing iOS Safari honours here, and it
 *  resets the scroll to the top on its own, so the offset is put back by hand. */
function lockBodyScroll() {
  if (document.body.classList.contains('sheet-open')) return;
  _scrollUnderSheet = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.style.top = '-' + _scrollUnderSheet + 'px';
  document.body.classList.add('sheet-open');
}

function unlockBodyScroll() {
  if (!document.body.classList.contains('sheet-open')) return;
  document.body.classList.remove('sheet-open');
  document.body.style.top = '';
  window.scrollTo(0, _scrollUnderSheet);
}

function closeScan() {
  document.getElementById('scan-backdrop').classList.remove('open');
  unlockBodyScroll();
  _scanToken++;          // whatever is in flight is no longer wanted
  scanState = null;
}

function renderScanSheet(body) {
  const sheet = document.getElementById('scan-sheet');
  sheet.innerHTML = body;
  document.getElementById('scan-backdrop').classList.add('open');
  // The page behind a sheet must not scroll with it. Without this, a flick
  // that starts on the sheet and runs past its end carries on scrolling the
  // order list underneath — so the sheet appears to drift over a moving
  // background, and closing it leaves the list somewhere else entirely.
  lockBodyScroll();
}

/** Toolbar entry point: a photo becomes a brand-new order. */
async function openScanSheet() { await beginScan(null); }

/** Row entry point: a photo becomes another delivery on an existing order. */
async function scanIntoPO(poId) { await beginScan(poId); }

/** Guard against a double tap on Create/Add booking the same receipt twice. */
let _committing = false;

/** True from the moment the photo is taken until the figures are on screen. */
let _scanBusy = false;

/** The Cancel the reading state offers — deliberate, unlike a stray backdrop tap. */
function cancelScan() {
  _scanBusy = false;
  closeScan();
}

async function beginScan(targetPoId) {
  if (!perm.canEdit) return;
  // The same check "+ New PO" makes, before the camera opens rather than after
  // the photo is taken and the figures reviewed. A scan with nowhere to land
  // used to fall back to the general list, which may be the one that failed.
  if (!targetPoId && !defaultNewDivision()) {
    toast('No purchase-order list is available to raise an order in right now. Reload and try again.', 'err');
    return;
  }
  const file = await pickImage('receipt-capture');
  if (!file) return;

  // This scan's number. Every step below checks it is still the live one before
  // touching the screen, so a scan the user dismissed — or one they replaced by
  // starting another — finishes quietly instead of taking the page over.
  const token = ++_scanToken;
  const live  = () => _scanToken === token;

  _scanBusy = true;
  renderScanSheet(
    '<h2>Reading the receipt</h2>' +
    // Honest about the wait. "A few seconds" set the expectation at two or
    // three, so at fifteen the reasonable conclusion is that it has hung.
    '<div class="sub">Usually under half a minute. The photo is already saved — ' +
    'if the read fails you can still type the figures in.</div>' +
    '<div class="scan-status"><span class="spinner"></span>Looking at the photo…</div>' +
    '<div class="sheet-actions"><button class="btn" onclick="cancelScan()">Cancel</button></div>');

  let shot;
  try {
    shot = await downscaleImage(file, 1600);
  } catch (err) {
    _scanBusy = false;
    if (!live()) return;
    // Close was the only way out, so a photo this browser could not decode —
    // an odd HEIC variant, a file the camera wrote badly — ended the attempt
    // entirely. Offer another photo from here instead of sending the person
    // back to the toolbar, and say that typing it out is still an option.
    renderScanSheet(
      '<h2>Could not read that photo</h2>' +
      '<div class="scan-status err">' + esc(err.message) + '</div>' +
      '<div class="sub">Try another photo, or raise the order by hand and attach the receipt to it afterwards.</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn" onclick="closeScan()">Close</button>' +
        '<button class="btn btn-green" onclick="closeScan(); beginScan(' +
          (targetPoId ? "'" + jsAttr(targetPoId) + "'" : 'null') + ');">Another photo</button>' +
      '</div>');
    return;
  }
  if (!live()) return;

  scanState = {
    dataUrl: shot.dataUrl,
    blob: shot.blob,
    filename: 'receipt-' + localDateStr() + '-' + Date.now().toString(36) + '.jpg',
    receipt: null,
    targetPoId: targetPoId || null,
    token,
  };

  let receipt = null, scanError = null;
  try {
    const res = await api('POST', '/ai/receipt-scan', {
      imageBase64: shot.dataUrl.split(',')[1],
      mediaType: 'image/jpeg',
      vendors: (catalog.vendors || []).map(v => v.name),
    });
    receipt = res && res.receipt ? res.receipt : null;
  } catch (err) {
    scanError = err.message;
  }

  _scanBusy = false;
  // Dismissed, or replaced by a later scan, while the model was reading. Say
  // nothing and touch nothing.
  if (!live()) return;

  // A scan that failed is not a dead end: the photo is still worth attaching
  // and the fields are still worth typing, so the form opens either way.
  scanState.receipt = receipt;
  renderScanForm(receipt, scanError);
}

function renderScanForm(receipt, scanError) {
  const r = receipt || {};
  const target = scanState.targetPoId ? purchaseOrders.find(p => p.id === scanState.targetPoId) : null;

  let status;
  if (scanError) {
    // A failed read left only one way forward: type all seven fields. The photo
    // is still in scanState, so reading it again costs one tap — and most of
    // these failures are a dropped request rather than an unreadable receipt.
    status = '<div class="scan-status err">Could not read the receipt automatically (' + esc(scanError) +
             '). Try again, or fill it in below — the photo still gets attached.' +
             '<div style="margin-top:0.5rem"><button class="btn" onclick="rereadScan()">Read the photo again</button></div>' +
             '</div>';
  } else if (r.confidence === 'low') {
    status = '<div class="scan-status warn">Read with low confidence — check every figure before saving.' +
             (r.notes ? ' ' + esc(r.notes) : '') + '</div>';
  } else {
    status = '<div class="scan-status">Read from the photo. Check the figures, then save.' +
             (r.notes ? ' <span style="color:var(--muted)">' + esc(r.notes) + '</span>' : '') + '</div>';
  }

  const mark = v => v == null || v === '' ? '' : '<span class="scanned-mark">scanned</span>';
  const val  = v => v == null ? '' : String(v);

  // An order tied to a job is the common case but not the only one, so the
  // division picker leads and "General" is a real answer, not a placeholder.
  // Only lists this user can actually save into — the same rule "+ New PO" and
  // the row picker follow. Offering the rest produced a scan that reviewed
  // cleanly and then 403'd on save, with the photo already taken.
  const writable = d => capsFor(d).canEdit && loadedLists.has(d);
  const scanDefault = defaultNewDivision();
  const divOpts = (writable(GENERAL)
      ? ['<option value="' + GENERAL + '"' + (scanDefault === GENERAL ? ' selected' : '') + '>General — no division</option>']
      : [])
    .concat(listDivs().filter(d => writable(d.division)).map(d =>
      '<option value="' + esc(d.division) + '"' + (scanDefault === d.division ? ' selected' : '') + '>' + esc(d.label) + '</option>')).join('');

  renderScanSheet(
    '<h2>' + (target ? 'Add to ' + esc(target.po_number) : 'New purchase order') + '</h2>' +
    '<div class="sub">' + (target ? 'From a photographed receipt.' : 'Everything here can be changed afterwards.') + '</div>' +
    '<img class="receipt-preview" src="' + scanState.dataUrl + '" alt="The receipt being read" />' +
    status +
    (target ? '' :
      '<div class="field"><label>Division' + '</label>' +
        '<select id="sc-division" onchange="onScanDivision(this.value)">' + divOpts + '</select></div>' +
      '<div class="field"><label>Job</label><select id="sc-project" onchange="onScanProject(this.value)">' +
        '<option value="">General — no job</option></select></div>' +
      '<div class="field"><label>Cost / Sub Code</label><select id="sc-code">' +
        '<option value="">— pick a job first —</option></select></div>') +
    '<div class="field"><label>Vendor' + mark(r.vendor) + '</label>' +
      '<input type="text" id="sc-vendor" list="vendor-list" autocorrect="off" spellcheck="false" autocapitalize="words" value="' + esc(val(r.vendor)) + '" placeholder="Who it was bought from"></div>' +
    '<div class="field"><label>Description' + mark(r.description) + '</label>' +
      '<input type="text" id="sc-title" value="' + esc(val(r.description)) + '" placeholder="What was bought"></div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Date' + mark(r.date) + '</label>' +
        '<input type="date" id="sc-date" value="' + esc(r.date || localDateStr()) + '"></div>' +
      '<div class="field"><label>Invoice #' + mark(r.invoice_number) + '</label>' +
        '<input type="text" id="sc-invoice" autocapitalize="characters" autocorrect="off" spellcheck="false" value="' + esc(val(r.invoice_number)) + '"></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Qty' + mark(r.qty) + '</label>' +
        '<input type="number" step="any" inputmode="decimal" id="sc-qty" value="' + esc(val(r.qty)) + '" placeholder="1"></div>' +
      '<div class="field"><label>Unit Cost' + mark(r.unit_cost) + '</label>' +
        '<input type="number" step="any" inputmode="decimal" id="sc-unit" value="' + esc(val(r.unit_cost)) + '"></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="field"><label>Tax %' + mark(r.tax_pct) + '</label>' +
        '<input type="number" step="any" inputmode="decimal" id="sc-taxpct" value="' + esc(val(r.tax_pct)) + '"></div>' +
      '<div class="field"><label>Total' + mark(r.total) + '</label>' +
        '<input type="number" step="any" inputmode="decimal" id="sc-total" value="' + esc(val(r.total)) + '"></div>' +
    '</div>' +
    '<div class="sub" id="sc-hint" style="margin-bottom:0">' +
      'Qty and Unit Cost go together — with either missing, the order is booked ' +
      'as one line at the Total shown.</div>' +
    '<div class="sheet-actions">' +
      '<button class="btn" onclick="closeScan()">Cancel</button>' +
      '<button class="btn btn-green" id="sc-save" onclick="commitScan()">' +
        (target ? 'Add delivery' : 'Create order') + '</button>' +
    '</div>');

  if (!target) onScanDivision(scanDefault || GENERAL);
}

function onScanDivision(divKey) {
  const projSel = document.getElementById('sc-project');
  const codeSel = document.getElementById('sc-code');
  if (!projSel) return;
  const list = divKey === GENERAL ? [] : projectsFor(divKey);
  projSel.innerHTML = '<option value="">General — no job</option>' + list.map(p =>
    '<option value="' + esc(p.id) + '">' + esc(p.name + (p.jobNumber ? '  (#' + p.jobNumber + ')' : '')) + '</option>').join('');
  projSel.disabled = divKey === GENERAL;
  codeSel.innerHTML = '<option value="">' + (divKey === GENERAL ? '—' : '— pick a job first —') + '</option>';
  codeSel.disabled = true;
}

function onScanProject(projId) {
  const divKey = document.getElementById('sc-division').value;
  const codeSel = document.getElementById('sc-code');
  const codes = projId ? codesFor(divKey, projId) : [];
  codeSel.innerHTML = '<option value="">' + (projId ? '— select —' : 'No job — no code') + '</option>' +
    codes.map(c => '<option value="' + esc(codeValue(c)) + '">' + esc(codeLabel(c)) + '</option>').join('');
  codeSel.disabled = !projId || !codes.length;
}

/**
 * Turn the reviewed scan into a saved order, then attach the photo to it.
 *
 * The order is saved first and the photo second, deliberately: the attachment
 * needs an order id that already exists in the division's list, because that is
 * what the document endpoint checks before letting purchasing write there.
 */
async function commitScan() {
  // A second tap before the first finishes would raise a second order from the
  // same receipt. The button is disabled below, but a phone can register both
  // taps before the handler runs.
  if (_committing || !scanState) return;
  _committing = true;
  const btn = document.getElementById('sc-save');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…'; }

  const qty   = document.getElementById('sc-qty').value;
  const unit  = document.getElementById('sc-unit').value;
  const total = parseFloat(document.getElementById('sc-total').value);
  const taxPct = document.getElementById('sc-taxpct').value;

  // A line is only worth money when it has BOTH a quantity and a unit cost:
  // amount is one times the other, so either alone books the delivery at zero
  // while the job is charged for a real load. A thermal ticket printing
  // "8.5 TON" with the price column illegible produces exactly that, and so
  // does anyone tabbing past one of the two fields.
  //
  // So the fallback fires whenever the pair is incomplete and a total is
  // known: the order goes in as a single unit priced at the total, which is
  // the shape the division tabs produce for a one-off purchase and keeps the
  // job cost right.
  // On the AMOUNT, not on whether the boxes are blank: "0" is a non-empty
  // string, so a ticket read as 8.5 TON at a unit cost of 0 looked like a
  // complete pair, discarded the Total, and booked the delivery at nothing.
  let lineQty = qty, lineUnit = unit;
  const pct = parseFloat(taxPct);
  const withTax = amt => (!isNaN(pct) && pct !== 0) ? amt * (1 + pct / 100) : amt;
  const pairAmount = (parseFloat(lineQty) || 0) * (parseFloat(lineUnit) || 0);
  const pairIncomplete = pairAmount === 0;

  // The Total is what the supplier charged, and it is the figure the user just
  // checked against the receipt. Where the quantity and unit price do not come
  // to it — a ticket listing more than one item, an illegible price column, a
  // rounded unit rate — the Total wins and the unit price is derived from it,
  // because booking the job for less than it was billed charges the difference
  // to nobody. It used to be read and then silently thrown away.
  if (!pairIncomplete && !isNaN(total) && total !== 0
      && Math.abs(withTax(pairAmount) - total) > 0.01) {
    const q = parseFloat(lineQty) || 1;
    lineUnit = String((!isNaN(pct) && pct !== 0 ? total / (1 + pct / 100) : total) / q);
    toast('Quantity × unit cost came to $' + fmt(withTax(pairAmount)) + ', not the $' + fmt(total) +
          ' on the receipt — booked at the receipt total.');
  } else if (pairIncomplete && !isNaN(total) && total !== 0) {
    lineQty = '1';
    lineUnit = String(!isNaN(pct) && pct !== 0 ? total / (1 + pct / 100) : total);
  } else if (pairIncomplete) {
    // No total either — there is no amount to book. Better to say so than to
    // write a $0 delivery that reads as a real material entry on the job.
    _committing = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Create order'; }
    toast('Enter a Total, or both Qty and Unit Cost — otherwise the order books at $0.', 'err');
    return;
  }

  const line = Object.assign(newLine(), {
    invoice_num: document.getElementById('sc-invoice').value || '',
    date:        document.getElementById('sc-date').value || localDateStr(),
    qty:         lineQty || '',
    unit_cost:   lineUnit || '',
    tax_pct:     taxPct || '',
  });
  recalcLineTax(line);

  // The photo, read before anything can clear it: dismissing the sheet during
  // the attach nulls scanState, and reading it afterwards threw a raw
  // TypeError at the user instead of a sentence.
  const shotBlob = scanState.blob;
  const shotName = scanState.filename;
  // ...and the preview with them, so the retry sheet can show the person which
  // photo it is still holding.
  const shotDataUrl = scanState.dataUrl;

  let po;
  let created = false;  // did this scan RAISE the order, or attach to one?
  let undo = null;   // how to put the page back if the save does not land
  try {
    if (scanState.targetPoId) {
      po = purchaseOrders.find(p => p.id === scanState.targetPoId);
      if (!po) throw new Error('That order is no longer on this page');
      const before = (po.lines || []).slice();
      const hadSupplier = po.supplier, hadTitle = po.title;
      po.lines = (po.lines || []).concat([line]);
      if (!po.supplier) po.supplier = document.getElementById('sc-vendor').value || '';
      if (!po.title)    po.title    = document.getElementById('sc-title').value || '';
      undo = () => { po.lines = before; po.supplier = hadSupplier; po.title = hadTitle; };
      expanded.add(po.id);
      await _savePONow(po);
    } else {
      // No `|| GENERAL` fallback. The picker only offers lists this user can
      // write to that have loaded, so an empty value means there is no such
      // list — and defaulting to the general one put the order in a division
      // the save would refuse, or numbered it off a list that never arrived.
      const divKey  = document.getElementById('sc-division').value;
      if (!divKey || !loadedLists.has(divKey) || !capsFor(divKey).canEdit) {
        throw new Error('No purchase-order list is available to save this into. Reload and try again.');
      }
      const projId  = document.getElementById('sc-project').value || '';
      const codeVal = (document.getElementById('sc-code').value || '').split('||');
      po = {
        id:           uid(),
        po_number:    nextPONumber(divKey),
        title:        document.getElementById('sc-title').value || '',
        supplier:     document.getElementById('sc-vendor').value || '',
        status:       'pending',
        date_created: document.getElementById('sc-date').value || localDateStr(),
        project_id:   projId,
        cost_code:    codeVal[0] || '',
        sub_code:     codeVal[1] || '',
        notes:        '',
        origin:       'purchasing',
        lines:        [line],
        _division:    divKey,
      };
      purchaseOrders.push(po);
      created = true;
      undo = () => { purchaseOrders = purchaseOrders.filter(p => p.id !== po.id); };
      expanded.add(po.id);
      await _savePONow(po);
    }
  } catch (err) {
    // _savePONow rethrows now, so this catches a save that never landed. It
    // used to swallow everything and fall through to "Saved … with the receipt
    // attached" for an order that was never written — and scanState is nulled
    // on close, so the photo was gone and there was no way to retry. The sheet
    // stays open with the figures intact.
    // Put the page back. Saying "nothing was saved" while leaving the order in
    // purchaseOrders AND in _unsaved was false twice over: the poll's retry
    // would write it anyway, and tapping "Try again" would append a SECOND
    // delivery for the same receipt on top of it.
    if (undo) undo();
    // Only for an order this scan RAISED. Attaching to an existing one leaves
    // it on the page — undo() has put its lines back — and it may have been in
    // the retry queue for an edit made long before the scan, which the page has
    // promised to retry. Clearing that took the queue entry and the timer with
    // it, so nothing was left to write the edit and the next poll replaced it
    // with the server's older copy.
    if (created && po) { _unsaved.delete(po.id); clearTimeout(_saveTimers[po.id]); delete _saveTimers[po.id]; }
    _committing = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Try again'; }
    toast('Could not save the order: ' + err.message + ' — nothing was saved. Try again.', 'err');
    render();
    return;
  }

  if (btn) btn.innerHTML = '<span class="spinner"></span>Attaching photo…';
  let attachError = null;
  try {
    await attachToPO(po, shotBlob, shotName, 'Scanned receipt');
  } catch (err) {
    attachError = err.message;
  }

  _committing = false;
  page = 0;

  if (attachError) {
    // The order is saved, the photo is not, and the receipt may already be back
    // in the bin. Closing here threw the only copy away and left a six-second
    // toast as the only notice — and the order then looked exactly like one
    // that never had a receipt. So keep the sheet, keep the photo, and offer
    // the half that failed again.
    render();
    _attachRetry = { poId: po.id, blob: shotBlob, filename: shotName };
    renderScanSheet(
      '<h2>Saved ' + esc(po.po_number) + ' — the photo did not attach</h2>' +
      '<div class="sub">The order is saved. Only the receipt failed to upload.</div>' +
      '<div class="scan-status err">' + esc(attachError) + '</div>' +
      '<img class="receipt-preview" alt="The receipt just photographed" src="' + esc(shotDataUrl) + '">' +
      '<div class="sheet-actions">' +
        '<button class="btn" onclick="discardAttach()">Without the photo</button>' +
        '<button class="btn btn-green" onclick="retryAttach()">Try the photo again</button>' +
      '</div>');
    return;
  }

  closeScan();
  render();
  toast('Saved ' + po.po_number + ' with the receipt attached.');
}

/**
 * Read the photo already in hand again, without re-photographing anything.
 *
 * The usual reason a read fails on a jobsite is the request, not the receipt —
 * LTE dropping, the reader busy — and re-taking the photo to get another go at
 * it is a poor trade when the receipt may already be back in the bin.
 */
async function rereadScan() {
  if (!scanState || !scanState.dataUrl) { toast('That photo is no longer here — take it again.', 'err'); return; }
  const held = scanState;
  const token = ++_scanToken;
  const live  = () => _scanToken === token;
  held.token = token;

  _scanBusy = true;
  renderScanSheet(
    '<h2>Reading the receipt</h2>' +
    '<div class="sub">Second attempt. The photo is already saved.</div>' +
    '<div class="scan-status"><span class="spinner"></span>Looking at the photo…</div>' +
    '<div class="sheet-actions"><button class="btn" onclick="cancelScan()">Cancel</button></div>');

  let receipt = null, scanError = null;
  try {
    const res = await api('POST', '/ai/receipt-scan', {
      imageBase64: held.dataUrl.split(',')[1],
      mediaType: 'image/jpeg',
      vendors: (catalog.vendors || []).map(v => v.name),
    });
    receipt = res && res.receipt ? res.receipt : null;
  } catch (err) {
    scanError = err.message;
  }
  _scanBusy = false;
  if (!live()) return;
  scanState = held;
  scanState.receipt = receipt;
  renderScanForm(receipt, scanError);
}

/** The photo a save stored the order for but could not upload. */
let _attachRetry = null;

async function retryAttach() {
  if (!_attachRetry) { closeScan(); return; }
  const po = purchaseOrders.find(p => p.id === _attachRetry.poId);
  if (!po) { _attachRetry = null; closeScan(); toast('That order is no longer on this page.', 'err'); return; }
  const btn = document.querySelector('#scan-sheet .btn-green');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Attaching…'; }
  try {
    await attachToPO(po, _attachRetry.blob, _attachRetry.filename, 'Scanned receipt');
    _attachRetry = null;
    closeScan();
    render();
    toast('Receipt attached to ' + po.po_number + '.');
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Try the photo again'; }
    const box = document.querySelector('#scan-sheet .scan-status');
    if (box) box.textContent = err.message;
    toast('Still could not attach it: ' + err.message, 'err');
  }
}

/** Keep the order, let the photo go — said out loud, not by a stray tap. */
function discardAttach() {
  _attachRetry = null;
  closeScan();
  render();
  toast('Order kept without the receipt. You can attach one later from the order.', 'err');
}

/* ═══════════════════════════════════════════
   ATTACHMENTS SHEET
═══════════════════════════════════════════ */
function closeDocs() {
  document.getElementById('docs-backdrop').classList.remove('open');
  unlockBodyScroll();
}

async function openDocs(poId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po) return;
  const sheet = document.getElementById('docs-sheet');
  sheet.innerHTML = '<h2>' + esc(po.po_number) + ' — attachments</h2>' +
    '<div class="scan-status"><span class="spinner"></span>Loading…</div>';
  document.getElementById('docs-backdrop').classList.add('open');
  lockBodyScroll();

  let docs = [];
  let loadError = null;
  try {
    const res = await api('GET', '/documents?division=' + encodeURIComponent(po._division) +
                          '&poId=' + encodeURIComponent(po.id));
    docs = (res && res.documents) || [];
    docCounts[po.id] = docs.length;
  } catch (err) {
    loadError = err.message;
  }

  const list = docs.length
    ? docs.map(d =>
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0.45rem 0;border-bottom:1px solid var(--border)">' +
          '<div style="min-width:0"><div style="font-size:0.84rem;word-break:break-all">' + esc(d.filename) + '</div>' +
          '<div style="font-size:0.7rem;color:var(--muted)">' + esc(d.uploaded_by || '') +
            (d.uploaded_at ? ' · ' + esc(new Date(d.uploaded_at).toLocaleDateString('en-US')) : '') + '</div></div>' +
          '<button class="btn" onclick="openDoc(\'' + jsAttr(po._division) + '\',\'' + jsAttr(d.id) + '\',\'' + jsAttr(po.id) + '\')">Open</button>' +
        '</div>').join('')
    : '<div style="color:var(--muted);font-size:0.82rem;padding:0.5rem 0">Nothing attached yet.</div>';

  sheet.innerHTML =
    '<h2>' + esc(po.po_number) + ' — attachments</h2>' +
    '<div class="sub">Filed under ' + esc(divLabel(po._division)) +
      (po.project_id ? ', on ' + esc((projectFor(po._division, po.project_id) || {}).name || po.project_id) : ', with no job') +
      ' — so it is on the paperclip in that division’s own tab too.</div>' +
    (loadError ? '<div class="scan-status err">' + esc(loadError) + '</div>' : list) +
    '<div class="sheet-actions">' +
      '<button class="btn" onclick="closeDocs()">Close</button>' +
      (capsFor(po._division).canEdit ? '<button class="btn btn-green" id="doc-add" onclick="addAttachment(\'' + jsAttr(po.id) + '\')">+ Add photo or file</button>' : '') +
    '</div>';
}

async function openDoc(division, docId, poId) {
  try {
    // poId is what lets a purchasing user open a receipt filed in a division it
    // holds no role in — the endpoint checks the document is linked to it.
    const res = await api('GET', '/document-download?division=' + encodeURIComponent(division) +
                          '&id=' + encodeURIComponent(docId) +
                          '&poId=' + encodeURIComponent(poId));
    if (res && res.url) window.open(res.url, '_blank', 'noopener');
    else toast('That file has no download link.', 'err');
  } catch (err) {
    toast('Could not open it: ' + err.message, 'err');
  }
}

async function addAttachment(poId) {
  const po = purchaseOrders.find(p => p.id === poId);
  if (!po) return;
  const file = await pickImage('attach-capture');
  if (!file) return;

  const btn = document.getElementById('doc-add');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Uploading…'; }
  try {
    // Images go through the downscale; a PDF is passed along untouched, since
    // rasterizing one would destroy it.
    let blob = file, filename = file.name;
    if (/^image\//.test(file.type)) {
      const shot = await downscaleImage(file, 1600);
      blob = shot.blob;
      filename = (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg';
    }
    await attachToPO(po, blob, filename);
    toast('Attached.');
    await openDocs(poId);
    render();
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = '+ Add photo or file'; }
    toast('Could not attach: ' + err.message, 'err');
  }
}

/* Close a sheet by clicking its backdrop, the way the other pages' modals do.
   The scan sheet goes through closeScan() rather than just hiding itself: a
   dismissal while the spinner is up has to CANCEL the scan, or the reply lands
   a few seconds later, re-opens the sheet over whatever the user moved on to,
   and — if they started a second scan meanwhile — renders the first receipt's
   figures against the second receipt's photo and order. */
document.getElementById('scan-backdrop').addEventListener('click', function (e) {
  if (e.target !== this) return;
  // Not while it is reading. The sheet fills the screen on a phone but the
  // backdrop is still a strip down each side, and a thumb resting there threw
  // the photo away with no message at all — after the receipt may already be
  // back in the bin. Stopping it is still possible, but it has to be deliberate.
  if (_scanBusy) {
    toast('Still reading the receipt — use Cancel to stop.');
    return;
  }
  closeScan();
});
document.getElementById('docs-backdrop').addEventListener('click', function (e) {
  if (e.target === this) closeDocs();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('scan-backdrop').classList.contains('open')) closeScan();
  if (document.getElementById('docs-backdrop').classList.contains('open')) closeDocs();
});

/* ═══════════════════════════════════════════
   POLL — pick up what the division tabs change

   An order raised here is stored in its division's OWN list, which is the same
   list that division's tab reads and writes. So the traffic goes both ways: a
   paving supervisor adding a delivery to an order, approving one, or raising
   one of their own is editing a list this page is showing.

   Their pages poll purchase orders every 60 seconds, so what happens here
   reaches them on its own. This is the other direction, on the same interval —
   without it a purchasing screen left open all morning shows the list as it
   was at login.

   Nothing here risks a lost edit. Saves go one order at a time and the server
   re-reads the stored list before merging, so a stale copy of an order nobody
   touched can never be written back over a division's work; and an order whose
   save is still queued OR has failed keeps its local copy through the merge
   below rather than being replaced by the server's older one. The poll is about
   what is on screen.
═══════════════════════════════════════════ */
(function () {
  const POLL_MS = 60_000;

  // Whatever the user is in the middle of. A <select> counts: the division and
  // job pickers are how an order gets re-tied, and swapping the list out from
  // under an open dropdown would drop the choice being made.
  const isEditing = isTyping;

  /**
   * Orders whose local copy is newer than the server's: one with a debounce
   * timer still to fire, and one whose save failed. Both have to survive the
   * merge below or the poll quietly throws the user's typing away.
   */
  function pendingIds() {
    return new Set(Object.keys(_saveTimers).concat([..._unsaved]));
  }

  async function poll() {
    if (document.visibilityState === 'hidden') return;

    // Retry anything that failed to save, BEFORE the guards below. It touches
    // no DOM, and a cursor resting in the field someone just typed into — the
    // normal state right after an edit — would otherwise hold the only retry
    // path this page has for as long as it stayed there.
    for (const id of [..._unsaved]) {
      const po = purchaseOrders.find(p => p.id === id);
      if (!po) { _unsaved.delete(id); continue; }
      try { await _savePONow(po); } catch { /* stays in _unsaved for the next tick */ }
    }

    if (_inflight > 0) return;          // a save is in the air; its result lands first
    if (isEditing()) return;

    // Read before the first GET leaves, compared after the last one lands.
    const epochAtFetch = _saveEpoch;

    let fetched;
    try {
      fetched = await Promise.all(listKeys().map(async key => {
        const data = await api('GET', '/purchase-orders?division=' + encodeURIComponent(key));
        const list = Array.isArray(data.purchaseOrders) ? data.purchaseOrders : [];
        // A response is exactly the evidence loadedLists is meant to hold, and
        // boot was the only thing writing to it. A list that 502'd at load and
        // came back on the next tick stayed marked unusable for the life of the
        // page: its orders were on screen while numbering refused it, the
        // division picker did not offer it, and "+ New PO" and the scan sheet
        // both left it out — all telling the user to reload a list they could
        // already see.
        loadedLists.add(key);
        list.forEach(po => { po._division = key; migratePO(po); });
        return list;
      }));
    } catch (err) {
      // A poll that fails changes nothing. The page keeps what it has.
      console.warn('[po] poll failed:', err.message);
      return;
    }

    const incoming = [].concat.apply([], fetched);

    // An order with a debounced save outstanding keeps its LOCAL copy — the
    // user typed it a moment ago and the server has not been told yet.
    const pending = pendingIds();
    const merged = incoming.map(po => {
      if (!pending.has(po.id)) return po;
      return purchaseOrders.find(p => p.id === po.id) || po;
    });
    // ...and one raised here but not yet stored is not dropped for being absent.
    purchaseOrders.forEach(po => {
      if (pending.has(po.id) && !merged.some(p => p.id === po.id)) merged.push(po);
    });

    // migratePO runs on both sides before this, so an unconverted blob does not
    // read as a change on every poll and re-render the table in a loop.
    if (JSON.stringify(merged) === JSON.stringify(purchaseOrders)) return;

    // Checked again: the fetch above took time, and a keystroke may have
    // landed while it was in flight.
    if (isEditing() || _inflight > 0) return;

    // ...and so may a whole save. _inflight was 0 when these GETs left and is 0
    // again now, which says nothing about a save that started and finished in
    // between: at least one of these responses was computed before it. Adopting
    // them puts a completed move back where it came from on screen and writes
    // that division into _savedDivision, so the next save sends the wrong
    // `from` — or none at all, leaving the order live in two divisions' tabs
    // with the job charged twice. A skipped tick costs 60 seconds; this costs a
    // duplicate nothing is scheduled to clear.
    if (_saveEpoch !== epochAtFetch) return;

    // Where the server has each order, recorded only now — with the list it
    // came from, and only once this poll has committed to adopting it. Writing
    // it during the fetch undid a move that completed while the fetch was in
    // flight: the note named the list the order had already left, the next save
    // sent that as `from`, and every cost row the order owned was deleted and
    // re-minted. An order this page is still saving keeps its own note, because
    // a half-landed move leaves it in BOTH lists and either fetch could finish
    // last.
    merged.forEach(po => {
      if (_unsaved.has(po.id) || _saveTimers[po.id]) return;
      _savedDivision[po.id] = po._division;
    });

    purchaseOrders = merged;
    render();
  }

  setInterval(poll, POLL_MS);
  // Coming back to a tab that has been in the background is exactly when the
  // list is most out of date, and waiting out the rest of the interval to find
  // out is the wrong behaviour.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') poll();
  });
})();

/* ═══════════════════════════════════════════
   BOOT
═══════════════════════════════════════════ */
(async function boot() {
  try {
    await loadCatalog();
  } catch (err) {
    document.getElementById('load-banner').style.display = '';
    document.getElementById('load-banner').textContent =
      'Could not load the jobs and vendors list: ' + err.message +
      ' — orders already raised are still shown below, but a new one cannot be tied to a job until this loads. Reload to try again.';
    // loadCatalog threw before it got here, and the orders below are still
    // shown — so they still need their filter. listDivs falls back to the
    // canonical divisions, which is all this dropdown needs.
    renderDivisionFilter();
  }
  try {
    await loadPurchaseOrders();
  } catch (err) {
    toast('Could not load purchase orders: ' + err.message, 'err');
  }
  render();

  // The employee datalist is built after the first paint: the delivery rows
  // reference it by id, and nothing needs it before one is opened.
  const emps = (catalog.employees || []).map(e => '<option value="' + esc(e.name) + '"></option>').join('');
  const dl = document.createElement('datalist');
  dl.id = 'employee-list';
  dl.innerHTML = emps;
  document.body.appendChild(dl);

  // Counts feed the paperclip badges, and are slow enough (one request per
  // division) that the table should not wait on them.
  // Counts feed the paperclip badges and arrive a second or two after the
  // table. Re-rendering then would destroy whatever input the user had already
  // started typing into, so it waits for them to finish — the same guard the
  // poll uses. A badge is never worth a lost keystroke.
  loadDocCounts().then(() => {
    const el = document.activeElement;
    const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
    if (typing) {
      el.addEventListener('blur', () => render(), { once: true });
      return;
    }
    render();
  });
})();
</script>
