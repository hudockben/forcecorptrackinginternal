<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2314b8a6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='17' rx='2'/><line x1='3' y1='9' x2='21' y2='9'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='16' y1='2' x2='16' y2='6'/></svg>" />
  <title>Timesheet — Submit Time</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #14141d;
      --surface2:  #1c1c28;
      --border:    #2a2a3a;
      --accent:    #14b8a6;
      --accent-d:  #0d9488;
      --text:      #e8e8ee;
      --muted:     #888;
      --red:       #ef4444;
      --yellow:    #eab308;
      --green:     #22c55e;
      --blue:      #60a5fa;
    }

    html, body { height: 100%; overscroll-behavior-y: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding-top: calc(0.9rem + env(safe-area-inset-top, 0));
    }
    .brand {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .user-chip {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .user-chip strong { color: var(--text); font-weight: 600; }
    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .icon-btn:active { color: var(--text); border-color: #555; }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Section card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .card-title {
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .card-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── Type toggle (Daily / Time Off) ── */
    .toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.35rem;
    }
    .toggle button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s, color 0.15s;
    }
    .toggle button.active {
      background: var(--accent);
      color: #003;
    }

    /* ── Form fields ── */
    .row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
    }
    /* Whether the unit typed above is one the trucking office's list knows.
       Their tab shows a unit's number beside it by matching the name, so a
       near-miss reads fine here and arrives there unrecognised — amber says so
       without refusing it, since a truck can genuinely be missing from the list. */
    .unit-hint {
      font-size: 0.68rem;
      line-height: 1.3;
      color: var(--muted);
      min-height: 0.9rem;
    }
    .unit-hint.off-list { color: #fbbf24; }
    label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 0.85rem 0.8rem;
      font-family: inherit;
      outline: none;
      min-height: 48px;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 0.6rem center;
      background-size: 18px;
      padding-right: 2rem;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }

    /* ── Yes/No segmented pill ── */
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.3rem;
    }
    .seg button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.65rem;
      border-radius: 7px;
      cursor: pointer;
      min-height: 42px;
    }
    .seg button.on   { background: var(--accent); color: #003; }
    .seg button.off  { background: var(--border); color: var(--text); }
    /* Three-way variant, for the hauling question. Same control, one more
       column — on a phone the three labels still clear the 42px touch target. */
    .seg.seg-3 { grid-template-columns: 1fr 1fr 1fr; }
    .seg.seg-3 button { padding: 0.65rem 0.25rem; font-size: 0.8rem; }

    /* ── Time-off type radio grid ── */
    .pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 0.7rem;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .pill.active {
      background: var(--accent);
      color: #003;
      border-color: var(--accent);
    }

    /* ── Computed hours display ── */
    .computed {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .computed .label {
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .computed .value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ── Split job block ──
       An extra job on the same day. Sits a shade above the form's own
       background so the block reads as one unit, while its inputs keep the
       darker field colour they have everywhere else. */
    .split-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .split-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }
    .split-block-title {
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .link-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.3rem 0.1rem;
      font-family: inherit;
    }
    .link-btn:active { color: var(--red); }
    .split-add {
      background: none;
      color: var(--accent);
      border: 1px dashed var(--border);
      border-radius: 10px;
      min-height: 48px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.01em;
    }
    .split-add:active { background: var(--surface2); }
    .split-add:disabled { opacity: 0.4; cursor: not-allowed; }
    .hint {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.45;
    }

    /* ── Action buttons ── */
    .btn-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-height: 50px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #003;
    }
    .btn-primary:active { background: var(--accent-d); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:active { background: var(--border); }
    .btn-danger {
      background: rgba(239,68,68,0.12);
      color: var(--red);
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Status badges ── */
    .badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.22rem 0.55rem;
      border-radius: 4px;
    }
    .badge-draft     { background: rgba(136,136,136,0.15); color: var(--muted); }
    .badge-submitted { background: rgba(96,165,250,0.15); color: var(--blue); }
    .badge-approved  { background: rgba(34,197,94,0.15);  color: var(--green); }
    .badge-split     { background: rgba(20,184,166,0.15); color: var(--accent); }

    /* ── Entries list ── */
    .entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .entry.draft { cursor: pointer; }
    .entry.draft:active { background: var(--surface2); }
    .entry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }
    .entry-date {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .entry-meta {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .entry-hours {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      /* A long job label used to push "4.00 h" onto two lines. Splitting a day
         puts two of these cards up at once, so it happens more, not less. */
      white-space: nowrap;
    }
    .entry-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1.5rem 1rem;
    }
    .entry-audit {
      font-size: 0.7rem;
      color: var(--muted);
      padding-top: 0.45rem;
      margin-top: 0.2rem;
      border-top: 1px dashed var(--border);
      line-height: 1.4;
    }

    /* ── Toast / inline message ── */
    .msg {
      font-size: 0.85rem;
      min-height: 1.2em;
      padding: 0.1rem 0.2rem;
    }
    .msg.error   { color: var(--red); }
    .msg.success { color: var(--green); }

    /* ── No-access screen ── */
    .no-access {
      max-width: 420px;
      margin: 4rem auto;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .no-access h2 {
      font-size: 1.3rem;
      color: var(--text);
      margin-bottom: 0.6rem;
    }
    .no-access p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .hidden { display: none !important; }

    /* ── Tablet+ ── */
    @media (min-width: 720px) {
      main { padding: 1.5rem; }
      .row-2 { gap: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Timesheet</div>
    <div class="header-right">
      <div class="user-chip" id="userChip"></div>
      <button class="icon-btn" id="switchBtn" style="display:none" onclick="goToDivisions()">Switch</button>
      <button class="icon-btn" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <main id="mainContent">

    <!-- ── Entry form ── -->
    <section class="card" id="formCard">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="card-title" id="formTitle">New Entry</div>
        <span class="badge" id="formBadge" style="display:none"></span>
      </div>

      <!-- Type toggle -->
      <div class="toggle" role="tablist" aria-label="Entry type">
        <button id="tab-daily"    class="active" onclick="setType('daily')">Daily</button>
        <button id="tab-time-off"            onclick="setType('time_off')">Time Off</button>
      </div>

      <!-- Daily fields -->
      <div id="dailyFields" style="display:flex;flex-direction:column;gap:0.85rem">
        <div class="row">
          <label for="f-date">Date</label>
          <input type="date" id="f-date" />
        </div>

        <div class="row-2">
          <div class="row">
            <label for="f-division">Division</label>
            <select id="f-division" onchange="onDivisionChange()">
              <option value="">— pick —</option>
              <option value="turf">Turf</option>
              <option value="dust">Dust Control</option>
              <option value="paving">Paving</option>
              <option value="kiewit">Kiewit Pinetree</option>
              <option value="trucking">Trucking</option>
              <option value="quarry">Quarry</option>
            </select>
          </div>
          <div class="row">
            <label for="f-job">Job</label>
            <select id="f-job" disabled onchange="onJobChange()">
              <option value="">— pick division first —</option>
            </select>
          </div>
        </div>

        <!-- Unit + Description for a haul. Shown when Division = Trucking, and
             when Division = Dust Control on a customer job (not the EES
             activities, which have their own fields below) — those are exactly
             the entries whose approval injects a Truck Tracking row, and these
             two map to its matching columns. -->
        <div id="truckingFields" style="display:none;flex-direction:column;gap:0.85rem">
          <div class="row">
            <label for="f-truck-unit">Unit</label>
            <input type="text" id="f-truck-unit" list="truckUnitOptions" autocomplete="off" maxlength="100" placeholder="Truck / unit #" />
            <div class="unit-hint" id="f-truck-unit-hint"></div>
          </div>
          <div class="row">
            <label for="f-truck-desc">Description</label>
            <textarea id="f-truck-desc" maxlength="2000" placeholder="What was hauled, route, etc."></textarea>
          </div>
        </div>
        <!-- The trucking office's own unit list, shared by every job block on
             the page — each Unit input points here by id, and blocks come and
             go while this does not. Filled the first time a haul is picked;
             see truckUnitRosterLoad. Empty until then, which just leaves the
             input the plain text box it has always been. -->
        <datalist id="truckUnitOptions"></datalist>

        <!-- EES-only fields. Shown only when Division = Dust Control AND the job
             is EES - Pre Loading or EES - Washing. These map straight across to
             the matching columns of the Dust division's "EES Other" tab when the
             entry is approved, so what's typed here is what shows up there. -->
        <div id="eesFields" style="display:none;flex-direction:column;gap:0.85rem">
          <div class="row-2">
            <div class="row">
              <label for="f-ees-unit">Unit</label>
              <input type="text" id="f-ees-unit" maxlength="100" placeholder="Truck / unit #" />
            </div>
            <div class="row">
              <label for="f-ees-customer">Customer</label>
              <input type="text" id="f-ees-customer" maxlength="500" placeholder="Customer" />
            </div>
          </div>
          <div class="row-2">
            <div class="row">
              <label for="f-ees-location">Location</label>
              <input type="text" id="f-ees-location" maxlength="500" placeholder="Location" />
            </div>
            <div class="row">
              <label for="f-ees-name">Name</label>
              <input type="text" id="f-ees-name" maxlength="500" placeholder="Name" />
            </div>
          </div>
          <div class="row-2">
            <div class="row">
              <label for="f-ees-job-number">Job Number</label>
              <input type="text" id="f-ees-job-number" maxlength="100" placeholder="Job #" />
            </div>
            <div class="row">
              <label for="f-ees-billing">Billing</label>
              <select id="f-ees-billing">
                <option value="Non-Billable">Non-Billable</option>
                <option value="Billable">Billable</option>
              </select>
            </div>
          </div>
        </div>

        <div class="row-2" id="row-travel-pair">
          <div class="row">
            <label for="f-travel-to-site" id="lbl-travel-to-site">Travel Time to Site (hours)</label>
            <input type="number" inputmode="decimal" min="0" max="24" step="0.25" placeholder="0"
                   id="f-travel-to-site" oninput="updateTravelHours()" onchange="updateTravelHours()" />
          </div>
          <div class="row" id="row-travel-to-shop">
            <label for="f-travel-to-shop" id="lbl-travel-to-shop">Travel Time to Shop (hours)</label>
            <input type="number" inputmode="decimal" min="0" max="24" step="0.25" placeholder="0"
                   id="f-travel-to-shop" oninput="updateTravelHours()" onchange="updateTravelHours()" />
          </div>
        </div>

        <div class="computed" id="travelTotalRow">
          <span class="label" id="lbl-travel-total">Travel hours</span>
          <span class="value" id="f-travel-hours">0.00</span>
        </div>

        <div class="row-2">
          <div class="row">
            <label for="f-start">Site Start Time</label>
            <input type="time" id="f-start" onchange="updateHours()" oninput="updateHours()" />
          </div>
          <div class="row">
            <label for="f-end">Site End Time</label>
            <input type="time" id="f-end" onchange="updateHours()" oninput="updateHours()" />
          </div>
        </div>

        <div class="computed">
          <span class="label">Hours</span>
          <span class="value" id="f-hours">0.00</span>
        </div>

        <div class="row">
          <label>Lunch break?</label>
          <div class="seg" id="seg-lunch">
            <button type="button" data-val="true"  onclick="setSeg('lunch', true)">Yes</button>
            <button type="button" data-val="false" onclick="setSeg('lunch', false)">No</button>
          </div>
        </div>

        <div class="row">
          <label>Operated equipment?</label>
          <div class="seg" id="seg-equip">
            <button type="button" data-val="true"  onclick="setSeg('equip', true)">Yes</button>
            <button type="button" data-val="false" onclick="setSeg('equip', false)">No</button>
          </div>
        </div>

        <!-- ── The hauling question ──
             Shown only to a user flagged as a driver in Manage Users
             (employees.is_driver, delivered by /api/timesheet-supervisors).
             Everyone else never sees it and posts haul_type null, exactly as
             before this existed.

             Asked per JOB BLOCK, which is already once per leg: a driver who
             runs to the site and then hauls inside the fence splits the day the
             way anyone else would, and answers this once for each half. That is
             what lets one man on one day be part standard and part prevailing.

             The three answers are not cosmetic — they drive different things:
               No         → ordinary work. Priced and classified as always.
               On site    → the truck rate covers the labour, but the man IS on
                            the site, so on a prevailing job it stays prevailing.
               To & from  → the truck rate covers the labour AND he never worked
                            the site, so the hours are standard rate even on a
                            prevailing job. -->
        <div class="row" id="row-haul" style="display:none">
          <label>Was this a haul?</label>
          <div class="seg seg-3" id="seg-haul">
            <button type="button" data-val=""         onclick="setHaul('', 0)">No</button>
            <button type="button" data-val="on_site"  onclick="setHaul('on_site', 0)">On site</button>
            <button type="button" data-val="off_site" onclick="setHaul('off_site', 0)">To &amp; from</button>
          </div>
        </div>

        <!-- ── Which truck ──
             Asked only once the answer above says it WAS a haul, and only on the
             divisions whose cost tracking has an equipment column to put it in.
             A driver may be on a lowboy one day and a triaxle the next, so this
             is a fact about the day, not about the man — which is why it is
             asked here rather than defaulted from a roster.
             The options are the company's own equipment list, the same
             vocabulary the cost row uses ("Triaxle Dump", "Lowboy"), so what he
             picks lands on the row unchanged. -->
        <div class="row" id="row-haul-unit" style="display:none">
          <label for="haul-unit">Which truck?</label>
          <select id="haul-unit" onchange="setHaulUnit(this.value, 0)">
            <option value="">— pick —</option>
          </select>
        </div>

        <!-- ── Split the day across more than one job ──
             One day on two jobs used to mean filling this form twice. Each
             block added here is another job on the SAME day: its own division,
             job, clock and equipment answer, everything above it (date, travel,
             lunch, supervisor, notes) shared. On save each block is written as
             its own timesheet entry, so payroll reviews and approves them
             exactly as if they had been submitted separately.
             Blocks are built by splitBlockHtml() — keep the fields there in
             step with the per-job fields above. -->
        <div id="splitBlocks" style="display:flex;flex-direction:column;gap:0.85rem"></div>

        <!-- Where the drive home goes once the day has more than one job: after
             the last of them, which is where it happens. renderSplitChrome
             moves the real field in and out of here — it is moved, not copied,
             so there is only ever one drive home to fill in. -->
        <div id="travelHomeSlot"></div>

        <div class="computed" id="dayTotalRow" style="display:none">
          <span class="label">All jobs — site hours</span>
          <span class="value" id="f-day-hours">0.00</span>
        </div>

        <button type="button" class="split-add" id="btn-add-split" onclick="addSplit()">
          + Split time to another job
        </button>
        <div class="hint" id="splitHint" style="display:none"></div>

        <div class="row">
          <label for="f-supervisor">Supervisor</label>
          <select id="f-supervisor">
            <option value="">— pick —</option>
          </select>
        </div>

        <div class="row">
          <label for="f-notes">Notes <span style="text-transform:none;font-weight:400">(optional)</span></label>
          <textarea id="f-notes" placeholder="Anything the office should know"></textarea>
        </div>
      </div>

      <!-- Time off fields -->
      <div id="timeOffFields" style="display:none;flex-direction:column;gap:0.85rem">
        <div class="row">
          <label>Type</label>
          <div class="pills" id="off-pills">
            <div class="pill" data-val="vacation"   onclick="setOffType('vacation')">Vacation</div>
            <div class="pill" data-val="sick"       onclick="setOffType('sick')">Sick</div>
            <div class="pill" data-val="jury_duty"  onclick="setOffType('jury_duty')">Jury Duty</div>
            <div class="pill" data-val="bereavement"onclick="setOffType('bereavement')">Bereavement</div>
            <div class="pill" data-val="holiday"    onclick="setOffType('holiday')">Holiday</div>
          </div>
        </div>
        <div class="row">
          <label for="f-off-date">Date</label>
          <input type="date" id="f-off-date" />
        </div>
        <div class="row">
          <label for="f-off-supervisor">Supervisor</label>
          <select id="f-off-supervisor">
            <option value="">— pick —</option>
          </select>
        </div>
        <div class="row">
          <label for="f-off-notes">Notes <span style="text-transform:none;font-weight:400">(optional)</span></label>
          <textarea id="f-off-notes" placeholder="Anything the office should know"></textarea>
        </div>
      </div>

      <div class="msg" id="formMsg"></div>

      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-reset" onclick="resetFormAction()">Reset</button>
        <button class="btn btn-secondary" id="btn-save"  onclick="saveDraft()">Save Draft</button>
        <button class="btn btn-primary"   id="btn-submit"onclick="submitEntry()">Submit</button>
      </div>
      <div class="btn-row" id="row-delete" style="display:none">
        <button class="btn btn-danger" id="btn-delete-draft" onclick="deleteDraft()">Delete Draft</button>
      </div>
    </section>

    <!-- ── Past entries ── -->
    <section class="card">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:0.6rem;flex-wrap:wrap">
        <div class="card-title">My Recent Entries</div>
        <div id="entriesScope" class="card-sub" style="font-size:0.72rem"></div>
      </div>
      <div id="entriesList"><div class="entry-empty">Loading…</div></div>
      <div style="text-align:center">
        <button id="toggleScopeBtn" class="btn btn-secondary"
          style="display:none;font-size:0.78rem;padding:0.55rem 1.2rem;flex:0 0 auto"
          onclick="toggleScope()">Show older entries</button>
      </div>
    </section>

  </main>

  <!-- ── No-access fallback ── -->
  <div id="noAccess" class="no-access hidden">
    <h2>No Timesheet Access</h2>
    <p>Your account doesn't have permission to submit time entries. Ask a company admin to grant you Timesheet access.</p>
    <button class="btn btn-secondary" style="max-width:240px;margin:0 auto" onclick="goToDivisions()">Back to Divisions</button>
  </div>

  <script>
    // ── Auth + access guard ────────────────────────────────────────────────
    const token = localStorage.getItem('fct_token');
    const user  = (() => { try { return JSON.parse(localStorage.getItem('fct_user')); } catch { return null; } })();
    if (!token || !user) window.location.replace('index.html');

    const isPlatformAdmin = Boolean(user && user.isPlatformAdmin);
    const allowedDivisions = Array.isArray(user && user.allowedDivisions) ? user.allowedDivisions : [];
    const hasTimesheet = isPlatformAdmin || allowedDivisions.includes('timesheet');
    const otherDivisions = allowedDivisions.filter(d => d !== 'timesheet');

    if (!hasTimesheet) {
      document.getElementById('mainContent').classList.add('hidden');
      document.getElementById('noAccess').classList.remove('hidden');
    } else {
      // Show "Switch" only when this user has more than just timesheet
      if (isPlatformAdmin || otherDivisions.length > 0) {
        document.getElementById('switchBtn').style.display = '';
      }
      document.getElementById('userChip').innerHTML =
        `<strong>${escapeHtml(user.username)}</strong>`;
      // Defer to a microtask so the `let` declarations further down in
      // this script (scopeUnbounded, supervisors, etc.) finish their TDZ
      // before init() / loadEntries() read them.
      queueMicrotask(init);
      queueMicrotask(verifySession);
    }

    // ── Session validity ───────────────────────────────────────────────────
    // The guard above only proves a token STRING is in localStorage, not that
    // it still works. Tokens last 30 days; the user object beside it never
    // expires. A phone that opens this page straight from a home-screen
    // shortcut skips divisions.html — the only page that was checking — so an
    // expired token there produced a page that looked signed in ("brewerzach"
    // in the header, form fully drawn) while every call behind it 401'd. The
    // visible symptom was an empty job picker on the phone and a working one
    // on any freshly signed-in laptop, for the same account.
    //
    // Same shape as the check in divisions.html: fire-and-forget, and only a
    // definitive 401 signs anyone out. A network failure leaves the cached
    // session alone — crews work out of range and must still reach the form.
    function sessionExpired() {
      localStorage.removeItem('fct_token');
      localStorage.removeItem('fct_user');
      localStorage.removeItem('fct_division');
      window.location.replace('index.html?expired=1');
    }

    async function verifySession() {
      let res;
      try {
        res = await fetch('/api/auth/verify', { headers: authHeaders() });
      } catch (err) {
        console.error('[timesheet] session check unreachable, keeping cached session:', err);
        return;
      }
      if (res.status === 401) { sessionExpired(); return; }
      if (!res.ok) return;

      // Roles are read fresh from the DB here, so a grant made after this
      // device's last sign-in lands without a sign-out cycle — the other half
      // of "works on my laptop, not on his phone".
      let data = null;
      try { data = await res.json(); } catch { return; }
      if (!data || !data.ok || !data.user) return;

      const fresh = Array.isArray(data.user.allowedDivisions) ? data.user.allowedDivisions : [];
      const merged = Object.assign({}, user, data.user);
      try { localStorage.setItem('fct_user', JSON.stringify(merged)); } catch { /* quota */ }

      // Access revoked while the page sat open on a phone in a truck: stop
      // showing a form whose every save is going to 403.
      if (!data.user.isPlatformAdmin && !fresh.includes('timesheet')) {
        document.getElementById('mainContent').classList.add('hidden');
        document.getElementById('noAccess').classList.remove('hidden');
      }
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ── State ──────────────────────────────────────────────────────────────
    let currentType   = 'daily';
    let lunchVal      = null;
    let offType       = null;
    let supervisors   = [];
    let jobsCache     = {};       // { division: [{id, label}] }
    let entriesCache  = [];

    // ── Job blocks ─────────────────────────────────────────────────────────
    // A day can cover more than one job. Block 0 is the form's original markup
    // and keeps its historical field ids; every extra job is a block rendered
    // by splitBlockHtml() with the same fields under an "s<N>-" id prefix.
    //
    // Everything here is keyed by block INDEX, never by screen position, so
    // removing a middle block can't slide one block's saved draft id onto
    // another block's fields — which would have a worker's second job quietly
    // overwrite their first.
    const MAX_JOB_BLOCKS = 6;
    let splitIdxs      = [];        // extra block indices, in display order
    let nextSplitIdx   = 0;         // monotonic: a removed block's ids never come back
    let equipVals      = { 0: null }; // block index → true / false / null
    // block index → '' | 'on_site' | 'off_site'. '' means "not a haul", which is
    // both the default and what a non-driver always posts. Only ever read when
    // isDriver is true; see applyHaulVisibility.
    let haulVals       = { 0: '' };
    // block index → the equipment name the driver picked for that haul. Only
    // ever read when the block is a haul on a division whose cost tracking has
    // an equipment column; see HAUL_UNIT_DIVISIONS.
    let haulUnits      = { 0: '' };
    // The divisions whose approval posts a cost-tracking row with an equipment
    // column — the only ones where naming the truck has anywhere to land.
    // Mirrors AUTO_INJECT_DIVISIONS in api/timesheet-entries.js.
    const HAUL_UNIT_DIVISIONS = ['turf', 'paving', 'kiewit'];

    // The company's equipment list, fetched once and shared by every block.
    // Same list the payroll split modal offers, so what the driver picks is a
    // name the cost row already understands rather than something that has to
    // be translated.
    let equipmentNames        = null;
    let equipmentNamesPromise = null;
    function equipmentNamesLoad() {
      if (equipmentNames) return Promise.resolve(equipmentNames);
      if (!equipmentNamesPromise) {
        equipmentNamesPromise = fetch('/api/equipment', { headers: authHeaders() })
          .then(r => (r.ok ? r.json() : null))
          .then(j => {
            equipmentNames = (j && Array.isArray(j.equipment) ? j.equipment : [])
              .map(e => (e && e.name) || '')
              .filter(Boolean)
              .sort((a, b) => a.localeCompare(b));
            return equipmentNames;
          })
          .catch(() => { equipmentNamesPromise = null; return null; });
      }
      return equipmentNamesPromise;
    }

    // Fill one block's picker, keeping whatever is already selected — including
    // a name no longer on the list, so re-opening an old entry cannot silently
    // drop the truck it was saved with.
    function haulUnitFill(i) {
      const sel = bel(i, 'haul-unit');
      if (!sel) return;
      const cur  = haulUnits[i] || '';
      const opts = (equipmentNames || []).slice();
      if (cur && !opts.includes(cur)) opts.push(cur);
      sel.innerHTML = '<option value="">— pick —</option>' +
        opts.map(n => `<option value="${escapeHtml(n)}"${n === cur ? ' selected' : ''}>${escapeHtml(n)}</option>`).join('');
      sel.value = cur;
    }

    function setHaulUnit(val, i = 0) { haulUnits[i] = val || ''; }

    // Set from /api/timesheet-supervisors on load. Decides whether the hauling
    // question is asked at all — nothing else in this page branches on it.
    //   true  → ask, and post the answer
    //   false → don't ask, and post '' so any stale answer is cleared
    //   null  → we could not find out. Don't ask, and post NOTHING: the server
    //           reads an absent haul_type as "leave what is stored", so a
    //           failed roster load cannot quietly strip a driver's answer off
    //           an entry he is only editing the hours of.
    let isDriver       = null;
    let editingIds     = {};        // block index → id of the draft row it last wrote
    let loadedTags     = {};        // block index → the split tag it was loaded with
    let currentGroupId = null;      // split_group_id every block on this form writes

    // Every job block in top-to-bottom order. Block 0 is always first.
    function blockOrder() { return [0, ...splitIdxs]; }

    const BLOCK_NAMES = ['First job', 'Second job', 'Third job', 'Fourth job', 'Fifth job', 'Sixth job'];
    function blockName(i) {
      const pos = blockOrder().indexOf(i);
      return BLOCK_NAMES[pos] || `Job ${pos + 1}`;
    }

    // Field ids per block. Block 0 answers with the ids that were already in
    // the markup; the rest are the same keys under an "s<N>-" prefix.
    const BLOCK0_IDS = {
      'division':       'f-division',
      'job':            'f-job',
      'truckingFields': 'truckingFields',
      'truck-unit':     'f-truck-unit',
      'truck-desc':     'f-truck-desc',
      'eesFields':      'eesFields',
      'ees-unit':       'f-ees-unit',
      'ees-customer':   'f-ees-customer',
      'ees-location':   'f-ees-location',
      'ees-name':       'f-ees-name',
      'ees-job-number': 'f-ees-job-number',
      'ees-billing':    'f-ees-billing',
      'travel-in':      'f-travel-to-site',
      'start':          'f-start',
      'end':            'f-end',
      'hours':          'f-hours',
      'seg-equip':      'seg-equip',
      'seg-haul':       'seg-haul',
      'row-haul':       'row-haul',
      'row-haul-unit':  'row-haul-unit',
      'haul-unit':      'haul-unit',
    };
    function bid(i, key) { return i === 0 ? BLOCK0_IDS[key] : `s${i}-${key}`; }
    function bel(i, key) { return document.getElementById(bid(i, key)); }

    // The division list is read off the form's own picker so the two can never
    // list different divisions.
    const DIVISION_OPTIONS_HTML = document.getElementById('f-division').innerHTML;

    // Markup for one extra job block. Mirrors the per-job fields of block 0
    // above — division, job, the trucking and EES extras, the site clock and
    // the equipment question. Day-level fields (date, travel, lunch,
    // supervisor, notes) are deliberately absent: they are shared, and asking
    // for them again per job is how a day ends up with two lunches.
    function splitBlockHtml(i) {
      return `
        <div class="split-block" id="s${i}-block">
          <div class="split-block-head">
            <div class="split-block-title" id="s${i}-title"></div>
            <button type="button" class="link-btn" onclick="removeSplit(${i})">Remove</button>
          </div>

          <div class="row-2">
            <div class="row">
              <label for="s${i}-division">Division</label>
              <select id="s${i}-division" onchange="onDivisionChange(${i})">${DIVISION_OPTIONS_HTML}</select>
            </div>
            <div class="row">
              <label for="s${i}-job">Job</label>
              <select id="s${i}-job" disabled onchange="onJobChange(${i})">
                <option value="">— pick division first —</option>
              </select>
            </div>
          </div>

          <div id="s${i}-truckingFields" style="display:none;flex-direction:column;gap:0.85rem">
            <div class="row">
              <label for="s${i}-truck-unit">Unit</label>
              <input type="text" id="s${i}-truck-unit" list="truckUnitOptions" autocomplete="off" maxlength="100" placeholder="Truck / unit #" />
              <div class="unit-hint" id="s${i}-truck-unit-hint"></div>
            </div>
            <div class="row">
              <label for="s${i}-truck-desc">Description</label>
              <textarea id="s${i}-truck-desc" maxlength="2000" placeholder="What was hauled, route, etc."></textarea>
            </div>
          </div>

          <div id="s${i}-eesFields" style="display:none;flex-direction:column;gap:0.85rem">
            <div class="row-2">
              <div class="row">
                <label for="s${i}-ees-unit">Unit</label>
                <input type="text" id="s${i}-ees-unit" maxlength="100" placeholder="Truck / unit #" />
              </div>
              <div class="row">
                <label for="s${i}-ees-customer">Customer</label>
                <input type="text" id="s${i}-ees-customer" maxlength="500" placeholder="Customer" />
              </div>
            </div>
            <div class="row-2">
              <div class="row">
                <label for="s${i}-ees-location">Location</label>
                <input type="text" id="s${i}-ees-location" maxlength="500" placeholder="Location" />
              </div>
              <div class="row">
                <label for="s${i}-ees-name">Name</label>
                <input type="text" id="s${i}-ees-name" maxlength="500" placeholder="Name" />
              </div>
            </div>
            <div class="row-2">
              <div class="row">
                <label for="s${i}-ees-job-number">Job Number</label>
                <input type="text" id="s${i}-ees-job-number" maxlength="100" placeholder="Job #" />
              </div>
              <div class="row">
                <label for="s${i}-ees-billing">Billing</label>
                <select id="s${i}-ees-billing">
                  <option value="Non-Billable">Non-Billable</option>
                  <option value="Billable">Billable</option>
                </select>
              </div>
            </div>
          </div>

          <div class="row">
            <label for="s${i}-travel-in">Travel Time to This Job (hours)</label>
            <input type="number" inputmode="decimal" min="0" max="24" step="0.25" placeholder="0"
                   id="s${i}-travel-in" oninput="updateTravelHours()" onchange="updateTravelHours()" />
          </div>

          <div class="row-2">
            <div class="row">
              <label for="s${i}-start">Site Start Time</label>
              <input type="time" id="s${i}-start" onchange="updateHours(${i})" oninput="updateHours(${i})" />
            </div>
            <div class="row">
              <label for="s${i}-end">Site End Time</label>
              <input type="time" id="s${i}-end" onchange="updateHours(${i})" oninput="updateHours(${i})" />
            </div>
          </div>

          <div class="computed">
            <span class="label">Hours</span>
            <span class="value" id="s${i}-hours">0.00</span>
          </div>

          <div class="row">
            <label>Operated equipment?</label>
            <div class="seg" id="s${i}-seg-equip">
              <button type="button" data-val="true"  onclick="setSeg('equip', true, ${i})">Yes</button>
              <button type="button" data-val="false" onclick="setSeg('equip', false, ${i})">No</button>
            </div>
          </div>

          <div class="row" id="s${i}-row-haul" style="display:none">
            <label>Was this a haul?</label>
            <div class="seg seg-3" id="s${i}-seg-haul">
              <button type="button" data-val=""         onclick="setHaul('', ${i})">No</button>
              <button type="button" data-val="on_site"  onclick="setHaul('on_site', ${i})">On site</button>
              <button type="button" data-val="off_site" onclick="setHaul('off_site', ${i})">To &amp; from</button>
            </div>
          </div>

          <div class="row" id="s${i}-row-haul-unit" style="display:none">
            <label for="s${i}-haul-unit">Which truck?</label>
            <select id="s${i}-haul-unit" onchange="setHaulUnit(this.value, ${i})">
              <option value="">— pick —</option>
            </select>
          </div>
        </div>`;
    }

    // Add another job to this day. Returns the new block's index, or null when
    // the form is already at the cap.
    //
    // `inherit` carries the previous block's end time and division into the new
    // one — a split is usually two jobs back to back, often in the same
    // division, so that is two fewer taps in the mud. It is off when a saved
    // draft is being loaded back in: the block is about to be filled from the
    // stored row anyway, and inheriting would fire a second, un-awaited job
    // load that can land after the real one and blank the selected job.
    function addJobBlock(inherit) {
      const msg = document.getElementById('formMsg');
      msg.className = 'msg';
      if (currentType !== 'daily') return null;
      if (blockOrder().length >= MAX_JOB_BLOCKS) {
        msg.textContent = `A day can be split across at most ${MAX_JOB_BLOCKS} jobs.`;
        msg.classList.add('error');
        return null;
      }
      const prev = blockOrder()[blockOrder().length - 1];
      const i = ++nextSplitIdx;
      splitIdxs.push(i);
      equipVals[i] = null;
      haulVals[i]  = '';
      haulUnits[i] = '';
      document.getElementById('splitBlocks').insertAdjacentHTML('beforeend', splitBlockHtml(i));
      // A block added after load starts hidden in its own markup; reveal it now
      // if this user is a driver, and default it to "No" so the answer is never
      // blank on a block the driver skipped past.
      applyHaulVisibility(i);

      if (inherit) {
        const prevEnd = bel(prev, 'end').value;
        if (prevEnd) bel(i, 'start').value = prevEnd;
        const prevDiv = bel(prev, 'division').value;
        if (prevDiv) { bel(i, 'division').value = prevDiv; onDivisionChange(i); }
      }

      renderSplitChrome();
      updateHours(i);
      return i;
    }

    function addSplit() {
      const i = addJobBlock(true);
      if (i != null) document.getElementById(`s${i}-block`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Drop a job block. If it had already been written out as a draft row,
    // that row goes with it — leaving it behind would put hours on a job the
    // worker just took off their day.
    async function removeSplit(i) {
      // Not while the form is mid-write: the payload list being written was
      // built before this click, so the block would be deleted here and
      // re-created a moment later by a write already on its way.
      if (blockedByWrite('remove that job')) return;
      const savedId = editingIds[i];
      if (savedId && !confirm('Remove this job? The draft entry saved for it will be deleted.')) return;

      splitIdxs = splitIdxs.filter(x => x !== i);
      delete equipVals[i];
      delete haulVals[i];
      delete haulUnits[i];
      delete editingIds[i];
      delete loadedTags[i];
      const el = document.getElementById(`s${i}-block`);
      if (el) el.remove();
      renderSplitChrome();

      if (savedId) {
        const msg = document.getElementById('formMsg');
        msg.className = 'msg';
        try {
          const res = await fetch('/api/timesheet-entries?id=' + encodeURIComponent(savedId), {
            method: 'DELETE', headers: authHeaders(),
          });
          const j = await res.json();
          if (!res.ok || !j.ok) throw new Error(j.error || 'Delete failed');
          // The stored group just lost a member, so the tags this form was
          // loaded with no longer describe the day. Drop them and let the next
          // save re-tag from what is actually on screen — otherwise deleting
          // the second job of a saved pair leaves the first still badged
          // "Split 1/2", pointing payroll at a job that no longer exists.
          // splitTagFor falls back to these only for a lone block, so a group
          // that still has two or more jobs just re-numbers itself.
          loadedTags = {};
          await loadEntries();
        } catch (err) {
          msg.textContent = `Removed from the form, but its saved draft could not be deleted (${err.message}). Delete it from the list below.`;
          msg.classList.add('error');
        }
      }
    }

    // Titles, the day total, the add button and the explainer — everything that
    // depends on how many blocks are on screen right now.
    function renderSplitChrome() {
      const order = blockOrder();
      const split = order.length > 1;
      for (const i of splitIdxs) {
        const t = document.getElementById(`s${i}-title`);
        if (t) t.textContent = blockName(i);
      }
      const addBtn = document.getElementById('btn-add-split');
      addBtn.disabled = order.length >= MAX_JOB_BLOCKS;
      addBtn.textContent = split ? '+ Add another job' : '+ Split time to another job';

      // The drive out is the first job's; each later job carries the drive
      // from the one before it; the drive home is the last job's. Rewording
      // the first field says so — otherwise "to Site" reads as though it were
      // the only drive on a day that had three.
      document.getElementById('lbl-travel-to-site').textContent =
        split ? 'Travel Time to First Job (hours)' : 'Travel Time to Site (hours)';

      // And move the drive home to where it happens. Sitting up here beside
      // the drive out, it reads as part of the FIRST job — so the last job
      // block appears to ask how the worker got there and never how they
      // left. Moved below the blocks it lands after the job it belongs to,
      // and the form runs in the order the day did. The node is moved, so
      // there is still only one of it and anything typed in survives the trip.
      const homeRow  = document.getElementById('row-travel-to-shop');
      const homeSlot = document.getElementById('travelHomeSlot');
      const pair     = document.getElementById('row-travel-pair');
      const wantHome = split ? homeSlot : pair;
      if (homeRow.parentElement !== wantHome) wantHome.appendChild(homeRow);
      // The running travel total goes with it. Left up top it sits directly
      // under a box reading 0.5 while announcing 1.50 — the two later legs
      // are not on screen yet, so the number looks wrong. Beside the day's
      // site hours, under the last leg, it reads as the day total it is.
      const travelTotal = document.getElementById('travelTotalRow');
      if (split) {
        if (travelTotal.parentElement !== homeSlot) homeSlot.appendChild(travelTotal);
      } else if (travelTotal.parentElement === homeSlot) {
        pair.insertAdjacentElement('afterend', travelTotal);
      }
      document.getElementById('lbl-travel-total').textContent =
        split ? 'All jobs — travel hours' : 'Travel hours';
      // With the drive home gone, the pair would leave a hole in its grid.
      pair.style.gridTemplateColumns = split ? '1fr' : '';
      // The drive to the shop needs no rewording — it can only be from the
      // last job — and a longer label here wraps past its neighbour and drags
      // the two inputs out of line.

      const hint = document.getElementById('splitHint');
      hint.style.display = split ? '' : 'none';
      hint.textContent = split
        ? `Each job is submitted as its own entry (${order.length} in total), so payroll sees them separately. `
          + 'Date, lunch, supervisor and notes cover the whole day, and any lunch deduction comes off the first '
          + 'job. Travel is per leg: the drive out, the drive to each later job, and the drive home.'
        : '';

      document.getElementById('dayTotalRow').style.display = split ? '' : 'none';
      updateDayTotal();
    }

    function updateDayTotal() {
      const total = blockOrder().reduce((s, i) => s + Number(bel(i, 'hours').textContent || 0), 0);
      document.getElementById('f-day-hours').textContent = total.toFixed(2);
    }

    // Tear every extra block off the form and forget its state. Used by
    // resetForm and before loading a draft, so the form never keeps a block
    // from the last thing it was showing.
    function clearSplits() {
      for (const i of splitIdxs) {
        const el = document.getElementById(`s${i}-block`);
        if (el) el.remove();
      }
      splitIdxs = [];
      equipVals = { 0: equipVals[0] };
      haulVals  = { 0: haulVals[0] };
      haulUnits = { 0: haulUnits[0] };
    }

    async function init() {
      const today = todayStr();
      document.getElementById('f-date').value     = today;
      document.getElementById('f-off-date').value = today;

      await Promise.all([loadSupervisors(), loadEntries()]);
    }

    function todayStr() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm   = String(d.getMonth() + 1).padStart(2, '0');
      const dd   = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // ── Type toggle ────────────────────────────────────────────────────────
    function setType(t) {
      currentType = t;
      document.getElementById('tab-daily').classList.toggle('active',    t === 'daily');
      document.getElementById('tab-time-off').classList.toggle('active', t === 'time_off');
      document.getElementById('dailyFields').style.display   = t === 'daily'    ? 'flex' : 'none';
      document.getElementById('timeOffFields').style.display = t === 'time_off' ? 'flex' : 'none';
    }

    // Lunch is a property of the day, so it ignores `i`; equipment is answered
    // per job block.
    function setSeg(which, val, i = 0) {
      const seg = which === 'lunch' ? document.getElementById('seg-lunch') : bel(i, 'seg-equip');
      if (!seg) return;
      seg.querySelectorAll('button').forEach(b => {
        const v = b.dataset.val === 'true';
        b.classList.toggle('on',  v === val);
        b.classList.toggle('off', v !== val);
      });
      if (which === 'lunch') { lunchVal = val; updateHours(0); }
      else                     equipVals[i] = val;
    }

    function clearSeg(which, i = 0) {
      const seg = which === 'lunch' ? document.getElementById('seg-lunch') : bel(i, 'seg-equip');
      if (!seg) return;
      seg.querySelectorAll('button').forEach(b => b.classList.remove('on', 'off'));
      if (which === 'lunch') { lunchVal = null; updateHours(0); }
      else                     equipVals[i] = null;
    }

    // ── The hauling question ────────────────────────────────────────────────
    // Three-way rather than a boolean, because "was this a haul?" and "were you
    // on the site?" are two different questions and a driver's day turns on
    // both. Kept out of setSeg deliberately: that one is boolean to its bones
    // (data-val === 'true'), and widening it would put a third state into the
    // lunch and equipment answers, which have no use for one.
    function setHaul(val, i = 0) {
      const seg = bel(i, 'seg-haul');
      if (!seg) return;
      seg.querySelectorAll('button').forEach(b => {
        const on = (b.dataset.val || '') === (val || '');
        b.classList.toggle('on',  on);
        b.classList.toggle('off', !on);
      });
      haulVals[i] = val || '';
      applyHaulUnitVisibility(i);
    }

    // The truck picker follows the ANSWER, not the flag: it appears the moment a
    // block is called a haul and goes away again if that is taken back. Limited
    // to the divisions whose cost row has an equipment column — naming a truck
    // on a quarry day would ask for something with nowhere to go.
    function applyHaulUnitVisibility(i) {
      const idxs = (i == null) ? blockOrder() : [i];
      for (const b of idxs) {
        const row = bel(b, 'row-haul-unit');
        if (!row) continue;
        const div    = (bel(b, 'division') || {}).value || '';
        const isHaul = isDriver && !!haulVals[b] && HAUL_UNIT_DIVISIONS.includes(div);
        row.style.display = isHaul ? 'flex' : 'none';
        if (!isHaul) continue;
        // Fetch once, then fill. Until it lands the picker holds just the
        // saved value, so an entry being edited never shows a blank truck.
        haulUnitFill(b);
        equipmentNamesLoad().then(() => haulUnitFill(b));
      }
    }

    // Show or hide the question for one block, or for every block when `i` is
    // omitted. A driver's block defaults to "No" rather than blank: the common
    // answer should cost no taps, and an unanswered three-way on a form the
    // driver never scrolled to would be a new way to block a submit.
    //
    // PURELY PRESENTATIONAL — it must never write to haulVals for a hidden
    // block. It used to clear the value whenever isDriver was not yet true, and
    // isDriver starts null: init() runs loadSupervisors() and loadEntries()
    // CONCURRENTLY, so a driver who taps a saved draft before the roster call
    // lands had fillBlockFromEntry store 'off_site' and this wipe it a line
    // later. The flag then arrived true, the control read "No", and saving
    // posted '' — silently moving his hours back into prevailing and re-billing
    // his wage to the job on the next approval.
    //
    // Nothing needs the clear: buildPayloads already decides what to post from
    // isDriver directly ('' when false, nothing at all when null), so the
    // stored value only ever matters for a driver, which is the case that keeps
    // it.
    function applyHaulVisibility(i) {
      const idxs = (i == null) ? blockOrder() : [i];
      for (const b of idxs) {
        const row = bel(b, 'row-haul');
        if (row) row.style.display = isDriver ? 'flex' : 'none';
        if (isDriver) setHaul(haulVals[b] || '', b);
        else applyHaulUnitVisibility(b);
      }
    }

    function setOffType(t) {
      offType = t;
      document.querySelectorAll('#off-pills .pill').forEach(p => {
        p.classList.toggle('active', p.dataset.val === t);
      });
    }

    // ── Compute hours live ─────────────────────────────────────────────────
    // Gross start→end span in minutes, overnight-aware and capped at 24h —
    // the same arithmetic computeHours() does on the server.
    function spanMinutes(start, end) {
      if (!start || !end) return null;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let mins = (eh * 60 + em) - (sh * 60 + sm);
      if (mins < 0) mins += 24 * 60;
      if (mins > 24 * 60) mins = 24 * 60;
      return mins;
    }

    // Mirrors the server's deduction in api/timesheet-entries.js: if the
    // worker selected "Yes" for the lunch question, subtract 30 minutes
    // from the gross start→end span (clamped at 0). On a split day the
    // deduction lands on the first job only — one lunch, taken once, so
    // repeating it per block would quietly eat half an hour per extra job.
    function updateHours(i = 0) {
      const out = bel(i, 'hours');
      if (!out) return;
      let mins = spanMinutes(bel(i, 'start').value, bel(i, 'end').value);
      if (mins == null) { out.textContent = '0.00'; updateDayTotal(); return; }
      if (i === 0 && lunchVal === true) mins = Math.max(0, mins - 30);
      out.textContent = (mins / 60).toFixed(2);
      updateDayTotal();
    }

    // Travel is logged as two decimal-hour legs (to-site + to-shop). The
    // displayed total is just the sum — no lunch deduction applies.
    function parseTravelLeg(el) {
      const raw = el ? el.value : '';
      if (raw === '' || raw == null) return 0;
      const n = Number(raw);
      if (!Number.isFinite(n) || n < 0) return 0;
      return Math.min(n, 24);
    }
    // Every leg of the day: the drive out to the first job, the drive between
    // each pair of jobs, and the drive home from the last. A day on one job
    // has only the first and last, which is what this always showed.
    function updateTravelHours() {
      const total = blockOrder().reduce((s, i) => s + parseTravelLeg(bel(i, 'travel-in')), 0)
                  + parseTravelLeg(document.getElementById('f-travel-to-shop'));
      document.getElementById('f-travel-hours').textContent = total.toFixed(2);
    }

    // ── Load supervisors + jobs ───────────────────────────────────────────
    async function loadSupervisors() {
      try {
        const res = await fetch('/api/timesheet-supervisors', { headers: authHeaders() });
        if (res.status === 401) { sessionExpired(); return; }
        const data = await res.json();
        // A non-2xx body has no `supervisors` key, so the old read turned every
        // failure into an empty roster indistinguishable from a company that
        // hasn't named any supervisors yet. Fail loudly to the console instead.
        if (!res.ok || !Array.isArray(data && data.supervisors)) {
          throw new Error((data && data.error) || `HTTP ${res.status}`);
        }
        supervisors = data.supervisors;
        // Rides along on the same response. A deploy that predates the column
        // sends nothing here, which reads as false — the form then behaves
        // exactly as it did before the hauling question existed.
        isDriver = data.is_driver === true;
      } catch (err) {
        console.error('[timesheet] supervisors failed to load:', err);
        supervisors = [];
        // Unknown, not false — see the declaration. The question is not asked
        // either way, but a saved answer survives the edit.
        isDriver = null;
      }
      applyHaulVisibility();
      const opts = '<option value="">— pick —</option>' +
        supervisors.map(s => `<option value="${s.id}" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join('');
      document.getElementById('f-supervisor').innerHTML = opts;
      document.getElementById('f-off-supervisor').innerHTML = opts;
    }

    // Picking this in the job box re-runs the load that failed. A <select> is
    // the only control on screen at that moment, so the retry has to be an
    // option inside it — a disabled select swallows taps on a phone.
    const JOB_RETRY = '__retry__';

    // Which job load is the current one, per block. Two divisions picked in
    // quick succession are two loads in flight, and whichever answers LAST used
    // to win — leaving the job picker listing one division's jobs while the
    // division picker beside it reads another. Pick from that list and the
    // entry goes in as, say, a turf day on a paving project, which approval
    // then injects into turf's cost tracking. So each load takes a ticket and
    // drops its result if a newer one has been issued since.
    let jobLoadToken = {};   // block index → id of that block's newest load

    async function onDivisionChange(i = 0) {
      const div = bel(i, 'division').value;
      const jobSel = bel(i, 'job');
      const token = jobLoadToken[i] = (jobLoadToken[i] || 0) + 1;
      const stale = () => jobLoadToken[i] !== token || !document.getElementById(bid(i, 'job'));
      // The Unit + Description fields ride alongside the job picker; whether
      // they show depends on the job as well as the division under dust, so
      // onJobChange owns the reveal and runs again once the jobs have loaded.
      onJobChange(i);
      // The truck picker is division-dependent too: moving a haul block onto a
      // division whose cost row has no equipment column must take it away
      // again, rather than leave a truck the approval has nowhere to put.
      applyHaulUnitVisibility(i);
      if (!div) {
        jobSel.innerHTML = '<option value="">— pick division first —</option>';
        jobSel.disabled = true;
        return;
      }
      jobSel.innerHTML = '<option value="">Loading jobs…</option>';
      jobSel.disabled = true;
      try {
        if (!jobsCache[div]) {
          const res = await fetch('/api/timesheet-jobs?division=' + encodeURIComponent(div), {
            headers: authHeaders(),
          });
          // An expired token still sits in localStorage looking like a signed-in
          // session, so the page loads and every call behind it 401s. Send the
          // user back to sign in rather than let the form look merely empty.
          if (res.status === 401) { sessionExpired(); return; }
          let data = null;
          try { data = await res.json(); } catch { /* non-JSON body */ }
          // A 403/500 body carries `error`, not `jobs`. Reading `data.jobs`
          // off it yielded undefined → [] → "(no active jobs)": a division
          // full of live work read to the crew as a division with none, and
          // the [] was cached, so re-picking the division never retried.
          // Anything but a well-formed 2xx is now an error, and errors are
          // NOT cached.
          if (!res.ok || !Array.isArray(data && data.jobs)) {
            throw new Error((data && data.error) || `HTTP ${res.status}`);
          }
          jobsCache[div] = data.jobs;
        }
        // A newer pick is already loading (or the block has been removed) —
        // leave the picker to whoever owns it now.
        if (stale()) return;
        const jobs = jobsCache[div];
        if (!jobs.length) {
          jobSel.innerHTML = '<option value="">(no active jobs)</option>';
          jobSel.disabled = true;
          return;
        }
        jobSel.innerHTML = '<option value="">— pick —</option>' +
          jobs.map(j => `<option value="${escapeHtml(j.id)}" data-label="${escapeHtml(j.label)}">${escapeHtml(j.label)}</option>`).join('');
        jobSel.disabled = false;
      } catch (err) {
        console.error(`[timesheet] jobs failed to load for division "${div}":`, err);
        if (stale()) return;
        // Left enabled so the retry option is reachable — the whole point is
        // that the crew can get themselves out of this without a reinstall.
        jobSel.innerHTML = '<option value="">(couldn\'t load jobs)</option>' +
          `<option value="${JOB_RETRY}">↻ Retry</option>`;
        jobSel.disabled = false;
      }
      if (stale()) return;
      onJobChange(i);
    }

    // The two standing EES activities, as minted by api/timesheet-jobs.js.
    // Picking either one under Dust Control reveals the EES detail fields that
    // the division's "EES Other" tab is built from.
    const EES_JOB_IDS = ['ees:preloading', 'ees:washing'];

    function isEesSelection(i = 0) {
      return bel(i, 'division').value === 'dust'
          && EES_JOB_IDS.includes(bel(i, 'job').value);
    }

    // The Unit + Description are asked for exactly when approval will inject a
    // Truck Tracking row, since that is the only place they land. Mirrors
    // needsTruckTrackingRow in api/timesheet-entries.js — ask on a job the
    // server won't keep them for and the driver types a unit into a void.
    //
    // For trucking the division decides it; for dust the JOB does, which is why
    // this is re-evaluated on every job change and not just on division change.
    function isTruckSelection(i = 0) {
      const div = bel(i, 'division').value;
      if (div === 'trucking') return true;
      const job = bel(i, 'job').value;
      return div === 'dust' && !!job && !EES_JOB_IDS.includes(job);
    }

    // ── The trucking office's unit list ───────────────────────────────────
    // The Unit box used to be free text, but the unit is read at the far end by
    // name: the Truck Tracking tab matches a row's unit against this same list
    // to show the truck's number beside it. "Truck 1000", or 1000 with a stray
    // space, saves fine here and turns up there unrecognised. So the box offers
    // the list, and says which side of it what you typed falls on.
    //
    // Fetched once and only when a haul is actually picked — most days on this
    // form are not hauls, and none of them should pay for this. Everything it
    // touches is decoration: the dropdown's options and the note under the box,
    // never the value. If it never arrives the box is exactly the plain text
    // input it has always been.
    let truckUnitRoster        = null;
    let truckUnitRosterPromise = null;
    function truckUnitRosterLoad() {
      if (truckUnitRoster) return Promise.resolve(truckUnitRoster);
      if (!truckUnitRosterPromise) {
        // Inside a promise so even a synchronous throw lands in the catch — a
        // roster problem must never break picking a job.
        truckUnitRosterPromise = Promise.resolve()
          .then(() => fetch('/api/truck-division?lists=1', { headers: authHeaders() }))
          .then(r => (r && r.ok ? r.json() : null))
          .then(j => {
            // No answer is not an empty list. Left unknown, the note stays
            // quiet rather than calling a good unit unrecognised, and the next
            // haul picked tries again.
            if (!j || !j.lists) { truckUnitRosterPromise = null; return null; }
            truckUnitRoster = (Array.isArray(j.lists.units) ? j.lists.units : [])
              // Older saves stored bare strings, before units grew a number.
              .map(u => (typeof u === 'string' ? { name: u, number: '' } : u))
              .filter(u => u && u.name)
              .sort((a, b) => String(a.name).localeCompare(String(b.name)));
            return truckUnitRoster;
          })
          .catch(() => { truckUnitRosterPromise = null; return null; });
      }
      return truckUnitRosterPromise;
    }

    // Every Unit input on the page shares one datalist, so filling it once
    // serves block 0 and every split block, including ones added later.
    const truckUnitInputs = () => document.querySelectorAll('input[list="truckUnitOptions"]');
    function truckUnitOptionsFill() {
      const dl = document.getElementById('truckUnitOptions');
      if (!dl) return;
      dl.innerHTML = (truckUnitRoster || []).map(u =>
        `<option value="${escapeHtml(String(u.name))}">${escapeHtml(u.number ? '#' + u.number : '')}</option>`
      ).join('');
    }
    // The note lives beside its input under a fixed id, so this works for any
    // block without having to know how many there are.
    function truckUnitHintFor(input) {
      const hint = input && document.getElementById(input.id + '-hint');
      if (!hint) return;
      const val = String(input.value || '').trim();
      // Nothing to compare against — not loaded, or this company keeps no list.
      if (!val || !truckUnitRoster || !truckUnitRoster.length) {
        hint.textContent = ''; hint.classList.remove('off-list'); return;
      }
      const hit = truckUnitRoster.find(u => String(u.name).toLowerCase() === val.toLowerCase());
      hint.classList.toggle('off-list', !hit);
      hint.textContent = hit
        ? (hit.number ? `Unit #${hit.number}` : 'On the truck list.')
        : 'Not on the truck list — sent as typed.';
    }
    function truckUnitHintsRefresh() { truckUnitInputs().forEach(truckUnitHintFor); }
    // Delegated, so blocks added after this runs are covered too. Picking from
    // the dropdown fires `input` as typing does, so both keep the note honest.
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t && t.id && /(^|-)truck-unit$/.test(t.id)) truckUnitHintFor(t);
    });

    function onJobChange(i = 0) {
      // The retry row isn't a job — it's the failed load asking to run again.
      // Clear it first so the re-entrant onJobChange below sees an empty box.
      const jobSel = bel(i, 'job');
      if (jobSel && jobSel.value === JOB_RETRY) {
        jobSel.value = '';
        onDivisionChange(i);
        return;
      }
      const wrap = bel(i, 'eesFields');
      if (wrap) wrap.style.display = isEesSelection(i) ? 'flex' : 'none';
      const truckWrap = bel(i, 'truckingFields');
      const isTruck   = isTruckSelection(i);
      if (truckWrap) truckWrap.style.display = isTruck ? 'flex' : 'none';
      // A haul is on screen — this is the moment the list is worth fetching.
      if (isTruck) {
        truckUnitRosterLoad().then(() => { truckUnitOptionsFill(); truckUnitHintsRefresh(); });
      } else {
        // Off a haul the box is hidden and about to be ignored; drop the note
        // with it so it cannot reappear next to a different job's unit.
        const hint = document.getElementById(bid(i, 'truck-unit') + '-hint');
        if (hint) { hint.textContent = ''; hint.classList.remove('off-list'); }
      }
    }

    // ── Entries list ──────────────────────────────────────────────────────
    // Default window covers the current pay period (Mon of last week through
    // Sun of this week — 14 days) so a field worker isn't scrolling through
    // months of history. Drafts are always loaded regardless of date so
    // unfinished work never silently disappears. The "Show older entries"
    // button lifts the cap on demand.
    let scopeUnbounded = false;

    function payPeriodWindow() {
      const today = new Date();
      const dayOfWeek = today.getDay();              // 0=Sun..6=Sat
      const offsetToMonday = (dayOfWeek + 6) % 7;    // Mon=0, ..., Sun=6
      const thisMon = new Date(today);
      thisMon.setDate(today.getDate() - offsetToMonday);
      thisMon.setHours(0, 0, 0, 0);
      const from = new Date(thisMon); from.setDate(thisMon.getDate() - 7);   // Mon last week
      const to   = new Date(thisMon); to.setDate(thisMon.getDate() + 6);     // Sun this week
      return { from, to };
    }

    function ymd(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }

    // Fetch one slice of the entries list. Resolves to { entries: [...] }
    // on success, or { error: '...' } on any failure (network, non-2xx,
    // non-JSON body). Never throws — callers can branch on the result so
    // a single broken slice doesn't blank the whole list.
    async function fetchEntriesSlice(url, label) {
      try {
        const res = await fetch(url, { headers: authHeaders() });
        let body = null;
        try { body = await res.json(); } catch { /* non-JSON body */ }
        if (!res.ok) {
          const msg = (body && body.error) || `HTTP ${res.status}`;
          console.error(`[timesheet] ${label} failed:`, msg, body);
          return { error: msg };
        }
        return { entries: Array.isArray(body && body.entries) ? body.entries : [] };
      } catch (err) {
        console.error(`[timesheet] ${label} threw:`, err);
        return { error: err && err.message ? err.message : 'network error' };
      }
    }

    async function loadEntries() {
      const list  = document.getElementById('entriesList');
      const scope = document.getElementById('entriesScope');
      const btn   = document.getElementById('toggleScopeBtn');
      list.innerHTML = '<div class="entry-empty">Loading…</div>';

      let entries = [];
      let failures = [];

      if (scopeUnbounded) {
        const r = await fetchEntriesSlice('/api/timesheet-entries', 'all-entries');
        if (r.error) failures.push(r.error); else entries = r.entries;
        scope.textContent = 'All entries';
        if (btn) { btn.textContent = 'Show recent only'; btn.style.display = ''; }
      } else {
        const { from, to } = payPeriodWindow();
        const fromS = ymd(from), toS = ymd(to);
        // Drafts always show — a forgotten draft from an earlier window
        // would otherwise become invisible to the field worker.
        const [draftsR, recentR] = await Promise.all([
          fetchEntriesSlice('/api/timesheet-entries?status=draft', 'drafts'),
          fetchEntriesSlice(`/api/timesheet-entries?status=submitted_approved&from=${fromS}&to=${toS}`, 'recent'),
        ]);
        const byId = new Map();
        if (draftsR.error) failures.push(`drafts: ${draftsR.error}`);
        else for (const e of draftsR.entries) byId.set(e.id, e);
        if (recentR.error) failures.push(`recent: ${recentR.error}`);
        else for (const e of recentR.entries) if (!byId.has(e.id)) byId.set(e.id, e);
        entries = Array.from(byId.values());
        scope.textContent = `${fmtScopeDate(from)} – ${fmtScopeDate(to)} (+ all drafts)`;
        if (btn) { btn.textContent = 'Show older entries'; btn.style.display = ''; }
      }

      entries.sort((a, b) => (b.work_date || '').localeCompare(a.work_date || ''));
      entriesCache = entries;

      try {
        renderEntries();
      } catch (err) {
        console.error('[timesheet] renderEntries threw:', err);
        failures.push(`render: ${err && err.message ? err.message : 'render error'}`);
      }

      // Surface a non-empty failure note BELOW any rows we did manage to
      // load, so the worker still sees their drafts even if (say) the
      // pay-period slice timed out.
      if (failures.length) {
        const note = `<div class="entry-empty">Couldn't load some entries (${escapeHtml(failures.join('; '))}).</div>`;
        if (!entriesCache.length) list.innerHTML = note;
        else list.insertAdjacentHTML('beforeend', note);
      }
    }

    function fmtScopeDate(d) {
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function toggleScope() {
      scopeUnbounded = !scopeUnbounded;
      loadEntries();
    }

    function renderEntries() {
      const list = document.getElementById('entriesList');
      if (!entriesCache.length) {
        list.innerHTML = '<div class="entry-empty">No entries yet. Use the form above to submit your first one.</div>';
        return;
      }
      list.innerHTML = entriesCache.map(e => {
        const isDraft = e.status === 'draft';
        const meta = e.entry_type === 'time_off'
          ? `Time Off — ${prettyOffType(e.time_off_type)}`
          : `${prettyDivision(e.division)} · ${escapeHtml(e.job_label || '')}${e.start_time && e.end_time ? ` · ${e.start_time}–${e.end_time}` : ''}`;
        const hoursParts = [];
        if (e.entry_type === 'daily' && e.computed_hours != null) hoursParts.push(`${Number(e.computed_hours).toFixed(2)} h`);
        if (e.entry_type === 'daily' && e.travel_hours != null && e.travel_hours > 0) hoursParts.push(`+${Number(e.travel_hours).toFixed(2)} h travel`);
        const hours = hoursParts.join(' ');
        const audit = entryAuditLine(e);
        // One job of a split day. Says so on the card, otherwise two entries on
        // the same date read as an accidental double submission.
        const split = splitLabel(e)
          ? `<span class="badge badge-split">${escapeHtml(splitLabel(e))}</span>` : '';
        return `
          <div class="entry ${isDraft ? 'draft' : ''}" ${isDraft ? `onclick="editEntry('${e.id}')"` : ''}>
            <div class="entry-head">
              <div class="entry-date">${prettyDate(e.work_date)}</div>
              <div style="display:flex;align-items:center;gap:0.35rem">
                ${split}
                <span class="badge badge-${e.status}">${e.status}</span>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;gap:0.6rem;align-items:flex-end">
              <div class="entry-meta">${meta}</div>
              ${hours ? `<div class="entry-hours">${hours}</div>` : ''}
            </div>
            ${audit ? `<div class="entry-audit">${audit}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // "Split 1/2" for an entry that was one job of a multi-job day, '' for an
    // ordinary entry. split_count is what the group was at submission time —
    // it stays put if a sibling is later deleted, because it is describing how
    // the day was reported, not how many rows survive.
    function splitLabel(e) {
      if (!e || !e.split_group_id) return '';
      const idx = Number(e.split_index), cnt = Number(e.split_count);
      if (!Number.isFinite(idx) || !Number.isFinite(cnt) || cnt < 2) return '';
      return `Split ${idx}/${cnt}`;
    }

    function entryAuditLine(e) {
      if (!e || e.status === 'draft') return '';
      const sub = fmtTs(e.submitted_at);
