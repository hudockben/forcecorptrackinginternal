<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2314b8a6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='17' rx='2'/><line x1='3' y1='9' x2='21' y2='9'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='16' y1='2' x2='16' y2='6'/></svg>" />
  <title>Timesheet — Submit Time</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #14141d;
      --surface2:  #1c1c28;
      --border:    #2a2a3a;
      --accent:    #14b8a6;
      --accent-d:  #0d9488;
      --text:      #e8e8ee;
      --muted:     #888;
      --red:       #ef4444;
      --yellow:    #eab308;
      --green:     #22c55e;
      --blue:      #60a5fa;
    }

    html, body { height: 100%; overscroll-behavior-y: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding-top: calc(0.9rem + env(safe-area-inset-top, 0));
    }
    .brand {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .user-chip {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .user-chip strong { color: var(--text); font-weight: 600; }
    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .icon-btn:active { color: var(--text); border-color: #555; }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Section card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .card-title {
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .card-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── Type toggle (Daily / Time Off) ── */
    .toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.35rem;
    }
    .toggle button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s, color 0.15s;
    }
    .toggle button.active {
      background: var(--accent);
      color: #003;
    }

    /* ── Form fields ── */
    .row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
    }
    label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 0.85rem 0.8rem;
      font-family: inherit;
      outline: none;
      min-height: 48px;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 0.6rem center;
      background-size: 18px;
      padding-right: 2rem;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }

    /* ── Yes/No segmented pill ── */
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.3rem;
    }
    .seg button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.65rem;
      border-radius: 7px;
      cursor: pointer;
      min-height: 42px;
    }
    .seg button.on   { background: var(--accent); color: #003; }
    .seg button.off  { background: var(--border); color: var(--text); }

    /* ── Time-off type radio grid ── */
    .pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 0.7rem;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .pill.active {
      background: var(--accent);
      color: #003;
      border-color: var(--accent);
    }

    /* ── Computed hours display ── */
    .computed {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .computed .label {
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .computed .value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ── Split job block ──
       An extra job on the same day. Sits a shade above the form's own
       background so the block reads as one unit, while its inputs keep the
       darker field colour they have everywhere else. */
    .split-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .split-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }
    .split-block-title {
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    .link-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.3rem 0.1rem;
      font-family: inherit;
    }
    .link-btn:active { color: var(--red); }
    .split-add {
      background: none;
      color: var(--accent);
      border: 1px dashed var(--border);
      border-radius: 10px;
      min-height: 48px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.01em;
    }
    .split-add:active { background: var(--surface2); }
    .split-add:disabled { opacity: 0.4; cursor: not-allowed; }
    .hint {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.45;
    }

    /* ── Action buttons ── */
    .btn-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-height: 50px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #003;
    }
    .btn-primary:active { background: var(--accent-d); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:active { background: var(--border); }
    .btn-danger {
      background: rgba(239,68,68,0.12);
      color: var(--red);
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Status badges ── */
    .badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.22rem 0.55rem;
      border-radius: 4px;
    }
    .badge-draft     { background: rgba(136,136,136,0.15); color: var(--muted); }
    .badge-submitted { background: rgba(96,165,250,0.15); color: var(--blue); }
    .badge-approved  { background: rgba(34,197,94,0.15);  color: var(--green); }
    .badge-split     { background: rgba(20,184,166,0.15); color: var(--accent); }

    /* ── Entries list ── */
    .entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .entry.draft { cursor: pointer; }
    .entry.draft:active { background: var(--surface2); }
    .entry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }
    .entry-date {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .entry-meta {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .entry-hours {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      /* A long job label used to push "4.00 h" onto two lines. Splitting a day
         puts two of these cards up at once, so it happens more, not less. */
      white-space: nowrap;
    }
    .entry-empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1.5rem 1rem;
    }
    .entry-audit {
      font-size: 0.7rem;
      color: var(--muted);
      padding-top: 0.45rem;
      margin-top: 0.2rem;
      border-top: 1px dashed var(--border);
      line-height: 1.4;
    }

    /* ── Toast / inline message ── */
    .msg {
      font-size: 0.85rem;
      min-height: 1.2em;
      padding: 0.1rem 0.2rem;
    }
    .msg.error   { color: var(--red); }
    .msg.success { color: var(--green); }

    /* ── No-access screen ── */
    .no-access {
      max-width: 420px;
      margin: 4rem auto;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .no-access h2 {
      font-size: 1.3rem;
      color: var(--text);
      margin-bottom: 0.6rem;
    }
    .no-access p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .hidden { display: none !important; }

    /* ── Tablet+ ── */
    @media (min-width: 720px) {
      main { padding: 1.5rem; }
      .row-2 { gap: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Timesheet</div>
    <div class="header-right">
      <div class="user-chip" id="userChip"></div>
      <button class="icon-btn" id="switchBtn" style="display:none" onclick="goToDivisions()">Switch</button>
      <button class="icon-btn" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <main id="mainContent">

    <!-- ── Entry form ── -->
    <section class="card" id="formCard">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="card-title" id="formTitle">New Entry</div>
        <span class="badge" id="formBadge" style="display:none"></span>
      </div>

      <!-- Type toggle -->
      <div class="toggle" role="tablist" aria-label="Entry type">
        <button id="tab-daily"    class="active" onclick="setType('daily')">Daily</button>
        <button id="tab-time-off"            onclick="setType('time_off')">Time Off</button>
      </div>

      <!-- Daily fields -->
      <div id="dailyFields" style="display:flex;flex-direction:column;gap:0.85rem">
        <div class="row">
          <label for="f-date">Date</label>
          <input type="date" id="f-date" />
        </div>

        <div class="row-2">
          <div class="row">
            <label for="f-division">Division</label>
            <select id="f-division" onchange="onDivisionChange()">
              <option value="">— pick —</option>
              <option value="turf">Turf</option>
              <option value="dust">Dust</option>
              <option value="paving">Paving</option>
              <option value="kiewit">Kiewit Pinetree</option>
              <option value="trucking">Trucking</option>
              <option value="quarry">Quarry</option>
            </select>
          </div>
          <div class="row">
            <label for="f-job">Job</label>
            <select id="f-job" disabled onchange="onJobChange()">
              <option value="">— pick division first —</option>
            </select>
          </div>
        </div>

        <!-- Trucking-only fields. Shown only when Division = Trucking; the Unit
             and Description map to the matching Truck Tracking columns when the
             entry is approved into the Trucking division. -->
        <div id="truckingFields" style="display:none;flex-direction:column;gap:0.85rem">
          <div class="row">
            <label for="f-truck-unit">Unit</label>
            <input type="text" id="f-truck-unit" maxlength="100" placeholder="Truck / unit #" />
          </div>
          <div class="row">
            <label for="f-truck-desc">Description</label>
            <textarea id="f-truck-desc" maxlength="2000" placeholder="What was hauled, route, etc."></textarea>
          </div>
        </div>

        <!-- EES-only fields. Shown only when Division = Dust Control AND the job
             is EES - Pre Loading or EES - Washing. These map straight across to
             the matching columns of the Dust division's "EES Other" tab when the
             entry is approved, so what's typed here is what shows up there. -->
        <div id="eesFields" style="display:none;flex-direction:column;gap:0.85rem">
          <div class="row-2">
            <div class="row">
              <label for="f-ees-unit">Unit</label>
              <input type="text" id="f-ees-unit" maxlength="100" placeholder="Truck / unit #" />
            </div>
            <div class="row">
              <label for="f-ees-customer">Customer</label>
              <input type="text" id="f-ees-customer" maxlength="500" placeholder="Customer" />
            </div>
          </div>
          <div class="row-2">
            <div class="row">
              <label for="f-ees-location">Location</label>
              <input type="text" id="f-ees-location" maxlength="500" placeholder="Location" />
            </div>
            <div class="row">
              <label for="f-ees-name">Name</label>
              <input type="text" id="f-ees-name" maxlength="500" placeholder="Name" />
            </div>
          </div>
          <div class="row-2">
            <div class="row">
              <label for="f-ees-job-number">Job Number</label>
              <input type="text" id="f-ees-job-number" maxlength="100" placeholder="Job #" />
            </div>
            <div class="row">
              <label for="f-ees-billing">Billing</label>
              <select id="f-ees-billing">
                <option value="Non-Billable">Non-Billable</option>
                <option value="Billable">Billable</option>
              </select>
            </div>
          </div>
        </div>

        <div class="row-2">
          <div class="row">
            <label for="f-travel-to-site">Travel Time to Site (hours)</label>
            <input type="number" inputmode="decimal" min="0" max="24" step="0.25" placeholder="0"
                   id="f-travel-to-site" oninput="updateTravelHours()" onchange="updateTravelHours()" />
          </div>
          <div class="row">
            <label for="f-travel-to-shop">Travel Time to Shop (hours)</label>
            <input type="number" inputmode="decimal" min="0" max="24" step="0.25" placeholder="0"
                   id="f-travel-to-shop" oninput="updateTravelHours()" onchange="updateTravelHours()" />
          </div>
        </div>

        <div class="computed">
          <span class="label">Travel hours</span>
          <span class="value" id="f-travel-hours">0.00</span>
        </div>

        <div class="row-2">
          <div class="row">
            <label for="f-start">Site Start Time</label>
            <input type="time" id="f-start" onchange="updateHours()" oninput="updateHours()" />
          </div>
          <div class="row">
            <label for="f-end">Site End Time</label>
            <input type="time" id="f-end" onchange="updateHours()" oninput="updateHours()" />
          </div>
        </div>

        <div class="computed">
          <span class="label">Hours</span>
          <span class="value" id="f-hours">0.00</span>
        </div>

        <div class="row">
          <label>Lunch break?</label>
          <div class="seg" id="seg-lunch">
            <button type="button" data-val="true"  onclick="setSeg('lunch', true)">Yes</button>
            <button type="button" data-val="false" onclick="setSeg('lunch', false)">No</button>
          </div>
        </div>

        <div class="row">
          <label>Operated equipment?</label>
          <div class="seg" id="seg-equip">
            <button type="button" data-val="true"  onclick="setSeg('equip', true)">Yes</button>
            <button type="button" data-val="false" onclick="setSeg('equip', false)">No</button>
          </div>
        </div>

        <!-- ── Split the day across more than one job ──
             One day on two jobs used to mean filling this form twice. Each
             block added here is another job on the SAME day: its own division,
             job, clock and equipment answer, everything above it (date, travel,
             lunch, supervisor, notes) shared. On save each block is written as
             its own timesheet entry, so payroll reviews and approves them
             exactly as if they had been submitted separately.
             Blocks are built by splitBlockHtml() — keep the fields there in
             step with the per-job fields above. -->
        <div id="splitBlocks" style="display:flex;flex-direction:column;gap:0.85rem"></div>

        <div class="computed" id="dayTotalRow" style="display:none">
          <span class="label">All jobs — site hours</span>
          <span class="value" id="f-day-hours">0.00</span>
        </div>

        <button type="button" class="split-add" id="btn-add-split" onclick="addSplit()">
          + Split time to another job
        </button>
        <div class="hint" id="splitHint" style="display:none"></div>

        <div class="row">
          <label for="f-supervisor">Supervisor</label>
          <select id="f-supervisor">
            <option value="">— pick —</option>
          </select>
        </div>

        <div class="row">
          <label for="f-notes">Notes <span style="text-transform:none;font-weight:400">(optional)</span></label>
          <textarea id="f-notes" placeholder="Anything the office should know"></textarea>
        </div>
      </div>

      <!-- Time off fields -->
      <div id="timeOffFields" style="display:none;flex-direction:column;gap:0.85rem">
        <div class="row">
          <label>Type</label>
          <div class="pills" id="off-pills">
            <div class="pill" data-val="vacation"   onclick="setOffType('vacation')">Vacation</div>
            <div class="pill" data-val="sick"       onclick="setOffType('sick')">Sick</div>
            <div class="pill" data-val="jury_duty"  onclick="setOffType('jury_duty')">Jury Duty</div>
            <div class="pill" data-val="bereavement"onclick="setOffType('bereavement')">Bereavement</div>
            <div class="pill" data-val="holiday"    onclick="setOffType('holiday')">Holiday</div>
          </div>
        </div>
        <div class="row">
          <label for="f-off-date">Date</label>
          <input type="date" id="f-off-date" />
        </div>
        <div class="row">
          <label for="f-off-supervisor">Supervisor</label>
          <select id="f-off-supervisor">
            <option value="">— pick —</option>
          </select>
        </div>
        <div class="row">
          <label for="f-off-notes">Notes <span style="text-transform:none;font-weight:400">(optional)</span></label>
          <textarea id="f-off-notes" placeholder="Anything the office should know"></textarea>
        </div>
      </div>

      <div class="msg" id="formMsg"></div>

      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-reset" onclick="resetForm()">Reset</button>
        <button class="btn btn-secondary" id="btn-save"  onclick="saveDraft()">Save Draft</button>
        <button class="btn btn-primary"   id="btn-submit"onclick="submitEntry()">Submit</button>
      </div>
      <div class="btn-row" id="row-delete" style="display:none">
        <button class="btn btn-danger" onclick="deleteDraft()">Delete Draft</button>
      </div>
    </section>

    <!-- ── Past entries ── -->
    <section class="card">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:0.6rem;flex-wrap:wrap">
        <div class="card-title">My Recent Entries</div>
        <div id="entriesScope" class="card-sub" style="font-size:0.72rem"></div>
      </div>
      <div id="entriesList"><div class="entry-empty">Loading…</div></div>
      <div style="text-align:center">
        <button id="toggleScopeBtn" class="btn btn-secondary"
          style="display:none;font-size:0.78rem;padding:0.55rem 1.2rem;flex:0 0 auto"
          onclick="toggleScope()">Show older entries</button>
      </div>
    </section>

  </main>

  <!-- ── No-access fallback ── -->
  <div id="noAccess" class="no-access hidden">
    <h2>No Timesheet Access</h2>
    <p>Your account doesn't have permission to submit time entries. Ask a company admin to grant you Timesheet access.</p>
    <button class="btn btn-secondary" style="max-width:240px;margin:0 auto" onclick="goToDivisions()">Back to Divisions</button>
  </div>

  <script>
    // ── Auth + access guard ────────────────────────────────────────────────
    const token = localStorage.getItem('fct_token');
    const user  = (() => { try { return JSON.parse(localStorage.getItem('fct_user')); } catch { return null; } })();
    if (!token || !user) window.location.replace('index.html');

    const isPlatformAdmin = Boolean(user && user.isPlatformAdmin);
    const allowedDivisions = Array.isArray(user && user.allowedDivisions) ? user.allowedDivisions : [];
    const hasTimesheet = isPlatformAdmin || allowedDivisions.includes('timesheet');
    const otherDivisions = allowedDivisions.filter(d => d !== 'timesheet');

    if (!hasTimesheet) {
      document.getElementById('mainContent').classList.add('hidden');
      document.getElementById('noAccess').classList.remove('hidden');
    } else {
      // Show "Switch" only when this user has more than just timesheet
      if (isPlatformAdmin || otherDivisions.length > 0) {
        document.getElementById('switchBtn').style.display = '';
      }
      document.getElementById('userChip').innerHTML =
        `<strong>${escapeHtml(user.username)}</strong>`;
      // Defer to a microtask so the `let` declarations further down in
      // this script (scopeUnbounded, supervisors, etc.) finish their TDZ
      // before init() / loadEntries() read them.
      queueMicrotask(init);
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ── State ──────────────────────────────────────────────────────────────
    let currentType   = 'daily';
    let lunchVal      = null;
    let offType       = null;
    let supervisors   = [];
    let jobsCache     = {};       // { division: [{id, label}] }
    let entriesCache  = [];

    // ── Job blocks ─────────────────────────────────────────────────────────
    // A day can cover more than one job. Block 0 is the form's original markup
    // and keeps its historical field ids; every extra job is a block rendered
    // by splitBlockHtml() with the same fields under an "s<N>-" id prefix.
    //
    // Everything here is keyed by block INDEX, never by screen position, so
    // removing a middle block can't slide one block's saved draft id onto
    // another block's fields — which would have a worker's second job quietly
    // overwrite their first.
    const MAX_JOB_BLOCKS = 6;
    let splitIdxs      = [];        // extra block indices, in display order
    let nextSplitIdx   = 0;         // monotonic: a removed block's ids never come back
    let equipVals      = { 0: null }; // block index → true / false / null
    let editingIds     = {};        // block index → id of the draft row it last wrote
    let loadedTags     = {};        // block index → the split tag it was loaded with
    let currentGroupId = null;      // split_group_id every block on this form writes

    // Every job block in top-to-bottom order. Block 0 is always first.
    function blockOrder() { return [0, ...splitIdxs]; }

    const BLOCK_NAMES = ['First job', 'Second job', 'Third job', 'Fourth job', 'Fifth job', 'Sixth job'];
    function blockName(i) {
      const pos = blockOrder().indexOf(i);
      return BLOCK_NAMES[pos] || `Job ${pos + 1}`;
    }

    // Field ids per block. Block 0 answers with the ids that were already in
    // the markup; the rest are the same keys under an "s<N>-" prefix.
    const BLOCK0_IDS = {
      'division':       'f-division',
      'job':            'f-job',
      'truckingFields': 'truckingFields',
      'truck-unit':     'f-truck-unit',
      'truck-desc':     'f-truck-desc',
      'eesFields':      'eesFields',
      'ees-unit':       'f-ees-unit',
      'ees-customer':   'f-ees-customer',
      'ees-location':   'f-ees-location',
      'ees-name':       'f-ees-name',
      'ees-job-number': 'f-ees-job-number',
      'ees-billing':    'f-ees-billing',
      'start':          'f-start',
      'end':            'f-end',
      'hours':          'f-hours',
      'seg-equip':      'seg-equip',
    };
    function bid(i, key) { return i === 0 ? BLOCK0_IDS[key] : `s${i}-${key}`; }
    function bel(i, key) { return document.getElementById(bid(i, key)); }

    // The division list is read off the form's own picker so the two can never
    // list different divisions.
    const DIVISION_OPTIONS_HTML = document.getElementById('f-division').innerHTML;

    // Markup for one extra job block. Mirrors the per-job fields of block 0
    // above — division, job, the trucking and EES extras, the site clock and
    // the equipment question. Day-level fields (date, travel, lunch,
    // supervisor, notes) are deliberately absent: they are shared, and asking
    // for them again per job is how a day ends up with two lunches.
    function splitBlockHtml(i) {
      return `
        <div class="split-block" id="s${i}-block">
          <div class="split-block-head">
            <div class="split-block-title" id="s${i}-title"></div>
            <button type="button" class="link-btn" onclick="removeSplit(${i})">Remove</button>
          </div>

          <div class="row-2">
            <div class="row">
              <label for="s${i}-division">Division</label>
              <select id="s${i}-division" onchange="onDivisionChange(${i})">${DIVISION_OPTIONS_HTML}</select>
            </div>
            <div class="row">
              <label for="s${i}-job">Job</label>
              <select id="s${i}-job" disabled onchange="onJobChange(${i})">
                <option value="">— pick division first —</option>
              </select>
            </div>
          </div>

          <div id="s${i}-truckingFields" style="display:none;flex-direction:column;gap:0.85rem">
            <div class="row">
              <label for="s${i}-truck-unit">Unit</label>
              <input type="text" id="s${i}-truck-unit" maxlength="100" placeholder="Truck / unit #" />
            </div>
            <div class="row">
              <label for="s${i}-truck-desc">Description</label>
              <textarea id="s${i}-truck-desc" maxlength="2000" placeholder="What was hauled, route, etc."></textarea>
            </div>
          </div>

          <div id="s${i}-eesFields" style="display:none;flex-direction:column;gap:0.85rem">
            <div class="row-2">
              <div class="row">
                <label for="s${i}-ees-unit">Unit</label>
                <input type="text" id="s${i}-ees-unit" maxlength="100" placeholder="Truck / unit #" />
              </div>
              <div class="row">
                <label for="s${i}-ees-customer">Customer</label>
                <input type="text" id="s${i}-ees-customer" maxlength="500" placeholder="Customer" />
              </div>
            </div>
            <div class="row-2">
              <div class="row">
                <label for="s${i}-ees-location">Location</label>
                <input type="text" id="s${i}-ees-location" maxlength="500" placeholder="Location" />
              </div>
              <div class="row">
                <label for="s${i}-ees-name">Name</label>
                <input type="text" id="s${i}-ees-name" maxlength="500" placeholder="Name" />
              </div>
            </div>
            <div class="row-2">
              <div class="row">
                <label for="s${i}-ees-job-number">Job Number</label>
                <input type="text" id="s${i}-ees-job-number" maxlength="100" placeholder="Job #" />
              </div>
              <div class="row">
                <label for="s${i}-ees-billing">Billing</label>
                <select id="s${i}-ees-billing">
                  <option value="Non-Billable">Non-Billable</option>
                  <option value="Billable">Billable</option>
                </select>
              </div>
            </div>
          </div>

          <div class="row-2">
            <div class="row">
              <label for="s${i}-start">Site Start Time</label>
              <input type="time" id="s${i}-start" onchange="updateHours(${i})" oninput="updateHours(${i})" />
            </div>
            <div class="row">
              <label for="s${i}-end">Site End Time</label>
              <input type="time" id="s${i}-end" onchange="updateHours(${i})" oninput="updateHours(${i})" />
            </div>
          </div>

          <div class="computed">
            <span class="label">Hours</span>
            <span class="value" id="s${i}-hours">0.00</span>
          </div>

          <div class="row">
            <label>Operated equipment?</label>
            <div class="seg" id="s${i}-seg-equip">
              <button type="button" data-val="true"  onclick="setSeg('equip', true, ${i})">Yes</button>
              <button type="button" data-val="false" onclick="setSeg('equip', false, ${i})">No</button>
            </div>
          </div>
        </div>`;
    }

    // Add another job to this day. Returns the new block's index, or null when
    // the form is already at the cap.
    //
    // `inherit` carries the previous block's end time and division into the new
    // one — a split is usually two jobs back to back, often in the same
    // division, so that is two fewer taps in the mud. It is off when a saved
    // draft is being loaded back in: the block is about to be filled from the
    // stored row anyway, and inheriting would fire a second, un-awaited job
    // load that can land after the real one and blank the selected job.
    function addJobBlock(inherit) {
      const msg = document.getElementById('formMsg');
      msg.className = 'msg';
      if (currentType !== 'daily') return null;
      if (blockOrder().length >= MAX_JOB_BLOCKS) {
        msg.textContent = `A day can be split across at most ${MAX_JOB_BLOCKS} jobs.`;
        msg.classList.add('error');
        return null;
      }
      const prev = blockOrder()[blockOrder().length - 1];
      const i = ++nextSplitIdx;
      splitIdxs.push(i);
      equipVals[i] = null;
      document.getElementById('splitBlocks').insertAdjacentHTML('beforeend', splitBlockHtml(i));

      if (inherit) {
        const prevEnd = bel(prev, 'end').value;
        if (prevEnd) bel(i, 'start').value = prevEnd;
        const prevDiv = bel(prev, 'division').value;
        if (prevDiv) { bel(i, 'division').value = prevDiv; onDivisionChange(i); }
      }

      renderSplitChrome();
      updateHours(i);
      return i;
    }

    function addSplit() {
      const i = addJobBlock(true);
      if (i != null) document.getElementById(`s${i}-block`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Drop a job block. If it had already been written out as a draft row,
    // that row goes with it — leaving it behind would put hours on a job the
    // worker just took off their day.
    async function removeSplit(i) {
      // Not while the form is mid-write: the payload list being written was
      // built before this click, so the block would be deleted here and
      // re-created a moment later by a write already on its way.
      if (formWriting) return;
      const savedId = editingIds[i];
      if (savedId && !confirm('Remove this job? The draft entry saved for it will be deleted.')) return;

      splitIdxs = splitIdxs.filter(x => x !== i);
      delete equipVals[i];
      delete editingIds[i];
      delete loadedTags[i];
      const el = document.getElementById(`s${i}-block`);
      if (el) el.remove();
      renderSplitChrome();

      if (savedId) {
        const msg = document.getElementById('formMsg');
        msg.className = 'msg';
        try {
          const res = await fetch('/api/timesheet-entries?id=' + encodeURIComponent(savedId), {
            method: 'DELETE', headers: authHeaders(),
          });
          const j = await res.json();
          if (!res.ok || !j.ok) throw new Error(j.error || 'Delete failed');
          // The stored group just lost a member, so the tags this form was
          // loaded with no longer describe the day. Drop them and let the next
          // save re-tag from what is actually on screen — otherwise deleting
          // the second job of a saved pair leaves the first still badged
          // "Split 1/2", pointing payroll at a job that no longer exists.
          // splitTagFor falls back to these only for a lone block, so a group
          // that still has two or more jobs just re-numbers itself.
          loadedTags = {};
          await loadEntries();
        } catch (err) {
          msg.textContent = `Removed from the form, but its saved draft could not be deleted (${err.message}). Delete it from the list below.`;
          msg.classList.add('error');
        }
      }
    }

    // Titles, the day total, the add button and the explainer — everything that
    // depends on how many blocks are on screen right now.
    function renderSplitChrome() {
      const order = blockOrder();
      const split = order.length > 1;
      for (const i of splitIdxs) {
        const t = document.getElementById(`s${i}-title`);
        if (t) t.textContent = blockName(i);
      }
      const addBtn = document.getElementById('btn-add-split');
      addBtn.disabled = order.length >= MAX_JOB_BLOCKS;
      addBtn.textContent = split ? '+ Add another job' : '+ Split time to another job';

      const hint = document.getElementById('splitHint');
      hint.style.display = split ? '' : 'none';
      hint.textContent = split
        ? `Each job is submitted as its own entry (${order.length} in total), so payroll sees them separately. `
          + 'Date, travel, lunch, supervisor and notes cover the whole day: travel is counted once for the round '
          + 'trip, and any lunch deduction comes off the first job.'
        : '';

      document.getElementById('dayTotalRow').style.display = split ? '' : 'none';
      updateDayTotal();
    }

    function updateDayTotal() {
      const total = blockOrder().reduce((s, i) => s + Number(bel(i, 'hours').textContent || 0), 0);
      document.getElementById('f-day-hours').textContent = total.toFixed(2);
    }

    // Tear every extra block off the form and forget its state. Used by
    // resetForm and before loading a draft, so the form never keeps a block
    // from the last thing it was showing.
    function clearSplits() {
      for (const i of splitIdxs) {
        const el = document.getElementById(`s${i}-block`);
        if (el) el.remove();
      }
      splitIdxs = [];
      equipVals = { 0: equipVals[0] };
    }

    async function init() {
      const today = todayStr();
      document.getElementById('f-date').value     = today;
      document.getElementById('f-off-date').value = today;

      await Promise.all([loadSupervisors(), loadEntries()]);
    }

    function todayStr() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm   = String(d.getMonth() + 1).padStart(2, '0');
      const dd   = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // ── Type toggle ────────────────────────────────────────────────────────
    function setType(t) {
      currentType = t;
      document.getElementById('tab-daily').classList.toggle('active',    t === 'daily');
      document.getElementById('tab-time-off').classList.toggle('active', t === 'time_off');
      document.getElementById('dailyFields').style.display   = t === 'daily'    ? 'flex' : 'none';
      document.getElementById('timeOffFields').style.display = t === 'time_off' ? 'flex' : 'none';
    }

    // Lunch is a property of the day, so it ignores `i`; equipment is answered
    // per job block.
    function setSeg(which, val, i = 0) {
      const seg = which === 'lunch' ? document.getElementById('seg-lunch') : bel(i, 'seg-equip');
      if (!seg) return;
      seg.querySelectorAll('button').forEach(b => {
        const v = b.dataset.val === 'true';
        b.classList.toggle('on',  v === val);
        b.classList.toggle('off', v !== val);
      });
      if (which === 'lunch') { lunchVal = val; updateHours(0); }
      else                     equipVals[i] = val;
    }

    function clearSeg(which, i = 0) {
      const seg = which === 'lunch' ? document.getElementById('seg-lunch') : bel(i, 'seg-equip');
      if (!seg) return;
      seg.querySelectorAll('button').forEach(b => b.classList.remove('on', 'off'));
      if (which === 'lunch') { lunchVal = null; updateHours(0); }
      else                     equipVals[i] = null;
    }

    function setOffType(t) {
      offType = t;
      document.querySelectorAll('#off-pills .pill').forEach(p => {
        p.classList.toggle('active', p.dataset.val === t);
      });
    }

    // ── Compute hours live ─────────────────────────────────────────────────
    // Gross start→end span in minutes, overnight-aware and capped at 24h —
    // the same arithmetic computeHours() does on the server.
    function spanMinutes(start, end) {
      if (!start || !end) return null;
      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      let mins = (eh * 60 + em) - (sh * 60 + sm);
      if (mins < 0) mins += 24 * 60;
      if (mins > 24 * 60) mins = 24 * 60;
      return mins;
    }

    // Mirrors the server's deduction in api/timesheet-entries.js: if the
    // worker selected "Yes" for the lunch question, subtract 30 minutes
    // from the gross start→end span (clamped at 0). On a split day the
    // deduction lands on the first job only — one lunch, taken once, so
    // repeating it per block would quietly eat half an hour per extra job.
    function updateHours(i = 0) {
      const out = bel(i, 'hours');
      if (!out) return;
      let mins = spanMinutes(bel(i, 'start').value, bel(i, 'end').value);
      if (mins == null) { out.textContent = '0.00'; updateDayTotal(); return; }
      if (i === 0 && lunchVal === true) mins = Math.max(0, mins - 30);
      out.textContent = (mins / 60).toFixed(2);
      updateDayTotal();
    }

    // Travel is logged as two decimal-hour legs (to-site + to-shop). The
    // displayed total is just the sum — no lunch deduction applies.
    function parseTravelLeg(id) {
      const raw = document.getElementById(id).value;
      if (raw === '' || raw == null) return 0;
      const n = Number(raw);
      if (!Number.isFinite(n) || n < 0) return 0;
      return Math.min(n, 24);
    }
    function updateTravelHours() {
      const total = parseTravelLeg('f-travel-to-site') + parseTravelLeg('f-travel-to-shop');
      document.getElementById('f-travel-hours').textContent = total.toFixed(2);
    }

    // ── Load supervisors + jobs ───────────────────────────────────────────
    async function loadSupervisors() {
      try {
        const res = await fetch('/api/timesheet-supervisors', { headers: authHeaders() });
        const data = await res.json();
        supervisors = Array.isArray(data.supervisors) ? data.supervisors : [];
      } catch { supervisors = []; }
      const opts = '<option value="">— pick —</option>' +
        supervisors.map(s => `<option value="${s.id}" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join('');
      document.getElementById('f-supervisor').innerHTML = opts;
      document.getElementById('f-off-supervisor').innerHTML = opts;
    }

    // Which job load is the current one, per block. Two divisions picked in
    // quick succession are two loads in flight, and whichever answers LAST used
    // to win — leaving the job picker listing one division's jobs while the
    // division picker beside it reads another. Pick from that list and the
    // entry goes in as, say, a turf day on a paving project, which approval
    // then injects into turf's cost tracking. So each load takes a ticket and
    // drops its result if a newer one has been issued since.
    let jobLoadToken = {};   // block index → id of that block's newest load

    async function onDivisionChange(i = 0) {
      const div = bel(i, 'division').value;
      const jobSel = bel(i, 'job');
      const token = jobLoadToken[i] = (jobLoadToken[i] || 0) + 1;
      const stale = () => jobLoadToken[i] !== token || !document.getElementById(bid(i, 'job'));
      // Trucking-only Unit + Description fields ride alongside the job picker.
      const truckWrap = bel(i, 'truckingFields');
      if (truckWrap) truckWrap.style.display = (div === 'trucking') ? 'flex' : 'none';
      onJobChange(i);
      if (!div) {
        jobSel.innerHTML = '<option value="">— pick division first —</option>';
        jobSel.disabled = true;
        return;
      }
      jobSel.innerHTML = '<option value="">Loading jobs…</option>';
      jobSel.disabled = true;
      try {
        if (!jobsCache[div]) {
          const res = await fetch('/api/timesheet-jobs?division=' + encodeURIComponent(div), {
            headers: authHeaders(),
          });
          const data = await res.json();
          jobsCache[div] = Array.isArray(data.jobs) ? data.jobs : [];
        }
        // A newer pick is already loading (or the block has been removed) —
        // leave the picker to whoever owns it now.
        if (stale()) return;
        const jobs = jobsCache[div];
        if (!jobs.length) {
          jobSel.innerHTML = '<option value="">(no active jobs)</option>';
          jobSel.disabled = true;
          return;
        }
        jobSel.innerHTML = '<option value="">— pick —</option>' +
          jobs.map(j => `<option value="${escapeHtml(j.id)}" data-label="${escapeHtml(j.label)}">${escapeHtml(j.label)}</option>`).join('');
        jobSel.disabled = false;
      } catch (err) {
        if (stale()) return;
        jobSel.innerHTML = '<option value="">(error loading)</option>';
        jobSel.disabled = true;
      }
      if (stale()) return;
      onJobChange(i);
    }

    // The two standing EES activities, as minted by api/timesheet-jobs.js.
    // Picking either one under Dust Control reveals the EES detail fields that
    // the division's "EES Other" tab is built from.
    const EES_JOB_IDS = ['ees:preloading', 'ees:washing'];

    function isEesSelection(i = 0) {
      return bel(i, 'division').value === 'dust'
          && EES_JOB_IDS.includes(bel(i, 'job').value);
    }

    function onJobChange(i = 0) {
      const wrap = bel(i, 'eesFields');
      if (wrap) wrap.style.display = isEesSelection(i) ? 'flex' : 'none';
    }

    // ── Entries list ──────────────────────────────────────────────────────
    // Default window covers the current pay period (Mon of last week through
    // Sun of this week — 14 days) so a field worker isn't scrolling through
    // months of history. Drafts are always loaded regardless of date so
    // unfinished work never silently disappears. The "Show older entries"
    // button lifts the cap on demand.
    let scopeUnbounded = false;

    function payPeriodWindow() {
      const today = new Date();
      const dayOfWeek = today.getDay();              // 0=Sun..6=Sat
      const offsetToMonday = (dayOfWeek + 6) % 7;    // Mon=0, ..., Sun=6
      const thisMon = new Date(today);
      thisMon.setDate(today.getDate() - offsetToMonday);
      thisMon.setHours(0, 0, 0, 0);
      const from = new Date(thisMon); from.setDate(thisMon.getDate() - 7);   // Mon last week
      const to   = new Date(thisMon); to.setDate(thisMon.getDate() + 6);     // Sun this week
      return { from, to };
    }

    function ymd(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }

    // Fetch one slice of the entries list. Resolves to { entries: [...] }
    // on success, or { error: '...' } on any failure (network, non-2xx,
    // non-JSON body). Never throws — callers can branch on the result so
    // a single broken slice doesn't blank the whole list.
    async function fetchEntriesSlice(url, label) {
      try {
        const res = await fetch(url, { headers: authHeaders() });
        let body = null;
        try { body = await res.json(); } catch { /* non-JSON body */ }
        if (!res.ok) {
          const msg = (body && body.error) || `HTTP ${res.status}`;
          console.error(`[timesheet] ${label} failed:`, msg, body);
          return { error: msg };
        }
        return { entries: Array.isArray(body && body.entries) ? body.entries : [] };
      } catch (err) {
        console.error(`[timesheet] ${label} threw:`, err);
        return { error: err && err.message ? err.message : 'network error' };
      }
    }

    async function loadEntries() {
      const list  = document.getElementById('entriesList');
      const scope = document.getElementById('entriesScope');
      const btn   = document.getElementById('toggleScopeBtn');
      list.innerHTML = '<div class="entry-empty">Loading…</div>';

      let entries = [];
      let failures = [];

      if (scopeUnbounded) {
        const r = await fetchEntriesSlice('/api/timesheet-entries', 'all-entries');
        if (r.error) failures.push(r.error); else entries = r.entries;
        scope.textContent = 'All entries';
        if (btn) { btn.textContent = 'Show recent only'; btn.style.display = ''; }
      } else {
        const { from, to } = payPeriodWindow();
        const fromS = ymd(from), toS = ymd(to);
        // Drafts always show — a forgotten draft from an earlier window
        // would otherwise become invisible to the field worker.
        const [draftsR, recentR] = await Promise.all([
          fetchEntriesSlice('/api/timesheet-entries?status=draft', 'drafts'),
          fetchEntriesSlice(`/api/timesheet-entries?status=submitted_approved&from=${fromS}&to=${toS}`, 'recent'),
        ]);
        const byId = new Map();
        if (draftsR.error) failures.push(`drafts: ${draftsR.error}`);
        else for (const e of draftsR.entries) byId.set(e.id, e);
        if (recentR.error) failures.push(`recent: ${recentR.error}`);
        else for (const e of recentR.entries) if (!byId.has(e.id)) byId.set(e.id, e);
        entries = Array.from(byId.values());
        scope.textContent = `${fmtScopeDate(from)} – ${fmtScopeDate(to)} (+ all drafts)`;
        if (btn) { btn.textContent = 'Show older entries'; btn.style.display = ''; }
      }

      entries.sort((a, b) => (b.work_date || '').localeCompare(a.work_date || ''));
      entriesCache = entries;

      try {
        renderEntries();
      } catch (err) {
        console.error('[timesheet] renderEntries threw:', err);
        failures.push(`render: ${err && err.message ? err.message : 'render error'}`);
      }

      // Surface a non-empty failure note BELOW any rows we did manage to
      // load, so the worker still sees their drafts even if (say) the
      // pay-period slice timed out.
      if (failures.length) {
        const note = `<div class="entry-empty">Couldn't load some entries (${escapeHtml(failures.join('; '))}).</div>`;
        if (!entriesCache.length) list.innerHTML = note;
        else list.insertAdjacentHTML('beforeend', note);
      }
    }

    function fmtScopeDate(d) {
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function toggleScope() {
      scopeUnbounded = !scopeUnbounded;
      loadEntries();
    }

    function renderEntries() {
      const list = document.getElementById('entriesList');
      if (!entriesCache.length) {
        list.innerHTML = '<div class="entry-empty">No entries yet. Use the form above to submit your first one.</div>';
        return;
      }
      list.innerHTML = entriesCache.map(e => {
        const isDraft = e.status === 'draft';
        const meta = e.entry_type === 'time_off'
          ? `Time Off — ${prettyOffType(e.time_off_type)}`
          : `${prettyDivision(e.division)} · ${escapeHtml(e.job_label || '')}${e.start_time && e.end_time ? ` · ${e.start_time}–${e.end_time}` : ''}`;
        const hoursParts = [];
        if (e.entry_type === 'daily' && e.computed_hours != null) hoursParts.push(`${Number(e.computed_hours).toFixed(2)} h`);
        if (e.entry_type === 'daily' && e.travel_hours != null && e.travel_hours > 0) hoursParts.push(`+${Number(e.travel_hours).toFixed(2)} h travel`);
        const hours = hoursParts.join(' ');
        const audit = entryAuditLine(e);
        // One job of a split day. Says so on the card, otherwise two entries on
        // the same date read as an accidental double submission.
        const split = splitLabel(e)
          ? `<span class="badge badge-split">${escapeHtml(splitLabel(e))}</span>` : '';
        return `
          <div class="entry ${isDraft ? 'draft' : ''}" ${isDraft ? `onclick="editEntry('${e.id}')"` : ''}>
            <div class="entry-head">
              <div class="entry-date">${prettyDate(e.work_date)}</div>
              <div style="display:flex;align-items:center;gap:0.35rem">
                ${split}
                <span class="badge badge-${e.status}">${e.status}</span>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;gap:0.6rem;align-items:flex-end">
              <div class="entry-meta">${meta}</div>
              ${hours ? `<div class="entry-hours">${hours}</div>` : ''}
            </div>
            ${audit ? `<div class="entry-audit">${audit}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // "Split 1/2" for an entry that was one job of a multi-job day, '' for an
    // ordinary entry. split_count is what the group was at submission time —
    // it stays put if a sibling is later deleted, because it is describing how
    // the day was reported, not how many rows survive.
    function splitLabel(e) {
      if (!e || !e.split_group_id) return '';
      const idx = Number(e.split_index), cnt = Number(e.split_count);
      if (!Number.isFinite(idx) || !Number.isFinite(cnt) || cnt < 2) return '';
      return `Split ${idx}/${cnt}`;
    }

    function entryAuditLine(e) {
      if (!e || e.status === 'draft') return '';
      const sub = fmtTs(e.submitted_at);
      const app = fmtTs(e.approved_at);
      const bits = [];
      if (sub) bits.push(`Submitted ${sub}`);
      if (e.status === 'approved' && app) bits.push(`Approved ${app} by ${escapeHtml(e.approved_by_name || '—')}`);
      return bits.join(' · ');
    }

    function fmtTs(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString(undefined, {
        month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit',
      });
    }

    function prettyDate(s) {
      if (!s) return '';
      const d = new Date(s + 'T00:00:00');
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function prettyDivision(d) {
      if (!d) return '';
      if (d === 'kiewit') return 'Kiewit Pinetree';
      return d.charAt(0).toUpperCase() + d.slice(1);
    }
    function prettyOffType(t) {
      if (!t) return '';
      const map = { vacation: 'Vacation', sick: 'Sick', jury_duty: 'Jury Duty', bereavement: 'Bereavement', holiday: 'Holiday' };
      return map[t] || t;
    }

    // ── Edit a draft ──────────────────────────────────────────────────────
    // Every draft of a split day is a separate row, so tapping any one of them
    // pulls the whole group back onto the form as job blocks. Loading only the
    // row that was tapped would silently drop the day's other jobs the next
    // time it was saved.
    function draftGroupFor(e) {
      if (!e || e.entry_type !== 'daily' || !e.split_group_id) return [e];
      const group = entriesCache.filter(x =>
        x.entry_type === 'daily' &&
        x.status === 'draft' &&
        x.split_group_id &&
        x.split_group_id === e.split_group_id);
      if (group.length < 2) return [e];
      return group.sort((a, b) => (Number(a.split_index) || 0) - (Number(b.split_index) || 0));
    }

    // Which load of the form is the current one. Loading a draft is async — it
    // waits on that job's list — and everything it touches is shared: the date,
    // the supervisor, the blocks, and editingIds, which decides WHICH rows the
    // next save updates. Tapping a second card before the first finished used
    // to leave both halfway in, and a save then wrote one day's shared fields
    // over the other day's row: a job silently moved to the wrong date. So each
    // load takes a ticket and stops the moment a newer one is issued.
    let editToken = 0;

    // Fill one job block from an entry: division, job, the division-specific
    // extras, the clock and the equipment answer.
    async function fillBlockFromEntry(i, e) {
      const token = editToken;
      bel(i, 'division').value = e.division || '';
      await onDivisionChange(i);
      // Superseded while the job list was loading, or the block is gone.
      if (token !== editToken || !bel(i, 'job')) return;
      const jobSel = bel(i, 'job');
      if (e.job_id && ![...jobSel.options].some(o => String(o.value) === String(e.job_id))) {
        // Job no longer in the active list — keep it as a synthetic option so
        // the draft still shows it (and can be re-saved) instead of blanking.
        const opt = document.createElement('option');
        opt.value = e.job_id;
        opt.textContent = e.job_label || e.job_id;
        opt.dataset.label = e.job_label || '';
        opt.selected = true;
        jobSel.appendChild(opt);
      } else {
        jobSel.value = e.job_id || '';
      }
      bel(i, 'truck-unit').value = e.truck_unit || '';
      bel(i, 'truck-desc').value = e.truck_description || '';
      bel(i, 'ees-unit').value       = e.ees_unit || '';
      bel(i, 'ees-customer').value   = e.ees_customer || '';
      bel(i, 'ees-location').value   = e.ees_location || '';
      bel(i, 'ees-name').value       = e.ees_name || '';
      bel(i, 'ees-job-number').value = e.ees_job_number || '';
      bel(i, 'ees-billing').value    = e.ees_billing || 'Non-Billable';
      onJobChange(i);
      bel(i, 'start').value = e.start_time || '';
      bel(i, 'end').value   = e.end_time   || '';
      if (e.operated_equipment === true || e.operated_equipment === false) setSeg('equip', e.operated_equipment, i);
      else clearSeg('equip', i);
      updateHours(i);
    }

    async function editEntry(id) {
      const e = entriesCache.find(x => x.id === id);
      if (!e) return;
      // Not while the form is writing. resetForm() below clears editingIds,
      // and a write loop that loses those mid-flight stops recognising the
      // rows it already created — so it posts the rest of the day again.
      if (formWriting) {
        const busy = document.getElementById('formMsg');
        busy.className = 'msg error';
        busy.textContent = 'Still saving — try that again in a moment.';
        return;
      }
      const token = ++editToken;
      resetForm();

      setType(e.entry_type);
      if (e.entry_type === 'daily') {
        const group = draftGroupFor(e);
        const first = group[0], last = group[group.length - 1];
        currentGroupId = group.length > 1 ? (first.split_group_id || null) : null;

        document.getElementById('f-date').value = first.work_date || '';
        // Travel is one round trip for the day: the drive out is stored on the
        // first job, the drive back on the last. Read them from the same ends.
        document.getElementById('f-travel-to-site').value = first.travel_to_site_hours != null ? first.travel_to_site_hours : '';
        document.getElementById('f-travel-to-shop').value = last.travel_to_shop_hours != null ? last.travel_to_shop_hours : '';
        updateTravelHours();
        // Lunch rides on the first job, for the same reason.
        if (first.lunch_break === true || first.lunch_break === false) setSeg('lunch', first.lunch_break);
        else clearSeg('lunch');

        // Block 0 takes the first job; every other job gets its own block.
        editingIds[0] = first.id;
        loadedTags[0] = splitTagOf(first);
        await fillBlockFromEntry(0, first);
        if (token !== editToken) return;
        for (const g of group.slice(1)) {
          const i = addJobBlock(false);
          if (i == null) break;
          editingIds[i] = g.id;
          loadedTags[i] = splitTagOf(g);
          await fillBlockFromEntry(i, g);
          if (token !== editToken) return;
        }
        renderSplitChrome();

        const tsSupSel = document.getElementById('f-supervisor');
        if (first.supervisor_id && ![...tsSupSel.options].some(o => String(o.value) === String(first.supervisor_id))) {
          // Supervisor no longer in the list — keep it as a synthetic option so
          // the draft still shows it (and can be re-saved) instead of blanking.
          const opt = document.createElement('option');
          opt.value = first.supervisor_id;
          opt.textContent = first.supervisor_name || first.supervisor_id;
          opt.dataset.name = first.supervisor_name || '';
          opt.selected = true;
          tsSupSel.appendChild(opt);
        } else {
          tsSupSel.value = first.supervisor_id || '';
        }
        document.getElementById('f-notes').value = first.notes || '';
        markAsDraft();
      } else {
        editingIds[0] = e.id;
        markAsDraft();
        offType = e.time_off_type || null;
        document.querySelectorAll('#off-pills .pill').forEach(p => {
          p.classList.toggle('active', p.dataset.val === offType);
        });
        document.getElementById('f-off-date').value = e.work_date || '';
        const offSupSel = document.getElementById('f-off-supervisor');
        if (e.supervisor_id && ![...offSupSel.options].some(o => String(o.value) === String(e.supervisor_id))) {
          // Supervisor no longer in the list — keep it as a synthetic option so
          // the draft still shows it (and can be re-saved) instead of blanking.
          const opt = document.createElement('option');
          opt.value = e.supervisor_id;
          opt.textContent = e.supervisor_name || e.supervisor_id;
          opt.dataset.name = e.supervisor_name || '';
          opt.selected = true;
          offSupSel.appendChild(opt);
        } else {
          offSupSel.value = e.supervisor_id || '';
        }
        document.getElementById('f-off-notes').value = e.notes || '';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      editingIds = {};
      loadedTags = {};
      currentGroupId = null;
      clearSplits();
      document.getElementById('formTitle').textContent = 'New Entry';
      document.getElementById('formBadge').style.display = 'none';
      document.getElementById('row-delete').style.display = 'none';
      setType('daily');
      document.getElementById('f-date').value     = todayStr();
      document.getElementById('f-division').value = '';
      const jobSel = document.getElementById('f-job');
      jobSel.innerHTML = '<option value="">— pick division first —</option>';
      jobSel.disabled = true;
      document.getElementById('f-truck-unit').value = '';
      document.getElementById('f-truck-desc').value = '';
      document.getElementById('f-ees-unit').value       = '';
      document.getElementById('f-ees-customer').value   = '';
      document.getElementById('f-ees-location').value   = '';
      document.getElementById('f-ees-name').value       = '';
      document.getElementById('f-ees-job-number').value = '';
      document.getElementById('f-ees-billing').value    = 'Non-Billable';
      onJobChange();
      document.getElementById('truckingFields').style.display = 'none';
      document.getElementById('f-travel-to-site').value = '';
      document.getElementById('f-travel-to-shop').value = '';
      updateTravelHours();
      document.getElementById('f-start').value = '';
      document.getElementById('f-end').value   = '';
      updateHours();
      clearSeg('lunch');
      clearSeg('equip');
      renderSplitChrome();
      document.getElementById('f-supervisor').value = '';
      document.getElementById('f-notes').value = '';
      offType = null;
      document.querySelectorAll('#off-pills .pill').forEach(p => p.classList.remove('active'));
      document.getElementById('f-off-date').value = todayStr();
      document.getElementById('f-off-supervisor').value = '';
      document.getElementById('f-off-notes').value = '';
      document.getElementById('formMsg').textContent = '';
    }

    // ── Build payloads from current form state ────────────────────────────
    // One payload per job block, in display order. A day on a single job is
    // still a list — of one — so save and submit have exactly one path to walk
    // and a split day can't take a different one.
    //
    // Returns { list: [{ block, label, data }] } or { error }.

    // The tag that ties a split day's rows together. Minted once and kept for
    // the life of the form so re-saving doesn't re-group the same rows under a
    // new id. A single-job form carries the tag it was loaded with (a survivor
    // of a part-submitted split keeps saying which day it came from) and
    // otherwise carries none.
    function splitTagOf(e) {
      return e && e.split_group_id
        ? { group_id: e.split_group_id, index: Number(e.split_index) || null, count: Number(e.split_count) || null }
        : null;
    }
    function mintGroupId() {
      return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function splitTagFor(blockIdx, position, total) {
      if (total > 1) {
        if (!currentGroupId) currentGroupId = mintGroupId();
        return { split_group_id: currentGroupId, split_index: position + 1, split_count: total };
      }
      const loaded = loadedTags[blockIdx];
      return loaded && loaded.group_id && loaded.count > 1
        ? { split_group_id: loaded.group_id, split_index: loaded.index, split_count: loaded.count }
        : { split_group_id: null, split_index: null, split_count: null };
    }

    function buildPayloads() {
      if (currentType === 'time_off') {
        if (!offType) return { error: 'Pick a time-off type.' };
        const d = document.getElementById('f-off-date').value;
        if (!d) return { error: 'Pick a date.' };
        const offSupSel = document.getElementById('f-off-supervisor');
        const offSupId  = offSupSel.value;
        if (!offSupId) return { error: 'Pick a supervisor.' };
        const offSupOpt = offSupSel.options[offSupSel.selectedIndex];
        const offSupName = offSupOpt ? offSupOpt.dataset.name || offSupOpt.textContent : '';
        return { list: [{ block: 0, label: 'Time off', data: {
          entry_type: 'time_off',
          work_date: d,
          time_off_type: offType,
          supervisor_id: offSupId,
          supervisor_name: offSupName,
          notes: document.getElementById('f-off-notes').value || '',
        }}]};
      }

      // ── Day-level fields, shared by every job block ──
      const d = document.getElementById('f-date').value;
      if (!d) return { error: 'Pick a date.' };
      if (lunchVal == null) return { error: 'Lunch break? Yes or No.' };
      const supSel = document.getElementById('f-supervisor');
      const supId  = supSel.value;
      if (!supId) return { error: 'Pick a supervisor.' };
      const supOpt = supSel.options[supSel.selectedIndex];
      const supName = supOpt ? supOpt.dataset.name || supOpt.textContent : '';
      // Travel legs are optional decimal hours. Empty inputs are sent as
      // empty strings; the API treats them as null.
      const travelToSite = document.getElementById('f-travel-to-site').value;
      const travelToShop = document.getElementById('f-travel-to-shop').value;
      const notes = document.getElementById('f-notes').value || '';

      // ── Per-job blocks ──
      const order = blockOrder();
      const split = order.length > 1;
      // On a single-job form the messages read exactly as they always have; on
      // a split day they have to say WHICH job is missing something.
      const at = (i, m) => split
        ? `${blockName(i)}: ${m.charAt(0).toLowerCase()}${m.slice(1)}`
        : m;

      const blocks = [];
      for (const i of order) {
        const div = bel(i, 'division').value;
        if (!div) return { error: at(i, 'Pick a division.') };
        const jobSel = bel(i, 'job');
        const jobId = jobSel.value;
        if (!jobId) return { error: at(i, 'Pick a job.') };
        const jobOpt = jobSel.options[jobSel.selectedIndex];
        const jobLabel = jobOpt ? jobOpt.dataset.label || jobOpt.textContent : '';
        const start = bel(i, 'start').value;
        const end   = bel(i, 'end').value;
        if (!start || !end) return { error: at(i, 'Pick start and end times.') };
        // A start equal to its end is 0 hours. The server refuses it too, but
        // only after the earlier blocks have already been written out as
        // drafts, and its message can't say which job is wrong. Catching it
        // here keeps a bad clock from leaving half a day saved, and is what
        // lets overlappingBlocks below assume every span has real length —
        // a zero-length span slips past that check when it sits after the
        // other jobs, and reads as an overlap when it sits inside one.
        if (spanMinutes(start, end) <= 0) {
          return { error: at(i, 'Start and end times are the same — that comes to 0 hours.') };
        }
        if (equipVals[i] == null) return { error: at(i, 'Operated equipment? Yes or No.') };
        blocks.push({ i, div, jobId, jobLabel, start, end, equip: equipVals[i] });
      }

      // Two jobs can't be worked at the same moment, and a day that adds up to
      // more than 24 hours is a typo. Both are caught here rather than after
      // half the rows have already been written.
      if (split) {
        const clash = overlappingBlocks(blocks);
        if (clash) {
          return { error: `${blockName(clash[0].i)} and ${blockName(clash[1].i)} cover the same time. Check the start and end times.` };
        }
        const totalMins = blocks.reduce((s, b) => s + (spanMinutes(b.start, b.end) || 0), 0);
        if (totalMins > 24 * 60) {
          return { error: `Those jobs add up to ${(totalMins / 60).toFixed(2)} hours — more than one day.` };
        }
      }

      const list = blocks.map((b, pos) => {
        const isEes  = isEesSelection(b.i);
        const eesVal = key => isEes ? (bel(b.i, key).value || '').trim() : '';
        // Trucking-only extras (Unit + Description). Sent only for the trucking
        // division; the server ignores/nulls them for every other division.
        const truckUnit = b.div === 'trucking' ? (bel(b.i, 'truck-unit').value || '').trim() : '';
        const truckDesc = b.div === 'trucking' ? (bel(b.i, 'truck-desc').value || '').trim() : '';
        return {
          block: b.i,
          label: blockName(b.i),
          data: Object.assign({
            entry_type: 'daily',
            work_date: d,
            division: b.div,
            job_id: b.jobId,
            job_label: b.jobLabel,
            start_time: b.start,
            end_time:   b.end,
            // One round trip, not one per job: the drive out belongs to the
            // first job of the day and the drive back to the last. Sending
            // both on every row would pay the same travel two or three times.
            travel_to_site_hours: pos === 0 ? travelToSite : '',
            travel_to_shop_hours: pos === blocks.length - 1 ? travelToShop : '',
            // Same reasoning for lunch: one break, deducted once, from the
            // first job. The others record that no break fell inside them.
            lunch_break: pos === 0 ? lunchVal : false,
            operated_equipment: b.equip,
            supervisor_id: supId,
            supervisor_name: supName,
            // Repeated on every row on purpose — payroll reads these entries
            // one at a time, and a note only the first row carried would be
            // invisible on the others.
            notes,
            truck_unit: truckUnit,
            truck_description: truckDesc,
            ees_unit:       eesVal('ees-unit'),
            ees_customer:   eesVal('ees-customer'),
            ees_location:   eesVal('ees-location'),
            ees_name:       eesVal('ees-name'),
            ees_job_number: eesVal('ees-job-number'),
            ees_billing:    isEes ? (bel(b.i, 'ees-billing').value || 'Non-Billable') : '',
          }, splitTagFor(b.i, pos, blocks.length)),
        };
      });

      return { list };
    }

    // First pair of blocks whose on-site spans overlap, or null. Each span is
    // laid out on a single timeline in minutes; an end that reads earlier than
    // its start is an overnight shift and runs past midnight, the same way
    // spanMinutes() treats it. Every span has real length by the time this
    // runs — buildPayloads rejects a start equal to its end first, because a
    // zero-length span both slips this check and trips it, depending only on
    // where the other jobs happen to sit.
    //
    // Deliberately not exhaustive once a block runs past midnight: 22:00–02:00
    // followed by 01:00–03:00 is not flagged, because a block on the same
    // work_date reading 01:00 could equally be that morning, before the night
    // shift began. Nothing on the form says which, so guessing would refuse
    // real days to catch a rare one. This is the same latitude the field has
    // always had submitting two entries by hand; what it does catch is the
    // mistake splitting actually invites — the second job left sitting on the
    // first one's clock.
    function overlappingBlocks(blocks) {
      const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
      const spans = blocks.map(b => {
        const s = toMin(b.start);
        const e = toMin(b.end);
        return { b, s, e: e > s ? e : e + 24 * 60 };
      });
      for (let x = 0; x < spans.length; x++) {
        for (let y = x + 1; y < spans.length; y++) {
          if (spans[x].s < spans[y].e && spans[y].s < spans[x].e) return [spans[x].b, spans[y].b];
        }
      }
      return null;
    }

    // ── Save / submit / delete ────────────────────────────────────────────
    // The rows this form is currently sitting on. Empty = nothing written yet.
    function savedIds() { return Object.values(editingIds).filter(Boolean); }

    // One write at a time, across ALL of the buttons that write. A block is
    // only pinned to its row once its write comes back, so a Save still in
    // flight when Submit is pressed finds nothing pinned and posts every block
    // a second time. Disabling one button never covered it — the presses are on
    // different buttons — and the window is as long as the whole day takes to
    // write, which on a split is one round trip per job.
    let formWriting = false;
    function beginWrite() {
      if (formWriting) return false;
      formWriting = true;
      for (const id of ['btn-save', 'btn-submit', 'btn-add-split']) {
        document.getElementById(id).disabled = true;
      }
      return true;
    }
    function endWrite() {
      formWriting = false;
      document.getElementById('btn-save').disabled = false;
      document.getElementById('btn-submit').disabled = false;
      renderSplitChrome();   // re-enables the add button unless we're at the cap
    }

    async function saveDraft() {
      const { list, error } = buildPayloads();
      const msg = document.getElementById('formMsg');
      msg.className = 'msg';
      if (error) { msg.textContent = error; msg.classList.add('error'); return; }
      if (!beginWrite()) return;

      try {
        for (const item of list) await writeEntry(item.data, item.block);
        msg.textContent = list.length > 1
          ? `Saved ${list.length} draft entries — one per job.`
          : 'Saved as draft.';
        msg.classList.add('success');
        markAsDraft();
        await loadEntries();
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.add('error');
        await loadEntries();
      } finally {
        endWrite();
      }
    }

    async function submitEntry() {
      const { list, error } = buildPayloads();
      const msg = document.getElementById('formMsg');
      msg.className = 'msg';
      if (error) { msg.textContent = error; msg.classList.add('error'); return; }

      const confirmText = list.length > 1
        ? `Submit ${list.length} entries — one for each job? You won't be able to edit them after this — only an admin can.`
        : "Submit this entry? You won't be able to edit it after this — only an admin can.";
      if (!confirm(confirmText)) return;
      if (!beginWrite()) return;

      try {
        // Write every block out as a draft first. Each write adopts the row it
        // just created BEFORE anything else runs — without that, a submit that
        // failed left the form full but pinned to nothing, so pressing Submit
        // again POSTed a second draft instead of retrying the first. That is
        // how one day's work lands on the list several times over.
        for (const item of list) await writeEntry(item.data, item.block);
        markAsDraft();

        // Then submit them, one at a time. A block that fails stays a draft and
        // is named in the message; the ones that went through are gone from the
        // form so a second press can't re-post them.
        const problems = [];
        let submitted = 0;
        for (const item of list) {
          const rowId = editingIds[item.block];
          if (!rowId) continue;
          try {
            const res = await fetch('/api/timesheet-entries?action=submit&id=' + encodeURIComponent(rowId), {
              method: 'POST', headers: authHeaders(),
            });
            const j = await res.json();
            if (!res.ok || !j.ok) {
              const e = new Error(j.error || 'Submit failed');
              // 409 = the day is already covered by another entry. That is not
              // a retry — pressing Submit again can only fail the same way, and
              // the server's message already says to drop this draft instead.
              e.noRetry = res.status === 409;
              throw e;
            }
            delete editingIds[item.block];   // no longer a draft this form owns
            submitted++;
          } catch (err) {
            problems.push({ label: item.label, err });
          }
        }

        const detail = problems
          .map(p => (list.length > 1 ? `${p.label}: ${p.err.message}` : p.err.message))
          .join(' · ');

        // resetForm() clears the message box, so anything worth saying has to
        // be said after it — otherwise the worker gets a blank form and no
        // confirmation that their day went in at all.
        if (!problems.length) {
          resetForm();
          msg.className = 'msg success';
          msg.textContent = list.length > 1 ? `Submitted ${submitted} entries ✓` : 'Submitted ✓';
        } else if (submitted === 0) {
          // Nothing went through, so every row is still a draft this form is
          // pinned to — leave it up and let them press Submit again.
          msg.textContent = problems.some(p => !p.err.noRetry)
            ? `${detail} — saved as ${list.length > 1 ? 'drafts' : 'a draft'} below; press Submit to try again.`
            : detail;
          msg.classList.add('error');
        } else {
          // Some rows are submitted and must not be re-posted, so the form has
          // to let go of them — and once it has, it cannot keep the failures
          // either. They are drafts in the list below; tapping one loads the
          // day's remaining jobs back in to retry.
          resetForm();
          msg.className = 'msg error';
          msg.textContent = `${submitted} of ${list.length} submitted. ${detail} `
            + '— the rest are saved as drafts below; tap one to try again.';
        }
        await loadEntries();
      } catch (err) {
        // Say where the work went. "Submit failed" over a form that still
        // looks unsaved is what makes people press the button again.
        msg.textContent = savedIds().length
          ? `${err.message} — what saved is in the drafts below; press Submit to try again.`
          : err.message;
        msg.classList.add('error');
        await loadEntries();
      } finally {
        endWrite();
      }
    }

    // Put the form into "editing an existing draft" state — titled, badged and
    // deletable. Which rows it is pinned to lives in editingIds, one per job
    // block, so the next write updates those rows rather than creating more.
    function markAsDraft() {
      document.getElementById('formTitle').textContent = 'Edit Draft';
      const badge = document.getElementById('formBadge');
      badge.textContent = 'draft';
      badge.className = 'badge badge-draft';
      badge.style.display = '';
      document.getElementById('row-delete').style.display = '';
    }

    async function deleteDraft() {
      const ids = savedIds();
      if (!ids.length) return;
      if (!confirm(ids.length > 1
        ? `Delete all ${ids.length} draft entries for this day? This cannot be undone.`
        : 'Delete this draft entry? This cannot be undone.')) return;
      if (!beginWrite()) return;
      const failed = [];
      try {
        for (const rowId of ids) {
          try {
            const res = await fetch('/api/timesheet-entries?id=' + encodeURIComponent(rowId), {
              method: 'DELETE', headers: authHeaders(),
            });
            const j = await res.json();
            if (!res.ok || !j.ok) throw new Error(j.error || 'Delete failed');
          } catch (err) {
            failed.push(err.message);
          }
        }
        resetForm();
        await loadEntries();
      } finally {
        endWrite();
      }
      if (failed.length) {
        const msg = document.getElementById('formMsg');
        msg.className = 'msg error';
        msg.textContent = `Some drafts could not be deleted (${failed.join('; ')}). They are still in the list below.`;
      }
    }

    async function writeEntry(data, blockIdx = 0) {
      const rowId = editingIds[blockIdx];
      let res;
      if (rowId) {
        res = await fetch('/api/timesheet-entries?id=' + encodeURIComponent(rowId), {
          method: 'PUT', headers: authHeaders(true), body: JSON.stringify(data),
        });
      } else {
        res = await fetch('/api/timesheet-entries', {
          method: 'POST', headers: authHeaders(true), body: JSON.stringify(data),
        });
      }
      const j = await res.json();
      if (!res.ok || !j.ok) throw new Error(j.error || 'Save failed');
      // Adopt the row immediately so a failure on the NEXT block leaves this
      // one pinned — a retry updates it instead of posting a duplicate.
      editingIds[blockIdx] = j.entry.id;
      return j.entry;
    }

    function authHeaders(json) {
      const h = { Authorization: `Bearer ${token}` };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }

    function goToDivisions() {
      window.location.replace('divisions.html');
    }
    function signOut() {
      localStorage.removeItem('fct_token');
      localStorage.removeItem('fct_user');
      localStorage.removeItem('fct_division');
      window.location.replace('index.html');
    }
  </script>
</body>
</html>
