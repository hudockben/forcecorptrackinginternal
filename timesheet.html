      const app = fmtTs(e.approved_at);
      const bits = [];
      if (sub) bits.push(`Submitted ${sub}`);
      if (e.status === 'approved' && app) bits.push(`Approved ${app} by ${escapeHtml(e.approved_by_name || '—')}`);
      return bits.join(' · ');
    }

    function fmtTs(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString(undefined, {
        month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit',
      });
    }

    function prettyDate(s) {
      if (!s) return '';
      const d = new Date(s + 'T00:00:00');
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function prettyDivision(d) {
      if (!d) return '';
      if (d === 'kiewit') return 'Kiewit Pinetree';
      if (d === 'dust')   return 'Dust Control';
      return d.charAt(0).toUpperCase() + d.slice(1);
    }
    function prettyOffType(t) {
      if (!t) return '';
      const map = { vacation: 'Vacation', sick: 'Sick', jury_duty: 'Jury Duty', bereavement: 'Bereavement', holiday: 'Holiday' };
      return map[t] || t;
    }

    // ── Edit a draft ──────────────────────────────────────────────────────
    // Every draft of a split day is a separate row, so tapping any one of them
    // pulls the whole group back onto the form as job blocks. Loading only the
    // row that was tapped would silently drop the day's other jobs the next
    // time it was saved.
    function draftGroupFor(e) {
      if (!e || e.entry_type !== 'daily' || !e.split_group_id) return [e];
      const group = entriesCache.filter(x =>
        x.entry_type === 'daily' &&
        x.status === 'draft' &&
        x.split_group_id &&
        x.split_group_id === e.split_group_id);
      if (group.length < 2) return [e];
      return group.sort((a, b) => (Number(a.split_index) || 0) - (Number(b.split_index) || 0));
    }

    // Which load of the form is the current one. Loading a draft is async — it
    // waits on that job's list — and everything it touches is shared: the date,
    // the supervisor, the blocks, and editingIds, which decides WHICH rows the
    // next save updates. Tapping a second card before the first finished used
    // to leave both halfway in, and a save then wrote one day's shared fields
    // over the other day's row: a job silently moved to the wrong date. So each
    // load takes a ticket and stops the moment a newer one is issued.
    let editToken = 0;

    // Fill one job block from an entry: division, job, the division-specific
    // extras, the clock and the equipment answer.
    async function fillBlockFromEntry(i, e) {
      const token = editToken;
      bel(i, 'division').value = e.division || '';
      await onDivisionChange(i);
      // Superseded while the job list was loading, or the block is gone.
      if (token !== editToken || !bel(i, 'job')) return;
      const jobSel = bel(i, 'job');
      if (e.job_id && ![...jobSel.options].some(o => String(o.value) === String(e.job_id))) {
        // Job no longer in the active list — keep it as a synthetic option so
        // the draft still shows it (and can be re-saved) instead of blanking.
        const opt = document.createElement('option');
        opt.value = e.job_id;
        opt.textContent = e.job_label || e.job_id;
        opt.dataset.label = e.job_label || '';
        opt.selected = true;
        jobSel.appendChild(opt);
      } else {
        jobSel.value = e.job_id || '';
      }
      bel(i, 'truck-unit').value = e.truck_unit || '';
      bel(i, 'truck-desc').value = e.truck_description || '';
      bel(i, 'ees-unit').value       = e.ees_unit || '';
      bel(i, 'ees-customer').value   = e.ees_customer || '';
      bel(i, 'ees-location').value   = e.ees_location || '';
      bel(i, 'ees-name').value       = e.ees_name || '';
      bel(i, 'ees-job-number').value = e.ees_job_number || '';
      bel(i, 'ees-billing').value    = e.ees_billing || 'Non-Billable';
      onJobChange(i);
      bel(i, 'travel-in').value = e.travel_to_site_hours != null ? e.travel_to_site_hours : '';
      updateTravelHours();
      bel(i, 'start').value = e.start_time || '';
      bel(i, 'end').value   = e.end_time   || '';
      if (e.operated_equipment === true || e.operated_equipment === false) setSeg('equip', e.operated_equipment, i);
      else clearSeg('equip', i);
      // Re-open a saved haul on the answer it was saved with. An entry from
      // before this question existed comes back null and lands on "No", which
      // is what it has always meant.
      haulVals[i] = e.haul_type || '';
      // The truck comes back out of the same column it went into. Read before
      // applyHaulVisibility so the picker is filled with it on first paint.
      haulUnits[i] = e.haul_type ? (e.truck_unit || '') : '';
      applyHaulVisibility(i);
      updateHours(i);
    }

    async function editEntry(id) {
      const e = entriesCache.find(x => x.id === id);
      if (!e) return;
      // Not while the form is writing. resetForm() below clears editingIds,
      // and a write loop that loses those mid-flight stops recognising the
      // rows it already created — so it posts the rest of the day again.
      if (blockedByWrite('open that draft')) return;
      const token = ++editToken;
      resetForm();

      setType(e.entry_type);
      if (e.entry_type === 'daily') {
        const group = draftGroupFor(e);
        const first = group[0], last = group[group.length - 1];
        currentGroupId = group.length > 1 ? (first.split_group_id || null) : null;

        document.getElementById('f-date').value = first.work_date || '';
        // The drive home is the only shared leg, and it lives on the last job.
        // Each job's own inbound drive is restored by fillBlockFromEntry.
        document.getElementById('f-travel-to-shop').value = last.travel_to_shop_hours != null ? last.travel_to_shop_hours : '';
        // Lunch rides on the first job, for the same reason.
        if (first.lunch_break === true || first.lunch_break === false) setSeg('lunch', first.lunch_break);
        else clearSeg('lunch');

        // Block 0 takes the first job; every other job gets its own block.
        editingIds[0] = first.id;
        loadedTags[0] = splitTagOf(first);
        await fillBlockFromEntry(0, first);
        if (token !== editToken) return;
        for (const g of group.slice(1)) {
          const i = addJobBlock(false);
          if (i == null) break;
          editingIds[i] = g.id;
          loadedTags[i] = splitTagOf(g);
          await fillBlockFromEntry(i, g);
          if (token !== editToken) return;
        }
        renderSplitChrome();

        const tsSupSel = document.getElementById('f-supervisor');
        if (first.supervisor_id && ![...tsSupSel.options].some(o => String(o.value) === String(first.supervisor_id))) {
          // Supervisor no longer in the list — keep it as a synthetic option so
          // the draft still shows it (and can be re-saved) instead of blanking.
          const opt = document.createElement('option');
          opt.value = first.supervisor_id;
          opt.textContent = first.supervisor_name || first.supervisor_id;
          opt.dataset.name = first.supervisor_name || '';
          opt.selected = true;
          tsSupSel.appendChild(opt);
        } else {
          tsSupSel.value = first.supervisor_id || '';
        }
        document.getElementById('f-notes').value = first.notes || '';
        markAsDraft();
      } else {
        editingIds[0] = e.id;
        markAsDraft();
        offType = e.time_off_type || null;
        document.querySelectorAll('#off-pills .pill').forEach(p => {
          p.classList.toggle('active', p.dataset.val === offType);
        });
        document.getElementById('f-off-date').value = e.work_date || '';
        const offSupSel = document.getElementById('f-off-supervisor');
        if (e.supervisor_id && ![...offSupSel.options].some(o => String(o.value) === String(e.supervisor_id))) {
          // Supervisor no longer in the list — keep it as a synthetic option so
          // the draft still shows it (and can be re-saved) instead of blanking.
          const opt = document.createElement('option');
          opt.value = e.supervisor_id;
          opt.textContent = e.supervisor_name || e.supervisor_id;
          opt.dataset.name = e.supervisor_name || '';
          opt.selected = true;
          offSupSel.appendChild(opt);
        } else {
          offSupSel.value = e.supervisor_id || '';
        }
        document.getElementById('f-off-notes').value = e.notes || '';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // The Reset button. resetForm() itself is called from inside the write
    // paths (after a successful submit, after a delete), so the guard lives
    // here rather than in resetForm — those callers are the write.
    function resetFormAction() {
      if (blockedByWrite('reset the form')) return;
      resetForm();
    }

    function resetForm() {
      editingIds = {};
      loadedTags = {};
      currentGroupId = null;
      clearSplits();
      document.getElementById('formTitle').textContent = 'New Entry';
      document.getElementById('formBadge').style.display = 'none';
      document.getElementById('row-delete').style.display = 'none';
      setType('daily');
      document.getElementById('f-date').value     = todayStr();
      document.getElementById('f-division').value = '';
      const jobSel = document.getElementById('f-job');
      jobSel.innerHTML = '<option value="">— pick division first —</option>';
      jobSel.disabled = true;
      document.getElementById('f-truck-unit').value = '';
      document.getElementById('f-truck-desc').value = '';
      document.getElementById('f-ees-unit').value       = '';
      document.getElementById('f-ees-customer').value   = '';
      document.getElementById('f-ees-location').value   = '';
      document.getElementById('f-ees-name').value       = '';
      document.getElementById('f-ees-job-number').value = '';
      document.getElementById('f-ees-billing').value    = 'Non-Billable';
      onJobChange();
      document.getElementById('truckingFields').style.display = 'none';
      document.getElementById('f-travel-to-site').value = '';
      document.getElementById('f-travel-to-shop').value = '';
      updateTravelHours();
      document.getElementById('f-start').value = '';
      document.getElementById('f-end').value   = '';
      updateHours();
      clearSeg('lunch');
      clearSeg('equip');
      haulVals  = { 0: '' };
      haulUnits = { 0: '' };
      applyHaulVisibility();
      renderSplitChrome();
      document.getElementById('f-supervisor').value = '';
      document.getElementById('f-notes').value = '';
      offType = null;
      document.querySelectorAll('#off-pills .pill').forEach(p => p.classList.remove('active'));
      document.getElementById('f-off-date').value = todayStr();
      document.getElementById('f-off-supervisor').value = '';
      document.getElementById('f-off-notes').value = '';
      document.getElementById('formMsg').textContent = '';
    }

    // ── Build payloads from current form state ────────────────────────────
    // One payload per job block, in display order. A day on a single job is
    // still a list — of one — so save and submit have exactly one path to walk
    // and a split day can't take a different one.
    //
    // Returns { list: [{ block, label, data }] } or { error }.

    // The tag that ties a split day's rows together. Minted once and kept for
    // the life of the form so re-saving doesn't re-group the same rows under a
    // new id. A single-job form carries the tag it was loaded with (a survivor
    // of a part-submitted split keeps saying which day it came from) and
    // otherwise carries none.
    function splitTagOf(e) {
      return e && e.split_group_id
        ? { group_id: e.split_group_id, index: Number(e.split_index) || null, count: Number(e.split_count) || null }
        : null;
    }
    function mintGroupId() {
      return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function splitTagFor(blockIdx, position, total) {
      if (total > 1) {
        if (!currentGroupId) currentGroupId = mintGroupId();
        return { split_group_id: currentGroupId, split_index: position + 1, split_count: total };
      }
      const loaded = loadedTags[blockIdx];
      return loaded && loaded.group_id && loaded.count > 1
        ? { split_group_id: loaded.group_id, split_index: loaded.index, split_count: loaded.count }
        : { split_group_id: null, split_index: null, split_count: null };
    }

    function buildPayloads() {
      if (currentType === 'time_off') {
        if (!offType) return { error: 'Pick a time-off type.' };
        const d = document.getElementById('f-off-date').value;
        if (!d) return { error: 'Pick a date.' };
        const offSupSel = document.getElementById('f-off-supervisor');
        const offSupId  = offSupSel.value;
        if (!offSupId) return { error: 'Pick a supervisor.' };
        const offSupOpt = offSupSel.options[offSupSel.selectedIndex];
        const offSupName = offSupOpt ? offSupOpt.dataset.name || offSupOpt.textContent : '';
        return { list: [{ block: 0, label: 'Time off', data: {
          entry_type: 'time_off',
          work_date: d,
          time_off_type: offType,
          supervisor_id: offSupId,
          supervisor_name: offSupName,
          notes: document.getElementById('f-off-notes').value || '',
        }}]};
      }

      // ── Day-level fields, shared by every job block ──
      const d = document.getElementById('f-date').value;
      if (!d) return { error: 'Pick a date.' };
      if (lunchVal == null) return { error: 'Lunch break? Yes or No.' };
      const supSel = document.getElementById('f-supervisor');
      const supId  = supSel.value;
      if (!supId) return { error: 'Pick a supervisor.' };
      const supOpt = supSel.options[supSel.selectedIndex];
      const supName = supOpt ? supOpt.dataset.name || supOpt.textContent : '';
      // Travel legs are optional decimal hours. Empty inputs are sent as
      // empty strings; the API treats them as null. The drive home is the one
      // shared leg — there is only one of it, however many jobs the day had.
      const travelToShop = document.getElementById('f-travel-to-shop').value;
      const notes = document.getElementById('f-notes').value || '';

      // ── Per-job blocks ──
      const order = blockOrder();
      const split = order.length > 1;
      // On a single-job form the messages read exactly as they always have; on
      // a split day they have to say WHICH job is missing something.
      const at = (i, m) => split
        ? `${blockName(i)}: ${m.charAt(0).toLowerCase()}${m.slice(1)}`
        : m;

      const blocks = [];
      for (const i of order) {
        const div = bel(i, 'division').value;
        if (!div) return { error: at(i, 'Pick a division.') };
        const jobSel = bel(i, 'job');
        const jobId = jobSel.value;
        if (!jobId) return { error: at(i, 'Pick a job.') };
        const jobOpt = jobSel.options[jobSel.selectedIndex];
        const jobLabel = jobOpt ? jobOpt.dataset.label || jobOpt.textContent : '';
        const start = bel(i, 'start').value;
        const end   = bel(i, 'end').value;
        if (!start || !end) return { error: at(i, 'Pick start and end times.') };
        // A start equal to its end is 0 hours. The server refuses it too, but
        // only after the earlier blocks have already been written out as
        // drafts, and its message can't say which job is wrong. Catching it
        // here keeps a bad clock from leaving half a day saved, and is what
        // lets overlappingBlocks below assume every span has real length —
        // a zero-length span slips past that check when it sits after the
        // other jobs, and reads as an overlap when it sits inside one.
        if (spanMinutes(start, end) <= 0) {
          return { error: at(i, 'Start and end times are the same — that comes to 0 hours.') };
        }
        if (equipVals[i] == null) return { error: at(i, 'Operated equipment? Yes or No.') };
        // Only a flagged driver is ever asked, and their blocks default to "No",
        // so this is always answered — no validation gate, unlike equipment.
        // A non-driver posts '' and the server stores null.
        // Omitted entirely when the roster flag is unknown, so the server keeps
        // whatever is stored. '' is a real answer ("not a haul") and clears it.
        // The truck rides on truck_unit — it IS the unit — but only for a haul
        // on a division that has somewhere to put it. Everywhere else the
        // trucking/dust rules below own that field, untouched.
        const _haul     = isDriver ? (haulVals[i] || '') : '';
        const _haulUnit = (isDriver && _haul && HAUL_UNIT_DIVISIONS.includes(div))
          ? (haulUnits[i] || '') : null;
        blocks.push({ i, div, jobId, jobLabel, start, end, equip: equipVals[i],
                      haulUnit: _haulUnit,
                      haulKey: isDriver === null ? {} : { haul_type: _haul } });
      }

      // Two jobs can't be worked at the same moment, and a day that adds up to
      // more than 24 hours is a typo. Both are caught here rather than after
      // half the rows have already been written.
      if (split) {
        const clash = overlappingBlocks(blocks);
        if (clash) {
          return { error: `${blockName(clash[0].i)} and ${blockName(clash[1].i)} cover the same time. Check the start and end times.` };
        }
        const totalMins = blocks.reduce((s, b) => s + (spanMinutes(b.start, b.end) || 0), 0);
        if (totalMins > 24 * 60) {
          return { error: `Those jobs add up to ${(totalMins / 60).toFixed(2)} hours — more than one day.` };
        }
      }

      const list = blocks.map((b, pos) => {
        const isEes  = isEesSelection(b.i);
        const eesVal = key => isEes ? (bel(b.i, key).value || '').trim() : '';
        // Unit + Description. Sent for the same selections that show the fields
        // (trucking, and dust customer hauls); the server nulls them for
        // anything else, so this only decides whether the value makes the trip.
        const isTruck   = isTruckSelection(b.i);
        // A haul on turf/paving/kiewit names its truck here instead — the same
        // column, because it is the same fact, and the two selections never
        // overlap (isTruckSelection covers only trucking and dust customers).
        const truckUnit = b.haulUnit != null
          ? b.haulUnit
          : (isTruck ? (bel(b.i, 'truck-unit').value || '').trim() : '');
        const truckDesc = isTruck ? (bel(b.i, 'truck-desc').value || '').trim() : '';
        return {
          block: b.i,
          label: blockName(b.i),
          data: Object.assign({
            entry_type: 'daily',
            work_date: d,
            division: b.div,
            job_id: b.jobId,
            job_label: b.jobLabel,
            start_time: b.start,
            end_time:   b.end,
            // Each job carries the drive that got the worker TO it: from the
            // shop for the first, from the previous job for the rest. The
            // drive home belongs to the last job and to no other, so it is
            // never paid more than once however many jobs the day had.
            travel_to_site_hours: bel(b.i, 'travel-in').value,
            travel_to_shop_hours: pos === blocks.length - 1 ? travelToShop : '',
            // Same reasoning for lunch: one break, deducted once, from the
            // first job. The others record that no break fell inside them.
            lunch_break: pos === 0 ? lunchVal : false,
            operated_equipment: b.equip,
            supervisor_id: supId,
            supervisor_name: supName,
            // Repeated on every row on purpose — payroll reads these entries
            // one at a time, and a note only the first row carried would be
            // invisible on the others.
            notes,
            truck_unit: truckUnit,
            truck_description: truckDesc,
            ees_unit:       eesVal('ees-unit'),
            ees_customer:   eesVal('ees-customer'),
            ees_location:   eesVal('ees-location'),
            ees_name:       eesVal('ees-name'),
            ees_job_number: eesVal('ees-job-number'),
            ees_billing:    isEes ? (bel(b.i, 'ees-billing').value || 'Non-Billable') : '',
            // '' → null on the server: not a haul, which is what every entry
            // that predates this question also reads as. Absent → keep stored.
          }, b.haulKey, splitTagFor(b.i, pos, blocks.length)),
        };
      });

      return { list };
    }

    // First pair of blocks whose on-site spans overlap, or null. Each span is
    // laid out on a single timeline in minutes; an end that reads earlier than
    // its start is an overnight shift and runs past midnight, the same way
    // spanMinutes() treats it. Every span has real length by the time this
    // runs — buildPayloads rejects a start equal to its end first, because a
    // zero-length span both slips this check and trips it, depending only on
    // where the other jobs happen to sit.
    //
    // Deliberately not exhaustive once a block runs past midnight: 22:00–02:00
    // followed by 01:00–03:00 is not flagged, because a block on the same
    // work_date reading 01:00 could equally be that morning, before the night
    // shift began. Nothing on the form says which, so guessing would refuse
    // real days to catch a rare one. This is the same latitude the field has
    // always had submitting two entries by hand; what it does catch is the
    // mistake splitting actually invites — the second job left sitting on the
    // first one's clock.
    function overlappingBlocks(blocks) {
      const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
      const spans = blocks.map(b => {
        const s = toMin(b.start);
        const e = toMin(b.end);
        return { b, s, e: e > s ? e : e + 24 * 60 };
      });
      for (let x = 0; x < spans.length; x++) {
        for (let y = x + 1; y < spans.length; y++) {
          if (spans[x].s < spans[y].e && spans[y].s < spans[x].e) return [spans[x].b, spans[y].b];
        }
      }
      return null;
    }

    // ── Save / submit / delete ────────────────────────────────────────────
    // The rows this form is currently sitting on. Empty = nothing written yet.
    function savedIds() { return Object.values(editingIds).filter(Boolean); }

    // One write at a time, across ALL of the buttons that write. A block is
    // only pinned to its row once its write comes back, so a Save still in
    // flight when Submit is pressed finds nothing pinned and posts every block
    // a second time. Disabling one button never covered it — the presses are on
    // different buttons — and the window is as long as the whole day takes to
    // write, which on a split is one round trip per job.
    let formWriting = false;
    // Everything that would disturb a write in progress. Reset and Delete
    // Draft belong here as much as Save and Submit do: both clear editingIds,
    // and a write loop that loses those mid-flight stops recognising the rows
    // it already created, so it posts the rest of the day a second time.
    const WRITE_BUTTONS = ['btn-save', 'btn-submit', 'btn-add-split', 'btn-reset', 'btn-delete-draft'];
    function beginWrite() {
      if (formWriting) return false;
      formWriting = true;
      for (const id of WRITE_BUTTONS) {
        const el = document.getElementById(id);
        if (el) el.disabled = true;
      }
      return true;
    }
    function endWrite() {
      formWriting = false;
      for (const id of WRITE_BUTTONS) {
        const el = document.getElementById(id);
        if (el) el.disabled = false;
      }
      renderSplitChrome();   // re-disables the add button if we're at the cap
    }

    // Guard for an action the user asked for that a write in progress makes
    // unsafe. Disabling the buttons covers the ordinary case; this covers the
    // press that lands in the same tick, and says what happened — a confirmed
    // "delete this draft" that quietly does nothing reads as data loss.
    function blockedByWrite(what) {
      if (!formWriting) return false;
      const msg = document.getElementById('formMsg');
      msg.className = 'msg error';
      msg.textContent = `Still saving — ${what} once it finishes.`;
      return true;
    }

    async function saveDraft() {
      const { list, error } = buildPayloads();
      const msg = document.getElementById('formMsg');
      msg.className = 'msg';
      if (error) { msg.textContent = error; msg.classList.add('error'); return; }
      if (!beginWrite()) return;

      try {
        for (const item of list) await writeEntry(item.data, item.block);
        msg.textContent = list.length > 1
          ? `Saved ${list.length} draft entries — one per job.`
          : 'Saved as draft.';
        msg.classList.add('success');
        markAsDraft();
        await loadEntries();
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.add('error');
        await loadEntries();
      } finally {
        endWrite();
      }
    }

    async function submitEntry() {
      const { list, error } = buildPayloads();
      const msg = document.getElementById('formMsg');
      msg.className = 'msg';
      if (error) { msg.textContent = error; msg.classList.add('error'); return; }

      const confirmText = list.length > 1
        ? `Submit ${list.length} entries — one for each job? You won't be able to edit them after this — only an admin can.`
        : "Submit this entry? You won't be able to edit it after this — only an admin can.";
      if (!confirm(confirmText)) return;
      if (!beginWrite()) return;

      try {
        // Write every block out as a draft first. Each write adopts the row it
        // just created BEFORE anything else runs — without that, a submit that
        // failed left the form full but pinned to nothing, so pressing Submit
        // again POSTed a second draft instead of retrying the first. That is
        // how one day's work lands on the list several times over.
        for (const item of list) await writeEntry(item.data, item.block);
        markAsDraft();

        // Then submit them, one at a time. A block that fails stays a draft and
        // is named in the message; the ones that went through are gone from the
        // form so a second press can't re-post them.
        const problems = [];
        let submitted = 0;
        for (const item of list) {
          const rowId = editingIds[item.block];
          if (!rowId) continue;
          try {
            const res = await fetch('/api/timesheet-entries?action=submit&id=' + encodeURIComponent(rowId), {
              method: 'POST', headers: authHeaders(),
            });
            const j = await res.json();
            if (!res.ok || !j.ok) {
              const e = new Error(j.error || 'Submit failed');
              // 409 = the day is already covered by another entry. That is not
              // a retry — pressing Submit again can only fail the same way, and
              // the server's message already says to drop this draft instead.
              e.noRetry = res.status === 409;
              throw e;
            }
            delete editingIds[item.block];   // no longer a draft this form owns
            submitted++;
          } catch (err) {
            problems.push({ label: item.label, err });
          }
        }

        const detail = problems
          .map(p => (list.length > 1 ? `${p.label}: ${p.err.message}` : p.err.message))
          .join(' · ');

        // resetForm() clears the message box, so anything worth saying has to
        // be said after it — otherwise the worker gets a blank form and no
        // confirmation that their day went in at all.
        if (!problems.length) {
          resetForm();
          msg.className = 'msg success';
          msg.textContent = list.length > 1 ? `Submitted ${submitted} entries ✓` : 'Submitted ✓';
        } else if (submitted === 0) {
          // Nothing went through, so every row is still a draft this form is
          // pinned to — leave it up and let them press Submit again.
          msg.textContent = problems.some(p => !p.err.noRetry)
            ? `${detail} — saved as ${list.length > 1 ? 'drafts' : 'a draft'} below; press Submit to try again.`
            : detail;
          msg.classList.add('error');
        } else {
          // Some rows are submitted and must not be re-posted, so the form has
          // to let go of them — and once it has, it cannot keep the failures
          // either. They are drafts in the list below; tapping one loads the
          // day's remaining jobs back in to retry.
          resetForm();
          msg.className = 'msg error';
          msg.textContent = `${submitted} of ${list.length} submitted. ${detail} `
            + '— the rest are saved as drafts below; tap one to try again.';
        }
        await loadEntries();
      } catch (err) {
        // Say where the work went. "Submit failed" over a form that still
        // looks unsaved is what makes people press the button again.
        msg.textContent = savedIds().length
          ? `${err.message} — what saved is in the drafts below; press Submit to try again.`
          : err.message;
        msg.classList.add('error');
        await loadEntries();
      } finally {
        endWrite();
      }
    }

    // Put the form into "editing an existing draft" state — titled, badged and
    // deletable. Which rows it is pinned to lives in editingIds, one per job
    // block, so the next write updates those rows rather than creating more.
    function markAsDraft() {
      document.getElementById('formTitle').textContent = 'Edit Draft';
      const badge = document.getElementById('formBadge');
      badge.textContent = 'draft';
      badge.className = 'badge badge-draft';
      badge.style.display = '';
      document.getElementById('row-delete').style.display = '';
    }

    async function deleteDraft() {
      const ids = savedIds();
      if (!ids.length) return;
      if (!confirm(ids.length > 1
        ? `Delete all ${ids.length} draft entries for this day? This cannot be undone.`
        : 'Delete this draft entry? This cannot be undone.')) return;
      if (blockedByWrite('delete') || !beginWrite()) return;
      const failed = [];
      try {
        for (const rowId of ids) {
          try {
            const res = await fetch('/api/timesheet-entries?id=' + encodeURIComponent(rowId), {
              method: 'DELETE', headers: authHeaders(),
            });
            const j = await res.json();
            if (!res.ok || !j.ok) throw new Error(j.error || 'Delete failed');
          } catch (err) {
            failed.push(err.message);
          }
        }
        resetForm();
        await loadEntries();
      } finally {
        endWrite();
      }
      if (failed.length) {
        const msg = document.getElementById('formMsg');
        msg.className = 'msg error';
        msg.textContent = `Some drafts could not be deleted (${failed.join('; ')}). They are still in the list below.`;
      }
    }

    async function writeEntry(data, blockIdx = 0) {
      const rowId = editingIds[blockIdx];
      let res;
      if (rowId) {
        res = await fetch('/api/timesheet-entries?id=' + encodeURIComponent(rowId), {
          method: 'PUT', headers: authHeaders(true), body: JSON.stringify(data),
        });
      } else {
        res = await fetch('/api/timesheet-entries', {
          method: 'POST', headers: authHeaders(true), body: JSON.stringify(data),
        });
      }
      const j = await res.json();
      if (!res.ok || !j.ok) throw new Error(j.error || 'Save failed');
      // Adopt the row immediately so a failure on the NEXT block leaves this
      // one pinned — a retry updates it instead of posting a duplicate.
      editingIds[blockIdx] = j.entry.id;
      return j.entry;
    }

    function authHeaders(json) {
      const h = { Authorization: `Bearer ${token}` };
      if (json) h['Content-Type'] = 'application/json';
      return h;
    }

    function goToDivisions() {
      window.location.replace('divisions.html');
    }
    function signOut() {
      localStorage.removeItem('fct_token');
      localStorage.removeItem('fct_user');
      localStorage.removeItem('fct_division');
      window.location.replace('index.html');
    }
  </script>
  <script src="mathis.js" defer></script>
</body>
</html>
