<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%230a0f1e' stroke='%23f97316' stroke-width='6'/><circle cx='50' cy='50' r='12' fill='%23f97316'/></svg>">
  <title>DataWatch — Quarry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0a0a0f;
      --surface:    #111118;
      --surface2:   #1a1a26;
      --border:     #2a2a3a;
      --accent:     #f97316;
      --accent-dim: #c2410c;
      --text:       #e0e0e0;
      --muted:      #666;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 300;
      gap: 1rem;
    }
    .hdr-left { display: flex; align-items: center; gap: 1rem; min-width: 0; }
    .brand {
      font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--accent); font-weight: 700; flex-shrink: 0;
    }
    .div-label {
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); border-left: 1px solid var(--border);
      padding-left: 1rem; white-space: nowrap;
    }
    .hdr-right { display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; }
    .user-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent-dim);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .user-info { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    .user-info strong { color: var(--text); }
    .btn-ghost {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
      background: none; border: 1px solid var(--border);
      border-radius: 4px; padding: 0.32rem 0.7rem; cursor: pointer;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .btn-ghost:hover { color: var(--text); border-color: #555; }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      align-items: center;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      position: sticky;
      top: 45px;
      z-index: 200;
      overflow-x: auto;
      gap: 0;
    }
    .tab-btn {
      padding: 0.6rem 1.25rem;
      font-size: 0.67rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: color 0.15s, border-color 0.15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-bar-spacer { flex: 1; }
    .btn-manage-lists {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent);
      background: rgba(249,115,22,0.07);
      border: 1px solid rgba(249,115,22,0.25);
      border-radius: 4px; padding: 0.32rem 0.75rem; cursor: pointer;
      transition: background 0.15s, border-color 0.15s; white-space: nowrap;
      flex-shrink: 0; margin-right: 0.25rem;
    }
    .btn-manage-lists:hover { background: rgba(249,115,22,0.14); border-color: var(--accent); }

    /* ── Panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Manage Lists Modal ── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.72); z-index: 500;
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 100%; max-width: 680px;
      max-height: 88vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.5rem 0.9rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .modal-title {
      font-size: 0.82rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #fff;
    }
    .modal-close {
      background: none; border: none; color: var(--muted);
      font-size: 1.2rem; cursor: pointer; padding: 0.1rem 0.5rem;
      border-radius: 3px; transition: color 0.15s; line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    .ml-subtab-bar {
      display: flex; gap: 0; padding: 0 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      overflow-x: auto;
    }
    .ml-subtab-btn {
      padding: 0.55rem 1rem;
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: color 0.15s, border-color 0.15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .ml-subtab-btn:hover { color: var(--text); }
    .ml-subtab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .ml-body {
      padding: 1.25rem 1.5rem 1.5rem;
      overflow-y: auto;
      flex: 1;
    }
    .ml-panel { display: none; }
    .ml-panel.active { display: block; }
    .ml-empty {
      font-size: 0.75rem; color: var(--muted); text-align: center;
      padding: 2rem 1rem; border: 1px dashed var(--border); border-radius: 6px;
    }

    /* Add form */
    .ml-form {
      display: flex; gap: 0.5rem; margin-bottom: 1rem;
    }
    .ml-form input[type="text"] {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 0.82rem;
      padding: 0.45rem 0.7rem; outline: none; font-family: inherit;
    }
    .ml-form input[type="text"]:focus { border-color: var(--accent); }
    .btn-add {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #fff;
      background: var(--accent); border: 1px solid var(--accent);
      border-radius: 4px; padding: 0.45rem 0.95rem; cursor: pointer;
      transition: background 0.15s; white-space: nowrap;
    }
    .btn-add:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
    .btn-add:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Item rows */
    .ml-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .ml-item {
      display: flex; align-items: center; gap: 0.75rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.55rem 0.85rem;
    }
    .ml-item:hover { border-color: #3a3a4a; }
    .ml-item-name { flex: 1; font-size: 0.82rem; color: var(--text); }
    .ml-rate-wrap {
      display: flex; align-items: center; gap: 0.25rem;
      font-size: 0.78rem; color: var(--text-dim, #9aa0a6);
    }
    .ml-rate-input {
      width: 5.5rem; background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-size: 0.78rem;
      padding: 0.3rem 0.5rem; outline: none; font-family: inherit;
      text-align: right;
    }
    .ml-rate-input:focus { border-color: var(--accent); }
    .ml-form .ml-rate-input { flex: 0 0 auto; }
    .btn-del {
      font-size: 0.62rem; font-weight: 600; padding: 0.22rem 0.6rem;
      background: none; border: 1px solid rgba(239,68,68,0.25); color: #ef4444;
      border-radius: 3px; cursor: pointer; transition: background 0.15s;
    }
    .btn-del:hover { background: rgba(239,68,68,0.08); }

    /* ── Sales Tracking ── */
    .sales-wrap { padding: 1rem 1.25rem 2rem; }
    .sales-toolbar {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 0.75rem; flex-wrap: wrap;
    }
    .btn-add-row {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #fff;
      background: var(--accent); border: 1px solid var(--accent);
      border-radius: 4px; padding: 0.45rem 0.95rem; cursor: pointer;
      transition: background 0.15s; white-space: nowrap;
    }
    .btn-add-row:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
    .btn-add-row:disabled { opacity: 0.45; cursor: not-allowed; }
    .sales-summary {
      display: flex; gap: 1.25rem; font-size: 0.72rem; color: var(--muted);
      letter-spacing: 0.05em;
    }
    .sales-summary strong { color: var(--text); font-weight: 700; margin-left: 0.35rem; }

    .sales-table-wrap {
      border: 1px solid var(--border); border-radius: 6px;
      overflow: auto; background: var(--surface);
      max-height: calc(100vh - 220px);
    }
    .sales-table {
      width: 100%; border-collapse: separate; border-spacing: 0;
      font-size: 0.78rem; min-width: 1000px;
    }
    .sales-table thead th {
      position: sticky; top: 0; z-index: 1;
      background: var(--surface2); color: var(--muted);
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.55rem 0.7rem; text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .sales-table tbody td {
      padding: 0; border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--surface);
      vertical-align: middle;
    }
    .sales-table tbody td:last-child { border-right: none; }
    .sales-table tbody tr:hover td { background: #14141d; }
    .sales-table tbody tr.is-empty-row td { color: var(--muted); }

    .cell-input, .cell-select {
      width: 100%; height: 100%;
      background: transparent; border: none; outline: none;
      color: var(--text); font-family: inherit; font-size: 0.78rem;
      padding: 0.55rem 0.7rem;
      box-sizing: border-box;
    }
    .cell-input:focus, .cell-select:focus {
      background: rgba(249,115,22,0.08);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .cell-select { appearance: none; cursor: pointer; }
    .cell-select option { background: var(--surface2); color: var(--text); }
    .cell-input[type="number"] { text-align: right; }
    .cell-readonly {
      padding: 0.55rem 0.7rem; color: var(--text);
      text-align: right; font-variant-numeric: tabular-nums;
    }
    .cell-readonly.is-zero { color: var(--muted); }

    .col-date    { width: 7.5rem; }
    .col-num     { width: 6.5rem; }
    .col-payment { width: 7rem; }
    .col-total   { width: 8rem; }
    .col-actions { width: 3rem; }

    .row-del-btn {
      width: 100%; background: none; border: none; color: var(--muted);
      font-size: 1rem; cursor: pointer; padding: 0.4rem 0;
      transition: color 0.15s;
    }
    .row-del-btn:hover { color: #ef4444; }

    .sales-empty {
      text-align: center; padding: 2.5rem 1rem;
      color: var(--muted); font-size: 0.8rem;
    }

    /* Crushing Tracking — reuses sales-* layout, overrides for wider grid */
    .crush-table { min-width: 2100px; }
    .col-comments { min-width: 14rem; }
    .cell-readonly.is-calc {
      background: rgba(249,115,22,0.04);
      color: var(--text);
    }
    .cell-readonly.is-calc.is-zero { color: var(--muted); }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="hdr-left">
      <div class="brand">DataWatch</div>
      <div class="div-label">Quarry</div>
    </div>
    <div class="hdr-right">
      <div class="user-avatar" id="userAvatar"></div>
      <div class="user-info" id="userInfo"></div>
      <button class="btn-ghost" onclick="switchDivision()">Switch Division</button>
    </div>
  </header>

  <!-- ── Tab bar ── -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="home"     onclick="switchTab('home')">Home</button>
    <button class="tab-btn"        data-tab="daily"    onclick="switchTab('daily')">Daily Tracking</button>
    <button class="tab-btn"        data-tab="crushing" onclick="switchTab('crushing')">Crushing Tracking</button>
    <button class="tab-btn"        data-tab="sales"     onclick="switchTab('sales')">Sales Tracking</button>
    <button class="tab-btn"        data-tab="analytics" onclick="switchTab('analytics')">Analytics</button>
    <div class="tab-bar-spacer"></div>
    <button class="btn-manage-lists" onclick="openManageLists()">⚙ Manage Lists</button>
  </nav>

  <!-- ── Panels (intentionally blank) ── -->
  <div class="tab-panel active" id="tab-home"></div>
  <div class="tab-panel"        id="tab-daily"></div>
  <div class="tab-panel"        id="tab-crushing">
    <div class="sales-wrap">
      <div class="sales-toolbar">
        <button class="btn-add-row" id="crushAddBtn" onclick="addCrushRow()">+ Add Row</button>
        <div class="sales-summary" id="crushSummary"></div>
      </div>
      <div class="sales-table-wrap">
        <table class="sales-table crush-table">
          <thead>
            <tr>
              <th class="col-date">Date</th>
              <th>Employee</th>
              <th class="col-num">Hourly Rate</th>
              <th class="col-num">Hours</th>
              <th class="col-total">Total Payroll</th>
              <th class="col-num">Fuel Gallons</th>
              <th class="col-num">Fuel Cost</th>
              <th class="col-total">Total Fuel</th>
              <th class="col-num">Loads to Crusher</th>
              <th class="col-num">Tons / Load</th>
              <th class="col-total">Estimated Tons</th>
              <th class="col-num">Hours Crushing</th>
              <th class="col-total">Tons / Hour</th>
              <th class="col-total">Total Cost</th>
              <th class="col-total">Cost / Ton</th>
              <th class="col-comments">Comments</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="crushTbody">
            <tr><td colspan="17" class="sales-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="tab-panel"        id="tab-sales">
    <div class="sales-wrap">
      <div class="sales-toolbar">
        <button class="btn-add-row" id="salesAddBtn" onclick="addSalesRow()">+ Add Row</button>
        <div class="sales-summary" id="salesSummary"></div>
      </div>
      <div class="sales-table-wrap">
        <table class="sales-table">
          <thead>
            <tr>
              <th class="col-date">Date</th>
              <th>Employee</th>
              <th>Customer</th>
              <th>Product</th>
              <th class="col-num">Tons</th>
              <th class="col-payment">Payment</th>
              <th class="col-num">Price / Ton</th>
              <th class="col-total">Total Sales</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="salesTbody">
            <tr><td colspan="9" class="sales-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="tab-panel"        id="tab-analytics"></div>

  <!-- ── Manage Lists Modal ── -->
  <div class="modal-backdrop" id="manageListsBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="manageListsTitle">
      <div class="modal-header">
        <div class="modal-title" id="manageListsTitle">Manage Lists</div>
        <button class="modal-close" onclick="closeManageLists()" aria-label="Close">✕</button>
      </div>
      <div class="ml-subtab-bar">
        <button class="ml-subtab-btn active" data-list="customer"  onclick="switchListTab('customer')">Customer</button>
        <button class="ml-subtab-btn"        data-list="product"   onclick="switchListTab('product')">Product</button>
        <button class="ml-subtab-btn"        data-list="equipment" onclick="switchListTab('equipment')">Equipment</button>
        <button class="ml-subtab-btn"        data-list="tasks"     onclick="switchListTab('tasks')">Tasks</button>
        <button class="ml-subtab-btn"        data-list="employees" onclick="switchListTab('employees')">Employees</button>
        <button class="ml-subtab-btn"        data-list="location"  onclick="switchListTab('location')">Location</button>
      </div>
      <div class="ml-body">
        <div class="ml-panel active" id="ml-customer"></div>
        <div class="ml-panel"        id="ml-product"></div>
        <div class="ml-panel"        id="ml-equipment"></div>
        <div class="ml-panel"        id="ml-tasks"></div>
        <div class="ml-panel"        id="ml-employees"></div>
        <div class="ml-panel"        id="ml-location"></div>
      </div>
    </div>
  </div>

  <script>
    // ── Auth guard ──────────────────────────────────────────────
    const token = localStorage.getItem('fct_token');
    const user  = (() => { try { return JSON.parse(localStorage.getItem('fct_user')); } catch { return null; } })();
    if (!token || !user) { window.location.replace('index.html'); }

    // ── Header user info ────────────────────────────────────────
    document.getElementById('userAvatar').textContent =
      (user?.username || 'U').slice(0, 2).toUpperCase();
    document.getElementById('userInfo').innerHTML =
      `<strong>${user?.username || ''}</strong>&nbsp;·&nbsp;${user?.companyName || user?.companyCode || ''}`;

    // ── Tab switching ───────────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('.tab-panel').forEach(p =>
        p.classList.toggle('active', p.id === 'tab-' + tab));
      if (tab === 'sales') refreshSales();
      if (tab === 'crushing') refreshCrush();
    }

    // ── Switch division ─────────────────────────────────────────
    function switchDivision() {
      localStorage.removeItem('fct_division');
      window.location.replace('divisions.html');
    }

    // ── Manage Lists modal ──────────────────────────────────────
    const LIST_TYPES = [
      { key: 'customer',  label: 'customer',  placeholder: 'Customer name' },
      { key: 'product',   label: 'product',   placeholder: 'Product name' },
      { key: 'equipment', label: 'equipment', placeholder: 'Equipment name' },
      { key: 'tasks',     label: 'task',      placeholder: 'Task name' },
      { key: 'employees', label: 'employee',  placeholder: 'Employee name' },
      { key: 'location',  label: 'location',  placeholder: 'Location name' },
    ];

    const QUARRY_LISTS_KEY = 'fct_quarry_lists';
    const LEGACY_LOCAL_KEY = `fct_quarry_lists_${user?.companyCode || 'default'}`;

    function emptyLists() {
      return Object.fromEntries(LIST_TYPES.map(t => [t.key, []]));
    }
    function normalizeLists(value) {
      const out = emptyLists();
      if (value && typeof value === 'object') {
        LIST_TYPES.forEach(t => {
          if (Array.isArray(value[t.key])) out[t.key] = value[t.key];
        });
      }
      return out;
    }

    let quarryLists = emptyLists();
    let listsLoaded = false;
    let savePending = null;
    let saveInFlight = false;

    async function fetchLists() {
      const res = await fetch(`/api/data/${QUARRY_LISTS_KEY}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) throw new Error(`GET ${QUARRY_LISTS_KEY} → ${res.status}`);
      const data = await res.json();
      return normalizeLists(data.value);
    }

    async function putLists(value) {
      const res = await fetch(`/api/data/${QUARRY_LISTS_KEY}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ value }),
      });
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error(`PUT ${QUARRY_LISTS_KEY} → ${res.status} ${text}`);
      }
    }

    // Coalesces rapid edits into a single in-flight PUT.
    function scheduleSave() {
      savePending = quarryLists;
      if (saveInFlight) return;
      flushSave();
    }
    async function flushSave() {
      while (savePending) {
        const snapshot = savePending;
        savePending = null;
        saveInFlight = true;
        try {
          await putLists(snapshot);
        } catch (err) {
          console.error('[quarry] save failed:', err);
          alert('Could not save changes — please check your connection and try again.');
        } finally {
          saveInFlight = false;
        }
      }
    }

    async function loadInitial() {
      try {
        const server = await fetchLists();
        const serverHasData = LIST_TYPES.some(t => server[t.key].length);

        // One-time migration: if the server is empty but a previous version
        // saved items to localStorage on this browser, push them up so the
        // user doesn't lose their data when we move to server-backed storage.
        if (!serverHasData) {
          try {
            const raw = localStorage.getItem(LEGACY_LOCAL_KEY);
            if (raw) {
              const local = normalizeLists(JSON.parse(raw));
              const localHasData = LIST_TYPES.some(t => local[t.key].length);
              if (localHasData) {
                quarryLists = local;
                await putLists(local);
                localStorage.removeItem(LEGACY_LOCAL_KEY);
                listsLoaded = true;
                renderAllPanels();
                return;
              }
            }
          } catch (err) {
            console.warn('[quarry] legacy migration skipped:', err);
          }
        }

        quarryLists = server;
      } catch (err) {
        console.error('[quarry] load failed:', err);
        quarryLists = emptyLists();
      } finally {
        listsLoaded = true;
        renderAllPanels();
      }
    }

    function formatRate(rate) {
      if (rate === null || rate === undefined || rate === '') return '';
      const n = Number(rate);
      if (!Number.isFinite(n)) return '';
      return n.toFixed(2);
    }

    function renderListPanel(type) {
      const panel = document.getElementById('ml-' + type.key);
      if (!listsLoaded) {
        panel.innerHTML = `<div class="ml-empty">Loading…</div>`;
        return;
      }
      const isEmployees = type.key === 'employees';
      const items = quarryLists[type.key] || [];
      const itemsHtml = items.length
        ? `<div class="ml-list">${items.map((it, i) => {
            const rateCell = isEmployees
              ? `<div class="ml-rate-wrap">
                   <span>$</span>
                   <input type="number" class="ml-rate-input" min="0" step="0.01"
                          value="${formatRate(it.rate)}" placeholder="0.00"
                          onchange="updateEmployeeRate(${i}, this.value)" />
                   <span>/hr</span>
                 </div>`
              : '';
            return `
            <div class="ml-item">
              <div class="ml-item-name">${escapeHtml(it.name)}</div>
              ${rateCell}
              <button class="btn-del" onclick="deleteListItem('${type.key}', ${i})">Delete</button>
            </div>`;
          }).join('')}</div>`
        : `<div class="ml-empty">No ${type.label}s yet.</div>`;
      const rateInputHtml = isEmployees
        ? `<input type="number" id="ml-rate-${type.key}" class="ml-rate-input" min="0" step="0.01" placeholder="Rate $/hr" ${listsLoaded ? '' : 'disabled'} />`
        : '';
      panel.innerHTML = `
        <form class="ml-form" onsubmit="addListItem(event, '${type.key}'); return false;">
          <input type="text" id="ml-input-${type.key}" placeholder="${type.placeholder}" maxlength="120" autocomplete="off" ${listsLoaded ? '' : 'disabled'} />
          ${rateInputHtml}
          <button type="submit" class="btn-add" ${listsLoaded ? '' : 'disabled'}>Add</button>
        </form>
        ${itemsHtml}
      `;
    }

    function renderAllPanels() {
      LIST_TYPES.forEach(renderListPanel);
    }

    function parseRate(raw) {
      if (raw === null || raw === undefined) return null;
      const s = String(raw).trim();
      if (!s) return null;
      const n = Number(s);
      if (!Number.isFinite(n) || n < 0) return null;
      return Math.round(n * 100) / 100;
    }

    function addListItem(event, key) {
      if (event) event.preventDefault();
      if (!listsLoaded) return;
      const input = document.getElementById('ml-input-' + key);
      const name = (input.value || '').trim();
      if (!name) return;
      const item = {
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        name,
      };
      if (key === 'employees') {
        const rateEl = document.getElementById('ml-rate-' + key);
        item.rate = parseRate(rateEl ? rateEl.value : null);
      }
      quarryLists[key].push(item);
      scheduleSave();
      renderListPanel(LIST_TYPES.find(t => t.key === key));
      const newInput = document.getElementById('ml-input-' + key);
      if (newInput) newInput.focus();
    }

    function deleteListItem(key, index) {
      if (!listsLoaded) return;
      quarryLists[key].splice(index, 1);
      scheduleSave();
      renderListPanel(LIST_TYPES.find(t => t.key === key));
    }

    function updateEmployeeRate(index, raw) {
      if (!listsLoaded) return;
      const list = quarryLists.employees;
      if (!list || !list[index]) return;
      list[index].rate = parseRate(raw);
      scheduleSave();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function openManageLists() {
      document.getElementById('manageListsBackdrop').classList.add('open');
      // Refetch each open so a user sees changes other devices made.
      try {
        const fresh = await fetchLists();
        quarryLists = fresh;
        listsLoaded = true;
        renderAllPanels();
      } catch (err) {
        console.error('[quarry] refresh failed:', err);
      }
    }
    function closeManageLists() {
      document.getElementById('manageListsBackdrop').classList.remove('open');
    }
    function switchListTab(list) {
      document.querySelectorAll('.ml-subtab-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.list === list));
      document.querySelectorAll('.ml-panel').forEach(p =>
        p.classList.toggle('active', p.id === 'ml-' + list));
      const input = document.getElementById('ml-input-' + list);
      if (input) input.focus();
    }
    document.getElementById('manageListsBackdrop').addEventListener('click', function(e) {
      if (e.target === this) closeManageLists();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeManageLists();
    });

    renderAllPanels();
    loadInitial().then(() => {
      // Re-render sales after lists load so dropdowns are populated.
      if (salesLoaded) renderSales();
    });

    // ── Sales Tracking ──────────────────────────────────────────
    const QUARRY_SALES_KEY = 'fct_quarry_sales';
    const PAYMENT_OPTIONS = ['Cash', 'Credit'];

    let salesRows = [];
    let salesLoaded = false;
    let salesSavePending = null;
    let salesSaveInFlight = false;
    let salesFetchedOnce = false;

    function todayIso() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${d.getFullYear()}-${m}-${day}`;
    }

    function normalizeSalesRow(r) {
      const row = (r && typeof r === 'object') ? r : {};
      return {
        id: row.id || (Date.now() + '-' + Math.random().toString(36).slice(2, 7)),
        date: typeof row.date === 'string' ? row.date : '',
        employeeId: row.employeeId || '',
        employeeName: row.employeeName || '',
        customerId: row.customerId || '',
        customerName: row.customerName || '',
        productId: row.productId || '',
        productName: row.productName || '',
        tons: row.tons === '' || row.tons === null || row.tons === undefined ? '' : Number(row.tons),
        payment: row.payment === 'Cash' || row.payment === 'Credit' ? row.payment : '',
        pricePerTon: row.pricePerTon === '' || row.pricePerTon === null || row.pricePerTon === undefined ? '' : Number(row.pricePerTon),
      };
    }

    function normalizeSalesRows(value) {
      if (!Array.isArray(value)) return [];
      return value.map(normalizeSalesRow);
    }

    async function fetchSales() {
      const res = await fetch(`/api/data/${QUARRY_SALES_KEY}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) throw new Error(`GET ${QUARRY_SALES_KEY} → ${res.status}`);
      const data = await res.json();
      return normalizeSalesRows(data.value);
    }

    async function putSales(value) {
      const res = await fetch(`/api/data/${QUARRY_SALES_KEY}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ value }),
      });
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error(`PUT ${QUARRY_SALES_KEY} → ${res.status} ${text}`);
      }
    }

    function scheduleSalesSave() {
      salesSavePending = salesRows.map(r => ({ ...r }));
      if (salesSaveInFlight) return;
      flushSalesSave();
    }
    async function flushSalesSave() {
      while (salesSavePending) {
        const snapshot = salesSavePending;
        salesSavePending = null;
        salesSaveInFlight = true;
        try {
          await putSales(snapshot);
        } catch (err) {
          console.error('[quarry] sales save failed:', err);
          alert('Could not save sales changes — please check your connection and try again.');
        } finally {
          salesSaveInFlight = false;
        }
      }
    }

    async function refreshSales() {
      // First open: also refresh manage lists so dropdowns reflect other devices.
      try {
        if (listsLoaded) {
          fetchLists().then(fresh => { quarryLists = fresh; renderSales(); }).catch(() => {});
        }
        const fresh = await fetchSales();
        salesRows = fresh;
        salesLoaded = true;
        salesFetchedOnce = true;
        renderSales();
      } catch (err) {
        console.error('[quarry] sales refresh failed:', err);
        if (!salesFetchedOnce) {
          salesRows = [];
          salesLoaded = true;
          renderSales();
        }
      }
    }

    function rowTotal(row) {
      const t = Number(row.tons);
      const p = Number(row.pricePerTon);
      if (!Number.isFinite(t) || !Number.isFinite(p)) return 0;
      return t * p;
    }
    function formatMoney(n) {
      if (!Number.isFinite(n)) return '$0.00';
      return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function formatTons(n) {
      if (!Number.isFinite(n)) return '0';
      return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    }

    function buildOptionList(listKey, selectedId, savedName) {
      const items = (quarryLists[listKey] || []);
      const opts = ['<option value="">—</option>'];
      let matched = false;
      items.forEach(it => {
        const sel = String(it.id) === String(selectedId) ? ' selected' : '';
        if (sel) matched = true;
        opts.push(`<option value="${escapeHtml(it.id)}"${sel}>${escapeHtml(it.name)}</option>`);
      });
      if (selectedId && !matched) {
        const label = savedName ? `${savedName} (removed)` : '(removed)';
        opts.push(`<option value="${escapeHtml(selectedId)}" selected>${escapeHtml(label)}</option>`);
      }
      return opts.join('');
    }

    function renderSales() {
      const tbody = document.getElementById('salesTbody');
      if (!tbody) return;
      const addBtn = document.getElementById('salesAddBtn');
      if (addBtn) addBtn.disabled = !salesLoaded;

      if (!salesLoaded) {
        tbody.innerHTML = `<tr><td colspan="9" class="sales-empty">Loading…</td></tr>`;
        updateSalesSummary();
        return;
      }
      if (!salesRows.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="sales-empty">No sales yet. Click “+ Add Row” to get started.</td></tr>`;
        updateSalesSummary();
        return;
      }

      tbody.innerHTML = salesRows.map((row, i) => {
        const total = rowTotal(row);
        const employeeOpts = buildOptionList('employees', row.employeeId, row.employeeName);
        const customerOpts = buildOptionList('customer',  row.customerId, row.customerName);
        const productOpts  = buildOptionList('product',   row.productId,  row.productName);
        const paymentOpts  = ['<option value="">—</option>'].concat(
          PAYMENT_OPTIONS.map(p => `<option value="${p}"${row.payment === p ? ' selected' : ''}>${p}</option>`)
        ).join('');
        return `
          <tr>
            <td class="col-date"><input class="cell-input" type="date" value="${escapeHtml(row.date)}" onchange="updateSalesCell(${i}, 'date', this.value)" /></td>
            <td><select class="cell-select" onchange="updateSalesSelect(${i}, 'employee', this)">${employeeOpts}</select></td>
            <td><select class="cell-select" onchange="updateSalesSelect(${i}, 'customer', this)">${customerOpts}</select></td>
            <td><select class="cell-select" onchange="updateSalesSelect(${i}, 'product', this)">${productOpts}</select></td>
            <td class="col-num"><input class="cell-input" type="number" min="0" step="0.01" value="${row.tons === '' ? '' : row.tons}" placeholder="0" oninput="updateSalesNumber(${i}, 'tons', this.value)" /></td>
            <td class="col-payment"><select class="cell-select" onchange="updateSalesCell(${i}, 'payment', this.value)">${paymentOpts}</select></td>
            <td class="col-num"><input class="cell-input" type="number" min="0" step="0.01" value="${row.pricePerTon === '' ? '' : row.pricePerTon}" placeholder="0.00" oninput="updateSalesNumber(${i}, 'pricePerTon', this.value)" /></td>
            <td class="col-total"><div class="cell-readonly${total ? '' : ' is-zero'}" id="sales-total-${i}">${formatMoney(total)}</div></td>
            <td class="col-actions"><button class="row-del-btn" title="Delete row" onclick="deleteSalesRow(${i})">✕</button></td>
          </tr>`;
      }).join('');

      updateSalesSummary();
    }

    function updateSalesSummary() {
      const el = document.getElementById('salesSummary');
      if (!el) return;
      let totalTons = 0, totalSales = 0, count = 0;
      salesRows.forEach(r => {
        const t = Number(r.tons);
        const p = Number(r.pricePerTon);
        if (Number.isFinite(t)) totalTons += t;
        if (Number.isFinite(t) && Number.isFinite(p)) totalSales += t * p;
        count++;
      });
      el.innerHTML = `Rows<strong>${count}</strong>· Total Tons<strong>${formatTons(totalTons)}</strong>· Total Sales<strong>${formatMoney(totalSales)}</strong>`;
    }

    function addSalesRow() {
      if (!salesLoaded) return;
      salesRows.push(normalizeSalesRow({ date: todayIso() }));
      scheduleSalesSave();
      renderSales();
    }

    function deleteSalesRow(index) {
      if (!salesLoaded) return;
      if (!salesRows[index]) return;
      salesRows.splice(index, 1);
      scheduleSalesSave();
      renderSales();
    }

    function updateSalesCell(index, field, value) {
      if (!salesLoaded || !salesRows[index]) return;
      salesRows[index][field] = value;
      scheduleSalesSave();
    }

    function updateSalesSelect(index, kind, selectEl) {
      if (!salesLoaded || !salesRows[index]) return;
      const id = selectEl.value;
      const opt = selectEl.options[selectEl.selectedIndex];
      const name = opt ? opt.text.replace(/ \(removed\)$/, '') : '';
      const idField = kind + 'Id';
      const nameField = kind + 'Name';
      // Manage lists store 'customer'/'product'/'employees' under their own keys;
      // map dropdown 'kind' to the list-key used by quarryLists.
      const listKey = kind === 'employee' ? 'employees' : kind;
      const listItem = (quarryLists[listKey] || []).find(it => String(it.id) === String(id));
      salesRows[index][idField] = id;
      salesRows[index][nameField] = listItem ? listItem.name : name;
      scheduleSalesSave();
    }

    function updateSalesNumber(index, field, raw) {
      if (!salesLoaded || !salesRows[index]) return;
      const s = String(raw).trim();
      salesRows[index][field] = s === '' ? '' : Number(s);
      // Live-update the total cell + summary without a full re-render so the
      // caret stays in the input the user is typing in.
      const totalEl = document.getElementById('sales-total-' + index);
      if (totalEl) {
        const total = rowTotal(salesRows[index]);
        totalEl.textContent = formatMoney(total);
        totalEl.classList.toggle('is-zero', !total);
      }
      updateSalesSummary();
      scheduleSalesSave();
    }

    refreshSales();

    // ── Crushing Tracking ───────────────────────────────────────
    const QUARRY_CRUSH_KEY = 'fct_quarry_crushing';

    let crushRows = [];
    let crushLoaded = false;
    let crushSavePending = null;
    let crushSaveInFlight = false;
    let crushFetchedOnce = false;

    const CRUSH_NUM_FIELDS = [
      'hourlyRate', 'hours', 'fuelGallons', 'fuelCost',
      'loadsToCrusher', 'tonsPerLoad', 'hoursCrushing',
    ];

    function normalizeCrushRow(r) {
      const row = (r && typeof r === 'object') ? r : {};
      const out = {
        id: row.id || (Date.now() + '-' + Math.random().toString(36).slice(2, 7)),
        date: typeof row.date === 'string' ? row.date : '',
        employeeId: row.employeeId || '',
        employeeName: row.employeeName || '',
        comments: typeof row.comments === 'string' ? row.comments : '',
      };
      CRUSH_NUM_FIELDS.forEach(f => {
        const v = row[f];
        out[f] = (v === '' || v === null || v === undefined) ? '' : Number(v);
      });
      return out;
    }
    function normalizeCrushRows(value) {
      if (!Array.isArray(value)) return [];
      return value.map(normalizeCrushRow);
    }

    async function fetchCrush() {
      const res = await fetch(`/api/data/${QUARRY_CRUSH_KEY}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) throw new Error(`GET ${QUARRY_CRUSH_KEY} → ${res.status}`);
      const data = await res.json();
      return normalizeCrushRows(data.value);
    }
    async function putCrush(value) {
      const res = await fetch(`/api/data/${QUARRY_CRUSH_KEY}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ value }),
      });
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error(`PUT ${QUARRY_CRUSH_KEY} → ${res.status} ${text}`);
      }
    }
    function scheduleCrushSave() {
      crushSavePending = crushRows.map(r => ({ ...r }));
      if (crushSaveInFlight) return;
      flushCrushSave();
    }
    async function flushCrushSave() {
      while (crushSavePending) {
        const snapshot = crushSavePending;
        crushSavePending = null;
        crushSaveInFlight = true;
        try {
          await putCrush(snapshot);
        } catch (err) {
          console.error('[quarry] crushing save failed:', err);
          alert('Could not save crushing changes — please check your connection and try again.');
        } finally {
          crushSaveInFlight = false;
        }
      }
    }
    async function refreshCrush() {
      try {
        if (listsLoaded) {
          fetchLists().then(fresh => { quarryLists = fresh; renderCrush(); }).catch(() => {});
        }
        const fresh = await fetchCrush();
        crushRows = fresh;
        crushLoaded = true;
        crushFetchedOnce = true;
        renderCrush();
      } catch (err) {
        console.error('[quarry] crushing refresh failed:', err);
        if (!crushFetchedOnce) {
          crushRows = [];
          crushLoaded = true;
          renderCrush();
        }
      }
    }

    function crushCalc(row) {
      const num = v => Number.isFinite(Number(v)) ? Number(v) : 0;
      const totalPayroll = num(row.hourlyRate) * num(row.hours);
      const totalFuel    = num(row.fuelGallons) * num(row.fuelCost);
      const estimatedTons = num(row.loadsToCrusher) * num(row.tonsPerLoad);
      const hoursCrushing = num(row.hoursCrushing);
      const tonsPerHour  = hoursCrushing > 0 ? estimatedTons / hoursCrushing : 0;
      const totalCost    = totalPayroll + totalFuel;
      const costPerTon   = estimatedTons > 0 ? totalCost / estimatedTons : 0;
      return { totalPayroll, totalFuel, estimatedTons, tonsPerHour, totalCost, costPerTon };
    }

    function renderCrush() {
      const tbody = document.getElementById('crushTbody');
      if (!tbody) return;
      const addBtn = document.getElementById('crushAddBtn');
      if (addBtn) addBtn.disabled = !crushLoaded;

      if (!crushLoaded) {
        tbody.innerHTML = `<tr><td colspan="17" class="sales-empty">Loading…</td></tr>`;
        updateCrushSummary();
        return;
      }
      if (!crushRows.length) {
        tbody.innerHTML = `<tr><td colspan="17" class="sales-empty">No crushing entries yet. Click “+ Add Row” to get started.</td></tr>`;
        updateCrushSummary();
        return;
      }

      tbody.innerHTML = crushRows.map((row, i) => {
        const c = crushCalc(row);
        const employeeOpts = buildOptionList('employees', row.employeeId, row.employeeName);
        const calcCell = (id, val, money) => {
          const z = !val ? ' is-zero' : '';
          const txt = money ? formatMoney(val) : formatTons(val);
          return `<div class="cell-readonly is-calc${z}" id="${id}-${i}">${txt}</div>`;
        };
        return `
          <tr>
            <td class="col-date"><input class="cell-input" type="date" value="${escapeHtml(row.date)}" onchange="updateCrushCell(${i}, 'date', this.value)" /></td>
            <td><select class="cell-select" onchange="updateCrushEmployee(${i}, this)">${employeeOpts}</select></td>
            <td class="col-num"><input class="cell-input" type="number" min="0" step="0.01" value="${row.hourlyRate === '' ? '' : row.hourlyRate}" placeholder="0.00" oninput="updateCrushNumber(${i}, 'hourlyRate', this.value)" /></td>
            <td class="col-num"><input class="cell-input" type="number" min="0" step="0.01" value="${row.hours === '' ? '' : row.hours}" placeholder="0" oninput="updateCrushNumber(${i}, 'hours', this.value)" /></td>
            <td class="col-total">${calcCell('crush-totalPayroll', c.totalPayroll, true)}</td>
            <td class="col-num"><input class="cell-input" type="number" min="0" step="0.01" value="${row.fuelGallons === '' ? '' : row.fuelGallons}" placeholder="0" oninput="updateCrushNumber(${i}, 'fuelGallons', this.value)" /></td>
            <td class="col-num"><input class="cell-input" type="number" min="0" step="0.001" value="${row.fuelCost === '' ? '' : row.fuelCost}" placeholder="0.00" oninput="updateCrushNumber(${i}, 'fuelCost', this.value)" /></td>
            <td class="col-total">${calcCell('crush-totalFuel', c.totalFuel, true)}</td>
            <td class="col-num"><input class="cell-input" type="number" min="0" step="1" value="${row.loadsToCrusher === '' ? '' : row.loadsToCrusher}" placeholder="0" oninput="updateCrushNumber(${i}, 'loadsToCrusher', this.value)" /></td>
            <td class="col-num"><input class="cell-input" type="number" min="0" step="0.01" value="${row.tonsPerLoad === '' ? '' : row.tonsPerLoad}" placeholder="0" oninput="updateCrushNumber(${i}, 'tonsPerLoad', this.value)" /></td>
            <td class="col-total">${calcCell('crush-estimatedTons', c.estimatedTons, false)}</td>
            <td class="col-num"><input class="cell-input" type="number" min="0" step="0.01" value="${row.hoursCrushing === '' ? '' : row.hoursCrushing}" placeholder="0" oninput="updateCrushNumber(${i}, 'hoursCrushing', this.value)" /></td>
            <td class="col-total">${calcCell('crush-tonsPerHour', c.tonsPerHour, false)}</td>
            <td class="col-total">${calcCell('crush-totalCost', c.totalCost, true)}</td>
            <td class="col-total">${calcCell('crush-costPerTon', c.costPerTon, true)}</td>
            <td class="col-comments"><input class="cell-input" type="text" value="${escapeHtml(row.comments)}" placeholder="Notes…" oninput="updateCrushCell(${i}, 'comments', this.value)" /></td>
            <td class="col-actions"><button class="row-del-btn" title="Delete row" onclick="deleteCrushRow(${i})">✕</button></td>
          </tr>`;
      }).join('');
      updateCrushSummary();
    }

    function updateCrushSummary() {
      const el = document.getElementById('crushSummary');
      if (!el) return;
      let totalHours = 0, totalEstTons = 0, totalCost = 0, count = 0;
      crushRows.forEach(r => {
        const c = crushCalc(r);
        const hc = Number(r.hoursCrushing);
        if (Number.isFinite(hc)) totalHours += hc;
        totalEstTons += c.estimatedTons;
        totalCost += c.totalCost;
        count++;
      });
      const avgCostPerTon = totalEstTons > 0 ? totalCost / totalEstTons : 0;
      el.innerHTML = `Rows<strong>${count}</strong>· Hours Crushing<strong>${formatTons(totalHours)}</strong>· Est. Tons<strong>${formatTons(totalEstTons)}</strong>· Total Cost<strong>${formatMoney(totalCost)}</strong>· Avg Cost/Ton<strong>${formatMoney(avgCostPerTon)}</strong>`;
    }

    function addCrushRow() {
      if (!crushLoaded) return;
      crushRows.push(normalizeCrushRow({ date: todayIso() }));
      scheduleCrushSave();
      renderCrush();
    }
    function deleteCrushRow(index) {
      if (!crushLoaded || !crushRows[index]) return;
      crushRows.splice(index, 1);
      scheduleCrushSave();
      renderCrush();
    }
    function updateCrushCell(index, field, value) {
      if (!crushLoaded || !crushRows[index]) return;
      crushRows[index][field] = value;
      scheduleCrushSave();
    }
    function updateCrushEmployee(index, selectEl) {
      if (!crushLoaded || !crushRows[index]) return;
      const id = selectEl.value;
      const opt = selectEl.options[selectEl.selectedIndex];
      const name = opt ? opt.text.replace(/ \(removed\)$/, '') : '';
      const listItem = (quarryLists.employees || []).find(it => String(it.id) === String(id));
      crushRows[index].employeeId = id;
      crushRows[index].employeeName = listItem ? listItem.name : name;
      const empRate = listItem && listItem.rate !== undefined && listItem.rate !== null ? Number(listItem.rate) : null;
      if (empRate !== null && Number.isFinite(empRate)) {
        crushRows[index].hourlyRate = empRate;
      }
      scheduleCrushSave();
      renderCrush();
    }
    function updateCrushNumber(index, field, raw) {
      if (!crushLoaded || !crushRows[index]) return;
      const s = String(raw).trim();
      crushRows[index][field] = s === '' ? '' : Number(s);
      // Live-update calculated cells in this row without re-rendering inputs.
      const c = crushCalc(crushRows[index]);
      const setCalc = (key, val, money) => {
        const elc = document.getElementById('crush-' + key + '-' + index);
        if (!elc) return;
        elc.textContent = money ? formatMoney(val) : formatTons(val);
        elc.classList.toggle('is-zero', !val);
      };
      setCalc('totalPayroll',   c.totalPayroll,   true);
      setCalc('totalFuel',      c.totalFuel,      true);
      setCalc('estimatedTons',  c.estimatedTons,  false);
      setCalc('tonsPerHour',    c.tonsPerHour,    false);
      setCalc('totalCost',      c.totalCost,      true);
      setCalc('costPerTon',     c.costPerTon,     true);
      updateCrushSummary();
      scheduleCrushSave();
    }

    refreshCrush();
  </script>

</body>
</html>
