                 <span class="sub">${m.signed} of ${m.expected} signatures</span></div>
               <div class="meta">
                 <div><span class="k">Forms</span><span class="v">${m.docs.length}</span></div>
                 <div><span class="k">Employees</span><span class="v">${m.people.length}</span></div>
                 <div><span class="k">Signed every form</span><span class="v">${m.allSigned}</span></div>
                 <div><span class="k">Signed none</span><span class="v">${m.noneSigned}</span></div>
                 <div><span class="k">Figures as of</span><span class="v">${esc(stamp(m.at, true))}</span></div>
                 ${printedCell(info)}
               </div>
             </div>`
          : `<h1>Employee sign rate — continued</h1>
             <p class="cont">Forms ${a + 1}–${b} of ${m.docs.length} &middot; ${esc(rangeLabel(cols.map(d => d.doc.weekOf)))}</p>`;
        return `
          <section class="sheet">
            ${printHead(info, 'Employee sign rate')}
            ${top}
            ${key}
            ${k === 0 ? rateNoteHTML(m) : ''}
            <table class="rgrid${few ? ' few' : ''}">
              <thead><tr>
                <th class="n">#</th><th class="emp">Employee</th><th class="pct">Rate</th>
                ${cols.map(d => `<th class="doc"><div class="dh"><b>${esc(d.doc.title)}</b><span>${
                  esc(weekLabel(d.doc.weekOf))}</span></div></th>`).join('')}
              </tr></thead>
              <tbody>${people.map((x, i) => `
                <tr>
                  <td class="n">${i + 1}</td>
                  <td class="emp"><div class="nm"><b>${esc(x.username)}</b>${x.fullName ? `<small>${esc(x.fullName)}</small>` : ''}</div></td>
                  <td class="pct"><small>${x.signed}/${x.expected}</small><b>${pctText(pctOf(x.signed, x.expected))}</b></td>
                  ${x.marks.slice(a, b).map(s => `<td class="c"><i class="sq ${s ? 'yes' : 'no'}"></i></td>`).join('')}
                </tr>`).join('')}
                <tr class="tot">
                  <td class="n"></td><td class="emp">Form sign rate</td><td class="pct">${pctText(p)}</td>
                  ${cols.map(d => `<td class="fr">${pctText(pctOf(d.signed, d.expected))}</td>`).join('')}
                </tr>
              </tbody>
            </table>
          </section>`;
      }).join('');
    }

    function printRate() {
      const m = state.rate;
      if (state.rateLoading) return toast('Still loading the sign rate…');
      if (!m || !m.docs.length || !m.people.length) return toast('Nothing to print yet.', true);
      const w = openPrintWindow('the sign rate');
      if (!w) return;
      fillPrintWindow(w, `Employee sign rate — ${rateFileStem(m)}`, rateSheetsHTML(m, printInfo()), RATE_PRINT_CSS);
    }

    /* ── Excel ── */
    /* A real .xlsx, written by hand like every other export in this app — the
       page loads no libraries, and a stored (uncompressed) zip is a valid
       archive that needs no compressor. Mirrors the writer in intercompany.html.

       The squares are Yes / No in Excel's own Good and Bad colours, so the
       sheet still reads in black and white, and filters and COUNTIF work on
       words. Every rate is a formula over those cells, carrying the value it
       works out to for a preview pane that never runs it — clear a cell for a
       form somebody started after, and their rate, the form's and the overall
       one all recalculate without it. */
    const XL_CRC = (() => {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c >>> 0;
      }
      return t;
    })();

    function xlZip(files) {
      const enc = new TextEncoder();
      const chunks = [], central = [];
      let offset = 0;
      for (const f of files) {
        const name = enc.encode(f.name);
        const data = enc.encode(f.data);
        let crc = 0xFFFFFFFF;
        for (let i = 0; i < data.length; i++) crc = XL_CRC[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
        crc = (crc ^ 0xFFFFFFFF) >>> 0;

        const local = new Uint8Array(30 + name.length);
        const lv = new DataView(local.buffer);
        lv.setUint32(0, 0x04034b50, true);   // local file header
        lv.setUint16(4, 20, true);           // version needed
        lv.setUint16(6, 0x0800, true);       // UTF-8 names
        lv.setUint32(14, crc, true);
        lv.setUint32(18, data.length, true); // stored: compressed = uncompressed
        lv.setUint32(22, data.length, true);
        lv.setUint16(26, name.length, true);
        local.set(name, 30);
        chunks.push(local, data);

        const cd = new Uint8Array(46 + name.length);
        const cv = new DataView(cd.buffer);
        cv.setUint32(0, 0x02014b50, true);   // central directory entry
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0x0800, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, data.length, true);
        cv.setUint32(24, data.length, true);
        cv.setUint16(28, name.length, true);
        cv.setUint32(42, offset, true);
        cd.set(name, 46);
        central.push(cd);
        offset += local.length + data.length;
      }
      const cdSize = central.reduce((n, c) => n + c.length, 0);
      const end = new Uint8Array(22);
      const ev = new DataView(end.buffer);
      ev.setUint32(0, 0x06054b50, true);     // end of central directory
      ev.setUint16(8, files.length, true);
      ev.setUint16(10, files.length, true);
      ev.setUint32(12, cdSize, true);
      ev.setUint32(16, offset, true);
      return new Blob(chunks.concat(central, [end]),
        { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    }

    const xlEsc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
      // Excel refuses a workbook carrying a control character. A line break
      // is not one — the form headings use it.
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

    function xlCol(n) {
      let s = '';
      while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
      return s;
    }

    // Excel counts days from 1899-12-30. Read off the date's own digits rather
    // than a local Date, so a week never slides a day.
    function xlDate(ymd) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd || ''));
      return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000) + 25569 : '';
    }

    // Style indices into XL_STYLES' cellXfs.
    const XL = {
      title: 1, sub: 2, bold: 3, head: 4, headDoc: 5, headNum: 6, text: 7, pct: 8, int: 9,
      yes: 10, no: 11, totText: 12, totPct: 13, totPctC: 14, totInt: 15, hero: 16, date: 17,
    };

    // numFmt 164 is a whole percent with pctOf()'s honesty at the top end:
    // anything short of every signature shows 99% at most, never a rounded
    // 100%. The cell still holds the exact share underneath.
    const XL_STYLES =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
        '<numFmts count="2">' +
          '<numFmt numFmtId="164" formatCode="[=1]0%;[&gt;=0.99]&quot;99%&quot;;0%"/>' +
          '<numFmt numFmtId="165" formatCode="mmm d, yyyy"/>' +
        '</numFmts>' +
        '<fonts count="8">' +
          '<font><sz val="11"/><color rgb="FF1F2937"/><name val="Calibri"/><family val="2"/></font>' +
          '<font><b/><sz val="11"/><color rgb="FF1F2937"/><name val="Calibri"/><family val="2"/></font>' +
          '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font>' +
          '<font><b/><sz val="16"/><color rgb="FF1F2A44"/><name val="Calibri"/><family val="2"/></font>' +
          '<font><sz val="10"/><color rgb="FF6B7280"/><name val="Calibri"/><family val="2"/></font>' +
          // Excel's own Good and Bad, text and fill, so the squares read the
          // way every conditional format in every other workbook does.
          '<font><b/><sz val="11"/><color rgb="FF006100"/><name val="Calibri"/><family val="2"/></font>' +
          '<font><b/><sz val="11"/><color rgb="FF9C0006"/><name val="Calibri"/><family val="2"/></font>' +
          '<font><b/><sz val="20"/><color rgb="FF1F2A44"/><name val="Calibri"/><family val="2"/></font>' +
        '</fonts>' +
        '<fills count="6">' +
          '<fill><patternFill patternType="none"/></fill>' +
          '<fill><patternFill patternType="gray125"/></fill>' +
          '<fill><patternFill patternType="solid"><fgColor rgb="FF1F2A44"/><bgColor indexed="64"/></patternFill></fill>' +
          '<fill><patternFill patternType="solid"><fgColor rgb="FFC6EFCE"/><bgColor indexed="64"/></patternFill></fill>' +
          '<fill><patternFill patternType="solid"><fgColor rgb="FFFFC7CE"/><bgColor indexed="64"/></patternFill></fill>' +
          '<fill><patternFill patternType="solid"><fgColor rgb="FFEDEFF3"/><bgColor indexed="64"/></patternFill></fill>' +
        '</fills>' +
        '<borders count="4">' +
          '<border><left/><right/><top/><bottom/><diagonal/></border>' +
          '<border><left/><right/><top/><bottom style="hair"><color rgb="FFC9CEDA"/></bottom><diagonal/></border>' +
          '<border><left/><right/><top style="thin"><color rgb="FF9AA1AE"/></top><bottom/><diagonal/></border>' +
          // A white rule round each Yes / No: the gap between squares on screen.
          '<border><left style="thin"><color rgb="FFFFFFFF"/></left><right style="thin"><color rgb="FFFFFFFF"/></right>' +
            '<top style="thin"><color rgb="FFFFFFFF"/></top><bottom style="thin"><color rgb="FFFFFFFF"/></bottom><diagonal/></border>' +
        '</borders>' +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="18">' +
          '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
          '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
          '<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
          '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
          '<xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1">' +
            '<alignment horizontal="left" vertical="bottom" wrapText="1"/></xf>' +
          // 5 — a form's heading, turned to read bottom to top like the screen's.
          '<xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1">' +
            '<alignment horizontal="center" vertical="bottom" textRotation="90" wrapText="1"/></xf>' +
          '<xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1">' +
            '<alignment horizontal="right" vertical="bottom" wrapText="1"/></xf>' +
          '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>' +
          '<xf numFmtId="164" fontId="1" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1"/>' +
          '<xf numFmtId="1" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>' +
          // 10, 11 — Yes and No.
          '<xf numFmtId="0" fontId="5" fillId="3" borderId="3" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">' +
            '<alignment horizontal="center" vertical="center"/></xf>' +
          '<xf numFmtId="0" fontId="6" fillId="4" borderId="3" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">' +
            '<alignment horizontal="center" vertical="center"/></xf>' +
          '<xf numFmtId="0" fontId="1" fillId="5" borderId="2" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/>' +
          '<xf numFmtId="164" fontId="1" fillId="5" borderId="2" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/>' +
          '<xf numFmtId="164" fontId="1" fillId="5" borderId="2" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">' +
            '<alignment horizontal="center"/></xf>' +
          '<xf numFmtId="1" fontId="1" fillId="5" borderId="2" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/>' +
          '<xf numFmtId="164" fontId="7" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyAlignment="1">' +
            '<alignment horizontal="left" vertical="center"/></xf>' +
          '<xf numFmtId="165" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1">' +
            '<alignment horizontal="left"/></xf>' +
        '</cellXfs>' +
        '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';

    // A cell is { v, s } — a string or a number — or { f, v, s }: a formula and
    // the value it works out to, which Excel recalculates on open and a
    // preview pane or a phone shows without ever running the formula.
    function xlRow(r, cells, ht) {
      const num = v => Math.round(Number(v) * 1e6) / 1e6;
      return `<row r="${r}"${ht ? ` ht="${ht}" customHeight="1"` : ''}>` + cells.map((c, i) => {
        if (!c) return '';
        const ref = xlCol(i + 1) + r;
        const st  = c.s ? ` s="${c.s}"` : '';
        if (c.f) {
          return typeof c.v === 'number'
            ? `<c r="${ref}"${st}><f>${xlEsc(c.f)}</f><v>${num(c.v)}</v></c>`
            : `<c r="${ref}"${st} t="str"><f>${xlEsc(c.f)}</f><v>${xlEsc(c.v)}</v></c>`;
        }
        if (typeof c.v === 'number') return isFinite(c.v) ? `<c r="${ref}"${st}><v>${num(c.v)}</v></c>` : `<c r="${ref}"${st}/>`;
        if (c.v == null || c.v === '') return `<c r="${ref}"${st}/>`;
        return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xlEsc(c.v)}</t></is></c>`;
      }).join('') + '</row>';
    }

    // freeze: [columns, rows] held still while the rest scrolls.
    function xlSheet({ widths, rows, heights, freeze, filterRef, landscape }) {
      const [fx, fy] = freeze;
      const tl = xlCol(fx + 1) + (fy + 1);
      const pane = fx
        ? `<pane xSplit="${fx}" ySplit="${fy}" topLeftCell="${tl}" activePane="bottomRight" state="frozen"/>` +
          '<selection pane="topRight"/><selection pane="bottomLeft"/>' +
          `<selection pane="bottomRight" activeCell="${tl}" sqref="${tl}"/>`
        : `<pane ySplit="${fy}" topLeftCell="${tl}" activePane="bottomLeft" state="frozen"/>` +
          `<selection pane="bottomLeft" activeCell="${tl}" sqref="${tl}"/>`;
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
          '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' +
          `<dimension ref="A1:${xlCol(widths.length)}${rows.length}"/>` +
          `<sheetViews><sheetView showGridLines="0" workbookViewId="0">${pane}</sheetView></sheetViews>` +
          '<sheetFormatPr defaultRowHeight="15"/>' +
          '<cols>' + widths.map((w, i) =>
            `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>' +
          '<sheetData>' + rows.map((cells, i) => xlRow(i + 1, cells, heights && heights[i + 1])).join('') + '</sheetData>' +
          (filterRef ? `<autoFilter ref="${filterRef}"/>` : '') +
          '<pageMargins left="0.4" right="0.4" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>' +
          `<pageSetup orientation="${landscape ? 'landscape' : 'portrait'}" fitToWidth="1" fitToHeight="0"/>` +
        '</worksheet>';
    }

    function xlWorkbook(sheets) {
      const n   = sheets.length;
      const rel = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
      const ct  = 'application/vnd.openxmlformats-officedocument.spreadsheetml';
      // _FilterDatabase is the name Excel writes beside every autoFilter.
      // Excel copes without it; LibreOffice drops the filter dropdowns.
      const abs = ref => ref.replace(/([A-Z]+)(\d+)/g, '$$$1$$$2');
      const names = sheets.map((s, i) => {
        const q = `'${xlEsc(s.name)}'!`;
        const titles = [
          s.titleCols ? `${q}$${s.titleCols.replace(':', ':$')}` : '',
          s.titleRow ? `${q}$${s.titleRow}:$${s.titleRow}` : '',
        ].filter(Boolean).join(',');
        return (s.filterRef ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">${q}${abs(s.filterRef)}</definedName>` : '')
          + (titles ? `<definedName name="_xlnm.Print_Titles" localSheetId="${i}">${titles}</definedName>` : '');
      }).join('');
      return xlZip([
        { name: '[Content_Types].xml', data:
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
            '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
            '<Default Extension="xml" ContentType="application/xml"/>' +
            `<Override PartName="/xl/workbook.xml" ContentType="${ct}.sheet.main+xml"/>` +
            sheets.map((_, i) =>
              `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="${ct}.worksheet+xml"/>`).join('') +
            `<Override PartName="/xl/styles.xml" ContentType="${ct}.styles+xml"/>` +
          '</Types>' },
        { name: '_rels/.rels', data:
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
            `<Relationship Id="rId1" Type="${rel}/officeDocument" Target="xl/workbook.xml"/>` +
          '</Relationships>' },
        { name: 'xl/workbook.xml', data:
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${rel}">` +
            '<bookViews><workbookView activeTab="0"/></bookViews>' +
            '<sheets>' + sheets.map((s, i) =>
              `<sheet name="${xlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets>' +
            (names ? `<definedNames>${names}</definedNames>` : '') +
            '<calcPr calcId="124519" fullCalcOnLoad="1"/>' +
          '</workbook>' },
        { name: 'xl/_rels/workbook.xml.rels', data:
          '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
            sheets.map((_, i) =>
              `<Relationship Id="rId${i + 1}" Type="${rel}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
            `<Relationship Id="rId${n + 1}" Type="${rel}/styles" Target="styles.xml"/>` +
          '</Relationships>' },
        { name: 'xl/styles.xml', data: XL_STYLES },
        ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: s.xml })),
      ]);
    }

    /* Two sheets. Sign Rate is the grid: a person a row, a form a column, the
       person and their rate frozen at the left and the form headings across
       the top. Forms lists the forms one per row — the headings in full, which
       a narrow turned column cannot always hold — counted off the grid, so a
       cell cleared there carries through. The text above each table is kept
       inside its frozen columns: a line that ran past them would be cut off at
       the freeze. */
    function buildRateXlsx(m, info) {
      const people  = ratePeople(m);
      const share   = (n, d) => (d ? n / d : 0);
      const HEAD    = 8, FIRST = HEAD + 1, LAST = HEAD + people.length, TOT = LAST + 1;
      const docCol  = c => xlCol(6 + c);                   // forms start in column F
      const lastDoc = docCol(m.docs.length - 1);
      const across  = r => `F${r}:${lastDoc}${r}`;
      const down    = col => `${col}${FIRST}:${col}${LAST}`;
      const weeks   = m.docs.map(d => d.doc.weekOf);
      const company = info.company || 'Safety Center';

      const grid = [
        [{ v: 'Employee Sign Rate', s: XL.title }],
        [{ v: company, s: XL.bold }],
        [{ v: rangeLabel(weeks), s: XL.sub }],
        [{ v: 'Overall sign rate', s: XL.bold },
         { f: `C${TOT}`, v: share(m.signed, m.expected), s: XL.hero },
         { f: `D${TOT}&" of "&E${TOT}`, v: `${m.signed} of ${m.expected}`, s: XL.sub }],
        [{ v: `${plural(m.docs.length, 'form')} · ${plural(people.length, 'employee')}`, s: XL.sub }],
        [{ v: 'Yes = signed · No = not signed', s: XL.sub }],
        [{ v: `Figures as of ${stamp(m.at, true)}`, s: XL.sub }],
        [
          { v: 'Employee', s: XL.head }, { v: 'Name (as signed)', s: XL.head },
          { v: 'Sign rate', s: XL.headNum }, { v: 'Signed', s: XL.headNum }, { v: 'Forms', s: XL.headNum },
          ...m.docs.map(d => ({ v: `${d.doc.title}\n${weekLabel(d.doc.weekOf)}`, s: XL.headDoc })),
        ],
      ];
      people.forEach((x, i) => {
        const r = FIRST + i;
        grid.push([
          { v: x.username, s: XL.text },
          { v: x.fullName, s: XL.text },
          { f: `IF(E${r},D${r}/E${r},"")`, v: share(x.signed, x.expected), s: XL.pct },
          { f: `COUNTIF(${across(r)},"Yes")`, v: x.signed, s: XL.int },
          { f: `COUNTA(${across(r)})`, v: x.expected, s: XL.int },
          ...x.marks.map(s => (s ? { v: 'Yes', s: XL.yes } : { v: 'No', s: XL.no })),
        ]);
      });
      grid.push([
        { v: 'Form sign rate', s: XL.totText }, { v: '', s: XL.totText },
        { f: `IF(E${TOT},D${TOT}/E${TOT},"")`, v: share(m.signed, m.expected), s: XL.totPct },
        { f: `SUM(${down('D')})`, v: m.signed, s: XL.totInt },
        { f: `SUM(${down('E')})`, v: m.expected, s: XL.totInt },
        ...m.docs.map((d, c) => {
          const col = docCol(c);
          return { f: `IF(COUNTA(${down(col)}),COUNTIF(${down(col)},"Yes")/COUNTA(${down(col)}),"")`,
                   v: share(d.signed, d.expected), s: XL.totPctC };
        }),
      ]);

      const FH = 5;
      const gone = m.withdrawn
        ? ` — ${plural(m.withdrawn, 'form')} archived before anyone signed ${m.withdrawn === 1 ? 'it is' : 'them are'} left out` : '';
      const forms = [
        [{ v: 'Forms in this report', s: XL.title }],
        [{ v: `${company} · ${rangeLabel(weeks)}`, s: XL.sub }],
        [{ v: 'Everyone on the Safety Center roster is counted against every form in the range, archived forms included' + gone + '.', s: XL.sub }],
        [{ v: 'Signed and Expected are counted off the Sign Rate sheet, so a cell cleared there carries through here.', s: XL.sub }],
        ['Week of', 'Form', 'Posted by', 'Archived', 'Signed', 'Expected', 'Sign rate']
          .map((v, i) => ({ v, s: i >= 4 ? XL.headNum : XL.head })),
      ];
      m.docs.forEach((d, c) => {
        const r   = FH + 1 + c;
        const rng = `'Sign Rate'!$${docCol(c)}$${FIRST}:$${docCol(c)}$${LAST}`;
        forms.push([
          { v: xlDate(d.doc.weekOf), s: XL.date },
          { v: d.doc.title, s: XL.text },
          { v: d.doc.uploadedBy || '', s: XL.text },
          { v: d.doc.archivedAt ? xlDate(ymdOf(d.doc.archivedAt)) : '', s: XL.date },
          { f: `COUNTIF(${rng},"Yes")`, v: d.signed, s: XL.int },
          { f: `COUNTA(${rng})`, v: d.expected, s: XL.int },
          { f: `IF(F${r},E${r}/F${r},"")`, v: share(d.signed, d.expected), s: XL.pct },
        ]);
      });
      const FL = FH + m.docs.length, FT = FL + 1;
      forms.push([
        { v: 'All forms', s: XL.totText }, { v: '', s: XL.totText }, { v: '', s: XL.totText }, { v: '', s: XL.totText },
        { f: `SUM(E${FH + 1}:E${FL})`, v: m.signed, s: XL.totInt },
        { f: `SUM(F${FH + 1}:F${FL})`, v: m.expected, s: XL.totInt },
        { f: `IF(F${FT},E${FT}/F${FT},"")`, v: share(m.signed, m.expected), s: XL.totPct },
      ]);
      // Below the totals, so nothing above moves and nothing here is summed:
      // the forms a supervisor took out of the rate, by name, with who and when.
      if (m.leftOut.length) {
        forms.push([], [{ v: 'Left out of the sign rate by a safety supervisor — not counted above', s: XL.bold }]);
        forms.push(['Week of', 'Form', 'Left out by', 'Left out on'].map(v => ({ v, s: XL.head })));
        m.leftOut.forEach(d => forms.push([
          { v: xlDate(d.weekOf), s: XL.date },
          { v: d.title, s: XL.text },
          { v: d.rateExcludedBy || '', s: XL.text },
          { v: d.rateExcludedAt ? xlDate(ymdOf(d.rateExcludedAt)) : '', s: XL.date },
        ]));
      }

      const gridFilter  = `A${HEAD}:${lastDoc}${LAST}`;
      const formsFilter = `A${FH}:G${FL}`;
      return xlWorkbook([
        { name: 'Sign Rate', filterRef: gridFilter, titleCols: 'A:C', titleRow: HEAD,
          xml: xlSheet({ widths: [20, 22, 11, 9, 9, ...m.docs.map(() => 7)], rows: grid,
                         heights: { [HEAD]: 165 }, freeze: [3, HEAD], filterRef: gridFilter, landscape: true }) },
        { name: 'Forms', filterRef: formsFilter, titleRow: FH,
          xml: xlSheet({ widths: [14, 44, 16, 14, 9, 10, 11], rows: forms,
                         freeze: [0, FH], filterRef: formsFilter, landscape: false }) },
      ]);
    }

    function downloadRateXlsx() {
      const m = state.rate;
      if (state.rateLoading) return toast('Still loading the sign rate…');
      if (!m || !m.docs.length || !m.people.length) return toast('Nothing to export yet.', true);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(buildRateXlsx(m, printInfo()));
      a.download = `safety-sign-rate-${rateFileStem(m).replace(' to ', '_to_')}.xlsx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // Revoked on a timer: Safari reads the blob after the click returns.
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }

    /* ═══════ Nav ═══════ */
    function goToDivisions() { localStorage.removeItem('fct_division'); window.location.replace('divisions.html'); }
    function signOut() {
      localStorage.removeItem('fct_token');
      localStorage.removeItem('fct_user');
      localStorage.removeItem('fct_division');
      window.location.replace('index.html');
    }

    /* Why these are delegated rather than inline onclick="fn('${id}')":
       an inline handler's body is JAVASCRIPT, and the HTML parser decodes
       entities in an attribute value BEFORE that source is compiled. esc()
       turns a quote into &#39;, the parser turns it back into a quote, and the
       string literal the id sits in is closed — so a document whose id carried
       a quote ran its own code in every crew member's and platform admin's
       session. esc() IS sufficient for a quoted attribute value, which is what
       data-doc-id is, and dataset never reaches a compiler at all. */
    function delegate(panelId, handler) {
      const el = document.getElementById(panelId);
      if (el) el.addEventListener('click', handler);
    }

    delegate('panelDocs', function (e) {
      const hit = e.target.closest('[data-act]');
      if (!hit || !this.contains(hit)) return;
      const id = hit.getAttribute('data-doc-id');
      if (hit.getAttribute('data-act') === 'archive') {
        e.stopPropagation();
        archiveDoc(id, hit.getAttribute('data-archived') === '1');
      } else if (hit.getAttribute('data-act') === 'open') {
        openViewer(id);
      }
    });

    // closest() finds the innermost action, so the Print button sitting inside
    // a group's header prints rather than also expanding the group.
    delegate('panelReport', function (e) {
      const hit = e.target.closest('[data-act]');
      if (!hit || !this.contains(hit)) return;
      const act = hit.getAttribute('data-act');
      const id  = hit.getAttribute('data-doc-id');
      if (act === 'print') {
        printDocument(id);
      } else if (act === 'print-sig') {
        printSignature(id, hit.getAttribute('data-username'), hit.getAttribute('data-signed-at'));
      } else if (act === 'toggle') {
        toggleGroup(id);
      }
    });

    // The sign rate's sort buttons, and a tap on a square — the only hover a
    // phone has. A second tap on the same square puts the tooltip away.
    delegate('panelRate', function (e) {
      const hit = e.target.closest('[data-act], td.c, th.doc, td.fr');
      if (!hit || !this.contains(hit)) return;
      const act = hit.getAttribute('data-act');
      if (act === 'rate-sort') {
        // Rate goes lowest first — who to chase — and the next press flips it.
        state.rateSort = hit.getAttribute('data-sort') === 'name' ? 'name'
          : state.rateSort === 'low' ? 'high' : 'low';
        renderRate();
        return;
      }
      if (act === 'rate-forms') {
        state.rateFormsOpen = !state.rateFormsOpen;
        renderRate();
        return;
      }
      if (act) return;   // a box in Forms counted, which answers on change below
      if (rateLastPointer === 'touch' && rateTipFor === hit) hideRateTip();
      else showRateTip(hit);
    });
    document.getElementById('panelRate').addEventListener('change', function (e) {
      const box = e.target.closest && e.target.closest('input[data-act="rate-count"]');
      if (box && this.contains(box)) setFormCounted(box.getAttribute('data-doc-id'), box.checked, box);
    });

    // On a mouse the tooltip follows the pointer. A touch is left to the tap
    // above: a finger sends over and out together, which would flash it.
    (function () {
      const panel  = document.getElementById('panelRate');
      const cellOf = e => (e.target.closest ? e.target.closest('td.c, th.doc, td.fr') : null);
      panel.addEventListener('pointerover', e => {
        if (e.pointerType === 'touch') return;
        const cell = cellOf(e);
        if (cell && panel.contains(cell) && cell !== rateTipFor) showRateTip(cell);
      });
      panel.addEventListener('pointerout', e => {
        if (e.pointerType === 'touch') return;
        const cell = cellOf(e);
        if (cell && cell === rateTipFor && !cell.contains(e.relatedTarget)) hideRateTip();
      });
      // A press anywhere else, or anything that moves the grid out from under
      // it, takes the tooltip down.
      document.addEventListener('pointerdown', e => {
        rateLastPointer = e.pointerType || 'mouse';
        if (!(e.target.closest && e.target.closest('#panelRate td.c, #panelRate th.doc, #panelRate td.fr'))) hideRateTip();
      }, true);
      window.addEventListener('scroll', hideRateTip, true);
      window.addEventListener('resize', hideRateTip);
    })();

    // The one signal available that the document was actually put in front of
    // them. Delegated on the overlay so it survives the body being re-rendered.
    document.getElementById('viewer').addEventListener('click', function (e) {
      if (e.target === this) { closeViewer(); return; }
      const opened = e.target.closest('[data-act="opened"]');
      if (opened && state.viewing) {
        state.opened.add(state.viewing.id);
        updateSignButton();
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') hideRateTip();
      if (e.key === 'Escape' && document.getElementById('viewer').classList.contains('open')) closeViewer();
    });

    /* A laborer usually has this division and nothing else and is routed
       straight here, so Switch would be a dead end. Shown only when they
       actually have somewhere else to go. */
    (function () {
      const roles = (user && user.divisionRoles) || {};
      const n = Object.keys(roles).filter(k => roles[k] && roles[k] !== 'no_access').length;
      if (n > 1 || (user && user.isPlatformAdmin)) {
        document.getElementById('switchBtn').style.display = '';
      }
      document.getElementById('levelBadge').textContent = canManage ? 'Supervisor' : 'Crew';
      document.getElementById('tabReport').style.display = canManage ? '' : 'none';
      document.getElementById('tabRate').style.display   = canManage ? '' : 'none';
    })();

    loadDocs();
  </script>
  <script src="report-branding.js" defer></script>
  <script src="mathis.js" defer></script>
</body>
</html>
