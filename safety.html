         rather than taking a table row each: forty of them fill a quarter of a
         page instead of two. */
      ul.names {
        list-style: none; margin: 0; padding: 0; border-top: 2px solid #111;
        column-count: 4; column-gap: 18px;
      }
      ul.names li {
        padding: 5px 6px; border-bottom: 1px solid #e5e7eb; font-size: 11px; font-weight: 600;
        overflow-wrap: anywhere; break-inside: avoid; page-break-inside: avoid;
      }
      h2.sec + .none { margin: 0; padding: 6px; border-top: 2px solid #111; }
      .person { margin: 16px 0 8px; border: 1px solid #d1d5db; border-radius: 6px; padding: 14px 16px 10px; }
      .person .line {
        height: 1.3in; display: flex; align-items: flex-end;
        border-bottom: 1.5px solid #111; padding-bottom: 4px;
      }
      .person .line img { display: block; max-width: 100%; max-height: 1.22in; }
      .person .under {
        display: flex; justify-content: space-between; gap: 12px; margin-top: 4px;
        font-size: 9.5px; color: #374151;
      }
      .foot { margin-top: 12px; padding-top: 6px; border-top: 1px solid #e5e7eb; font-size: 8.5px; color: #6b7280; }
    `;

    const printInfo = () => ({
      at:      new Date().toISOString(),
      by:      (user && user.username) || '',
      company: (user && (user.companyName || user.companyCode)) || '',
    });

    const ymdOf = iso => { const d = new Date(iso); return isNaN(d.getTime()) ? '' : dstr(d); };

    // Oldest first. The screen leads with this week because that is what is
    // being chased; a printed record reads in the order things happened.
    const byWeek = (a, b) =>
      String(a.document.weekOf || '').localeCompare(String(b.document.weekOf || ''))
      || String(a.document.uploadedAt || '').localeCompare(String(b.document.uploadedAt || ''));

    function rangeLabel(weeks) {
      const sorted = weeks.slice().sort();
      const lo = sorted[0], hi = sorted[sorted.length - 1];
      return lo === hi ? weekLabel(lo) : `Weeks of ${dayLabel(lo)} – ${dayLabel(hi)}`;
    }

    // forEmail: the copy Auto Reports sends, which nobody prints from — no
    // Print bar, no print dialog. The PDF is made from it on the server.
    // css: anything a printout needs on top of the sheets' own — the sign
    // rate's landscape page and its grid.
    function printShell(title, body, forEmail, css) {
      return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
        <title>${esc(title)}</title>
        <style>${PRINT_CSS}${css || ''}</style></head>
        <body>
          ${forEmail ? '' : `<div class="bar no-print">
            <button onclick="window.print()">Print / Save as PDF</button>
            <span>To keep a file for ISNetworld or an audit, pick <b>Save as PDF</b> as the printer.</span>
          </div>`}
          ${body}
          ${forEmail ? '' : `<script>window.onload = function () { window.print(); };<\/script>`}
        </body></html>`;
    }

    function printHead(info, kind) {
      return `<div class="hdr">
          <div class="co">${esc(info.company || 'Safety Center')}</div>
          <div class="kind">${esc(kind)}</div>
        </div>`;
    }

    function printedCell(info) {
      return `<div><span class="k">Printed</span><span class="v">${esc(stamp(info.at, true))}${
        info.by ? ' by ' + esc(info.by) : ''}</span></div>`;
    }

    function printFoot() {
      return `<div class="foot">Collected electronically in the DataWatch Safety Center. Each signer ticked
        the acknowledgement and typed their own full name; a drawn signature is optional and is shown
        wherever one was made. Times are recorded by the server at the moment of signing.</div>`;
    }

    // The drawn mark, or what stands in its place. Drawing is optional — the
    // typed name and the acknowledgement are the signature — so a missing mark
    // is said in words rather than left as a blank that reads like a gap.
    function printMark(s) {
      if (s.signatureImage && PNG_MARK.test(s.signatureImage)) {
        return `<img src="${esc(s.signatureImage)}" alt="Signature of ${esc(s.fullName)}">`;
      }
      return s.hasDrawnSignature
        ? `<span class="none">Drawn signature on file — could not be shown here</span>`
        : `<span class="none">Signed by typed name — no mark drawn</span>`;
    }

    // The sentence each person agreed to is stored with their signature. If the
    // wording ever changes, a sheet whose signers saw two versions shows both,
    // numbered, rather than claiming one sentence for everybody on it.
    function statementBlock(signed, who) {
      const says = [];
      signed.forEach(s => { if (s.statement && !says.includes(s.statement)) says.push(s.statement); });
      if (!says.length) return { html: '', ref: () => '' };
      const html = says.length === 1
        ? `<div class="stmt"><span class="k">${esc(who)} signed to confirm</span><p>“${esc(says[0])}”</p></div>`
        : `<div class="stmt"><span class="k">${esc(who)} signed to confirm the statement numbered beside their name</span>
             <ol>${says.map(t => `<li>“${esc(t)}”</li>`).join('')}</ol></div>`;
      const ref = s => (says.length > 1 && s.statement) ? `<sup>${says.indexOf(s.statement) + 1}</sup>` : '';
      return { html, ref };
    }

    // Who has not signed, by login, in the roster's alphabetical order — the
    // report's own Still to sign list. An empty one is said in words: on a
    // sheet that goes to an auditor, "nobody is outstanding" is a finding.
    function unsignedHTML(g) {
      const out = g.outstanding || [];
      return `
        <div class="unsigned">
          <h2 class="sec">Not signed (${out.length})
            <small>Everyone on the Safety Center roster who had not signed this document when it was printed</small></h2>
          ${out.length
            ? `<ul class="names">${out.map(o => `<li>${esc(o.username)}</li>`).join('')}</ul>`
            : `<p class="none">${g.expectedCount
                ? 'Nobody — everyone on the Safety Center roster has signed this document.'
                : 'Nobody is on the Safety Center roster to sign this document.'}</p>`}
        </div>`;
    }

    function sheetHTML(g, info) {
      const d = g.document;
      // "Each person below" stopped being true once the people who have NOT
      // signed were listed below as well.
      const stmt = statementBlock(g.signed, 'Each signer below');
      return `
        <section class="sheet">
          ${printHead(info, 'Safety sign-off sheet')}
          <h1>${esc(d.title)}</h1>
          <div class="meta">
            <div><span class="k">Week</span><span class="v">${esc(weekLabel(d.weekOf))}</span></div>
            <div><span class="k">File</span><span class="v">${esc(d.filename || '—')}</span></div>
            <div><span class="k">Signatures</span><span class="v">${g.signed.length}</span></div>
            <div><span class="k">Posted by</span><span class="v">${esc(d.uploadedBy || 'the office')}</span></div>
            <div><span class="k">Posted</span><span class="v">${esc(stamp(d.uploadedAt, true))}</span></div>
            <div><span class="k">Not signed</span><span class="v">${(g.outstanding || []).length}</span></div>
            ${printedCell(info)}
            ${d.archivedAt ? `<div><span class="k">Archived</span><span class="v">${esc(stamp(d.archivedAt, true))} — closed to signing</span></div>` : ''}
          </div>
          ${stmt.html}
          <h2 class="sec">Signed (${g.signed.length})</h2>
          ${g.signed.length ? `<table>
            <thead>
              <tr><th class="cap" colspan="4">${esc(d.title)} &middot; ${esc(weekLabel(d.weekOf))}</th></tr>
              <tr><th class="n">#</th><th>Name</th><th>Signed</th><th>Signature</th></tr>
            </thead>
            <tbody>${g.signed.map((s, i) => `
              <tr>
                <td class="n">${i + 1}</td>
                <td class="name"><b>${esc(s.fullName)}</b>${stmt.ref(s)}<small>${esc(s.username)}</small></td>
                <td class="when">${esc(stamp(s.signedAt, true))}</td>
                <td class="mark">${printMark(s)}</td>
              </tr>`).join('')}
            </tbody>
          </table>` : `<p class="none">Nobody has signed this document.</p>`}
          ${unsignedHTML(g)}
          ${printFoot()}
        </section>`;
    }

    function personHTML(g, s, info) {
      const d = g.document;
      const stmt = statementBlock([s], s.fullName);
      return `
        <section class="sheet">
          ${printHead(info, 'Safety acknowledgement record')}
          <h1>${esc(s.fullName)}</h1>
          <div class="meta">
            <div><span class="k">Document</span><span class="v">${esc(d.title)}</span></div>
            <div><span class="k">Week</span><span class="v">${esc(weekLabel(d.weekOf))}</span></div>
            <div><span class="k">Signed</span><span class="v">${esc(stamp(s.signedAt, true))}</span></div>
            <div><span class="k">Username</span><span class="v">${esc(s.username)}</span></div>
            <div><span class="k">File</span><span class="v">${esc(d.filename || '—')}</span></div>
            ${printedCell(info)}
          </div>
          ${stmt.html}
          <div class="person">
            <div class="line">${printMark(s)}</div>
            <div class="under">
              <span>Signature of ${esc(s.fullName)}</span>
              <span>${esc(stamp(s.signedAt, true))}</span>
            </div>
          </div>
          ${printFoot()}
        </section>`;
    }

    // Not signed is counted per document and never totalled: added up across
    // a month of forms it would count the same laborer once a week, and read
    // as a head count bigger than the crew.
    function contentsHTML(groups, skipped, info) {
      const total = groups.reduce((n, g) => n + g.signed.length, 0);
      const one   = skipped === 1;
      return `
        <section class="sheet">
          ${printHead(info, 'Safety sign-off report')}
          <h1>${esc(rangeLabel(groups.map(g => g.document.weekOf)))}</h1>
          <div class="meta">
            <div><span class="k">Documents</span><span class="v">${groups.length}</span></div>
            <div><span class="k">Signatures</span><span class="v">${total}</span></div>
            ${printedCell(info)}
          </div>
          <table>
            <thead><tr><th>Week of</th><th>Document</th><th class="num">Signatures</th><th class="num">Not signed</th></tr></thead>
            <tbody>${groups.map(g => `
              <tr>
                <td class="when">${esc(dayLabel(g.document.weekOf))}</td>
                <td>${esc(g.document.title)}${g.document.archivedAt ? ' <span class="none">(archived)</span>' : ''}</td>
                <td class="num">${g.signed.length}</td>
                <td class="num">${(g.outstanding || []).length}</td>
              </tr>`).join('')}
            </tbody>
          </table>
          ${skipped ? `<p class="none">${skipped} document${one ? '' : 's'} in this range
            ${one ? 'has' : 'have'} no signatures and nobody on the roster to sign ${one ? 'it' : 'them'},
            so ${one ? 'it is' : 'they are'} not included.</p>` : ''}
          ${printFoot()}
        </section>`;
    }

    /* The window is claimed inside the click, BEFORE anything is fetched. A
       pop-up opened after an await is no longer answering a click as far as
       Safari and Chrome are concerned, and they swallow it — the sheet somebody
       came here for would simply never appear. It is filled in once the reads
       land, the same way the job summary in kiewit-pinetree.html does it. */
    function openPrintWindow(what) {
      const w = window.open('', '_blank');
      if (!w) {
        toast('Your browser blocked the print window. Allow pop-ups for this site, then try again.', true);
        return null;
      }
      try {
        w.document.open();
        dwWrite(w, `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Preparing…</title></head>
          <body style="font:14px/1.5 system-ui,sans-serif;color:#475569;padding:28px">
          <p id="prep">Preparing ${esc(what)}…</p></body></html>`);
        w.document.close();
      } catch { /* not writable yet — the real write below still lands */ }
      return w;
    }

    function printProgress(w, text) {
      try { const el = w.document.getElementById('prep'); if (el) el.textContent = text; }
      catch { /* closed, or between documents */ }
    }

    function fillPrintWindow(w, title, body, css) {
      if (w.closed) return;   // they closed it while it was being prepared
      w.document.open();
      dwWrite(w, printShell(title, body, false, css));
      w.document.close();
      try { w.focus(); } catch { /* the browser's call */ }
    }

    function printFailed(w, err) {
      if (err === PRINT_CANCELLED) return;
      try { if (!w.closed) w.close(); } catch { /* already gone */ }
      toast('Could not build the printout: ' + err.message, true);
    }

    // fn over items, at most `limit` at a time, answers in the items' order.
    // The first failure stops the rest from starting.
    async function mapLimit(items, limit, fn) {
      const out = new Array(items.length);
      let next = 0, stop = false;
      async function worker() {
        while (!stop && next < items.length) {
          const i = next++;
          try { out[i] = await fn(items[i], i); }
          catch (err) { stop = true; throw err; }
        }
      }
      await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
      return out;
    }

    // A sheet has something to say when anybody is on either side of it. A form
    // nobody has signed yet still prints: the list of who owes it is then the
    // whole of what there is to know about it. Only a form with no signatures
    // AND nobody on the roster to sign it would come out blank.
    const hasNames = g => g.signed.length > 0 || (g.outstanding || []).length > 0;

    async function printDocument(id) {
      const g = (state.report || []).find(x => x.document.id === id);
      if (!g) return;
      if (!hasNames(g)) {
        return toast('Nobody has signed this one and nobody is on the roster to sign it, so there is nothing to print.', true);
      }
      if (printBusy) return toast('Still preparing the last printout…');
      const w = openPrintWindow('the sign-off sheet');
      if (!w) return;
      printBusy = true;
      try {
        const fresh = await fetchSignOff(id);
        if (!hasNames(fresh)) throw new Error('Nobody has signed this one and nobody is on the roster to sign it.');
        const d = fresh.document;
        fillPrintWindow(w, `${d.title} — sign-off sheet — week of ${d.weekOf}`, sheetHTML(fresh, printInfo()));
      } catch (err) {
        printFailed(w, err);
      } finally {
        printBusy = false;
      }
    }

    async function printSignature(id, username, signedAt) {
      if (printBusy) return toast('Still preparing the last printout…');
      const w = openPrintWindow('the signature record');
      if (!w) return;
      printBusy = true;
      try {
        const g = await fetchSignOff(id);
        const s = g.signed.find(x => x.username === username && String(x.signedAt) === String(signedAt));
        if (!s) throw new Error('That signature could not be found. Reload the report and try again.');
        fillPrintWindow(w, `${s.fullName} — ${g.document.title} — signed ${ymdOf(s.signedAt)}`,
          personHTML(g, s, printInfo()));
      } catch (err) {
        printFailed(w, err);
      } finally {
        printBusy = false;
      }
    }

    /* Print all's reads: every document in the report that has names on it,
       read fresh with its marks, in the order things happened. Shared with
       the copy Auto Reports sends (below), so the scheduled PDF is the one
       Print all makes. `hooks.beforeRead()` may throw to stop the rest;
       `hooks.afterRead(g)` sees each one read, and may hand back a
       replacement. Resolves to { kept, skipped, title }. */
    async function signOffReads(all, hooks) {
      const h = hooks || {};
      const fresh = await mapLimit(all.filter(hasNames), PRINT_READS_AT_ONCE, async g => {
        if (h.beforeRead) h.beforeRead();
        const got = await fetchSignOff(g.document.id);
        return h.afterRead ? (await h.afterRead(got)) || got : got;
      });
      const kept = fresh.filter(hasNames).sort(byWeek);
      if (!kept.length) throw new Error('Nothing in this range has been signed and nobody is on the roster to sign it.');
      const weeks = kept.map(g => g.document.weekOf).sort();
      const title = weeks[0] === weeks[weeks.length - 1]
        ? `Safety sign-offs — week of ${weeks[0]}`
        : `Safety sign-offs — ${weeks[0]} to ${weeks[weeks.length - 1]}`;
      return { kept, skipped: all.length - kept.length, title };
    }

    // A contents page for one document would be a page saying "see next page".
    function signOffBody(kept, skipped, info) {
      return (kept.length > 1 ? contentsHTML(kept, skipped, info) : '')
        + kept.map(g => sheetHTML(g, info)).join('');
    }

    async function printReport() {
      const all = state.report || [];
      const groups = all.filter(hasNames);
      if (!groups.length) {
        return toast(all.length
          ? 'Nothing in this range has been signed and nobody is on the roster to sign it, so there is nothing to print.'
          : 'Nothing to print yet.', true);
      }
      if (printBusy) return toast('Still preparing the last printout…');
      const n = groups.length;
      const w = openPrintWindow(n === 1 ? '1 document' : n + ' documents');
      if (!w) return;
      printBusy = true;
      try {
        let read = 0;
        const { kept, skipped, title } = await signOffReads(all, {
          beforeRead: () => { if (w.closed) throw PRINT_CANCELLED; },   // they gave up on it — stop reading
          afterRead:  () => {
            read++;
            printProgress(w, `Preparing ${n} document${n === 1 ? '' : 's'}… ${read} of ${n} read.`);
          },
        });
        fillPrintWindow(w, title, signOffBody(kept, skipped, printInfo()));
      } catch (err) {
        printFailed(w, err);
      } finally {
        printBusy = false;
      }
    }

    /* ═══════ Auto Reports ═══════ */
    /* Manage Users → Auto Reports sends the sign-off report on a timetable.
       The server opens this page in a headless browser, signed in as the
       safety supervisor who set the schedule up, and asks for the report
       through auto-report.js. This page has no Email button, so the report is
       Print all / PDF: the tab loaded for the weeks the schedule covers, each
       document read fresh, the same contents page and sheets — the PDF that
       arrives is the one Print all would have made with archived forms shown:
       archiving is how a supervisor closes out a week everyone has signed,
       and the record of that week is what the schedule is for. (An archived
       form nobody signed was taken down, not closed out, and is left out.)
       One more thing
       differs, for the email's sake: the drawn marks go at the size the sheet
       prints them, smaller still if that is too much for one email, and left
       out — saying so — if even that is. */
    (function registerAutoReports() {
      const AR = window.dwAutoReport;
      if (!AR) return;

      // td.mark holds a mark to 2.6in × 0.56in, 250 × 54 CSS pixels. Twice
      // that first, for a clean line on paper; then once, a month of a big
      // crew's marks at twice being more than one email carries. The pad
      // saves what the signer's screen drew — often six times as many pixels
      // across again.
      const MARK_SIZES = [{ w: 500, h: 108 }, { w: 250, h: 54 }];
      // The server takes 1.5 MB of report (MAX_HTML_BYTES in api/lib/email.js);
      // this leaves room for the DataWatch band stamped on after.
      const EMAIL_HTML_BYTES = 1400000;
      const bytes = html => new Blob([html]).size;

      function shrinkMark(src, box) {
        return new Promise(resolve => {
          if (!src || !PNG_MARK.test(src)) return resolve(src);
          const img = new Image();
          img.onload = () => {
            const k = Math.min(1, box.w / (img.naturalWidth || 1), box.h / (img.naturalHeight || 1));
            if (k >= 1) return resolve(src);
            const c = document.createElement('canvas');
            c.width  = Math.max(1, Math.round(img.naturalWidth * k));
            c.height = Math.max(1, Math.round(img.naturalHeight * k));
            const ctx = c.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, c.width, c.height);
            let out = src;
            try { out = c.toDataURL('image/png'); } catch (_) { out = src; }
            resolve(PNG_MARK.test(out) && out.length < src.length ? out : src);
          };
          img.onerror = () => resolve(src);
          img.src = src;
        });
      }

      // Copies, not edits: what fetchSignOff read also sits in the screen's
      // cache (state.detail), and the next size down starts from the original.
      async function withMarksAt(g, box) {
        const signed = [];
        for (const s of g.signed) {
          signed.push(Object.assign({}, s, { signatureImage: await shrinkMark(s.signatureImage, box) }));
        }
        return Object.assign({}, g, { signed });
      }
      // printMark() then reads "Drawn signature on file — could not be shown here".
      const withoutMarks = g => Object.assign({}, g, {
        signed: g.signed.map(s => Object.assign({}, s, { signatureImage: null })),
      });

      AR.register('safety_signoff', async spec => {
        // The weeks the schedule's days fall in — what From week / To week
        // make of the same dates.
        const from = mondayOf(spec.start), to = mondayOf(spec.end || spec.start);
        const span = rangeLabel([from, to]);
        const spanWords = span.charAt(0).toLowerCase() + span.slice(1);
        await loadReport({ from, to, archived: true });
        if (state.reportError) throw new Error('The sign-off report did not load — ' + state.reportError);
        // Archived with nobody's signature on it is a form taken down — posted
        // in error, or replaced — not a week closed out. Nobody can sign it
        // now, so it would only read as a crew that owes a signature.
        const withdrawn = (state.report || []).filter(g => g.document.archivedAt && !g.signed.length);
        const all = (state.report || []).filter(g => !withdrawn.includes(g));
        if (!all.length) {
          return { skip: withdrawn.length
            ? `Nothing to send for the ${spanWords}: ${withdrawn.length === 1 ? 'its one form was' : `all ${withdrawn.length} of its forms were`} archived before anyone signed.`
            : `No safety forms were posted for the ${spanWords}.` };
        }
        if (!all.some(hasNames)) {
          return { skip: `Nothing posted for the ${spanWords} has been signed, and nobody is on the Safety Center roster to sign it.` };
        }

        const { kept, skipped, title } = await signOffReads(all);
        const info = Object.assign(printInfo(), {
          by: 'Auto Reports for ' + ((user && user.username) || 'a safety supervisor'),
        });
        let html = '';
        for (const box of MARK_SIZES) {
          const sized = [];
          for (const g of kept) sized.push(await withMarksAt(g, box));
          html = printShell(title, signOffBody(sized, skipped, info), true);
          if (bytes(html) <= EMAIL_HTML_BYTES) break;
          html = '';
        }
        if (!html) {
          // The typed name and the tick are the signature; the marks stay in
          // the Safety Center, and Print all there still has them.
          html = printShell(title,
            `<p class="none">The drawn signatures are left out of this emailed copy: with them it is more than
              one email can carry. Print all / PDF on the Safety Center's Sign-Off Report tab has them.</p>`
            + signOffBody(kept.map(withoutMarks), skipped, info), true);
        }

        const one = kept.length === 1 ? kept[0] : null;
        const short = kept.filter(g => (g.outstanding || []).length > 0).length;
        const summary = one
          ? [
              // The email shows 60 characters of a figure; a title is up to 160.
              { label: 'Form',       value: one.document.title.length > 60 ? one.document.title.slice(0, 59) + '…' : one.document.title },
              { label: 'Week Of',    value: dayLabel(one.document.weekOf) },
              { label: 'Signed',     value: String(one.signed.length) },
              { label: 'Not Signed', value: String(one.outstanding.length), tone: one.outstanding.length ? 'bad' : 'good' },
            ]
          : [
              { label: 'Forms',        value: String(kept.length) },
              { label: 'Signatures',   value: String(kept.reduce((n, g) => n + g.signed.length, 0)) },
              { label: 'Fully Signed', value: `${kept.length - short} of ${kept.length}`, ...(short ? {} : { tone: 'good' }) },
              { label: 'Short of Signatures', value: String(short), ...(short ? { tone: 'bad' } : {}) },
            ];
        return { html, subject: `Safety Sign-Off Report — ${span}`, summary };
      });
    })();

    /* ═══════ Sign rate ═══════ */
    /* The sign-off report turned on its side: one row per person on the Safety
       Center roster, one column per form, and whether they signed it where the
       two meet. The percentage beside each name is the share of the range's
       forms that person has signed; the overall rate is every square at once —
       signatures collected over signatures expected.

       It is built in the page from the sign-off report's own read — the roster
       and who signed each form — so the two tabs cannot disagree: a column is
       green for exactly the people the sign-off report counts against that
       form, and red for exactly the ones it lists under Still to sign.

       Three rules decide what is counted, and the tab says all of them:
         - Archived forms are in. Archiving is how a supervisor closes a week
           out, and a rate that dropped each week once it was tidied away would
           only ever measure the forms still being chased — the ones most
           likely to be short. A form archived before anybody signed it was
           taken down rather than closed out, and stays out: the rule the
           emailed sign-off report applies.
         - A form a supervisor has left out is out. That is for the forms the
           archive rule cannot catch — posted to try the Safety Center out and
           signed by whoever was trying it — and it is a choice made on the
           tab, by name, stored on the form with who made it and when.
         - The roster is today's, as on the sign-off report. Everyone granted
           the Safety Center is counted against every form in the range,
           someone granted it last week included. */

    // Forms up to this many across set their titles upright on a wide screen.
    const RATE_FEW_DOCS = 6;

    // A share as a whole percent that never claims more than it is. 199 of
    // 200 rounds to a 100 that reads as "nothing to chase" while a square is
    // still red, and one signature in three hundred to a 0 that reads as
    // "nobody signed". Null when there is nothing to divide by.
    function pctOf(n, d) {
      if (!d) return null;
      if (n >= d) return 100;
      if (n <= 0) return 0;
      return Math.min(99, Math.max(1, Math.round((n / d) * 100)));
    }
    const pctText = p => (p == null ? '—' : p + '%');
    const plural  = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

    /* The grid, from one /safety-signatures?scope=report read. Forms run
       oldest to newest, left to right, as a calendar does; people come in the
       roster's own order. `at` is when the figures were read — the printout
       and the workbook carry it, since either can outlive the screen.

       `forms` is every form a supervisor can choose between, left-out ones
       included, so one can be put back; only the counted ones become `docs`,
       the grid's columns. The read itself is kept as `data`, so a form left
       out or put back redraws from it without reading every signature again. */
    function rateModel(data, at) {
      const all    = data.documents || [];
      const shown  = all.filter(g => !(g.document.archivedAt && !(g.signed || []).length)).sort(byWeek);
      const groups = shown.filter(g => !g.document.excludedFromRate);
      const onRoster = new Set((data.roster || []).map(r => r.userId));
      // Keyed by account: a signature whose login has since been removed has
      // no user id, and nobody on today's roster can be that person.
      const byDoc  = groups.map(g => new Map((g.signed || [])
        .filter(s => s.userId != null).map(s => [s.userId, s])));
      const people = (data.roster || []).map((r, i) => {
        const marks = byDoc.map(m => m.get(r.userId) || null);
        // The name they typed last, to put a person to a login.
        let latest = null;
        marks.forEach(s => {
          if (s && (!latest || Date.parse(s.signedAt) > Date.parse(latest.signedAt))) latest = s;
        });
        return {
          i, userId: r.userId, username: r.username,
          fullName: latest ? latest.fullName || '' : '',
          marks, signed: marks.filter(Boolean).length, expected: groups.length,
        };
      });
      const docs = groups.map((g, c) => ({
        doc: g.document,
        signed: people.reduce((n, p) => n + (p.marks[c] ? 1 : 0), 0),
        expected: people.length,
      }));
      return {
        data,
        at: at || new Date().toISOString(),
        docs, people,
        signed:     people.reduce((n, p) => n + p.signed, 0),
        expected:   people.length * docs.length,
        allSigned:  people.filter(p => p.expected && p.signed === p.expected).length,
        noneSigned: people.filter(p => p.expected && p.signed === 0).length,
        withdrawn:  all.length - shown.length,
        forms: shown.map(g => ({
          doc: g.document,
          signed: (g.signed || []).filter(s => s.userId != null && onRoster.has(s.userId)).length,
          expected: onRoster.size,
        })),
        leftOut: shown.filter(g => g.document.excludedFromRate).map(g => g.document),
      };
    }

    // The order the grid, the printout and the workbook all list people in.
    function ratePeople(m) {
      const byName = (a, b) => String(a.username).toLowerCase().localeCompare(String(b.username).toLowerCase());
      const share  = p => (p.expected ? p.signed / p.expected : -1);
      const list   = m.people.slice();
      if (state.rateSort === 'low')  return list.sort((a, b) => share(a) - share(b) || byName(a, b));
      if (state.rateSort === 'high') return list.sort((a, b) => share(b) - share(a) || byName(a, b));
      return list.sort(byName);
    }

    // The weeks a model covers, as a file name reads them.
    function rateFileStem(m) {
      const weeks = m.docs.map(d => d.doc.weekOf).sort();
      return weeks[0] === weeks[weeks.length - 1] ? weeks[0] : `${weeks[0]} to ${weeks[weeks.length - 1]}`;
    }

    // Every Apply takes a ticket, so a slow read of one range landing after
    // the read of the next cannot paint the old range over the new one.
    let rateSeq = 0;

    async function loadRate() {
      const seq = ++rateSeq;
      state.rateLoading = true; state.rateError = null; renderRate();
      const from  = (document.getElementById('rateFrom') || {}).value || '';
      const to    = (document.getElementById('rateTo')   || {}).value || '';
      const parts = ['scope=report', 'include=archived'];
      if (from) parts.push('from=' + encodeURIComponent(from));
      if (to)   parts.push('to=' + encodeURIComponent(to));
      try {
        const data = await api('GET', '/safety-signatures?' + parts.join('&'));
        if (seq !== rateSeq) return;
        state.rate = rateModel(data);
      } catch (err) {
        if (seq !== rateSeq) return;
        // Nothing left behind to export: Excel and Print would otherwise hand
        // out a range the screen no longer shows.
        state.rate = null;
        state.rateError = err.message;
      }
      state.rateLoading = false;
      renderRate();
    }

    // Built once, so a re-sort or a reload never clears the weeks somebody
    // has typed — or takes the focus out of the box they are typing in.
    function rateToolbarHTML() {
      return `
        <div class="form-card">
          <h2>Employee sign rate</h2>
          <div class="toolbar">
            <div class="row">
              <label for="rateFrom">From week</label>
              <input id="rateFrom" type="date" />
            </div>
            <div class="row">
              <label for="rateTo">To week</label>
              <input id="rateTo" type="date" />
            </div>
            <button class="btn btn-primary" onclick="loadRate()">Apply</button>
            <button class="btn btn-ghost" onclick="downloadRateXlsx()">Download Excel</button>
            <button class="btn btn-ghost" onclick="printRate()">Print / PDF</button>
          </div>
          <span class="fld-note">Everyone on the Safety Center roster today is counted against every form in the
            range, including archived forms — archiving closes a week out, it does not excuse it — and forms
            posted before they were added. Leave both weeks blank for every form posted.</span>
        </div>`;
    }

    function renderRate() {
      const el = document.getElementById('panelRate');
      hideRateTip();
      if (!canManage) {
        el.innerHTML = `<div class="empty">The sign rate report is for safety supervisors.</div>`;
        return;
      }
      if (!document.getElementById('rateBody')) el.innerHTML = rateToolbarHTML() + '<div id="rateBody"></div>';
      const body = document.getElementById('rateBody');
      const m = state.rate;
      body.classList.toggle('stale', Boolean(state.rateLoading && m));

      if (state.rateLoading && !m) {
        body.innerHTML = `<div class="empty">Loading the sign rate…</div>`;
      } else if (state.rateError) {
        body.innerHTML = `<div class="empty"><strong>Could not load the sign rate.</strong>${esc(state.rateError)}<br><br>
          <button class="btn btn-primary" onclick="loadRate()">Try again</button></div>`;
      } else if (!m) {
        body.innerHTML = '';
      } else if (!m.forms.length) {
        body.innerHTML = `<div class="empty"><strong>No forms in that range.</strong>
          Post a form on the Documents tab and it will show up here.</div>`;
      } else if (!m.people.length) {
        body.innerHTML = `<div class="empty"><strong>Nobody is on the Safety Center roster.</strong>
          Grant the division in Manage System and the people expected to sign will show up here.</div>`;
      } else if (!m.docs.length) {
        // Held open: the list is the only way back from here.
        body.innerHTML = rateFormsHTML(m, true) + `<div class="empty"><strong>Every form in this range is
          left out of the sign rate.</strong>Tick a form above to count it again.</div>`;
      } else {
        const old  = body.querySelector('.rate-scroll');
        const keep = old && m.drawn ? { x: old.scrollLeft, y: old.scrollTop } : null;
        body.innerHTML = rateSummaryHTML(m) + rateFormsHTML(m) + rateGridHTML(m);
        // A new range opens on its latest forms — on the right, where a
        // calendar puts them; a re-sort leaves the grid where it was.
        const sc = body.querySelector('.rate-scroll');
        if (sc) {
          sc.scrollLeft = keep ? keep.x : sc.scrollWidth;
          if (keep) sc.scrollTop = keep.y;
        }
        m.drawn = true;
      }
    }

    function rateSummaryHTML(m) {
      const p = pctOf(m.signed, m.expected);
      const n = m.people.length;
      const gone = m.withdrawn
        ? ` &middot; ${plural(m.withdrawn, 'form')} archived unsigned, not counted` : '';
      return `
        <div class="rate-sum">
          <div class="rate-hero">
            <span class="k">Overall sign rate</span>
            <div class="v">${pctText(p)}</div>
            <div class="bar"><span style="width:${p || 0}%"></span></div>
            <div class="s">${m.signed} of ${m.expected} signatures &middot; ${plural(n, 'employee')} &times; ${plural(m.docs.length, 'form')}</div>
          </div>
          <div class="rate-stats">
            <div class="rate-stat"><span class="k">Forms</span><span class="v">${m.docs.length}</span>
              <span class="s">${esc(rangeLabel(m.docs.map(d => d.doc.weekOf)))}${gone}</span></div>
            <div class="rate-stat"><span class="k">Signed every form</span><span class="v">${m.allSigned}</span>
              <span class="s">of ${plural(n, 'employee')}</span></div>
            <div class="rate-stat"><span class="k">Signed none</span><span class="v">${m.noneSigned}</span>
              <span class="s">of ${plural(n, 'employee')}</span></div>
          </div>
        </div>`;
    }

    /* Which forms count: every one in the range unless a supervisor has left
       it out — a form posted to try the Safety Center out, whose test
       signatures keep it in the rate even once it is archived. One line until
       it is wanted, and that line always says how many are left out, so a rate
       with weeks taken out of it never passes for one without. */
    function rateFormsHTML(m, forceOpen) {
      const open = forceOpen || state.rateFormsOpen;
      const out  = m.leftOut.length;
      const rows = m.forms.map(f => {
        const d = f.doc, left = Boolean(d.excludedFromRate);
        const why = left
          ? `Left out${d.rateExcludedBy ? ' by ' + esc(d.rateExcludedBy) : ''}${
              d.rateExcludedAt ? ', ' + esc(dayLabel(ymdOf(d.rateExcludedAt))) : ''}`
          : `${f.signed}/${f.expected} signed`;
        return `
          <li class="${left ? 'out' : ''}"><label>
            <input type="checkbox" data-act="rate-count" data-doc-id="${esc(d.id)}"${left ? '' : ' checked'} />
            <span class="ft">${esc(d.title)}</span>
            <span class="fw">${esc(weekLabel(d.weekOf))}</span>
            <span class="fc">${why}</span>
          </label></li>`;
      }).join('');
      return `
        <div class="rate-forms${open ? ' open' : ''}">
          <button class="rate-forms-head" type="button" data-act="rate-forms" aria-expanded="${open ? 'true' : 'false'}"${
            forceOpen ? ' disabled' : ''}>
            <span class="chev">&#9656;</span>
            <span class="k">Forms counted</span>
            <span class="v">${m.forms.length - out} of ${m.forms.length}${out ? ` &middot; ${out} left out` : ''}</span>
            ${forceOpen ? '' : `<span class="go">${open ? 'Done' : 'Choose forms'}</span>`}
          </button>
          ${open ? `
          <div class="rate-forms-body">
            <span class="fld-note">Untick a form to leave it out of the sign rate — one posted to try the Safety
              Center out, say. It stays on the Sign-Off Report, and every signature on it is kept.</span>
            <ul class="rate-forms-list">${rows}</ul>
          </div>` : ''}
        </div>`;
    }

    // Leave a form out of the sign rate, or count it again. What the server
    // answers is what gets drawn: the flag lands on the form in the read the
    // grid was built from, and the grid is rebuilt from that — the signatures
    // need no second read for a choice that changes none of them.
    async function setFormCounted(id, counted, box) {
      const m = state.rate;
      const g = m && (m.data.documents || []).find(x => x.document.id === id);
      if (!g) return;
      box.disabled = true;
      try {
        const out = await api('PUT', '/safety-documents?id=' + encodeURIComponent(id), { excludeFromRate: !counted });
        const d = out.document || {};
        Object.assign(g.document, {
          excludedFromRate: Boolean(d.excludedFromRate),
          rateExcludedAt:   d.rateExcludedAt || null,
          rateExcludedBy:   d.rateExcludedBy || null,
        });
        toast(d.excludedFromRate ? 'Left out of the sign rate.' : 'Counted in the sign rate again.');
        // Another range landed while this was saving, read before the flag
        // was stored, perhaps: read it again rather than redraw a stale one.
        if (state.rate !== m) return loadRate();
        state.rate = rateModel(m.data, m.at);
        state.rate.drawn = m.drawn;
        renderRate();
      } catch (err) {
        // Back to what the server still holds.
        box.checked = !counted;
        box.disabled = false;
        toast(err.message, true);
      }
    }

    function rateGridHTML(m) {
      const byName = state.rateSort === 'name';
      const arrow  = state.rateSort === 'high' ? ' ▼' : ' ▲';
      const sorted = on => (!on ? 'none' : state.rateSort === 'high' ? 'descending' : 'ascending');
      const head = `
        <tr>
          <th class="emp" scope="col" aria-sort="${sorted(byName)}"><button class="sort-btn${byName ? ' on' : ''}"
              data-act="rate-sort" data-sort="name" title="Sort by name">Employee${byName ? ' ▲' : ''}</button></th>
          <th class="pct" scope="col" aria-sort="${sorted(!byName)}"><button class="sort-btn${byName ? '' : ' on'}"
              data-act="rate-sort" data-sort="rate" title="Sort by sign rate">Rate${byName ? '' : arrow}</button></th>
          ${m.docs.map((d, c) => `<th class="doc" scope="col" data-c="${c}"><div class="dh"><span class="dt">${
            esc(d.doc.title)}</span><span class="dw">${esc(weekLabel(d.doc.weekOf))}</span></div></th>`).join('')}
        </tr>`;
      const rows = ratePeople(m).map(p => {
        const pc = pctOf(p.signed, p.expected);
        return `
        <tr>
          <th class="emp" scope="row"><span class="u">${esc(p.username)}</span>${
            p.fullName ? `<span class="f">${esc(p.fullName)}</span>` : ''}</th>
          <td class="pct"><span class="pl"><span class="n">${p.signed}/${p.expected}</span><span class="p">${pctText(pc)}</span></span><span class="meter"><i style="width:${pc || 0}%"></i></span></td>
          ${p.marks.map((s, c) => `<td class="c" data-r="${p.i}" data-c="${c}"><span class="sq ${s ? 'yes' : 'no'}" role="img" aria-label="${
            s ? 'Signed' : 'Not signed'}"></span></td>`).join('')}
        </tr>`;
      }).join('');
      const foot = `
        <tr>
          <th class="emp" scope="row">Form sign rate</th>
          <td class="pct">${pctText(pctOf(m.signed, m.expected))}</td>
          ${m.docs.map((d, c) => `<td class="fr" data-c="${c}">${pctText(pctOf(d.signed, d.expected))}</td>`).join('')}
        </tr>`;
      return `
        <div class="rate-card">
          <div class="rate-legend">
            <span class="key"><span class="sq yes" aria-hidden="true"></span>Signed</span>
            <span class="key"><span class="sq no" aria-hidden="true"></span>Not signed</span>
            <span class="hint">Hover or tap a square for who, which form and when.</span>
          </div>
          <div class="rate-scroll">
            <table class="rate-grid${m.docs.length <= RATE_FEW_DOCS ? ' few' : ''}"
                   aria-label="Sign rate: a row for each employee, a column for each form, signed or not signed where they meet">
              <thead>${head}</thead>
              <tbody>${rows}</tbody>
              <tfoot>${foot}</tfoot>
            </table>
          </div>
        </div>`;
    }

    /* ── The tooltip ── */
    /* A hover on a mouse; a tap on a phone, which has no hover. It adds the
       time and the typed name and nothing the grid needs it for: the grid is
       a real table, and a screen reader reads each square as Signed or Not
       signed under its form and beside its person. */
    let rateTipFor = null;
    let rateLastPointer = 'mouse';

    function rateTipLines(cell) {
      const m = state.rate;
      const c = Number(cell.getAttribute('data-c'));
      const d = m && m.docs[c];
      if (!d) return null;
      const lines = [];
      if (cell.hasAttribute('data-r')) {
        const p = m.people[Number(cell.getAttribute('data-r'))];
        if (!p) return null;
        const s = p.marks[c];
        lines.push({ t: s ? 'Signed ' + stamp(s.signedAt) : 'Not signed', strong: true });
        lines.push({ t: p.username + (s && s.fullName ? ' — signed as ' + s.fullName : ''), cls: 'who' });
      } else {
        lines.push({ t: `${d.signed} of ${d.expected} signed · ${pctText(pctOf(d.signed, d.expected))}`, strong: true });
      }
      lines.push({ t: d.doc.title, cls: 'who' });
      lines.push({ t: weekLabel(d.doc.weekOf) + (d.doc.archivedAt ? ' · archived' : '') });
      return lines;
    }

    function showRateTip(cell) {
      const tip   = document.getElementById('rateTip');
      const lines = tip && cell ? rateTipLines(cell) : null;
      if (!lines) return hideRateTip();
      tip.textContent = '';
      lines.forEach(l => {
        const el = document.createElement(l.strong ? 'strong' : 'span');
        if (l.cls) el.className = l.cls;
        el.textContent = l.t;
        tip.appendChild(el);
      });
      if (rateTipFor && rateTipFor !== cell) rateTipFor.classList.remove('tipped');
      rateTipFor = cell;
      cell.classList.add('tipped');
      tip.hidden = false;
      // Above the square where it fits, below where it does not, and never
      // off either side of the screen.
      const r = cell.getBoundingClientRect();
      const left  = r.left + r.width / 2 - tip.offsetWidth / 2;
      const above = r.top - tip.offsetHeight - 8;
      tip.style.left = Math.max(8, Math.min(left, window.innerWidth - tip.offsetWidth - 8)) + 'px';
      tip.style.top  = (above >= 8 ? above : r.bottom + 8) + 'px';
    }

    function hideRateTip() {
      const tip = document.getElementById('rateTip');
      if (tip) tip.hidden = true;
      if (rateTipFor) rateTipFor.classList.remove('tipped');
      rateTipFor = null;
    }

    /* ── Print / PDF ── */
    /* The grid on landscape pages, the overall rate on the first. A page holds
       about thirty forms across; more continue on further pages, each with the
       names and rates down its side again, so no square on paper is without a
       person. A long roster runs down the page and repeats the column heads on
       every sheet of it. It prints what the screen shows — the same range, in
       the same order — and says when those figures were read.

       Twenty-eight is what fits: the number, name and rate columns take 3in of
       the 10.2in a landscape page prints, and a form's column a quarter inch. */
    const RATE_PRINT_COLS = 28;

    // How the figures are counted, under the legend on the first page — read
    // before the grid rather than after it, and never a page of its own when
    // the last table happens to end at the foot of one.
    function rateNoteHTML(m) {
      const one = m.withdrawn === 1;
      return `<p class="rnote">Green squares are signed, red squares are not. Everyone on the Safety Center roster
        when these figures were read is counted against every form in the range, archived forms included${m.withdrawn
          ? ` — ${plural(m.withdrawn, 'form')} archived before anyone signed ${one ? 'it is' : 'them are'} left out` : ''}.
        ${m.leftOut.length ? `Left out of the rate by a safety supervisor: ${m.leftOut.map(d =>
          `${esc(d.title)} (${esc(weekLabel(d.weekOf))})`).join(', ')}.` : ''}
        Each person's rate is the share of those forms they have signed; the overall rate is every signature
        collected over every one expected. Signatures are collected electronically in the DataWatch Safety Center.</p>`;
    }

    function rateSheetsHTML(m, info) {
      const people = ratePeople(m);
      const p      = pctOf(m.signed, m.expected);
      const few    = m.docs.length <= RATE_FEW_DOCS;
      const key    = `<div class="key"><span><i class="sq yes"></i>Signed</span><span><i class="sq no"></i>Not signed</span></div>`;
      const spans  = [];
      for (let a = 0; a < m.docs.length; a += RATE_PRINT_COLS) spans.push([a, Math.min(m.docs.length, a + RATE_PRINT_COLS)]);

      return spans.map(([a, b], k) => {
        const cols = m.docs.slice(a, b);
        const top = k === 0
          ? `<h1>${esc(rangeLabel(m.docs.map(d => d.doc.weekOf)))}</h1>
             <div class="rsum">
               <div class="hero"><span class="k">Overall sign rate</span><span class="big">${pctText(p)}</span>
